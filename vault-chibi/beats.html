  vy.addColorStop(0, 'rgba(0,0,0,.97)');            // only wisps clear the lip
  vy.addColorStop(0.13, 'rgba(0,0,0,.34)');
  vy.addColorStop(0.30, 'rgba(0,0,0,0)');
  vy.addColorStop(0.46, 'rgba(0,0,0,0)');
  vy.addColorStop(0.74, 'rgba(0,0,0,.55)');
  vy.addColorStop(1, 'rgba(0,0,0,1)');              // dissolves into open air
  g.fillStyle = vy; g.fillRect(0, 0, cw, ch);
  g.globalCompositeOperation = 'source-over';
  return o;
}

/* WHERE A PLATE'S FEET ACTUALLY ARE - MEASURED PER CELL.
   Two separate things kept the cast hovering. First, a run strip is ONE shared
   crop over six cells whose bodies bob, so a single pad for the whole strip
   plants only the lowest cell and every other frame floats by its own margin:
   the pad has to be per cell. Second, the scan took the lowest opaque ROW,
   which found a tail tip or a trailing flame rather than the feet, and
   returned ~0 - which is why the first version of this measured "planted" on
   a build that visibly was not. Both are fixed below, cached per (plate,
   cell), so the art tells the renderer where its own feet are. */
const FOOT = {};
function footPad(im, cell, cells) {
  if (!ok(im)) return 0;
  cells = cells || 1; cell = cell || 0;
  const key = im.src + '#' + cell + '/' + cells;
  if (FOOT[key] !== undefined) return FOOT[key];
  FOOT[key] = 0;                                   // safe default if it throws
  try {
    const srcW = im.naturalWidth / cells;
    const W0 = Math.max(8, Math.min(200, Math.round(srcW)));
    const H0 = Math.max(8, Math.round(im.naturalHeight * W0 / srcW));
    const c = document.createElement('canvas');
    c.width = W0; c.height = H0;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.clearRect(0, 0, W0, H0);
    g.drawImage(im, cell * srcW, 0, srcW, im.naturalHeight, 0, 0, W0, H0);
    const d = g.getImageData(0, 0, W0, H0).data;
    const rows = new Array(H0); let widest = 0;
    for (let y = 0; y < H0; y++) {
      let n = 0;
      for (let x = 0; x < W0; x++) if (d[(y * W0 + x) * 4 + 3] > 16) n++;
      rows[y] = n; if (n > widest) widest = n;
    }
    /* THE STANCE LINE, NOT THE LAST STRAY PIXEL. Taking the lowest opaque row
       put the "feet" on a trailing tail tip - a few pixels wide, hanging below
       the actual stance - so the body still floated while the scan reported it
       planted. The feet are the lowest row that is
       a decent fraction of the widest part of the silhouette. */
    const thresh = Math.max(2, widest * 0.22);
    let stance = H0 - 1;
    for (let y = H0 - 1; y >= 0; y--) if (rows[y] >= thresh) { stance = y; break; }
    FOOT[key] = (H0 - 1 - stance) / H0;
  } catch (e) { FOOT[key] = 0; }
  return FOOT[key];
}
/* ONE PAD FOR A STRIP THAT WAS SHOT, NOT DRAWN.
   footPad above measures every cell separately, and it has to: the old plates
   were separate drawings, each framed on its own, so the only way to plant
   them was to ask each one where its feet were.

   The new cast is cut out of video shot on a LOCKED camera and cropped through
   ONE rectangle at fixed pixel coordinates, so the cells are already in true
   vertical register with each other - the difference between the lowest frame
   and the highest IS the bob of the run and the arc of the jump. Measuring
   those cells one at a time would read that motion as framing error and
   flatten it: every cell would get shoved down until its own lowest pixel sat
   on the floor, so the feet would stay welded to the ground and the body would
   never leave it. The jump in particular would stop being a jump.

   So a shot strip gets ONE pad, taken from its LOWEST cell - the frame where
   he is actually standing on something. That plants the contact frame and lets
   every other frame ride above the floor by exactly as much as it did in the
   footage. */
const STANCE = {};
function stancePad(im, cells) {
  if (!ok(im)) return 0;
  cells = cells || 1;
  const key = im.src + '#strip/' + cells;
  if (STANCE[key] !== undefined) return STANCE[key];
  let lo = 1;
  for (let i = 0; i < cells; i++) lo = Math.min(lo, footPad(im, i, cells));
  STANCE[key] = lo;
  return lo;
}

/* Cell counts. Every strip is cut to the smallest number of frames that still
   reads as motion, measured as the minimum delta between CONSECUTIVE cells -
   the run and the cheer carry a full cycle so they get eight, the one-shots
   are six. */
const RUNCELLS = 8;
/* THE CHEER IS PER CHARACTER, IN BOTH LENGTH AND TEMPO.
   A strip carries an implied duration: it was cut from N frames of 24fps
   footage, so it wants to be played back over exactly that long. One global
   rate for all three ignored that, and the error was not small - CORLI's
   celebration covers 1.25 SECONDS of source and was being played over 0.67,
   which is 1.9x too fast. That is what "super spazzy" was. The same constant
   ran TIBBO and MOSKA at roughly half the speed they were performed at.

   The three of them also do not celebrate for the same length of time, and
   forcing them to share a cell count meant taking a worse window for somebody:
   MOSKA has one clean five-cell bounce and no good eight-cell one, and cutting
   him to five is what got his loop to stop snapping (his old strip closed on a
   95% jump from last cell back to first - a cut, once per cycle, forever).

   So each of them gets the cell count its footage actually supports and the
   rate its own frames were shot at. */
const CHEER = {
  tibbo: { cells: 8, fps: 10.7 },   // 18 source frames
  moska: { cells: 5, fps: 8.6 },    // 14
  corli: { cells: 6, fps: 6.9 },    // 21
};
/* CORLI was re-cut a second time, and the first fix was only half of it. The
   speed was wrong - 1.9x too fast - but so was the WINDOW: her old eight cells
   spanned a whole performance, cheer through to arms-down-standing, so looping
   it snapped her from a rest pose back to a full celebration once a cycle. The
   deltas never caught it because they were even the whole way round; a reset
   like that is a content problem, not a pixel-difference one. These six come
   out of a stretch where she is celebrating continuously, so there is nothing
   to snap back FROM. */
function cheerOf(id) { return CHEER[id] || { cells: 8, fps: 10.0 }; }
/* Five, not six: the strip was shot with an anticipation crouch at the front
   and the sim has no anticipation - a jump here begins the instant it is
   decided - so that cell would never have been reachable. It was cut off the
   asset rather than left in as a frame nothing can ever select. */
const JUMPCELLS = 5;
const CAUGHTCELLS = 6;
/* Four. Six cells of a catch measured 15-30% between neighbours; the same
   clips cut to four measure 29-63%. Same finding as the run and the breath -
   match the cell count to the motion that is actually in the footage. */
const CATCHCELLS = 4;
const SPINCELLS = 8;     // one full turn of the coin
const PILECELLS = 4;     // scatter, mound, heap, hoard
/* Ground distance per run cell. The strip went from six cells to eight over
   the same stride, so the distance each cell covers has to shrink in step or
   the cadence changes and the feet skate: 78 units per cycle, unchanged. */
const RUN_STEP = 78 / RUNCELLS;
const BUGCELLS = 6;      // SKARN scuttle  (min consecutive frame delta 27.9%)
const SQUASHCELLS = 4;   // SKARN stomped   (22.1%)
const FLYCELLS = 4;      // VYRE wingbeat   (42.7%)
const DIVECELLS = 4;     // VYRE wind-up and dive (85.2%)

/* ------------------------------- rendering -------------------------------- */
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
/* ZOOMED OUT TO FIT THREE ROADS. At 1.86 the frame held 231 world units and
   the sunken lane at 236 was simply off the bottom of it. 1.45 holds 297,
   which puts the high deck at 96 and the tunnel floor at 236 both comfortably
   in shot - and seeing all three at once is the entire point of the split. */
const SCALE = 1.45, VIEW_W = cv.width / SCALE, VIEW_TOP = -34;
loadArt();

function draw(W) {
  const cam = W.cam;
  /* THE TEMPLE, not a blue sky. The far and mid plates were generated in
     earlier sessions and are horizontally tileable; they scroll at 0.22x and
     0.55x so the chamber has depth behind the play plane. */
  if (ok(ART.farBg)) {
    const im = ART.farBg;
    const H = cv.height * 0.94, W2 = im.naturalWidth * H / im.naturalHeight;
    let x = -((cam.x * 0.22) % W2);
    while (x < cv.width) { cx.drawImage(im, x, 0, W2, H); x += W2 - 1; }
    cx.fillStyle = 'rgba(58,38,22,.26)'; cx.fillRect(0, 0, cv.width, cv.height);
  } else {
    cx.fillStyle = '#C9A97C'; cx.fillRect(0, 0, cv.width, cv.height);
  }
  if (ok(ART.midBg)) {
    const im = ART.midBg;
    const H = cv.height * 0.80, W2 = im.naturalWidth * H / im.naturalHeight;
    let x = -((cam.x * 0.55) % W2);
    cx.globalAlpha = 0.92;
    while (x < cv.width) { cx.drawImage(im, x, cv.height * 0.08, W2, H); x += W2 - 1; }
    cx.globalAlpha = 1;
  }
  const shaft = cx.createLinearGradient(cv.width * 0.34, 0, cv.width * 0.62, cv.height);
  shaft.addColorStop(0, 'rgba(255,226,150,.20)');
  shaft.addColorStop(1, 'rgba(255,226,150,0)');
  cx.fillStyle = shaft; cx.fillRect(0, 0, cv.width, cv.height);
  const vig = cx.createRadialGradient(cv.width / 2, cv.height * 0.52, cv.height * 0.30,
    cv.width / 2, cv.height * 0.52, cv.height * 0.98);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(24,12,4,.44)');
  cx.fillStyle = vig; cx.fillRect(0, 0, cv.width, cv.height);

  cx.save();
  /* screen shake, applied to the PLAY PLANE only so the chrome stays put */
  if (W.shake > 0) {
    const a = W.shake;
    cx.translate((((W.simT * 91) % 2) - 1) * a * 1.7, (((W.simT * 143) % 2) - 1) * a * 1.3);
  }
  cx.scale(SCALE, SCALE);
  cx.translate(-cam.x, -VIEW_TOP);

  /* THE SUNKEN LANE IS A CARVED PASSAGE, NOT A PLANK IN THE VOID.
     The lower road was a thin stone slab floating in open sky: nothing above
     it, nothing behind it, so a runner down there read as falling past the
     level rather than travelling through it. A tunnel needs three things the
     slab alone cannot give - a CEILING (the underside of the ground he was
     walking on a moment ago), a BACK WALL to sit against, and darkness that
     deepens away from the mouth. Drawn before the pits, so that looking down
     a hole in the ground you see into this passage, which is exactly what is
     actually under there. */
  (function () {
    const x0 = LOW_RUN[0][0], x1 = LOW_RUN[LOW_RUN.length - 1][1];
    const ceil = FLOOR_Y + 10;                 // underside of the ground slab
    const base = LOW_Y + 20;
    const g = cx.createLinearGradient(0, ceil, 0, base);
    g.addColorStop(0, '#231508');
    g.addColorStop(0.42, '#3B2714');
    g.addColorStop(1, '#1B1006');
    cx.fillStyle = g;
    cx.fillRect(x0, ceil, x1 - x0, base - ceil);

    /* ribs down the back wall, so travelling through it reads as motion */
    cx.fillStyle = 'rgba(92,64,32,.30)';
    for (let gx = Math.ceil(x0 / 96) * 96; gx < x1; gx += 96)
      cx.fillRect(gx, ceil + 6, 10, base - ceil - 6);

    /* the ceiling: a lit lip where the ground ends, then its shadow */
    cx.fillStyle = '#6B4C2A'; cx.fillRect(x0, ceil, x1 - x0, 4);
    cx.fillStyle = 'rgba(210,170,110,.35)'; cx.fillRect(x0, ceil, x1 - x0, 1.4);
    const sh = cx.createLinearGradient(0, ceil + 4, 0, ceil + 26);
    sh.addColorStop(0, 'rgba(12,6,2,.72)'); sh.addColorStop(1, 'rgba(12,6,2,0)');
    cx.fillStyle = sh; cx.fillRect(x0, ceil + 4, x1 - x0, 22);

    /* and the mouths: the passage fades in at both ends instead of starting
       with a hard vertical seam against the backdrop */
    const capL = cx.createLinearGradient(x0, 0, x0 + 46, 0);
    capL.addColorStop(0, 'rgba(20,12,5,.95)'); capL.addColorStop(1, 'rgba(20,12,5,0)');
    cx.fillStyle = capL; cx.fillRect(x0, ceil, 46, base - ceil);
    const capR = cx.createLinearGradient(x1 - 46, 0, x1, 0);
    capR.addColorStop(0, 'rgba(20,12,5,0)'); capR.addColorStop(1, 'rgba(20,12,5,.95)');
    cx.fillStyle = capR; cx.fillRect(x1 - 46, ceil, 46, base - ceil);
  })();

  /* THE PITS ARE MIASMA, NOT A BLACK WALL.
     A flat #160A10 rectangle is a hole in the RENDER, not a hole in the world -
     it has no depth, no motion, and nothing about it says "this will kill you".
     Two painted layers now fill it, both SCREEN-blended so the black they were
     generated on contributes nothing and only the gas survives: a dense bank
     drifting slowly, and thin wisps drifting three times faster over the top.
     Two speeds is what makes it read as a volume rather than a texture.
     The clip runs 20 units ABOVE the lip so the gas spills out of the mouth,
     and because the ground solids are drawn after this, the spill is masked
     everywhere except over the hole itself - which is exactly where gas
     escaping a pit should be. */
  for (const s of PROFILE) {
    if (s.top !== null) continue;
    const x0 = s.x0, x1 = s.x1, top = FLOOR_Y - 1, depth = 130;
    /* the beat-3 trap is the one that kills, so it gets the thickest gas; the
       fork and the merge are passages and only smoke faintly. */
    const thick = s.id === 'TRAP' ? 1 : 0.46;
    /* NO DARK SHAFT. A 130-deep opaque rectangle was a purple BOX standing on
       the backdrop with hard sides and a hard bottom - the ground slab is only
       10 units thick, so a hole in it is a cut edge and then open air, not a
       mine shaft. What is left is the cut itself, fading out within ~34 units,
       and after that only gas. */
    /* only the cut through the slab itself - the shadowed underside of the
       ten units of stone the hole is punched through, and nothing below it */
    /* TRANSLUCENT, NOT OPAQUE. The sunlit temple showing through a gap made
       the hole the BRIGHTEST thing in the shot, which is the opposite of what
       a pit should say. A tint sunk over it keeps the see-through - you can
       still read the pillars behind - while putting the opening back in shade,
       and the cut through the slab is now a soft edge rather than a bar. */
    const g = cx.createLinearGradient(0, top, 0, top + 74);
    g.addColorStop(0, 'rgba(14,6,16,.62)');
    g.addColorStop(0.22, 'rgba(12,5,14,.46)');
    g.addColorStop(1, 'rgba(10,4,12,.10)');
    cx.fillStyle = g; cx.fillRect(x0, top, x1 - x0, 74);
    const gh = 96;
    const buf = pitGas(s.id || ('p' + x0), x1 - x0, gh, W.simT, thick);
    cx.save();
    cx.globalCompositeOperation = 'screen';
    cx.drawImage(buf, x0, top - 9, x1 - x0, gh);
    cx.restore();
    /* NO INNER VIGNETTE, AND NO DARK FILL. Both were attempts to make the
       opening look deep, and both made it worse for the same reason: a gap in
       a floor is a place where you SEE THROUGH to what is behind, and the one
       thing that cannot read as a hole is an opaque box sitting in the hole.
       The temple behind shows through exactly as it does everywhere else, the
       floor simply stops, and the gas is the only thing added. */
    /* a hard dark lip, so the ground edge stays crisp against the gas */
    cx.fillStyle = 'rgba(14,6,10,.9)';
    cx.fillRect(x0, top, x1 - x0, 2.5);
  }

  for (const s of W.solids) {
    if (s.kind === 'bedrock' || s.kind === 'block') continue;
    const h = Math.min(s.y1, 250) - s.y0;
    if (s.kind === 'pitfloor') {
      /* INVISIBLE ON PURPOSE. This solid only exists so a body that falls in
         stops somewhere it still reads in frame instead of dropping out of
         shot; drawn, it was a lit shelf hanging in the middle of the gas with
         nothing holding it up. The gas is what the pit looks like. */
      continue;
    }
    if (s.kind === 'wall') continue;   // invisible: it only exists to stop a
                                       // human player running off the level
    if (ok(ART.floor)) {
      /* A SHALLOWER, DARKER FLOOR. Tiled at 74 tall and untinted it filled the
         bottom third of the frame with pale sandstone and competed with the
         cast for attention - the brightest thing on screen has to be the
         character, not the ground he is standing on. */
      const im = ART.floor, TH = 46, TW = im.naturalWidth * TH / im.naturalHeight;
      cx.save();
      cx.beginPath(); cx.rect(s.x0, s.y0, s.x1 - s.x0, h); cx.clip();
      let x = s.x0 - (((s.x0 % TW) + TW) % TW);
      while (x < s.x1) { cx.drawImage(im, x, s.y0, TW, TH); x += TW - 1; }
      if (h > TH) { cx.fillStyle = '#3B2814'; cx.fillRect(s.x0, s.y0 + TH - 1, s.x1 - s.x0, h - TH + 1); }
      /* push it back behind the cast and let it fall away into shadow */
      const gy = cx.createLinearGradient(0, s.y0, 0, s.y0 + Math.min(h, 92));
      gy.addColorStop(0, 'rgba(46,26,10,.20)');
      gy.addColorStop(1, 'rgba(28,14,4,.86)');
      cx.fillStyle = gy; cx.fillRect(s.x0, s.y0, s.x1 - s.x0, Math.min(h, 92));
      cx.restore();
    } else {
      cx.fillStyle = '#7A5630'; cx.fillRect(s.x0, s.y0, s.x1 - s.x0, h);
    }
    if (s.kind === 'deck') {
      /* A WALKWAY IS HELD UP BY SOMETHING. Drawn as a bare 16-unit slab the
         high road was a plank hanging in mid-air; it gets corbels under it and
         a shadow on its underside so it reads as built into the temple. */
      const wD = s.x1 - s.x0;
      cx.fillStyle = 'rgba(24,13,5,.55)';
      for (let bx = s.x0 + 14; bx < s.x1 - 10; bx += 58) {
        cx.beginPath();
        cx.moveTo(bx, s.y1); cx.lineTo(bx + 16, s.y1);
        cx.lineTo(bx + 11, s.y1 + 17); cx.lineTo(bx + 5, s.y1 + 17);
        cx.closePath(); cx.fill();
      }
      const und = cx.createLinearGradient(0, s.y1, 0, s.y1 + 14);
      und.addColorStop(0, 'rgba(18,10,4,.70)'); und.addColorStop(1, 'rgba(18,10,4,0)');
      cx.fillStyle = und; cx.fillRect(s.x0, s.y1, wD, 14);
    }
    if (s.kind === 'deck' || s.kind === 'plinth' || s.kind === 'lowfloor') {
      /* LANE GEOMETRY. The upper deck and the sunken floor are their own
         built stone - a capstone with a lit edge over a darker mass - so at a
         glance you can see there are three roads and which one each runner
         took. */
      const w = s.x1 - s.x0, hh = s.y1 - s.y0;
      cx.fillStyle = 'rgba(26,14,6,.5)'; cx.fillRect(s.x0 + 2, s.y0 + 4, w, hh);
      cx.fillStyle = s.kind === 'lowfloor' ? '#6E5433' : '#8E6B41';
      cx.fillRect(s.x0, s.y0, w, hh);
      cx.fillStyle = 'rgba(56,33,14,.5)';
      for (let gx = s.x0 + 8; gx < s.x1 - 4; gx += 15) cx.fillRect(gx, s.y0 + 5, 2, hh - 6);
      cx.fillStyle = '#B08E5C'; cx.fillRect(s.x0, s.y0, w, 5);
      cx.fillStyle = '#E6C48E'; cx.fillRect(s.x0, s.y0, w, 1.8);
      cx.strokeStyle = 'rgba(30,17,6,.8)'; cx.lineWidth = 1.4;
      cx.strokeRect(s.x0, s.y0, w, hh);
      continue;
    }
    if (s.kind === 'pipe' || s.kind === 'ledge') {
      /* A RAISED BLOCK IS A CARVED PLINTH, not a rectangle of the same floor
         texture with a hairline around it - drawn that way it read as a pale
         slab pasted over the level. It gets its own darker stone, a capstone
         that overhangs, and vertical grooves, so it reads as something built
         and something you can stand on. */
      const w = s.x1 - s.x0, hh = Math.min(h, 76);
      cx.fillStyle = 'rgba(30,17,7,.42)'; cx.fillRect(s.x0, s.y0 + 6, w, hh - 6);
      cx.fillStyle = '#8E6B41'; cx.fillRect(s.x0 + 2, s.y0 + 7, w - 4, hh - 7);
      cx.fillStyle = 'rgba(56,33,14,.55)';
      for (let gx = s.x0 + 9; gx < s.x1 - 5; gx += 13) cx.fillRect(gx, s.y0 + 11, 2.2, hh - 13);
      cx.fillStyle = '#B08E5C'; cx.fillRect(s.x0 - 3, s.y0, w + 6, 8);      // capstone
      cx.fillStyle = '#E0BE86'; cx.fillRect(s.x0 - 3, s.y0, w + 6, 2.2);    // lit top edge
      cx.fillStyle = 'rgba(40,22,8,.6)'; cx.fillRect(s.x0 - 3, s.y0 + 8, w + 6, 2);
      cx.strokeStyle = 'rgba(34,19,7,.8)'; cx.lineWidth = 1.5;
      cx.strokeRect(s.x0 - 3, s.y0, w + 6, 8);
    } else {
      /* the carved lip: the line the eye reads as "stand here" from a moving
         camera (session 22, decision 169). Warm, not white. */
      cx.fillStyle = '#C9A063'; cx.fillRect(s.x0, s.y0, s.x1 - s.x0, 1.8);
      cx.fillStyle = 'rgba(52,28,10,.6)'; cx.fillRect(s.x0, s.y0 + 1.8, s.x1 - s.x0, 1.4);
    }
  }

  for (const b of W.blocks) {
    const y = SOFFIT - BLOCK_H - b.bump * 7;
    if (ok(ART.block)) {
      const w = BLOCK_W + 7, hh = w * ART.block.naturalHeight / ART.block.naturalWidth;
      cx.save();
      if (b.spent) { cx.globalAlpha = 0.6; cx.filter = 'grayscale(0.8)'; }
      cx.drawImage(ART.block, b.x - 3.5, y - (hh - BLOCK_H) / 2, w, hh);
      cx.restore();
    } else {
      cx.fillStyle = b.spent ? '#8A6238' : '#E0A83C';
      cx.fillRect(b.x, y, BLOCK_W, BLOCK_H);
    }
  }

  for (const c of W.coins) {
    if (c.taken && !c.pop) continue;
    cx.globalAlpha = c.taken ? Math.max(0, c.pop / 0.4) : 1;
    if (ok(ART.coin)) {
      const cw = ART.coin.naturalWidth / 6, chh = ART.coin.naturalHeight;
      const f = Math.floor((W.simT * 9 + c.x * 0.11) % 6);
      const dh = COIN_R * 2.7, dw = dh * cw / chh;
      cx.drawImage(ART.coin, f * cw, 0, cw, chh, c.x - dw / 2, c.y - dh / 2, dw, dh);
    } else {
      cx.fillStyle = '#F5C518';
      cx.beginPath(); cx.ellipse(c.x, c.y, COIN_R * 0.64, COIN_R, 0, 0, 6.2832); cx.fill();
    }
    cx.globalAlpha = 1;
  }

  for (const p of W.pickups) {                       // the star: a multiplier
    if (p.taken) continue;
    if (ok(ART.star)) {
      const dh = 27, dw = dh * ART.star.naturalWidth / ART.star.naturalHeight;
      cx.save(); cx.translate(p.x, p.y);
      cx.rotate(Math.sin(W.simT * 2.2) * 0.16);
      const g = cx.createRadialGradient(0, 0, 2, 0, 0, dh);
      g.addColorStop(0, 'rgba(255,226,140,.6)'); g.addColorStop(1, 'rgba(255,226,140,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, dh, 0, 6.2832); cx.fill();
      cx.drawImage(ART.star, -dw / 2, -dh / 2, dw, dh);
      cx.restore();
    } else {
      cx.fillStyle = '#FFE27A';
      cx.beginPath(); cx.arc(p.x, p.y, 9, 0, 6.2832); cx.fill();
    }
  }

  for (const e of W.enemies) {
    if (e.dead) {
      /* STOMPED, AND THE ART DOES THE FLATTENING. This used to take cell 0 of
         the standing plate and draw it into an 8-unit-tall box - a smear, not
         a squash, and it read as the beetle being deleted rather than being
         jumped on. There is a drawn four-cell flatten now: stand, splat wide,
         settle, and the amber in his cracks fading down to a dull ember. It
         plays once across the 0.6s the body is on screen for, so the last cell
         is what fades out rather than a pose nobody reached. */
      if (e.deadT > 0 && ok(ART.skarnSquash)) {
        const im = ART.skarnSquash;
        const cw = im.naturalWidth / SQUASHCELLS, chh = im.naturalHeight;
        const cell = Math.min(SQUASHCELLS - 1,
          Math.floor((0.6 - e.deadT) * (SQUASHCELLS / 0.55)));
        const dh = WALK_H * 1.55, dw = dh * cw / chh;
        cx.globalAlpha = Math.min(1, e.deadT / 0.35);
        cx.drawImage(im, cell * cw, 0, cw, chh,
          e.x + WALK_W / 2 - dw / 2,
          (e.floor || FLOOR_Y) - dh + dh * stancePad(im, SQUASHCELLS), dw, dh);
        cx.globalAlpha = 1;
      }
      continue;
    }
    if (e.kind === 'fly') {
      /* THE FLYING BUG. Everything here exists to make the strike readable
         BEFORE it lands: a ground shadow that tightens as it drops so you can
         read its height, a wingbeat squash fast enough to buzz, a wind-up that
         flashes and paints a warning arc down at the target, and streaks
         behind it once it commits. */
      /* WIND-UP AND DIVE ARE DIFFERENT DRAWINGS, NOT THE SAME ONE ROTATED.
         The tell is wings FLARED WIDE - the biggest, loudest silhouette he
         has, because its whole job is to be noticed before the strike. The
         dive is the opposite shape: wings swept back tight, body streamlined.
         Two silhouettes that read differently at a glance is the telegraph.

         The dive cell used is the STREAMLINED one, not the nose-down one, on
         purpose: the renderer already rotates the sprite to aim it along its
         travel, so picking art that is drawn pointing down as well would turn
         it twice and send it in head-first at the wrong angle. Let the code do
         the aiming and give it art that points straight ahead. */
      const flap = Math.sin(W.simT * 34);
      const diving = e.ph === 'dive';
      const telling = e.ph === 'tell';
      const spent = e.ph === 'spent';
      const im = (telling || diving || spent) && ok(ART.vyreDive) ? ART.vyreDive
               : ok(ART.vyreFly) ? ART.vyreFly : null;
      /* its shadow, on the ground it is about to arrive at */
      const drop = Math.max(0, Math.min(1, (FLOOR_Y - WALK_H - e.y) / 90));
      cx.fillStyle = 'rgba(40,20,6,' + (0.30 * (1 - drop * 0.75)) + ')';
      cx.beginPath();
      cx.ellipse(e.x + WALK_W / 2, FLOOR_Y - 1.5,
        WALK_W * (0.52 - drop * 0.26), 2.6 * (1 - drop * 0.4), 0, 0, 6.2832);
      cx.fill();
      if (telling) {
        /* the wind-up, aimed: a thin arc from the bug down to the target */
        const tg = e.tgt;
        if (tg) {
          cx.save();
          /* the wind-up has to be LOUD - at 1.6 units wide and 30% alpha the
             warning line was invisible at play scale, which defeats the whole
             point of telegraphing. */
          cx.globalAlpha = 0.55 + 0.40 * Math.abs(Math.sin(W.simT * 14));
          cx.strokeStyle = '#FF6B57'; cx.lineWidth = 3.2;
          cx.setLineDash([7, 5]);
          cx.beginPath();
          cx.moveTo(e.x + WALK_W / 2, e.y + WALK_H);
          cx.lineTo(tg.x + BODY_W / 2, tg.y + BODY_H / 2);
          cx.stroke();
          cx.restore();
        }
      }
      if (diving) {
        for (let k = 1; k <= 3; k++) {
          cx.globalAlpha = 0.20 / k;
          cx.fillStyle = '#C9A2FF';
          cx.beginPath();
          cx.ellipse(e.x + WALK_W / 2 - e.dx * 0.012 * k,
            e.y + WALK_H / 2 - e.dy * 0.012 * k,
            WALK_W * 0.42, WALK_H * 0.32, 0, 0, 6.2832);
          cx.fill();
        }
        cx.globalAlpha = 1;
      }
      if (ok(im)) {
        /* A DRAWN WINGBEAT. Squashing one plate vertically is not a flap - the
           wings have to change ANGLE, which only frames can do. Five cells at
           22fps buzz; the body tilt and the dive rotation stay procedural
           because those follow the physics, not the cycle.
           SIZED AGAINST THE CAST, not against the plate: at 1.9x WALK_H it was
           half again the height of the character it was attacking. */
        const fcells = (im === ART.vyreDive) ? DIVECELLS : FLYCELLS;
        const fw = im.naturalWidth / fcells;
        /* every cell of this strip has a job: two flare poses flutter through
           the wind-up, the streamlined one flies the dive, and the nose-down
           one is where he ends up - buried head-first in the floor he just
           missed. A cell nothing can ever select is a cell that should have
           been cut, so none are left over. */
        const ff = im === ART.vyreDive
          ? (diving ? 2 : spent ? 3 : Math.floor(W.simT * 9) % 2)
          : Math.floor(W.simT * 22) % fcells;           // hover: the wingbeat
        const dh = WALK_H * 1.24 * (1 - flap * 0.05), dw = dh * fw / im.naturalHeight;
        cx.save();
        cx.translate(e.x + WALK_W / 2, e.y + WALK_H / 2);
        cx.rotate(diving ? Math.atan2(e.dy, e.dx) + Math.PI : Math.sin(W.simT * 5) * 0.07);
        if (diving && e.dx > 0) cx.scale(1, -1);      // never fly upside down
        if (telling && Math.floor(W.simT * 12) % 2) cx.filter = 'brightness(1.7) saturate(1.4)';
        cx.drawImage(im, ff * fw, 0, fw, im.naturalHeight, -dw / 2, -dh / 2, dw, dh);
        cx.restore();
      } else {
        cx.fillStyle = telling ? '#FF6B57' : '#7A5CA8';
        cx.fillRect(e.x, e.y, WALK_W, WALK_H);
      }
      continue;
    }
    const cw8 = ok(ART.skarnWalk) ? ART.skarnWalk : null;
    if (ok(cw8)) {
      /* A DRAWN WALK CYCLE. The first attempt at this cycled the four cells of
         the old plate, which came back near-identical, so nothing moved; the
         second faked it with a squash and a counter-rotation, which is a
         wobble, not a walk. This is a five-frame cycle where the legs are
         actually drawn stepping, and it is clocked off DISTANCE WALKED rather
         than off wall time, so the feet keep pace with the body instead of
         sliding. A small bob is kept on top for weight. */
      const cells = BUGCELLS;
      const cw = cw8.naturalWidth / cells, chh = cw8.naturalHeight;
      const gait = e.x * 0.085;
      const f = ((Math.floor(-gait) % cells) + cells) % cells;
      const bob = Math.abs(Math.sin(gait * 1.6)) * 1.1;
      const dh = WALK_H * 1.55, dw = dh * cw / chh;
      const fy = (e.floor || FLOOR_Y);
      cx.fillStyle = 'rgba(40,20,6,' + (0.26 - bob * 0.05) + ')';
      cx.beginPath();
      cx.ellipse(e.x + WALK_W / 2, fy - 1.5, WALK_W * 0.5, 2.4, 0, 0, 6.2832);
      cx.fill();
      /* NO HAND-ADDED LIFT. The drawn cycle already carries the shell's bob,
         so subtracting one here lifted it off the floor a second time and the
         beetle walked on air. `bob` now only drives the shadow, which is what
         a bob should do. */
      /* one pad for the whole strip, not one per cell - see stancePad. The
         scuttle was shot on a locked camera, so the shell's rise and fall
         between cells is the walk, and measuring each cell separately would
         iron it flat. */
      cx.drawImage(cw8, f * cw, 0, cw, chh,
        e.x + WALK_W / 2 - dw / 2,
        e.y + WALK_H - dh + dh * stancePad(cw8, cells), dw, dh);
    } else {
      cx.fillStyle = '#8B4A2B'; cx.fillRect(e.x, e.y, WALK_W, WALK_H);
    }
  }

  /* FLOATING LOSS TEXT - drawn in the play plane so it rises off the body
     that took the hit, with a dark rim so it reads over any wall. */
  for (const f of W.floats) {
    if (f.t <= 0) continue;
    const u = 1 - f.t / 0.9;
    cx.save();
    cx.globalAlpha = Math.min(1, (1 - u) * 2.2);
    cx.font = '800 17px ui-monospace,monospace';
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.lineJoin = 'round';
    cx.strokeStyle = 'rgba(16,6,4,.9)'; cx.lineWidth = 4;
    cx.strokeText(f.txt, f.x, f.y - u * 30);
    cx.fillStyle = f.hex; cx.fillText(f.txt, f.x, f.y - u * 30);
    cx.restore();
  }

  for (const f of W.spawnFx) {
    if (f.t <= 0) continue;
    const a = f.t / 0.7;
    cx.globalAlpha = Math.min(1, a);
    if (f.kind === 'char') { cx.fillStyle = '#7FE8A0'; }
    else if (f.kind === 'bad') { cx.fillStyle = '#E8607F'; }
    else { cx.fillStyle = '#D9D2C4'; }
    for (let i = 0; i < 6; i++) {
      const ang = i * 1.047, rr = (1 - a) * 22 + 4;
      cx.beginPath(); cx.arc(f.x + Math.cos(ang) * rr, f.y + Math.sin(ang) * rr, 3, 0, 6.2832); cx.fill();
    }
    cx.globalAlpha = 1;
  }

  /* ======================= THE CHEST, AS A SEQUENCE =======================
     It used to swap the closed plate for the open one at the halfway mark,
     which is not an animation, it is a cut. The opening is staged now:

       lock   the chest rattles harder and harder while the haul loads
       burst  a white ring blows out, the lock lets go, sparks fly
       open   god-rays sweep, the pack rises on an overshoot and settles

     Everything below is driven off openU (0..1) so the whole thing is one
     readable curve rather than a pile of timers. */
  /* THE VAULT DOOR, standing behind the chest. Drawn BEFORE it so the chest
     and everybody celebrating in front of it read on top, which is the right
     depth order - the door is the back wall of this scene, not a prop in it.

     It swaps to the open plate late in the chest's opening curve rather than
     the instant the lock goes, so the two events read as cause and effect: the
     chest opens, the haul is counted, and THEN the far door answers it. The
     swap is a swap and not a tween because there are two drawn states and no
     in-between art; a scale-fudge between them would look like the door
     breathing. What sells it instead is everything around the swap - the light
     that was not there a moment ago, the dust, and the shake the phase change
     already carries. */
  (function () {
    const opening = (W.phase === 'open' && vaultComing(W) && W.openU > 0.55)
                 || W.phase === 'vault';
    const im = opening ? ART.doorOpen : ART.doorShut;
    if (!ok(im)) return;
    const dh = DOOR_H, dw = dh * im.naturalWidth / im.naturalHeight;
    const dx = DOOR_X - dw / 2, dy = FLOOR_Y - dh;

    if (opening) {
      /* the room behind it, seen through the gap - a warm slab of light that
         did not exist a second ago, which is what makes the swap land */
      const g = cx.createLinearGradient(0, dy, 0, FLOOR_Y);
      g.addColorStop(0, 'rgba(255,226,150,.10)');
      g.addColorStop(0.45, 'rgba(255,214,120,.62)');
      g.addColorStop(1, 'rgba(255,196,90,.30)');
      cx.fillStyle = g;
      cx.fillRect(dx + dw * 0.24, dy + dh * 0.10, dw * 0.52, dh * 0.90);
      const halo = cx.createRadialGradient(DOOR_X, dy + dh * 0.52, 2,
        DOOR_X, dy + dh * 0.52, dh * 0.95);
      halo.addColorStop(0, 'rgba(255,226,150,.34)');
      halo.addColorStop(1, 'rgba(255,226,150,0)');
      cx.fillStyle = halo;
      cx.fillRect(dx - dw, dy - dh * 0.3, dw * 3, dh * 1.6);
    }

    cx.fillStyle = 'rgba(30,16,4,.30)';
    cx.beginPath();
    cx.ellipse(DOOR_X, FLOOR_Y - 1.2, dw * 0.44, 3.0, 0, 0, 6.2832);
    cx.fill();
    cx.drawImage(im, dx, dy, dw, dh);
  })();

  (function () {
    const u = W.openU, cy = FLOOR_Y - CHEST_H, cx0 = CHEST_X - CHEST_W / 2;
    const seg = function (a, b) { return Math.max(0, Math.min(1, (u - a) / (b - a))); };
    const easeOut = function (t) { return 1 - Math.pow(1 - t, 3); };
    const back = function (t) {          // overshoot, for the pack
      const c = 1.9;
      return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
    };

    /* GOD-RAYS, sweeping out from the lid once it is open */
    const rayU = seg(0.10, 0.55);
    if (rayU > 0) {
      cx.save();
      cx.translate(CHEST_X, cy + 6);
      cx.globalCompositeOperation = 'lighter';
      const spin = W.simT * 0.5;
      for (let k = 0; k < 9; k++) {
        const a = spin + k * (Math.PI * 2 / 9);
        const len = 26 + rayU * 92, w = 0.10 + (k % 3) * 0.03;
        const g = cx.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
        g.addColorStop(0, 'rgba(255,226,140,' + (0.42 * rayU).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(255,226,140,0)');
        cx.fillStyle = g;
        cx.beginPath(); cx.moveTo(0, 0);
        cx.arc(0, 0, len, a - w, a + w); cx.closePath(); cx.fill();
      }
      cx.restore();
    }

    /* the lit shaft up out of the lid */
    if (u > 0.06) {
      const a = seg(0.06, 0.4);
      const gr = cx.createLinearGradient(0, cy - 78, 0, cy + 8);
      gr.addColorStop(0, 'rgba(255,232,150,0)');
      gr.addColorStop(1, 'rgba(255,232,150,' + (0.62 * a).toFixed(3) + ')');
      cx.fillStyle = gr; cx.beginPath(); cx.moveTo(cx0 + 3, cy + 4);
      cx.lineTo(cx0 - 24, cy - 80); cx.lineTo(cx0 + CHEST_W + 24, cy - 80);
      cx.lineTo(cx0 + CHEST_W - 3, cy + 4); cx.fill();
    }

    /* THE LOCK CHARGING, while the haul goes in */
    if (W.phase === 'spend' || W.phase === 'lock') {
      const chg = W.total ? W.banked / W.total : 1;
      const pulse = W.phase === 'lock' ? 1 + Math.sin(W.phaseT * 40) * 0.4 : 1;
      const g = cx.createRadialGradient(CHEST_X, cy + 20, 1, CHEST_X, cy + 20, 50 * pulse);
      g.addColorStop(0, 'rgba(255,238,170,' + (0.95 * chg * pulse).toFixed(3) + ')');
      g.addColorStop(0.5, 'rgba(255,200,90,' + (0.4 * chg).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,200,90,0)');
      cx.fillStyle = g; cx.fillRect(CHEST_X - 56, cy - 38, 112, 94);
    }

    cx.fillStyle = 'rgba(40,20,6,.34)';
    cx.beginPath(); cx.ellipse(CHEST_X, FLOOR_Y - 1.5, CHEST_W * 0.56, 3.4, 0, 0, 6.2832); cx.fill();

    /* the chest itself, swapping to the open plate the instant the lock goes,
       with a squash-and-settle so the lid has weight */
    const im = (u >= 0.02 && ok(ART.chestOpen)) ? ART.chestOpen : ART.chest;
    if (ok(im)) {
      const pop = 1 + Math.sin(Math.min(1, seg(0, 0.16)) * Math.PI) * 0.12;
      const dw = CHEST_W * 1.22 * pop, dh = dw * im.naturalHeight / im.naturalWidth;
      cx.drawImage(im, CHEST_X - dw / 2, FLOOR_Y - dh + 1, dw, dh);
    } else {
      cx.fillStyle = '#8A5A2E'; cx.fillRect(cx0, cy, CHEST_W, CHEST_H);
    }

    /* THE PACK, rising on an overshoot and settling */
    const pu = seg(0.18, 0.78);
    if (pu > 0) {
      const e = back(pu);
      const pw = 21, ph = 29;
      const py = cy + 6 - e * 46;
      cx.save();
      cx.translate(CHEST_X, py);
      cx.rotate(Math.sin(pu * Math.PI * 1.5) * 0.13 * (1 - pu));
      const sc = 0.55 + 0.45 * Math.min(1, pu * 2.2);
      cx.scale(sc, sc);
      const halo = cx.createRadialGradient(0, 0, 2, 0, 0, 34);
      halo.addColorStop(0, 'rgba(255,236,170,.5)');
      halo.addColorStop(1, 'rgba(255,236,170,0)');
      cx.fillStyle = halo; cx.beginPath(); cx.arc(0, 0, 34, 0, 6.2832); cx.fill();
      cx.fillStyle = '#E8B94A'; cx.fillRect(-pw / 2 - 2, -ph / 2 - 2, pw + 4, ph + 4);
      cx.fillStyle = '#27427C'; cx.fillRect(-pw / 2, -ph / 2, pw, ph);
      cx.fillStyle = '#4E74BC'; cx.fillRect(-pw / 2 + 2.5, -ph / 2 + 2.5, pw - 5, 6);
      cx.fillStyle = '#F2C75B';
      cx.beginPath(); cx.arc(0, 2, 5.6, 0, 6.2832); cx.fill();
      cx.strokeStyle = '#101C36'; cx.lineWidth = 1.5;
      cx.strokeRect(-pw / 2, -ph / 2, pw, ph);
      cx.restore();
    }

    /* THE BURST RING, the frame the lock lets go */
    if (W.burst > 0) {
      const b = 1 - W.burst;
      cx.save(); cx.globalCompositeOperation = 'lighter';
      cx.strokeStyle = 'rgba(255,244,200,' + (W.burst * 0.9).toFixed(3) + ')';
      cx.lineWidth = 4 * W.burst + 0.6;
      cx.beginPath(); cx.arc(CHEST_X, cy + 12, 8 + b * 78, 0, 6.2832); cx.stroke();
      cx.restore();
    }
  })();

  /* THE SPEND: coins in flight, each with a short trail so a stream of them
     reads as a STREAM and not as a row of dots. */
  for (const f of W.flyers) {
    if (f.u >= 1) continue;
    for (let t = 3; t >= 1; t--) {
      const uu = Math.max(0, f.u - t * 0.035);
      const e2 = uu * uu * (3 - 2 * uu);
      const tx = f.x0 + (CHEST_X - f.x0) * e2;
      const ty = f.y0 + ((FLOOR_Y - CHEST_H + 12) - f.y0) * e2 - Math.sin(uu * Math.PI) * f.lift;
      cx.globalAlpha = 0.15 * (4 - t);
      cx.fillStyle = '#FFD860';
      cx.beginPath(); cx.arc(tx, ty, COIN_R * (0.30 + 0.11 * (4 - t)), 0, 6.2832); cx.fill();
    }
    cx.globalAlpha = 1;
    if (ok(ART.coin)) {
      const cw = ART.coin.naturalWidth / 6, chh = ART.coin.naturalHeight;
      const fr = Math.floor((W.simT * 16 + f.x0) % 6);
      const dh = COIN_R * 2.9, dw = dh * cw / chh;
      cx.drawImage(ART.coin, fr * cw, 0, cw, chh, f.x - dw / 2, f.y - dh / 2, dw, dh);
    } else {
      cx.fillStyle = '#F5C518';
      cx.beginPath(); cx.ellipse(f.x, f.y, COIN_R * 0.7, COIN_R, 0, 0, 6.2832); cx.fill();
    }
  }

  /* sparks, from the burst and from every coin that lands */
  for (const k of W.sparks) {
    const a = k.t / k.t0;
    cx.globalAlpha = a;
    cx.fillStyle = a > 0.55 ? '#FFF6D8' : '#F5C518';
    cx.beginPath(); cx.arc(k.x, k.y, k.r * (0.4 + a * 0.8), 0, 6.2832); cx.fill();
    cx.globalAlpha = 1;
  }

  /* THE CAST. Painted plates from the established library: the run strips are
     six-cell rows played off his ACTUAL horizontal speed, so the legs move
     because he is moving. A body with no strip falls back to its idle plate,
     and a body with no plate at all falls back to a coloured box - the rig
     never depends on the art existing. */
  const order = W.party.slice().sort(function (a, b) { return a.x - b.x; });
  for (const r of order) {
    const idle = ART[r.id], run = ART[r.id + 'Run'], hurt = ART[r.id + 'Hurt'];
    const sq = r.out ? 0 : Math.max(-0.14, Math.min(0.14, -r.vy / 3600));
    /* his shadow on the floor, so he is standing ON the temple not in front */
    /* HIS OWN FLOOR. Pinned to FLOOR_Y the shadow stayed on the middle road
       while the body was up on the deck or down in the tunnel - the shadow of
       somebody else. It tracks the last surface he actually stood on and
       shrinks as he rises off it, which is also what sells the jump height. */
    if (r.onGround) r.shadowY = r.y + BODY_H;
    const shY = r.shadowY === undefined ? FLOOR_Y : r.shadowY;
    const lift = Math.max(0, Math.min(1, (shY - (r.y + BODY_H)) / 70));
    cx.fillStyle = 'rgba(40,20,6,' + (0.30 * (1 - lift * 0.70)) + ')';
    cx.beginPath();
    cx.ellipse(r.x + BODY_W / 2, shY - 1.5,
      BODY_W * 0.52 * (1 - lift * 0.32), 2.8 * (1 - lift * 0.32), 0, 0, 6.2832);
    cx.fill();

    const air = ART[r.id + 'Air'];
    const cheer = ART[r.id + 'Cheer'];
    let im = null, cells = 1, cell = 0;
    /* THEY CELEBRATE WHEN THEY WIN. Everyone who reached the chest stood in
       their idle pose through the entire payout - the one moment in the run
       that is unambiguously good and nobody on screen reacted to it. The
       drawn five-frame jump-and-cheer strip plays once the chest is open and
       then holds on its last frame. */
    if (!r.out && W.phase !== 'run' && W.phase !== 'gather' && ok(cheer)) {
      /* the cheer LOOPS while the payout runs - it is a bounce, and a bounce
         that stops on its last frame is a body that froze mid-air. Played at
         the strip's OWN rate, not a shared one: see CHEER. */
      const ch = cheerOf(r.id);
      im = cheer; cells = ch.cells;
      cell = Math.floor((W.phaseT || 0) * ch.fps) % ch.cells;
    }
    else if (r.out && ok(hurt)) {
      /* CAUGHT, PLAYED ONCE. Startle, hands up, struggle, slump, sulk - it
         runs through from the instant he was caught and then holds on the
         sulk, which is where he stays for the rest of the round. */
      im = hurt; cells = CAUGHTCELLS;
      cell = Math.min(CAUGHTCELLS - 1,
        Math.floor(Math.max(0, W.simT - (r.outT || 0)) * 11));
    }
    else if (!r.out && ok(air) && (r.anim === 'jump-up' || r.anim === 'jump-down' || r.anim === 'land')) {
      /* THE AIR POSES ARE READ OFF PHYSICS like everything else: rising picks
         the leap, falling picks the tuck, the first 130ms after a landing
         picks the crouch. A character without an air strip falls back to his
         idle plate, so the rig never depends on the art existing. */
      /* THE JUMP IS READ OFF VERTICAL SPEED, NOT OFF A TIMER. Six drawn cells
         - crouch, launch, apex, fall, land, recover - and which one shows is
         decided by what the body is actually doing: hard rising picks the
         launch, coasting near the top picks the tuck, dropping picks the reach
         for the ground, and the two after touchdown are the squash and the
         stand. Tie it to a clock instead and the pose drifts out of step with
         the arc the moment the jump is cut short. */
      im = air; cells = JUMPCELLS;
      cell = r.anim === 'jump-up' ? (r.vy < -260 ? 0 : 1)
        : r.anim === 'jump-down' ? (r.vy < 200 ? 1 : 2)
        : (r.sinceLand < 0.06 ? 3 : 4);
    } else if (!r.out && r.onGround && Math.abs(r.vx) > 18 && ok(run)) {
      im = run; cells = RUNCELLS;
      cell = Math.floor(r.x / RUN_STEP) % RUNCELLS;  // stride tied to distance
      if (cell < 0) cell += RUNCELLS;
    } else if (ok(idle)) im = idle;

    cx.globalAlpha = (r.flash > 0 && Math.floor(r.flash * 16) % 2) ? 0.42 : 1;
    if (im) {
      const cw = im.naturalWidth / cells, chh = im.naturalHeight;
      /* one scale for the whole cast so nobody is accidentally bigger */
      const dh = BODY_H * 1.72 * (1 + sq), dw = dh * cw / chh;
      const dx = r.x + BODY_W / 2 - dw / 2;
      const dy = r.y + BODY_H - dh + dh * stancePad(im, cells);
      cx.save();
      /* EVERY CAST PLATE IS DRAWN FACING LEFT - the run strips, the air strip,
         all three characters. So the flip happens when he is moving RIGHT, not
         left. Unflipped he was drawn facing backwards while running forwards,
         which reads exactly like the animation playing in reverse. */
      if (r.face > 0) { cx.translate(dx + dw / 2, 0); cx.scale(-1, 1); cx.translate(-(dx + dw / 2), 0); }
      if (r.out) cx.filter = 'grayscale(1) brightness(0.82)';
      cx.drawImage(im, cell * cw, 0, cw, chh, dx, dy, dw, dh);
      cx.restore();
    } else {
      cx.fillStyle = r.out ? '#8C8C8C' : r.hex;
      cx.fillRect(r.x, r.y, BODY_W, BODY_H);
    }
    cx.globalAlpha = 1;
  }
  cx.restore();

  /* THE FOREGROUND, at 1.30x - faster than the play plane, so the parallax
     reads as depth rather than as a flat backdrop with a character on it. */
  if (ok(ART.fore)) {
    const im = ART.fore;
    /* SHORT. At 0.30 of the canvas it covered the pit mouth, and the pit is
       where beat 3 happens - a foreground that hides the drama is decoration
       working against the game. */
    const H = cv.height * 0.185, W2 = im.naturalWidth * H / im.naturalHeight;
    let x = -((cam.x * 1.30 * SCALE / 3) % W2);
    /* IT STEPS ASIDE OVER THE TUNNEL. This band is ground-level clutter -
       barrels, rocks, grass - drawn against the bottom of the frame. Once the
       sunken lane existed, the bottom of the frame stopped being ground and
       became a passage with a runner in it, so the props were standing in mid
       air across the tunnel mouth and burying whoever took the low road.
       Where the ground is cut away there is nothing to stand on, so the
       foreground is clipped out of the tunnel's span. */
    const tx0 = (LOW_RUN[0][0] - cam.x) * SCALE;
    const tx1 = (LOW_RUN[LOW_RUN.length - 1][1] - cam.x) * SCALE;
    cx.save();
    cx.beginPath();
    cx.rect(0, 0, Math.max(0, Math.min(cv.width, tx0)), cv.height);
    cx.rect(Math.max(0, Math.min(cv.width, tx1)), 0,
      Math.max(0, cv.width - Math.max(0, Math.min(cv.width, tx1))), cv.height);
    cx.clip();
    cx.globalAlpha = 0.97;
    while (x < cv.width) { cx.drawImage(im, x, cv.height - H, W2, H); x += W2 - 1; }
    cx.globalAlpha = 1;
    cx.restore();
  }

  /* ========================= THE VAULT CHAMBER ==========================
     Drawn as a full-screen SCENE rather than as a place in the level, and that
     is a deliberate limit rather than a shortcut. The level's geometry, its
     camera and the sealed profile it is built from are all load-bearing;
     carving a real room into them to show a thing that happens after the run
     is over would put the riskiest possible change next to the part of this
     build nobody is allowed to touch. An overlay costs nothing and can be
     removed in one line.

     The scrim is the important detail. The plate is a bright gold room and
     TIBBO is a bright orange jerboa, so painted straight the cast would sink
     into the wall behind them. It is knocked back with a warm scrim and a
     vignette - the same move the main temple already makes over its far layer
     - so the room stays rich but the bodies read against it. */
  if (W.phase === 'vault') drawVault(W);

  /* ============================ THE CHROME ==============================
     Drawn in SCREEN space, outside the shaken play plane. Everything here is
     built from the same three primitives - a rounded panel with a lit top
     edge, a gold-stroked pill, and a number with a dark rim - so the HUD reads
     as one designed set rather than three unrelated boxes.

     Panels sit on the safe margins, values pop when they change, and the beat
     rail across the top says where you are in the run without a word of copy. */

  /* A PAINTED FRAME, 3-SLICED. Drawing the panel with roundRect and a stroke
     was the programmer-art shortcut; this is the generated plate, cut into a
     left cap, a stretched middle and a right cap so the carved gold corners
     and the turquoise studs keep their proportions at any width. Content is
     then laid ON it - frame, then recess, then value - which is the layering
     the whole HUD is built from. */
  function panel(x, y, w, h, r, a) {
    const im = ART.uiPanel;
    cx.save();
    if (a !== undefined) cx.globalAlpha = a;
    if (ok(im)) {
      const cap = Math.round(im.naturalWidth * 0.17);
      const capW = Math.min(w * 0.42, h * cap / im.naturalHeight);
      cx.drawImage(im, 0, 0, cap, im.naturalHeight, x, y, capW, h);
      cx.drawImage(im, cap, 0, im.naturalWidth - cap * 2, im.naturalHeight,
        x + capW, y, Math.max(1, w - capW * 2), h);
      cx.drawImage(im, im.naturalWidth - cap, 0, cap, im.naturalHeight,
        x + w - capW, y, capW, h);
    } else {
      cx.fillStyle = 'rgba(28,18,10,.9)';
      cx.beginPath();
      if (cx.roundRect) cx.roundRect(x, y, w, h, r); else cx.rect(x, y, w, h);
      cx.fill();
    }
    cx.restore();
  }
  function bigNum(txt, x, y, size, fill) {
    cx.font = '800 ' + size + 'px ui-monospace,SFMono-Regular,Menlo,monospace';
    cx.lineJoin = 'round';
    cx.strokeStyle = 'rgba(12,7,3,.92)'; cx.lineWidth = size * 0.22;
    cx.strokeText(txt, x, y);
    cx.fillStyle = fill; cx.fillText(txt, x, y);
  }

  /* ---------------- LAYER 0: SEPARATE THE CARD FROM THE STAGE. It read as a
     sticker pasted on a busy temple, so a scrim sinks the level behind it.
     This fires HERE, before the tracker and the rail, because chrome belongs
     on top of everything - dimming the level and the HUD together was the
     same mistake as shaking the HUD with the world. --------------------- */
  if (W.phase !== 'run') {
    const su = Math.min(1, (W.phase === 'gather' ? W.phaseT / 0.45 : 1));
    cx.save();
    cx.globalAlpha = (1 - Math.pow(1 - su, 3)) * 0.58;
    cx.fillStyle = '#0B0704';
    cx.fillRect(0, 0, cv.width, cv.height);
    cx.restore();
  }

  /* ---------------- the run tracker: coins, and what the multiplier is made
     of. Both cells pop when they change, which is the whole reason the number
     feels like it is accumulating rather than just being displayed. ------- */
  (function () {
    const m = liveMult(W);
    const cp = W.coinPulse ? W.coinPulse / 0.28 : 0;
    const mp = W.multPulse ? W.multPulse / 0.6 : 0;
    const PX = 16, PY = 14, PW = 196, PH = 46;
    panel(PX, PY, PW, PH, 13);

    cx.save();
    cx.translate(PX + 30, PY + PH / 2);
    cx.scale(1 + cp * 0.34, 1 + cp * 0.34);
    if (ok(ART.coin)) {
      const cw = ART.coin.naturalWidth / 6;
      const dh = 30, dw = dh * cw / ART.coin.naturalHeight;
      const fr = Math.floor((W.simT * 8) % 6);
      cx.drawImage(ART.coin, fr * cw, 0, cw, ART.coin.naturalHeight, -dw / 2, -dh / 2, dw, dh);
    } else {
      cx.fillStyle = '#F5C518';
      cx.beginPath(); cx.ellipse(0, 0, 8, 12, 0, 0, 6.2832); cx.fill();
    }
    cx.restore();

    cx.textAlign = 'left'; cx.textBaseline = 'alphabetic';
    bigNum(String(W.coinsGot), PX + 50, PY + 32, 25, cp > 0 ? '#FFF6D0' : '#FFD860');

    /* what the multiplier is MADE of: a chip per body, a star per star */
    let px = PX + 104;
    for (const b of W.party) {
      cx.fillStyle = b.out ? 'rgba(150,150,150,.45)' : b.hex;
      cx.beginPath();
      if (cx.roundRect) cx.roundRect(px, PY + 16, 8, 13, 2.5); else cx.rect(px, PY + 16, 8, 13);
      cx.fill();
      cx.strokeStyle = 'rgba(12,7,3,.7)'; cx.lineWidth = 1; cx.stroke();
      px += 11;
    }
    for (let k = 0; k < W.stars; k++) {
      cx.fillStyle = '#FFE27A';
      cx.beginPath();
      for (let q = 0; q < 10; q++) {
        const a = -Math.PI / 2 + q * Math.PI / 5, rr = q % 2 ? 2.4 : 5.6;
        cx[q ? 'lineTo' : 'moveTo'](px + 5 + Math.cos(a) * rr, PY + 23 + Math.sin(a) * rr);
      }
      cx.closePath(); cx.fill();
      cx.strokeStyle = 'rgba(120,80,0,.8)'; cx.lineWidth = 1; cx.stroke();
      px += 12;
    }

    cx.save();
    cx.translate(PX + PW - 22, PY + PH / 2);
    cx.scale(1 + mp * 0.5, 1 + mp * 0.5);
    cx.textAlign = 'right';
    bigNum('\u00d7' + m, 0, 9, 24, m > 1 ? (mp > 0 ? '#FFFFFF' : '#8CF0AE') : 'rgba(255,255,255,.55)');
    cx.restore();
  })();

  /* ---------------- the beat rail: three nodes across the top. Done nodes
     fill in, the live one glows and breathes. No copy on the stage. ------- */
  (function () {
    const N = 3, RW = 210, x0 = cv.width / 2 - RW / 2, y = 30;
    cx.strokeStyle = 'rgba(255,232,180,.22)'; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(x0, y); cx.lineTo(x0 + RW, y); cx.stroke();
    let doneN = 0;
    for (const b of W.beats) if (b.done) doneN++;
    cx.strokeStyle = 'rgba(240,200,110,.95)'; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(x0, y);
    cx.lineTo(x0 + RW * (doneN / N), y); cx.stroke();
    for (let k = 0; k < N; k++) {
      const px = x0 + (RW / (N - 1)) * k;
      const b = W.beats[k];
      const live = !b.done && (k === 0 || W.beats[k - 1].done);
      const pulse = live ? 1 + Math.sin(W.simT * 5) * 0.16 : 1;
      const bad = b.verdict === 'out' || (b.verdict && String(b.verdict).indexOf('0 of') === 0);
      cx.beginPath(); cx.arc(px, y, 9 * pulse, 0, 6.2832);
      cx.fillStyle = b.done ? (bad ? '#C4574F' : '#5FD08A')
                   : live ? 'rgba(240,200,110,.95)' : 'rgba(60,42,26,.9)';
      cx.fill();
      cx.strokeStyle = 'rgba(16,10,5,.85)'; cx.lineWidth = 2; cx.stroke();
      if (b.done) {                                   // a tick or a cross
        cx.strokeStyle = '#12240F'; cx.lineWidth = 2.4; cx.lineCap = 'round';
        cx.beginPath();
        if (bad) { cx.moveTo(px - 3.4, y - 3.4); cx.lineTo(px + 3.4, y + 3.4);
                   cx.moveTo(px + 3.4, y - 3.4); cx.lineTo(px - 3.4, y + 3.4); }
        else { cx.moveTo(px - 3.8, y); cx.lineTo(px - 1, y + 3.2); cx.lineTo(px + 4, y - 3.4); }
        cx.stroke(); cx.lineCap = 'butt';
      }
    }
  })();

  /* ---------------- the payout card. Slides down, counts up, and lands on a
     tier ribbon in the tier's own colour. ------------------------------- */
  /* NOT DURING THE VAULT. The card is the payout stated as a number, and the
     vault is the same payout stated as a room - running both at once means the
     number covers the thing it is describing, and on the left third it sat
     squarely on top of whoever was standing there. The room gets the screen to
     itself, then the card lands on the way out. */
  if (W.phase !== 'run' && W.phase !== 'vault') {
    const shown = Math.min(W.banked, W.total);
    const done = W.phase === 'open' || W.phase === 'done';
    const inU = Math.min(1, (W.phase === 'gather' ? W.phaseT / 0.45 : 1));
    const slide = (1 - Math.pow(1 - inU, 3));
    /* THE CARD SITS BESIDE THE CHEST, NOT ON TOP OF IT. Centred, it covered
       the chest and every celebrating character with it - the payout hid the
       thing the payout is about. It is on the left third now, and the chest
       and the cast sit clear of it on the right. */
    const PW = 316, PH = 236;
    /* CLEAR OF THE TRACKER. Moved to the left margin the card landed on top
       of the HUD panel, which lives in the same corner - the haul was drawn
       over the coin counter and both read as broken. It sits at the vertical
       middle of the stage now, so the chrome keeps the top strip and the card
       has the flank to itself, and it slides in from the left rather than
       down through the tracker. */
    const PX = Math.round(cv.width * 0.045) - (1 - slide) * 210;
    const PY = Math.round((cv.height - PH) * 0.56);

    cx.save();
    cx.globalAlpha = Math.min(1, slide * 1.3);
    const CXm = PX + PW / 2;                    // the card's own centre line
    const bloom = cx.createRadialGradient(CXm, PY + PH * 0.45, 10,
      CXm, PY + PH * 0.45, PW * 0.78);
    bloom.addColorStop(0, 'rgba(255,206,110,.42)');
    bloom.addColorStop(0.55, 'rgba(214,140,52,.16)');
    bloom.addColorStop(1, 'rgba(214,140,52,0)');
    cx.fillStyle = bloom;
    cx.fillRect(CXm - PW, PY - PH * 0.3, PW * 2, PH * 1.7);

    /* LAYER 1 - the painted frame, with its own drop shadow */
    cx.shadowColor = 'rgba(0,0,0,.55)'; cx.shadowBlur = 22; cx.shadowOffsetY = 8;
    if (ok(ART.uiCard)) cx.drawImage(ART.uiCard, PX, PY, PW, PH);
    else panel(PX, PY, PW, PH, 16);
    cx.shadowColor = 'transparent'; cx.shadowBlur = 0; cx.shadowOffsetY = 0;

    /* LAYER 2 - THE SAFE AREAS, MEASURED OFF THE PLATE ITSELF.
       Every value on this card was placed by a guessed fraction of the card's
       height, and the guesses were wrong: a 54px haul on a baseline at 0.44
       reached up to 0.21, which is out of the recess entirely and into the
       gold crown - the score really was being drawn outside the frame. The
       four numbers below are the painted opening and the painted banner,
       scanned off tp-ui-card.png (contiguous dark interior 0.342-0.687 of
       height by 0.156-0.844 of width; cream banner 0.696-0.842 by
       0.306-0.694). Everything is laid out INSIDE them and centred with
       textBaseline 'middle', so no value can drift out of the art. */
    const oX = PX + PW * 0.156, oW = PW * 0.688;
    const oY = PY + PH * 0.342, oH = PH * 0.345;
    const bX = PX + PW * 0.306, bW = PW * 0.388;
    const bMid = PY + PH * 0.769;
    cx.fillStyle = 'rgba(24,12,4,.30)';
    cx.beginPath();
    if (cx.roundRect) cx.roundRect(oX, oY, oW, oH, 8); else cx.rect(oX, oY, oW, oH);
    cx.fill();

    /* LAYER 3 - the haul, counting up, popping on every coin that lands */
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    const pop = 1 + (W.hudPop || 0) * 0.18;
    cx.save();
    cx.translate(oX + oW / 2, oY + oH * 0.37);
    cx.scale(pop, pop);
    /* IT HAS TO FIT. The size was hard-coded at 54px, so a four-figure haul
       ran straight out through the sides of the recess and the payout - the
       one number the whole run is for - read as broken. It is measured against
       the recess and stepped down until it sits inside it. */
    /* fitted to the opening in BOTH axes, and divided by the pop so that a
       number pulsing on a landed coin cannot punch through the frame at the
       top of its bounce */
    let fs = Math.min(oH * 0.54, 54) / pop;
    cx.font = '800 ' + fs + 'px ui-monospace,monospace';
    while (fs > 14 && cx.measureText(String(shown)).width > oW * 0.88 / pop) {
      fs -= 1; cx.font = '800 ' + fs + 'px ui-monospace,monospace';
    }
    bigNum(String(shown), 0, 0, fs, '#FFE27A');
    cx.restore();

    /* LAYER 4 - the arithmetic that produced it */
    const sumTxt = W.coinsGot + '  ×' + W.mult
      + (W.stars ? '   (' + aliveParty(W).length + '+' + W.stars + '★)' : '  party');
    let sfs = Math.min(13, oH * 0.20);
    cx.font = '600 ' + sfs + 'px ui-monospace,monospace';
    while (sfs > 7 && cx.measureText(sumTxt).width > oW * 0.92) {
      sfs -= 0.5; cx.font = '600 ' + sfs + 'px ui-monospace,monospace';
    }
    cx.fillStyle = 'rgba(255,244,214,.95)';
    cx.fillText(sumTxt, oX + oW / 2, oY + oH * 0.83);

    /* LAYER 5 - the tier, on the frame's own banner, in its own colour */
    if (done && W.tier) {
      /* ON THE BANNER, filling it. The tier hex is picked to read against the
         dark stage, not against cream vellum - SANCTUM's pink vanished into
         the ribbon. It gets a dark carved rim and a lit top edge so it sits
         IN the banner the way stamped lettering would. */
      /* ON the banner and inside its painted ends. It used to sit on a
         baseline at 0.845 against a ribbon that stops at 0.842, so the word
         hung off the bottom of the scroll and ran past both of its ends. */
      const ty = bMid;
      let tfs = Math.min(PH * 0.146 * 0.72, 24);
      cx.font = '800 ' + tfs + 'px ui-monospace,monospace';
      while (tfs > 9 && cx.measureText(W.tier.name).width > bW * 0.90) {
        tfs -= 0.5; cx.font = '800 ' + tfs + 'px ui-monospace,monospace';
      }
      cx.lineJoin = 'round';
      cx.strokeStyle = 'rgba(52,28,8,.92)'; cx.lineWidth = Math.max(3, tfs * 0.26);
      cx.strokeText(W.tier.name, bX + bW / 2, ty);
      const tg = cx.createLinearGradient(0, ty - tfs * 0.6, 0, ty + tfs * 0.5);
      tg.addColorStop(0, '#FFF3C8'); tg.addColorStop(0.55, W.tier.hex);
      tg.addColorStop(1, 'rgba(90,44,10,.95)');
      cx.fillStyle = tg;
      cx.fillText(W.tier.name, bX + bW / 2, ty);
    }
    cx.restore();
  }
}

/* ------------------------------- input ------------------------------------ */
const keys = Object.create(null);
addEventListener('keydown', function (e) {
  if (['Space', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyD') { W.driverOn = !W.driverOn; }
  if (e.code === 'KeyR') restart();
  if (e.code === 'KeyP') W.paused = !W.paused;
  /* Shift+F as asked for, and bare F too - there is nothing else on F and
     having to hold a modifier to get a bigger picture is a small tax to pay
     every time */
  if (e.code === 'KeyF') { e.preventDefault(); toggleFull(); }
});
addEventListener('keyup', function (e) { keys[e.code] = false; });
function humanInput() {
  return { left: !!(keys.ArrowLeft || keys.KeyA), right: !!(keys.ArrowRight || keys.KeyL),
    jump: !!(keys.Space || keys.ArrowUp || keys.KeyW) };
}

/* ------------------------------- the loop --------------------------------- */
let W = makeWorld(SEED);
let acc = 0, last = null;
function frame(ts) {
  schedule();
  if (last === null) last = ts;
  let dt = (ts - last) / 1000; last = ts;
  if (dt > 0.25) dt = 0.25;
  if (W.paused) { draw(W); return; }
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 8) { acc -= STEP; advance(W); }
  driveCamera(W, VIEW_W, dt);
  draw(W); hud();
}

const VERD = { clear: 'good', out: 'bad' };
function hud() {
  const L = leaderOf(W), alive = aliveParty(W).length;
  document.getElementById('h-party').textContent = alive + ' of ' + W.party.length;
  document.getElementById('h-lead').textContent = L.out ? '—' : L.id;
  document.getElementById('h-anim').textContent = L.anim;
  document.getElementById('h-x').textContent = L.x.toFixed(0);
  document.getElementById('h-vy').textContent = L.vy.toFixed(0);
  document.getElementById('h-t').textContent = W.simT.toFixed(2) + 's';
  document.getElementById('h-coins').textContent =
    W.coinsGot + ' ×' + liveMult(W) + (W.stars ? ' (' + W.stars + '★)' : '');
  document.getElementById('h-seed').textContent = W.seed;
  document.getElementById('h-st').textContent =
      W.phase === 'done' ? (W.tier.name + '  ' + W.total)
    : W.phase === 'open' ? 'the chest opens'
    : W.phase === 'lock' ? 'the lock gives'
    : W.phase === 'spend' ? 'spending ' + W.banked + '/' + W.total
    : W.phase === 'gather' ? (W.how === 'wiped' ? 'the camera goes on alone' : 'at the chest')
    : W.driverOn ? 'running' : 'running (keyboard)';
  const label = [
    W.beats[0].verdict === 'out' ? 'he did not make it' : W.beats[0].verdict === 'clear' ? 'he got over it' : null,
    W.beats[1].verdict,
    W.beats[2].verdict ? W.beats[2].verdict + ' made it over' : null,
  ];
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById('bt' + i);
    const sp = el.querySelector('span');
    sp.textContent = label[i] || '—';
    sp.className = W.beats[i].verdict === 'out' ? 'bad'
      : W.beats[i].verdict === 'clear' ? 'good' : 'mid';
    el.className = 'bt' + (W.beats[i].done ? ' done' : (i === 0 || W.beats[i - 1].done ? ' live' : ''));
  }
}

function restart() { W = makeWorld(SEED); acc = 0; }
/* ------------------------------- FULL SCREEN -----------------------------
   Real fullscreen where it exists, a pinned-canvas fallback where it does
   not. Vendor prefixes are still required: Safari has never unprefixed this,
   and the iPhone exposes NEITHER, which is what the fallback is for. */
function fsElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}
function fsSupported() {
  return !!(cv.requestFullscreen || cv.webkitRequestFullscreen);
}
/* DO NOT TRUST THE FULLSCREEN API - CHECK WHETHER IT ACTUALLY WENT FULLSCREEN.
   The first version asked `requestFullscreen` and assumed the only two
   outcomes were "it worked" and "the promise rejected". There is a third, and
   it is the common one: inside an embedded view - the desktop app's browser
   pane, an in-app webview, any iframe served without allow="fullscreen" - the
   method EXISTS, reports itself supported, returns without throwing, and then
   silently does nothing at all. No element, no rejection, no error. So every
   check the old code made passed and the button did nothing, which is exactly
   what you saw.

   The fix is to stop asking the API whether it succeeded and look at the
   document instead: fire the request, then a moment later check whether there
   really is a fullscreen element, and if there is not, blow the canvas up with
   CSS. That one path covers the silent no-op, an async rejection, a synchronous
   throw, and browsers with no API at all (iPhone Safari has never had one for
   anything but <video>) - so the button always does something. */
function blowUp(on) {
  document.body.classList.toggle('blownup', on);
  syncFullBtn();
}
function toggleFull() {
  if (fsElement()) {                                   // leave real fullscreen
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    try { exit.call(document); } catch (e) { }
    return;
  }
  if (document.body.classList.contains('blownup')) return blowUp(false);

  const req = fsSupported() && (cv.requestFullscreen || cv.webkitRequestFullscreen);
  if (!req) return blowUp(true);                        // no API at all
  let asked = false;
  try {
    const r = req.call(cv);
    asked = true;
    if (r && r.catch) r.catch(function () { blowUp(true); });
  } catch (e) { }
  if (!asked) return blowUp(true);
  /* the verification. 220ms is long enough for a real transition to have
     registered and short enough that a failure still feels like the click */
  setTimeout(function () { if (!fsElement()) blowUp(true); }, 220);
}
function syncFullBtn() {
  const on = !!fsElement() || document.body.classList.contains('blownup');
  const b = document.getElementById('btn-fs');
  if (!b) return;
  b.textContent = on ? 'exit full screen' : 'full screen';
  b.classList.toggle('on', on);
}
document.getElementById('btn-fs').onclick = toggleFull;
document.getElementById('btn-fsx').onclick = function () {
  document.body.classList.remove('blownup');
  syncFullBtn();
};
addEventListener('fullscreenchange', syncFullBtn);
addEventListener('webkitfullscreenchange', syncFullBtn);
/* Escape leaves real fullscreen on its own, but not the CSS fallback */
addEventListener('keydown', function (e) {
  if (e.code === 'Escape' && document.body.classList.contains('blownup')) {
    document.body.classList.remove('blownup');
    syncFullBtn();
  }
});
syncFullBtn();

document.getElementById('btn-rst').onclick = restart;
document.getElementById('btn-roll').onclick = function () {
  SEED = 'beats-' + Math.floor(Math.random() * 100000); W = makeWorld(SEED); acc = 0;
};
/* ----------------------- FORCING AN OUTCOME ------------------------------
   These buttons do NOT set the result. They cannot: the outcome is drawn in
   the sealed region before the first frame, and reaching in to overwrite it
   would mean every beat after it - the coins on the floor, the lanes, the
   tier, the payout - was describing something that had not actually been
   drawn. The whole build rests on those agreeing.

   So the button SEARCHES instead. It rolls seeds, runs each one headlessly to
   completion through exactly the same code the live game uses, and stops at
   the first one that happens to produce what you asked for. What you get back
   is an ordinary seed that genuinely plays out that way, which means it is
   replay-identical, it can be shared, and nothing downstream has been lied to.

   The seed is printed next to the buttons for exactly that reason. */
function forceOutcome(test, label, btn) {
  const TRIES = 600;
  const note = document.getElementById('force-note');
  if (btn) btn.classList.add('hunting');
  note.textContent = 'searching...';
  /* let the disabled state paint before the search blocks the thread */
  setTimeout(function () {
    let found = null, tried = 0;
    for (; tried < TRIES && !found; tried++) {
      const seed = 'beats-' + Math.floor(Math.random() * 1000000);
      const r = window.__probe.run(seed, 60);
      if (test(r)) found = { seed: seed, r: r };
    }
    if (btn) btn.classList.remove('hunting');
    if (!found) {
      note.textContent = label + ': no seed in ' + TRIES + ' tries';
      return;
    }
    SEED = found.seed; W = makeWorld(SEED); acc = 0;
    note.textContent = found.seed + '  ->  ' + found.r.tier + '  ' + found.r.total
      + '  (' + found.r.partyFinal + '/' + found.r.partyTotal + ' home, '
      + tried + ' seed' + (tried === 1 ? '' : 's') + ' tried)';
  }, 0);
}
[].forEach.call(document.querySelectorAll('#force button'), function (b) {
  b.onclick = function () {
    const tier = b.getAttribute('data-tier'), want = b.getAttribute('data-want');
    if (tier) return forceOutcome(function (r) { return r.tier === tier; }, tier, b);
    if (want === 'vault') return forceOutcome(
      function (r) { return r.partyFinal === 3; }, 'vault', b);
    /* THREE means three. `partyFinal === partyTotal` also matched a party of
       two that both got home, which is a different picture entirely. */
    if (want === 'all3') return forceOutcome(
      function (r) { return r.partyFinal === 3; }, 'all 3 home', b);
    if (want === 'wipe') return forceOutcome(
      function (r) { return r.partyFinal === 0; }, 'wipe', b);
  };
});

document.getElementById('btn-dump').onclick = function () {
  document.getElementById('log').textContent =
    'SEED ' + W.seed + '\nDRAW ' + JSON.stringify(W.draw, null, 1) + '\n\n'
    + W.events.map(function (e) { return '  ' + String(e.t).padStart(7) + '  ' + JSON.stringify(e); }).join('\n');
};

/* ------------------------------- probes ----------------------------------- */
window.__probe = {
  world: function () { return W; },
  draw: function () { return W.draw; },
  state: function () {
    const L = leaderOf(W);
    return { t: W.simT, x: L.x, y: L.y, vy: L.vy, anim: L.anim, leader: L.id,
      party: aliveParty(W).length, total: W.party.length,
      beats: W.beats.map(function (b) { return b.verdict; }),
      finished: W.finished, wiped: !!W.wiped, openU: W.openU,
      phase: W.phase, coins: W.coinsGot, stars: W.stars, liveMult: liveMult(W),
      mult: W.mult, total: W.total,
      tier: W.tier ? W.tier.name : null };
  },
  events: function () { return W.events; },
  setSeed: function (s) { SEED = s; W = makeWorld(s); acc = 0; return W.draw; },
  setDriver: function (v) { W.driverOn = !!v; },
  restart: restart,
  /* headless: run one seed to completion and report the beats */
  run: function (seed, seconds) {
    const S = makeWorld(seed || SEED);
    const N = 120 * (seconds || 60);
    for (let i = 0; i < N; i++) {
      advance(S);
      if (S.phase === 'done') break;
    }
    return { seed: seed || SEED, draw: S.draw, t: +S.simT.toFixed(2),
      coins: S.coinsGot, stars: S.stars, reach: S.draw.reach, mult: S.mult, total: S.total,
      tier: S.tier ? S.tier.name : null, phase: S.phase, how: S.how,
      beats: S.beats.map(function (b) { return b.verdict; }),
      partyFinal: S.party.filter(function (b) { return !b.out; }).length,
      partyTotal: S.party.length,
      reachedChest: S.finished, wiped: !!S.wiped,
      diag: S.party.map(function(b){return b.driver.diag||null;}),
      events: S.events, errors: window.__consoleErrors.length };
  },
};

/* rAF starvation guard: preview panes report visibilityState 'hidden' and
   never deliver rAF, which froze the clock on frame one. Worker timers escape
   the hidden-page clamp. */
let framePending = false, frameRaf = 0;
const frameWorker = (function () {
  try {
    return new Worker(URL.createObjectURL(new Blob(
      ['setInterval(function(){postMessage(0)},8)'], { type: 'text/javascript' })));
  } catch (e) { return null; }
})();
function pump(ts) { framePending = false; cancelAnimationFrame(frameRaf); frame(ts); }
if (frameWorker) frameWorker.onmessage = function () { if (framePending) pump(performance.now()); };
function schedule() {
  framePending = true;
  frameRaf = requestAnimationFrame(pump);
  if (!frameWorker) setTimeout(function () { if (framePending) pump(performance.now()); }, 16);
}
schedule();
</script>
</body>
</html>
