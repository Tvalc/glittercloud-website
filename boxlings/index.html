<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxlings Battle — Glacier Vault Box</title>
<style>
/* Boxlings Battle — glacial theme */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #070d1c; --panel: #0d1830; --panel2: #122142; --line: #22355c;
  --ink: #d7e4f2; --dim: #7f93b0; --gold: #f2c14e; --goldHi: #ffe9a3;
  --bad: #e8654c; --good: #5fd68a; --accent: #6fb7ff;
  font-size: 15px;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
}
button { font: inherit; cursor: pointer; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: Consolas, monospace; word-break: break-all; }
.tiny { font-size: 0.78rem; color: var(--dim); line-height: 1.45; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* ---------------- topbar ---------------- */
#topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.logo { font-weight: 800; letter-spacing: 2px; font-size: 1.05rem; }
.logo em { color: var(--gold); font-style: normal; }
.boxname { color: var(--dim); font-size: 0.85rem; }
.spacer { flex: 1; }
.ghost {
  background: none; border: 1px solid var(--line); border-radius: 7px;
  padding: 5px 12px; color: var(--dim); font-size: 0.82rem;
}
.ghost:hover { color: var(--ink); border-color: var(--accent); }

/* ---------------- layout ---------------- */
#layout { flex: 1; display: flex; min-height: 0; }
#setup {
  width: 322px; min-width: 322px; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 14px; transition: margin-left 0.5s ease;
}
body.running #setup { margin-left: -322px; }   /* the panel folds away when a run starts */
#setup section { margin-bottom: 18px; }
#setup h3 {
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1.4px;
  color: var(--gold); margin-bottom: 7px;
}
#setup label { display: block; font-size: 0.82rem; color: var(--dim); margin: 7px 0; }
#setup label.row { display: flex; gap: 8px; align-items: center; }
#setup select { width: 100%; margin-top: 3px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px; }
#setup details summary { cursor: pointer; color: var(--accent); font-size: 0.82rem; margin: 4px 0; }
.dropT { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.dropT th { text-align: left; color: var(--dim); font-weight: 600; padding: 3px 4px; border-bottom: 1px solid var(--line); }
.dropT td { padding: 3px 4px; border-bottom: 1px solid #16233f; }
.dropT td.num { text-align: right; white-space: nowrap; }

/* ---------------- stage ---------------- */
#stageWrap { flex: 1; position: relative; min-width: 0; background: #050a16; }
#stage, #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#fxHtml { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.dmgPop {
  position: absolute; font-weight: 800; font-size: 1.5rem; pointer-events: none;
  text-shadow: 0 2px 6px #000; animation: popRise 1.05s ease-out forwards;
}
.dmgPop.gold { color: var(--goldHi); }
.dmgPop.red { color: var(--bad); }
.dmgPop.burn { color: #ff8a4d; font-size: 1rem; }
@keyframes popRise {
  0% { transform: translateY(0) scale(0.6); opacity: 0; }
  18% { transform: translateY(-8px) scale(1.15); opacity: 1; }
  100% { transform: translateY(-52px) scale(1); opacity: 0; }
}

#banner {
  position: absolute; top: 12%; left: 0; right: 0; text-align: center;
  font-weight: 800; font-size: 2rem; letter-spacing: 3px; pointer-events: none;
  opacity: 0; transition: opacity 0.22s, transform 0.22s; transform: translateY(-8px) scale(0.96);
  text-shadow: 0 3px 14px #000;
}
#banner.shown { opacity: 1; transform: none; }
#banner.sub { font-size: 1.1rem; color: var(--dim); letter-spacing: 4px; }
#banner.good { color: var(--good); }
#banner.bad { color: var(--bad); }
#banner.gold { color: var(--gold); }
#banner.omen { color: var(--accent); font-size: 1.3rem; }
#banner.omen.gold { color: var(--gold); }
#banner.rival { color: var(--ink); font-size: 1.3rem; }
#banner.big { font-size: 3.2rem; }

#rivalBar {
  position: absolute; top: 14px; right: 74px; width: 300px;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
#rivalBar.shown { opacity: 1; }
#rivalBar .rname { display: block; font-size: 0.8rem; letter-spacing: 1px; color: var(--dim); margin-bottom: 4px; text-align: right; }
#rivalBar .rhp { display: block; height: 10px; background: #0a1224; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
#rivalBar .rhpfill { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #d8564c, #e8907a); transition: width 0.35s; }
#rivalBar .rhpfill.deep { background: #7a1f16; }

/* the ladder — height reads at a glance */
#ladder {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 5px;
}
.rung {
  width: 44px; height: 30px; border-radius: 6px; border: 1px solid var(--line);
  background: #0a1428cc; display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; color: var(--dim); position: relative; transition: all 0.3s;
}
.rung .rn { font-weight: 700; }
.rung.g-crate { border-color: #7a5426; }
.rung.g-steel { border-color: #8494a6; }
.rung.g-gilded { border-color: var(--gold); }
.rung.g-vault { border-color: var(--gold); box-shadow: 0 0 8px #f2c14e44; height: 38px; }
.rung.current { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 10px #6fb7ff66; animation: pulse 1.2s infinite; }
.rung.won { background: #1d3a2acc; border-color: var(--good); color: var(--good); }
.rung.lost { background: #3a1d1dcc; border-color: var(--bad); color: var(--bad); }
@keyframes pulse { 50% { box-shadow: 0 0 16px #6fb7ffaa; } }

/* team chips */
#team { position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
.chip {
  display: flex; align-items: center; gap: 8px; padding: 5px 10px;
  background: #0a1428cc; border: 1px solid var(--line); border-radius: 8px; min-width: 190px;
  transition: opacity 0.3s;
}
.chip.ko { opacity: 0.4; filter: grayscale(1); }
.chip .dot { width: 14px; height: 14px; border-radius: 50%; }
.chip .cname { font-size: 0.8rem; flex: 1; white-space: nowrap; }
.chip .charm { color: var(--gold); }
.chip .hpbar { width: 64px; height: 7px; background: #0a1224; border-radius: 4px; overflow: hidden; }
.chip .hpfill { display: block; height: 100%; background: var(--good); transition: width 0.35s; }
.chip .hpfill.low { background: var(--bad); }

/* stakes + taps */
#stakes {
  position: absolute; bottom: 76px; left: 0; right: 0; text-align: center;
  font-size: 0.88rem; color: var(--dim); pointer-events: none; text-shadow: 0 2px 6px #000;
  min-height: 1.2em;
}
#actionBtn {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%) scale(0.9);
  padding: 12px 44px; font-size: 1.05rem; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(180deg, #2a4a7d, #1b3157); color: var(--ink);
  border: 1px solid var(--accent); border-radius: 10px; opacity: 0; pointer-events: none;
  transition: opacity 0.15s, transform 0.15s; box-shadow: 0 4px 18px #0009;
}
#actionBtn.shown { opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1); }
#actionBtn.gold { background: linear-gradient(180deg, #b8860b, #7d5b06); border-color: var(--gold); color: #fff8dd; }
#actionBtn:active { transform: translateX(-50%) scale(0.97); }
#skipBtn {
  position: absolute; top: 14px; right: 14px; opacity: 0; pointer-events: none;
  background: none; border: 1px solid var(--line); color: var(--dim);
  border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; transition: opacity 0.2s;
}
#skipBtn.shown { opacity: 1; pointer-events: auto; }

/* the roster — the Parade, persistent, depleting as you climb */
#roster {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: flex-end; gap: 9px;
  padding: 7px 14px; border-radius: 10px;
  background: #0a1428b0; border: 1px solid var(--line);
}
#roster .pip {
  display: flex; align-items: flex-end; justify-content: center;
  color: #55708f; line-height: 1; transition: all 0.35s;
  position: relative;
}
#roster .pip.g-pro { color: #7d8ca0; }
#roster .pip.g-apex { color: #b07ad8; filter: drop-shadow(0 0 5px #b07ad877); }
#roster .pip.g-keeper { color: var(--gold); font-size: 1.05rem; padding-bottom: 2px; }
#roster .pip.current { color: var(--accent); filter: drop-shadow(0 0 7px var(--accent)); transform: translateY(-3px) scale(1.15); }
#roster .pip.g-keeper.current { color: var(--gold); filter: drop-shadow(0 0 9px var(--gold)); }
#roster .pip.done { opacity: 0.22; filter: grayscale(1); transform: scale(0.85); }
#roster .pip.done::after {
  content: ''; position: absolute; left: -2px; right: -2px; top: 50%;
  border-top: 2px solid var(--bad); opacity: 0.8;
}

/* the challenger select slate */
.slateCand { transition: opacity 0.12s linear; }

/* ---------------- overlays ---------------- */
.overlay {
  position: fixed; inset: 0; background: #04081299; backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 20;
}
.overlay.shown { opacity: 1; pointer-events: auto; }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px 26px; max-height: 88vh; overflow-y: auto; box-shadow: 0 12px 50px #000a;
}
.panel h2 { font-size: 1.15rem; letter-spacing: 1px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.panel h2 .x { margin-left: auto; background: none; border: none; color: var(--dim); font-size: 1rem; }
.panel h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.3px; color: var(--gold); margin: 14px 0 7px; }
.big {
  padding: 11px 34px; font-weight: 800; letter-spacing: 2px; font-size: 1rem;
  background: linear-gradient(180deg, #b8860b, #7d5b06); color: #fff8dd;
  border: 1px solid var(--gold); border-radius: 10px;
}
.big:disabled { filter: grayscale(1) brightness(0.6); cursor: default; }
.btnRow { display: flex; gap: 10px; margin-top: 16px; align-items: center; }

/* packing */
.packPanel { width: 720px; max-width: 94vw; }
#packGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0 8px; }
.packCard {
  position: relative; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: border-color 0.15s, transform 0.15s;
}
.packCard:hover { transform: translateY(-3px); }
.packCard.sel { border-color: var(--gold); box-shadow: 0 0 12px #f2c14e33; }
.slotNo {
  position: absolute; top: 7px; left: 9px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--gold); color: #221a04; font-weight: 800; font-size: 0.85rem;
  display: flex; align-items: center; justify-content: center;
}
.packCard:not(.sel) .slotNo { display: none; }
.cardArt { width: 104px; height: 104px; }
.pcName { font-weight: 700; }
.pcEl { font-size: 0.72rem; letter-spacing: 1.6px; text-transform: uppercase; }
.pcBlurb { font-size: 0.7rem; color: var(--dim); text-align: center; min-height: 2.1em; }
.cwRow { display: flex; gap: 6px; margin-top: 5px; }
.sw { width: 15px; height: 15px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.sw.on { border-color: var(--ink); }
.packFoot { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
#nonceInput {
  flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
  border-radius: 8px; padding: 9px 12px; font-family: Consolas, monospace; font-size: 0.85rem;
}
#packOverlay.sealing .packPanel { animation: sealSnap 0.5s ease-in forwards; }
@keyframes sealSnap {
  60% { transform: scale(1.01); }
  100% { transform: scale(0.1) rotate(2deg); opacity: 0; }
}

/* receipt */
.receiptPanel { width: 440px; max-width: 92vw; }
.receiptPanel h2 { color: var(--dim); text-transform: uppercase; letter-spacing: 2px; font-size: 0.95rem; }
.receiptPanel h2.winH { color: var(--good); }
.endLine { margin: 4px 0 14px; color: var(--ink); font-size: 1.02rem; }
.rrow { display: flex; justify-content: space-between; padding: 7px 2px; border-bottom: 1px solid #16233f; font-size: 0.92rem; }
.rrow.item span:first-child { color: var(--goldHi); }
.rrow.winRow { color: var(--good); font-weight: 700; }
.regLines { margin-top: 12px; }
.regLine { font-size: 0.82rem; color: var(--gold); padding: 2px 0; }
.verify { margin-top: 14px; }
.verify summary { cursor: pointer; color: var(--accent); font-size: 0.82rem; }
.demoTag { background: #3a2a10; border: 1px solid var(--gold); color: var(--gold); border-radius: 7px; padding: 5px 10px; font-size: 0.75rem; margin-bottom: 12px; }

/* registry */
.registryPanel { width: 560px; max-width: 94vw; }
.rstats { display: flex; gap: 12px; margin: 8px 0; }
.rstats div { flex: 1; background: var(--panel2); border-radius: 10px; padding: 10px; text-align: center; }
.rstats b { display: block; font-size: 1.15rem; }
.rstats span { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.wcards { display: flex; flex-wrap: wrap; gap: 8px; }
.wcard {
  padding: 8px 13px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2);
  font-size: 0.82rem; color: var(--dim); display: flex; gap: 8px; align-items: center;
}
.wcard.have { color: var(--ink); border-color: var(--accent); }
.wcard.gold.have, .wcard.gold b { color: var(--gold); }
.wcard.gold.have { border-color: var(--gold); box-shadow: 0 0 10px #f2c14e44; }
.stamps { max-height: 180px; overflow-y: auto; }
.stamp { font-size: 0.82rem; padding: 3px 0; color: var(--ink); }
#regReset { margin-top: 14px; }

/* stable — the live scoreboard */
.stablePanel { width: 780px; max-width: 96vw; }
.sbHead {
  display: flex; align-items: baseline; gap: 14px; padding: 10px 12px;
  background: #0b1730; border: 1px solid var(--line); border-bottom: 2px solid var(--gold);
  border-radius: 9px 9px 0 0;
}
.sbWave { font-weight: 800; letter-spacing: 2.5px; }
.sbSpend { color: var(--dim); font-size: 0.8rem; letter-spacing: 1px; }
.sbCount { margin-left: auto; font-size: 0.76rem; color: var(--dim); letter-spacing: 1.2px; }
.sbCount b { color: var(--ink); }

.sbRows { border: 1px solid var(--line); border-top: none; border-radius: 0 0 9px 9px; overflow: hidden; }
.sbRow {
  display: grid; align-items: center; gap: 8px; padding: 7px 10px;
  grid-template-columns: 46px 66px 108px 1fr 156px 66px 58px;
  border-bottom: 1px solid #16233f; font-size: 0.83rem; transition: background 0.35s;
}
.sbRow:last-child { border-bottom: none; }
.sbRow.live { background: #101d38; }
.sbRow.good { background: #12301f; }
.sbRow.grail { background: #3a2a10; box-shadow: inset 0 0 0 1px var(--gold); }
.sbNo { color: var(--dim); font-variant-numeric: tabular-nums; }
.sbStatus { font-size: 0.68rem; letter-spacing: 1.3px; color: var(--dim); display: flex; align-items: center; gap: 5px; }
.sbStatus.live { color: #ff6b5a; }
.sbStatus .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff3b2f; animation: sbPulse 1s infinite; }
@keyframes sbPulse { 50% { opacity: 0.2; } }
.sbPos { font-weight: 700; letter-spacing: 0.6px; font-variant-numeric: tabular-nums; }
.sbRow.vault .sbPos { color: var(--gold); }
.sbTrack { height: 5px; background: #0a1224; border-radius: 3px; overflow: hidden; }
.sbTrack i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #3f6fa8, #6fb7ff); transition: width 0.45s cubic-bezier(.3,1.4,.5,1); }
.sbRow.vault .sbTrack i { background: linear-gradient(90deg, #b8860b, var(--gold)); }
.sbItem { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sbItem.revealed { color: var(--goldHi); animation: sbReveal 0.4s ease-out; }
@keyframes sbReveal { from { opacity: 0; transform: translateY(-5px); } }
.sbVal { text-align: right; }
.sbVal.good { color: var(--good); font-weight: 700; }
.sbReplay { opacity: 0; pointer-events: none; padding: 3px 8px; font-size: 0.68rem; transition: opacity 0.3s; }
.sbReplay.shown { opacity: 1; pointer-events: auto; }

.sbFoot { margin-top: 10px; }
.sbTop { padding: 10px 12px; background: var(--panel2); border: 1px solid var(--gold); border-radius: 9px; font-size: 0.9rem; }
.sbTop b { color: var(--goldHi); }
.sbWaveTot { color: var(--dim); }
.sbTicker { margin-top: 8px; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: #0a1428; padding: 5px 0; }
.sbTickerInner { display: inline-flex; gap: 12px; white-space: nowrap; animation: sbTick 26s linear infinite; }
@keyframes sbTick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.tk { font-size: 0.73rem; color: var(--dim); }
.tk.good { color: var(--good); }
.tkSep { color: #33507a; }
.sbNote { margin-top: 9px; }

/* ---------------- svg animation bits ---------------- */
.snowflake { animation: snowfall linear infinite; }
@keyframes snowfall {
  from { transform: translateY(0); }
  to { transform: translateY(560px); }
}
.aurora { animation: auroraDrift 14s ease-in-out infinite alternate; }
.aurora.a2 { animation-duration: 19s; animation-delay: -6s; }
@keyframes auroraDrift {
  from { transform: translateX(-30px); opacity: 0.75; }
  to { transform: translateX(30px); opacity: 1; }
}
.creature .exv { display: none; }
.creature[data-ex="normal"] .exv-normal,
.creature[data-ex="worried"] .exv-worried,
.creature[data-ex="fierce"] .exv-fierce,
.creature[data-ex="dizzy"] .exv-dizzy,
.creature[data-ex="ko"] .exv-ko,
.creature[data-ex="happy"] .exv-happy { display: block; }
.creature .anim { transform-origin: 0px 0px; }
.box .anim { transform-origin: 0px 0px; }

@media (max-width: 900px) {
  #setup { display: none; }
  #packGrid { grid-template-columns: repeat(2, 1fr); }
}

</style>

<body>
<div id="app">
  <header id="topbar">
    <span class="logo">BOXLINGS <em>BATTLE</em></span>
    <span class="boxname">Glacier Vault Box · $25.00 · 18+</span>
    <span class="spacer"></span>
    <button id="packBtn" class="ghost">Re-pack</button>
    <button id="stableBtn" class="ghost">The Stable ×10</button>
    <button id="registryBtn" class="ghost">Registry</button>
  </header>

  <div id="layout">
    <aside id="setup">
      <div id="setupBody"></div>
    </aside>

    <main id="stageWrap">
      <div id="stage"></div>
      <div id="fxHtml"></div>
      <div id="banner"></div>
      <div id="rivalBar"><span class="rname"></span><span class="rhp"><span class="rhpfill"></span></span></div>
      <div id="ladder"></div>
      <div id="team"></div>
      <div id="roster"></div>
      <div id="stakes"></div>
      <button id="actionBtn"></button>
      <button id="skipBtn">SKIP ▸</button>
    </main>
  </div>

  <!-- packing -->
  <div id="packOverlay" class="overlay">
    <div class="panel packPanel">
      <h2>Pack your box</h2>
      <p class="tiny">Three Boxlings, colours, order — your signature on the draw. Every possible packing is exactly as lucky as every other, and the seal is the draw.</p>
      <div id="packGrid"></div>
      <p id="packHint" class="tiny"></p>
      <div class="packFoot">
        <input id="nonceInput" placeholder="optional: your own seed words" spellcheck="false">
        <button id="sealBtn" class="big">SEAL IT</button>
      </div>
    </div>
  </div>

  <!-- receipt -->
  <div id="receiptOverlay" class="overlay">
    <div class="panel receiptPanel">
      <div id="receiptBody"></div>
      <div class="btnRow">
        <button id="againBtn" class="big">OPEN AGAIN</button>
        <button id="repackBtn" class="ghost">Re-pack</button>
        <button id="recStableBtn" class="ghost">Stable ×10</button>
      </div>
    </div>
  </div>

  <!-- registry -->
  <div id="registryOverlay" class="overlay">
    <div class="panel registryPanel">
      <h2>The Registry <button id="registryClose" class="x">✕</button></h2>
      <div id="registryBody"></div>
    </div>
  </div>

  <!-- the stable -->
  <div id="stableOverlay" class="overlay">
    <div class="panel stablePanel">
      <h2>The Stable — one wave, one seed <button id="stableClose" class="x">✕</button></h2>
      <div id="stableBody"></div>
    </div>
  </div>

/* ---- js/fair.js ---- */
/* Boxlings Battle — fairness core.
   Pure, synchronous, dependency-free. The prize is a function of
   (serverSeed, clientSeed, openIndex) and nothing else. */
window.BB = window.BB || {};
BB.fair = (() => {

  // ---- SHA-256 (compact, sync, correct for byte arrays) ----
  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

  function utf8(s){ const out=[]; for(let i=0;i<s.length;i++){ let c=s.codePointAt(i);
    if(c>0xffff) i++;
    if(c<0x80) out.push(c);
    else if(c<0x800){ out.push(0xc0|c>>6, 0x80|c&63); }
    else if(c<0x10000){ out.push(0xe0|c>>12, 0x80|c>>6&63, 0x80|c&63); }
    else { out.push(0xf0|c>>18, 0x80|c>>12&63, 0x80|c>>6&63, 0x80|c&63); } }
    return out; }

  function sha256Bytes(bytes){
    const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const l = bytes.length;
    const msg = bytes.slice();
    msg.push(0x80);
    while (msg.length % 64 !== 56) msg.push(0);
    const hi = Math.floor(l*8 / 0x100000000), lo = (l*8) >>> 0;
    msg.push(hi>>>24&255, hi>>>16&255, hi>>>8&255, hi&255, lo>>>24&255, lo>>>16&255, lo>>>8&255, lo&255);
    const w = new Array(64);
    const rr = (x,n)=> (x>>>n | x<<(32-n)) >>> 0;
    for(let i=0;i<msg.length;i+=64){
      for(let t=0;t<16;t++) w[t] = (msg[i+t*4]<<24 | msg[i+t*4+1]<<16 | msg[i+t*4+2]<<8 | msg[i+t*4+3]) >>> 0;
      for(let t=16;t<64;t++){
        const s0 = rr(w[t-15],7) ^ rr(w[t-15],18) ^ (w[t-15]>>>3);
        const s1 = rr(w[t-2],17) ^ rr(w[t-2],19) ^ (w[t-2]>>>10);
        w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
      }
      let [a,b,c,d,e,f,g,h] = H;
      for(let t=0;t<64;t++){
        const S1 = rr(e,6)^rr(e,11)^rr(e,25);
        const ch = (e&f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
        const S0 = rr(a,2)^rr(a,13)^rr(a,22);
        const maj = (a&b)^(a&c)^(b&c);
        const t2 = (S0 + maj) >>> 0;
        h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
      }
      H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
      H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
    }
    const out=[];
    for(const x of H) out.push(x>>>24&255, x>>>16&255, x>>>8&255, x&255);
    return out;
  }

  const toHex = bytes => bytes.map(b=>b.toString(16).padStart(2,'0')).join('');
  const sha256Hex = s => toHex(sha256Bytes(utf8(s)));

  function hmacSha256Hex(keyStr, msgStr){
    let key = utf8(keyStr);
    if (key.length > 64) key = sha256Bytes(key);
    while (key.length < 64) key.push(0);
    const ipad = key.map(b=>b^0x36), opad = key.map(b=>b^0x5c);
    const inner = sha256Bytes(ipad.concat(utf8(msgStr)));
    return toHex(sha256Bytes(opad.concat(inner)));
  }

  // ---- PRNG streams, domain-separated from the seal ----
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* A stream is a PRNG seeded by HMAC(seal, label). "outcome", "script",
     "tells" and "cosmetic" can never contaminate one another, and every
     stream replays bit-identically from the seal. */
  function stream(sealHex, label){
    const h = hmacSha256Hex(sealHex, 'stream:' + label);
    return mulberry32(parseInt(h.slice(0, 8), 16));
  }

  function randomHex(nBytes){
    const a = new Uint8Array(nBytes);
    crypto.getRandomValues(a);
    return toHex(Array.from(a));
  }

  // rng helpers
  const pick = (rng, arr) => arr[Math.floor(rng()*arr.length)];
  const rint = (rng, lo, hi) => lo + Math.floor(rng()*(hi-lo+1)); // inclusive
  function weighted(rng, entries){ // entries: [{weight, ...}]
    const total = entries.reduce((s,e)=>s+e.weight, 0);
    let r = rng()*total;
    for(const e of entries){ r -= e.weight; if (r < 0) return e; }
    return entries[entries.length-1];
  }

  function makeSeal(serverSeed, clientSeed, openIndex){
    return hmacSha256Hex(serverSeed, clientSeed + '|' + openIndex);
  }

  return { sha256Hex, hmacSha256Hex, mulberry32, stream, randomHex,
           pick, rint, weighted, makeSeal };
})();

  /* Value bands. The band a prize falls in is a property of the DROP TABLE and
     never changes; where a band ends its run is a property of the LADDER,
     which is a preset. Changing ladder height therefore changes how a prize is
     dramatised, never which prize you get — the item is drawn before the
     terminal rung is chosen, from the same stream position either way. */
  const bands = [
    { i:0, label:'under 0.35×',  range:[0,    0.35],  share:'59.95%' },
    { i:1, label:'0.35× – 0.8×', range:[0.35, 0.8 ],  share:'26%'    },
    { i:2, label:'0.8× – 1.6×',  range:[0.8,  1.6 ],  share:'10%'    },

    { i:4, label:'8× or more',   range:[8, Infinity], share:'0.05%'  },
  ];

  /* THE LADDER — a preset, not a constant.
     Rung 1 is always the opener and the top rung is always the Vault, so a
     height-H ladder has H-2 battle rungs. `bandRungs[i]` says where band i
     ends; terminal === height with vaultWin=false is the near-miss (red
     crack), and band 4 takes the Vault (gold crack).

     A note on the 3-rung ladder: five bands cannot each own a distinct height
     when only four outcomes exist (fall at 1, fall at 2, Vault denied, Vault
     taken), so bands 1 and 2 share rung 2. That is the design's own
     "neighbouring bands share rungs" ambiguity rather than a compromise — but
     it does mean the Vault is reached on ~4% of runs instead of ~1.5%. */
  const ladderPresets = [
    {
      id:'3', label:'3 rungs — opener, one battle, the Vault', height:3,
      rungGrade:    { 2:'pro' },
      rungBoxGrade: { 1:'cardboard', 2:'steel', 3:'vault' },
      earlySlots:   [0],                       // parade indices eligible for the apex tell
      bandRungs: [
        [{ r:1, weight:1 }],
        [{ r:2, weight:1 }],
        [{ r:2, weight:1 }],                   // shares rung 2 with band 1
        [{ r:3, weight:1 }],                   // the Vault, denied
        [{ r:3, weight:1, vaultWin:true }],
      ],
    },
    {
      id:'5', label:'5 rungs — opener, three battles, the Vault', height:5,
      rungGrade:    { 2:'scrappy', 3:'pro', 4:'apex' },
      rungBoxGrade: { 1:'cardboard', 2:'crate', 3:'steel', 4:'gilded', 5:'vault' },
      earlySlots:   [0, 1],                    // rungs 2 and 3
      bandRungs: [
        [{ r:1, weight:1 }],
        [{ r:2, weight:62 }, { r:3, weight:38 }],
        [{ r:3, weight:48 }, { r:4, weight:52 }],
        [{ r:4, weight:38 }, { r:5, weight:62 }],
        [{ r:5, weight:1, vaultWin:true }],
      ],
    },
    {
      id:'10', label:'10 rungs — the original ladder', height:10,
      rungGrade:    { 2:'scrappy',3:'scrappy',4:'pro',5:'pro',6:'pro',7:'apex',8:'apex',9:'apex' },
      rungBoxGrade: { 1:'cardboard',2:'cardboard',3:'cardboard',4:'crate',5:'crate',6:'crate',
                      7:'steel',8:'steel',9:'gilded',10:'vault' },
      earlySlots:   [1, 2, 3, 4],              // rungs 3-6
      bandRungs: [
        [{ r:1, weight:1 }],
        [{ r:2, weight:55 }, { r:3, weight:45 }],
        [{ r:4, weight:55 }, { r:5, weight:45 }],
        [{ r:6, weight:30 },{ r:7, weight:25 },{ r:8, weight:20 },{ r:9, weight:15 },{ r:10, weight:10 }],
        [{ r:10, weight:1, vaultWin:true }],
      ],
    },
  ];

  let activeLadder = ladderPresets[0];
  const ladder = () => activeLadder;
  const setLadder = id => { activeLadder = ladderPresets.find(p => p.id === id) || activeLadder; };
  const bandRungs = i => activeLadder.bandRungs[i];

  /* Elements. Four everyday + Aurum. The cycle: Ember>Bramble>Volt>Frost>Ember.
     One immunity exists (Frost is immune to Bramble) and the planner never
     routes an attack into it. Aurum lands double on everything. */
  const elements = {
    ember:   { name:'Ember',   color:'#ff8a4d', beats:'bramble' },
    bramble: { name:'Bramble', color:'#8fdc7f', beats:'volt'    },
    volt:    { name:'Volt',    color:'#ffd94d', beats:'frost'   },
    frost:   { name:'Frost',   color:'#8fd6ff', beats:'ember'   },
    aurum:   { name:'Aurum',   color:'#ffd700', beats:'*'       },
  };
  const immunity = { attacker:'bramble', defender:'frost' };

  function effectiveness(att, def){
    if (att === 'aurum') return 2;
    if (att === immunity.attacker && def === immunity.defender) return 0; // never routed
    if (elements[att].beats === def) return 2;
    if (elements[def].beats === att) return 0.5;
    return 1;
  }

  const moves = {
    ember:   [ { id:'scorch',  name:'Scorch Seam',   base:[14,20] },
               { id:'flarep',  name:'Flare Punt',    base:[20,28] } ],
    bramble: [ { id:'lash',    name:'Twine Lash',    base:[14,20] },
               { id:'tangle',  name:'Overgrow Tangle', base:[20,28] } ],
    volt:    [ { id:'zap',     name:'Static Snap',   base:[14,20] },
               { id:'surge',   name:'Crate Surge',   base:[20,28] } ],
    frost:   [ { id:'rime',    name:'Rime Jab',      base:[14,20] },
               { id:'aval',    name:'Avalanche Roll',base:[20,28] } ],
    aurum:   [ { id:'gild',    name:'Gilding Strike',base:[26,34] },
               { id:'sunfall', name:'Sunfall',       base:[34,44] } ],
  };

  /* The six offered Boxlings. Player packs three. */
  const species = [
    { id:'cindersnap',  name:'Cindersnap',  el:'ember',   blurb:'Kraft-paper hide, smoulders at the seams.' },
    { id:'frostuft',    name:'Frostuft',    el:'frost',   blurb:'Bubble-wrap ruff, breath like powder snow.' },
    { id:'voltcrate',   name:'Voltcrate',   el:'volt',    blurb:'Crate-slat shell, static in the straw.' },
    { id:'bramblewrap', name:'Bramblewrap', el:'bramble', blurb:'Twine-bound, always sprouting somewhere.' },
    { id:'pyrepip',     name:'Pyrepip',     el:'ember',   blurb:'Foam-peanut mane, one ember tail.' },
    { id:'glacierkin',  name:'Glacierkin',  el:'frost',   blurb:'A little box gone to rime and starlight.' },
  ];

  const colorways = [
    { id:'kraft',    name:'Kraft',    body:'#c9a06b', trim:'#8a6a42' },
    { id:'snowmail', name:'Snowmail', body:'#e4edf2', trim:'#9db4c0' },
    { id:'midnight', name:'Midnight', body:'#5b6b8c', trim:'#38455e' },
    { id:'stamp',    name:'Stamp Red', body:'#c96b6b', trim:'#8a4242' },
  ];

  /* Rival handlers by grade. Cosmetic stream picks names/skins; grade is
     structural (a strong pack must never fall to something that looks weak). */
  const rivals = {
    scrappy: { label:'Scrappy', hp:[70, 95],  names:['Courier Brann','Packrat Sil','Dockhand Mo','Skip Tracer Une'] },
    pro:     { label:'Pro',     hp:[95, 120], names:['Rime Warden Olyx','Freightmaster Vell','Customs Agent Hark','The Palletier'] },
    apex:    { label:'Apex',    hp:[120,150], names:['Coldline Sovereign','The Manifest','Warden of Ninth Shelf','Glacier Prime'] },
    keeper:  { label:'Keeper',  hp:[150,170], names:['The Vaultkeeper'] },
  };
  const rivalSpecies = ['cindersnap','frostuft','voltcrate','bramblewrap','pyrepip','glacierkin'];

  // Both are pure functions of height, which is what keeps them legal as tells.
  const gradeForRung    = r => activeLadder.rungGrade[r] || 'keeper';
  const boxGradeForRung = r => activeLadder.rungBoxGrade[r] || 'vault';

  /* Timing presets (ms). The design's open question is settled in the hand,
     so the opener length is a toggle, never a constant. */
  const timingPresets = [
    { id:'2.5', label:'2.5s (UK slot floor)', opener:{ drop:330, parade:500, windup:420, hitstop:170, branch:750, settle:830 } },
    { id:'3.0', label:'3.0s (primary)',       opener:{ drop:400, parade:600, windup:500, hitstop:200, branch:900, settle:1000 } },
    { id:'3.5', label:'3.5s',                 opener:{ drop:470, parade:700, windup:580, hitstop:230, branch:1050, settle:1170 } },
    { id:'4.0', label:'4.0s (benchmark parity)', opener:{ drop:530, parade:800, windup:670, hitstop:270, branch:1200, settle:1330 } },
  ];
  const lossDelta = 0.9; // loss beats run at 90% duration — losses resolve quicker on purpose
  const rungWiden = r => 1 + 0.07 * Math.max(0, r - 1); // beats widen with height ALONE

  /* The floor gag pool. Every entry cleared the affection charter. */
  const gags = [
    { id:'explosion', name:'The Explosion',       register:'slapstick', charterApproved:true },
    { id:'punt',      name:'The Punt',            register:'slapstick', charterApproved:true },
    { id:'siton',     name:'The Sit-On',          register:'slapstick', charterApproved:true },
    { id:'peek',      name:'The Peek & Retreat',  register:'slapstick', charterApproved:true },
    { id:'fright',    name:'The Faint From Fright', register:'slapstick', charterApproved:true },
  ];

  /* Published omen rates. An omen must move the player's odds when it fires. */
  const omens = {
    stormFront: {
      name:'Storm Front', desc:'The sky turns gold-grey between battles.',
      rates: { low:0.06, mid:0.30, high:0.62, grail:0.62 },   // by band group
      window:[2,5],
    },
    auricTrace: {
      name:'Auric Trace', desc:'A rival box wobbles and leaks gold.',
      rates: { low:0.02, mid:0.10, high:0.30, grail:0.80 },
      window:[3,9],
    },
    goldMeteor: {
      name:'Gold Meteor', desc:'Cracks the Vault gold. Conclusive. Never false.',
      rates: { grailOnly:0.35 },
    },
  };
  function bandGroup(bandI){ return bandI<=1 ? 'low' : bandI===2 ? 'mid' : bandI===3 ? 'high' : 'grail'; }

  /* Parade: silhouettes dealt AFTER the seal; apex count correlates with band
     at these published rates (index = number of apex silhouettes, 0-3). */
  const paradeApexWeights = {
    low:   [55, 35, 9, 1],
    mid:   [25, 45, 25, 5],
    high:  [8, 27, 45, 20],
    grail: [2, 18, 45, 35],
  };

  /* Interaction model. The run is watched, not played: packing is the only
     choice in the design, and everything after the seal resolves itself.
     Kept as a toggle so the alternative is a demo switch, not a second build. */
  const interactionPresets = [
    { id:'watch',    label:'Packing only — everything auto', resolveTaps:false, witness:'auto' },
    { id:'ritual',   label:'Packing + WITNESS tap',          resolveTaps:false, witness:'tap'  },
    { id:'handson',  label:'Packing + all resolve taps',     resolveTaps:true,  witness:'tap'  },
  ];

  /* The Challenger Select replaces the door. The ceremony lengthens with
     height and nothing else — the sweep is theater over a predetermined
     landing, so it cannot carry outcome information. */
  const challengerSelect = {
    scrappy: { sweepMs: 620,  hovers:0, shake:4  },
    pro:     { sweepMs: 1150, hovers:1, shake:6  },
    apex:    { sweepMs: 2100, hovers:2, shake:9  },
    keeper:  { sweepMs: 0,    hovers:0, shake:0  },   // the Vault has no select
  };

  const badges = [
    { id:'first-open',   name:'First Seal',     desc:'Sealed your first box.' },
    { id:'witness',      name:'Witness',        desc:'Stood before the Vault.' },
    // Both thresholds scale with ladder height — a 3-rung run has one battle,

    { id:'apex-faced',   name:'Apex Handler',   desc:'Faced the apex challengers of a whole run.' },
    { id:'charm-saved',  name:'Charm Holder',   desc:'Watched a Charm hold at 1 HP.' },

    { id:'mono-climb',   name:'Doubled Down',   desc:'Climbed past the halfway rung on a pack of only two elements.' },

           rivals, rivalSpecies, gradeForRung, boxGradeForRung,
           timingPresets, lossDelta, rungWiden, gags, omens, bandGroup,
           paradeApexWeights, badges, interactionPresets, challengerSelect,
           ladderPresets, ladder, setLadder, bandRungs };

  // ---------------------------------------------------------------- arena
  function arena(){
    let spires = '';
    const sp = [[60,180],[150,120],[830,150],[915,200],[770,110]];
    for(const [x,h] of sp){
      spires += `<path d="M ${x-42} 360 L ${x} ${360-h} L ${x+42} 360 Z" fill="url(#iceWall)" opacity="0.8"/>
                 <path d="M ${x-10} ${360-h+18} L ${x} ${360-h} L ${x+10} ${360-h+18} Z" fill="#bfe6ff" opacity="0.5"/>`;
    }
    let snow = '';
    for(let i=0;i<26;i++){
      const x = Math.round((i*137)%960), d = 9 + (i%7)*2.6, delay = (i*0.83)%9;
      snow += `<circle class="snowflake" cx="${x}" cy="-10" r="${1+(i%3)*0.7}" fill="#dff1ff" opacity="0.7"
                style="animation-duration:${d}s;animation-delay:-${delay}s"/>`;
    }
    return `
    <svg id="arenaSvg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice">
      ${DEFS}
      <rect id="sky" width="960" height="540" fill="url(#skyGrad)"/>

        <path class="aurora a2" d="M -50 160 C 260 100, 500 210, 760 130 S 1000 180, 1020 130 L 1020 40 C 800 90, 500 40, 200 120 S -20 120, -50 100 Z" fill="url(#auroraGrad)" opacity="0.6"/>

        <path d="M 400 210 L 480 40 L 560 210 Z" fill="url(#iceWall)" opacity="0.9"/>
        <path d="M 470 60 L 480 40 L 490 60 Z" fill="#bfe6ff" opacity="0.5"/>
        <rect x="448" y="104" width="64" height="86" rx="6" fill="#141f36" stroke="#f2c14e" stroke-width="2"/>
        <circle cx="480" cy="142" r="19" fill="none" stroke="#f2c14e" stroke-width="2.6"/>
        <circle cx="480" cy="142" r="7" fill="#f2c14e" opacity="0.85"/>
        <path d="M 480 123 v 8 M 480 153 v 8 M 461 142 h 8 M 491 142 h 8" stroke="#f2c14e" stroke-width="2"/>
        <path d="M 430 210 h 100" stroke="#9fd3e8" stroke-width="3" opacity="0.5"/>

      <rect id="dimmer" width="960" height="540" fill="#02060f" opacity="0" pointer-events="none"/>
    </svg>`;
  }

  const wrap = (cls, inner, extra='') =>

  const collar = charm => charm ? `
    <g class="collarG">
      <path class="collarBand" d="M -26 -34 Q 0 -24 26 -34" stroke="#7a2e2e" stroke-width="6" fill="none"/>

  // ------------------------------------------------------------ creatures
  /* Each species builds on a common blob-with-feet anatomy; the accents and
     silhouette carry the identity. tint = colorway body override. */
  function creature(spId, opts={}){
    const { tint=null, charm=false, cls='' } = opts;
    const spec = BB.config.species.find(s=>s.id===spId) || BB.config.species[0];
    const elC = BB.config.elements[spec.el].color;
    const body = tint || '#c9a06b';
    const dark = shade(body, -28);
    let inner = '';

    const feet = `
      <ellipse cx="-18" cy="-4" rx="12" ry="7" fill="${dark}"/>
      <ellipse cx="18"  cy="-4" rx="12" ry="7" fill="${dark}"/>`;

    if (spId==='cindersnap'){
      inner = `${feet}
      <path d="M -34 -10 Q -40 -66 0 -72 Q 40 -66 34 -10 Q 20 0 0 0 Q -20 0 -34 -10 Z" fill="${body}" stroke="${dark}" stroke-width="2.4"/>
      <path d="M -30 -22 L 30 -40" stroke="${shade(body,-14)}" stroke-width="7" opacity="0.7"/>
      <path class="emberSeam" d="M -32 -14 Q -20 -8 -6 -12 M 8 -8 Q 22 -12 32 -18" stroke="${elC}" stroke-width="2.4" fill="none" filter="url(#softGlow)" opacity="0.9"/>
      <path class="crest" d="M -20 -66 Q -16 -90 -4 -78 Q 0 -100 10 -80 Q 20 -94 20 -68 Z" fill="${elC}" filter="url(#softGlow)"/>
      <path d="M -12 -70 Q -4 -86 2 -74 Q 8 -84 10 -70 Z" fill="#ffe9a3" opacity="0.8"/>

    else if (spId==='frostuft'){
      let ruff='';
      for(let i=0;i<8;i++){ const a=Math.PI*(1.05+0.9*i/7); const x=Math.cos(a)*30, y=-16+Math.sin(a)*9;
        ruff += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9.5" fill="#eaf6ff" stroke="#a8cee6" stroke-width="2" opacity="0.97"/>`; }
      inner = `${feet}
      <path d="M -32 -8 Q -38 -60 0 -66 Q 38 -60 32 -8 Q 18 0 0 0 Q -18 0 -32 -8 Z" fill="${mix(body,'#dfeefc',0.5)}" stroke="${dark}" stroke-width="2.4"/>
      <path class="tuft" d="M -26 -58 Q -38 -88 -8 -70 Z" fill="${elC}" stroke="${shade(elC,-30)}" stroke-width="1.6"/>

      <g class="ruff">${ruff}</g>
      ${face(0,-40)} ${collar(charm)}`;
    }
    else if (spId==='voltcrate'){
      inner = `${feet}
      <rect x="-32" y="-64" width="64" height="62" rx="10" fill="${body}" stroke="${dark}" stroke-width="2.6"/>
      <path d="M -32 -46 H 32 M -32 -26 H 32" stroke="${dark}" stroke-width="2" opacity="0.55"/>
      <rect x="-24" y="-58" width="48" height="30" rx="9" fill="${mix(body,'#f2e9d8',0.72)}" stroke="${dark}" stroke-width="1.8"/>
      <circle cx="22" cy="-14" r="4.6" fill="${dark}" opacity="0.6"/>
      <path class="bolt" d="M -18 -64 L -24 -84 L -14 -76 L -16 -92 L -6 -70 L -12 -74 Z" fill="${elC}" filter="url(#softGlow)"/>
      <path class="bolt" d="M 18 -64 L 26 -80 L 17 -74 L 22 -88 L 8 -68 L 14 -71 Z" fill="${elC}" filter="url(#softGlow)" opacity="0.9"/>
      ${face(0,-42)} ${collar(charm)}`;
    }
    else if (spId==='bramblewrap'){
      inner = `${feet}
      <path d="M -30 -6 Q -40 -58 0 -70 Q 40 -58 30 -6 Q 16 2 0 2 Q -16 2 -30 -6 Z" fill="${mix(body,'#9ccf8a',0.35)}" stroke="${dark}" stroke-width="2.4"/>
      <path d="M -31 -16 Q 0 -6 31 -18 M -25 -60 Q 0 -68 25 -60" stroke="#6b4f2a" stroke-width="4.4" fill="none" opacity="0.85"/>
      <path d="M -31 -16 Q 0 -6 31 -18" stroke="#8a6a42" stroke-width="1.6" fill="none" stroke-dasharray="3 4"/>
      <g class="sprout">
        <path d="M 0 -70 Q -1 -82 2 -88" stroke="#4f7a3a" stroke-width="3" fill="none"/>
        <path d="M 2 -88 Q -10 -94 -14 -84 Q -4 -80 2 -88 Z" fill="${elC}"/>
        <path d="M 2 -88 Q 14 -96 18 -86 Q 8 -80 2 -88 Z" fill="${shade(elC,-18)}"/>
      </g>
      ${face(0,-40)} ${collar(charm)}`;
    }
    else if (spId==='pyrepip'){
      let mane='';
      for(let i=0;i<9;i++){ const a=Math.PI*(0.02+0.96*i/8); const x=Math.cos(a)*40, y=-34-Math.sin(a)*40;
        mane += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="10" ry="7" fill="#f2e4c8" stroke="#cdbc9a" stroke-width="1.4" transform="rotate(${(a*57.3-90).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`; }
      inner = `${feet}
      <g class="mane">${mane}</g>
      <circle cx="0" cy="-34" r="30" fill="${body}" stroke="${dark}" stroke-width="2.4"/>
      <path class="tail" d="M 26 -14 Q 46 -18 44 -36 Q 43 -46 34 -46" stroke="${elC}" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>
      <circle cx="34" cy="-46" r="5" fill="${elC}" filter="url(#softGlow)"/>

    else { // glacierkin
      inner = `${feet}
      <rect x="-28" y="-58" width="56" height="56" rx="8" fill="${mix(body,'#cfe4f4',0.55)}" stroke="${dark}" stroke-width="2.4"/>

      <path class="rime" d="M -28 -2 l 6 -8 l 5 8 l 6 -10 l 6 10 l 5 -8 l 6 8" stroke="#eaf8ff" stroke-width="2.6" fill="none"/>
      <path class="spark" d="M 20 -70 l 2.6 6 l 6 2.6 l -6 2.6 l -2.6 6 l -2.6 -6 l -6 -2.6 l 6 -2.6 Z" fill="#dff5ff" filter="url(#softGlow)"/>
      ${face(0,-34,0.9)} ${collar(charm)}`;
    }

    return wrap(`creature sp-${spId} ${cls}`, inner, `data-ex="normal"`);
  }

  // --------------------------------------------------------------- boxes

    } else if (grade==='gilded'){

      <rect x="-54" y="-92" width="108" height="92" rx="10" fill="url(#goldGrad)" stroke="#8a6508" stroke-width="3" filter="url(#softGlow)"/>

      </g>

  /* Cardboard burst fragments (shared by the continue-branch and gags). */
  function fragments(){
    const polys = [
      [-40,-60,'M 0 0 L 26 -8 L 20 16 L -4 14 Z'],
      [30,-70,'M 0 0 L 22 6 L 10 22 L -6 12 Z'],
      [-16,-30,'M 0 0 L 18 -12 L 26 6 L 6 12 Z'],
      [22,-24,'M 0 0 L 16 -6 L 22 12 L 2 14 Z'],
      [-36,-16,'M 0 0 L 20 -4 L 12 16 Z'],
      [8,-88,'M 0 0 L 18 -10 L 24 8 Z'],

    let s='';
    polys.forEach(([x,y,d],i)=>{
      s += `<g class="frag frag-${i}" transform="translate(${x} ${y})"><path d="${d}" fill="${i%2?'#d8b078':'#b08a52'}" stroke="#7d5c33" stroke-width="1.6"/></g>`;
    });
    s += `<path class="frag frag-tape" transform="translate(-6 -50)" d="M 0 0 q 14 6 10 20 q -4 12 8 18" stroke="#e9dcae" stroke-width="6" fill="none" opacity="0.95"/>`;
    return wrap('fragments', s);
  }

  // ---------------------------------------------------- parade silhouettes
  function silhouette(grade){
    let d, w=1;
    if (grade==='apex'){
      d = `M 0 0 L -20 0 L -16 -46 L -26 -52 L -18 -88 Q 0 -104 18 -88 L 26 -52 L 16 -46 L 20 0 Z
           M -30 -60 L -40 -20 L -30 -18 Z M 30 -60 L 40 -20 L 30 -18 Z`;
      w = 1.28;

      d = `M 0 0 L -15 0 L -13 -40 L -20 -44 L -14 -72 Q 0 -84 14 -72 L 20 -44 L 13 -40 L 15 0 Z
           M 16 -30 L 30 -28 L 30 -12 L 18 -14 Z`;
    } else {
      d = `M 0 0 L -13 0 L -12 -34 L -18 -36 L -10 -60 Q 2 -70 12 -58 L 16 -36 L 11 -33 L 13 0 Z
           M -14 -46 Q -26 -52 -24 -64 L -18 -58 Z`;
