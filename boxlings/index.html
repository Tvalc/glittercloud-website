     Never an icon, never a letter, never a badge. Each element is a MATERIAL —
     fill, edge quality, internal light, and motion — laid over the species
     body, plus a silhouette contribution, because the silhouette test is the
     one that decides whether this worked: render any creature as a flat black
     shape and the element must still be identifiable.

       FIRE   upward-tapering, lean, points and flickers at the extremities.
              A dark core lit from within, brightest at the centre. Orange into
              white-hot and NEVER into deep crimson, because deep crimson is
              the red ring's. Constant small upward flicker even at rest — the
              only element that never fully settles vertically. Embers on
              movement, heat shimmer at the silhouette edge.
       ICE    jagged, angular, wide and planted, heavier at the base than the
              top. Opaque, flat, pale, hard facet planes rather than gradients.
              Holds still; when it moves it moves in discrete steps. The
              stillest element, which makes it the natural BRACE reader. Frost
              where it plants, vapour falling off its edges downward.
       WATER  smooth, rounded, continuously deforming, never the same outline
              twice. Translucent, darker at the edges than the centre. Never
              still, fastest in locomotion. Droplets and a wet ground streak.

     THE ICE AND WATER SEPARATION is the one real risk in the whole document:
     same substance, adjacent hues. So they are opposites in EVERYTHING else —
     ICE angular, opaque, pale, heavy and still; WATER rounded, translucent,
     deep, light and never still. If a viewer confuses them the fix is
     silhouette and motion, never a label and never an icon.
     ================================================================== */
  function elementLayers(el, accent){
    const E = BB.config.elements[el] || BB.config.elements.fire;
    if (el === 'fire'){
      let embers = '';
      for (let i = 0; i < 5; i++)
        embers += `<circle class="ember e${i}" cx="${-22 + i * 11}" cy="${-18 - (i % 3) * 9}" r="${1.6 + (i % 3) * 0.7}" fill="${i % 2 ? E.hot : E.trail}"/>`;
      return {
        // the silhouette's own contribution: points and flickers at the top
        sil: `<g class="elSil elSilFire">
                <path d="M -17 -60 Q -12 -86 -4 -70 Q 0 -96 7 -74 Q 15 -88 16 -62 Z" fill="currentColor"/>
              </g>`,
        // lit from within: brightest at the centre, falling off outward
        mat: `<g class="elMat elMatFire">
                <ellipse class="elCore" cx="0" cy="-38" rx="30" ry="36" fill="url(#fireFill)" opacity="0.72"/>
                <g class="elEmbers">${embers}</g>
              </g>`,
      };
    }
    if (el === 'ice'){
      let vapour = '';
      for (let i = 0; i < 4; i++)
        vapour += `<circle class="vapour v${i}" cx="${-26 + i * 17}" cy="-12" r="${2.2 + (i % 2)}" fill="#eaf6ff" opacity="0.5"/>`;
      return {
        sil: `<g class="elSil elSilIce">
                <path d="M -38 -4 L -30 -26 L -22 -10 L -14 -30 L -8 -8 Z" fill="currentColor"/>
                <path d="M 38 -4 L 30 -26 L 22 -10 L 14 -30 L 8 -8 Z" fill="currentColor"/>
              </g>`,
        // flat facet PLANES, not gradients — the hard-edged opaque read
        mat: `<g class="elMat elMatIce">
                <path class="elFacet" d="M -26 -20 L -6 -62 L 4 -24 Z" fill="url(#iceFill)" opacity="0.9"/>
                <path class="elFacet" d="M 4 -24 L 14 -58 L 28 -18 Z" fill="#ffffff" opacity="0.5"/>
                <path class="elFrost" d="M -34 -3 l 7 -9 l 5 9 l 7 -11 l 6 11 l 6 -9 l 7 9 l 6 -8 l 6 8"
                      stroke="#eaf8ff" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
                <g class="elVapour">${vapour}</g>
              </g>`,
      };
    }
    let drops = '';
    for (let i = 0; i < 5; i++)
      drops += `<circle class="drop d${i}" cx="${-24 + i * 12}" cy="${-8 - (i % 3) * 6}" r="${1.8 + (i % 2)}" fill="${E.hot}" opacity="0.75"/>`;
    return {
      sil: `<g class="elSil elSilWater">
              <ellipse cx="-30" cy="-16" rx="11" ry="14" fill="currentColor"/>
              <ellipse cx="30"  cy="-16" rx="11" ry="14" fill="currentColor"/>
              <ellipse cx="0"   cy="-70" rx="16" ry="11" fill="currentColor"/>
            </g>`,
      // translucent, refracting what is behind, darker at the edges
      mat: `<g class="elMat elMatWater">
              <ellipse class="elBody" cx="0" cy="-34" rx="34" ry="38" fill="url(#waterFill)"/>
              <path class="elStreak" d="M -40 -2 Q 0 6 40 -2" stroke="${E.trail}" stroke-width="3" fill="none" opacity="0.55"/>
              <g class="elDrops">${drops}</g>
            </g>`,
    };
  }

  /* Each species builds on a common blob-with-feet anatomy; the silhouette and
     the element material carry the identity. tint = colorway body override,
     which is cosmetic and deliberately WEAKER than the element: a colorway may
     not be able to make a FIRE Boxling stop reading as fire. */
  function creature(spId, opts={}){
    const { tint=null, charm=false, cls='' } = opts;
    const CF = BB.config;
    const spec = CF.species.find(s => s.id === CF.speciesId(spId)) || CF.species[0];
    const el = opts.element || spec.element;
    const E = CF.elements[el] || CF.elements.fire;
    const elC = spec.accent;
    const layers = elementLayers(el, elC);
    /* The colorway tints, the element decides. Mixing the picked body colour
       most of the way toward the element's own material is what stops a
       Midnight-blue FIRE Boxling from reading as anything but fire. */
    const body = mix(tint || '#c9a06b', E.core, el === 'fire' ? 0.5 : 0.62);
    const dark = shade(body, -28);
    let inner = '';

    const feet = `
      <ellipse cx="-18" cy="-4" rx="12" ry="7" fill="${dark}"/>
      <ellipse cx="18"  cy="-4" rx="12" ry="7" fill="${dark}"/>`;

    if (spId==='cindersnap'){
      inner = `${feet}
      <path d="M -34 -10 Q -40 -66 0 -72 Q 40 -66 34 -10 Q 20 0 0 0 Q -20 0 -34 -10 Z" fill="${body}" stroke="${dark}" stroke-width="2.4"/>
      <path d="M -30 -22 L 30 -40" stroke="${shade(body,-14)}" stroke-width="7" opacity="0.7"/>
      <path class="emberSeam" d="M -32 -14 Q -20 -8 -6 -12 M 8 -8 Q 22 -12 32 -18" stroke="${elC}" stroke-width="2.4" fill="none" filter="url(#softGlow)" opacity="0.9"/>
      <path class="crest" d="M -20 -66 Q -16 -90 -4 -78 Q 0 -100 10 -80 Q 20 -94 20 -68 Z" fill="${elC}" filter="url(#softGlow)"/>
      <path d="M -12 -70 Q -4 -86 2 -74 Q 8 -84 10 -70 Z" fill="#ffe9a3" opacity="0.8"/>
      ${face(0,-42)} ${collar(charm)}`;
    }
    else if (spId==='frostuft'){
      let ruff='';
      for(let i=0;i<8;i++){ const a=Math.PI*(1.05+0.9*i/7); const x=Math.cos(a)*30, y=-16+Math.sin(a)*9;
        ruff += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9.5" fill="#eaf6ff" stroke="#a8cee6" stroke-width="2" opacity="0.97"/>`; }
      inner = `${feet}
      <path d="M -32 -8 Q -38 -60 0 -66 Q 38 -60 32 -8 Q 18 0 0 0 Q -18 0 -32 -8 Z" fill="${mix(body,'#dfeefc',0.5)}" stroke="${dark}" stroke-width="2.4"/>
      <path class="tuft" d="M -26 -58 Q -38 -88 -8 -70 Z" fill="${elC}" stroke="${shade(elC,-30)}" stroke-width="1.6"/>
      <path class="tuft" d="M 26 -58 Q 38 -88 8 -70 Z" fill="${elC}" stroke="${shade(elC,-30)}" stroke-width="1.6"/>
      <g class="ruff">${ruff}</g>
      ${face(0,-40)} ${collar(charm)}`;
    }
    /* TIDECRATE — WATER. It replaces Voltcrate, which was storm, and storm is
       one of the two elements v3.5 cuts. The crate silhouette survives because
       it is the species' identity; everything about how it is DRAWN changed to
       the water material — the slats round off, the shell is translucent and
       darker at its edges than its centre, and it is always brimming over. */
    else if (spId==='tidecrate'){
      inner = `${feet}
      <path d="M -32 -6 Q -34 -58 -22 -64 Q 0 -70 22 -64 Q 34 -58 32 -6 Q 16 2 0 2 Q -16 2 -32 -6 Z"
            fill="${body}" stroke="${dark}" stroke-width="2.4" opacity="0.88"/>
      <path class="slat" d="M -31 -46 Q 0 -40 31 -46 M -32 -26 Q 0 -20 32 -26" stroke="${dark}" stroke-width="2" fill="none" opacity="0.45"/>
      <path class="brim" d="M -24 -62 Q -12 -74 0 -64 Q 12 -74 24 -62 Q 12 -56 0 -60 Q -12 -56 -24 -62 Z"
            fill="${mix(body,E.hot,0.55)}" opacity="0.9"/>
      <ellipse cx="-13" cy="-30" rx="7" ry="9" fill="${E.hot}" opacity="0.28"/>
      ${face(0,-40)} ${collar(charm)}`;
    }
    /* BUBBLEWRAP — WATER, and the clearest read of the three signatures, which
       is why the art spec makes WATER the reference build. It replaces
       Bramblewrap (plant, also cut). All cells and no edges: an outline built
       out of overlapping translucent rounds, so it is never the same shape
       twice and it can visibly PART around a blow and close behind it. */
    else if (spId==='bubblewrap'){
      let cells = '';
      const grid = [[-19,-16],[0,-14],[19,-16],[-24,-36],[-8,-34],[8,-34],[24,-36],[-15,-54],[2,-56],[18,-54]];
      grid.forEach(([x, y], i) => {
        cells += `<circle class="cell c${i}" cx="${x}" cy="${y}" r="${12 - (i % 3)}"
                    fill="${mix(body, E.hot, (i % 4) * 0.12)}" stroke="${dark}" stroke-width="1.5" opacity="0.9"/>`;
      });
      inner = `${feet}
      <path d="M -30 -8 Q -36 -56 0 -66 Q 36 -56 30 -8 Q 16 1 0 1 Q -16 1 -30 -8 Z" fill="${body}" opacity="0.7"/>
      <g class="cells">${cells}</g>
      ${face(0,-38)} ${collar(charm)}`;
    }
    else if (spId==='pyrepip'){
      let mane='';
      for(let i=0;i<9;i++){ const a=Math.PI*(0.02+0.96*i/8); const x=Math.cos(a)*40, y=-34-Math.sin(a)*40;
        mane += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="10" ry="7" fill="#f2e4c8" stroke="#cdbc9a" stroke-width="1.4" transform="rotate(${(a*57.3-90).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`; }
      inner = `${feet}
      <g class="mane">${mane}</g>
      <circle cx="0" cy="-34" r="30" fill="${body}" stroke="${dark}" stroke-width="2.4"/>
      <path class="tail" d="M 26 -14 Q 46 -18 44 -36 Q 43 -46 34 -46" stroke="${elC}" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>
      <circle cx="34" cy="-46" r="5" fill="${elC}" filter="url(#softGlow)"/>
      ${face(0,-36,0.92)} ${collar(charm)}`;
    }
    else { // glacierkin
      inner = `${feet}
      <rect x="-28" y="-58" width="56" height="56" rx="8" fill="${mix(body,'#cfe4f4',0.55)}" stroke="${dark}" stroke-width="2.4"/>
      <path d="M -28 -58 L -20 -66 L 36 -66 L 28 -58 Z" fill="${mix(body,'#e8f4fc',0.6)}" stroke="${dark}" stroke-width="2"/>
      <path d="M -28 -44 h 8 l 4 6 l 6 -10 l 5 8 h 8" stroke="#eaf8ff" stroke-width="2.4" fill="none" opacity="0.9"/>
      <path class="rime" d="M -28 -2 l 6 -8 l 5 8 l 6 -10 l 6 10 l 5 -8 l 6 8" stroke="#eaf8ff" stroke-width="2.6" fill="none"/>
      <path class="spark" d="M 20 -70 l 2.6 6 l 6 2.6 l -6 2.6 l -2.6 6 l -2.6 -6 l -6 -2.6 l 6 -2.6 Z" fill="#dff5ff" filter="url(#softGlow)"/>
      ${face(0,-34,0.9)} ${collar(charm)}`;
    }

    /* Assembly order is the material read: the silhouette's element
       contribution sits BEHIND the body (so it extends the outline rather than
       decorating the front), the body next, then the material on top of it —
       the internal light, the facets, the translucency — and the guard last,
       because the guard is the momentum system's and must never be occluded.

       `elSil` is filled with `currentColor` so the silhouette test is free:
       flatten the creature to black on the tape card and the element's
       contribution to the outline flattens with it. */
    return wrapFighter(`creature sp-${spec.id} el-${el} ${cls}`,
                       layers.sil + inner + layers.mat + guard(body, dark),
                       `data-ex="normal" data-mom="EVEN" data-el="${el}"`);
  }

  // --------------------------------------------------------------- boxes
  function boxArt(grade, opts={}){
    const s = opts.scale || 1, cls = opts.cls || '';
    let inner = '';
    if (grade==='cardboard'){
      inner = `
      <rect x="-46" y="-78" width="92" height="78" rx="6" fill="url(#kraftGrad)" stroke="#7d5c33" stroke-width="2.6"/>
      <path d="M -46 -78 L -30 -94 L 62 -94 L 46 -78 Z" fill="#e0bd87" stroke="#7d5c33" stroke-width="2.4"/>
      <path d="M 46 -78 L 62 -94 L 62 -18 L 46 0 Z" fill="#a8804d" stroke="#7d5c33" stroke-width="2.4"/>
      <rect x="-46" y="-46" width="92" height="13" fill="#e9dcae" opacity="0.9"/>
      <rect x="-8" y="-78" width="15" height="78" fill="#e9dcae" opacity="0.75"/>
      <g transform="translate(-24 -66) rotate(-6)">
        <rect x="-13" y="-9" width="27" height="19" rx="2.4" fill="none" stroke="#9b3535" stroke-width="2"/>
        <text x="0" y="4.5" text-anchor="middle" font-size="8.4" fill="#9b3535" font-weight="700">FRAGILE</text>
      </g>`;
    } else if (grade==='crate'){
      inner = `
      <rect x="-52" y="-84" width="104" height="84" rx="4" fill="url(#woodGrad)" stroke="#4f3416" stroke-width="3"/>
      <path d="M -52 -63 H 52 M -52 -42 H 52 M -52 -21 H 52" stroke="#4f3416" stroke-width="2.2" opacity="0.7"/>
      <path d="M -52 -84 L 52 0 M 52 -84 L -52 0" stroke="#5f4020" stroke-width="7" opacity="0.7"/>
      <g fill="#2f2618">
        <rect x="-52" y="-84" width="14" height="14"/><rect x="38" y="-84" width="14" height="14"/>
        <rect x="-52" y="-14" width="14" height="14"/><rect x="38" y="-14" width="14" height="14"/>
      </g>`;
    } else if (grade==='steel'){
      let riv='';
      for(let i=0;i<6;i++) riv += `<circle cx="${-40+16*i}" cy="-80" r="3" fill="#e6eef4"/><circle cx="${-40+16*i}" cy="-8" r="3" fill="#e6eef4"/>`;
      inner = `
      <rect x="-52" y="-88" width="104" height="88" rx="10" fill="url(#steelGrad)" stroke="#3a4552" stroke-width="3"/>
      <rect x="-52" y="-58" width="104" height="16" fill="#3f4c5b"/>
      <path d="M -46 -50 h 12 m 8 0 h 12 m 8 0 h 12 m 8 0 h 12 m 8 0 h 12" stroke="#f2c14e" stroke-width="7"/>
      ${riv}
      <circle cx="0" cy="-30" r="11" fill="#2e3742" stroke="#e6eef4" stroke-width="2.4"/>
      <path d="M 0 -36 v 12 M -6 -30 h 12" stroke="#e6eef4" stroke-width="2"/>`;
    } else if (grade==='gilded'){
      inner = `
      <rect x="-54" y="-92" width="108" height="92" rx="10" fill="url(#goldGrad)" stroke="#8a6508" stroke-width="3" filter="url(#softGlow)"/>
      <path d="M -54 -66 H 54" stroke="#8a6508" stroke-width="2.4"/>
      <path d="M -44 -82 Q -34 -90 -24 -82 T -4 -82 M 4 -82 Q 14 -90 24 -82 T 44 -82" stroke="#fff3c4" stroke-width="2.6" fill="none"/>
      <path d="M -44 -18 Q -34 -10 -24 -18 T -4 -18 M 4 -18 Q 14 -10 24 -18 T 44 -18" stroke="#8a6508" stroke-width="2.4" fill="none"/>
      <circle cx="0" cy="-46" r="13" fill="#fff3c4" stroke="#8a6508" stroke-width="3"/>
      <path d="M 0 -52 L 3 -46 L 0 -40 L -3 -46 Z" fill="#8a6508"/>`;
    } else { // vault
      inner = `
      <g filter="url(#bigGlow)">
        <rect x="-72" y="-124" width="144" height="124" rx="14" fill="url(#goldGrad)" stroke="#8a6508" stroke-width="4"/>
      </g>
      <rect x="-72" y="-124" width="144" height="14" fill="#fff3c4" opacity="0.65"/>
      <path d="M -60 -110 Q -46 -120 -32 -110 T -4 -110 M 4 -110 Q 18 -120 32 -110 T 60 -110" stroke="#8a6508" stroke-width="2.6" fill="none"/>
      <circle cx="0" cy="-62" r="34" fill="#e9b83c" stroke="#8a6508" stroke-width="4"/>
      <circle cx="0" cy="-62" r="22" fill="none" stroke="#fff3c4" stroke-width="3"/>
      <path d="M 0 -96 v 12 M 0 -40 v 12 M -34 -62 h 12 M 22 -62 h 12
               M -24 -86 l 8 8 M 16 -46 l 8 8 M 24 -86 l -8 8 M -16 -46 l -8 8" stroke="#8a6508" stroke-width="3.4"/>
      <circle cx="0" cy="-62" r="7" fill="#fff3c4" stroke="#8a6508" stroke-width="2"/>
      <g class="crackHost"></g>`;
    }
    return wrap(`box grade-${grade} ${cls}`, `<g transform="scale(${s})" filter="url(#dropShadow)">${inner}</g>`);
  }

  /* Cardboard burst fragments (shared by the continue-branch and gags). */
  function fragments(){
    const polys = [
      [-40,-60,'M 0 0 L 26 -8 L 20 16 L -4 14 Z'],
      [30,-70,'M 0 0 L 22 6 L 10 22 L -6 12 Z'],
      [-16,-30,'M 0 0 L 18 -12 L 26 6 L 6 12 Z'],
      [22,-24,'M 0 0 L 16 -6 L 22 12 L 2 14 Z'],
      [-36,-16,'M 0 0 L 20 -4 L 12 16 Z'],
      [8,-88,'M 0 0 L 18 -10 L 24 8 Z'],
    ];
    let s='';
    polys.forEach(([x,y,d],i)=>{
      s += `<g class="frag frag-${i}" transform="translate(${x} ${y})"><path d="${d}" fill="${i%2?'#d8b078':'#b08a52'}" stroke="#7d5c33" stroke-width="1.6"/></g>`;
    });
    s += `<path class="frag frag-tape" transform="translate(-6 -50)" d="M 0 0 q 14 6 10 20 q -4 12 8 18" stroke="#e9dcae" stroke-width="6" fill="none" opacity="0.95"/>`;
    return wrap('fragments', s);
  }

  /* The Parade — the silhouette lineup, the roster pip and the Challenger
     Select reticle all lived here. All three were symbolic tells that had to
     be decoded before they meant anything, so all three are gone. What tells
     you the odds now is how big the other body is. */

  // -------------------------------------------------------------- the Auric
  /* The Auric is elemental too — the Vault is favoured, mirrored and countered
     at the same 1/3 each as every other rung, or the walkout card's EDGE slab
     would have to go blank at the one fight that matters most. Its element
     arrives as a MATERIAL laid over the gilded body rather than as a different
     creature: the Vault's rival is always the Auric and always the largest
     thing in the game, and swapping its body for an element would cost more
     than the matchup gains. */
  function auric(opts = {}){
    const el = opts.element || null;
    const layers = el ? elementLayers(el, '#ffe9a3') : { sil:'', mat:'' };
    let drops='';
    for(let i=0;i<7;i++){
      drops += `<circle class="auricMote m${i}" cx="${-30+i*11}" cy="${-96-(i%3)*14}" r="${2.2+(i%3)}" fill="#ffe9a3" filter="url(#softGlow)"/>`;
    }
    const inner = `
    <g filter="url(#bigGlow)">
      <path d="M -30 0 Q -46 -30 -34 -66 Q -26 -96 0 -112 Q 26 -96 34 -66 Q 46 -30 30 0 Q 12 8 0 8 Q -12 8 -30 0 Z"
            fill="url(#auricBody)" stroke="#8a6508" stroke-width="2.4"/>
    </g>
    <path d="M 0 -112 Q -6 -128 2 -140 Q 12 -130 8 -116 Z" fill="#fff3c4" filter="url(#softGlow)"/>
    <path d="M -34 -66 Q -58 -74 -64 -94 Q -46 -92 -36 -80 Z" fill="#ffd75e" opacity="0.9" filter="url(#softGlow)"/>
    <path d="M 34 -66 Q 58 -74 64 -94 Q 46 -92 36 -80 Z" fill="#ffd75e" opacity="0.9" filter="url(#softGlow)"/>
    <g class="face" transform="translate(0 -74)">
      <path d="M -20 -2 L -6 2 L -20 7 Z" fill="#4a3403"/>
      <path d="M 20 -2 L 6 2 L 20 7 Z" fill="#4a3403"/>
    </g>
    <path d="M -14 -34 Q 0 -26 14 -34" stroke="#fff3c4" stroke-width="2.4" fill="none" opacity="0.8"/>
    ${drops}`;
    return wrapFighter(`creature auric${el ? ' el-' + el + ' auricEl' : ''}`,
                       layers.sil + inner + layers.mat + guard('#ffd75e', '#8a6508'),
                       `data-ex="normal" data-mom="EVEN"${el ? ` data-el="${el}"` : ''}`);
  }

  // ------------------------------------------------------------------ FX
  const fx = {
    dustRing(){ return `<g class="fxDust">
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="#dfe9f2" stroke-width="5" opacity="0.9"/>
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="#aebfd0" stroke-width="3" opacity="0.7"/></g>`; },
    impact(){ return `<g class="fxImpact" filter="url(#softGlow)">
      <path d="M 0 -26 L 5 -7 L 24 -10 L 8 2 L 16 20 L 0 9 L -16 20 L -8 2 L -24 -10 L -5 -7 Z"
            fill="#fff8dd" stroke="#f2c14e" stroke-width="2"/>
      <path d="M 0 -26 L 5 -7 L 24 -10 L 8 2 L 16 20 L 0 9 L -16 20 L -8 2 L -24 -10 L -5 -7 Z"
            fill="none" stroke="#2a1d05" stroke-width="1.4" opacity="0.55" transform="scale(1.1)"/></g>`; },

    /* ==================== WHERE THE FORCE WENT ====================
       The star at the contact point says A BLOW HAPPENED HERE. It has never
       once said WHO HIT WHOM, because a star is radially symmetric and a
       symmetric mark cannot carry a direction — and drawn big enough to feel
       like a finisher it covers both bodies, so it actively DESTROYS the read
       it was supposed to serve. That is the whole of the "who is attacking
       who" complaint: the loudest thing on screen at the decisive frame was
       the one thing in the frame with no direction in it.

       So the contact is drawn as a TRANSFER instead, in three asymmetric
       parts, and every one of them points the same way:

         the thrust   a lance of force running BACK from the contact to the
                      attacker's fist. Hairline at the fist, full width where
                      it arrives. The tail is the attacker; the head is the
                      defender; the taper is the arrow.
         the cone     the energy going INTO the struck body — a bow wave and
                      spall thrown forward only. Nothing behind the contact.
         the star     kept, but small and keylined, so it punctuates the
                      contact instead of erasing the fighters around it.

       All three are drawn pointing +x and flipped by `dir`, so the geometry
       is written once and the direction is a single multiply. */
    thrust(kind, len, dir){
      const hot  = kind === 'finisher' ? '#fff8dd' : kind === 'heavy' ? '#ffd9cf' : '#eaf4ff';
      const edge = kind === 'finisher' ? '#f2c14e' : kind === 'heavy' ? '#e8452c' : '#6fb7ff';
      const L = Math.max(64, len);
      const w = kind === 'finisher' ? 25 : kind === 'heavy' ? 19 : 12;
      /* Chevrons stacked along the shaft, growing toward the contact. They are
         what makes the lance read as TRAVELLING rather than as a static wedge:
         three arrowheads in a row is a direction even in silhouette. */
      let chev = '';
      for (let i = 0; i < 3; i++){
        const s = 0.46 + i * 0.24, x = -L * (0.70 - i * 0.21);
        chev += `<path d="M ${x.toFixed(1)} ${(-w * s).toFixed(1)} L ${(x + w * s * 1.15).toFixed(1)} 0 L ${x.toFixed(1)} ${(w * s).toFixed(1)}"
                   fill="none" stroke="${hot}" stroke-width="${(2.6 * s + 1.4).toFixed(1)}"
                   stroke-linecap="round" stroke-linejoin="round" opacity="${(0.45 + i * 0.2).toFixed(2)}"/>`;
      }
      const lance = `M ${-L} 0 L 0 ${-w} L ${(w * 0.55).toFixed(1)} 0 L 0 ${w} Z`;
      return `<g class="fxThrust" transform="scale(${dir} 1)">
        <path d="${lance}" fill="${hot}" opacity="0.82" filter="url(#softGlow)"/>
        <path d="${lance}" fill="none" stroke="${edge}" stroke-width="2.6" stroke-linejoin="round" opacity="0.9"/>
        ${chev}
      </g>`;
    },

    /* THE CONE — what the blow does once it is inside the other body. Arcs
       that open FORWARD, away from the attacker, so the picture is energy
       entering a body rather than energy sitting between two of them. */
    shockCone(kind, dir){
      const hot  = kind === 'finisher' ? '#fff8dd' : kind === 'heavy' ? '#ffd9cf' : '#eaf4ff';
      const edge = kind === 'finisher' ? '#f2c14e' : kind === 'heavy' ? '#e8452c' : '#6fb7ff';
      const R = kind === 'finisher' ? 92 : kind === 'heavy' ? 70 : 48;
      let arcs = '';
      for (let i = 0; i < 3; i++){
        const r = R * (0.46 + i * 0.29);
        arcs += `<path d="M ${(r * 0.14).toFixed(1)} ${(-r * 0.88).toFixed(1)} Q ${(r * 1.12).toFixed(1)} 0 ${(r * 0.14).toFixed(1)} ${(r * 0.88).toFixed(1)}"
                   fill="none" stroke="${hot}" stroke-width="${(6.4 - i * 1.7).toFixed(1)}"
                   stroke-linecap="round" opacity="${(0.92 - i * 0.26).toFixed(2)}"/>`;
      }
      // ...and the spall: fragments of the blow thrown on THROUGH the body
      let spall = '';
      for (let i = 0; i < 7; i++){
        const a = -0.92 + (i / 6) * 1.84, d0 = R * 0.30, d1 = R * (0.86 + (i % 3) * 0.22);
        spall += `<path d="M ${(Math.cos(a) * d0).toFixed(1)} ${(Math.sin(a) * d0 * 0.9).toFixed(1)}
                           L ${(Math.cos(a) * d1).toFixed(1)} ${(Math.sin(a) * d1 * 0.9).toFixed(1)}"
                    stroke="${edge}" stroke-width="${(3 - (i % 3) * 0.8).toFixed(1)}"
                    stroke-linecap="round" opacity="${(0.9 - (i % 3) * 0.18).toFixed(2)}"/>`;
      }
      return `<g class="fxCone" transform="scale(${dir} 1)" filter="url(#softGlow)">${arcs}${spall}</g>`;
    },
    shock(){ let s=''; for(let i=0;i<8;i++){ const a=i*Math.PI/4;
        s += `<line x1="${Math.cos(a)*16}" y1="${Math.sin(a)*16}" x2="${Math.cos(a)*34}" y2="${Math.sin(a)*34}" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`; }
      return `<g class="fxShock" opacity="0.9">${s}</g>`; },
    stars(){ let s=''; for(let i=0;i<3;i++){ const a=i*2.09;
        s += `<path transform="translate(${Math.cos(a)*24} ${Math.sin(a)*10-4}) scale(0.8)" d="M 0 -7 L 2 -2 L 7 -2 L 3 1 L 5 6 L 0 3 L -5 6 L -3 1 L -7 -2 L -2 -2 Z" fill="#ffe9a3" stroke="#c8961e" stroke-width="1"/>`; }
      return `<g class="fxStars">${s}</g>`; },
    snowPuff(){ let s=''; for(let i=0;i<6;i++){ s += `<circle cx="${-18+i*7}" cy="${-(i%3)*8}" r="${5+(i%3)*3}" fill="#eaf6ff" opacity="0.85"/>`; }
      return `<g class="fxPuff">${s}</g>`; },
    /* BLOCK — the guard came up and held. Hard bright sparks off a shield
       arc, thrown backward along the line of the blow. Reads as "stopped",
       not "hurt": nothing bursts, nothing tears, the arc holds its shape. */
    block(){
      let sparks = '';
      for (let i = 0; i < 11; i++){
        const a = -1.1 + (i / 10) * 2.2, r = 46 + (i % 4) * 26;
        const x = Math.cos(a) * r, y = Math.sin(a) * r * 0.8;
        sparks += `<path d="M 0 0 L ${x.toFixed(1)} ${y.toFixed(1)}" stroke="#dff5ff" stroke-width="${(3 - (i % 3) * 0.7).toFixed(1)}" stroke-linecap="round" opacity="${(0.9 - (i % 3) * 0.2).toFixed(2)}"/>`;
      }
      return `<g class="fxBlock" filter="url(#softGlow)">
        <path d="M -6 -46 A 52 52 0 0 1 -6 46" fill="none" stroke="#bfe6ff" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
        <path d="M -2 -34 A 38 38 0 0 1 -2 34" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" opacity="0.8"/>
        ${sparks}
      </g>`;
    },

    /* DODGE — the body simply is not there any more. An afterimage where it
       was, and the attack tearing through empty air past it. No contact, no
       burst, no stop worth speaking of: the whole point is that nothing
       happened. */
    dodge(){
      let lines = '';
      for (let i = 0; i < 7; i++){
        const y = -78 + i * 22, len = 60 + (i % 3) * 34;
        lines += `<path d="M 0 ${y} h ${len}" stroke="#eaf6ff" stroke-width="${(2.4 - (i % 3) * 0.5).toFixed(1)}" stroke-linecap="round" opacity="${(0.75 - (i % 3) * 0.18).toFixed(2)}"/>`;
      }
      return `<g class="fxDodge">
        <ellipse cx="0" cy="-46" rx="30" ry="44" fill="#bfe6ff" opacity="0.18"/>
        <ellipse cx="0" cy="-46" rx="30" ry="44" fill="none" stroke="#dff5ff" stroke-width="2" opacity="0.4"/>
        <g class="fxDodgeLines">${lines}</g>
      </g>`;
    },

    /* ================= THE THREE DEFEATS =================
       The highest-value art in the whole matchup, because these are how the
       game teaches its own rules without a word of text. Each counter has ONE
       losing image, each must read at a glance, silently, on first viewing —
       and a player who sees one has permanently learned that arm of the ring.
       Three arms means the whole system is taught in three losses, which a
       volume user sees inside their first session.

       They are reserved for COUNTER pairings. Mirror and neutral defeats take
       the ordinary KO from the momentum system — DOWN, on the ground, no
       transformation — which is the only thing that keeps these meaningful. */

    /* FIRE beats ICE: the facets round off, the silhouette loses its angles,
       it slumps and puddles. */
    melt(){
      let drips = '';
      for (let i = 0; i < 6; i++){
        const x = -30 + i * 12;
        drips += `<path class="meltDrip md${i}" d="M ${x} -46 q 3 22 0 44" stroke="#dfeef8"
                    stroke-width="${5 - (i % 3)}" fill="none" stroke-linecap="round" opacity="0.85"/>`;
      }
      return `<g class="fxMelt">
        ${drips}
        <ellipse class="meltPool" cx="0" cy="-2" rx="14" ry="5" fill="#cfe4f2" opacity="0.9"/>
        <path class="meltSteam" d="M -14 -60 q 6 -14 0 -26 M 12 -56 q 6 -12 0 -22"
              stroke="#eaf6ff" stroke-width="2.4" fill="none" opacity="0.5"/>
      </g>`;
    },

    /* ICE beats WATER: it goes opaque and rigid in ONE beat — that is the
       whole gag, the mid-motion arrest — and then it shatters. */
    freeze(){
      let shards = '';
      for (let i = 0; i < 11; i++){
        const a = (i / 11) * Math.PI * 2, r = 26 + (i % 4) * 14;
        shards += `<path class="frShard fs${i}" d="M 0 0 l ${(Math.cos(a)*13).toFixed(1)} ${(Math.sin(a)*13).toFixed(1)} l ${(Math.cos(a+0.5)*9).toFixed(1)} ${(Math.sin(a+0.5)*9).toFixed(1)} z"
                     fill="#dff2ff" stroke="#9fd0f5" stroke-width="1.2"
                     style="--dx:${(Math.cos(a)*r).toFixed(1)}px;--dy:${(Math.sin(a)*r - 22).toFixed(1)}px;--d:${(i%5)*26}ms"/>`;
      }
      return `<g class="fxFreeze">
        <path class="frShell" d="M -36 -2 L -30 -46 L -14 -74 L 14 -74 L 30 -46 L 36 -2 Z"
              fill="#eaf6ff" stroke="#9fd0f5" stroke-width="3" stroke-linejoin="round" opacity="0.92"/>
        <path class="frCrack" d="M -6 -70 L 2 -44 L -8 -30 L 4 -6 M 2 -44 L 18 -36"
              stroke="#7fb6dc" stroke-width="2.2" fill="none"/>
        <g class="frShards" transform="translate(0 -40)">${shards}</g>
      </g>`;
    },

    /* WATER beats FIRE: the internal light dies from the EXTREMITIES INWARD —
       the direction is the whole read — and then steam and smoke. */
    gutter(){
      let smoke = '';
      for (let i = 0; i < 7; i++){
        const x = -20 + i * 7;
        smoke += `<circle class="gsmoke gs${i}" cx="${x}" cy="-44" r="${5 + (i % 3) * 3}" fill="#9aa8b8"
                    opacity="0.42" style="--dx:${(x * 1.6).toFixed(1)}px;--d:${(i % 4) * 70}ms"/>`;
      }
      return `<g class="fxGutter">
        <ellipse class="gCore" cx="0" cy="-40" rx="30" ry="34" fill="url(#fireFill)" opacity="0.85"/>
        <g class="gSmoke">${smoke}</g>
        <path class="gHiss" d="M -26 -18 q 10 -12 22 -4 M 8 -14 q 12 -10 22 -2"
              stroke="#dfe9f2" stroke-width="2.6" fill="none" opacity="0.6"/>
      </g>`;
    },

    /* ================= THE THREE DODGE SIGNATURES =================
       Foreshadowed one rung early as harmless Circle texture, per the build
       spec — the capability has to be VISIBLE before it is needed, or a rare
       outcome with no setup reads as the game cheating. Same markup in both
       places: what changes is the scale it plays at and whether a killing blow
       happened to be arriving. */
    signature(kind, accent){
      const c = accent || '#dff5ff';
      // FIRE flares up: the blow passes through the flare and the silhouette
      // re-forms above it.
      if (kind === 'flare'){
        let tongues = '';
        for (let i = 0; i < 5; i++){
          const x = -26 + i * 13, h = 52 + (i % 3) * 26;
          tongues += `<path class="flareTongue ft${i}" d="M ${x} 0 q ${6 - i * 2} ${-h * 0.55} 0 ${-h} q ${-6 + i * 2} ${h * 0.45} 0 ${h} z"
                        fill="${i % 2 ? '#fff3d0' : '#ff9a3c'}" opacity="${(0.9 - i * 0.09).toFixed(2)}"/>`;
        }
        return `<g class="fxSignature fxFlare" filter="url(#softGlow)">${tongues}</g>`;
      }
      // ICE plants and holds: the strike SKATES OFF a facet, with a spark and
      // a shriek. The only one of the three that makes contact.
      if (kind === 'plant'){
        let sparks = '';
        for (let i = 0; i < 8; i++){
          const a = -1.4 + (i / 7) * 1.2, r = 30 + (i % 4) * 16;
          sparks += `<path class="skateSpark ss${i}" d="M 0 0 l ${(Math.cos(a)*r).toFixed(1)} ${(Math.sin(a)*r).toFixed(1)}"
                       stroke="#ffffff" stroke-width="${(2.4 - (i % 3) * 0.6).toFixed(1)}" stroke-linecap="round" opacity="0.9"/>`;
        }
        return `<g class="fxSignature fxPlant">
          <path class="facetFace" d="M -8 -70 L 26 -46 L 20 -10 L -12 -22 Z" fill="#eaf6ff"
                stroke="#9fd0f5" stroke-width="3" stroke-linejoin="round" opacity="0.95"/>
          <g class="skateSparks" transform="translate(20 -40)">${sparks}</g>
        </g>`;
      }
      // WATER parts and reforms: the blow passes THROUGH the body, which
      // separates and closes behind it. The clearest of the three, and the
      // reference build.
      let ripples = '';
      for (let i = 0; i < 3; i++)
        ripples += `<ellipse class="partRipple pr${i}" cx="0" cy="-40" rx="${18 + i * 13}" ry="${22 + i * 15}"
                      fill="none" stroke="${c}" stroke-width="${2.6 - i * 0.6}" opacity="${0.8 - i * 0.2}"/>`;
      return `<g class="fxSignature fxPart">
        <path class="partHalf ph0" d="M -34 -4 Q -40 -56 -8 -68 L -8 -4 Z" fill="url(#waterFill)" opacity="0.9"/>
        <path class="partHalf ph1" d="M 34 -4 Q 40 -56 8 -68 L 8 -4 Z" fill="url(#waterFill)" opacity="0.9"/>
        ${ripples}
      </g>`;
    },

    /* THE IMPACT PANEL — the comic frame the world stops on.
       Radial speed lines out of the point of contact and a hard jagged burst,
       drawn at FULL SIZE immediately rather than animated in: the frame is
       held, so anything still growing during the hold would be a moving
       picture, and this has to read as a single drawn panel. */
    /* `dir` is the direction the blow is TRAVELLING (+1 rightward). The speed
       lines used to be a perfect 360° sunburst, which is the same mistake the
       star made one order of magnitude louder: the biggest graphic in the game
       fired at the most important frame in the game and said nothing about who
       had just hit whom. They are a WAKE now — long and dense downstream of the
       contact, clipped to stubs behind it — so the panel itself points at the
       body that just took the blow. */
    /* IT MAY NOT COVER THE FIGHTERS, and for two versions it did. The reach was
       760 in a 960-wide arena and the burst spiked to 186px against bodies that
       stand about 110px tall, so the decisive frame of the whole product was a
       cream starburst with two creatures somewhere underneath it. A panel that
       hides the exchange is not a comic panel, it is a wipe.

       So it is scaled off the BODY now, not off the arena: the burst is about
       two thirds of a fighter's height, the lines run roughly the distance
       between the two of them, and the wedges are thin and transparent enough
       that both silhouettes read straight through the middle of it. */
    impactPanel(kind, n, dir){
      const hot   = kind === 'finisher' ? '#fff8dd' : kind === 'heavy' ? '#ffd9cf' : '#eaf4ff';
      const edge  = kind === 'finisher' ? '#f2c14e' : kind === 'heavy' ? '#e8452c' : '#6fb7ff';
      const reach = kind === 'finisher' ? 300 : kind === 'heavy' ? 230 : 160;
      const d     = dir < 0 ? -1 : 1;
      /* The bias may only ever SHORTEN. Peaking above 1 is how the last pass
         made the forward spikes bigger than the omnidirectional ones it was
         supposed to be an improvement on: a directional mark is made by cutting
         the back away, never by growing the front. */
      /* The exponent is what makes it a WAKE rather than a lopsided sunburst.
         Linear falloff still threw lines 200px straight up and down out of the
         contact — 438px of frame height on a 540px arena, spent saying nothing,
         because nothing happened above the blow. Shaping it pulls the fan in
         around the axis the force actually travelled along. */
      const bias = a => 0.18 + 0.82 * Math.pow(0.5 + 0.5 * Math.cos(a) * d, 1.6);
      let lines = '';
      for (let i = 0; i < n; i++){
        const a  = (i / n) * Math.PI * 2 + (i % 2) * 0.04;
        const f  = bias(a);
        const r0 = 40 + (i % 4) * 16;
        const r1 = reach * (0.62 + ((i * 7) % 11) / 22) * f;
        if (r1 <= r0 + 8) continue;             // behind the blow there is nothing to say
        const w  = (0.009 + (i % 5) * 0.004) * (0.5 + f);
        const px = (r, ang) => `${(Math.cos(ang) * r).toFixed(1)} ${(Math.sin(ang) * r).toFixed(1)}`;
        lines += `<path d="M ${px(r0, a)} L ${px(r1, a - w)} L ${px(r1, a + w)} Z" fill="${hot}" opacity="${((0.3 + (i % 3) * 0.1) * (0.3 + 0.7 * f)).toFixed(2)}"/>`;
      }
      const spikes = kind === 'light' ? 9 : 13;
      let burst = '';
      for (let i = 0; i < spikes * 2; i++){
        const a = (i / (spikes * 2)) * Math.PI * 2;
        const r = (i % 2 ? 26 : 72) * (kind === 'finisher' ? 1.1 : kind === 'heavy' ? 0.92 : 0.72) * bias(a);
        burst += `${(Math.cos(a) * r).toFixed(1)},${(Math.sin(a) * r).toFixed(1)} `;
      }
      return `<g class="fxPanel">
        <g class="fxPanelLines">${lines}</g>
        <polygon points="${burst}" fill="${hot}" fill-opacity="0.88" stroke="${edge}" stroke-width="4" stroke-linejoin="round"/>
        <polygon points="${burst}" fill="none" stroke="#1a1204" stroke-width="1.4" stroke-linejoin="round" opacity="0.6" transform="scale(1.06)"/>
      </g>`;
    },

    /* Celebration particles. Count scales with band, so a bigger prize
       literally throws more into the air — honest, because the band is fixed
       long before this fires. */
    /* THE TELEGRAPH RING — the ground mark under whoever is about to be hit.
       Drawn flat on the floor plane so it reads as a place, not an effect:
       this patch of ground is where the answer arrives. */
    ring(color, width){
      return `<g class="fxRing">
        <ellipse cx="0" cy="0" rx="74" ry="26" fill="none" stroke="${color}" stroke-width="${width}" opacity="0.95"/>
        <ellipse cx="0" cy="0" rx="52" ry="18" fill="none" stroke="${color}" stroke-width="${(width*0.5).toFixed(1)}" opacity="0.55"/>
        <path d="M -74 0 h 16 M 74 0 h -16 M 0 -26 v 8 M 0 26 v -8" stroke="${color}" stroke-width="${(width*0.8).toFixed(1)}" stroke-linecap="round"/>
      </g>`;
    },
    /* ===================== WHOSE BOXLING IS THAT =====================
       The one question the fight stopped being able to answer, and the ring
       space is what broke it. Before v3.7 the player was on the left and the
       rival was on the right, permanently, and that staging was doing far more
       identification work than anyone had noticed. Once the axis rotates the
       two bodies swap sides three to five times a run.

       Everything else that might have distinguished them can collapse at the
       same time. "The element IS the creature" is the matchup's founding rule,
       and v3.6's honesty rule requires killing commits to be EVEN — which is a
       MIRROR — so at rung 2 the rival is the same material as the player in two
       packings out of three. Two FIRE bodies, lit the same way, crossing sides.
       Tint does not save it either: the default Kraft body is #c9a06b and the
       Vault rival's tint is #b08a52, which are the same tan. That leaves size,
       and size at rung 1 is a 1.25x difference on a moving target.

       So: a caret over the player. It is deliberately NOT on the ground plane,
       because the ground plane belongs to the telegraph rings and a second
       thing down there during a Tell would be competing with the one signal
       that must never be competed with. It never pulses, never animates and is
       never absent — a mark that comes and goes is an event, and this is an
       identity. It carries a dark outline so it holds against snow, sky and a
       white blowout alike, and it uses no reserved colour.

       It is overt UI in a product that deleted every HP bar, icon and badge on
       principle, and that is a real cost. It buys back the ability to read
       every other signal in the fight, which is worth more. */
    playerMark(){
      return `<g class="fxMark">
        <path d="M -11 -9 L 0 4 L 11 -9" fill="none" stroke="#0d1720" stroke-width="7.5"
              stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
        <path d="M -11 -9 L 0 4 L 11 -9" fill="none" stroke="#f4f9ff" stroke-width="3.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>`;
    },
    /* ================== THE ROLE CUE — WHO IS SWINGING ==================
       The flinch was supposed to carry this on the bodies alone, and after the
       ring space it stopped landing: both fighters now travel a great deal more
       than they used to, and a pose delta of a few degrees and a few percent of
       scale is invisible against a body that is also orbiting, breathing and
       changing depth. The telegraph ring marks the DEFENDER, but it lives on
       the ground plane and a viewer watching the bodies never looks down.

       So the roles get a positive mark each, and the two are built as
       OPPOSITES so the pair reads as one relationship rather than two effects:

         the charge   chevrons that converge INWARD on the attacker, gathering,
                      the whole mark shrinking toward the body
         the brace    arcs that push OUTWARD along the ground under the
                      defender, weight going down, the whole mark spreading

       Converging versus spreading is legible in silhouette, at a glance, and
       from across a room — which is what the flinch was always trying to buy.

       ACHROMATIC, DELIBERATELY. Saturated amber, red and gold belong to the
       telegraph rings and nothing else may borrow them; threat is carried by
       size, shadow weight and turbulence and never by hue. These are bone and
       white, they read on a greyscale screenshot, and they cannot be confused
       with a ring at any saturation — which is the ring separation test.

       AND THEY CANNOT LEAK. Both are a function of ownership, which is a
       property of the POSITION in the commit script and is identical for every
       band that reaches it. They say who is swinging and how hard, which the
       viewer is supposed to know. They never say whether it lands. */
    charge(n, reach){
      let s = '';
      for (let i = 0; i < n; i++){
        // a fan over the shoulders, tightest at the top
        const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.54;
        const x = Math.cos(a) * reach, y = Math.sin(a) * reach;
        // each chevron POINTS BACK AT THE BODY: the mark gathers, never radiates
        s += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(a * 180 / Math.PI + 180).toFixed(1)})">
                <path d="M -11 -11 L 0 0 L -11 11" fill="none" stroke="#f4f9ff"
                      stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
              </g>`;
      }
      return `<g class="fxCharge">${s}</g>`;
    },
    brace(){
      let s = '';
      // weight going DOWN into the ground — the plant
      for (let i = 0; i < 2; i++){
        const rx = 40 + i * 22;
        s += `<path d="M ${-rx} 0 A ${rx} ${(rx * 0.32).toFixed(1)} 0 0 0 ${rx} 0" fill="none"
                    stroke="#e4eef8" stroke-width="${5 - i * 1.6}" stroke-linecap="round"
                    opacity="${(0.9 - i * 0.28).toFixed(2)}"/>`;
      }
      // ...and the shoulders coming up, which is the guard read made explicit
      for (let i = 0; i < 2; i++){
        const x = (i ? 1 : -1) * 44;
        s += `<path d="M ${x - 11} -60 L ${x} -47 L ${x + 11} -60" fill="none" stroke="#f4f9ff"
                    stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>`;
      }
      return `<g class="fxBrace">${s}</g>`;
    },
    /* ================== THE CHARGE, AND WHAT IT FIRES ==================
       The four marks a RANGED commit adds, and the constraint they are all
       built under is the same one the role cue is built under, inverted.

       The role cue is ACHROMATIC because it must never be mistaken for a
       telegraph ring. These four are the opposite: they must never be mistaken
       for a role cue OR a ring, so they are neither achromatic nor reserved —
       they are the ELEMENT'S OWN MATERIAL, the same four colours the body is
       drawn from. Fire's orange into white-hot, ice's bone, water's teal. Not
       one of the three is amber, red or gold, which is not a coincidence: the
       fire palette was already constrained away from deep crimson in v3.5, for
       exactly this reason, one system early.

       So the frame carries three colour channels that cannot collide:
         the ring        amber / red / gold      what is at stake
         the role cue    bone, achromatic        who is swinging
         the discharge   the element's material  what is being thrown

       And the geometry is the argument the role cue already makes, carried
       through to a consequence. The charge CONVERGES; the core is what it
       converged INTO; the bolt is that core leaving. Gather, hold, release —
       three drawings of one event, which is why they share a palette and a
       silhouette and why none of them is a generic energy ball. */

    /* THE CORE — what the chevrons gather into, and the one thing in the game
       that grows during the hold. It is drawn at FULL size and scaled by the
       presenter across the Tell, exactly like the impact panel is drawn at full
       size and held: anything that animates its own geometry inside a freeze is
       a moving picture inside a still one. */
    chargeCore(el){
      const E = BB.config.elements[el] || BB.config.elements.fire;
      // the shards the gather is made of — angular for ICE, round for WATER,
      // licking for FIRE, because the material is the creature everywhere else
      let shard = '';
      for (let i = 0; i < 6; i++){
        const a = (i / 6) * Math.PI * 2, r = 26 + (i % 3) * 9;
        const x = Math.cos(a) * r, y = Math.sin(a) * r * 0.86;
        shard += `<path d="M ${x.toFixed(1)} ${y.toFixed(1)} L ${(x * 0.34).toFixed(1)} ${(y * 0.34).toFixed(1)}"
                    stroke="${E.trail}" stroke-width="${(4 - (i % 3)).toFixed(1)}" stroke-linecap="round"
                    opacity="${(0.85 - (i % 3) * 0.18).toFixed(2)}"/>`;
      }
      return `<g class="fxCore" filter="url(#softGlow)">
        ${shard}
        <circle cx="0" cy="0" r="19" fill="${E.lit}" opacity="0.55"/>
        <circle cx="0" cy="0" r="11" fill="${E.hot}" opacity="0.95"/>
        <circle cx="0" cy="0" r="21" fill="none" stroke="${E.hot}" stroke-width="2" opacity="0.5"/>
      </g>`;
    },

    /* THE MUZZLE — what is left at the body the instant the core leaves it.
       It fires BACKWARD as well as forward, because the whole read of a ranged
       release is that the attacker did not go anywhere: half the energy went
       downrange and the other half went into the ground under its feet. */
    muzzle(el, dir){
      const E = BB.config.elements[el] || BB.config.elements.fire;
      let rays = '';
      for (let i = 0; i < 9; i++){
        const a = -1.15 + (i / 8) * 2.3, r = 34 + (i % 3) * 24;
        rays += `<path d="M 0 0 L ${(Math.cos(a) * r).toFixed(1)} ${(Math.sin(a) * r * 0.8).toFixed(1)}"
                   stroke="${i % 2 ? E.hot : E.lit}" stroke-width="${(4 - (i % 3)).toFixed(1)}"
                   stroke-linecap="round" opacity="${(0.9 - (i % 3) * 0.2).toFixed(2)}"/>`;
      }
      return `<g class="fxMuzzle" transform="scale(${dir} 1)" filter="url(#softGlow)">
        ${rays}
        <ellipse cx="8" cy="0" rx="26" ry="17" fill="${E.hot}" opacity="0.8"/>
        <ellipse cx="8" cy="0" rx="42" ry="9"  fill="${E.lit}" opacity="0.45"/>
      </g>`;
    },

    /* THE BOLT. Deliberately the same silhouette as `thrust` — a tapered head
       with the weight at the front and a tail behind it — because a viewer has
       already been taught by four melee commits that THIS SHAPE MEANS A BLOW
       ARRIVING. What changes is that the shape is now a separate object
       travelling across the gap instead of a smear drawn on a body, and that it
       is made of the attacker's material rather than of impact white.

       Drawn pointing +x and flipped by `dir`, like every other directional mark
       in the file, so the geometry is written once. */
    beam(el, len, thick, dir){
      const E = BB.config.elements[el] || BB.config.elements.fire;
      const L = Math.max(48, len), w = Math.max(6, thick);
      let tail = '';
      for (let i = 0; i < 3; i++){
        const s = 1 - i * 0.28, x = -L * (0.34 + i * 0.2);
        tail += `<path d="M ${x.toFixed(1)} ${(-w * s * 0.72).toFixed(1)} L ${(x + L * 0.2).toFixed(1)} 0 L ${x.toFixed(1)} ${(w * s * 0.72).toFixed(1)}"
                   fill="none" stroke="${E.hot}" stroke-width="${(2.4 * s + 1.2).toFixed(1)}"
                   stroke-linecap="round" stroke-linejoin="round" opacity="${(0.68 - i * 0.18).toFixed(2)}"/>`;
      }
      const head = `M ${-L} 0 L ${(-L * 0.42).toFixed(1)} ${-w} L ${(w * 0.7).toFixed(1)} 0 L ${(-L * 0.42).toFixed(1)} ${w} Z`;
      return `<g class="fxBeam" transform="scale(${dir} 1)" filter="url(#softGlow)">
        <path d="${head}" fill="${E.lit}" opacity="0.9"/>
        <path d="${head}" fill="none" stroke="${E.hot}" stroke-width="2.4" stroke-linejoin="round" opacity="0.95"/>
        <ellipse cx="${(w * 0.1).toFixed(1)}" cy="0" rx="${(w * 0.8).toFixed(1)}" ry="${(w * 0.62).toFixed(1)}" fill="${E.hot}" opacity="0.9"/>
        ${tail}
      </g>`;
    },

    /* IT BREAKS ON THE GUARD. The block's own read is "your blow was stopped",
       and against a discharge the only body available to be stopped is the bolt
       itself — so it shatters and throws itself BACK along the line it came in
       on, which is the same picture as an attacker rebounding off a shield and
       the only one available when the attacker never left its mark. */
    beamBreak(el, dir){
      const E = BB.config.elements[el] || BB.config.elements.fire;
      let frag = '';
      for (let i = 0; i < 9; i++){
        const a = Math.PI - 1.05 + (i / 8) * 2.1, r = 40 + (i % 4) * 22;
        frag += `<path d="M 0 0 L ${(Math.cos(a) * r).toFixed(1)} ${(Math.sin(a) * r * 0.82).toFixed(1)}"
                   stroke="${i % 2 ? E.hot : E.trail}" stroke-width="${(3.4 - (i % 3) * 0.8).toFixed(1)}"
                   stroke-linecap="round" opacity="${(0.92 - (i % 3) * 0.2).toFixed(2)}"/>`;
      }
      return `<g class="fxBeamBreak" transform="scale(${dir} 1)" filter="url(#softGlow)">
        <path d="M -4 -40 A 46 46 0 0 1 -4 40" fill="none" stroke="${E.hot}" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
        ${frag}
      </g>`;
    },

    /* Scuffle dust. The whole vocabulary of a harmless contact — no flash, no
       shake, no knockback. If this looked like a hit, the Tell would mean
       nothing when it came. */
    scuffle(){
      let s = '';
      for (let i = 0; i < 5; i++){
        const x = -20 + i * 10, r = 3 + (i % 3) * 2;
        s += `<circle cx="${x}" cy="${-(i % 2) * 5}" r="${r}" fill="#cfe0f0" opacity="${0.28 + (i%3)*0.1}"/>`;
      }
      return `<g class="fxScuffle">${s}</g>`;
    },
    burst(n, kind){
      const gold = kind === 'gold';
      let s = '';
      for (let i = 0; i < n; i++){
        const a = (i * 2.399) % (Math.PI * 2);
        const r = 40 + (i % 7) * 26;
        const sz = 3 + (i % 4) * 2.2;
        const c = gold ? (i % 3 ? '#ffe9a3' : '#f2c14e') : (i % 3 ? '#ff9a7a' : '#e8452c');
        s += `<circle class="mote m${i}" cx="0" cy="0" r="${sz}" fill="${c}"
                style="--dx:${(Math.cos(a)*r).toFixed(1)}px;--dy:${(Math.sin(a)*r - 40).toFixed(1)}px;--d:${(i%9)*36}ms"/>`;
      }
      return `<g class="fxBurst" filter="url(#softGlow)">${s}</g>`;
    },
    charmFlare(){ return `<g class="fxCharm"><circle r="26" fill="url(#goldBloom)"/><circle r="9" fill="#fff3c4" filter="url(#bigGlow)"/></g>`; },
    bloom(kind){ return `<g class="fxBloom"><circle r="120" fill="url(#${kind==='gold'?'goldBloom':'redBloom'})"/></g>`; },
    meteor(){ return `<g class="fxMeteor" filter="url(#bigGlow)">
      <path d="M 0 0 L -70 -150 L -54 -152 Z" fill="#ffe9a3" opacity="0.8"/>
      <circle cx="0" cy="0" r="10" fill="#fff3c4"/><circle cx="0" cy="0" r="5" fill="#fff"/></g>`; },
    crack(color){
      const c = color==='gold' ? '#ffd700' : '#e8452c';
      const glow = color==='gold' ? '#fff3c4' : '#ff9a7a';
      return `<g class="fxCrack" filter="url(#softGlow)">
        <path class="crackPath" d="M 0 -62 L -12 -74 L -8 -92 L -22 -104 M 0 -62 L 14 -70 L 12 -92 L 28 -100
                 M 0 -62 L -18 -52 L -34 -58 M 0 -62 L 16 -48 L 20 -30 L 36 -22 M 0 -62 L -6 -40 L -18 -24"
              stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path class="crackPath2" d="M 0 -62 L -12 -74 L -8 -92 M 0 -62 L 16 -48 L 20 -30" stroke="${glow}" stroke-width="1.8" fill="none"/>
      </g>`;
    },

    /* ------------------------------------------------ THE SIGNATURE MOVES
       One per species, and the fx is the punctuation on the move's button —
       small, crisp, and over before the next drop. These fire in an Aftermath
       and nowhere else, so they must never read like a Clash: no flash, no
       screenshake at the rung tier, nothing that could be mistaken for a
       blow landing. */
    sig(kind, accent){
      const c = accent || '#dff5ff';
      if (kind === 'sparks'){
        let s = '';
        for (let i = 0; i < 9; i++){
          const a = -2.5 + (i / 8) * 2.0, r = 26 + (i % 4) * 13;
          s += `<circle class="mote" r="${2 + (i%3)}" fill="${i%2?c:'#fff3c4'}"
                  style="--dx:${(Math.cos(a)*r).toFixed(1)}px;--dy:${(Math.sin(a)*r).toFixed(1)}px;--d:${(i%5)*40}ms"/>`;
        }
        return `<g class="fxBurst fxSig" filter="url(#softGlow)">${s}</g>`;
      }
      if (kind === 'snow'){
        let s = '';
        for (let i = 0; i < 11; i++){
          const a = (i * 2.399) % (Math.PI * 2), r = 20 + (i % 5) * 11;
          s += `<circle class="mote" r="${2.4 + (i%3)*1.4}" fill="${i%3?'#eaf6ff':c}" opacity="0.9"
                  style="--dx:${(Math.cos(a)*r).toFixed(1)}px;--dy:${(Math.sin(a)*r*0.7 - 14).toFixed(1)}px;--d:${(i%6)*44}ms"/>`;
        }
        return `<g class="fxBurst fxSig">${s}</g>`;
      }
      // Tidecrate's Tide Roll — a sheet of water going out sideways, low.
      if (kind === 'spray'){
        let s = '';
        for (let i = 0; i < 5; i++){
          const y = -10 - i * 7, w = 26 + (i % 3) * 14;
          s += `<path d="M ${-w} ${y} q ${w * 0.5} ${-9} ${w * 1.1} ${-2} q ${-w * 0.4} ${7} ${-w * 1.1} ${2} z"
                   fill="${c}" opacity="${(0.75 - i * 0.11).toFixed(2)}"/>`;
        }
        return `<g class="fxSig fxSpray">${s}</g>`;
      }
      // Bubblewrap's Pop Cascade — cells letting go, one after another.
      let s = '';
      for (let i = 0; i < 8; i++){
        const a = -2.9 + (i / 7) * 2.4, r = 22 + (i % 4) * 13;
        s += `<circle class="mote" r="${4 - (i % 3)}" fill="none" stroke="${i%2?c:'#9df0e6'}" stroke-width="2"
                style="--dx:${(Math.cos(a)*r).toFixed(1)}px;--dy:${(Math.sin(a)*r).toFixed(1)}px;--d:${(i%4)*52}ms"/>`;
      }
      return `<g class="fxBurst fxSig">${s}</g>`;
    },

    /* THE FULL PYRO BUDGET — reserved absolutely for the 0.05%. Six columns
       of sparks going UP, which is the one direction nothing else in the
       product moves, plus confetti. If this ever fired below the Grail it
       would stop meaning the Grail. */
    pyro(n){
      let s = '';
      for (let i = 0; i < 6; i++){
        const x = -260 + i * 104, h = 210 + (i % 3) * 70;
        s += `<g class="pyroCol" style="--d:${(i%4)*90}ms">
                <rect x="${x-2}" y="${-h}" width="4" height="${h}" fill="url(#goldGrad)" opacity="0.55"/>
                <circle cx="${x}" cy="${-h}" r="7" fill="#fff8dd"/></g>`;
      }
      for (let i = 0; i < n; i++){
        const a = (i * 2.399) % (Math.PI * 2), r = 60 + (i % 9) * 34;
        const c = ['#ffe9a3','#f2c14e','#fff','#6fb7ff','#ff9a7a'][i % 5];
        s += `<rect class="mote" x="-3" y="-5" width="6" height="10" rx="1.4" fill="${c}"
                transform="rotate(${(i*61)%360})"
                style="--dx:${(Math.cos(a)*r).toFixed(1)}px;--dy:${(Math.sin(a)*r - 120).toFixed(1)}px;--d:${(i%12)*46}ms"/>`;
      }
      return `<g class="fxBurst fxPyro" filter="url(#softGlow)">${s}</g>`;
    },
  };

  /* ------------------------------------------------------- PRIZE ICONS
     One per band, for the board's tier cards. These are the MODAL item of
     each band — the thing you are most likely to actually get — drawn in a
     36x36 box, and deliberately cool and flat: they sit in the periphery for
     the whole run and must never pull a glance away from the ring. */
  const PRIZE = {
    sticker: `<rect x="-13" y="-15" width="26" height="30" rx="2.5" fill="#e4edf2" stroke="#9db4c0" stroke-width="1.6"/>
              <circle cx="-4" cy="-6" r="5" fill="#8fd6ff"/><path d="M 2 3 l 6 -7 l 6 10 z" fill="#6fb7ff"/>
              <path d="M -13 9 l 26 -5" stroke="#9db4c0" stroke-width="1.2" stroke-dasharray="3 2"/>`,
    deckbox: `<path d="M -13 -6 l 13 -7 l 13 7 l 0 15 l -13 7 l -13 -7 z" fill="#c8d6e4" stroke="#8496ab" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M -13 -6 l 13 7 l 13 -7" fill="none" stroke="#8496ab" stroke-width="1.6"/>
              <path d="M 0 1 l 0 15" stroke="#8496ab" stroke-width="1.4"/>`,
    holo:     `<rect x="-11" y="-15" width="22" height="30" rx="2.4" fill="#26456e" stroke="#9db4c0" stroke-width="1.6"/>
              <circle cx="0" cy="-4" r="6" fill="#bfe6ff" stroke="#8fd6ff" stroke-width="1.2"/>
              <path d="M -7 12 l 14 0" stroke="#8fd6ff" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M -11 6 l 22 -12" stroke="#ffffff" stroke-width="2.4" opacity="0.45"/>`,
    case:     `<rect x="-15" y="-10" width="30" height="22" rx="2" fill="none" stroke="#c8d6e4" stroke-width="1.8"/>
              <rect x="-15" y="-10" width="30" height="22" rx="2" fill="#8fd6ff" opacity="0.16"/>
              <path d="M -15 -10 l 4 -5 l 22 0 l 4 5" fill="none" stroke="#c8d6e4" stroke-width="1.8" stroke-linejoin="round"/>
              <circle cx="0" cy="1" r="4.6" fill="#dff2ff"/>`,
    auric11:  `<path d="M 0 -16 l 4.6 10 l 11 1.4 l -8 7.6 l 2.2 10.8 l -9.8 -5.4 l -9.8 5.4 l 2.2 -10.8 l -8 -7.6 l 11 -1.4 z"
                 fill="#dff2ff" stroke="#9fd0f5" stroke-width="1.4" stroke-linejoin="round"/>
              <circle cx="0" cy="-1" r="3.2" fill="#ffffff"/>`,
  };
  /* The icons are ICE, not gold — even the Grail's. The reserved color rule
     is absolute outside the Vault endgame, and the top rung is on screen from
     the first frame of every run, including the 59.95% that never leave the
     floor. A gold star up on that peak for thirty seconds would teach the
     ring grammar wrong before the first tell ever fires.

     Bare markup, drawn around its own origin in a 36-unit box: it goes
     straight into the arena's SVG, on a rung and on the card that flies off
     it, at whatever scale each needs. */
  function prizeGlyph(id){ return PRIZE[id] || PRIZE.sticker; }

  // ------------------------------------------------------------- helpers
  function shade(hex, amt){
    const n = parseInt(hex.slice(1),16);
    const r = Math.max(0,Math.min(255,(n>>16)+amt)), g=Math.max(0,Math.min(255,((n>>8)&255)+amt)), b=Math.max(0,Math.min(255,(n&255)+amt));
    return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
  }
  function mix(hexA, hexB, t){
    const a=parseInt(hexA.slice(1),16), b=parseInt(hexB.slice(1),16);
    const ch=(sa,sb)=>Math.round(sa+(sb-sa)*t);
    const r=ch(a>>16,b>>16), g=ch((a>>8)&255,(b>>8)&255), bl=ch(a&255,b&255);
    return '#'+((r<<16)|(g<<8)|bl).toString(16).padStart(6,'0');
  }

  return { arena, creature, boxArt, fragments, auric, fx, elementLayers,
           prizeGlyph, tierCard, tierShards, tapeCard, shade, mix };
})();

</script>
<script>
/* ---- js/registry.js ---- */
/* Boxlings Battle — the Registry. Every open banks something, permanently.
   Nothing in here can read or touch a drop table, a band, or a terminal rung
   decision — it only records what already happened. */
window.BB = window.BB || {};
BB.registry = (() => {
  const KEY = 'bb-registry-v1';

  /* ODYSSEY STAMPS AND PATH BADGES ARE CUT.
     Two collections that both read as "you got a thing" without ever saying
     what the thing was for, stacked on a receipt that already had a prize, a
     salvage line and a witness card on it. Three currencies at the end of a
     three-second loss is two too many, and the one that survives is the one
     tied to something the player actually watched happen.

     The counters stay in the shape below so an existing localStorage record
     is not thrown away — nothing reads them, nothing writes them, and if they
     come back the history comes back with them. */
  function blank(){
    return {
      opens: 0, spend: 0, returned: 0,
      stamps: {},                 // cut — kept so saved records survive
      witness: { stormFront:0, auricTrace:0, goldMeteor:0, vaultSeen:0 },
      badges: {},                 // cut — kept so saved records survive
      packKey: null,              // the pack the current streak is running
      packStreak: 0,
      recentGags: [],             // anti-repeat window (cosmetic context only)
      bestPull: null,
      log: [],                    // last 40 receipts
    };
  }

  let data = blank();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) data = Object.assign(blank(), JSON.parse(raw));
  } catch(e){ /* fresh */ }

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} };

  function terminalLabel(plan){
    if (plan.vaultWin) return 'the Vault, taken';
    if (plan.vaultLoss) return 'the Vault, denied';
    if (plan.terminal === 1) return 'boxed at the opener';
    return 'rung ' + (plan.terminal - 1);   // rung 1 is the opener, not a fight
  }

  /* Bank one open. Returns the lines to print on the receipt. */
  function bank(plan, choices){
    const lines = [];
    data.opens++; data.spend += BB.config.box.price; data.returned += plan.item.value;

    /* WITNESS CARDS ARE THE ONE COLLECTION LEFT. They record something the
       player watched happen on screen — a Storm Front, an Auric Trace, the
       Vault itself, the Gold Meteor — rather than an abstract score for
       having pressed the button, which is what the stamps and the badges
       were. One currency, tied to the image that earned it. */
    for (const o of (choices.omensSeen||[])){
      data.witness[o]++;
      if (data.witness[o] === 1) lines.push(`NEW Witness card: ${BB.config.omens[o]?.name || o}`);
    }
    if (plan.terminal === plan.height){
      data.witness.vaultSeen++;
      if (data.witness.vaultSeen === 1) lines.push('NEW Witness card: The Vault');
    }

    const members = plan.packSnapshot.members;
    const packKey = members.map(m => m.speciesId + '.' + m.colorway).join('-');
    if (data.packKey === packKey) data.packStreak++;
    else { data.packKey = packKey; data.packStreak = 1; }

    // Anti-repeat gag window (last 3).
    if (!plan.openerContinue){
      data.recentGags = [plan.gag].concat(data.recentGags).slice(0,3);
    }
    if (!data.bestPull || plan.item.value > data.bestPull.value)
      data.bestPull = { name: plan.item.name, value: plan.item.value };

    data.log.unshift({
      when: Date.now(), item: plan.item.name, value: plan.item.value,
      ended: terminalLabel(plan), demo: plan.demo,
    });
    data.log = data.log.slice(0, 40);
    save();
    return lines;
  }

  return {
    get data(){ return data; },
    bank,
    recentGags: () => data.recentGags.slice(),
    reset(){ data = blank(); save(); },
  };
})();

</script>
<script>
/* ---- js/planner.js ---- */
/* Boxlings Battle — run planner (reverse authoring).
   Given a seal, authors the whole run backward from the fixed ending.
   Pure and synchronous: same seal -> byte-identical plan, every time.

   What it authors changed with the reveal rework. There is no simulation left
   to run: no HP to subtract, no elements to compare, no moves to choose. A
   fight is a SEQUENCE OF BEATS, each of which names the momentum both bodies
   are in after it lands. The plan is a shot list, not a battle.

   Stream discipline (pillar 3):
   - outcome:  the draw and the terminal rung. Touches nothing visual.
   - script:   which authored fight shape plays. It must know the terminal rung.
   - tells:    omens, at published rates only.
   - cosmetic: names, skins, gag picks, which of the rung's legal mismatch
               levels is used. Never sees the outcome.
   - matchup:  the rival's element per rung, and the upset draw. Uniform over
               the closed three-ring and blind to what the player packed, so
               every packing meets a counter, a mirror and a countering rival
               at exactly 1/3 each. Its own stream so that neither can
               correlate with the band — see fair.js. */
window.BB = window.BB || {};
BB.planner = (() => {
  const F = BB.fair, C = BB.config;

  function drawItem(rng, forcedBand){
    let pool = C.box.dropTable;
    if (forcedBand != null){
      const b = C.bands[forcedBand];
      pool = pool.filter(it => {
        const m = it.value / C.box.price;
        return m >= b.range[0] && m < b.range[1];
      });
    }
    return F.weighted(rng, pool);
  }
  const bandOf = mult => C.bands.find(b => mult >= b.range[0] && mult < b.range[1]);

  // ------------------------------------------------------------------ a rung
  /* THE COMMIT SCRIPT IS BAND-BLIND. The commits at a rung, their owners,
     their rings and the momentum states at every phase come from
     C.commitScript and depend on POSITION ONLY. The planner's entire job here
     is to decide, per band, WHICH clash is fatal — and to truncate the list
     there, because a run that ends does not play the commits after it.

     Everything else it draws (name, skin, choreography seed, arena side) is
     cosmetic and explicitly varied, because the invariance rule demands
     cosmetic variance and forbids informational variance. */
  /* ====================== THE MATCHUP SCHEDULE ======================
     Drawn for EVERY rung the game has, in one pass, BEFORE a single rung is
     authored and before the band has been consulted about anything.

     Doing it here rather than inside scriptRung is not tidiness — it is the
     only way the schedule can be band-blind. A run only AUTHORS the rungs it
     reaches, so drawing per authored rung put the Vault's draw at a
     band-dependent offset in the stream, and made the one-dodge-per-run rule
     (which prefers the highest rung) depend on whether this band happened to
     reach the Vault at all. Two draws per rung, every rung, every band: the
     schedule is a pure function of the seal and of what the player packed, and
     the band cannot reach it.

     THE ELEMENT is uniform over the closed three-ring and blind to the pack,
     which is the false-belief guard's second rule made structural: uniform
     over a three-ring means every packing meets a counter, a mirror and a
     countering rival at exactly 1/3 each, so no packing choice can meet more
     counters than any other.

     THE UPSET is drawn at the position's published rate, and only counts where
     there is a favourite to upset — on a mirror the card said nothing, so
     there is nothing to contradict. It changes WHICH commit resolves the rung
     and HOW; it can never reach whether the run continues, because the band
     decided that at the seal. */
  /* ================== WHAT v3.6 CHANGED IN HERE ==================
     THE ELEMENT IS NO LONGER A FREE DRAW. It used to be uniform over the
     three-ring and blind to the pack, which is a beautiful guard that produced
     a lie: a uniform draw put FAVOURED on the rung 1 card a third of the time,
     in front of the commit that ends 65% of the runs that reach it. The edge
     is now scheduled by position — see `C.rivalElementFor` and THE HONESTY
     RULE — so a killing commit is EVEN or OUTMATCHED and never favourable, and
     FAVOURED appears on no card at all.

     Both draws still happen for EVERY rung the game has, in one pass, before a
     single rung is authored and before the band has been consulted about
     anything. That discipline is unchanged and it is still the only thing
     making the schedule band-blind: a run only AUTHORS the rungs it reaches,
     so drawing per authored rung would put the Vault's draw at a
     band-dependent offset in the stream.

     THE SECOND DRAW IS NOW DEAD WEIGHT ON THE SHIPPING PATH, and it is drawn
     anyway. The v3.5 upset is gated off, but taking its draw out would shift
     every subsequent `matchup` value and change the element schedule for every
     seal that already exists — so it is consumed and discarded, which keeps
     replays of old seals bit-identical and keeps the two A/B arms sitting at
     the same stream offsets. */
  function matchupSchedule(S, playerEl){
    const out = {};
    for (let rung = 2; rung <= C.height; rung++){
      const { element, edge } = C.rivalElementFor(playerEl, rung, S.matchup());
      const drawn = S.matchup() < (C.upset.rate[rung] || 0);
      /* v3.6: there is no upset dial. The upset rate IS the published survival
         rate at each killing commit, and the upset is SURVIVAL rather than
         defeat. The v3.5 arm stays reachable behind `live.upsetModel`. */
      const upset = C.upsetActive() &&
        (edge !== 'even' || !C.upset.needsEdge) &&
        (C.live.forceUpset === 'on' ? true : C.live.forceUpset === 'off' ? false : drawn);
      /* WHERE A DODGE WOULD GO at this rung, chosen off the SCRIPT and so a
         function of position only. Candidates are RIVAL commits: the dodge is
         the player slipping a killing blow, and on a player commit the rival
         is the defender, which is what the slip already covers. That exclusion
         is also what makes "never on the WITNESS strike" structural rather
         than asserted — the WITNESS strike is the player's. Highest stakes
         first, because an upset that lands on the smallest moment available is
         an upset nobody will remember.

         Picking off the script rather than off this band's (truncated) commit
         list is the point. Picking off the commit list slid band 3's dodge
         DOWN to rung 2's amber, because its red was fatal, while band 4's
         stayed on the red — so a dodge on the amber announced, a full commit
         before the red's Tell, that this run dies on the red. */
      const site = (C.commitScript[rung] || [])
        .map((s, i) => ({ i, ring: s.ring, owner: s.owner }))
        .filter(s => s.owner === 'rival' && s.ring !== 'scuffle')
        .sort((a, b) => (a.ring === 'red' ? 1 : 0) - (b.ring === 'red' ? 1 : 0) || a.i - b.i)
        .pop();
      /* THE SITE IS ONLY THE v3.5 ARM'S PROBLEM NOW. Under v3.6 there is
         nothing to site: the dodge is what surviving a killing commit LOOKS
         like, so its position is the fatal table's, it is stamped per commit
         below, and there is no draw to leak. */
      /* THE ESCAPE — whether the rival gets out of this rung's gold and forces
         it to be thrown twice. Drawn off `script`, which is the stream that was
         reserved for "which authored fight shape plays" and had never been
         spent on anything. Drawn for EVERY rung here, before a single rung is
         authored, for the same reason the element is: a run only authors the
         rungs it reaches, so drawing it later would put the Vault's draw at a
         band-dependent offset and make the shape of rung 1 depend on how far
         this particular band was always going to get. */
      out[rung] = { element, edge, upset, escape: false,
                    dodgeAt: (C.upsetActive() && upset && edge === 'outmatched' && site) ? site.i : -1 };
    }

    /* THE ESCAPE, sited once per run. Firing it on every rung independently
       put a Grail at 39s against a 33s cap — two extra golds is most of a
       fourth rung. One per run keeps "it can happen on any rung" while
       leaving the run a run: sometimes rung 1, sometimes rung 2, often
       neither, and never the same shape twice in a row.

       Two draws off `script`, always, whatever the band — and the site is
       chosen from every rung the game HAS rather than the rungs this band
       reached. That is the same trap the dodge fell into in v3.5: choosing
       over reached rungs made a MISSING escape low down quietly mean "this run
       goes all the way". */
    const goldRungs = Object.keys(out).map(Number)
      .filter(r => (C.commitScript[r] || []).some(s => s.owner === 'player'));
    const fires = S.script() < C.escape.chance;
    const pick  = S.script();
    if (fires && goldRungs.length){
      const at = goldRungs[Math.min(goldRungs.length - 1, Math.floor(pick * goldRungs.length))];
      out[at].escape = true;
    }
    /* THE RULE AGAINST REPETITION, and v3.6 drops it. It existed to stop a
       RARE event repeating until it stopped reading as lucky; the dodge is not
       rare any more, it is what surviving a killing commit looks like, and a
       run that survived two of them should show the same image twice because
       it did the same thing twice. A run can survive at most two anyway.

       It still applies to the v3.5 arm, where a dodge really is a drawn
       flourish: one per run, the highest on the climb, decided over every rung
       the game HAS rather than the rungs this band reached — otherwise a
       MISSING dodge low down would quietly mean "this run goes all the way". */
    if (C.upsetActive())
      Object.keys(out).map(Number).filter(r => out[r].dodgeAt >= 0)
        .sort((a, b) => b - a).slice(C.dodge.maxPerRun)
        .forEach(r => { out[r].dodgeAt = -1; });
    return out;
  }

  function scriptRung(rung, fatalIndex, leadIndex, S, playerEl, m, playerSp, clockSeed){
    const script = C.commitScript[rung] || [];
    /* THE RUNG'S CLOCK, planned in one pass before any commit is authored,
       because the variance floor is a property of the SEQUENCE and cannot be
       decided a commit at a time. It is a pure function of (seal, rung) — it
       never sees `fatalIndex`, so it cannot know which band this is, and two
       bands arriving here get the identical schedule for every position they
       both play. */
    const clk = C.clockPlan(rung, 1, clockSeed);
    const names = C.rivalNames[rung] || C.rivalNames[2];
    const { element, edge, upset } = m;
    const rival = {
      name: F.pick(S.cosmetic, names),
      element,
      /* The SPECIES is drawn from the ones that actually ARE that element,
         rather than independently. "The element IS the creature" is the rule
         the whole matchup rests on, and a FIRE-bodied rival labelled WATER
         would break it on the first frame.

         AND NEVER THE PLAYER'S OWN BODY. A mirror is a match of the same
         MATERIAL, not the same creature — two elements meeting with neither
         one countering. v3.6 makes rung 1 a mirror half the time, where the
         old uniform draw made it a third, so the odds of the rival turning up
         as a copy of the Boxling you packed rose with it. Two bodies per
         element is exactly enough to always have another one to reach for; the
         fallback keeps this honest if that ever stops being true. It costs the
         same single cosmetic draw either way, so no stream position moves. */
      /* Excluded ONLY while that still leaves a choice. There are two bodies
         per element, so on a mirror rung "not your own Boxling" leaves exactly
         one — which turned a cosmetic draw into a constant and made every
         mirror match the same creature. A same-species mirror is legitimate
         and it reads clearly anyway, because the rival carries the rung's tint
         and its own entrance. Variance outranks the nicety. */
      speciesId: F.pick(S.cosmetic, (list => {
                    const others = list.filter(s => s.id !== playerSp);
                    return others.length > 1 ? others : list;
                  })(C.speciesOfElement(element))).id,
      tint: C.rivalTint[rung] || C.rivalTint[2],
      /* How this one arrives and comes out of its box, for the walkout. The
         beat structure is fixed and the performance inside it never repeats.
         Cosmetic stream: it carries nothing, and it never sees the outcome. */
      entrance: F.pick(S.cosmetic, C.walkout.entrances).id,
    };
    const commits = [];
    for (let i = 0; i < script.length; i++){
      const s = script[i];
      const fatal = i === fatalIndex;
      /* How the clash reads. Fixed by position everywhere except the
         block/dodge choice, which is a cosmetic draw of equal duration — so
         it varies run to run and still cannot tell you anything. */
      const key = (fatal || s.owner === 'player') ? 'critical'
                : s.ring === 'red' ? 'land' : null;
      let resolve = key || (S.cosmetic() < 0.5 ? 'block' : 'dodge');
      /* AN UPSET IS A VARIATION IN THE TELLING, and the telling has two arms.
         The dodge below is the OUTMATCHED arm — the body that should have
         fallen and did not. This is the FAVOURED arm, and it is the one the
         dodge cannot cover: a favourite that is upset either loses to
         something it should have beaten (the fatal clash, flagged for the
         framing) or wins by the skin of its teeth — which means the blow it
         was supposed to turn aside CONNECTS. A block becomes a near-finish.

         The cosmetic coin above is drawn either way, so the stream positions
         two bands share are untouched and the leak audit still holds. */
      const skinOfTeeth = upset && edge === 'favoured' && !fatal &&
                          s.owner === 'rival' && !key;
      if (skinOfTeeth) resolve = 'land';
      /* THE SLIP — the rival's one defensive read, and the only one the script
         has room for. It can only happen on a player commit, because that is
         the only clash in the run where the rival is the DEFENDER. It slips the
         first swing and the finisher still lands, in the same commit, for the
         same duration. Cosmetic draw: never a function of band, and the gold
         kills either way, so it carries nothing. */
      /* The rival defends the first swing of EVERY gold — that part is
         structural, because it costs real time and a cosmetic draw may never
         change a run's length. WHICH defence is the coin flip, and both arms
         run for exactly the same duration, so the draw is free. Drawn only on
         player commits, exactly as before, so no stream position moves. */
      const slip = s.owner === 'player';
      /* THREE ARMS NOW, not two, and still exactly ONE draw off the cosmetic
         stream — so no stream position moves and the leak audit is untouched.
         `slip` stays true either way, because the BUDGET is structural: what
         varies is what the rival spends it on, never how long the commit is. */
      const slipKind = slip ? F.weighted(S.cosmetic, C.hit.defence).id : null;
      /* WHICH SURVIVAL IMAGE, if this commit is survived. Drawn on every
         killing commit whether or not this band lives through it, so the draw
