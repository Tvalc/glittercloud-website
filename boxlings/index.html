    peril:    [1.00, 1.45],   // rung 2 — where the red lives
    pressure: [1.00, 1.90],   // the Vault — top of v3.6's 1.4–1.9, and it cannot kill
  };
  /* Does the rival tower here? The confrontation frame's tilt, the aura, the
     shadow weight and the underdog tally all used to test the literal strings
     `unfavorable` and `dire`, which is how a rename turns into four silent
     behaviour changes. They ask the ratios now. */
  const rivalBigger = m => { const r = mismatchRatio[m] || [1, 1]; return r[1] > r[0]; };
  const mismatchDire = m => m === 'pressure';

  /* THE FINISH, AND WHY IT IS MOMENTUM RATHER THAN A BODY SWAP.
     v3.6 asks for rival size 0.7–0.9 at a finish commit and an element the
     player counters. A rung has ONE rival, and in a closed three-ring a rival
     that counters you cannot also be countered by you — so a rung cannot be
     OUTMATCHED at commit A and elementally FAVOURED at commit B without
     swapping the body mid-fight.

     So the element is fixed per rung by that rung's KILLING commit, and the
     finish's 0.7–0.9 is an APPARENT ratio: by the time the gold lands the
     rival has been driven to PRESSURED and then DOWN, and it is diminished on
     screen to this fraction of the frame it walked in at. FAVOURED at a gold
     is therefore a momentum read — earned in front of the viewer over the
     course of the rung — and not a claim about the elemental ring. The promise
     is still kept every time, which is the only thing THE HONESTY RULE asks
     of it. */
  const finishRatio = 0.80;

  /* Camera and threat for the confrontation frame. Tilt looks UP at the
     stronger side: the ground line drops toward whoever is winning the frame,
     and the horizon comes down with it.

     ================== THE COLOUR CHANNEL PROBLEM ==================
     THREAT IS NO LONGER CARRIED BY HUE, and this is the one change in the art
     spec that was going to cause a real bug rather than a cosmetic one.

     The frame used to say cool blue = beatable, hot red = dangerous. ICE and
     WATER are both blue, so under that rule EVERY ICE rival read as beatable
     regardless of its actual threat, and every FIRE rival read as dangerous.
     Two systems, one channel, and the newer one wins by accident.

     Three systems now want colour at once, so each gets a channel of its own:

       telegraph rings   saturated amber / red / gold, on the GROUND PLANE
                         only, hard geometric edges, pulsing on a clock
       creature elements material treatment — fill, edge quality, internal
                         light, motion. Never a fully saturated ring hue.
       threat            SIZE, ground-shadow WEIGHT, and aura TURBULENCE.
                         Not hue. No colour coding at all.
       the board         neutral only: bone, slate, ash, plus the lock's gold
                         border. The two-card Vault endgame is the one
                         licensed exception.

     A dangerous rival is bigger, its ground shadow is heavier and darker, and
     its aura is turbulent and agitated. A beatable one is smaller, its shadow
     is light, and its aura is calm and slow. THIS READS ON A GREYSCALE
     SCREENSHOT, which the colour version never did — and that is the art
     spec's first acceptance test. */
  const confront = {
    ms: 1200,             // the frame itself
    tiltDeg: 2.6,         // maximum ground-line skew
    horizonDrop: 16,      // px the world sinks toward the stronger side
    /* The aura is now achromatic and says its piece with AGITATION. Values are
       the turbulence rate multiplier and the opacity it settles at. */
    auraCalm:      { rate: 0.35, opacity: 0.55, swell: 1.02 },
    auraAgitated:  { rate: 1.00, opacity: 0.92, swell: 1.14 },
    /* Ground-shadow weight, the third leg of the read and the one that
       survives every filter: a heavy body sits in a heavy shadow. */
    shadowLight: 0.42,
    shadowHeavy: 1.00,
    keepScale: 1.0,       // 1 = the rival stays as big during the fight as in the frame
  };

  /* MOMENTUM — the one shared read per fight. No meter exists; the state is
     legible from posture, position and animation alone. `lean` is degrees
     toward the opponent, `rise` a vertical offset (positive = sinking),
     `advance` px toward the opponent (negative = giving ground). */
  const momentum = {
    tween: 380,            // never snap; the transition IS the read
    downTween: 260,
    states: {
      DOMINANT:  { lean:  9, rise: -5, sx:1.04, sy:1.07, advance:  78, guard:'up',    ex:'fierce'  },
      EVEN:      { lean:  0, rise:  0, sx:1.00, sy:1.00, advance:   0, guard:'none',  ex:'normal'  },
      PRESSURED: { lean:-11, rise:  5, sx:1.05, sy:0.93, advance: -64, guard:'block', ex:'worried' },
      BUCKLING:  { lean:-21, rise: 13, sx:1.09, sy:0.81, advance:-142, guard:'drop',  ex:'worried' },
      DOWN:      { lean:-84, rise:  4, sx:1.00, sy:1.00, advance:-158, guard:'none',  ex:'ko'      },
    },
    order: ['DOWN','BUCKLING','PRESSURED','EVEN','DOMINANT'],
  };

  /* ------------------------------------------------------------ THE COMMIT
     A fight is continuous motion punctuated by commits. A commit is ONE
     telegraphed, uncancelable, decisive attack in four phases. The turn
     exchange is gone: turns are a metronome, and a metronome gives you
     nothing to brace for. The clench in the opener is the whole grammar —
     every commit is that clench, learned in the first three seconds.

       Circle    continuous stalking and scuffle. Nothing here can end anything.
       Tell      the attacker plants. Ring under the target, camera pushes in.
       Clash     lands or survived. All the hit juice fires here and only here.
       Aftermath reset, or the finish.                                        */
  const commit = {
    tell: 500,
    tellChips: [300, 500, 700],
    clash: 250,
    aftermath: { min: 400, max: 1000 },
    circle:    { min: 500, max: 1400 },
    slowMo: 1.15,        // red and gold tells only; 1 = off
    ringScale: 1.0,
    pushIn: 1.06,        // the camera's only move besides shake
    scuffleEvery: 430,   // a harmless contact roughly this often while circling
    turboCircle: 200,    // absolute at 2x/4x — circle collapses, it never vanishes
    turboConfront: 400,
  };

  /* --------------------------------------------------- THE TELL IS A FREEZE
     The v3 instruction said the attacker plants and winds up while the camera
     pushes in. Built literally that is a RAMP — two shapes speeding up at each
     other — and a ramp has no moment of commitment in it and nothing to brace
     against. Design v5 corrects it: continuous motion is the Circle's job, and
     the Tell's power comes from the motion STOPPING.

       the stop     3 frames. Hard. Not a decelerating ease — a stop. Every
                    moving thing stops: dust settles, the idle bob ends, the
                    board freezes and dims, the ambience hushes.
       the hold     near-total stillness. The only motion in frame is small and
                    involuntary: the flinch's tremor, the ring's pulse, one
                    strand of falling dust.
       the turn     red and gold only, at 60%. The emotional arc flips, the ring
                    pulses once harder, and the camera's push-in is already done.
       the release  3 to 5 frames, explosive. The attacker does not travel
                    across the arena; it ARRIVES. If the eye can comfortably
                    track the strike, it is too slow.

     The rule: the fight's rhythm is motion, stillness, violence, reset. If a
     Tell can be described as "they run at each other," it is wrong. */
  /* ------------------------------------------- THE COIL (v3.6)
     EVERY THREAT IS THE OPENER AGAIN.

     The opener works because it is one question with a known meaning, learned
     in three seconds: the rival coils like THAT, and the answer arrives at the
     end of the motion. Nothing after it reused that shape, so nothing after it
     inherited the meaning — the player was being asked to learn a second
     grammar for the same event.

     So the three commits that can end a run use the opener's windup, and this
     is it: one pose, one easing, one source, read by the opener and by both
     killing commits. Sharing the literal keyframes rather than re-authoring
     them is the point twice over — a stranger has to recognise the second as
     the same event, and the transform convention (the rival is mirrored, so
     the sign of `x` is not what it looks like) can never drift between two
     copies that do not exist.

     IT IS STILL A FREEZE. v5's correction stands: the coil is played across
     the Tell's stop, in three stepped frames, and then everything holds. The
     opener already decelerates into its wound-up pose and sits there — the
     last two keys are almost the same pose — so the clench was always the
     shape. What the commits take is the silhouette and the hold, not a ramp.

     AND NOTHING ELSE IS ALLOWED TO LOOK LIKE IT. The gold and the pressure
     tells keep the ordinary plant, which is a plain squash-and-give-ground and
     reads nothing like this. That contrast is what acceptance test 16 is
     asking about: when the rival coils like that, everything is on the line,
     and it happens at most three times in a run. */
  const coil = {
    /* THE PART THAT MAKES IT LAND, and it is a duration rather than a drawing.
       The pose was already shared and the killing commits still did not read as
       the opener, because the opener eases into its clench over ~450ms and a
       commit's Tell snapped into it in 125ms — three frames. Same silhouette,
       a quarter of the time in it. One is a creature deciding to kill you; the
       other is a hitch.

       So a killing commit's plant is authored in frames of its own, and its
       Tell is extended to hold them. That is what the 33s cap bought. v5's
       correction is untouched — this is still a plant into a FREEZE, not a
       ramp: the coil arrives over `stopFrames`, and everything after it is
       stillness until the release. The rule was never "make it fast", it was
       "do not have them run at each other". */
    stopFrames: 10,      // ~420ms at 24fps, against the ordinary plant's 3
    extend:     1.7,     // the Tell stretches to hold the clench and still hush
    keys: [
      { x:  0, rot:  0, sx:1.00, sy:1.00 },
      { x: 26, rot: -7, sx:0.94, sy:1.05 },
      { x: 30, rot: -8, sx:0.92, sy:1.06 },
    ],
    easing: 'cubic-bezier(.6,0,.8,1)',
  };
  const coilFrames = () => coil.keys.map(k => ({
    transform: `translateX(${k.x}px) rotate(${k.rot}deg) scale(${k.sx}, ${k.sy})`,
  }));

  const tellShape = {
    stopFrames:    3,     // the halt, on the base grid
    releaseFrames: 4,     // 3 to 5. It arrives; it does not travel.
    hush:          0.85,  // how far the ambient world drops during the hold
    dustStrand:    true,  // the one thing still moving, because silence needs a witness
    /* The camera's push-in happens during the STOP and completes by the hold.
       A camera still moving at the moment of impact steals the snap. */
    pushShare:     1.0,   // of the stop, never more
  };

  /* ------------------------------------------------------------ THE FLINCH
     The ring is UI. The stakes it carries have to be carried by the bodies
     too, or a viewer who never looks at the ring reads nothing. So both
     fighters react emotionally to a commit while it winds up, in sync with the
     ring.

     THE RULE THAT KEEPS THIS LEGAL: a reaction may express the THREAT and the
     INTENT. It may never express the RESULT. A Boxling can say "this could
     kill me" and "I am going to try to stand"; it can never say "and I will
     survive." Reactions are a function of momentum state, ring colour and
     POSITION — all three already band-blind — and never of band. Rung 2's red
     runs the same arc for band 3 and band 4; one of them dies at the Clash
     anyway. That is the design working: honest drama, sealed outcome, and a
     Boxling that rallies and falls is a better story than one that only
     rallies when it is going to win.

     Said positively: the flinch adds no information channel. It makes the
     momentum state — which the viewer is already supposed to read — legible
     from across the room. */
  const flinch = {
    /* Where the two-beat arc flips on a red or gold Tell. The ring pulses once
       harder here: the ring is reacting to the creature, not the reverse. */
    arcTurn: 0.60,
    /* Red and gold Tells extend so the arc has room for two beats. Expressed
       as a multiple of the Tell chip, so the chip drives the extended value
       proportionally: 0.5s becomes 0.75s, 0.3s becomes 0.45s. */
    extend: 1.5,
    /* The tremor and the ring's pulse share a clock. One period, two organs. */
    tremor: { hz: 12, amp: 1.15 },
    /* SCALE TO STAKES. White Tells get a flicker of reaction and nothing more,
       amber a clear single note, red and gold the full arc. If every Tell gets
       a big emotional performance, none of them do. */
    /* `pressure` sits between the amber and the red on purpose. It is a big
       beat — the largest creature in the game, throwing everything — and it
       cannot end the run, so the bodies are allowed to sell it hard while the
       ring stays honest about the stakes. It must not out-perform the red,
       which can actually kill you. */
    intensity: { scuffle: 0.28, amber: 0.72, pressure: 0.85, red: 1.0, gold: 1.0, vault: 1.0 },
    /* Whole-body states, as deltas on top of the momentum pose. `drift` is px
       toward the opponent — negative is the small involuntary retreat. */
    /* AMPLIFIED FOR THE RING SPACE, and the old numbers were not wrong so much
       as obsolete. They were tuned against bodies that stood on two marks and
       shuffled; after v3.7 both fighters orbit, breathe, change depth and cross
       each other, and a delta of a few degrees and six percent of scale simply
       disappears into that. The read the doc actually wants is the one the art
       spec assigns to THREAT — size — so the attacker now visibly grows and
       leans in while the defender compresses and leans away. Silhouette does
       the work, at a glance, with no colour and no icon. */
    poses: {
      // defender vocabulary — fear and defiance. All of them get SMALLER and
      // heavier: weight down, shoulders in, ground given.
      QUAKE:     { lean:-10, rise: 10, sx:1.12, sy:0.86, drift: -16, tremor:1.00, ex:'worried' },
      BRACE:     { lean: -4, rise:  7, sx:1.16, sy:0.88, drift:  -2, tremor:0.22, ex:'normal'  },
      // RALLY is the exception and has to be: it is the one defensive note that
      // grows, because stepping INTO the blow is the whole of what it means.
      RALLY:     { lean: 11, rise: -9, sx:0.95, sy:1.14, drift:  18, tremor:0.30, ex:'fierce'  },
      NUMB:      { lean:-17, rise: 12, sx:1.03, sy:0.86, drift:  -4, tremor:0.08, ex:'dizzy'   },
      // attacker vocabulary — every one of these gains height or reach. The
      // wind-up is emotional too, and it is what sells the threat.
      STALK:     { lean:  6, rise:  7, sx:1.10, sy:0.90, drift:  10, tremor:0.18, ex:'fierce'  },
      SWELL:     { lean:  5, rise:-14, sx:1.10, sy:1.20, drift:   9, tremor:0.42, ex:'fierce'  },
      SNARL:     { lean: 15, rise:  1, sx:1.05, sy:1.07, drift:  14, tremor:0.85, ex:'fierce'  },
      DESPERATE: { lean: 18, rise:  7, sx:1.12, sy:0.95, drift:  20, tremor:0.95, ex:'worried' },
    },
    /* ============== THE ROLE CUE, and why it needed to exist ==============
       The flinch was built to make the ring's stakes legible from the bodies,
       and it does that. What it never did — because before v3.7 it did not have
       to — is say WHICH BODY IS SWINGING. Two fighters standing on two marks
       made that obvious from staging alone. Two fighters orbiting a drifting
       centre, crossing in depth, do not: a playtester watching this build
       reported that on some commits they could not tell who was hitting whom.

       That is a legibility failure of the first order. The whole grammar rests
       on commit ownership — "rival commits ask does my Boxling survive this,
       player commits ask does this finish them" — and an ownership the viewer
       cannot read is a question they cannot be asked.

       So each role gets an explicit mark during the Tell: the attacker gathers,
       the defender plants. Drawn as opposites (converging versus spreading),
       achromatic so they cannot collide with the ring colours, and scaled by
       the same stakes ladder the flinch uses, so a scuffle gets a hint and a
       red gets the full statement. They carry INTENT, never RESULT — they are a
       function of ownership, which is position-scripted and band-blind. */
    role: {
      charge: { chevrons: 3, reach: 78, rise: -46 },  // the fan sits over the shoulders
      brace:  { drop: 4 },                            // ...and the plant sits at the feet
      /* Below this the mark is not drawn at all. A feint and a scuffle get the
         pose and nothing else — if every contact in the fight carried a role
         cue, the Tell's would stop being an event. */
      minGain: 0.5,
    },
  };

  /* ------------------------------------------------------------ THE RING SPACE
     v3.7, and it is a rewrite of locomotion rather than a feature on top of it.

     THE BUG IT DELETES. v3.3 said "orbit, do not oscillate" and never specified
     it, so it was built as an arc each fighter swept around ITS OWN pivot,
     while `momentum.advance` still wrote world-x from a fixed home. Two bodies
     facing each other across a fixed line, with the only motion in frame being
     in and out along that line. That is pacing, and pacing between attacks is
     what a turn-based game looks like while it waits for input.

     WHAT REPLACES IT. Locomotion is written in POLAR COORDINATES around a
     shared centre `C`. Each fighter holds an angle theta and a radius r from
     that centre. Nothing is authored as "move left" and no fighter has a home
     position on the ground any more — `momentum.advance` is reinterpreted as a
     RADIAL term (ground given is distance opened, which is what it always
     meant) and the angular behaviour comes from the table below.

     1. THE AXIS ROTATES. theta advances continuously for both fighters at rates
        that are never equal, so the line between them sweeps through the frame.
        `minSweepPerSec` is the floor that makes acceptance test 24 pass: at
        least 90 degrees of axis rotation per 1.0s of Circle.
     2. THE CENTRE DRIFTS. `C` is not the arena's centre. It moves toward the
        pressured fighter at a rate set by momentum, so the fight travels and
        territory becomes a scoreboard that ACCUMULATES across commits — unlike
        distance, which resets every time somebody is hit.
     3. RADIUS BREATHES ON ITS OWN CLOCK, independently of theta, independently
        between the two fighters, and never in sync with the commit schedule.
     4. MIRRORING IS FORBIDDEN. Equal and opposite motion reads as a mechanism
        rather than as two animals, so the two fighters never share a theta
        rate, an r curve or a phase.

     DEPTH IS MANDATORY, and it is what makes the frame read as three-quarter
     rather than flat. An orbit produces near and far, so scale, vertical offset
     and Z-ORDER all change through the Circle and the fighters genuinely pass
     each other in depth. If both fighters' feet hold the same screen line for a
     whole Circle the ring is fake no matter what the code is doing. The art
     stays flat and side-on; the depth is carried by offset, scale and overlap,
     which is enough to pass the axis and overhead tests without redrawing six
     species.

     FAILURE TO CIRCLE IS THE VISUAL LANGUAGE OF LOSING. Look at the BUCKLING
     row: theta collapses toward zero and the retreat goes straight back. That
     is the old prototype behaviour exactly — a fighter backing up in a straight
     line, squared to its opponent. It is not deleted, it is DEMOTED: it is now
     the read for BUCKLING and it appears nowhere else. */
  const ringSpace = {
    radius:   { base: 176, min: 46, max: 300 },  // r envelope: contact to ~3x commit distance
    breathe:  { rate: 0.37, amp: 0.22 },         // r's own clock, never the commit's
    minSweepPerSec: Math.PI / 2,   // 90 degrees per 1.0s of Circle — acceptance test 24
    depth:    0.34,        // how much of the arc's depth reads as vertical offset
    persp:    0.0016,      // ...and how much reads as scale (raised: depth has to READ)
    zSwap:    true,        // upstage fighter renders BEHIND — the pass in depth
    faceFlip: true,        // facing is continuous; it flips at the crossing
    /* ...but it flips off the DRAWN positions, not the targets, and not while
       either body is over the line. Facing used to be read off `ringX`, which
       is where a body is HEADING; the rig draws it where it has actually got
       to, and during a traverse those are up to a hundred pixels apart. So a
       fighter could be drawn on the left of the frame, facing left, while the
       creature it was about to punch stood on its right — which is the most
       expensive way there is to lose "who is attacking whom", because it makes
       the answer wrong rather than merely unclear.
       The band is dead space around the crossing: inside it neither body turns,
       so two creatures passing at speed do not strobe their facing. */
    faceHyst: 30,
    /* HOW FAR THE FIGHT MAY TRAVEL. "By the end of a rung the fight is being
       held in one half of the arena" is the doc's own scale, so the centre may
       walk a quarter of the arena either way and no further. Past that the
       fight starts leaving the frame, which the camera note explicitly forbids. */
    centre:   { range: 120, ease: 0.9 },
    /* How fast a lunge and a knockback dissolve once the fighters are circling
       again, as a survival fraction per second. 0.06 clears about 60% of an
       offset in a quarter-second Circle and effectively all of it in one long
       one — fast enough that nothing compounds across a rung, slow enough that
       the recovery is visible as footwork rather than as a snap. It is applied
       ONLY while circling, so an Aftermath holds the strike position intact. */
    recover:  0.06,
    /* ASYMMETRY, SCRIPTED FROM MOMENTUM. `spin` is the angular rate in rad/s,
       `inside` is the bias toward cutting the chord and taking the inside line,
       `close` is the radial pull (positive closes), `drive` is how hard this
       state pushes the shared centre away from itself. */
    states: {
      DOMINANT:  { spin: 1.34, inside:  0.62, close:  0.30, drive:  1.00 },
      EVEN:      { spin: 0.92, inside:  0.00, close:  0.00, drive:  0.00 },
      PRESSURED: { spin: 1.62, inside: -0.45, close: -0.26, drive: -0.75 },
      /* STOPS CIRCLING. The one row worth building carefully. */
      BUCKLING:  { spin: 0.06, inside: -1.00, close: -0.62, drive: -1.00 },
      DOWN:      { spin: 0.00, inside:  0.00, close: -0.70, drive: -1.00 },
    },
    /* THE CLINCH. Occasionally r reaches zero: bodies meet, shove, no hit
       juice, no ring, nothing at stake. It breaks with both fighters pushing
       off, and the push RESETS theta for both — which is the cheapest way there
       is to make the orbit itself irregular. It is the only contact in the game
       that carries neither consequence nor information. */
    clinch: { chance: 0.30, min: 300, max: 600, push: 0.9 },
    /* Debug: pins theta, r and C, which reproduces the v3 bug on demand for
       comparison. Lives beside the forced-outcome controls and gets no chip. */
  };
  /* The two names the rest of the build still reaches for. `orbit` was the v3.3
     block; everything in it is now a property of the ring space. */
  const orbit = { depth: ringSpace.depth, persp: ringSpace.persp };

  /* FEINTS AND ABORTS ARE DIFFERENT DEVICES WITH DIFFERENT JOBS, and v3.7 is
     the first document to say so. A FEINT is a false start with NO STOP: a
     twitch, a dropped shoulder, a lunge that does not commit, and the other
     fighter flinches. An ABORT is a full three-frame HALT that produces no ring
     (see `clock.abort`). Feints punctuate the Circle; aborts break the clock.
     Neither ever carries a ring, which is how the ring keeps teaching its own
     meaning by contrast. */
  const feint = {
    every: 900,       // one false start roughly this often, in a long enough beat
    min:   300,       // a Circle shorter than this has no room for a false start
    ms:    210,       // a plant and a flinch, and nothing comes of it
    /* WHERE FEINTS BELONG. v5 wants them in the long Circles high up and wants
       rung 1 to be almost pure approach. Gating on DURATION was impossible in
       v3.6, because the 500ms floor made every Circle in the game the same
       length — so it was gated on rung instead, which said what the doc meant
       and cost nothing. v3.7 gives the Circles genuinely different lengths, so
       duration is a real signal again and both gates now apply: rung 3 and up,
       AND long enough to hold a false start clear of the stop. */
    fromRung: 3,
  };

  /* ------------------------------------------------------------ THE BROKEN CLOCK
     v3.7's second fault, and the one the animation could never have fixed.

     Turn-based feel is not caused by taking turns. It is caused by PREDICTABLE
     ARRIVAL. Phase durations were fixed per position, so the gap between
     decisive moments was constant, and a constant gap is entrained inside two
     rungs. Once a viewer's body knows when the next thing is coming there is
     nothing left to brace for. v2's exchange was a fast metronome; v3 replaced
     it with a slow one and put better art on it.

     THE PRINCIPLE: WHEN must be unpredictable, WHAT must be perfectly
     predictable. Everything below moves timing and position into the first
     column and moves nothing else.

     THE ELASTIC/RIGID SPLIT, which is what keeps this legal:

       elastic, varies run to run       rigid, never varies anywhere
       ---------------------------      ------------------------------------
       Circle duration                  Tell duration (0.5s; 0.75s red/gold)
       Aftermath duration               the stop, 3 frames
       scuffle/feint/abort/clinch       the release, 3 to 5 frames
       orbit speed, radius, centre      Clash, 0.25s
       which signature texture plays    ring colour and semantics per position
                                        ownership, momentum and flinch per Tell

     The Tell is the unit of meaning and a unit of meaning has to be constant to
     be learnable. The gaps between the units are where the life goes. VARY THE
     GAPS, NEVER THE GRAMMAR.

     ================= THE ONE RECONCILIATION THIS BUILD FORCED =================
     v3.7 asserts twice that the broken clock "redistributes Circle time inside
     each rung and adds none". Against THIS build that is not true. Its base
     table (0.35s up to 3.2s, plus seven aborts at 0.35s each) wants roughly
     eight seconds more Circle than exists, on a run whose cap is already at 33s
     — and every Circle in v3.6 sat pinned to its 500ms floor, so there was no
     slack to redistribute either.

     So the table below is read as a SHAPE, not as milliseconds. The bases are
     normalised into each rung's existing Circle pool, which keeps the per-rung
     budget and both caps exactly where v3.6 left them, and keeps the RATIOS —
     which is the part that actually does the work, because what breaks a
     metronome is the spread between consecutive gaps and not their absolute
     size. The doc says as much itself: the ratio between the longest and
     shortest Circle in a rung "is not exposed and never falls below 3x, in any
     preset". It never says the absolute values are load-bearing.

     What that costs, stated plainly rather than buried: at Spec the Vault's
     3.2s stalk renders at about a fifth of its authored length. The clock
     spread chip is the dial that buys it back, and Cinematic — which already
     breaks the cap by design and prints red — is where the doc's own numbers
     live. */
  const clock = {
    /* THE SHAPE. Relative weights per position, straight off v3.7's schedule
       table, and the note beside each is the doc's own reasoning. */
    bases: {
      2: [0.35,   // the rival is on it before the player is set
          1.10],  // first time the viewer sees a stop come to nothing
      3: [0.80,
          2.60,   // the longest wait in the run sits before the deadliest moment
          0.20],  // a double off the red's Aftermath: the comeback does not wait
      4: [3.20,   // the largest creature in the game, taking its time
          1.40],  // the WITNESS strike; the arena is already quiet
    },
    /* HOW MANY ABORTS EACH POSITION CARRIES, and they are spent INSIDE the
       Circle rather than added to it — an abort is 0.35s of a Circle spent
       stopping, which is why it can cost the run nothing. A position whose
       scaled Circle cannot hold its full count keeps as many as fit; the rest
       are dropped and logged rather than silently truncated. */
    aborts: { 2: [0, 1], 3: [1, 3, 0], 4: [3, 0] },
    /* THE ABORT, and it is the strongest device in this section. A commit that
       gets as far as the stop and dissolves. All three frames of the halt fire
       exactly as they do in a real Tell — both fighters stop hard, dust
       settles, the idle bob ends, sound drops out — and then no ring appears,
       the fighters resume orbit, and nothing has happened.

       IT MUST BE FRAME-IDENTICAL TO A REAL TELL UNTIL THE RING WINDOW. If a
       viewer can spot one early it becomes a REST instead of a threat and the
       device inverts, which is what acceptance test 25 is asking about. So the
       abort calls the same stillness, the same stop frames and the same hush a
       Tell does, and diverges only by never showing a ring. */
    /* 0.24s rather than the doc's 0.35s, and for the same reason every Circle
       here is shorter than the doc's: the whole clock is scaled to fit the cap,
       and an abort scaled with it stays the same FRACTION of the beat it
       interrupts. It is still the Tell's three-frame stop plus a hold — 125ms
       of halt and ~115ms of stillness — which is the part that has to be
       frame-identical. At the authored 0.35s the single most important abort in
       the game, the one at rung 1 commit B where a viewer sees a stop come to
       nothing for the first time, did not fit in its Circle at all. */
    abort: { ms: 240, ringWindow: 0.42 },
    /* JITTER, +/-30%, applied to Circle and Aftermath only, drawn from the
       clock stream, never applied to a rigid value and never large enough to
       reorder two commits.

       ZERO-SUM ACROSS THE RUNG, which is the decision that keeps the published
       band durations exact and both caps structural rather than probabilistic:
       whatever one position borrows another gives back. And the draw is a pure
       function of (seal, rung, index) — never of the commit list a band
       actually plays — because a jitter zero-summed over the PLAYED commits
       would make the Circle before a fatal clash systematically different from
       the Circle before a survived one. That is a duration correlating with a
       resolution, which the honesty note forbids by name. */
    jitter: 0.30,
    /* No two consecutive inter-Tell intervals may fall within this of each
       other, and the longest must be at least `spreadFloor` times the shortest.
       Enforced by construction in `clockPlan` and audited in the bench;
       acceptance test 22 is an automatic fail. */
    varianceFloor: 0.25,
    spreadFloor:   3.0,
    /* THE SOLVER'S THREE LEVERS, and their limits. Separating two intervals is
       done SYMMETRICALLY — grow the larger by half of what is needed, shrink
       the smaller by the other half — so the rung's total is untouched and the
       whole thing stays "redistribute, add none". Grow-only would lengthen the
       run; shrink-only would flatten the schedule toward its floors, which is
       the metronome coming back through the other door.

       `growCap` is how far past its budget ceiling a Circle may be pushed to
       make room. `afterFloor` is how far an Aftermath may be trimmed. And
       `dodgeAfterMin` is the one that needed a decision rather than a number:
       v3.5 authored the dodge's stun at 1.2s, "the beat the clip gets cut on",
       and at rung 2 that stun plus a 1.5s finisher stop plus the rival's 1.01s
       slip is so much rigid content that the two intervals around them came out
       11% apart with every other lever already at its stop. So the stun becomes
       elastic — it is an Aftermath, and the doc's own elastic column lists
       Aftermath duration — but only down to here. It is allowed to give up a
       sixth of itself to break a metronome; it is not allowed to stop being the
       beat it was authored to be. */
    growCap:       1.6,
    afterFloor:    400,
    dodgeAfterMin: 950,
    /* A Circle has to keep at least this much actual orbiting after its aborts
       are paid for, or the position stops being a Circle and becomes a queue of
       stops. It is what caps the abort count on the short positions. */
    minOrbit: 180,
    /* ...and the absolute shortest a Circle may be, which is a different number.
       `minOrbit` is about leaving real orbiting in a beat AFTER its aborts are
       paid for; this is the floor below which a beat stops being a beat at all.

       RAISED FROM 120ms, AND A PLAYTEST IS WHY. The spread floor is enforced by
       shrinking a rung's shortest Circle, and at rung 1 — whose commits are
       short and whose gold carries a 750ms tell, so its ceiling is only 450ms —
       that drove the opening Circle to 150ms to buy a 3.00x ratio. 150ms is
       four frames. Against an 850ms tell hold and a 1500ms impact stop it meant
       rung 1 contained essentially no locomotion at all, and it read exactly as
       reported: the fighters freeze in place at the first rung.

       240ms is six frames at the base grid — enough for the axis to visibly
       sweep and for a viewer to see two animals moving before one of them
       stops. The spread floor now gives way to it rather than the other way
       round, because a rung with a legal ratio and no motion in it has
       satisfied the letter of the metronome rule while failing its purpose. */
    minCircle: 240,
    /* A position at or under this share of its rung's mean is a DOUBLE: the
       previous Aftermath runs straight into this Tell and the commit does not
       ease out of the last one. Derived rather than flagged, so moving a base
       moves the double with it. */
    doubleUnder: 0.34,
    /* AT 2x AND 4x THE CLOCK WORK SWITCHES OFF — no jitter, no aborts, no
       clinches, no doubles — because at speed legibility beats irregularity and
       there is no beat left to entrain to. ORBIT DOES NOT SWITCH OFF: the ring
       space is locomotion rather than texture, and two fighters frozen on a
       fixed axis read as wrong at any speed. */
    turboOff: true,
  };

  /* POSE-TO-POSE. Continuous interpolation reads as floaty — everything is
     always easing somewhere and nothing ever ARRIVES. Real animation moves
     fast between key poses and then HOLDS, dead still, and the hold is what
     makes the pose land. So: snap into the pose, kill the idle, freeze the
     whole frame (fighters and particles, same machinery as hitstop), then
     move again.

     `steps` drives the transition timing function — 0 is smooth easing, n>=1
     is steps(n, end), i.e. genuinely stepped. `plantHold` and `settleHold`
     are SHARES of the Tell and Aftermath they freeze, so the commit's total
     duration is unchanged and every cap still holds. */
  /* ------------------------------------------------ THE STOP-MOTION RIG
     Not "snap and freeze" — that was the mistake, and it reads as stuttering
     rather than as a medium. Real stop motion is the most DISCIPLINED kind of
     animation there is: one frame grid that everything obeys, and craft laid
     on top of it. Six things make it, and all six are implemented:

     1. ON TWOS. A single 24fps base grid; poses update every 2nd frame (12fps)
        — the classic rate. Nothing on screen is allowed off this grid.
     2. ONES FOR FAST ACTION. A puppet moving quickly is shot on ones, because
        twos strobe when the per-frame travel is large. `fastPx` is the
        threshold where a fighter drops to every frame.
     3. GO-MOTION. Stop motion strobes because every frame is perfectly sharp,
        which no real moving object ever is. Tippett's fix was to move the
        puppet during exposure. Here: directional stretch plus blur
        proportional to per-frame travel. This is the single biggest cure for
        "jerky", and it is why the medium stopped looking like Harryhausen.
     4. MOVING HOLDS. A held puppet is never dead — it drifts. Dead holds read
        as a broken projector. Every hold here breathes.
     5. CUSHIONING. Poses ease INTO a hold with tightening frame spacing, so
        the pose lands instead of arriving.
     6. BOIL + FOLLOW-THROUGH. Sub-pixel handmade jitter (the animator's
        fingerprints between frames) and secondary parts lagging the body. */
  const stopmo = {
    base: 24,              // the grid everything is quantized to
    fastPx: 9,             // per-frame travel above which a fighter goes to ones
    /* SMEAR IS FOR ATTACKS ONLY. It used to ramp from zero, so idle breathing
       and circling were permanently soft — every enemy blurred all the time,
       which looked like a rendering fault rather than motion. Nothing smears
       until it is traveling at least `smearMin` px in a single frame, which
       only an attack ever does. And the smear is a STRETCH, not a blur: a
       drawn smear frame, the cartoon idiom, not a photographic one. */
    smearMin: 22,          // px/frame below which there is no smear at all
    smear: 1.0,            // stretch strength
    stretchMax: 0.42,      // how far a smeared body stretches along its travel
    blurMax: 0,            // photographic blur. 0 = off; it read as mud.
    boil: 1.0,             // handmade jitter amplitude scale
    breathe: 1.0,          // moving-hold amplitude scale
    arc: 0.55,             // how far travel bows off a straight line
    lagFrames: 2,          // follow-through on secondary parts
  };

  /* ------------------------------------------------- THE IMPACT FRAME
     Punch-Out!!: the connect does not get a stutter, it gets a full STOP.
     Everything holds — puppets, particles, the snow, the grid itself — while
     a comic panel sits on screen: radial speed lines out of the point of
     contact, a burst, the struck body locked in its worst pose. THEN the
     consequence plays: the shake, the knockback, the reaction.

     This is also the attention signal. A scuffle gets nothing, a survived
     amber gets a beat, and a finisher stops the world for well over a second
     — so the length of the stop IS the size of the hit. */
  const impact = {
    lines: 34,             // radial speed lines
    flash: 0.7,            // white blowout at the instant of contact
    /* ...AND IT IS A FRAME, NOT A HOLD. The blowout was written once with
       `transition:none` and then left there for the whole stop — which on a
       finisher is over two seconds of a 70% cream sheet over the entire arena,
       both fighters included. It is the single biggest reason the decisive
       frame reads as a pale wash: the panel, the bodies and the flash all sit
       at nearly the same luminance, so nothing separates from anything.
       So it peaks for three frames and then drops to a floor that keeps the
       air hot without bleaching what the viewer is trying to read. */
    flashPeak: 90,         // ms at full blowout
    flashHold: 0.13,       // ...then this, for the rest of the stop
    /* THE STAR IS PUNCTUATION, NOT THE SENTENCE. It was 2.6 — a 68px radius of
       glowing white dropped between two 100px bodies at the one frame the
       viewer is trying to read, and it covered both of them. A symmetric mark
       cannot say who hit whom, so the loudest thing in the frame was the thing
       with the least information in it. The direction is carried by the thrust
       and the cone now (see art.fx.thrust / art.fx.shockCone); the star's only
       job is to mark the point of contact, and it is sized for that. */
    burst: 1.25,           // how big the burst reads
    /* Block and dodge share a duration on purpose: which one you get is a
       cosmetic draw, and a run's length must never depend on a cosmetic draw
       or the printed table would be a lie. */
    chips: [
      { id:'quick', label:'quick', guard:120, land: 400, critical: 700 },
      { id:'comic', label:'comic', guard:220, land: 900, critical:1500 },
      { id:'heavy', label:'heavy', guard:320, land:1300, critical:2100 },
    ],
  };

  /* A BLOCK IS SOMETHING THAT HAPPENS TO THE ATTACKER.
     Showing it only on the defender — sparks, a shield arc, a shove — says
     "something was absorbed" but never says "your blow was stopped". The
     read comes from the swinging body rebounding off the guard: it is the
     attacker who is thrown back, and the defender who barely moves. */
  const guardFeel = {
    rebound: 58,        // px the attacker is driven back past its own line
    attackerKnock: 0.55,// share of a HEAVY knockback dealt to the attacker
    defenderKnock: 0.3, // share of a LIGHT knockback dealt to the defender
    jolt: 6,            // the shudder through the attacker's body
    compress: 0.14,     // how hard the attacker squashes against the guard
  };

  /* HOW A CLASH RESOLVES — four outcomes, four readings.
       block    the guard comes up and holds. Sparks, a shove, no damage read.
       dodge    the body is not there any more. The attack passes through air.
       land     it connects and the defender stays up. This is the near-finish.
       critical it connects and ends someone. The full comic panel.
     Which one a clash gets is fixed by POSITION for everything except the
     block/dodge coin-flip, which is cosmetic and carries nothing. */
  /* A PINNED RESOLVE OUTRANKS THE DERIVATION, which it did not before, and the
     ring recolour is what forced the issue. The Vault's commit A is a heavy
     near-finish; it used to be inferred from `ring === 'red'`, so demoting it
     to a pressure ring would have quietly turned the biggest guard moment in
     the game into a 220ms light tap — a behaviour change made by editing a
     colour. It carries `resolve:'land'` in the script now, and this reads it.

     Behaviour is otherwise identical: the planner's cosmetic block/dodge coin
     both map to `guard` and therefore to the SAME duration, which is the rule
     that keeps a run's length independent of a cosmetic draw. */
  const resolveKey = cm => {
    const r = cm.resolve;
    if (r) return (r === 'block' || r === 'dodge') ? 'guard' : r;
    return (cm.fatal || cm.owner === 'player') ? 'critical'
         : cm.ring === 'red' ? 'land' : 'guard';
  };
  const clashWeight = cm => { const r = cm.resolve || resolveKey(cm);
    return r === 'critical' ? 'finisher' : r === 'land' ? 'heavy' : 'light'; };
  /* FOOTWORK — the continuous back-and-forth while circling. Smooth, on the
     real clock, never quantized: two bodies working for position is walking,
     and walking on twos reads as broken rather than as stylized. Amplitude is
     in px of travel; `rate` is radians/sec, so higher is livelier. */
  const footwork = { amp: 34, rate: 2.5, bob: 2.2, roll: 1.6 };

  /* The medium, as a chip. `stride` is frames-per-pose against the 24 base. */
  const filmChips = [
    { id:'ones',   label:'on ones',   stride:1, smear:0.7, boil:0.7 },
    { id:'twos',   label:'on twos',   stride:2, smear:1.0, boil:1.0 },
    { id:'threes', label:'on threes', stride:3, smear:1.3, boil:1.3 },
  ];

  /* RING SEMANTICS — learnable, and never lying.
     A ring says what CAN happen, never what will. Only the Clash knows. */
  /* v3.6 ADDS THE PRESSURE RING, and it exists because two commits lost their
     lethal rings and had nothing honest to wear instead.

     Rung 2 commit A was amber and the Vault's commit A was red, and NEITHER
     KILLS ANYBODY IN ANY BAND. Ringing them as lethal is how amber and red
     become noise: a player who survives four ambers learns that amber means
     nothing, and the one amber that could have ended them was the first. So
     amber and red now appear at exactly the three commits a run can end at,
     and never anywhere else.

     But the Vault's commit A is the largest creature in the game throwing
     everything it has, and the thin white scuffle ring says "texture, cannot
     end anything" — true, and far too small for the beat. So white splits in
     two, and the split is legible because it is a WIDTH and a PULSE rather
     than a hue:

       thin white, still     scuffle texture. Nothing is at stake.
       thick white, pulsing  PRESSURE. The rival dominates, the player is
                             driven to PRESSURED, and still nothing can end.
       amber                 the run can end here.
       red                   the run can end here, at the top of the climb.
       gold                  the finish attempt.

     It keeps the reserved-colour rule: pressure is bone, not amber, red or
     gold, and it stays off the three hues that mean a run can end.

     `slow` and `arc` are why these live on the ring rather than in the one
     list beside it. `slowRings` used to do both jobs at once — so demoting the
     Vault's red silently stripped its extended tell and its scripted
     QUAKE->RALLY arc along with its slow-mo, which is three changes made by
     editing one string. They are separate properties now, and they are
     separate ideas: slow-mo is FEEL and belongs to red and gold, the extended
     tell is STRUCTURE and belongs to any commit that authored two beats.

     NOTE WHAT PRESSURE DOES NOT GET. No `slow`, and no `arc` — because a
     pressure ring that telegraphed HARDER than the amber that can actually
     kill you would invert the whole stakes read. The Vault's commit A still
     gets its extended tell, but it gets it from its SCRIPT authoring a
     two-beat arc (see tellMs), not from its ring, so rung 2's single-note
     pressure beat stays exactly as short as the amber it replaced. */
  const rings = {
    scuffle:  { color:'#dfe9f2', width:2,   pulse:false, means:'texture — cannot end anything' },
    pressure: { color:'#e9f2fa', width:6,   pulse:true,
                means:'pressure — the rival owns this, and it cannot end the run' },
    amber:    { color:'#f2a54e', width:5,   pulse:true,  kills:true,
                means:'can end the run' },
    red:      { color:'#e8452c', width:6.5, pulse:true,  slow:true, arc:true, kills:true, darken:true,
                means:'can end the run, high stakes' },
    gold:     { color:'#f2c14e', width:6.5, pulse:true,  slow:true, arc:true,
                means:'the finish attempt' },
    vault:    { color:'#ffe9a3', width:9,   pulse:true,  slow:true, arc:true,
                means:'the last question in the game' },
  };
  const ringIds   = Object.keys(rings);
  const slowRings = ringIds.filter(k => rings[k].slow);
  const arcRings  = ringIds.filter(k => rings[k].arc);
  const ringKills = k => !!(rings[k] && rings[k].kills);

  /* ============ MELEE AND RANGE — THE SECOND ATTACK GRAMMAR ============
     Every commit in the game was a body crossing a gap. That is ONE image, and
     v3.7's central argument applies to it directly: SHAPE is what a viewer
     entrains to. Eight commits that all resolve by closing distance are a
     metronome one level above the one the broken clock went and fixed — the
     timing stopped being predictable and the picture never did.

     So a commit now has a RANGE, and it is authored in the script beside the
     ring, as a function of POSITION ONLY — like ownership, like the momentum
     states. It is never drawn, never cosmetic and never a function of the band.
     Two runs arriving at the same commit see the same attack.

       melee    the attacker ARRIVES. The release is a displacement: a smear,
                a snap, the body where the other body was. Unchanged.
       ranged   the attacker STAYS. The release is a DISCHARGE — the charge it
                has been gathering since the stop leaves the body, crosses the
                gap on its own, and throws the attacker back off it.

     THE TELL IS STILL THE SAME FOUR BEATS, AND THAT IS THE POINT. v5's
     correction stands untouched: a Tell is a FREEZE, and if it can be described
     as "they run at each other" it is wrong. A charge does not bend that rule —
     it is the strongest thing that has ever obeyed it. The gather grows IN
     PLACE, on the attacker's own body, and adds not one pixel of approach. It
     is stillness with a cause in it, which is exactly what the hold has always
     been asking for and has been paying a falling dust strand to fake.

       the stop     the attacker plants — and the gather starts
       the hold     near-total stillness; the core grows and nothing travels
       the turn     the arc flips, the core goes critical, the ring answers
       the release  it fires

     AND IT COSTS THE RUN NOTHING, which is what makes it shippable against two
     hard caps. The discharge is handed exactly the release window the lunge
     would have had — same frames, same offsets, same clash call — so
     `commitPlan` is untouched and every published band length holds.

     THE RESERVED-COLOUR RULE SURVIVES, and it is the reason this is worth
     building rather than merely possible. Saturated amber, red and gold belong
     to the telegraph rings and nothing may borrow them. A beam is the ELEMENT'S
     MATERIAL — fire's orange into white-hot, ice's bone, water's teal — so the
     two channels answer different questions and can never collide: the ring
     says what is at stake, the beam says who is throwing it. "The element IS
     the creature" gets a second place to speak, and until now it only ever
     spoke through the body and the dodge signature.

     WHICH COMMITS GET WHICH, and every line of it is an argument:

       The three KILLING commits stay MELEE. EVERY THREAT IS THE OPENER AGAIN is
       the rule they exist to serve — their plant is the opener's coil, frame for
       frame — and a viewer made to learn a second shape for the moment that ends
       26% of all runs has been taught the wrong thing twice.

       Both PRESSURE rings go RANGED. They are the two commits in the game that
       provably cannot end a run, and they had the weakest identity in it: rung
       2's commit A kills nobody in any band, and the Vault's is survived by
       every band that reaches it. Being driven to PRESSURED by something you
       cannot reach is what pressure MEANS, and now it looks like it.

       The two GOLDS split one each, so the run's two finishers do not rhyme.
       Rung 1's is close and physical, because winning has to look like
       something, fast. Rung 2's is thrown from range, because the player has
       just spent a rung being driven off and this is the answer to that.

     The Vault's WITNESS strike stays melee and is not negotiable: the player
     breaks the box open with its body, which is the opener played backwards. */
  const combatRange = {
    /* THE GATHER. The role cue's chevrons already converge INWARD on the
       attacker and already read as powering up — on a ranged commit they
       converge into something that STAYS. The cue stops being a label for who
       is swinging and becomes the mechanism of what is about to happen. */
    charge: { rise: -62, core: 32, crit: 1.38 },
    /* THE DISCHARGE. `travel` is the share of the release window the bolt spends
       crossing the gap — and it is 0.58 because that is the exact fraction of
       its own release at which a MELEE strike reaches the defender and hands
       over to the Clash. It is one constant read by both branches rather than
       two numbers that happen to agree: the Clash is called at the same offset
       into the same window whichever way the commit was thrown, so the impact
       frame, the stop and the Aftermath cannot tell the two modes apart and
       `commitPlan` never needed to learn about either. */
    beam:   { travel: 0.58, thick: 15, len: 104, tail: 2.3 },
    /* WHAT HAPPENS TO THE BODY THAT FIRED. A melee attacker keeps the ground
       its lunge took; a ranged one is thrown back off its own discharge, and
       the ground it gives is inherited by the next Circle by exactly the same
       mechanism. Same term, opposite sign — so the ring space comes out of a
       ranged commit WIDE and out of a melee one TIGHT, which is NO RESET doing
       more work rather than less. */
    recoil: 34,
    /* ...AND THE CIRCLE BEFORE IT SAYS SO. A fighter about to throw something
       backs off to throw it; a fighter about to swing closes. The bias is a
       function of the script, so it is as band-blind as the range it
       telegraphs — and it makes the modality readable a whole phase before the
       Tell, for free, in a system that was already breathing. */
    approach: { ranged: 64, melee: -34 },
  };
  const rangeOf  = cm => (cm && cm.range) === 'ranged' ? 'ranged' : 'melee';
  const isRanged = cm => rangeOf(cm) === 'ranged';

  /* THE COMMIT SCRIPT — band-blind and mandatory.
     Ownership, ring, range and momentum states at each position are functions
     of POSITION ONLY. Pause two runs of different bands at the same Tell start
     and they are information-identical; only the Clash separates them.
     `pre` is the circling state, `tell` the planted state, `out` the state
     once a survived clash resolves. A death overrides `out` with DOWN — that
     is the Clash, and it is the only legal divergence.

     `atk` and `def` are the flinch: what the two bodies say while the commit
     winds up, filled per position and identical across every band that reaches
     that position. A two-entry list is the ARC, and the arc is the drama — it
     flips at 60% through the Tell, and only red and gold Tells are long enough
     to hold one. `QUAKE` into `RALLY` starts terrified and finds it at the last
     instant; the courage is real and it decides nothing. */
  const commitScript = {
    2: [ // "Rung 1" — winning has to look like something, fast
      /* BOTH MELEE, and the rung is the reason. It is 4.9 seconds long, it is
         the first fight anybody sees, and it is where the grammar is taught:
         a body coming at you, and a body going back at it. A charge here would
         be the second thing a player had to learn about a rung that is already
         the shortest in the game. Range arrives at rung 2, once melee means
         something to be the opposite of. */
      { owner:'rival',  ring:'amber', range:'melee',  pre:{p:'EVEN',      r:'EVEN'},      tell:{p:'PRESSURED', r:'DOMINANT'},  out:{p:'PRESSURED', r:'DOMINANT'},
        atk:['STALK'],          def:['BRACE'] },
      { owner:'player', ring:'gold',  range:'melee',  pre:{p:'EVEN',      r:'EVEN'},      tell:{p:'DOMINANT',  r:'PRESSURED'}, out:{p:'DOMINANT',  r:'DOWN'},
        atk:['SWELL'],          def:['QUAKE'] },
    ],
    3: [ // "Rung 2" — the peril. Owns the most screen time in the run.
      /* v3.6: WAS AMBER, AND IT KILLS NOBODY IN ANY BAND. An amber here taught
         the player that amber is noise, which is the last thing the ring that
         ends 26% of all runs one rung below can afford. It is a pressure beat:
         the rival owns it, the player is driven to PRESSURED, and nothing is
         at stake. Single note, so its tell stays exactly as short as the amber
         it replaced. */
      /* RANGED, AND THE FIRST ONE IN THE GAME. It is the ideal position for it:
         the player has seen two melee commits and nothing else, so the shape is
         new exactly where a new shape is affordable — a pressure ring cannot end
         a run, so a viewer meeting the charge for the first time is not being
         asked to read a new picture and survive it in the same beat. */
      { owner:'rival',  ring:'pressure', range:'ranged', pre:{p:'EVEN',   r:'EVEN'},      tell:{p:'PRESSURED', r:'DOMINANT'},  out:{p:'PRESSURED', r:'DOMINANT'},
        atk:['SNARL'],          def:['BRACE'] },
      /* The red. Band 3 dies on this clash and band 4 survives it, and they
         run the SAME arc — terrified, then standing into it. One of them falls
         anyway. That is the rule working. */
      /* MELEE, and it is the most load-bearing range assignment in the script.
         This is a killing commit, so it plants with the opener's coil — and the
         coil is the one silhouette in the game a player is not allowed to have
         to learn twice. It is also what makes the ranged commit either side of
         it legible: pressure at range, then the largest body in the fight coming
         all the way in, then the answer thrown back from range. */
      { owner:'rival',  ring:'red',   range:'melee',  pre:{p:'PRESSURED', r:'DOMINANT'},  tell:{p:'BUCKLING',  r:'DOMINANT'},  out:{p:'BUCKLING',  r:'DOMINANT'},
        atk:['SWELL'],          def:['QUAKE','RALLY'] },
      /* RANGED, so the run's two golds do not rhyme. Rung 1's finish was close
         and physical; this one is thrown, because the player has just spent a
         whole rung being driven off and a finisher that requires closing the
         distance would undo the picture the rung spent itself building. */
      { owner:'player', ring:'gold',  range:'ranged', pre:{p:'EVEN',      r:'EVEN'},      tell:{p:'DOMINANT',  r:'PRESSURED'}, out:{p:'DOMINANT',  r:'DOWN'},
        atk:['SWELL'],          def:['NUMB'] },
    ],
    4: [ // the Vault. Commit B is the WITNESS strike and is staged separately.
      /* v3.6: WAS RED, AND EVERY BAND THAT GETS HERE SURVIVES IT. Red is one
         of the two rings that mean a run can end, and spending it on the one
         commit at the top of the climb that provably cannot end one is how red
         stops meaning anything. It is the game's biggest PRESSURE beat — the
         largest creature in the game, throwing everything, at a player who
         will still be standing afterward.

         It keeps its two-beat QUAKE->RALLY arc and therefore its extended
         tell, which it now draws from this script rather than from its ring,
         and it keeps `resolve:'land'` — the heavy near-finish — pinned here so
         config, the planner and runLength all agree on the size of its stop
         instead of two of them inferring it from a ring colour that changed.
         What it gives up is the slow-mo, which is red and gold's alone. */
      /* RANGED, and it is the biggest charge in the game. This is the largest
         creature in the fight throwing everything it has at a player who will
         still be standing afterward — which is precisely a bombardment and not
         a brawl. It also keeps the Vault's two beats opposite: the rival shells
         the player from range, and the player answers by breaking the box open
         with its body. Commit B is melee and is not negotiable. */
      { owner:'rival',  ring:'pressure', range:'ranged', resolve:'land',
        pre:{p:'EVEN',      r:'DOMINANT'},  tell:{p:'BUCKLING',  r:'DOMINANT'},  out:{p:'PRESSURED', r:'DOMINANT'},
        atk:['STALK','SWELL'],  def:['QUAKE','RALLY'] },
    ],
  };

  /* WHICH COMMITS CAN END A RUN, derived from the fatal table rather than
     restated beside it — the same discipline the board's prune schedule and
     the walkout's stake line already use, and for the same reason: a second
     source of truth about what can kill you is a lie waiting to happen.

     There are exactly three moments in the game, and the opener is one of
     them. Everything else is survived by everyone who reaches it. */
  const isKillingCommit = (rung, index) =>
    Object.keys(fatalClash).some(b => fatalClash[b].rung === rung && fatalClash[b].index === index);

  /* Which clash kills, by band. Deaths always land on the Clash of a RIVAL
     commit; kills always on a player commit. Bands 3 and 4 reach the Vault
     and are separated by the crack, not by a fight. */
  const fatalClash = {
    1: { rung:2, index:0 },   // the amber at rung 1
    2: { rung:3, index:1 },   // the red at rung 2
  };

  /* ------------------------------------------------------------- THE BOARD
     The five value bands of the box, drawn as a vertical stack of prize
     tiers: Floor at the bottom, the Grail at the top. It is the PUBLISHED
     DROP TABLE drawn as money, which is exactly why it can be on screen from
     the first frame without leaking anything.

     It is also the position indicator. Deal or No Deal is the precedent and
     it is structurally this product — 26 sealed cases, contents fixed before
     taping, and the tension carried entirely by which values remain as cases
     burn. Predetermination does not kill an elimination board; the board is
     HOW a predetermined outcome gets felt.

     One object, one glance. A ladder bug and a prize board at the top of the
     screen would compete for the same half-second, so they are merged: the
     boundary between burned-below and live-above IS the height read. Height
     on the board = height on the ladder = prize value, drawn once. */

  /* A tier's contents come from the drop table and nothing else. The range is
     the real span of items in the band; the icon is the band's MODAL item —
     the one you are most likely to actually get — not its best, because a
     board that flatters is a board that lies. */
  function boardTiers(){
    return bands.map(b => {
      const items = box.dropTable.filter(it => {
        const m = it.value / box.price;
        return m >= b.range[0] && m < b.range[1];
      });
      const rep = items.reduce((a, c) => (c.weight > a.weight ? c : a), items[0]);
      return {
        i: b.i,
        name: b.i === 0 ? 'FLOOR' : b.i === 4 ? 'THE GRAIL' : 'BAND ' + (b.i + 1),
        lo: items[0].value, hi: items[items.length - 1].value,
        share: b.share, rep: rep.id, repName: rep.name,
      };
    });
  }

  /* WHEN IT PRUNES — only at clash resolutions, and only the band the height
     tell just killed. This is the invariance rule drawn as prizes: surviving
     a rung rules out the bands that would have ended it earlier. It is
     derived from `fatalClash` rather than restated, so the board can never
     disagree with the planner about what a clash proved, and it can never
     leak because it only displays what the clash has already shown.
       opener survived    -> the Floor is gone
       rung 1 amber       -> band 2 is gone
       rung 2 red         -> band 3 is gone
     Which leaves exactly two cards standing at the Vault. */
  function burnedBySurviving(rung, index){
    for (const b in fatalClash)
      if (fatalClash[b].rung === rung && fatalClash[b].index === index) return +b;
    return -1;
  }
  const burnedByOpener = 0;

  /* THE LADDER IS THE MOUNTAIN. The board is not a corner strip — it is drawn
     up the triangle at the back of the arena, five rungs climbing toward the
     peak, and it replaces the card-with-a-target that used to sit there
     saying nothing (in gold, which was quietly breaking the reserved color
     rule as well).

     The taper does real work. The mountain narrows as it rises, so the rarer
     the band the smaller its rung, and scarcity is drawn as geometry before a
     single number is read. Height on the mountain = height on the ladder =
     prize value: the design's central equation, finally drawn in the place
     the player is already looking.

     Geometry is computed here and consumed by BOTH art.js, which draws the
     rungs, and present.js, which flies cards off them — one source of truth
     for where a rung is, so the card can never launch from the wrong place. */
  const mountain = { apexX: 480, apexY: 54, baseY: 248, halfW: 112 };
  function boardRungs(){
    const m = mountain, h = 26, gap = 6;
    return [0,1,2,3,4].map(i => {
      const bottom = m.baseY - 10 - i * (h + gap), top = bottom - h;
      /* A rung has to fit inside the triangle at its OWN top edge, which is
         its narrowest point; measured at the middle it would poke out
         through the slope at both shoulders. */
      const span = 2 * m.halfW * (top - m.apexY) / (m.baseY - m.apexY);
      return { i, cx: m.apexX, cy: (top + bottom) / 2, w: Math.max(34, span - 22), h };
    });
  }

  const board = {
    mountain, rungs: boardRungs(),

    /* THE FLYOUT — how a band introduces itself.
       A rung on the mountain is a glyph and a position and nothing else: it
       is too far back and too small to carry text. So the tier introduces
       itself by flying off the ladder to the front of the frame at a
       readable size, holding a beat, and only THEN shattering. The card is
       where the value lives; the rung is where the count lives.

       The Aftermath the burn rides is 400 to 660ms depending on the commit,
       and scaling all three phases into that made the card a flash rather
       than a read — you saw that something happened without ever learning
       what the band was worth, which is the whole job. So the flyout is
       allowed to OUTLIVE its beat by `extend`, and every extra millisecond
       goes to the hold.

       This costs the run nothing: the flyout is fired and forgotten, never
       awaited, so the timeline walks on without it and both caps are
       untouched. What it spends instead is screen time, and it spends it in
       the Circle that follows — the one beat in the commit where nothing can
       end anything. It never reaches further than that: a Tell clears any
       card still in the air, so the board can never compete with a telegraph
       ring, which is the rule that actually matters. The shards outlive even
       that, because debris is not information. */
    fly:    0.34,     // share of the beat spent flying out and growing
    hold:   0.30,     // share of the beat held at the front, being read
    extend: 500,      // ...plus this, all of it added to the hold
    burn:   620,      // the beat at full length, scaled down to what it gets
    /* Where it lands, in viewBox units. The window is narrow and both edges
       matter: the mountain's base is at y=248 and a card any higher covers
       the ladder it just flew off, so you would never see the rung go dark;
       the fighters' heads reach about y=327 and a card any lower covers a
       body during the one beat the celebration also owns. 76 tall centered at
       288 fits between them exactly. */
    card:   { w: 232, h: 76, x: 480, y: 288 },
    fold:   260,      // half a beat: undramatized, background business
    ignite: 900,      // the won tier flaring and locking
    slide:  520,      // and sliding to center as the receipt begins
    /* ...and then HOLDING there, which it was not doing. The receipt used to
       cover the card 240ms after the flight started — before the 520ms flight
       had even landed — so the one moment in the run where the player learns
       what their band was worth was painted over while it was still moving.
       This is the same argument as the burn's `hold`: the card is where the
       value lives, and a value nobody can read is not a reward.
       It is EPILOGUE. `result.elapsed` is captured before any of it, the arc is
       already closed, and neither the 30s nor the 3s cap can feel it. */
    lockHold: 900,
    dim:    0.30,     // how far it sinks during a Tell and a Clash
    /* RESERVED COLOR RULE. In 2019 ESPN colored its down-and-distance
       graphic the same yellow as the penalty-flag alert and viewers thought
       every play was flagged; it was reverted at halftime. Amber, red and
       gold belong to the telegraph rings. The board's burns and locks may not
       borrow them — the lock is ice, not gold — with ONE deliberate
       exception: the two-card Vault endgame, where the tier glows ARE the
       crack colors, on purpose, because there the meanings converge. */
    lock:      '#dff2ff',
    lockGlow:  '#6fb7ff',
    vaultLow:  '#e8452c',   // the licensed exception: band 4 = the red crack
    vaultHigh: '#f2c14e',   // and the Grail = the gold one
  };

  /* EVERY HIT CHANGES THE FRAME. If a blow does not visibly move these
     numbers, it is not a blow. */
  const hit = {
    hitstop: 200,                                  // ms, frozen — fighters AND particles
    hitstopChips: [0, 60, 90, 140, 200],
    shake:     { light:  6, heavy: 14, finisher: 22 },
    knockback: { light: 36, heavy: 84, finisher:150 },
    squash:    { light:0.11, heavy:0.19, finisher:0.28 },
    windupShare: 0.42,        // of the beat left after hitstop
    impact: { ms:120, from:1.0, to:2.5 },          // starts big, gets bigger

    /* ---------------------------------------------- THE STRUCK BODY
       A hit used to write ONE thing on the defender: `scale(1+k, 1-k)`, a
       symmetric vertical squash. That is the pose of a body dropped on from
       above — it is what a cartoon anvil does — and it is identical whether
       the blow came from the left, the right, or nowhere at all. So the only
       body in the frame that knew where the blow came from was the attacker,
       and the attacker is the one the viewer is not looking at.

       Three channels now, all of them signed by the blow's direction:

         push    driven back off its feet, along the line of the blow
         tip     the top of the body thrown away from the contact — the
                 whiplash, and the single clearest "that one hurt"
         squash  compressed ALONG the blow axis (narrow in x, tall in y),
                 which is what a body hit in the ribs does, rather than
                 flattened downward, which is what a body hit by the sky does

       Then the recovery whips the other way and settles, because a body that
       returns straight to neutral was never really moved. */
    recoil: {
      push:  { light:  8, heavy: 15, finisher: 23 },   // px, back along the blow
      tip:   { light:  6, heavy: 11, finisher: 17 },   // deg, top thrown away
      brace: { push: 7, tip: 5 },                      // the answer BEFORE contact
    },

    /* THE TRANSFER — the lance of force from the attacker's fist into the
       defender. `lenShare` is how much of the gap between the two bodies it
       spans: short of 1 so it reads as the last of the swing rather than as a
       beam connecting two creatures. */
    transfer: { lenShare: 0.82, max: 260, discharge: 260 },

    /* ------------------------------------------------------------ THE SLIP
       A rival that never defends is a rival that never looks capable of it —
       and until now it structurally could not. Block and dodge only ever land
       on a rival-owned amber, where the DEFENDER is the player; the only clash
       the rival ever defends is the gold one, and gold is the finish attempt
       that always lands. So the rival never got a defensive read in the entire
       run, and the four-way clash vocabulary was only ever seen from one side.

       The slip fixes that without touching the grammar: on a player commit the
       rival slips the FIRST swing — an afterimage, the blow tearing through
       air — and the finisher lands on the follow-through, inside the same
       commit. Same position, same outcome, same duration. It is paid for out of
       the stop, which is the longest hold in the game and can afford a quarter
       of it, so the commit's total is unchanged and both caps are untouched.

       It is a COSMETIC draw, like the block/dodge coin-flip it is modelled on:
       it varies run to run, it is never a function of band, and because the
       gold kills either way it cannot tell you anything. "Gold = the finish
       attempt" still holds — it now sometimes takes two swings. */
    /* ############ REVISED: THE RIVAL ACTUALLY DODGES ############
       The slip above was built to cost nothing, and costing nothing is exactly
       what was wrong with it. 210ms, capped at a quarter of the stop, paid out
       of the stop, and composited on top of the strike's own travel — so the
       miss and the follow-through happened inside one continuous motion and
       read as a single swing with a flourish on it. The rival was dodging on
       every other gold and nobody could see it.

       It is a real event now, and it is the PLAYER'S dodge grammar pointed the
       other way, because that grammar is already proven and already learned:

         1. the strike lands exactly as it would have          (the release)
         2. contact does not happen, and the rival's own       (slip)
            element signature is what fails it
         3. the hitstop fires ON THE MISS                      (slipStop)
         4. a beat where the attacker is overextended and      (slipStun)
            the rival is alive and knows it
         5. the follow-through lands, at FULL stop             (the finisher)

       IT COSTS REAL TIME, deliberately. Step 3 and step 4 are the two beats
       that make a miss read as a near-thing rather than a whiff, and both were
       missing. The stop is no longer raided to pay for any of it, so the
       finisher still lands with its whole weight. See `runLength` for what
       that does to the caps. */
    slip:       210,      // the afterimage and the body leaving the space
    slipShare:  0.25,     // legacy: the share the old build stole from the stop
    /* THE RIVAL DEFENDS THE FIRST SWING OF EVERY GOLD — and HOW it defends is
       a coin flip. Pinning it to "always slips" bought the length invariant at
       the cost of making every gold in the game the same shot, which is the
       trade the block/dodge pair solved years earlier and better: give the two
       arms IDENTICAL durations and the draw costs the run nothing while
       changing the picture completely.

       So: `slipChance` of the time the rival is not there for it (the body
       parts, the blow tears through air); the rest of the time the guard comes
       up and holds and the blow is turned aside. Both take exactly
       slip + slipStop + slipStun, both end with the finisher landing on the
       follow-through, and neither can be predicted or leak anything — the gold
       kills either way. "Gold = the finish attempt" still holds; it always
       takes two swings, and which two varies. */
    /* HOW THE RIVAL MEETS A GOLD, and v3.7 adds a third arm because two was
       not enough variety to hide a structure.

       A playtest put it exactly: "the consistent choreography is part of the
       problem." Every surviving rung played the same three beats in the same
       order — the player dodges the killing commit (structural since v3.6: the
       dodge IS the survival image), the rival defends the gold (structural, so
       that a cosmetic coin could never change a run's length), then the
       finisher lands. Three evasions, same sequence, every run. The cosmetics
       varied and the SHAPE never did, and shape is what a viewer entrains to —
       which is the metronome argument one level up from timing.

       `clean` is the third arm: the rival does not defend at all and the
       finisher lands on the first swing. Its budget is spent on the blow
       instead of on the escape, so all three arms cost exactly the same and the
       published totals cannot move — the same discipline block-versus-dodge has
       always used. What it buys is that a third of golds now break the pattern
       the other two established, and a viewer cannot learn the run's shape. */
    defence: [
      { id:'slip',  weight: 1 },   // the body is simply not there for the first swing
      { id:'guard', weight: 1 },   // it takes it on the guard and turns it aside
      { id:'clean', weight: 1 },   // it does not get to answer at all
    ],
    slipChance: 0.5,      // retained for the dormant v3.5 arm's block/dodge coin
    slipGuard:  true,     // the other arm exists, so the draw is free
    slipStop:   240,      // hitstop, on the MISS — what sells it as a near-thing
    slipStun:   560,      // attacker overextended, rival alive and knowing it
  };

  // Two to four connected commits end a fighter; not more.
  const ttk = { min: 2, max: 4 };

  /* THE BUDGET. Nothing exceeds 30 seconds including the Grail, and the Floor
     never exceeds 3. Every run is paced against these deadlines rather than
     summing whatever the animations happen to take.
     The opener length is file-config now, not a chip — the rig is five chips. */
  const opener = { drop:380, coil:520, windup:460, hitstop:200, branch:780, settle:660 };
  const openerTotalMs = 3000;
  const lossDelta = 0.9;      // losses resolve faster — asymmetric on purpose

  /* THE ARC, in commits. Commit totals per band are 1, 2, 5, 8, 8 — the
     opener is the first commit and the tutorial for every one after it.
     `commits` lists the ms of each commit that actually PLAYS at that rung;
     a band that dies mid-rung simply has a shorter list. Every column here
     sums to the band's published duration, and the setup panel prints it. */
  /* REBUDGETED FOR THE WALKOUT AND THE ARC. Two things arrived at once: rung 2
     and the Vault each carry a 2.0s walkout where a 1.2s confrontation frame
     used to be (+1.6s), and red and gold Tells now extend to 0.75s to fit the
     flinch's two-beat arc (+1.15s across a Grail). The 30s cap outranks both.

     Design v5 says the 1.6s is "reclaimed from Circle durations at rung 1 and
     rung 2 commit A". Rung 1's Circles were ALREADY at their 0.5s floor — the
     impact frames spent them in the previous pass — so only rung 2 commit A had
     Circle left to give, and it gives 0.8s of the 1.6s. The rest comes from the
     Vault's quiet beats and the Grail's static occlusion wash, on the same
     argument the config has used once before: the box rising, the gold wash and
     the counter roll are the least dramatic seconds in the run, and the stops
     and the stillness are the most. Nothing was taken from the opener (the
     tutorial), the finisher stops, or the crack. */
  /* THE TWO HARD CAPS, in one place because they were three places.
     The Grail's moves from 30s to 33s. What bought the extra three seconds:
     the dodge on every survived killing commit, the walkout's stake beat, and
     the rival's defence of every gold — three beats that each turned a moment
     the viewer could not see into one they can, and none of which could be
     paid for out of what was left. The Floor's 3s is untouched and always will
     be: it is 59.95% of all runs and the only cap a volume user feels. */
  const caps = { floor: 3000, grail: 33000 };
