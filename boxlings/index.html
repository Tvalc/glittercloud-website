      /* The crack resolved band 4, so band 4 is what was won: it ignites and
         locks, and the Grail folds face-down above it. No celebration
         vocabulary fires here — this is a loss branch, and the whole point of
         the staging is that nothing dramatizes what escaped. */
      board.lock(3);
      banner('THE VAULT HOLDS', 'bad', 1600);
      return false;
    }

    // ---- the prize decodes while the counter rolls
    pace.scene(v_arc.decode / rate, 1);
    setMom(P(), 'DOMINANT', scale(C.poseMs));
    celebrate(plan.band, 'gold', RX-30, GY-120);
    banner('THE GRAIL', 'gold big', 2400);
    await decodePrize(plan, pace.rest());
    await pace.land();
    return true;
  }

  /* The value counter rolling up to the prize. It is the last thing the run
     does, and it is the only number in the whole product — which is why it
     can carry weight instead of being noise. */
  async function decodePrize(plan, ms){
    if (ms <= 40) return;
    const el = st.hud.decode;
    if (!el){ await wait(ms); return; }
    el.className = 'shown';
    el.innerHTML = `<b class="dcName"></b><span class="dcVal num">$0.00</span>`;
    const nameEl = el.querySelector('.dcName'), valEl = el.querySelector('.dcVal');
    const target = plan.item.value, name = plan.item.name;
    const t0 = performance.now(), roll = ms * 0.72;
    await new Promise(res => {
      const step = now => {
        const k = Math.min(1, (now - t0) / roll);
        const eased = 1 - Math.pow(1 - k, 3);
        valEl.textContent = '$' + (target * eased).toFixed(2);
        nameEl.textContent = name.slice(0, Math.max(1, Math.round(name.length * Math.min(1, k * 1.4))));
        if (k < 1 && !st.skipping) requestAnimationFrame(step);
        else { valEl.textContent = '$' + target.toFixed(2); nameEl.textContent = name; res(); }
      };
      requestAnimationFrame(step);
      setTimeout(() => { valEl.textContent = '$' + target.toFixed(2); nameEl.textContent = name; res(); }, roll + 300);
    });
    await wait(Math.max(0, ms - roll));
    el.className = '';
  }

  /* The payoff literally looks bigger for a bigger prize. That scaling is
     honest because the band was fixed at the seal, long before this fires. */
  function celebrate(bandI, kind, x, y){
    const n = C.celebration.particles[bandI] || 0;
    const sh = C.celebration.shake[bandI] || 0;
    if (sh) shake(sh, 420);
    if (!n || !vfx()) return;
    const b = fxAt(A.fx.burst(n, kind), x, y, 2600);
    if (b) b.classList.add('bursting');
  }

  /* ==================================================================
     CELEBRATIONS — the layer that makes wins feel won.

     WWE scales celebration production to stakes with an exact vocabulary:
     the bell, the referee raising the arm (the universal minimal win-read),
     the turnbuckle pose, the title raise, and pyro reserved for the biggest
     occasions. The same win, staged bigger, means more. Three tiers here.

     The boundary is the NFL's. After fining 26 players in 2016 the league
     legalized group celebrations, props and ground celebrations — explicitly
     because spontaneous displays of emotion are what fans love — and kept
     the ban on taunting, prolonged acts and anything directed AT the
     opponent. Joy is legal; cruelty is not. So there is no loss branch in
     this section, and celebration vocabulary never appears below a win.
     ================================================================== */

  // which Boxling is standing there, read off the art's own class
  const speciesOf = f => {
    const m = /\bsp-([a-z0-9]+)\b/.exec((f && f.node && f.node.getAttribute('class')) || '');
    return m ? m[1] : null;
  };

  /* THE SIGNATURE MOVE. One repeatable victory pop per species, so what
     fires in the Aftermath is the player's own expression: you chose your
     celebrator at packing. `k` scales the whole thing with the tier, which
     is the WWE trick — the same move, staged bigger. */
  function sigFrames(move, k){
    const s = n => (n * k).toFixed(1);
    switch (move){
      case 'puff':   return [                         // Frostuft — the Powder Puff
        { transform:'translateY(0) scale(1,1)' },
        { transform:`translateY(${s(6)}px) scale(${1+0.10*k}, ${1-0.12*k})`, offset:0.22 },
        { transform:`translateY(${s(-34)}px) scale(${1-0.08*k}, ${1+0.14*k})`, offset:0.58 },
        { transform:'translateY(0) scale(1,1)' }];
      case 'buzz':   return [                         // Voltcrate — the Static Pop
        { transform:'translate(0,0) rotate(0deg)' },
        { transform:`translate(${s(-4)}px, ${s(-3)}px) rotate(${s(-5)}deg)`, offset:0.14 },
        { transform:`translate(${s(5)}px, ${s(-2)}px) rotate(${s(6)}deg)`, offset:0.28 },
        { transform:`translate(${s(-4)}px, ${s(-4)}px) rotate(${s(-6)}deg)`, offset:0.42 },
        { transform:`translate(0, ${s(-26)}px) rotate(0deg) scale(${1+0.06*k})`, offset:0.68 },
        { transform:'translate(0,0) rotate(0deg) scale(1)' }];
      case 'sprout': return [                         // Bramblewrap — the Sprout
        { transform:'translateY(0) scale(1,1)' },
        { transform:`translateY(${s(8)}px) scale(${1+0.14*k}, ${1-0.16*k})`, offset:0.26 },
        { transform:`translateY(${s(-14)}px) scale(${1-0.12*k}, ${1+0.24*k})`, offset:0.62 },
        { transform:'translateY(0) scale(1,1)' }];
      case 'whip':   return [                         // Pyrepip — the Tail Whip
        { transform:'rotate(0deg) translateY(0)' },
        { transform:`rotate(${s(-16)}deg) translateY(${s(-8)}px)`, offset:0.24 },
        { transform:`rotate(${s(22)}deg) translateY(${s(-18)}px)`, offset:0.56 },
        { transform:'rotate(0deg) translateY(0)' }];
      case 'bow':    return [                         // Glacierkin — the Rime Bow
        { transform:'rotate(0deg) translateY(0)' },
        { transform:`rotate(${s(18)}deg) translateY(${s(6)}px)`, offset:0.34 },
        { transform:`rotate(${s(-6)}deg) translateY(${s(-20)}px) scale(${1+0.05*k})`, offset:0.7 },
        { transform:'rotate(0deg) translateY(0) scale(1)' }];
      default:       return [                         // Cindersnap — the Ember Flick
        { transform:'translateX(0) rotate(0deg)' },
        { transform:`translateX(${s(-14)}px) rotate(${s(-9)}deg)`, offset:0.24 },
        { transform:`translateX(${s(16)}px) rotate(${s(11)}deg) scale(${1+0.07*k})`, offset:0.54 },
        { transform:'translateX(0) rotate(0deg) scale(1)' }];
    }
  }

  /* Fired from an Aftermath and never awaited: a celebration that delayed the
     next drop would be the prolonged act the NFL still bans. It is capped to
     the beat it rides on, so it can never move a budget. */
  function playSignature(f, ms, tier){
    if (!f || st.skipping || ms < 120) return;
    const sig = C.signatureOf(speciesOf(f));
    const k = tier === 'grail' ? 1.5 : tier === 'vault' ? 1.2 : 1.0;
    const prev = C.momentum.states[f.mom].ex;
    setEx(f.node, 'happy');
    anim(animEl(f.node), sigFrames(sig.move, k), Math.max(1, ms), { fill:'none' });
    if (vfx()){
      const n = fxAt(A.fx.sig(sig.fx, sig.accent), fx_(f), GY - 74 * f.scale, ms + 900);
      if (n && sig.fx === 'arc')
        anim(animEl(n), [{opacity:0},{opacity:1},{opacity:0}], Math.max(1, ms * 0.8), {fill:'none'});
    }
    setTimeout(() => { if (f.node.isConnected) setEx(f.node, prev); }, Math.max(1, ms) + 60);
  }

  /* TIER 1 — the arm-raise. A rung win: small, crisp, 0.8 to 1.2s inside the
     Aftermath, and it never delays the next drop. It shares its beat with the
     board's burn on purpose: the two reads reinforce, they never compete. */
  function celebRung(f, afterMs){
    const t = C.celebration.tiers.rung;
    playSignature(f, clamp(afterMs * 0.9, 0, scale(t.max)), 'rung');
  }

  /* TIER 2 — the title shot. The Vault's red survived: the big one short of
     the top. Slow get-up, shake-off, the swell, and the gilded box beginning
     to rise as the celebration settles. */
  function celebVault(f, ms){
    const t = C.celebration.tiers.vault;
    /* The tier's `min` is the authored ambition, not a floor to pad up to: a
       celebration may only ever use the beat it rides on, so at 4x turbo it
       shrinks with everything else rather than outliving the run. */
    const d = clamp(ms, 400, t.max);
    playSignature(f, d * 0.7, 'vault');
    if (!vfx()) return;
    if (t.shake) shake(t.shake, 420);
    const b = fxAt(A.fx.burst(t.motes, 'gold'), fx_(f), GY - 70 * f.scale, 2600);
    if (b) b.classList.add('bursting');
  }

  /* TIER 3 — the title raise, reserved absolutely for the 0.05%. The Boxling
     HOISTS the prize card overhead like a championship belt, the board's top
     card descends into its hands, confetti, the full pyro budget. It rides
     entirely inside the existing occlusion-and-decode window, so the 30s cap
     is untouched. If this ever fired below the Grail it would stop meaning
     the Grail. */
  function celebGrail(f, ms){
    const t = C.celebration.tiers.grail;
    const d = clamp(ms, 900, t.max);      // the window that exists, never more
    if (!f) return;
    playSignature(f, d * 0.34, 'grail');
    if (!vfx()) return;
    shake(t.shake, 520);
    const p = fxAt(A.fx.pyro(t.motes), 480, GY - 40, d + 2600);
    if (p) p.classList.add('bursting');
    // the hoist: the card comes down to it, then goes up over its head
    board.descend(f, d * 0.45);
    setTimeout(() => {
      if (!f.node.isConnected) return;
      anim(animEl(f.node), [
        { transform:'translateY(0) scale(1,1)' },
        { transform:'translateY(6px) scale(1.08, 0.9)', offset:0.18 },
        { transform:'translateY(-26px) scale(0.94, 1.12)', offset:0.5 },
        { transform:'translateY(-14px) scale(1,1)' },
      ], Math.max(1, d * 0.4), { fill:'none' });
    }, Math.max(1, d * 0.45));
  }

  // ------------------------------------------------------------- the run
  async function playRun(plan, opts={}){
    st.plan = plan;
    st.rate = opts.rate || 1;
    st.skipping = false;
    st.result = { omensSeen:[], nearFinishes:0, underdogWins:0 };
    /* v3.7: the ring is down until a fight starts, and the interval log is
       cleared per run — acceptance test 22 is a per-run assertion, not a
       running total, because "no two consecutive intervals within 25% of each
       other" has to hold in EVERY run rather than on average across twenty. */
    st.ring.live = false; st.ivals = []; st.lastTell = 0;
    st.cam.x = st.cam.xTo = 0;
    markShow(false);           // the opener has one body and it is a box
    clearLayer('#actorLayer'); clearLayer('#fxLayer'); clearLayer('#farLayer');
    st.fighters = {};
    stillness(false); clearTape();
    refit();                       // the pane may have changed since the last run
    q('#dimmer').setAttribute('opacity', 0);
    q('#sky').setAttribute('fill','url(#skyGrad)');
    tilt(0, 0);
    board.build(); buildTeam(plan.packSnapshot); buildFilm(plan);
    hideTap(); stakes('');
    st.hud.skip.classList.add('shown');
    startClock();
    rig.start();
    pace.runStart();

    const a = C.arc[plan.band];
    const alive = await sceneOpener(plan);
    if (alive){
      for (let i = 0; i < plan.rungs.length; i++){
        const rung = plan.rungs[i], rg = a.rungs[rung.rung];
        if (!rg) continue;
        const won = await sceneRung(plan, rung, {
          confront: st.rate > 1 ? C.commit.turboConfront : rg.confront,
          commits: rg.commits,
        });
        if (!won) break;
      }
      if (plan.terminal === C.height && a.vault) await sceneVault(plan, a.vault);
    }
    st.hud.skip.classList.remove('shown');
    stakes('');
    stopClock();
    rig.stop();
    board.duck(false);
    stillness(false); clearTape();      // the hush never outlives the arc
    // The arc is over here; the fade and the receipt are epilogue, so they do
    // not count against the cap the design set for the run itself — which is
    // also where the locked tier slides to center.
    st.result.elapsed = performance.now() - st.t0;
    board.present();
    dim(0, 300);
    /* The locked tier's card holds at the front of the frame before the receipt
       arrives on top of it. The floor is absolute rather than scaled: turbo
       compresses the RUN, and this is not part of the run — a card the player
       cannot read is worth the same at 4x as at 1x, which is nothing. */
    await wait(Math.max(420, scale(C.board.lockHold)));
    return st.result;
  }

  /* THE ANIMATIC — the rung 2 peril alone, as a pure timeline. Build-order
     step 1, and the artifact the brace test runs against. It goes through the
     same commit engine as the real thing on purpose: an animatic that lied
     about the timing would validate a Tell the product does not have. */
  async function playAnimatic(plan, opts={}){
    st.plan = plan;
    st.rate = opts.rate || 1;
    st.skipping = false;
    st.result = { omensSeen:[], nearFinishes:0, underdogWins:0 };
    /* v3.7: the ring is down until a fight starts, and the interval log is
       cleared per run — acceptance test 22 is a per-run assertion, not a
       running total, because "no two consecutive intervals within 25% of each
       other" has to hold in EVERY run rather than on average across twenty. */
    st.ring.live = false; st.ivals = []; st.lastTell = 0;
    st.cam.x = st.cam.xTo = 0;
    markShow(false);           // the opener has one body and it is a box
    clearLayer('#actorLayer'); clearLayer('#fxLayer'); clearLayer('#farLayer');
    st.fighters = {};
    stillness(false); clearTape();
    refit();
    q('#dimmer').setAttribute('opacity', 0);
    q('#sky').setAttribute('fill','url(#skyGrad)');
    tilt(0, 0); darkenEdges(false, 1); pushIn(false, 1);
    board.build(); buildTeam(plan.packSnapshot); buildFilm(plan);
    /* The animatic opens where rung 2 actually opens — Floor and band 2
       already burned — because a board that lied about the position would
       validate a peril the product does not have. */
    board.preburn(0); board.preburn(1);
    hideTap(); stakes('');
    st.hud.skip.classList.add('shown');
    startClock();
    rig.start();
    pace.runStart();

    const rung = plan.rungs.find(r => r.rung === 3);
    const rg = C.arc[plan.band].rungs[3];
    if (rung && rg){
      await ensureLead(plan, rung.leadIndex, false, scale(200));
      await sceneRung(plan, rung, {
        confront: st.rate > 1 ? C.commit.turboConfront : rg.confront,
        commits: rg.commits,
      });
    }
    st.hud.skip.classList.remove('shown');
    stopClock();
    rig.stop();
    stillness(false); clearTape();
    st.result.elapsed = performance.now() - st.t0;
    dim(0, 300);
    await wait(scale(240));
    return st.result;
  }

  // The run clock is the acceptance test made visible: the Grail must never
  // pass 30s and the Floor must never pass 3, on this machine, right now.
  function startClock(){
    st.t0 = performance.now();
    stopClock();
    if (!st.hud.clock) return;
    st.clockTimer = setInterval(() => {
      const e = performance.now() - st.t0;
      st.hud.clock.textContent = (e/1000).toFixed(1) + 's';
      filmTick(e);
    }, 50);
  }
  function stopClock(){
    if (st.clockTimer){ clearInterval(st.clockTimer); st.clockTimer = null; }
    filmTick(performance.now() - st.t0);       // leave the head where it landed
  }

  function skipNow(){
    st.skipping = true;
    stillness(false); clearTape();
    if (st.tapResolve) st.tapResolve();
    document.getAnimations().forEach(a => { try { a.finish(); } catch(e){ try { a.cancel(); } catch(e2){} } });
  }

    /* The interval log, for the audit in acceptance test 22 and for the bench.
     Returns what actually happened rather than what was budgeted — the pacer
     squeezes beats and the stop raids the Aftermath, and what a viewer
     entrains to is the real gap between one Tell and the next. */
  function intervals(){ return st.ivals.slice(); }
  return { mount, playRun, playAnimatic, skipNow, glanceTest, board, intervals, state: st };
})();

</script>
<script>
/* ---- js/main.js ---- */
/* Boxlings Battle — app shell and flow. */
window.BB = window.BB || {};
(() => {
  const C = BB.config, F = BB.fair;
  const $ = id => document.getElementById(id);
  const money = v => '$' + v.toFixed(2);
  const secs = ms => (ms/1000).toFixed(1) + 's';

  const session = {
    serverSeed: F.randomHex(16),
    openIndex: 0,
    pack: null,
    nonce: '',
    forcedBand: null,
    running: false,
  };
  session.serverSeedHash = F.sha256Hex(session.serverSeed);

  try {
    /* A pack is ONE Boxling now. Saves written by the three-slot build are
       still readable — the first slot was always the one wearing the charm,
       so it is the one that survives the migration. */
    /* GUARDED, because `localStorage` THROWS rather than returning null in
       three situations that all matter: a page opened straight off disk as a
       `file://` URL, a browser with site data blocked, and private-mode
       variants that revoke the quota. Unguarded, the throw happened at line
       one of boot and took the whole app down — a blank screen because a
       saved pack could not be read, which is the least important thing on the
       page. The registry has always guarded its own; this is the same
       courtesy. A missing pack just means you pick one. */
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('bb-pack') || 'null'); } catch(e){ /* fresh */ }
    /* ...and saves written before the element pass are migrated rather than
       dropped, twice over. Voltcrate was storm and Bramblewrap was plant, and
       v3.5 cuts every element but FIRE, ICE and WATER. Then the roster went to
       one packable body per element, retiring three more into rival-only duty.
       Both migrations resolve to the packable body of the SAME ELEMENT, so the
       choice the player actually made survives even when the coat it wore
       does not — falling back to species[0] would have silently changed their
       element, which is the one thing packing decides. */
    if (saved && saved.members && saved.members.length)
      session.pack = { members: saved.members.slice(0, 1)
                        .map(m => Object.assign({}, m, { speciesId: C.packableId(m.speciesId) })),
                       charmIndex: 0 };
  } catch(e){}

  /* THE PANEL IS A TOGGLE, NOT A ONE-WAY DOOR.
     A run shuts it because a run owns the stage, and it opens again when the
     run ends — but ◧ Setup can open it at any time, mid-run included. The rig
     is read live at every beat, so a chip changed mid-run takes effect at the
     next one rather than being swallowed.

     Sliding the panel resizes the stage without firing a window resize, and
     the arena is drawn with preserveAspectRatio="slice" — so without this the
     fighters would stay staged for the pane's old width and could be driven
     off the visible band. present.js already refits on resize; this just tells
     it that something moved. */
  function setPanel(open){
    document.body.classList.toggle('panelShut', !open);
    $('panelBtn').classList.toggle('on', open);
    setTimeout(() => window.dispatchEvent(new Event('resize')), 520);   // after the slide
  }

  // Where a run ends, in the language the player watches it in.
  const endedLabel = plan =>
    plan.vaultWin ? 'took the Vault'
    : plan.vaultLoss ? 'fell at the Vault'
    : plan.terminal === 1 ? 'boxed at the opener'
    : `fell at rung ${plan.terminal - 1}`;

  // ------------------------------------------------------------- setup UI
  /* Chips, not sliders: the numbers worth arguing about should be feelable in
     the hand inside one run, and a chip is a thing you can hit mid-argument. */
  function chips(key, opts, current){
    return `<div class="chips" data-chip="${key}">` + opts.map(o =>
      `<button class="chipB ${o.id === current ? 'on' : ''}" data-v="${o.id}">${o.label}</button>`
    ).join('') + `</div>`;
  }

  function renderSetup(){
    const rows = C.box.dropTable.map(it =>
      `<tr><td>${it.name}</td><td class="num">${money(it.value)}</td><td class="num">${it.weight}%</td></tr>`).join('');
    const where = ['boxed at the opener','falls at rung 1','falls at rung 2','the Vault, denied','the Vault, taken'];
    const cap = C.runLength(4);
    const bandRows = C.bands.map(b => {
      const t = C.runLength(b.i);
      const over = (b.i === 0 && t > C.caps.floor) || t > C.caps.grail;
      return `<tr><td>${b.label}</td><td class="num">${b.share}</td><td>${where[b.i]}</td>
              <td class="num ${over?'over':''}">${secs(t)}</td></tr>`;
    }).join('');
    const om = C.omens;

    /* The board, printed as a table, so what the tiers claim and when they
       prune is checkable against the drop table two sections up rather than
       taken on trust. "Burns when" is read out of the planner's own fatal
       table — the board cannot say something the fight will not do. */
    const burnWhen = ['the opener is survived', 'the rung 1 amber is survived',
                      'the rung 2 red is survived', 'the crack comes up gold', '—'];
    const boardRows = C.boardTiers().slice().reverse().map(t =>
      `<tr><td>${t.name}</td><td class="num">${t.lo === t.hi ? money(t.lo) : money(t.lo)+'–'+money(t.hi)}</td>
       <td>${burnWhen[t.i]}</td></tr>`).join('');
    const sigRows = C.packSpecies().map(sp =>
      `<tr><td>${sp.name}</td><td>${C.signatureOf(sp.id).name}</td></tr>`).join('');

    $('setupBody').innerHTML = `
      <section>
        <h3>Provably fair</h3>
        <p class="mono tiny">server seed hash<br>${session.serverSeedHash}</p>
        <p class="tiny">The prize is drawn the instant your box seals: <span class="mono">HMAC(server&nbsp;seed, your&nbsp;packing&nbsp;+&nbsp;open&nbsp;#)</span>. Nothing in the fight can touch it. The seed is revealed on every receipt so you can recompute your own draw.</p>
      </section>
      <section>
        <h3>Drop table · ${C.box.name} · ${money(C.box.price)}</h3>
        <table class="dropT"><tr><th>Item</th><th>Value</th><th>Odds</th></tr>${rows}</table>
      </section>
      <section>
        <h3>How far runs go</h3>
        <table class="dropT"><tr><th>Prize</th><th>Share</th><th>Ends</th><th>Length</th></tr>${bandRows}</table>
        <p class="tiny">Nothing exceeds 30 seconds including the Grail, and the Floor never exceeds 3. Those are the two numbers the chips below can break; the column turns red if you break them. Currently the longest run is <b>${secs(cap)}</b>.</p>
      </section>
      <section>
        <h3>The ring, and what it means</h3>
        <p class="tiny">A fight is continuous motion punctuated by <b>commits</b>: circle, tell, clash, aftermath. The ring on the ground during a tell says what <i>can</i> happen — never what will. Only the clash knows.</p>
        <p class="tiny">The rhythm is <b>motion, stillness, violence, reset</b>. A tell is a <b>freeze</b>, not a wind-up: everything stops in ${C.tellShape.stopFrames} frames — dust, idle bob, the board, the snow — and the only motion left in the hold is involuntary, the flinch's tremor and the ring's pulse on one shared clock. Red and gold hold for ${(C.tellMs('red',1)/1000).toFixed(2)}s so the emotional arc has room to turn at ${Math.round(C.flinch.arcTurn*100)}%; white and amber get ${(C.tellMs('amber',1)/1000).toFixed(2)}s and a single note. Then the release: ${C.tellShape.releaseFrames} frames, and the attacker does not travel — it arrives.</p>
        <div class="ringKey">${Object.keys(C.rings).map(k => {
          const r = C.rings[k];
          return `<div class="rkRow"><i style="background:${r.color};height:${Math.max(3,r.width/1.6)}px"></i><b>${k}</b><span>${r.means}</span></div>`;
        }).join('')}</div>
        <p class="tiny">A clash resolves four ways and they look nothing alike, because which one just happened <i>is</i> the read: <b>block</b> (the guard holds and the attacker is thrown off it), <b>dodge</b> (the body is gone), <b>land</b> (it connects and they stay up — the near-finish), <b>critical</b> (it ends someone). Block and dodge only ever land on a rival's amber, where your Boxling is the one defending — so on a gold the rival gets <b>the slip</b> instead: it is not there for the first swing, and the finisher lands on the follow-through inside the same commit. ${C.hit.slipChance*100}% of golds, paid for out of the stop, so nothing gets longer and the gold still finishes.</p>
        <p class="tiny">Only the 14.05% of runs that reach rung 2 ever see a red.</p>
        <p class="tiny"> <b>Omens</b> ride on a beat that already exists and cost the run no time: Storm Front ${(om.stormFront.rates.low*100)}% of low runs → ${(om.stormFront.rates.high*100)}% of high; Auric Trace ${(om.auricTrace.rates.low*100)}% → ${(om.auricTrace.rates.grail*100)}%; Gold Meteor is Vault-only and never false.</p>
      </section>
      <section>
        <h3>The matchup</h3>
        <p class="tiny">Three elements in one closed ring, and nothing else. Every pairing is a <b>counter</b> or a <b>mirror</b>; a mirror reads EVEN. There is no chart, no lookup, no tutorial, no immunity and no resistance tier — the eight-type chart was 64 cells and a literacy tax, and it was correctly deleted. What is back is different in kind: relationships a child already knows.</p>
        <table class="dropT"><tr><th>This</th><th>Beats</th><th>Because</th><th>The losing image</th></tr>
          ${C.elementIds.map(id => { const e = C.elements[id], l = C.elements[e.beats];
            return `<tr><td>${e.name}</td><td>${C.elements[e.beats].name}</td><td>${e.because}</td>
                    <td>it ${l.losesAs === 'melt' ? 'melts into a puddle'
                            : l.losesAs === 'freeze' ? 'freezes solid, then shatters'
                            : 'gutters out into steam'}</td></tr>`; }).join('')}</table>
        <p class="tiny"><b>Three, not four, and the number is the argument.</b> Every link has to be instant, and every four-element ring contains at least one that needs a beat of thought — lightning shattering stone, ice grounding a storm — and a ring is only as legible as its weakest link. <b>The defeat teaches the rule</b>: each arm has one losing image, so the KO <i>is</i> the lesson and the game never explains itself. Three arms means the whole system is taught in three losses, which a volume user sees inside their first session. Elemental defeats are reserved for counter pairings; mirrors take the ordinary KO, or they would stop meaning anything.</p>
        <p class="tiny">Elements are never an icon, a letter or a badge — the element <i>is</i> the creature. ${C.elements.fire.name} is a dark core lit from within, orange into white-hot and never deep crimson (that hue belongs to the red ring). ${C.elements.ice.name} is opaque, faceted, pale, wide and planted, and it holds still. ${C.elements.water.name} is rounded, translucent, and never still. <b>ICE and WATER are the one real risk</b> — same substance, adjacent hues — so they are opposites in silhouette and motion, and any confusion gets fixed there rather than with a label.</p>
        <table class="dropT"><tr><th>Boxling</th><th>Element</th><th>Signature</th></tr>
          ${C.packSpecies().map(sp => `<tr><td>${sp.name}</td><td>${C.elements[sp.element].name}</td>
            <td>${C.elements[sp.element].sigVerb}</td></tr>`).join('')}</table>
        <p class="tiny"><b>Three cards at packing, not six.</b> With HP, moves and the type chart gone, the only thing packing decides is your element — so two Boxlings of the same element were the same choice wearing two coats, and a menu that offers a decision it does not have is the three-slot pack's bug one layer up. Three also puts the whole ring on screen at the one moment the player is thinking about it. The three chosen are the three furthest apart as <i>shapes</i>, which is what the confusion test is really asking: a taper that flickers, an angular planted box, a cluster of rounds with no edges. The other three bodies (${C.species.filter(s=>!s.packable).map(s=>s.name).join(', ')}) stay in the world as <b>rivals</b>, where variety is mandatory and two bodies per element means a FIRE rival is not always the same creature.</p>
        <details>
          <summary>The upset, the dodge, and what packing actually buys</summary>
          <p class="tiny"><b>The upset.</b> If a favoured matchup always won, the card would spoil the fight and the run would be readable at the walkout — so favourites usually win and sometimes do not, and the rate is the dial for how much the card is allowed to say. Favoured fights are won <b>85%</b> of the time, the number taken from the most-watched upset line in sport: a 3 seed beats a 14 seed 85.6% of the time in the NCAA round of 64 since 1985 (137–23). Often enough that everyone knows it can happen; rare enough that it is a story every time. Compare 1-over-16 at 98.8%, which is boring, and 8-versus-9 at 48.1%, which says nothing.</p>
          <p class="tiny">The rates below are <b>conditional on there being a favourite</b> — which is 2/3 of fights, because a mirror is the other third and a mirror has nothing to upset. Measured over 21,000 runs the schedule delivers 5.3% / 20.4% / 16.4% of the fights that had one.</p>
          <table class="dropT"><tr><th>Where</th><th>Upset rate</th><th>Why</th></tr>
            <tr><td>rung 1</td><td class="num">${(C.upset.rate[2]*100).toFixed(0)}%</td><td>early fights teach the grammar; an upset before FAVOURED means anything just reads as the card lying</td></tr>
            <tr><td>rung 2</td><td class="num">${(C.upset.rate[3]*100).toFixed(0)}%</td><td>the upset's home — the peril beat, and the run's best story in both directions</td></tr>
            <tr><td>the Vault</td><td class="num">${(C.upset.rate[4]*100).toFixed(0)}%</td><td>always staged as survival, never as domination</td></tr></table>
          <p class="tiny">An upset changes <b>which</b> commit resolves the rung and <b>how</b> — never whether the run continues. The band decided that at the seal. It is the difference between "won as expected" and "won by the skin of its teeth", and it is a variation in the telling rather than in the result, which is exactly why it can be scheduled freely without leaking anything.</p>
          <p class="tiny"><b>The dodge</b> is how an upset is staged so it reads as earned, and its rule is that the capability has to be visible <i>before</i> it is needed. Every Boxling's signature plays as harmless texture during the Circle a rung earlier — always, whether or not an upset is coming, so it costs nothing and leaks nothing. Then: the Tell is identical to any other (and the defender plays <span class="mono">QUAKE</span>, not <span class="mono">RALLY</span>, or the flinch would become an outcome tell), the strike lands exactly as it would have for ${C.dodge.landFrames} frames, and only then does contact fail to happen. <b>Hitstop still fires, on the miss</b> — that is what makes it a near-death rather than a whiff. Maximum <b>${C.dodge.maxPerRun} per run</b>, at the highest-stakes commit the schedule permits, and <b>never on the WITNESS strike</b>: that one is structural, because a dodge only ever attaches to a rival commit and the WITNESS strike is yours.</p>
          <p class="tiny">The dodge's ${(C.dodge.aftermath/1000).toFixed(1)}s stun aftermath is <b>not new time</b>. A dodge is a miss, and a miss has no business holding the longest impact frame in the game, so it is paid for out of the stop it replaces — the same trade the slip makes. The commit's total does not move and both caps are untouched.</p>
          <p class="tiny"><b>What packing buys, and the guard against a false model.</b> Packing chooses your element, so it chooses which counters you meet: your pick decides what the fights <i>look</i> like, and it cannot decide what the box holds. Three rules keep that true. <b>(1)</b> Element never correlates with band — the band comes off the <span class="mono">outcome</span> stream and the rival's element off a separate domain-separated <span class="mono">matchup</span> stream, so they are independent by construction rather than by audit. <b>(2)</b> The rival element schedule is drawn uniformly and is blind to your pick, and uniform over a closed three-ring means every packing meets a counter, a mirror and a countering rival at exactly <b>1/3</b> each — no packing choice can meet more counters than any other. <b>(3)</b> The receipt never mentions the matchup: spend, value, the Registry line. A player who wins big is never told their pack did it.</p>
        </details>
      </section>
      <!-- These two fold away by default. They are reference, not controls,
           and a panel you have to scroll past to reach the rig is a panel
           that is in the way. -->
      <section>
        <details>
          <summary>The board is the mountain</summary>
          <p class="tiny">The five value bands drawn as rungs up the triangle at the back of the arena, Floor at the wide base, the Grail at the narrow peak. It is the drop table above drawn as money, so it can be on screen from the first frame without leaking anything — it only ever removes what a clash has already proved. The taper is the point: the rarer the band, the smaller its rung.</p>
          <table class="dropT"><tr><th>Rung</th><th>Value</th><th>Burns when</th></tr>${boardRows}</table>
          <p class="tiny"><b>It is also the position indicator.</b> A ladder bug and a prize board would compete for the same glance, so they are one object: the boundary between burned-below and live-above <i>is</i> the height read. A rung carries no text — it is a glyph and a position. What a band is <i>worth</i> arrives when it <b>flies out</b>: the card leaves the ladder, holds at the front of the frame long enough to read, and only then shatters. Amber, red and gold belong to the rings — the lock is ice — with one exception, the two-card Vault endgame where the rung glows are the crack colors on purpose.</p>
        </details>
        <details>
          <summary>The walkout, and the flinch</summary>
          <p class="tiny">Rung 1 keeps the bare 1.2s confrontation frame so the opener flows straight into the first fight. <b>Every rung above it gets a walkout</b>, which absorbs that frame rather than sitting beside it: the arrival (the rival's box lands hard), the burst (the opener's shape again — a box opening is always the start of a threat), the card, the clear. Turbo compresses it to ${(C.walkout.turbo/1000).toFixed(1)}s and never skips it, because at speed it is the only thing separating one fight from the next.</p>
          <table class="dropT"><tr><th>Rung</th><th>Mismatch</th><th>The stake slab</th></tr>
            ${[3, C.height].map(r => `<tr><td>${r === C.height ? 'the Vault' : 'rung ' + (r-1)}</td>
              <td class="num">×${(C.mismatchRatio[C.rungMismatch[r]][1]/C.mismatchRatio[C.rungMismatch[r]][0]).toFixed(2)}</td>
              <td>${C.stakeLine(r)}</td></tr>`).join('')}</table>
          <p class="tiny">Three slabs, all safe: <b>who</b> (flavour, rotates freely), <b>the mismatch</b> (two silhouettes on a shared baseline — the confrontation frame's job made literal), <b>the stake</b> (read off the board, so it only names what a win removes). Every element is a function of rung index, so two runs of different bands arriving here see identical cards.</p>
          <p class="tiny"><b>The flinch</b> carries the ring's stakes in the bodies, so a viewer who never looks at the ring reads everything it says. A reaction may express the threat and the intent; it may never express the result. Rung 2's red runs the same <span class="mono">QUAKE→RALLY</span> for the band that dies on it and the band that survives it — a Boxling that rallies and falls is a better story than one that only rallies when it is going to win.</p>
        </details>
        <details>
          <summary>Celebrations and signature moves</summary>
          <p class="tiny">Scaled like WWE stakes: the same win, staged bigger, means more. Each species owns one repeatable <b>signature move</b>, chosen implicitly when you pack — so the celebration is your expression firing, and it is the last frame of the clip.</p>
          <table class="dropT"><tr><th>Boxling</th><th>Signature</th></tr>${sigRows}</table>
          <p class="tiny">Rung win = the arm-raise (${C.celebration.tiers.rung.min/1000}–${C.celebration.tiers.rung.max/1000}s, inside the Aftermath, shares its beat with the tier burn). Vault survival = the title shot (${C.celebration.tiers.vault.min/1000}–${C.celebration.tiers.vault.max/1000}s). The Grail = the title raise: the hoist, the board's top card descending into its hands, and the full pyro budget, reserved absolutely for the 0.05%. <b>No celebration vocabulary appears on any loss</b> — the NFL kept the ban on anything directed at the opponent, and so do we.</p>
        </details>
      </section>
      <section>
        <h3>The rig <span class="rigNow">${C.rigMatch() ? C.rigMatch() : 'custom'}</span></h3>
        ${chips('rig', C.rigPresets, C.rigMatch())}
        <label>Tell duration <span class="cval">${C.live.tell}ms</span>
          ${chips('tell', C.commit.tellChips.map(v=>({id:String(v), label:(v/1000).toFixed(1)+'s'})), String(C.live.tell))}
        </label>
        <!-- v3.7: the Circle range chip becomes CLOCK SPREAD, and the five-chip
             cap holds because it is the same chip doing a bigger job. It used
             to expose a min and a max that every Circle in the game then sat on
             the floor of; it now drives the per-position bases and the jitter
             magnitude together. The ratio between the longest and shortest
             Circle in a rung is NOT exposed and never falls below 3× in any
             preset — the value printed here is that ratio, measured. -->
        <label>Clock spread <span class="cval">×${C.clockSpread().scale.toFixed(2)} bases · ±${Math.round(C.clockSpread().jitter*100)}% jitter · ${
          (() => { const r = C.clockSpreadRatio(3, 1, 0); return isFinite(r) ? r.toFixed(1)+'× spread' : ''; })()}</span>
          ${chips('spread', C.clockSpreads, C.live.spreadId)}
        </label>
        <label>Slow-mo on red &amp; gold
          ${chips('slowmo', C.slowMoChips, C.live.slowMoId)}
        </label>
        <label>Telegraph ring scale
          ${chips('ring', C.ringChips, C.live.ringId)}
        </label>
        <label>Shot on <span class="cval">${(C.stopmo.base / C.film().stride).toFixed(0)}fps · go-motion ${Math.round(C.film().smear*100)}%</span>
          ${chips('film', C.filmChips, C.live.filmId)}
        </label>
        <label>Turbo <span class="cval">${C.turboRate() > 1 ? 'circle collapses, nothing skips' : ''}</span>
          ${chips('turbo', C.turboRates, C.live.turboId)}
        </label>
      </section>
      <section>
        <h3>Beside the rig</h3>
        <!-- The chips key on the CLASH outcomes (guard / land / critical), not
             on the hit weights (light / heavy / finisher). Reading the wrong
             pair here printed "NaNs on a finisher" for as long as the chip has
             existed. -->
        <label>The stop <span class="cval">${(C.impactSet().critical/1000).toFixed(1)}s on a finisher · ${(C.impactSet().guard/1000).toFixed(2)}s on a block</span>
          ${chips('impact', C.impact.chips, C.live.impactId)}
        </label>
        <label>Force outcome (demo)
          <select id="forceSel">
            <option value="">— fair draw —</option>
            ${C.bands.map(b=>`<option value="${b.i}" ${session.forcedBand===b.i?'selected':''}>${b.label}</option>`).join('')}
          </select>
        </label>
        <!-- The earned-dodge test needs a dodge on demand, and at rung 1 the
             honest rate is 5%. This never touches the band: an upset is a
             variation in the telling and structurally cannot reach the
             outcome. -->
        <label>Force upset (demo)
          <select id="upsetSel">
            <option value="" ${C.live.forceUpset===null?'selected':''}>— scheduled rates —</option>
            <option value="on" ${C.live.forceUpset==='on'?'selected':''}>always, where the schedule permits</option>
            <option value="off" ${C.live.forceUpset==='off'?'selected':''}>never</option>
          </select>
        </label>
        <label>Floor gag
          <select id="gagSel">
            <option value="">— drawn from the seal —</option>
            ${C.gags.map(g=>`<option value="${g.id}" ${C.live.gagId===g.id?'selected':''}>${g.name}</option>`).join('')}
          </select>
        </label>
        <label class="row"><input type="checkbox" id="vfxChk" ${C.live.vfx?'checked':''}> Effects on
          <span class="tiny">— off leaves bodies, distance and posture only</span></label>
        <label class="row"><input type="checkbox" id="filmChk" ${C.live.filmstrip?'checked':''}> Beat filmstrip
          <span class="tiny">— every commit as circle / tell / clash / aftermath</span></label>
        <label class="row"><input type="checkbox" id="coverChk" ${C.live.coverRing?'checked':''}> Cover the ring
          <span class="tiny">— for the covered-ring test: the bodies alone</span></label>
        <!-- THE TWO v3.7 DEBUG TOGGLES, and neither gets a chip. Freeze orbit
             is the more useful of the two by a distance: it reproduces the v3
             bug on demand, so the comparison can be watched rather than
             argued about. -->
        <label class="row"><input type="checkbox" id="orbitChk" ${C.live.freezeOrbit?'checked':''}> Freeze orbit
          <span class="tiny">— pins θ, r and the centre: the v3 bug on demand, for comparison</span></label>
        <label class="row"><input type="checkbox" id="ivalChk" ${C.live.intervalLog?'checked':''}> Interval log
          <span class="tiny">— dumps inter-tell intervals to the console for the metronome audit</span></label>
        <button id="animaticBtn" class="ghost">▶ Animatic — the rung 2 peril</button>
        <p class="tiny">Plays the peril sequence alone — walkout, amber, the red, the gold comeback — for the <b>brace test</b>: sound off, no explanation, does the viewer flinch at the red tell? Then run it again with the ring covered: they must still read that something dangerous is coming, from the bodies alone. If they cannot, the flinch is decoration rather than communication.</p>
        <button id="newSeedBtn" class="ghost">New server seed</button>
      </section>
      <section>
        <h3>The board's three tests</h3>
        <button id="glanceBtn" class="ghost">▶ Glance test — half a second</button>
        <label>Loss staging <span class="cval">${C.live.lossStaging === 'lock' ? 'ships' : 'the A/B arm'}</span>
          ${chips('loss', [{id:'lock', label:'lock (quiet fold)'}, {id:'burn', label:'burn (dramatized)'}], C.live.lossStaging)}
        </label>
        <details>
          <summary>what these are for</summary>
          <p class="tiny">The <b>glance test</b> flashes a mid-run ladder state for 500ms at someone who has never seen the game, then hides it; ask how far up the run is. It passes if the count reads without instruction.</p>
          <p class="tiny">The <b>lock test</b> is the switch above. Force a band 3 death and show both arms to five people: ask how the loss felt and whether they would open again. <i>Lock</i> is Design v4's answer to the Deal or No Deal finding — dramatized loss states drive chasing, so the rungs above fold flat and undramatized while the won rung takes the light. <i>Burn</i> is the arm it is being measured against.</p>
          <p class="tiny">The <b>convergence test</b> needs no switch: force the Vault and ask what the red and gold rung glows will mean before the crack lands. If the board taught the endgame without words, the merge is working.</p>
        </details>
      </section>`;

    $('setupBody').querySelectorAll('.chips').forEach(box => {
      box.addEventListener('click', e => {
        const b = e.target.closest('.chipB');
        if (!b) return;
        const v = b.dataset.v;
        switch (box.dataset.chip){
          case 'rig':     C.applyRig(v); break;      // a preset writes all five
          case 'tell':    C.live.tell = +v; break;
          case 'spread':  C.live.spreadId = v; break;
          case 'slowmo':  C.live.slowMoId = v; break;
          case 'ring':    C.live.ringId = v; break;
          case 'film':    C.live.filmId = v; break;
          case 'turbo':   C.live.turboId = v; break;
          case 'impact':  C.live.impactId = v; break;
          case 'loss':    C.live.lossStaging = v; break;
        }
        renderSetup();       // the length column has to move when a chip does
      });
    });
    /* The naked test wants bodies, distance and posture only — and the element
       materials are BODY, so they stay. What goes with the rest of the effects
       is the decoration on top of them: FIRE's heat shimmer is a displacement
       filter and the single most expensive thing on the screen. The flag has
       always been JS-side; the class is what lets the stylesheet see it. */
    $('vfxChk').onchange = e => {
      C.live.vfx = e.target.checked;
      document.body.classList.toggle('novfx', !C.live.vfx);
    };
    document.body.classList.toggle('novfx', !C.live.vfx);
    $('coverChk').onchange = e => C.live.coverRing = e.target.checked;
    /* FREEZE ORBIT is live rather than per-run on purpose: tick it mid-fight
       and the ring stops dead where it is, which is the clearest possible
       demonstration of what the section bought. Untick it and the fight starts
       travelling again from wherever it was standing. */
    $('orbitChk').onchange = e => C.live.freezeOrbit = e.target.checked;
    $('ivalChk').onchange = e => C.live.intervalLog = e.target.checked;
    $('filmChk').onchange = e => {
      C.live.filmstrip = e.target.checked;
      document.body.classList.toggle('film', C.live.filmstrip);
      if (!C.live.filmstrip) $('film').innerHTML = '';
    };
    $('forceSel').onchange = e => session.forcedBand = e.target.value === '' ? null : +e.target.value;
    $('gagSel').onchange = e => C.live.gagId = e.target.value || null;
    $('upsetSel').onchange = e => C.live.forceUpset = e.target.value || null;
    $('animaticBtn').onclick = runAnimatic;
    $('glanceBtn').onclick = () => { if (!session.running) BB.present.glanceTest(2, 500); };
    $('newSeedBtn').onclick = () => {
      session.serverSeed = F.randomHex(16);
      session.serverSeedHash = F.sha256Hex(session.serverSeed);
      session.openIndex = 0;
      renderSetup();
    };
  }

  /* THE ANIMATIC — build-order step 1, kept as a permanent fixture.
     The rung 2 peril alone: confrontation frame, amber survived, the red, the
     gold comeback. This is the artifact the brace test runs against — five
     first-time viewers, sound off, no explanation. If they do not visibly
     brace at the red tell, the tell is not yet an event, and the five chips
     above are exactly the dials for fixing that. */
  async function runAnimatic(){
    if (session.running || !session.pack) return;
    session.running = true;
    document.body.classList.add('running');
    setPanel(false);
    const plan = BB.planner.planRun({
      serverSeed: session.serverSeed, clientSeed: clientSeedOf(),
      openIndex: session.openIndex, pack: session.pack, forcedBand: 3,
    });
    await BB.present.playAnimatic(plan, { rate: C.turboRate() });
    session.running = false;
    document.body.classList.remove('running');
    setPanel(true);
  }

  // ----------------------------------------------------------- packing UI
  /* ONE BOXLING, NOT THREE. The three-slot pack was carrying the bench: with
     hitpoints gone there is no swap, no next-one-up, nothing an order could
     change — so the second and third slots were choices that decided nothing
     and read like they decided something. What is left is the choice that
     always mattered: which Boxling is yours, and what color it wears. */
  const packState = { chosen: [], colorways: {} };
  function renderPacking(){
    const grid = $('packGrid');
    /* THREE CARDS, one per element. Six read as six choices and were not:
       with HP, moves and the type chart gone, the only thing packing decides
       is your element, so two Boxlings of the same element were the same
       choice wearing two coats. Three also puts the whole ring on screen at
       the one moment the player is thinking about it. The other three bodies
       are still in the world as rivals. */
    grid.innerHTML = C.packSpecies().map(sp => {
      const sel = packState.chosen.indexOf(sp.id);
      return `<button class="packCard ${sel>=0?'sel':''}" data-id="${sp.id}">
        <span class="slotNo">◈</span>
        <svg viewBox="-70 -120 140 140" class="cardArt">${BB.art.creature(sp.id, {tint:(C.colorways.find(c=>c.id===(packState.colorways[sp.id]||'kraft'))).body, charm: sel===0})}</svg>
        <span class="pcName">${sp.name}<em class="pcEl el-${sp.element}">${C.elements[sp.element].name}</em></span>
        <span class="pcBlurb">${sp.blurb}</span>
        <!-- Packing chooses your element, so packing chooses which counters
             you will meet, and v3.5 says that is worth saying PLAINLY in the
             product. This is a menu rather than the arena, so a word is
             allowed here — in the fight the element is only ever the
             creature's material, never an icon or a letter. -->
        <span class="pcRing">beats ${C.elements[C.elements[sp.element].beats].name} · loses to ${
          C.elements[C.elementIds.find(i => C.elements[i].beats === sp.element)].name}</span>
        <span class="cwRow" title="Colorway — the same four on every Boxling, cosmetic only">
          <em class="cwLabel">color</em>
          ${C.colorways.map(cw=>`<i class="sw ${((packState.colorways[sp.id]||'kraft')===cw.id)?'on':''}" data-sp="${sp.id}" data-cw="${cw.id}" style="background:${cw.body}" title="${cw.name}"></i>`).join('')}</span>
      </button>`;
    }).join('');
    grid.querySelectorAll('.packCard').forEach(b => b.addEventListener('click', e => {
      if (e.target.classList.contains('sw')) return;
      const id = b.dataset.id;
      // Single pick: tapping another card moves the charm rather than
      // queueing behind it, and tapping your own unpacks.
      packState.chosen = packState.chosen[0] === id ? [] : [id];
      renderPacking();
    }));
    grid.querySelectorAll('.sw').forEach(s => s.addEventListener('click', e => {
      e.stopPropagation();
      packState.colorways[s.dataset.sp] = s.dataset.cw;
      renderPacking();
    }));
    $('sealBtn').disabled = packState.chosen.length !== 1;
    $('packHint').textContent = packState.chosen.length === 1
      ? 'Yours wears the Charm ◈ and fights every rung. Its signature move is the last frame of the clip. Its element decides what the fights look like — and nothing else: every packing is exactly as lucky as every other.'
      : 'Choose your Boxling — one goes in the box.';
  }
  function openPacking(){
    $('packOverlay').classList.add('shown');
    if (session.pack){
      packState.chosen = session.pack.members.map(m=>m.speciesId);
      session.pack.members.forEach(m => packState.colorways[m.speciesId] = m.colorway);
    }
    renderPacking();
  }

  async function sealAndRun(){
    const members = packState.chosen.map(id => ({ speciesId:id, colorway: packState.colorways[id] || 'kraft' }));
    session.pack = { members, charmIndex: 0 };
    /* Same guard as the read. Failing to REMEMBER a pack must never stop the
       run that pack was just made for. */
    try { localStorage.setItem('bb-pack', JSON.stringify(session.pack)); } catch(e){ /* not fatal */ }
    session.nonce = $('nonceInput').value || '';
    const btn = $('sealBtn');
    btn.textContent = 'SEALED';
    $('packOverlay').classList.add('sealing');
    await new Promise(r => setTimeout(r, 500));
    $('packOverlay').classList.remove('shown','sealing');
    btn.textContent = 'SEAL IT';
    startRun();
  }

  function clientSeedOf(){
    return session.pack.members.map(m=>`${m.speciesId}.${m.colorway}`).join('-') + (session.nonce ? '~'+session.nonce : '');
  }

  // ---------------------------------------------------------------- a run
  /* One open, start to finish. The replay path the Stable needed is gone with
     it — every run here is a fresh draw off the next open index. */
  async function startRun(){
    if (session.running) return;
    session.running = true;
    document.body.classList.add('running');
    setPanel(false);
    const plan = BB.planner.planRun({
      serverSeed: session.serverSeed,
      clientSeed: clientSeedOf(),
      openIndex: session.openIndex,
      pack: session.pack,
      forcedBand: session.forcedBand,
      recentGags: BB.registry.recentGags(),
    });
    session.openIndex++;
    const result = await BB.present.playRun(plan, { rate: C.turboRate() });
    /* THE INTERVAL AUDIT (v3.7 acceptance test 22), run against the run that
       just played rather than against the schedule that planned it. "No two
       consecutive intervals within 25% of each other; the longest at least 3x
       the shortest, in every run. Automatic fail, and worth wiring into the
       build." This is the wiring. */
    if (C.live.intervalLog) console.info('inter-tell intervals', intervalAudit());
    const regLines = plan.demo ? ['Demo draw — nothing banked.']
                               : BB.registry.bank(plan, result);
    showReceipt(plan, regLines, result);
    session.running = false;
    document.body.classList.remove('running');
    setPanel(true);            // the arc is over; the rig comes back
  }

  // --------------------------------------------------------------- receipt
  function showReceipt(plan, regLines, result){
    const price = C.box.price, v = plan.item.value;
    const win = v >= price;
    /* `runLength` already divides by the turbo rate internally, so dividing
       again here printed a 4x Vault run as "9.1s / 1.8s budgeted" — the same
       number scaled twice. The budget is the only thing on this receipt that
       the design's two hard caps are checked against, so it has to be the
       number the clock is actually racing. */
    const target = C.runLength(plan.band);
    const el = result && result.elapsed;
    const verify = `
      <details class="verify"><summary>Verify this run</summary>
        <p class="mono tiny">server seed&nbsp;&nbsp;${plan.serverSeed}<br>
        client seed&nbsp;&nbsp;${plan.clientSeed}<br>
        open #&nbsp;&nbsp;${plan.openIndex}<br>
        seal = HMAC(server, client|open)<br>&nbsp;&nbsp;${plan.seal.slice(0,48)}…</p>
        <p class="tiny">${(() => {
          const re = BB.planner.planRun({serverSeed:plan.serverSeed, clientSeed:plan.clientSeed, openIndex:plan.openIndex, pack:plan.packSnapshot, forcedBand: plan.demo? plan.band : null});
          return re.item.id === plan.item.id ? '✓ Recomputed from the seal just now — same prize. It was decided before the first frame.' : '✗ recompute mismatch (bug!)';
        })()}</p>
      </details>`;
    $('receiptBody').innerHTML = `
      ${plan.demo ? '<div class="demoTag">DEMO DRAW — forced outcome, not banked</div>' : ''}
      <h2 class="${win?'winH':''}">${win ? 'WINNINGS' : 'salvage recovered'}</h2>
      <p class="endLine">${(C.species.find(s=>s.id===C.speciesId(plan.packSnapshot.members[plan.finalIndex||0].speciesId))||C.species[0]).name} ${endedLabel(plan)}.</p>
      <div class="rrow"><span>Spend</span><span class="num">${money(price)}</span></div>
      <div class="rrow item"><span>${plan.item.name}</span><span class="num">${money(v)}</span></div>
      ${win ? `<div class="rrow winRow"><span>Winnings</span><span class="num">+${money(v-price)}</span></div>`
            : `<div class="rrow"><span>Salvage value</span><span class="num">${money(v)}</span></div>`}
      ${el ? `<div class="rrow tiny"><span>Run length</span><span class="num">${secs(el)} <span class="dimv">/ ${secs(target)} budgeted</span></span></div>` : ''}
      <div class="regLines">${(regLines||[]).map(l=>`<div class="regLine">◈ ${l}</div>`).join('')}</div>
      ${verify}`;
    $('receiptOverlay').classList.add('shown');
  }
  $('againBtn').onclick = () => { $('receiptOverlay').classList.remove('shown'); startRun(); };
  $('repackBtn').onclick = () => { $('receiptOverlay').classList.remove('shown'); openPacking(); };
  /* The way out. Both buttons above start another run, so without this the
     receipt was a turnstile: the panel came back but you never got a frame in
     which to reach it. Escape does the same thing. */
  const closeReceipt = () => { $('receiptOverlay').classList.remove('shown'); setPanel(true); };
  $('closeReceiptBtn').onclick = closeReceipt;
  $('panelBtn').onclick = () => setPanel(document.body.classList.contains('panelShut'));
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('receiptOverlay').classList.contains('shown')) closeReceipt();
    else if ($('registryOverlay').classList.contains('shown')) $('registryOverlay').classList.remove('shown');
  });

  // -------------------------------------------------------------- registry
  /* One collection, not three. Odyssey stamps and Path badges were both cut:
     they said "you got a thing" without ever saying what the thing was for,
     and they were stacked on a receipt that already carried a prize, a
     salvage line and a witness card. What survives is the collection tied to
     something the player actually watched happen on screen. */
  function openRegistry(){
    const d = BB.registry.data;
    const meteor = d.witness.goldMeteor;
    $('registryBody').innerHTML = `
      <div class="rstats">
        <div><b>${d.opens}</b><span>opens</span></div>
        <div><b>${money(d.spend)}</b><span>spend</span></div>
        <div><b>${money(d.returned)}</b><span>returned</span></div>
        <div><b>${d.bestPull ? money(d.bestPull.value) : '—'}</b><span>best pull</span></div>
      </div>
      <h3>Witness cards</h3>
      <div class="wcards">
        <div class="wcard ${d.witness.stormFront?'have':''}">Storm Front <b>${d.witness.stormFront}</b></div>
        <div class="wcard ${d.witness.auricTrace?'have':''}">Auric Trace <b>${d.witness.auricTrace}</b></div>
        <div class="wcard ${d.witness.vaultSeen?'have':''}">The Vault <b>${d.witness.vaultSeen}</b></div>
        <div class="wcard gold ${meteor?'have':''}">Gold Meteor <b>${meteor} / 1</b></div>
      </div>
      <button id="regReset" class="ghost">reset registry</button>`;
    $('registryOverlay').classList.add('shown');
    $('regReset').onclick = () => { BB.registry.reset(); openRegistry(); };
  }
  $('registryBtn').onclick = openRegistry;
  $('registryClose').onclick = () => $('registryOverlay').classList.remove('shown');
  $('packBtn').onclick = openPacking;
  $('sealBtn').onclick = sealAndRun;
  $('skipBtn').onclick = () => BB.present.skipNow();

  /* ------------------------------------------------------- CLEAN MODE
     The run clock and the beat filmstrip are instrumentation for building this
     rather than for playing it, and they are the two things that make a
     recording or a screenshot look like a debug build. Neither could be turned
     off while a run was playing: the filmstrip's only control was a checkbox in
     the setup panel, and the panel folds away for the duration of a run; the
     clock had no control at all.

     So it lives in the topbar, which is always reachable, and it is remembered
     across runs and reloads — a display preference you have to re-set every
     time is not a preference. It is a pure display override and deliberately
     does NOT write `live.filmstrip`, so the panel's own filmstrip chip keeps
     its state and the strip returns exactly as it was left. */
  const HUD_KEY = 'bb.cleanMode';
  function setClean(on){
    document.body.classList.toggle('nohud', !!on);
    const b = $('hudBtn');
    if (b){
      b.textContent = on ? '◲ Show HUD' : '◱ Clean';
      b.title = on ? 'Show the run clock and the beat filmstrip'
                   : 'Hide the run clock and the beat filmstrip';
      b.classList.toggle('on', !!on);
    }
    try { localStorage.setItem(HUD_KEY, on ? '1' : '0'); } catch(e){}
  }
  $('hudBtn').onclick = () => setClean(!document.body.classList.contains('nohud'));
  // Escape is already the receipt's exit; Shift+H is free and needs no chrome.
  window.addEventListener('keydown', e => {
    if ((e.key === 'h' || e.key === 'H') && e.shiftKey && !e.metaKey && !e.ctrlKey){
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
      e.preventDefault();
      setClean(!document.body.classList.contains('nohud'));
    }
  });
  { let saved = '0';
    try { saved = localStorage.getItem(HUD_KEY) || '0'; } catch(e){}
    /* `?clean=1` for the deep links, so a run handed to a stranger for an
       acceptance test can arrive with the instrumentation already gone. */
    const q = new URLSearchParams(location.search);
    setClean(q.has('clean') ? q.get('clean') !== '0' : saved === '1');
  }

  // ------------------------------------------------------------------ boot
  BB.present.mount($('stage'), {
    action: $('actionBtn'), stakes: $('stakes'), banner: $('banner'),
    team: $('team'), occlude: $('occlude'),
    clock: $('clock'), skip: $('skipBtn'), film: $('film'), decode: $('decode'),
  });
  renderSetup();
  setPanel(true);
  /* The ladder is part of the arena's own markup now, so it is on screen from
     the first frame, before a run and between runs — it never hides and it
     never repositions, which is the whole point of thirty years of score-bug
     craft. Mounting only puts it in its starting state. */
  BB.present.board.build();

  /* ------------------------------------------------- TEST DEEP LINKS
     `?force=2&species=glacierkin&turbo=4&go=1` packs, forces a band and seals,
     so a run that would otherwise take six clicks to set up is a link you can
     hand to somebody. It exists because the v3.6 acceptance tests are mostly
     "show a stranger X and ask them Y", and a stranger should not have to be
     walked through a setup panel first — see test.html, which is nothing but
     these links with the automated checks above them.

     Every parameter maps onto a control that already exists, so this adds no
     behaviour: it presses the buttons for you. `force` in particular is the
     same demo control the rig has always had, and it never touches the seal's
     honesty — the band is still drawn, then constrained, exactly as the panel
     does it. */
  (() => {
    const q = new URLSearchParams(location.search);
    if (![...q.keys()].length) return;
    const sp = q.get('species');
    if (sp && C.species.some(s => s.id === sp)){
      packState.chosen = [C.packableId(sp)];
      renderPacking();
    }
    /* Write the STATE, then re-render the panel once. The panel's handlers are
       bound inside renderSetup(), so driving the controls with synthetic events
       and then re-rendering would throw the values away on the next redraw —
       the state is the source of truth and the controls are its view. */
    if (q.get('force') != null && q.get('force') !== '')
      session.forcedBand = +q.get('force');
    if (q.get('turbo'))      C.live.turboId    = q.get('turbo');
    if (q.get('upsetModel')) C.live.upsetModel = q.get('upsetModel');
    /* Forceable because it is a per-seal draw that lands on one rung out of
       two: watching for one at its honest rate means replaying until the coin
       cooperates AND lands on a rung this band actually finishes. Set before
       the plan is authored, which is the only moment it can be set at all. */
    if (q.get('escape') != null && q.get('escape') !== '')
      C.escape.chance = Math.max(0, Math.min(1, +q.get('escape')));
    if (q.get('cover') === '1') C.live.coverRing = true;
    if (q.get('vfx')   === '0'){
      C.live.vfx = false;
      document.body.classList.toggle('novfx', true);
    }
    renderSetup();
    /* Seal on arrival, but only with a Boxling actually packed — otherwise the
       link lands on a disabled button and looks broken rather than opinionated. */
    if (q.get('go') === '1' && packState.chosen.length === 1){
      $('packOverlay').classList.remove('shown');
      setPanel(false);
      setTimeout(sealAndRun, 120);
    }
  })();

  /* THE HONESTY AUDIT, RUN AT BOOT (v3.6 acceptance test 14).
     "For every commit, compare the displayed matchup against the published
      survival rate at that position... One violation invalidates the card
      system."

     It is the only one of v3.6's new tests that does not need a stranger in a
     room, so it is the only one that gets to be a check rather than a
     paragraph — and a check nobody runs is a paragraph with extra steps. It is
     pure, it reads the schedule rather than a sampled run (so it proves the
     property for every band and every packing at once), and it costs
     microseconds, so it runs on every load and complains loudly rather than
     waiting for someone to remember it. `BB.config.honestyAudit()` returns the
     same result on demand from the console. */
  (() => {
    const a = C.honestyAudit();
    if (!a.pass){
      console.error('HONESTY AUDIT FAILED — the card system is invalid:', a.fails);
    } else if (a.note) console.info('honesty audit passes.', a.note);
  })();

  /* MODULE FRESHNESS, and the build stamp was not enough on its own.
     `js/*.js` are seven separate requests the browser caches independently, so
     a reload can bring back a fresh `config.js` and a stale `art.js` — which is
     exactly what happened during this pass, and it presents as a TypeError deep
     inside a run rather than as anything resembling a cache problem. The stamp
     lives in config.js and therefore proves only that config.js is current.

     So each module names one symbol this build requires. A miss is a stale
     cache, always, and it says so in those words rather than leaving somebody
     to work backwards from "A.fx.charge is not a function". */
  (() => {
    const need = [
      ['art',     BB.art,     ['charge', 'brace', 'chargeCore', 'beam'].every(k => typeof (BB.art.fx||{})[k] === 'function')],
      ['config',  C,          typeof C.clockPlan === 'function' && !!C.ringSpace && !!C.clock &&
                              !!C.combatRange && typeof C.isRanged === 'function'],
      ['present', BB.present, typeof BB.present.intervals === 'function'],
      ['planner', BB.planner, typeof BB.planner.planRun === 'function'],
      ['fair',    BB.fair,    typeof BB.fair.stream === 'function'],
    ];
    const stale = need.filter(m => !m[1] || !m[2]).map(m => 'js/' + m[0] + '.js');
    if (stale.length)
      console.error('STALE CACHE — these modules are an older build than the page: ' +
                    stale.join(', ') + '. Hard-reload (Ctrl+Shift+R). Expected build: ' + C.build);
  })();

  /* THE INTERVAL AUDIT (v3.7 acceptance test 22), against the run that just
     played. Two rules, both automatic fails:

       - no two CONSECUTIVE inter-Tell intervals within 25% of each other
       - the longest at least 3x the shortest

     Measured off `BB.present.intervals()`, which records the real gap between
     one Tell starting and the next — not the schedule. That distinction is the
     whole value of the test: the pacer squeezes beats and the stop raids the
     Aftermath, and what a viewer's body entrains to is what actually happened.

     TWO HONEST EXEMPTIONS, and both exist because a rule that cannot fail is
     not evidence of anything.

     A run with fewer than two Tells has no interval at all, so neither rule has
     anything to compare — and 86% of all runs are Floor or band 2. That reports
     `n/a`, not a pass.

     And the 3x SPREAD rule needs at least three intervals, because it is a
     property of a whole run rather than of a fragment. The animatic is the case
     that made this explicit: it plays rung 2 alone, produces exactly two
     intervals, and cannot reach 3x between them no matter how the clock is
     scheduled — the two gaps it compares are dominated by a 1.5s finisher stop
     and a dodge stun, which are rigid content the clock may not touch. Flagging
     that as a failure would be the audit measuring the wrong thing loudly. The
     consecutive-25% rule still applies to it, and it passes. */
  function intervalAudit(){
    const iv = (BB.present.intervals && BB.present.intervals()) || [];
    const ms = iv.map(x => x.ms);
    if (ms.length < 2) return { n: ms.length, verdict:'n/a — too few tells to compare', intervals: iv };
    const fails = [];
    for (let i = 1; i < ms.length; i++){
      const lo = Math.min(ms[i-1], ms[i]), hi = Math.max(ms[i-1], ms[i]);
      if (hi > 0 && (hi - lo) / hi < C.clock.varianceFloor)
        fails.push(`intervals ${i-1} and ${i} are within ${Math.round((1-lo/hi)*100)}% (${lo}ms vs ${hi}ms)`);
    }
    const spread = Math.max.apply(null, ms) / Math.max(1, Math.min.apply(null, ms));
    const spreadScoped = ms.length >= 3;
    if (spreadScoped && spread < C.clock.spreadFloor)
      fails.push(`longest is only ${spread.toFixed(2)}x the shortest, floor is ${C.clock.spreadFloor}x`);
    return { n: ms.length, spread: +spread.toFixed(2), pass: !fails.length,
             spreadRule: spreadScoped ? 'applied' : 'n/a — a fragment, not a run',
             verdict: fails.length ? 'FAIL' : 'pass', fails, intervals: iv };
  }
  BB.intervalAudit = intervalAudit;

  openPacking();
})();

</script>
</body>
</html>
