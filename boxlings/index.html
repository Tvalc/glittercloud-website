    return `<g class="silh silh-${grade}" transform="scale(${w})"><path d="${d}" fill="#0b1526" stroke="#3d6288" stroke-width="1.6" opacity="0.96"/></g>`;
  }

  /* The Challenger Select reticle — corner brackets that snap around whoever
     the sweep is currently over. Reads instantly at a glance, sound off. */
  function selectorBracket(){
    return `<g class="selBracket" filter="url(#softGlow)">
      <rect x="-48" y="-120" width="96" height="146" rx="6" fill="#f2c14e" opacity="0.10"/>
      <path d="M -48 -102 L -48 -120 L -30 -120  M 48 -102 L 48 -120 L 30 -120
               M -48 8 L -48 26 L -30 26        M 48 8 L 48 26 L 30 26"
            stroke="#f2c14e" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>`;
  }

  /* Roster pip: the Parade rendered small enough to live in the HUD for the
     whole climb, so the player watches the apexes coming. */
  function rosterPip(grade){
    const h = grade === 'apex' ? 22 : grade === 'pro' ? 17 : 13;
    const w = grade === 'apex' ? 13 : grade === 'pro' ? 10 : 8;
    return `<svg viewBox="-14 -26 28 30" width="20" height="22"><g transform="scale(${w/13} ${h/22})">
      <path d="M 0 0 L -9 0 L -8 -14 L -12 -16 L -6 -24 Q 2 -28 8 -22 L 11 -16 L 7 -14 L 9 0 Z"
            fill="currentColor"/></g></svg>`;
  }

  // -------------------------------------------------------------- the Auric
  function auric(){
    let drops='';
    for(let i=0;i<7;i++){
      drops += `<circle class="auricMote m${i}" cx="${-30+i*11}" cy="${-96-(i%3)*14}" r="${2.2+(i%3)}" fill="#ffe9a3" filter="url(#softGlow)"/>`;
    }
    const inner = `
    <g filter="url(#bigGlow)">
      <path d="M -30 0 Q -46 -30 -34 -66 Q -26 -96 0 -112 Q 26 -96 34 -66 Q 46 -30 30 0 Q 12 8 0 8 Q -12 8 -30 0 Z"
            fill="url(#auricBody)" stroke="#8a6508" stroke-width="2.4"/>
    </g>
    <path d="M 0 -112 Q -6 -128 2 -140 Q 12 -130 8 -116 Z" fill="#fff3c4" filter="url(#softGlow)"/>
    <path d="M -34 -66 Q -58 -74 -64 -94 Q -46 -92 -36 -80 Z" fill="#ffd75e" opacity="0.9" filter="url(#softGlow)"/>
    <path d="M 34 -66 Q 58 -74 64 -94 Q 46 -92 36 -80 Z" fill="#ffd75e" opacity="0.9" filter="url(#softGlow)"/>
    <g class="face" transform="translate(0 -74)">
      <path d="M -20 -2 L -6 2 L -20 7 Z" fill="#4a3403"/>
      <path d="M 20 -2 L 6 2 L 20 7 Z" fill="#4a3403"/>
    </g>
    <path d="M -14 -34 Q 0 -26 14 -34" stroke="#fff3c4" stroke-width="2.4" fill="none" opacity="0.8"/>
    ${drops}`;
    return wrap('creature auric', inner);
  }

  // ------------------------------------------------------------------ FX
  const fx = {
    dustRing(){ return `<g class="fxDust">
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="#dfe9f2" stroke-width="5" opacity="0.9"/>
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="#aebfd0" stroke-width="3" opacity="0.7"/></g>`; },
    impact(){ return `<g class="fxImpact" filter="url(#softGlow)">
      <path d="M 0 -26 L 5 -7 L 24 -10 L 8 2 L 16 20 L 0 9 L -16 20 L -8 2 L -24 -10 L -5 -7 Z"
            fill="#fff8dd" stroke="#f2c14e" stroke-width="2"/></g>`; },
    shock(){ let s=''; for(let i=0;i<8;i++){ const a=i*Math.PI/4;
        s += `<line x1="${Math.cos(a)*16}" y1="${Math.sin(a)*16}" x2="${Math.cos(a)*34}" y2="${Math.sin(a)*34}" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`; }
      return `<g class="fxShock" opacity="0.9">${s}</g>`; },
    stars(){ let s=''; for(let i=0;i<3;i++){ const a=i*2.09;
        s += `<path transform="translate(${Math.cos(a)*24} ${Math.sin(a)*10-4}) scale(0.8)" d="M 0 -7 L 2 -2 L 7 -2 L 3 1 L 5 6 L 0 3 L -5 6 L -3 1 L -7 -2 L -2 -2 Z" fill="#ffe9a3" stroke="#c8961e" stroke-width="1"/>`; }
      return `<g class="fxStars">${s}</g>`; },
    snowPuff(){ let s=''; for(let i=0;i<6;i++){ s += `<circle cx="${-18+i*7}" cy="${-(i%3)*8}" r="${5+(i%3)*3}" fill="#eaf6ff" opacity="0.85"/>`; }
      return `<g class="fxPuff">${s}</g>`; },
    burn(){ return `<g class="fxBurn" filter="url(#softGlow)">
      <path d="M -18 -8 Q -14 -22 -6 -14 Q -2 -26 4 -14 Q 10 -22 14 -8" stroke="#ff8a4d" stroke-width="3.4" fill="none"/></g>`; },
    chill(){ return `<g class="fxChill" filter="url(#softGlow)">
      <path d="M 0 -14 v 16 M -7 -10 l 14 8 M 7 -10 l -14 8" stroke="#8fd6ff" stroke-width="2.6"/></g>`; },
    stun(){ return `<g class="fxStun" filter="url(#softGlow)">
      <path d="M -12 -6 L -6 -16 L -8 -8 L -2 -14 M 6 -14 L 12 -4 L 6 -8 L 10 0" stroke="#ffd94d" stroke-width="2.6" fill="none"/></g>`; },
    charmFlare(){ return `<g class="fxCharm"><circle r="26" fill="url(#goldBloom)"/><circle r="9" fill="#fff3c4" filter="url(#bigGlow)"/></g>`; },
    bloom(kind){ return `<g class="fxBloom"><circle r="120" fill="url(#${kind==='gold'?'goldBloom':'redBloom'})"/></g>`; },
    meteor(){ return `<g class="fxMeteor" filter="url(#bigGlow)">
      <path d="M 0 0 L -70 -150 L -54 -152 Z" fill="#ffe9a3" opacity="0.8"/>
      <circle cx="0" cy="0" r="10" fill="#fff3c4"/><circle cx="0" cy="0" r="5" fill="#fff"/></g>`; },
    crack(color){
      const c = color==='gold' ? '#ffd700' : '#e8452c';
      const glow = color==='gold' ? '#fff3c4' : '#ff9a7a';
      return `<g class="fxCrack" filter="url(#softGlow)">
        <path class="crackPath" d="M 0 -62 L -12 -74 L -8 -92 L -22 -104 M 0 -62 L 14 -70 L 12 -92 L 28 -100
                 M 0 -62 L -18 -52 L -34 -58 M 0 -62 L 16 -48 L 20 -30 L 36 -22 M 0 -62 L -6 -40 L -18 -24"
              stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path class="crackPath2" d="M 0 -62 L -12 -74 L -8 -92 M 0 -62 L 16 -48 L 20 -30" stroke="${glow}" stroke-width="1.8" fill="none"/>
      </g>`;
    },
  };

  // ------------------------------------------------------------- helpers
  function shade(hex, amt){
    const n = parseInt(hex.slice(1),16);
    const r = Math.max(0,Math.min(255,(n>>16)+amt)), g=Math.max(0,Math.min(255,((n>>8)&255)+amt)), b=Math.max(0,Math.min(255,(n&255)+amt));
    return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
  }
  function mix(hexA, hexB, t){
    const a=parseInt(hexA.slice(1),16), b=parseInt(hexB.slice(1),16);
    const ch=(sa,sb)=>Math.round(sa+(sb-sa)*t);
    const r=ch(a>>16,b>>16), g=ch((a>>8)&255,(b>>8)&255), bl=ch(a&255,b&255);
    return '#'+((r<<16)|(g<<8)|bl).toString(16).padStart(6,'0');
  }

  return { arena, creature, boxArt, fragments, silhouette, selectorBracket, rosterPip,
           auric, fx, shade, mix };
})();

</script>
<script>
/* ---- js/registry.js ---- */
/* Boxlings Battle — the Registry. Every open banks something, permanently.
   Nothing in here can read or touch a drop table, a band, or a terminal rung
   decision — it only records what already happened. */
window.BB = window.BB || {};
BB.registry = (() => {
  const KEY = 'bb-registry-v1';

  function blank(){
    return {
      opens: 0, spend: 0, returned: 0,
      stamps: {},                 // "species@rungLabel" -> count
      witness: { stormFront:0, auricTrace:0, goldMeteor:0, vaultSeen:0 },
      badges: {},                 // id -> timestamp
      packKey: null,              // the pack the current streak is running
      packStreak: 0,
      recentGags: [],             // anti-repeat window (cosmetic context only)
      bestPull: null,
      log: [],                    // last 40 receipts
    };
  }

  let data = blank();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) data = Object.assign(blank(), JSON.parse(raw));
  } catch(e){ /* fresh */ }

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} };

  function terminalLabel(plan){
    if (plan.vaultWin) return 'the Vault, taken';
    if (plan.vaultLoss) return 'the Vault, denied';
    return 'rung ' + plan.terminal;
  }

  /* Bank one open. Returns the lines to print on the receipt. */
  function bank(plan, choices){
    const lines = [];
    data.opens++; data.spend += BB.config.box.price; data.returned += plan.item.value;

    // Odyssey stamp: lead species × where the run ended.
    const sp = plan.packSnapshot.members[0].speciesId;
    const stampKey = `${sp}@${terminalLabel(plan)}`;
    data.stamps[stampKey] = (data.stamps[stampKey]||0) + 1;
    lines.push(data.stamps[stampKey] === 1
      ? `NEW Odyssey stamp: ${BB.config.species.find(s=>s.id===sp).name} — ${terminalLabel(plan)}`
      : `Odyssey stamp ×${data.stamps[stampKey]}: ${terminalLabel(plan)}`);

    // Witness cards.
    for (const o of (choices.omensSeen||[])){
      data.witness[o]++;
      if (data.witness[o] === 1) lines.push(`NEW Witness card: ${BB.config.omens[o]?.name || o}`);
    }
    if (plan.terminal === plan.height){
      data.witness.vaultSeen++;
      grant('witness', lines);
    }

    /* Path badges. With the doors gone there are no in-run decisions left, so
       these now judge the one choice that remains — the packing — plus what
       the player actually witnessed. Still never the prize. */
    if (data.opens === 1) grant('first-open', lines);

    // Thresholds are relative to the ladder so a short ladder cannot make a
    // badge unearnable: a 3-rung run has exactly one battle to face.
    const H = plan.height || 10;
    const apexNeeded = Math.max(1, Math.min(3, H - 2));
    if ((choices.apexFaced || 0) >= apexNeeded) grant('apex-faced', lines);
    if ((choices.charmSaves || 0) >= 1) grant('charm-saved', lines);

    const members = plan.packSnapshot.members;
    const els = new Set(members.map(m => BB.config.species.find(s => s.id === m.speciesId).el));
    if (els.size <= 2 && plan.terminal > Math.ceil(H / 2)) grant('mono-climb', lines);

    const packKey = members.map(m => m.speciesId + '.' + m.colorway).join('-');
    if (data.packKey === packKey) data.packStreak++;
    else { data.packKey = packKey; data.packStreak = 1; }
    if (data.packStreak >= 10) grant('loyalist', lines);

    // Anti-repeat gag window (last 3).
    if (!plan.openerContinue){
      data.recentGags = [plan.gag].concat(data.recentGags).slice(0,3);
    }
    if (!data.bestPull || plan.item.value > data.bestPull.value)
      data.bestPull = { name: plan.item.name, value: plan.item.value };

    data.log.unshift({
      when: Date.now(), item: plan.item.name, value: plan.item.value,
      ended: terminalLabel(plan), demo: plan.demo,
    });
    data.log = data.log.slice(0, 40);
    save();
    return lines;
  }

  function grant(id, lines){
    if (!data.badges[id]){
      data.badges[id] = Date.now();
      const b = BB.config.badges.find(x=>x.id===id);
      if (b && lines) lines.push(`NEW Path badge: ${b.name}`);
    }
  }

  return {
    get data(){ return data; },
    bank,
    recentGags: () => data.recentGags.slice(),
    reset(){ data = blank(); save(); },
  };
})();

</script>
<script>
/* ---- js/planner.js ---- */
/* Boxlings Battle — run planner (reverse authoring).
   Given a seal, authors the whole run backward from the fixed ending.
   Pure and synchronous: same seal -> byte-identical plan, every time.

   Stream discipline (pillar 3):
   - outcome: the draw and the terminal rung. Touches nothing visual.
   - script:  battle choreography. May know the terminal rung (it must), but
              win-battle composition mixes favorable/neutral/counter elements
              so a rung's SETUP never reveals whether it is the fall.
   - tells:   Parade + omens, at published rates only.
   - cosmetic: names, skins, gag picks. Receives height context only. */
window.BB = window.BB || {};
BB.planner = (() => {
  const F = BB.fair, C = BB.config;

  const beats = el => C.elements[el].beats;
  const beatenBy = el => Object.keys(C.elements).find(k => C.elements[k].beats === el);

  function drawItem(rng, forcedBand){
    let pool = C.box.dropTable;
    if (forcedBand != null){
      const b = C.bands[forcedBand];
      pool = pool.filter(it => {
        const m = it.value / C.box.price;
        return m >= b.range[0] && m < b.range[1];
      });
    }
    return F.weighted(rng, pool);
  }
  const bandOf = mult => C.bands.find(b => mult >= b.range[0] && mult < b.range[1]);

  /* Pick the rival's element for a battle.
     PILLAR 3: drawn with NO reference to whether this rung is the fall. An
     earlier build countered the lead on every loss, which let a player read
     "double damage against me" as "I fall here" — naming their band earlier
     than height allows. Element is now pure flavour; the fall is delivered by
     the script (grade, HP, the burn countdown, the deep-red finish) instead.
     Immunity is never routed in either direction. */
  function rivalElementFor(leadEl, rng){
    const everyday = ['ember','bramble','volt','frost'];
    const legal = everyday.filter(el =>
      !(leadEl === C.immunity.attacker && el === C.immunity.defender) &&   // player swing immune: never
      !(el === C.immunity.attacker && leadEl === C.immunity.defender));    // rival swing immune: never
    return F.pick(rng, legal);
  }

  function speciesForElement(el, rng){
    const opts = C.species.filter(s => s.el === el).map(s => s.id);
    return opts.length ? F.pick(rng, opts) : F.pick(rng, C.rivalSpecies);
  }

  /* Author one battle. Mutates hp/alive state. */
  function scriptBattle(rung, isLoss, st, S, opts={}){
    // Grade comes from the Parade roster, which is a published tell. It is
    // NOT upgraded on the fall: an earlier build promoted rung-6 losses to
    // apex, which made "apex at rung 6" mean "I fall here".
    const gradeKey = opts.grade || C.gradeForRung(rung);
    const aliveIdx = st.alive.map((a,i)=>a?i:null).filter(i=>i!==null);
    const leadIndex = aliveIdx[(rung - 1) % aliveIdx.length];
    const lead = st.pack.members[leadIndex];
    const leadEl = C.species.find(s=>s.id===lead.speciesId).el;

    /* THE CHALLENGER SELECT — replaces the door.
       A slate of candidates of this rung's grade. Which one steps forward is
       the reveal. The grade was already public from the roster, and every
       candidate is the same grade, so the slate carries no new information:
       the sweep is theatre over a landing that was fixed at the seal. */
    const slateSize = gradeKey === 'apex' ? 5 : gradeKey === 'pro' ? 4 : 3;
    const pool = C.rivals[gradeKey].names;
    const seen = new Set();
    const candidates = [];
    for (let i = 0; i < slateSize; i++){
      const el = rivalElementFor(leadEl, S.cosmetic);
      let name = F.pick(S.cosmetic, pool), guard = 0;
      while (seen.has(name) && guard++ < 10) name = F.pick(S.cosmetic, pool);
      seen.add(name);
      candidates.push({ name, el, grade: gradeKey, speciesId: speciesForElement(el, S.cosmetic) });
    }
    const chosenIndex = Math.floor(S.cosmetic() * candidates.length);
    const chosen = candidates[chosenIndex];
    const select = { candidates, chosenIndex, grade: gradeKey };

    const rEl = chosen.el;
    const effP = C.effectiveness(leadEl, rEl);     // player's swing
    const effR = C.effectiveness(rEl, leadEl);     // rival's swing
    const events = [];
    const moveset = C.moves[leadEl], rivalMoves = C.moves[rEl];

    // Player hit sizes: honest printed ranges must contain what lands.
    const loP = Math.round(14*effP), hiP = Math.round(28*effP);

    /* Rival HP is derived from the matchup so the number of exchanges is a
       function of HEIGHT ALONE. A flat HP pool would make a half-damage
       matchup take three times as many turns, and battle length would then
       leak the matchup — and, through it, the pacing of the run. */
    const wantHits = rung <= 4 ? 2 : rung <= 7 ? 3 : 4;
    const avgP = (loP + hiP) / 2;
    const rivalHp = Math.max(24, Math.round(avgP * wantHits) + F.rint(S.script, -5, 5));
    const rival = { name: chosen.name, grade: gradeKey, el: rEl,
                    speciesId: chosen.speciesId, hp: rivalHp };
    function playerHit(dmg, rivalLeft, finish){
      dmg = Math.max(loP, Math.min(hiP, dmg));
      const mv = dmg > Math.round(20*effP) ? moveset[1] : moveset[0];
      events.push({ t:'pHit', who: st.currentLead, move: mv.name, eff: effP, dmg,
                    range:[Math.round(mv.base[0]*effP), Math.round(mv.base[1]*effP)],
                    rivalHpAfter: rivalLeft, finish: !!finish });
    }
    function rivalHit(dmg, opt={}){
      const idx = st.currentLead;
      let hp = st.hp[idx] - dmg;
      let charm = false, ko = false;
      if (hp <= 0){
        if (opt.allowCharm && idx === st.pack.charmIndex && !st.charmUsed){
          st.charmUsed = true; charm = true; hp = 1;
        } else { ko = true; hp = 0; st.alive[idx] = false; }
      }
      st.hp[idx] = hp;
      events.push({ t:'rHit', target: idx, move: F.pick(S.script, rivalMoves).name,
                    eff: effR, dmg, leadHpAfter: hp, ko, charm, heavy: dmg >= 22 });
      return { ko, charm };
    }

    st.currentLead = leadIndex;

    if (!isLoss){
      // A win: 2-4 exchanges, rival driven to zero, wear scaled by height.
      const minHits = Math.ceil(rivalHp / hiP), maxHits = Math.floor(rivalHp / Math.max(1,loP));
      const nHits = Math.max(minHits, Math.min(wantHits, Math.max(minHits, maxHits)));
      let left = rivalHp;
      const wearPerHit = effR >= 2 ? F.rint(S.script, 16, 24)
                       : rung <= 3 ? F.rint(S.script, 8, 14)
                       : rung <= 6 ? F.rint(S.script, 12, 18) : F.rint(S.script, 14, 22);

      const benchFaint = opts.benchFaintHere; // scripted bench sacrifice on a WIN
      for (let i = 0; i < nHits; i++){
        const hitsLeft = nHits - i;
        let dmg = i === nHits-1 ? left : Math.round(left/hitsLeft) + F.rint(S.script, -3, 3);
        dmg = Math.max(loP, Math.min(hiP, Math.min(dmg, left)));
        if (hitsLeft === 1) dmg = Math.min(left, hiP);
        left = Math.max(0, left - dmg);
        playerHit(dmg, left, left === 0);
        if (left === 0) break;
        // rival answers
        if (benchFaint && i === nHits - 2){
          const idx = st.currentLead;
          const kill = st.hp[idx];
          const r = rivalHit(kill + F.rint(S.script, 2, 6), { allowCharm: opts.charmOk });
          if (r.ko){
            const next = st.alive.map((a,j)=>a?j:null).filter(j=>j!==null)[0];
            st.currentLead = next;
            events.push({ t:'swap', toIndex: next });
          }
        } else {
          const safe = Math.min(wearPerHit, Math.max(0, st.hp[st.currentLead] - 6));
          if (safe > 3) rivalHit(safe);
        }
        // flavour status on the rival, never decisive
        if (S.script() < 0.25 && i === 0 && left > 0)
          events.push({ t:'status', side:'rival', kind: S.script() < 0.5 ? 'chill' : 'stun' });
      }
      if (left > 0){ // safety: land the finisher regardless
        playerHit(Math.min(left, hiP), 0, true);
      }
      return { rung, grade: gradeKey, boxGrade: C.boxGradeForRung(rung), rival, select,
               leadIndex, win: true, events };
    }

    // The fall. Rival driven deep into the red before the last Boxling goes down.
    const deepRed = Math.max(6, Math.round(rivalHp * (0.08 + S.script() * 0.10)));
    let left = rivalHp;
    const pHits = 2 + (rung >= 5 ? 1 : 0);
    const toDeal = rivalHp - deepRed;
    events.push({ t:'status', side:'player', kind:'burn' }); // the visible countdown
    for (let i = 0; i < pHits; i++){
      let dmg = Math.round(toDeal / pHits) + F.rint(S.script, -3, 3);
      dmg = Math.max(loP, Math.min(hiP, dmg));
      left = Math.max(deepRed, left - dmg);
      playerHit(dmg, left, false);
      // burn ticks only while the lead is comfortably alive — a status never ends the run
      if (st.hp[st.currentLead] > 34){
        st.hp[st.currentLead] -= F.rint(S.script, 4, 6);
        events.push({ t:'burnTick', target: st.currentLead, hpAfter: st.hp[st.currentLead] });
      }
      const heavy = F.rint(S.script, 20, 30);
      if (st.hp[st.currentLead] - heavy > 8 || i < pHits - 1){
        rivalHit(Math.min(heavy, Math.max(4, st.hp[st.currentLead] - 8)));
      }
    }
    // The cascade: remaining creatures fall to direct blows. Charm may buy one swing.
    let guard = 0;
    while (st.alive.some(a=>a) && guard++ < 10){
      const idx = st.currentLead;
      const kill = st.hp[idx] + F.rint(S.script, 2, 8);
      const r = rivalHit(kill, { allowCharm: true });
      if (r.charm){
        left = Math.max(4, left - F.rint(S.script, 8, Math.max(9, Math.round(hiP*0.7))));
        playerHit(Math.max(loP, Math.min(hiP, F.rint(S.script, loP, hiP))), left, false);
        continue;
      }
      if (r.ko){
        const alive = st.alive.map((a,j)=>a?j:null).filter(j=>j!==null);
        if (rung <= 3 || alive.length === 0) break;   // early rungs: the run ends on the lead
        st.currentLead = alive[0];
        events.push({ t:'swap', toIndex: alive[0] });
      }
    }
    return { rung, grade: gradeKey, boxGrade: C.boxGradeForRung(rung), rival, select,
             leadIndex, win: false, events, deepRedLeft: left };
  }

  // ------------------------------------------------------------- the plan
  function planRun({ serverSeed, clientSeed, openIndex, pack, forcedBand = null, recentGags = [] }){
    const seal = F.makeSeal(serverSeed, clientSeed, openIndex);
    const S = {
      outcome:  F.stream(seal, 'outcome'),
      script:   F.stream(seal, 'script'),
      tells:    F.stream(seal, 'tells'),
      cosmetic: F.stream(seal, 'cosmetic'),
    };

    const H = C.ladder().height;
    const item = drawItem(S.outcome, forcedBand);
    const mult = item.value / C.box.price;
    const band = bandOf(mult);
    // The item is already drawn; only its dramatisation depends on the ladder.
    const termPick = F.weighted(S.outcome, C.bandRungs(band.i));
    const terminal = termPick.r;
    const vaultWin = !!termPick.vaultWin;
    const vaultLoss = terminal === H && !vaultWin;
    const group = C.bandGroup(band.i);

    /* THE PARADE — dealt after the seal, and now a persistent roster rather
       than a one-second flash, because it is the spine of the anticipation:
       the player watches it deplete for the whole climb.
       Baseline grade is a pure function of height. The tell is how many APEX
       challengers appear EARLY (rungs 3-6) — the anomaly a player can
       actually spot — and that count correlates with band at the published
       rates shown in the setup panel. */
    const w = C.paradeApexWeights[group];
    const drawn = F.weighted(S.tells, w.map((weight,i)=>({weight, n:i}))).n;
    const paradeGrades = [];
    for (let r = 2; r <= H - 1; r++) paradeGrades.push(C.gradeForRung(r));
    const slots = C.ladder().earlySlots.filter(i => i < paradeGrades.length).slice();
    // A short ladder has fewer slots than the weights can name, so the tell
    // saturates rather than overflowing; it stays monotonic either way.
    const earlyApex = Math.min(drawn, slots.length);
    let ups = earlyApex;
    while (ups > 0 && slots.length){
      const k = Math.floor(S.tells() * slots.length);
      paradeGrades[slots[k]] = 'apex';
      slots.splice(k, 1);
      ups--;
    }
    const apexCount = paradeGrades.filter(g => g === 'apex').length;

    // Omens: fire at published rates; timing drawn blind to run length.
    const omens = [];
    const om = C.omens;
    if (S.tells() < om.stormFront.rates[group])
      omens.push({ id:'stormFront', beforeRung: F.rint(S.tells, ...om.stormFront.window) });
    if (S.tells() < om.auricTrace.rates[group])
      omens.push({ id:'auricTrace', beforeRung: F.rint(S.tells, ...om.auricTrace.window) });
    const goldMeteor = vaultWin && S.tells() < om.goldMeteor.rates.grailOnly;

    // The floor gag (cosmetic; the anti-repeat window is height-legal context).
    const gagPool = C.gags.filter(g => g.charterApproved && !recentGags.includes(g.id));
    const gag = F.pick(S.cosmetic, gagPool.length ? gagPool : C.gags).id;

    // Opener rival (cosmetic skin over a structural scrappy).
    const openerRival = {
      name: F.pick(S.cosmetic, C.rivals.scrappy.names),
      speciesId: F.pick(S.cosmetic, C.rivalSpecies),
    };

    // Battles.
    const st = {
      pack,
      hp: pack.members.map(()=>100),
      alive: pack.members.map(()=>true),
      charmUsed: false,
      currentLead: 0,
    };
    const battles = [];
    if (terminal >= 2){
      const lastBattleRung = Math.min(terminal, H - 1);
      // The bench is eaten mid-climb, but only on ladders long enough to have
      // a mid-climb; a 3-rung run reaches the Vault with the pack intact.
      const benchAt = terminal >= 5 ? Math.max(2, Math.floor(terminal * 0.6)) : -1;
      for (let r = 2; r <= lastBattleRung; r++){
        const isLoss = (r === terminal);                    // the top rung is the Vault
        const benchFaintHere = (r === benchAt);
        battles.push(scriptBattle(r, isLoss, st, S, {
          grade: paradeGrades[r - 2],   // the roster IS the schedule of grades
          benchFaintHere,
          charmOk: !vaultWin,           // the grail keeps the Charm for the Auric
        }));
      }
    }

    // The Vault.
    let vault = null;
    if (terminal === H){
      const aliveIdx = st.alive.map((a,i)=>a?i:null).filter(i=>i!==null);
      vault = {
        crack: vaultWin ? 'gold' : 'red',
        goldMeteor,
        witnessIndex: aliveIdx[0] ?? 0,
        auric: null,
      };
      if (vaultWin){
        const front = aliveIdx[0] ?? 0;
        const nextIdx = aliveIdx[1] ?? front;
        const charmSave = (nextIdx === pack.charmIndex && !st.charmUsed);
        vault.auric = {
          hp: 160,
          frontIndex: front,
          nextIndex: nextIdx,
          // the next survivor either lives on the Charm at 1 HP,
          // or the Auric's finishing blow falls a point short
          save: charmSave ? 'charm' : 'short',
        };
      }
    }

    return {
      demo: forcedBand != null,
      height: H,
      seal, serverSeed, clientSeed, openIndex,
      item, mult, band: band.i, bandGroup: group,
      terminal, vaultWin, vaultLoss,
      openerContinue: terminal >= 2,
      openerRival, gag,
      parade: { grades: paradeGrades, apexCount, earlyApex },
      omens, battles, vault,
      packSnapshot: JSON.parse(JSON.stringify(pack)),
    };
  }

  return { planRun };
})();

</script>
<script>
/* ---- js/present.js ---- */
/* Boxlings Battle — presentation. A player for the RunPlan.
   Law of the layer: it may READ the plan, never write it. */
window.BB = window.BB || {};
BB.present = (() => {
  const C = BB.config, A = BB.art;

  const PX = 290, RX = 668, GY = 442;      // player x, rival x, ground y
  const st = { turbo:false, skipping:false, preset:C.timingPresets[1], stage:null, hud:null, actors:{}, tapResolve:null, result:null };

  // ------------------------------------------------------------- utilities
  const q  = sel => st.stage.querySelector(sel);
  function svgNode(str){
    const t = document.createElementNS('http://www.w3.org/2000/svg','svg');
    t.innerHTML = str;
    return t.firstElementChild;
  }
  function addActor(layer, str, x, y, flip=false){
    const n = svgNode(str);
    q(layer).appendChild(n);
    n.style.transform = `translate(${x}px, ${y}px)` + (flip ? ' scaleX(-1)' : '');
    return n;
  }
  const animEl = n => n.querySelector(':scope > .anim') || n;
  function scale(ms, widen=1){
    if (st.skipping) return 1;
    return Math.max(1, ms * widen * (st.turbo ? 0.22 : 1));
  }
  const wait = ms => st.skipping ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
  function anim(node, frames, ms, opts={}){
    if (st.skipping){ try { node.animate(frames, { duration:1, fill: opts.fill || 'forwards' }); } catch(e){} return Promise.resolve(); }
    const a = node.animate(frames, Object.assign({ duration: Math.max(1, ms), fill:'forwards', easing:'ease-out' }, opts));
    // Race a timer: if the tab is hidden the compositor stops and `finished`
    // would never resolve — a run must always be able to complete.
    return Promise.race([
      a.finished.catch(()=>{}),
      new Promise(r => setTimeout(() => { try { if (a.playState === 'running') a.finish(); } catch(e){} r(); }, Math.max(1, ms) + 260)),
    ]);
  }
  const setEx = (cre, ex) => cre && cre.setAttribute('data-ex', ex);
  function clearLayer(sel){ const l = q(sel); while(l.firstChild) l.removeChild(l.firstChild); }
  function removeActor(name){ const a = st.actors[name]; if (a){ a.remove(); delete st.actors[name]; } }
  function shake(px=6, ms=220){
    const svg = q('#arenaSvg');
    return anim(svg, [
      { transform:'translate(0,0)' }, { transform:`translate(${px}px,${-px/2}px)` },
      { transform:`translate(${-px}px,${px/2}px)` }, { transform:'translate(0,0)' }
    ], scale(ms), { fill:'none' });
  }
  function fxAt(str, x, y, life=700){
    const n = addActor('#fxLayer', `<g class="pos"><g class="anim">${str}</g></g>`, x, y);
    if (life) setTimeout(()=>n.remove(), Math.max(life, scale(life)) + 400);
    return n;
  }
  function popupDmg(x, y, text, klass){
    const wrap = st.hud.fxHtml;
    const r = st.stage.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'dmgPop ' + (klass||'');
    d.textContent = text;
    d.style.left = (x / 960 * r.width) + 'px';
    d.style.top  = (y / 540 * r.height) + 'px';
    wrap.appendChild(d);
    setTimeout(()=>d.remove(), 1100);
  }
  function banner(text, klass='', hold=1100){
    const b = st.hud.banner;
    b.textContent = text;
    b.className = 'shown ' + klass;
    setTimeout(()=>{ b.className=''; }, Math.max(500, scale(hold)));
  }

  // stakes line + tap
  function stakes(text){ st.hud.stakes.textContent = text || ''; }
  function hideTap(){ st.hud.action.classList.remove('shown','gold'); st.tapResolve = null; }
  function offerTap(label, { mandatory=false, timeout=2200, gold=false } = {}){
    if (st.skipping || (st.turbo && !mandatory)) return Promise.resolve({tapped:false});
    const btn = st.hud.action;
    btn.textContent = label;
    btn.classList.add('shown');
    btn.classList.toggle('gold', gold);
    return new Promise(res => {
      let done = false;
      const finish = tapped => { if (done) return; done = true; hideTap(); res({tapped}); };
      st.tapResolve = () => finish(true);          // click handler fires this: <100ms by construction
      if (!mandatory) setTimeout(()=>finish(false), scale(timeout));
      else if (st.turbo) setTimeout(()=>finish(true), 350);
    });
  }

  // ------------------------------------------------------------------ HUD
  function buildLadder(){
    const l = st.hud.ladder; l.innerHTML = '';
    const H = C.ladder().height;
    for (let r = H; r >= 1; r--){
      const d = document.createElement('div');
      d.className = 'rung g-' + C.boxGradeForRung(r);
      d.dataset.rung = r;
      d.innerHTML = `<span class="rn">${r === H ? 'V' : r}</span>`;
      l.appendChild(d);
    }
  }
  function ladderMark(r, cls){
    const el = st.hud.ladder.querySelector(`[data-rung="${r}"]`);
    if (el){ el.classList.remove('current'); el.classList.add(cls); }
  }
  function ladderCurrent(r){
    st.hud.ladder.querySelectorAll('.rung').forEach(e=>e.classList.remove('current'));
    const el = st.hud.ladder.querySelector(`[data-rung="${r}"]`);
    if (el) el.classList.add('current');
  }
  function buildTeam(pack){
    const t = st.hud.team; t.innerHTML = '';
    pack.members.forEach((m, i) => {
      const sp = C.species.find(s=>s.id===m.speciesId);
      const cw = C.colorways.find(c=>c.id===m.colorway) || C.colorways[0];
      const d = document.createElement('div');
      d.className = 'chip';
      d.dataset.idx = i;
      d.innerHTML = `<span class="dot" style="background:${cw.body};box-shadow:0 0 0 2px ${C.elements[sp.el].color} inset"></span>
        <span class="cname">${sp.name}${i===pack.charmIndex?' <span class="charm">◈</span>':''}</span>
        <span class="hpbar"><span class="hpfill" style="width:100%"></span></span>`;
      t.appendChild(d);
    });
  }
  function teamHp(idx, hp, ko){
    const chip = st.hud.team.querySelector(`[data-idx="${idx}"]`);
    if (!chip) return;
    chip.querySelector('.hpfill').style.width = Math.max(0,hp) + '%';
    chip.querySelector('.hpfill').classList.toggle('low', hp <= 30);
    chip.classList.toggle('ko', !!ko);
  }
  /* THE ROSTER — the Parade made persistent instead of a one-second flash.
     This is the long arc of the anticipation: the apexes waiting up the
     ladder are visible from the first second, and the line visibly depletes
     as the player climbs. It shows grades only, which are already published
     (height baseline + the Parade's published early-apex correlation). */
  function buildRoster(plan){
    const r = st.hud.roster;
    if (!r) return;
    r.innerHTML = plan.parade.grades.map((g, i) =>
      `<span class="pip g-${g}" data-rung="${i + 2}" title="Rung ${i + 2} · ${C.rivals[g].label}">${A.rosterPip(g)}</span>`
    ).join('') + `<span class="pip g-keeper" data-rung="${C.ladder().height}" title="The Vault">◈</span>`;
  }
  function rosterMark(rung, cls){
    const r = st.hud.roster;
    if (!r) return;
    if (cls === 'current') r.querySelectorAll('.pip').forEach(x => x.classList.remove('current'));
    const p = r.querySelector(`.pip[data-rung="${rung}"]`);
    if (!p) return;
    if (cls !== 'current') p.classList.remove('current');
    p.classList.add(cls);
  }

  function rivalBar(show, name, grade, hpPct){
    const rb = st.hud.rival;
    rb.classList.toggle('shown', show);
    if (name != null) rb.querySelector('.rname').textContent = name + (grade ? ` · ${C.rivals[grade].label.toUpperCase()}` : '');
    if (hpPct != null){
      const f = rb.querySelector('.rhpfill');
      f.style.width = Math.max(0, hpPct*100) + '%';
      f.classList.toggle('deep', hpPct <= 0.2);
    }
  }
  function dim(opacity, ms=600){ return anim(q('#dimmer'), [{opacity: q('#dimmer').getAttribute('opacity')||0},{opacity}], scale(ms)).then(()=>q('#dimmer').setAttribute('opacity', opacity)); }

  // ---------------------------------------------------------------- mount
  function mount(stageEl, hudRefs){
    st.stage = stageEl; st.hud = hudRefs;
    stageEl.innerHTML = A.arena();
    hudRefs.action.addEventListener('click', () => { if (st.tapResolve) st.tapResolve(); });
  }

  // --------------------------------------------------------------- scenes
  async function sceneParade(plan, ms){
    const grades = plan.parade.grades;
    let inner = '';
    grades.forEach((g, i) => { inner += `<g transform="translate(${i*112} 0)">${A.silhouette(g)}</g>`; });
    const strip = addActor('#farLayer', `<g class="pos"><g class="anim">${inner}</g></g>`, 990, 330);
    banner('THE OPPOSITION', 'sub', ms);
    await anim(animEl(strip), [
      { transform:'translateX(0px)' }, { transform:`translateX(${-(990 + grades.length*112)}px)` }
    ], scale(ms), { easing:'cubic-bezier(.2,.5,.4,1)' });
    strip.remove();
  }

  async function sceneOpener(plan){
    const t = st.preset.opener;
    const lossW = plan.openerContinue ? 1 : C.lossDelta;
    clearLayer('#actorLayer'); clearLayer('#fxLayer');
    rivalBar(false);

    // the drop
    const box = addActor('#actorLayer', A.boxArt('cardboard'), PX, GY - 240);
    st.actors.playerBox = box;
    await anim(box, [{ transform:`translate(${PX}px, ${GY-240}px)` }, { transform:`translate(${PX}px, ${GY}px)` }],
      scale(t.drop, lossW), { easing:'cubic-bezier(.5,0,.9,.6)', fill:'forwards' });
    box.style.transform = `translate(${PX}px, ${GY}px)`;
    fxAt(A.fx.dustRing(), PX, GY+4);
    const dr = q('.fxDust'); if (dr) anim(dr, [{transform:'scale(0.4)', opacity:1},{transform:'scale(3.2)', opacity:0}], scale(420));
    shake(7, 200);
    anim(animEl(box), [{transform:'scaleY(0.86) translateY(6px)'},{transform:'scaleY(1) translateY(0)'}], scale(200));

    // the parade flashes past while the box settles
    await sceneParade(plan, t.parade * lossW);

    // the rival coils — the clench, staged to read with the sound off
    const rival = addActor('#actorLayer', A.creature(plan.openerRival.speciesId, {tint:'#8a97ad'}), RX, GY, true);
    st.actors.rival = rival;
    setEx(rival, 'fierce');
    await anim(animEl(rival), [
      { transform:'translateX(0) rotate(0deg) scale(1)' },
      { transform:'translateX(26px) rotate(-7deg) scale(0.94, 1.05)' },
      { transform:'translateX(30px) rotate(-8deg) scale(0.92, 1.06)' },
    ], scale(t.windup, lossW), { easing:'cubic-bezier(.6,0,.8,1)' });

    // the strike + hit-stop
    await anim(animEl(rival), [
      { transform:'translateX(30px) rotate(-8deg)' },
      { transform:`translateX(${PX-RX+120}px) rotate(6deg)` },
    ], scale(t.hitstop * 0.45), { easing:'cubic-bezier(.2,0,.4,1)' });
    fxAt(A.fx.impact(), PX+44, GY-46, 900);
    shake(9, 180);
    await wait(scale(t.hitstop * 0.55));                       // the frozen beat
    anim(animEl(rival), [{ transform:`translateX(${PX-RX+120}px)` }, { transform:'translateX(0)' }], scale(260));

    // the branch
    if (plan.openerContinue){
      await branchContinue(plan, t.branch);
      stakes('');
      await wait(scale(t.settle));
      return true;
    } else {
      await playGag(plan.gag, t.branch * C.lossDelta, rival);
      await wait(scale(t.settle * C.lossDelta));
      return false;
    }
  }

  async function branchContinue(plan, ms){
    const box = st.actors.playerBox;
    const frags = addActor('#fxLayer', A.fragments(), PX, GY);
    box.remove();
    frags.querySelectorAll('.frag').forEach((f, i) => {
      const dx = (i%2 ? 1 : -1) * (30 + i*14), dy = -50 - (i*13)%70;
      anim(f, [
        { transform:'translate(0,0) rotate(0deg)', opacity:1 },
        { transform:`translate(${dx}px, ${dy}px) rotate(${dx*3}deg)`, opacity:0.9, offset:0.55 },
        { transform:`translate(${dx*1.5}px, ${dy*0.2+70}px) rotate(${dx*5}deg)`, opacity:0 },
      ], scale(ms*0.9), { easing:'cubic-bezier(.2,.6,.5,1)' });
    });
    const m = plan.packSnapshot.members[0];
    const cw = C.colorways.find(c=>c.id===m.colorway) || C.colorways[0];
    const cre = addActor('#actorLayer', A.creature(m.speciesId, {tint: cw.body, charm: plan.packSnapshot.charmIndex===0}), PX, GY);
    st.actors.player = cre;
    setEx(cre, 'fierce');
    banner('IT SWINGS', 'good', 900);
    // out through the fragments, swinging
    await anim(animEl(cre), [
      { transform:'translateX(0) scale(0.6)', opacity:0 },
      { transform:`translateX(${RX-PX-140}px) scale(1.06)`, opacity:1, offset:0.6 },
      { transform:`translateX(${RX-PX-150}px) scale(1)` },
    ], scale(ms*0.62), { easing:'cubic-bezier(.3,0,.4,1)' });
    fxAt(A.fx.impact(), RX-84, GY-52, 700);
    shake(7, 180);
    const rival = st.actors.rival;
    if (rival){
      setEx(rival, 'worried');
      anim(animEl(rival), [{ transform:'translateX(0)' }, { transform:'translateX(46px) rotate(9deg)' }], scale(240));
    }
    await anim(animEl(cre), [
      { transform:`translateX(${RX-PX-150}px)` }, { transform:'translateX(0)' }
    ], scale(ms*0.3), { easing:'ease-in-out' });
    removeActor('rival');
  }

  // ------------------------------------------------------------- the gags
  async function playGag(gagId, ms, rival){
    const box = st.actors.playerBox;
    banner('BOXED.', 'bad', 1400);
    const T = f => scale(ms * f);

    if (gagId === 'explosion'){
      const frags = addActor('#fxLayer', A.fragments(), PX, GY);
      box.remove();
      frags.querySelectorAll('.frag').forEach((f,i)=>{
        const dx=(i%2?1:-1)*(36+i*16), dy=-60-(i*17)%80;
        anim(f,[{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${dx*4}deg)`,opacity:0.9,offset:0.5},{transform:`translate(${dx*1.4}px,80px) rotate(${dx*6}deg)`,opacity:0}], T(0.9));
      });
      shake(10, 240);
      const cre = addActor('#actorLayer', A.creature(curLeadSpecies(), {tint: curLeadTint()}), PX, GY);
      st.actors.player = cre;
      setEx(cre, 'dizzy');
      // flat on its back, limbs up, stars orbiting — the pause, THEN the flop
      await wait(T(0.22));
      await anim(animEl(cre), [
        { transform:'rotate(0deg) translateY(0)' },
        { transform:'rotate(-80deg) translateY(-6px) translateX(-18px)' },
      ], T(0.35), { easing:'cubic-bezier(.6,0,1,.4)' });
      const stars = fxAt(A.fx.stars(), PX-30, GY-58, 3000);
      anim(animEl(stars), [{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}], scale(1600), {iterations:2, fill:'none'});
    }
    else if (gagId === 'punt'){
      // the whole box sails out of the arena
      await anim(box, [
        { transform:`translate(${PX}px, ${GY}px) rotate(0deg)` },
        { transform:`translate(${PX-260}px, ${GY-220}px) rotate(-200deg)` },
        { transform:`translate(${PX-430}px, ${GY-90}px) rotate(-380deg)`, opacity:0.9 },
      ], T(0.55), { easing:'cubic-bezier(.3,.1,.6,1)' });
      box.remove();
      const puff = fxAt(A.fx.snowPuff(), 66, 402, 2600);
      anim(animEl(puff), [{transform:'scale(0.4)',opacity:0},{transform:'scale(1.4)',opacity:1},{transform:'scale(1.7)',opacity:0.65}], T(0.3));
      await wait(T(0.28));   // the beat
      const paw = fxAt(`<g><rect x="-5" y="-16" width="10" height="18" rx="5" fill="#c9a06b" stroke="#8a6a42" stroke-width="1.6"/><circle cx="0" cy="-18" r="7" fill="#c9a06b" stroke="#8a6a42" stroke-width="1.6"/><circle cx="0" cy="-21" r="2.6" fill="#8a6a42"/></g>`, 66, 398, 2600);
      anim(paw, [{transform:'translate(66px, 430px)'},{transform:'translate(66px, 398px)'}], T(0.2), {easing:'cubic-bezier(.2,1.6,.5,1)'});
    }
    else if (gagId === 'siton'){
      if (rival){
        await anim(animEl(rival), [
          { transform:'translateX(0) translateY(0)' },
          { transform:`translateX(${PX-RX+10}px) translateY(-90px)` , offset:0.55},
          { transform:`translateX(${PX-RX}px) translateY(-56px)` },
        ], T(0.4), { easing:'cubic-bezier(.4,0,.6,1)' });
        setEx(rival, 'happy');
      }
      await anim(animEl(box), [{ transform:'scaleY(1)' }, { transform:'scaleY(0.42) scaleX(1.25)' }], T(0.18), { easing:'cubic-bezier(.7,0,1,.6)' });
      shake(6, 160);
      for (let i=0;i<3;i++){
        const p = fxAt(A.fx.snowPuff(), PX + (i%2? 52:-52), GY-8, 900);
        anim(animEl(p), [{transform:'scale(0.3)',opacity:0.9},{transform:'scale(1)',opacity:0}], T(0.16));
        await anim(animEl(box), [{ transform:'scaleY(0.42) scaleX(1.25) translateX(-4px)' },{ transform:'scaleY(0.42) scaleX(1.25) translateX(4px)' },{ transform:'scaleY(0.42) scaleX(1.25) translateX(0)' }], T(0.14), {fill:'none'});
      }
    }
    else if (gagId === 'peek'){
      const eyes = fxAt(`<g><rect x="-30" y="-6" width="60" height="10" rx="5" fill="#120c07"/><circle cx="-12" cy="-1" r="4.4" fill="#fff"/><circle cx="12" cy="-1" r="4.4" fill="#fff"/><circle cx="-11" cy="-1" r="2" fill="#1c1410"/><circle cx="13" cy="-1" r="2" fill="#1c1410"/></g>`, PX, GY-82, 6000);
      anim(animEl(box), [{transform:'translateY(0)'},{transform:'translateY(-7px)'}], T(0.12));
      await wait(T(0.3));                              // the long look
      eyes.remove();
      await anim(animEl(box), [{transform:'translateY(-7px)'},{transform:'translateY(0)'}], T(0.08));
      const tape = fxAt(`<g><rect x="-34" y="-4" width="68" height="12" rx="3" fill="#e9dcae" stroke="#c9b878" stroke-width="1.6" opacity="0.97"/></g>`, PX, GY-80, 6000);
      await anim(animEl(tape), [{transform:'scaleX(0)',opacity:0},{transform:'scaleX(1)',opacity:1}], T(0.14));
      // the pat-pat
      await anim(animEl(tape), [{transform:'translateY(0)'},{transform:'translateY(3px)'},{transform:'translateY(0)'},{transform:'translateY(3px)'},{transform:'translateY(0)'}], T(0.16), {fill:'none'});
      await wait(T(0.1));
      await anim(animEl(box), [
        { transform:'rotate(0deg)' }, { transform:'rotate(4deg)', offset:0.4 }, { transform:'rotate(-86deg) translateY(-8px)' },
      ], T(0.3), { easing:'cubic-bezier(.6,0,1,.5)' });
      shake(5, 150);
      fxAt(A.fx.snowPuff(), PX-46, GY-4, 1200);
    }
    else { // fright
      const frags = addActor('#fxLayer', A.fragments(), PX, GY);
      box.remove();
      frags.querySelectorAll('.frag').forEach((f,i)=>{
        const dx=(i%2?1:-1)*(28+i*12);
        anim(f,[{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,${-40-(i*11)%50}px) rotate(${dx*3}deg)`,opacity:0}], T(0.5));
      });
      const cre = addActor('#actorLayer', A.creature(curLeadSpecies(), {tint: curLeadTint()}), PX, GY);
      st.actors.player = cre;
      setEx(cre, 'normal');
      await wait(T(0.16));
      setEx(cre, 'worried');
      // the gulp
      await anim(animEl(cre), [{transform:'scaleY(1)'},{transform:'scaleY(0.93) scaleX(1.04)'},{transform:'scaleY(1)'}], T(0.18), {fill:'none'});
      await wait(T(0.2));                              // the held beat — where the laugh lives
