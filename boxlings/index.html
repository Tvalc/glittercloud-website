        { transform:'translate(0,0) rotate(0deg)', opacity:1 },
        { transform:`translate(${dx}px, ${dy}px) rotate(${dx*3}deg)`, opacity:0.9, offset:0.55 },
        { transform:`translate(${dx*1.5}px, ${dy*0.2+70}px) rotate(${dx*5}deg)`, opacity:0 },
      ], Math.max(1, ms * 0.9), { easing:'cubic-bezier(.2,.6,.5,1)' });
    });
    setTimeout(() => frags.remove(), Math.max(1, ms) + 400);
  }

  /* DIMINISHMENT — a body losing its size over a beat, which is how v3.6's
     0.7–0.9 finish ratio is delivered without swapping the rival mid-rung.

     It moves `f.scale` and nothing else. The rig re-derives the transform from
     that number every frame, so writing a CSS transform here would be both
     redundant and wrong — it would be overwritten on the next frame, and worse,
     it would fight the rig for the one channel that owns how big a body reads.
     Position and size are the rig's; this just tells it what to draw. */
  function diminish(f, ratio, ms){
    if (!f) return;
    if (f.scale0 == null) f.scale0 = f.scale;
    const to = f.scale0 * ratio, from = f.scale;
    const live = () => st.fighters.player === f || st.fighters.rival === f;
    if (st.skipping || ms <= 16 || !vfx()){ f.scale = to; bound(f); return; }
    const t0 = performance.now();
    const step = () => {
      if (!live()) return;                       // the body left; stop writing to it
      const k = Math.min(1, (performance.now() - t0) / ms);
      f.scale = from + (to - from) * (k * k * (3 - 2 * k));   // smoothstep
      bound(f);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* ------------------------------------------------------------ THE COMMIT
     Circle -> Tell -> Clash -> Aftermath. One telegraphed, uncancelable,
     decisive attack. The exchange loop this replaced was a metronome: events
     arrived on schedule, none was decisive, and there was nothing to brace
     for. Here the Tell says the answer arrives at the end of this motion. */
  async function playCommit(cm, ms, rungNo){
    const ph = C.commitPlan(cm, ms, st.rate);
    const atk = () => cm.owner === 'player' ? P() : R();
    const def = () => cm.owner === 'player' ? R() : P();
    /* THE PACER, ONE LEVEL DOWN. A commit's phases are ABSOLUTE offsets from
       its own start, not a chain of relative waits — the same discipline the
       scene pacer uses, applied inside the beat. The Tell alone is three waits
       now, and a chain of setTimeouts accumulates a millisecond or two each;
       over a Grail's eight commits that drifts the run past its cap. Here a
       phase that runs late is paid for by the phases after it, down to the
       Aftermath, which is where the slack belongs. */
    const t0 = performance.now();
    const at = off => wait(off - (performance.now() - t0));
    /* Which tier this clash burns IF it is survived. Derived from the
       planner's own fatal table rather than restated, so the board can never
       disagree with it about what a clash proved. -1 = nothing burns here. */
    const burns = C.burnedBySurviving(rungNo, cm.index);
    /* Is this one of the three moments a run can end? Derived from the fatal
       table, like the board's prune schedule and the walkout's stake line, so
       the coil, the ring and the board cannot disagree about what is at stake
       here. It drives the windup's shape, the survival banner and the debris
       on a death — all three of which are the opener, replayed. */
    const killing = C.isKillingCommit(rungNo, cm.index);

    // ---- CIRCLE: continuous motion. Nothing here can end anything.
    if (cm.pre){
      const tw = Math.min(scale(C.poseMs), Math.max(80, ph.circle * 0.5));
      setMom(P(), cm.pre.p, tw); setMom(R(), cm.pre.r, tw);
    }
    /* THE FINISH IS WHERE FAVOURED IS EARNED, and this is the beat it is
       earned in. v3.6 asks a finish commit for a rival at 0.7–0.9 of the
       player — but a rung has one rival and it walked in at 1.25 or 1.45, so
       the small number cannot be a different body without swapping one mid
       fight. It is the SAME body, diminished: over the Circle before the gold,
       the rival visibly shrinks toward `finishRatio` of the frame it arrived
       in, because it has spent the rung being beaten.

       That is what makes FAVOURED honest here rather than a claim. The card
       never promised it; the player watched it happen. And it is band-blind by
       construction — every band that reaches a gold plays the same shrink,
       because a gold lands for every survivor. */
    if (cm.finish) diminish(R(), C.finishRatio, ph.circle);
    /* THE RANGE, TELEGRAPHED A WHOLE PHASE EARLY, and it costs nothing because
       the radius was already breathing. A fighter about to throw something backs
       off to throw it; a fighter about to swing closes. So the Circle before a
       discharge opens the envelope and the Circle before a strike shuts it, and
       by the time the ring appears the distance has already said what kind of
       commit this is.

       It is as band-blind as everything else here: `cm.range` is a function of
       the position in the commit script and of nothing else, so two bands
       arriving at this commit circle at the same distance. And it is a BIAS
       rather than a move — it goes into the same envelope `advance` does and
       clamps against the same walls, so no combination of state and bias can
       push a body out of the ring the fight is held in. */
    st.approach = C.combatRange.approach[C.rangeOf(cm)] || 0;
    await circleFor(ph.circle, cm.seed || 0, rungNo, cm);
    await at(ph.circle);

    /* THE INTERVAL LOG (acceptance test 22). The gap between one Tell and the
       next is the number the metronome test is really about, so it is measured
       at the moment a Tell starts rather than inferred from the schedule — the
       pacer squeezes beats, the stop raids the Aftermath, and what a viewer
       entrains to is what actually happened. */
    if (st.lastTell) st.ivals.push({ rung: rungNo, index: cm.index,
                                     ms: Math.round(performance.now() - st.lastTell) });
    st.lastTell = performance.now();

    /* ---- TELL: THE FREEZE. This is v5's one correction, and it is the whole
       rhythm of the fight — motion, stillness, violence, reset. NOT motion,
       faster motion, collision. Two animals about to commit go still first,
       and the stillness is what frightens; built as an acceleration instead,
       the phase reads as two shapes speeding up at each other, which is a ramp
       with no moment of commitment in it and nothing to brace against.

       If a Tell can be described as "they run at each other," it is wrong. */
    const T = C.tellShape;
    /* The stop and the release are authored as FRAME COUNTS, so they are handed
       to anim() as a duration of exactly that many frames — and anim()'s own
       grid ease then quantizes them to exactly that many steps. Nothing here
       passes an easing of its own: the rig owns the grid, and a hand-written
       steps() would only agree with it by luck. */
    const oneFrame = 1000 / C.stopmo.base / st.rate;
    // 1. THE STOP. Three frames. Hard — not a decelerating ease, a stop.
    /* A killing commit plants over the coil's own frame count — ten frames
       rather than three — because the opener takes ~450ms to reach its clench
       and a three-frame snap into the same pose does not read as the same
       event. Its Tell was extended to hold it (see C.coil.extend), so there is
       still stillness on the far side of the plant: the rhythm is unchanged,
       the deciding is what got its time back. */
    const plantFrames = killing ? C.coil.stopFrames : T.stopFrames;
    const stopMs = Math.max(1, Math.min(ph.tell * (killing ? 0.62 : 0.34), plantFrames * oneFrame));
    const a = atk(), d = def();
    if (cm.tell){
      // the attacker plants; the defender freezes mid-step
      setMom(P(), cm.tell.p, stopMs); setMom(R(), cm.tell.r, stopMs);
    }
    /* FACING IS SETTLED NOW AND STAYS SETTLED until this commit is over. The
       viewer is about to be asked to read one swing; the two bodies may not
       change which way they are pointing while it happens. */
    st.faceLock = true;
    stillness(true);           // dust settles, the idle bob ends, the world hushes
    clearTape();               // never two layers at once
    const ring = showRing(cm.ring, d, ph.tell);
    /* FAVOURED, AND THIS IS THE ONLY PLACE IT IS EVER SHOWN. It used to sit on
       the walkout card, where it was a prediction — and at rung 1 it was a
       prediction the player lost two times in three. It is a statement of the
       present tense now: it appears on the gold, after the rival has been
       driven down and visibly shrunk, on the one commit in the game that lands
       for every survivor. Where FAVOURED appears the player always wins, with
       no exceptions and no upsets, which is what makes it worth showing at all
       and what acceptance test 15 is asking about. */
    if (cm.finish) banner(C.edgeWord.favoured, 'good', Math.max(600, ph.tell + ph.clash));
    board.duck(true);          // the fight owns the Tell and the Clash
    const darken = C.rings[cm.ring] && C.rings[cm.ring].darken;
    /* On a red Tell the edges darkening, the board dimming and the defender's
       QUAKE are ONE cue fired three ways, so they all start on this frame. */
    if (darken) darkenEdges(true, stopMs);
    /* The camera's push-in happens during the stop and is finished by the hold.
       A camera still moving at the moment of impact steals the snap. */
    pushIn(true, stopMs * T.pushShare);
    const arc = flinchOpen(cm, a, d, stopMs);
    /* THE ROLE CUE — who is swinging, said out loud. It starts on the same
       frame as the ring, the darkening and the flinch, because it is the same
       cue fired one more way: the attacker gathers, the defender plants, and
       the two marks are opposites so the pair reads as one relationship. */
    roleCue(cm, a, d, ph.tell);
    if (a){
      /* THE PLANT, stepped: it arrives in three frames and then does not move.
         Two shapes are possible here and the difference is the whole of v3.6's
         EVERY THREAT IS THE OPENER AGAIN.

         On a KILLING commit it is the opener's coil, verbatim — same
         silhouette, same keyframes, same source — so the player recognises the
         event rather than learning it again. It happens at most three times in
         a run, counting the opener.

         Everywhere else it is the ordinary plant: a squash and a step off the
         line, which reads nothing like the coil. Nothing but a killing commit
         is allowed to look like that, or the shape stops meaning anything. */
      anim(animEl(a.node), killing ? C.coilFrames() : [
        { transform:'translateX(0px) scaleY(1)' },
        { transform:'translateX(-30px) scaleY(0.92)' },
      ], stopMs, { fill:'forwards' });
    }
    dustStrand(fx_(d || a), ph.tell);
    await at(ph.circle + stopMs);

    /* 2. THE HOLD. Near-total stillness. The only motion in frame is small and
       involuntary: the flinch's tremor, the ring's pulse, the falling dust.
       3. THE TURN (red and gold only, at 60% through) — the arc flips and the
       ring answers it with one harder pulse, because the ring is reacting to
       the creature and not the other way round. */
    const turnAt = ph.tell * C.flinch.arcTurn;
    if (arc.two && turnAt > stopMs){
      await at(ph.circle + turnAt);
      flinchTurn(arc, a, d, Math.max(60, (ph.tell - turnAt) * 0.55));
      ringPulse(ring);
    }
    await at(ph.circle + ph.tell);

    // ---- CLASH: the release. It lands, or it is survived.
    if (ring) ring.remove();
    /* The charge belongs to the Tell and may not outlive it. `fireDischarge`
       clears it on the way out, so this only ever catches the case where a
       ranged commit reached the Clash with no attacker to fire it — but a core
       left burning on a body through the next commit's freeze is exactly the
       kind of leak the Tell cannot afford, so it is cleared unconditionally. */
    if (st.core && st.core.node){ try { st.core.node.remove(); } catch(e){} st.core = null; }
    stillness(false);
    clearFlinch(a); clearFlinch(d);
    pushIn(false, Math.max(80, ph.after * 0.5));
    if (darken) darkenEdges(false, Math.max(80, ph.after));
    /* THE RUSH. Everything before this was smooth; from here to the end of
       the clash the medium takes over — this is the only window where the
       frame grid, the boil and the smear apply. Circling that stutters looks
       broken; a strike that stutters looks drawn. */
    st.stepped = true;
    if (a){
      const dd = def();
      /* 4. THE RELEASE. Explosive and nearly instantaneous — four frames. If the
         eye can comfortably track it, it is too slow, which is why this is
         stepped and not eased.

         AND IT IS TWO RELEASES NOW, one window. A MELEE attacker does not travel
         across the arena, it ARRIVES: a smear, a snap, a displacement. A RANGED
         attacker does not travel at all — the charge it has been gathering since
         the stop leaves it and crosses the gap on its own, and the body is
         thrown backward off it.

         Both are given the identical window and hand over to the Clash at the
         identical offset inside it (`combatRange.beam.travel`, which IS the
         melee strike's own contact fraction, read by both branches from one
         constant rather than restated twice). The commit's phases, its stop and
         its Aftermath cannot tell which one just happened, so `commitPlan` never
         had to learn about either and no published length moved. */
      const rel = Math.max(1, Math.min(ph.clash * 0.6, T.releaseFrames * oneFrame));
      const contact = rel * C.combatRange.beam.travel;
      if (C.isRanged(cm)) fireDischarge(cm, a, dd, rel, contact);
      else {
        const gap = 66 * a.scale + 76 * (dd ? dd.scale : 1);
        const reach = Math.max(30, (Math.abs(fx_(dd || a) - fx_(a)) - gap) / a.scale);
        /* The release starts from the pose the plant ACTUALLY ended in, which is
           now two different poses. Hard-coding the ordinary plant's -30px here
           would have snapped a killing commit back through its whole coil on the
           first frame of the strike — the body teleporting out of the clench it
           just spent the freeze building. Whatever the windup held, the strike
           leaves from. */
        const from = killing ? C.coilFrames().slice(-1)[0].transform : 'translateX(-30px)';
        anim(animEl(a.node), [
          { transform: from }, { transform:`translateX(${reach.toFixed(0)}px)` },
        ], rel, { fill:'forwards' });
      }
      /* ...and the OTHER half of the release, which never existed. The strike
         used to be a solo: one body crossed the gap and the other stood in
         neutral waiting to be told what had happened to it. Two bodies moving
         in opposite directions is what makes a swing read as an exchange, and
         it is the frame before contact that decides whether the contact is
         legible at all.

         It is unconditional across both modes, and that is the same rule it has
         always obeyed for a different reason: a brace that appeared only on
         commits of one kind would let a viewer read the range off the DEFENDER,
         and the defender is the one body in the frame that is not supposed to
         know what is coming. */
      braceFor(dd, rel * 0.9);
      await at(ph.circle + ph.tell + contact);
    }
    const how = await resolveClash(cm, cm.owner, Math.max(1, ph.clash * 0.65), ph.hold);
    st.stepped = false;                 // the rush is over; movement is smooth again

    /* ---- AFTERMATH: snap to the resulting pose, then hold it.
       The hold is the beat where the viewer reads what just happened. Easing
       straight back into circling gives them nothing to read it in. */
    const dead = cm.fatal ? (cm.owner === 'rival' ? 'p' : 'r') : null;
    const killed = cm.fatal ? 'p' : (cm.finish ? 'r' : null);
    const out = cm.out || {};
    const tw = Math.min(scale(C.poseMs * 1.5), Math.max(80, ph.after * 0.4));
    /* A SURVIVED KILLING COMMIT REWRITES THE OUT-STATES, because the rival
       just missed everything and lost its feet for it. The script's `out` says
       the rival stays DOMINANT after this commit — authored for the case where
       the blow LANDS, which for the band that dies here it does. It cannot
       also describe the case where the rival is face down in the dust.

       Legal because it is a function of the Clash: `cm.dodge` is true only at a
       killing commit that was survived, and the Clash is the one place the
       invariance rule permits two bands to differ at all. Every band that
       survives this commit sees exactly this; every band that dies sees `out`. */
    const missed = !!cm.dodge && cm.owner === 'rival';
    const outP = missed ? 'EVEN'     : out.p;
    const outR = missed ? 'BUCKLING' : out.r;
    if (dead === 'p' || outP) setMom(P(), dead === 'p' ? 'DOWN' : outP, dead === 'p' ? scale(C.poseMs * 2) : tw);
    if (dead === 'r' || outR) setMom(R(), dead === 'r' ? 'DOWN' : outR, dead === 'r' ? scale(C.poseMs * 2) : tw);
    /* THE LOSING IMAGE, if this was a counter pairing. The planner decided
       which one — a function of the LOSER's element, because the image is a
       thing that happens to the loser's material — and set it to null on every
       mirror and neutral, where the ordinary KO plays instead. */
    if (killed && cm.defeat) elementalDefeat(killed === 'p' ? P() : R(), cm.defeat, ph.after);
    /* ...and the other half of "the two outcomes are the two outcomes". A
       killing commit that lands ends the run in the register the box exploding
       established: burst, debris, finality. Same image, same meaning, third
       time of asking. It rides inside the Aftermath that already exists, so it
       costs the run nothing, and it fires under the elemental defeat rather
       than instead of it — the debris is the FINALITY, the melt or the gutter
       is the lesson, and they are answering different questions. */
    if (killing && dead) debris(fx_(dead === 'p' ? P() : R()), ph.after);

    /* THE AFTERMATH IS THE BOARD'S AND THE CELEBRATION'S BEAT, TOGETHER.
       Burns never play during Circle, Tell or Clash — the fight owns those —
       and both of these ride inside a beat that already exists, so neither
       costs the run a millisecond and both caps hold untouched. */
    board.duck(false);
    if (!cm.fatal && burns >= 0) board.burn(burns, ph.after);
    if (!cm.fatal && cm.finish) celebRung(P(), ph.after);

    if (!cm.fatal && cm.owner === 'rival'){
      st.result.nearFinishes++;
      /* THE UPSET, TOLD. The result was sealed long before this frame, so all
         an upset can change is what the moment is called — which is the whole
         of what an upset is. A favourite that only just held gets named as
         one; the outmatched body that slipped a killing blow already said its
         piece at the Clash and does not need a second line over the top. */
      /* THE TWO OUTCOMES ARE THE TWO OUTCOMES. A survived killing commit is
         the box bursting open, replayed: the Boxling comes through swinging,
         and it says so in the same words the opener used. The player learned
         that image in the first three seconds and never has to learn it again.

         Everywhere else keeps its own quieter line, because nothing but a
         killing commit is allowed to borrow the opener's register — that is
         the same rule the coil obeys one phase earlier. */
      if (killing) banner('IT SWINGS', 'good', 900);
      else if (cm.dodge) { /* the dodge spoke for itself */ }
      else if (cm.skinOfTeeth) banner('BY A HAIR', cm.ring === 'red' ? 'gold' : 'sub', 900);
      else banner('IT STAYS UP', cm.ring === 'red' ? 'gold' : 'sub', 900);
      if (vfx() && cm.ring === 'red') fxAt(A.fx.charmFlare(), fx_(P()), GY - 60, 1200);
    }
    /* ...and the other arm: a favourite that fell to something it should have
       beaten. Named once, quietly, and never dramatized — the loss staging
       rule is absolute and dramatized losses are what drive chasing. */
    if (cm.upsetLoss) banner('IT SHOULD HAVE HAD THIS', 'sub', 1100);
    /* WHERE THE STRIKER ENDS UP. A landed blow keeps its ground: the travel is
       folded into the rig so the attacker stays exactly where the strike put
       it, and the orbit reopens the distance from there. A BLOCK is the one
       exception and it is deliberate — the whole read of a block is the
       swinging body being thrown back off the guard, so it keeps its eased
       settle out of the rebound. Nothing walks back to a mark either way. */
    if (a){
      if (how === 'block') anim(animEl(a.node), [{ transform:'translateX(0px)' }],
                                Math.max(1, tw), { easing:'ease-out', fill:'forwards' });
      else foldLunge(a);
    }
    // the swing is over; the bodies may work out which way they face again
    st.faceLock = false;
    /* Then a moving hold on the result — the beat the viewer reads it in,
       cushioned into, and alive throughout. It ends at the commit's own
       deadline, so every millisecond the stop or the freeze ran over is paid
       for HERE rather than handed to the run's total. */
    await at(ph.total);
    return !cm.fatal;
  }

  /* CIRCLING. Continuous locomotion driven by the momentum states, plus
     harmless scuffle contact. Dust only — none of the hit juice, because a
     scuffle that shook the screen would make the Tell mean nothing. */
  /* THE ABORT — the strongest device in the broken clock, and the cheapest.
     A commit that gets as far as the stop and dissolves. All three frames of
     the halt fire exactly as they do in a real Tell: both fighters stop hard,
     dust settles, the idle bob ends, sound drops out, the board ducks and the
     camera starts its push. Then no ring appears, the fighters resume orbit,
     and nothing has happened.

     It costs the run nothing because the ring is the only thing in the phase
     that carries information and the ring never comes. What it buys is that it
     breaks counting, it makes stillness ambiguous again, and it turns the
     ring's arrival into the event the Tell has been claiming it is.

     IT MUST BE FRAME-IDENTICAL TO A REAL TELL UNTIL THE RING WINDOW — which is
     why this fires the same calls in the same order rather than a cheaper
     imitation of them. If a viewer can spot one early it becomes a rest instead
     of a threat and the device inverts, which is exactly what acceptance test
     25 measures. */
  async function abortTell(ms){
    const p = P(), r = R();
    if (!p || !r || st.skipping) return;
    const T = C.tellShape, oneFrame = 1000 / C.stopmo.base / st.rate;
    const stopMs = Math.max(1, Math.min(ms * 0.34, T.stopFrames * oneFrame));
    [p, r].forEach(f => { f.circling = false; });
    stillness(true);
    board.duck(true);
    pushIn(true, stopMs * T.pushShare);
    // the hold — and this is where a real Tell would have shown its ring
    await wait(ms - stopMs);
    stillness(false);
    board.duck(false);
    pushIn(false, Math.max(80, ms * 0.4));
    [p, r].forEach(f => { f.circling = true; });
  }

  async function circleFor(ms, seed, rung, cm){
    /* SKIP must short-circuit this outright. The loop is driven by real
       elapsed time, but under skip every wait() resolves instantly — so
       without this it spins the microtask queue for the whole duration and
       wedges the renderer instead of skipping. */
    const p = P(), r = R();
    /* The footwork itself is the rig's job now — a continuous weight shift on
       the smooth clock. This used to be built out of discrete retargets every
       430ms, which is precisely why the back-and-forth read as jerky AND
       slow: it was four poses a second pretending to be walking. All this
       loop does now is decide when they scuff. */
    [p, r].forEach(f => { if (f){ f.circling = true; f.kb = 0; } });
    const done = () => { [p, r].forEach(f => { if (f) f.circling = false; }); };
    if (st.skipping || ms <= 8){ await wait(ms); done(); return; }
    const t0 = performance.now();
    let n = Math.floor(seed % 3);
    const every = Math.max(110, scale(C.commit.scuffleEvery));
    /* FEINTS ARE FREE TENSION, and they are how the ring teaches its own
       meaning: a feint is stillness with NO RING, so within two rungs a viewer
       has learned that stillness plus a ring is real and stillness without one
       is not. They belong in the long Circles — the Vault's — and a beat under
       `feint.min` gets none, because the short ones at rung 1 are almost pure
       approach. Which fighter feints is drawn off the commit's cosmetic seed,
       so it varies run to run and carries nothing. */
    const feintMs = scale(C.feint.ms);
    const feints = C.feintPlan(ms, rung || 0, seed, st.rate);
    let fi = 0;

    /* THE ABORTS AND THE CLINCH, planned before the loop starts so their
       placement is deterministic off the commit's own cosmetic seed — a replay
       of the same seal breaks the clock in exactly the same places, which is
       what makes the interval audit reproducible rather than a sample.

       Both are switched off under turbo along with the rest of the clock work:
       at 2x and 4x legibility beats irregularity and there is no beat left to
       entrain to. Orbit is NOT switched off, because the ring space is
       locomotion rather than texture and two fighters frozen on a fixed axis
       read as wrong at any speed. */
    const clockOn = !(st.rate > 1 && C.clock.turboOff);
    const abortMs = scale(C.clock.abort.ms);
    const nAborts = clockOn ? ((cm && cm.aborts) || 0) : 0;
    const stops = [];
    for (let i = 0; i < nAborts; i++){
      // spread across the beat, biased away from both ends: an abort against
      // the stop would be the last thing seen before a real one, and the
      // contrast it exists for would be lost
      const f = (i + 1) / (nAborts + 1);
      stops.push({ at: ms * (0.18 + f * 0.62), kind:'abort', ms: abortMs });
    }
    const doClinch = clockOn && ms > 700 &&
                     ((seed >> 5) % 1000) < C.ringSpace.clinch.chance * 1000;
    if (doClinch){
      const cl = C.ringSpace.clinch;
      stops.push({ at: ms * 0.52, kind:'clinch',
                   ms: scale(cl.min + ((seed >> 9) % 100) / 100 * (cl.max - cl.min)) });
    }
    stops.sort((a, b) => a.at - b.at);
    let si = 0;

    while (!st.skipping && performance.now() - t0 < ms - 40){
      const el = performance.now() - t0;
      const left = ms - el;
      /* THE CLOCK'S OWN EVENTS come first, because both of them consume real
         time out of this beat rather than adding to it — an abort is 0.35s of a
         Circle spent stopping, which is the whole reason it can cost the run
         nothing. */
      if (si < stops.length && el >= stops[si].at){
        const s = stops[si++];
        if (s.kind === 'abort') await abortTell(Math.min(s.ms, Math.max(80, left - 60)));
        else await clinch(Math.min(s.ms, Math.max(80, left - 60)));
        continue;
      }
      const due = fi < feints.length ? feints[fi] : Infinity;
      /* The loop wakes on whichever comes first — the next scuffle or the next
         feint. Stepping on the scuffle interval alone meant a 500ms Circle only
         ever sampled twice, and the feint's moment fell between the samples. */
      const nextStop = si < stops.length ? stops[si].at : Infinity;
      const step = Math.min(every, Math.max(24, left), Math.max(24, due - el),
                            Math.max(24, nextStop - el));
      if (el >= due){
        const first = ((seed >> (fi * 2 + 1)) + fi) % 2 === 0;
        feintNow(first ? p : r, first ? r : p, feintMs);
        fi++;
      }
      else if (n % 2 === 0 && vfx()){
        // the scuffle: they meet, dust, nothing more
        const pm = p ? fx_(p) : PX, rm = r ? fx_(r) : RX;
        const puff = fxAt(A.fx.scuffle(), (pm + rm) / 2, GY - 26, 600);
        if (puff) anim(animEl(puff), [{ transform:'scale(0.4)', opacity:0.9 }, { transform:'scale(1.3)', opacity:0 }], scale(420));
        /* THE FORESHADOW, and it is the reason a dodge can read as earned
           rather than as the game cheating. The player's element signature
           plays here as harmless texture — a WATER Boxling letting a scuffle
           blow pass through it, an ICE one taking it off a facet, a FIRE one
           flaring around it. It rides on a scuffle that was already happening,
           so it buys the run nothing; it plays on EVERY run regardless of
           band, so it leaks nothing; and by the time an upset actually spends
           the capability at rung 2, the viewer has already watched the same
           body do the same thing for free. */
        foreshadow(p, seed + n);
        /* AND THE RIVAL'S, for the same reason and by the same rule. The rival
           slips the first swing of every gold using its own element signature,
           so that capability has to be visible BEFORE it is needed or the slip
           reads as the game inventing an escape. It rides the same scuffle,
           costs the same nothing, and plays on every run regardless of band. */
        foreshadow(r, seed + n + 7);
        // both lean IN to the contact and come off it — +x local for each, so
        // the pair converges. `* f.dir` slid them both the same way instead.
        [p, r].forEach(f => { if (f) anim(animEl(f.node),
          [{ transform:'translateX(0px)' }, { transform:'translateX(6px)' }, { transform:'translateX(0px)' }],
          Math.max(1, step * 0.8), { fill:'none' }); });
      }
      /* MOMENTUM MOVES DURING THE CIRCLE TOO. If state changed only at clash
         resolutions the fight would be a step function, and a step function is
         a turn structure wearing locomotion. So the states respond continuously
         to TERRITORY: whoever is driving the shared centre climbs, whoever is
         yielding it falls. The scripted value is a destination rather than a
         lock — and the lock arrives at the Tell, where `cm.tell` forces both
         states to their scripted values on the first frame. That is exactly
         where the invariance rule is checked, so the fight gains a continuously
         alive middle and gives up nothing. */
      if (clockOn && p && r && !C.live.freezeOrbit){
        const held = (st.ring.cx - ringMid()) / Math.max(1, C.ringSpace.centre.range * st.k);
        if (Math.abs(held) > 0.62){
          // the player is on the left, so the centre pushed RIGHT means the
          // player has taken ground
          const climbing = held > 0 ? p : r, falling = held > 0 ? r : p;
          const up = { BUCKLING:'PRESSURED', PRESSURED:'EVEN', EVEN:'DOMINANT' };
          const dn = { DOMINANT:'EVEN', EVEN:'PRESSURED', PRESSURED:'BUCKLING' };
          if (up[climbing.mom]) setMom(climbing, up[climbing.mom], scale(C.momentum.tween));
          if (dn[falling.mom])  setMom(falling,  dn[falling.mom],  scale(C.momentum.tween));
        }
      }
      n++;
      await wait(step);
    }
    /* NO RESET. What used to be here was `f.kb = 0; place(f, 120)` on both
       fighters — "hand the ground back to the state so the Tell starts from a
       clean read". A clean read is precisely the problem: it put both bodies
       back at an even distance, squared up and ready, at the top of every
       single commit. That is a turn boundary, and it was felt as one no matter
       what the durations did.

       The knockback DECAYS instead of being zeroed, and it decays by orbiting
       out of it rather than by being teleported. A body works its way back to a
       decent position over the Circle and never quite gets all the way there,
       which is what a fighter recovering actually looks like. */
    /* The per-Circle knockback nudge is gone: recovery is continuous now and
       lives in `ringStep`, so it happens while the fighters are actually moving
       rather than in one step at a phase boundary. */
  }

  /* The signature, played small and for nothing. Deterministic off the
     commit's own cosmetic seed rather than Math.random, like everything else
     that varies here, so a replay of the same seal shows the same texture in
     the same Circles. Scaled right down: this must never read as a save,
     because nothing was coming. */
  function foreshadow(f, salt){
    const F = C.dodge.foreshadow;
    if (!f || !f.element || st.skipping || !vfx()) return;
    if (((salt * 2654435761) >>> 8) % 1000 >= F.chance * 1000) return;
    const E = C.elements[f.element];
    if (!E) return;
    const g = fxAt(A.fx.signature(E.signature, E.trail), fx_(f), GY, F.ms + 400);
    if (!g) return;
    animEl(g).style.transform = 'scale(0.42)';
    anim(animEl(g), [
      { opacity:0, transform:'scale(0.34)' },
      { opacity:0.55, transform:'scale(0.46)', offset:0.4 },
      { opacity:0, transform:'scale(0.5)' },
    ], Math.max(1, scale(F.ms)), { fill:'forwards' });
  }

  /* A FEINT. One fighter drops into a plant, the other buys it, and nothing
     comes of it: no ring, no dust, no consequence, no time spent — it happens
     inside a Circle that was already running. The tension is the whole
     product, and the contrast is what makes a real Tell legible. */
  function feintNow(a, d, ms){
    if (!a || !d || st.skipping) return;
    anim(animEl(a.node), [
      { transform:'translateX(0px) scaleY(1)' },
      { transform:'translateX(-15px) scaleY(0.95)', offset:0.34 },
      { transform:'translateX(7px) scaleY(1.03)',  offset:0.62 },
      { transform:'translateX(0px) scaleY(1)' },
    ], Math.max(1, ms), { fill:'none' });
    const id = setFlinch(d, 'QUAKE', ms * 0.3, C.flinch.intensity.scuffle);
    setTimeout(() => clearFlinch(d, id), Math.max(1, ms));
  }

  /* THE RING — the ground telegraph under whoever is about to be hit.
     It says what CAN happen, never what will; only the Clash knows. */
  function showRing(kind, target, ms){
    const cfg = C.rings[kind];
    if (!cfg || !target || !vfx()) return null;
    /* THE COVERED-RING TEST, as a switch rather than a paragraph asking someone
       to imagine it. With the ring masked, a first-time viewer must still
       report that something dangerous is coming — from the bodies alone. If
       they cannot, the flinch is decoration rather than communication. */
    if (C.live.coverRing) return null;
    const s = C.ringScale();
    const n = fxAt(A.fx.ring(cfg.color, cfg.width * s), fx_(target), GY + 6, ms + 900);
    if (!n) return null;
    anim(animEl(n), [
      { transform:`scale(${(0.25 * s).toFixed(2)})`, opacity:0 },
      { transform:`scale(${(1.08 * s).toFixed(2)})`, opacity:1, offset:0.45 },
      { transform:`scale(${(0.88 * s).toFixed(2)})`, opacity:1 },
    ], Math.max(1, ms), { easing:'cubic-bezier(.2,.9,.3,1)', fill:'forwards' });
    /* The ring's pulse rate and the body's tremor frequency share a clock, so
       the telegraph and the flinch read as one event. Four tremors to a pulse. */
    if (cfg.pulse){
      const r = n.querySelector('.fxRing');
      if (r){
        r.style.setProperty('--pulse', Math.round(4000 / C.flinch.tremor.hz) + 'ms');
        r.classList.add('pulsing');
      }
    }
    return n;
  }

  /* THE TURN'S ANSWER. One harder pulse at the arc's flip — the ring reacting
     to the creature. It ends where the intro left it, so the hold that follows
     is as still as the one before. */
  function ringPulse(n){
    if (!n) return;
    const s = C.ringScale(), end = `scale(${(0.88 * s).toFixed(2)})`;
    anim(animEl(n), [
      { transform:end },
      { transform:`scale(${(1.20 * s).toFixed(2)})`, offset:0.34 },
      { transform:end },
    ], scale(200), { fill:'forwards' });
  }

  /* THE CAMERA. Push in on a Tell, shake on a Clash, and — v3.7's one addition,
     forced by the drifting centre — a re-centre on `C` at a rate STRICTLY
     SLOWER than either fighter's orbit, so it tracks the fight's territory and
     never a body. If a viewer can tell which fighter the camera likes it has
     become a follow and it is wrong; if the fight can walk out of frame the
     drift is too slow or the frame is too tight, which is what `centre.range`
     is bounded for.

     It is rig-owned now. It used to set its own inline CSS transition, and a
     frame loop writing the same property every 16ms cannot coexist with one —
     the drift would have fought the push-in for the transform and lost. Same
     discipline as the fighters: the rig owns the grid, and everything on screen
     obeys one clock. */
  function pushIn(on, ms){
    st.cam.from = { x: st.cam.x, k: st.cam.k };
    st.cam.kTo = (on && vfx()) ? C.commit.pushIn : 1;
    st.cam.ms  = Math.max(1, ms);
    st.cam.t0  = performance.now();
  }
  function camStep(now){
    const cam = q('#cam');
    if (!cam) return;
    const e = st.cam.ms > 0 ? Math.min(1, (now - st.cam.t0) / st.cam.ms) : 1;
    const s = e * e * (3 - 2 * e);
    st.cam.k = st.cam.from.k + (st.cam.kTo - st.cam.from.k) * s;
    /* THE DRIFT. A fraction of the centre's own displacement, eased hard, so it
       is always slower than the orbit it is watching — the fight moves inside
       the frame and the frame only ever suggests that it has. */
    if (st.ring.live && vfx() && !C.live.freezeOrbit){
      const want = (st.ring.cx - ringMid()) * 0.45;
      st.cam.x += (want - st.cam.x) * 0.018;
    } else if (Math.abs(st.cam.x) > 0.2){
      st.cam.x *= 0.94;
    } else st.cam.x = 0;
    cam.style.transitionDuration = '0ms';
    cam.style.transform = `translateX(${(-st.cam.x).toFixed(2)}px) scale(${st.cam.k.toFixed(4)})`;
  }
  function darkenEdges(on, ms){
    const v = q('#vignette');
    if (!v) return;
    v.style.transitionDuration = Math.round(Math.max(1, ms)) + 'ms';
    v.style.opacity = (on && vfx()) ? 1 : 0;
  }

  // --------------------------------------------------------------- opener
  async function sceneOpener(plan){
    const t = C.openerBeats();
    const lossW = plan.openerContinue ? 1 : C.lossDelta;
    const total = (t.drop + t.coil + t.windup + t.hitstop + t.branch + t.settle) * lossW;
    pace.scene(scale(total), (t.drop + t.coil + t.windup + t.hitstop + t.branch + t.settle));
    clearLayer('#actorLayer'); clearLayer('#fxLayer');

    // the drop
    const box = addNode('#actorLayer', A.boxArt('cardboard'), PX, GY - 240);
    st.actors.playerBox = box;
    const drop = pace.take(t.drop);
    await anim(box, [{ transform:`translate(${PX}px, ${GY-240}px)` }, { transform:`translate(${PX}px, ${GY}px)` }],
      drop, { easing:'cubic-bezier(.5,0,.9,.6)', fill:'forwards' });
    box.style.transform = `translate(${PX}px, ${GY}px)`;
    if (vfx()){
      fxAt(A.fx.dustRing(), PX, GY+4);
      const dr = q('.fxDust'); if (dr) anim(dr, [{transform:'scale(0.4)', opacity:1},{transform:'scale(3.2)', opacity:0}], scale(420));
    }
    shake(7, 200);
    anim(animEl(box), [{transform:'scaleY(0.86) translateY(6px)'},{transform:'scaleY(1) translateY(0)'}], scale(200));

    // the coil: the box settles and the rival walks into frame.
    // (This slot used to be the Parade flash. The lineup is gone; the beat,
    //  and therefore the hook's rhythm, is not.)
    const rival = addFighter('rival', A.creature(plan.openerRival.speciesId, {tint:'#8a97ad', element: plan.openerRival.element}), RX, -1);
    setEx(rival.node, 'fierce');
    const coil = pace.take(t.coil);
    anim(animEl(rival.node), [{ transform:'translateX(120px)', opacity:0 }, { transform:'translateX(0)', opacity:1 }],
         coil * 0.8, { easing:'ease-out' });
    await wait(coil);

    /* THE WIND-UP — the clench, staged to read with the sound off, and now the
       single authored source for it. The two killing commits play these exact
       keyframes at their Tell, because the opener is not a prologue to the run:
       it is the thesis, and the run is three variations on it. See C.coil. */
    await anim(animEl(rival.node), C.coilFrames(),
               pace.take(t.windup), { easing: C.coil.easing });

    // the strike + hit-stop
    const stop = pace.take(t.hitstop);
    await anim(animEl(rival.node), [
      { transform:'translateX(30px) rotate(-8deg)' },
      { transform:`translateX(${PX-RX+120}px) rotate(6deg)` },
    ], Math.max(1, stop * 0.45), { easing:'cubic-bezier(.2,0,.4,1)' });
    const imp = fxAt(A.fx.impact(), PX+44, GY-46, 900);
    if (imp) anim(animEl(imp), [{transform:'scale(1)', opacity:1},{transform:'scale(2.6)', opacity:0}], scale(260));
    shake(C.hit.shake.heavy, 200);
    await hitstop(stop * 0.55);
    anim(animEl(rival.node), [{ transform:`translateX(${PX-RX+120}px)` }, { transform:'translateX(0)' }], scale(260));

    // the branch
    if (plan.openerContinue){
      await branchContinue(plan, pace.take(t.branch));
      stakes('');
      /* THE BOARD'S FIRST MOVEMENT IS THE RUN'S FIRST GOOD NEWS. Surviving
         the opener rules out the Floor, so the Floor tier flies off the
         mountain and burns here, in the opener's settle — the aftermath of
         the first commit in the game, and the longest burn window in the run,
         which is why it is also where the flyout teaches itself. */
      const settle = pace.take(t.settle);
      board.burn(C.burnedByOpener, settle);
      await wait(settle);
      await pace.land();
      return true;
    } else {
      await playGag(plan.gag, pace.take(t.branch), rival);
      await wait(pace.take(t.settle));
      await pace.land();
      /* Boxed at the opener: the Floor is what was won, so it ignites and
         locks, and the four tiers above it fold face-down, undramatized —
         nobody needs the missed millions rubbed in.

         It fires AFTER pace.land(), not before, and that placement is load
         bearing. The Floor is the tightest budget in the product (2.7s
         against a 3s cap) and it is the one branch with no slack to absorb a
         style recalc; the lock is epilogue by the doc's own staging — it
         slides to center "as the receipt begins" — so it belongs on the far
         side of the deadline, where it cannot spend a millisecond the cap
         is counting. */
      board.lock(plan.band);
      return false;
    }
  }

  async function branchContinue(plan, ms){
    const box = st.actors.playerBox;
    const frags = addNode('#fxLayer', A.fragments(), PX, GY);
    box.remove(); delete st.actors.playerBox;
    frags.querySelectorAll('.frag').forEach((f, i) => {
      const dx = (i%2 ? 1 : -1) * (30 + i*14), dy = -50 - (i*13)%70;
      anim(f, [
        { transform:'translate(0,0) rotate(0deg)', opacity:1 },
        { transform:`translate(${dx}px, ${dy}px) rotate(${dx*3}deg)`, opacity:0.9, offset:0.55 },
        { transform:`translate(${dx*1.5}px, ${dy*0.2+70}px) rotate(${dx*5}deg)`, opacity:0 },
      ], ms*0.9, { easing:'cubic-bezier(.2,.6,.5,1)' });
    });
    const m = plan.packSnapshot.members[0];
    const cw = C.colorways.find(c=>c.id===m.colorway) || C.colorways[0];
    const p = addFighter('player', A.creature(m.speciesId, {tint: cw.body, charm: plan.packSnapshot.charmIndex===0}), PX, 1);
    p.node.dataset.lead = 0;
    teamMark(0, 'lead');
    setMom(p, 'DOMINANT', 1);
    banner('IT SWINGS', 'good', 900);
    // out through the fragments, swinging
    await anim(animEl(p.node), [
      { transform:'translateX(0) scale(0.6)', opacity:0 },
      { transform:`translateX(${RX-PX-140}px) scale(1.06)`, opacity:1, offset:0.6 },
      { transform:`translateX(${RX-PX-150}px) scale(1)` },
    ], ms*0.62, { easing:'cubic-bezier(.3,0,.4,1)' });
    const imp = fxAt(A.fx.impact(), RX-84, GY-52, 700);
    if (imp) anim(animEl(imp), [{transform:'scale(1)',opacity:1},{transform:'scale(2.4)',opacity:0}], scale(240));
    shake(C.hit.shake.light + 2, 180);
    const rival = R();
    if (rival){
      setEx(rival.node, 'worried');
      knockback(rival, C.hit.knockback.heavy, 200);
      anim(animEl(rival.node), [{ transform:'translateX(0)' }, { transform:'translateX(46px) rotate(9deg)' }], scale(240));
    }
    await anim(animEl(p.node), [
      { transform:`translateX(${RX-PX-150}px)` }, { transform:'translateX(0)' }
    ], ms*0.3, { easing:'ease-in-out' });
    removeActor('rival');
    setMom(p, 'EVEN', scale(C.poseMs));
  }

  // ------------------------------------------------------------- the gags
  async function playGag(gagId, ms, rival){
    const box = st.actors.playerBox;
    banner('BOXED.', 'bad', 1400);
    const T = f => Math.max(1, ms * f);
    const lead = () => st.plan.packSnapshot.members[0];
    const leadTint = () => (C.colorways.find(c=>c.id===lead().colorway) || C.colorways[0]).body;
    const spawnLead = () => {
      const f = addFighter('player', A.creature(lead().speciesId, {tint: leadTint()}), PX, 1);
      return f;
    };

    if (gagId === 'explosion'){
      const frags = addNode('#fxLayer', A.fragments(), PX, GY);
      box.remove();
      frags.querySelectorAll('.frag').forEach((f,i)=>{
        const dx=(i%2?1:-1)*(36+i*16), dy=-60-(i*17)%80;
        anim(f,[{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${dx*4}deg)`,opacity:0.9,offset:0.5},{transform:`translate(${dx*1.4}px,80px) rotate(${dx*6}deg)`,opacity:0}], T(0.9));
      });
      shake(10, 240);
      const f = spawnLead();
      setEx(f.node, 'dizzy');
      await wait(T(0.22));                       // the pause, THEN the flop
      await anim(animEl(f.node), [
        { transform:'rotate(0deg) translateY(0)' },
        { transform:'rotate(-80deg) translateY(-6px) translateX(-18px)' },
      ], T(0.35), { easing:'cubic-bezier(.6,0,1,.4)' });
      const stars = fxAt(A.fx.stars(), PX-30, GY-58, 3000);
      if (stars) anim(animEl(stars), [{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}], scale(1600), {iterations:2, fill:'none'});
    }
    else if (gagId === 'punt'){
      await anim(box, [
        { transform:`translate(${PX}px, ${GY}px) rotate(0deg)` },
        { transform:`translate(${PX-260}px, ${GY-220}px) rotate(-200deg)` },
        { transform:`translate(${PX-430}px, ${GY-90}px) rotate(-380deg)`, opacity:0.9 },
      ], T(0.55), { easing:'cubic-bezier(.3,.1,.6,1)' });
      box.remove();
      const puff = fxAt(A.fx.snowPuff(), 66, 402, 2600);
      if (puff) anim(animEl(puff), [{transform:'scale(0.4)',opacity:0},{transform:'scale(1.4)',opacity:1},{transform:'scale(1.7)',opacity:0.65}], T(0.3));
      await wait(T(0.28));   // the beat
      const paw = fxAt(`<g><rect x="-5" y="-16" width="10" height="18" rx="5" fill="#c9a06b" stroke="#8a6a42" stroke-width="1.6"/><circle cx="0" cy="-18" r="7" fill="#c9a06b" stroke="#8a6a42" stroke-width="1.6"/><circle cx="0" cy="-21" r="2.6" fill="#8a6a42"/></g>`, 66, 398, 2600);
      if (paw) anim(paw, [{transform:'translate(66px, 430px)'},{transform:'translate(66px, 398px)'}], T(0.2), {easing:'cubic-bezier(.2,1.6,.5,1)'});
    }
    else if (gagId === 'siton'){
      if (rival){
        await anim(animEl(rival.node), [
          { transform:'translateX(0) translateY(0)' },
          { transform:`translateX(${PX-RX+10}px) translateY(-90px)` , offset:0.55},
          { transform:`translateX(${PX-RX}px) translateY(-56px)` },
        ], T(0.4), { easing:'cubic-bezier(.4,0,.6,1)' });
        setEx(rival.node, 'happy');
      }
      await anim(animEl(box), [{ transform:'scaleY(1)' }, { transform:'scaleY(0.42) scaleX(1.25)' }], T(0.18), { easing:'cubic-bezier(.7,0,1,.6)' });
      shake(6, 160);
      for (let i=0;i<3;i++){
        const p = fxAt(A.fx.snowPuff(), PX + (i%2? 52:-52), GY-8, 900);
        if (p) anim(animEl(p), [{transform:'scale(0.3)',opacity:0.9},{transform:'scale(1)',opacity:0}], T(0.16));
        await anim(animEl(box), [{ transform:'scaleY(0.42) scaleX(1.25) translateX(-4px)' },{ transform:'scaleY(0.42) scaleX(1.25) translateX(4px)' },{ transform:'scaleY(0.42) scaleX(1.25) translateX(0)' }], T(0.14), {fill:'none'});
      }
    }
    else if (gagId === 'peek'){
      const eyes = fxAt(`<g><rect x="-30" y="-6" width="60" height="10" rx="5" fill="#120c07"/><circle cx="-12" cy="-1" r="4.4" fill="#fff"/><circle cx="12" cy="-1" r="4.4" fill="#fff"/><circle cx="-11" cy="-1" r="2" fill="#1c1410"/><circle cx="13" cy="-1" r="2" fill="#1c1410"/></g>`, PX, GY-82, 6000);
      anim(animEl(box), [{transform:'translateY(0)'},{transform:'translateY(-7px)'}], T(0.12));
      await wait(T(0.3));                              // the long look
      if (eyes) eyes.remove();
      await anim(animEl(box), [{transform:'translateY(-7px)'},{transform:'translateY(0)'}], T(0.08));
      const tape = fxAt(`<g><rect x="-34" y="-4" width="68" height="12" rx="3" fill="#e9dcae" stroke="#c9b878" stroke-width="1.6" opacity="0.97"/></g>`, PX, GY-80, 6000);
      if (tape){
        await anim(animEl(tape), [{transform:'scaleX(0)',opacity:0},{transform:'scaleX(1)',opacity:1}], T(0.14));
        await anim(animEl(tape), [{transform:'translateY(0)'},{transform:'translateY(3px)'},{transform:'translateY(0)'},{transform:'translateY(3px)'},{transform:'translateY(0)'}], T(0.16), {fill:'none'});
      } else await wait(T(0.3));
      await wait(T(0.1));
      await anim(animEl(box), [
        { transform:'rotate(0deg)' }, { transform:'rotate(4deg)', offset:0.4 }, { transform:'rotate(-86deg) translateY(-8px)' },
      ], T(0.3), { easing:'cubic-bezier(.6,0,1,.5)' });
      shake(5, 150);
      fxAt(A.fx.snowPuff(), PX-46, GY-4, 1200);
    }
    else { // fright
      const frags = addNode('#fxLayer', A.fragments(), PX, GY);
      box.remove();
      frags.querySelectorAll('.frag').forEach((f,i)=>{
        const dx=(i%2?1:-1)*(28+i*12);
        anim(f,[{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,${-40-(i*11)%50}px) rotate(${dx*3}deg)`,opacity:0}], T(0.5));
      });
      const f = spawnLead();
      setEx(f.node, 'normal');
      await wait(T(0.16));
      setEx(f.node, 'worried');
      await anim(animEl(f.node), [{transform:'scaleY(1)'},{transform:'scaleY(0.93) scaleX(1.04)'},{transform:'scaleY(1)'}], T(0.18), {fill:'none'});
      await wait(T(0.2));                              // the held beat — where the laugh lives
      setEx(f.node, 'ko');
      await anim(animEl(f.node), [
        { transform:'rotate(0deg)' }, { transform:'rotate(84deg) translateY(-4px)' },
      ], T(0.26), { easing:'cubic-bezier(.7,0,1,.4)' });
      shake(5, 140);
      fxAt(A.fx.snowPuff(), PX+40, GY-4, 1200);
    }
    delete st.actors.playerBox;
    teamMark(0, 'down');
  }

  // -------------------------------------------------------------- omens
  /* Omens ride on a beat that already exists. They say nothing about who is
     winning — only about the prize — and they buy the run no extra seconds,
     which is what keeps them compatible with the cap. */
  function playOmen(id){
    st.result.omensSeen.push(id);
    if (id === 'stormFront'){
      banner('OMEN · STORM FRONT', 'omen', 1400);
      const sky = q('#sky');
      sky.style.transition = 'opacity 0.4s';
      sky.setAttribute('fill','url(#stormSky)');
    } else if (id === 'auricTrace'){
      banner('OMEN · AURIC TRACE', 'omen gold', 1400);
      const r = R();
      if (r && vfx()){
        const gl = fxAt(`<g filter="url(#bigGlow)"><path d="M -18 -30 q 4 12 -2 26" stroke="#ffd700" stroke-width="4" fill="none"/><circle cx="-20" cy="-2" r="5" fill="#ffd700"/></g>`, fx_(r), GY-10, 2600);
        if (gl) anim(animEl(gl), [{opacity:0},{opacity:1},{opacity:0}], scale(1800), {fill:'none'});
      }
    }
  }

  // ------------------------------------------------- confrontation frame
  /* THE MISMATCH TELEGRAPH. The viewer reads the odds off physical dominance
     and nothing else: who is bigger, which way the ground tilts, who is
     leaning in and who is compact. No silhouettes to decode, no chart. */
  async function sceneConfront(plan, rung, ms){
    const ratios = C.mismatchRatio[rung.mismatch] || [1,1];
    const [pScale, rScale] = ratios;
    const rivalStronger = rScale > pScale;
    const dire = C.mismatchDire(rung.mismatch);

    pace.scene(ms, 3.0);
    board.duck(false);
    for (const o of plan.omens) if (o.beforeRung === rung.rung) playOmen(o.id);

    const p = await ensureLead(plan, rung.leadIndex, false, pace.take(0.7));
    p.scale = pScale;
    place(p, 0);

    const r = addFighter('rival', A.creature(rung.rival.speciesId, { tint: rung.rival.tint, element: rung.rival.element }), RX, -1,
                         { scale: rScale });
    /* Pre-hide the SAME element the entrance animates, and hand the opacity
       back to the stylesheet the moment the entrance is done. Hiding the
       PARENT instead left the rival invisible for the whole fight — the child
       faded in inside a transparent group and nothing ever put the group
       back. Relying on the animation's fill to hold it visible is the same
       trap one step later, because SKIP cancels animations. */
    const rAnim = animEl(r.node);
    rAnim.style.opacity = '0';
    const showRival = () => { rAnim.style.opacity = ''; };

    // the entrance
    const inMs = pace.take(1.0);
    anim(rAnim, [
      { transform:'translateX(150px)', opacity:0 }, { transform:'translateX(0)', opacity:1 },
    ], inMs * 0.85, { easing:'cubic-bezier(.2,.7,.3,1)', fill:'forwards' });
    tilt(rivalStronger ? 1 : -1, inMs);
    aura(r, rivalStronger ? 'agitated' : 'calm', true, inMs);
    shadow(r, rivalStronger); shadow(p, !rivalStronger);
    // posture only: the bodies say who is stronger before either has given
    // an inch of ground, so nothing here can be mistaken for a blow landed
    setMom(r, rivalStronger ? 'DOMINANT' : 'PRESSURED', inMs, true);
    setMom(p, rivalStronger ? 'PRESSURED' : 'DOMINANT', inMs, true);
    banner(rung.rival.name, dire ? 'bad' : 'rival', 1200);
    if (vfx() && dire) shake(5, 300);
    await wait(inMs);
    showRival();

    await wait(pace.take(0.8));      // the frame holds. This is the whole tell.

    // release: the camera levels, the aura goes, the fight starts from bodies
    const outMs = pace.take(0.5);
    tilt(0, outMs);
    aura(r, '', false, outMs);
    await pace.land();
  }

  /* ==================================================================
     THE WALKOUT — presentation before every rung above the first.

     The opener's box drop is already a presentation beat: it lands, it
     establishes the stakes, and the viewer knows what it means if the box fails
     to open. Every rung above the first needs the same service, because a fight
     nobody was introduced to is a fight nobody has a reason to watch.

     It ABSORBS the confrontation frame rather than sitting beside it: the
     frame's job — both bodies on screen at their true relative size, the ground
     tilted to look up at the stronger one — becomes the card beat's hold. Rung 1
     keeps the bare frame so the opener flows straight into the first fight
     without a speed bump.

       the arrival  the rival's box lands hard. Dust, shake, the turn to face it.
       the burst    it bursts and the rival is out. Deliberately the same shape
                    as the opener's burst, so the run rhymes with itself: a box
                    opening is always the start of a threat.
       the card     both fighters hold in frame and the tale of the tape slides
                    in over them. This is the David and Goliath statement.
       the clear    the card wipes, they drop into Circle, the fight is live.

     Why it cannot leak: every element is a function of rung index. Two runs of
     different bands arriving here see identical cards, and the stake line names
     what a win REMOVES, which the board is already showing.
     ================================================================== */
  function clearTape(ms){
    const l = q('#tapeLayer');
    if (!l) return;
    l.querySelectorAll('.tape').forEach(g => {
      if (g.dataset.done) return;
      g.dataset.done = '1';
      if (ms > 20 && !st.skipping){
        anim(g, [{ opacity:1, transform:'translateX(0px)' },
                 { opacity:0, transform:'translateX(54px)' }], ms, { fill:'forwards' });
        setTimeout(() => g.remove(), ms + 260);
      } else g.remove();
    });
  }
  function showTape(rung, ratios, ms){
    const l = q('#tapeLayer');
    if (!l || !vfx() || st.skipping) return null;
    const T = C.walkout.tape;
    const lead = st.plan.packSnapshot.members[rung.leadIndex] ||
                 st.plan.packSnapshot.members[0];
    const sp = C.species.find(s => s.id === C.speciesId(rung.rival.speciesId));
    /* THE EDGE, and the two element materials either side of the comparison.
       Both are functions of rung index and of what the player packed before
       the outcome existed, so two runs of different bands arriving here still
       see identical cards — the leak audit's assertion is untouched by the
       matchup. */
    const playerEl = C.elementOf(lead.speciesId);
    const rivalEl = rung.rival.element || 'fire';
    const edge = rung.edge || C.edgeOf(playerEl, rivalEl);
    const g = svgNode(`<g class="tape${rung.rung === C.height ? ' vaultTape' : ''}">${
      A.tapeCard({
        name: rung.rival.name,
        species: rung.rival.speciesId === 'auric' ? 'The Auric' : (sp ? sp.name : ''),
        playerId: lead.speciesId, rivalId: rung.rival.speciesId,
        playerEl, rivalEl, edge,
        /* Named once, in plain words, because the first walkout a player sees
           is before they have watched any defeat teach it to them. It is the
           relationship and nothing else — never who wins the fight. */
        edgeWhy: edge === 'even' ? 'same substance'
               : (C.elements[edge === 'favoured' ? playerEl : rivalEl] || {}).because || '',
        ratios, stake: C.stakeLine(rung.rung), vault: rung.rung === C.height,
      })}</g>`);
    l.appendChild(g);
    /* THE MISMATCH SLAB, MADE HONEST BY MEASUREMENT. Its whole job is the height
       difference, and every species is drawn to a different height — so scaling
       the two silhouettes by any nominal constant let the rival's species, which
       is a COSMETIC draw, change the apparent mismatch. Measured here, the two
       bodies sit at exactly the authored ratio and the bracket agrees with them,
       whichever rival turned up. */
    g.querySelectorAll('.tsil').forEach(s => {
      const want = +s.dataset.h, cx = +s.dataset.cx, base = +s.dataset.base;
      let b = null;
      try { b = s.getBBox(); } catch (e) {}
      if (!b || !b.height || !want) return;
      const k = want / b.height;
      // getBBox is pre-transform, so put the body's own bottom on the baseline
      s.setAttribute('transform', `translate(${cx} ${base}) scale(${k.toFixed(4)}) ` +
                                  `translate(0 ${(-(b.y + b.height)).toFixed(2)})`);
    });
    g.style.setProperty('--slab', Math.round(Math.max(90, ms * 0.34)) + 'ms');
    anim(g, [
      { opacity:0, transform:`translate(-58px, 10px)` },
      { opacity:1, transform:'translate(0px, 0px)' },
    ], Math.max(1, ms * 0.34), { easing:'cubic-bezier(.2,.9,.3,1)', fill:'forwards' });
    return g;
  }

  async function sceneWalkout(plan, rung, ms){
    const W = C.walkout, turbo = st.rate > 1;
    const ratios = C.mismatchRatio[rung.mismatch] || [1, 1];
    const [pScale, rScale] = ratios;
    const rivalStronger = rScale > pScale;
    const dire = C.mismatchDire(rung.mismatch);
    const vault = rung.rung === C.height;
    const ent = W.entrances.find(e => e.id === rung.rival.entrance) || W.entrances[0];

    /* Turbo compresses the beat and skips none of it, because at speed the
       walkout is the only thing separating one fight from the next. */
    const w = { arrive: W.arrival, burst: W.burst,
                card:  turbo ? W.turboCard  : W.card,
                stake: turbo ? W.turboStake : W.stake,
                clear: turbo ? 0 : W.clear };
    pace.scene(ms, w.arrive + w.burst + w.card + w.stake + w.clear);
    board.duck(false);
    clearTape();
    for (const o of plan.omens) if (o.beforeRung === rung.rung) playOmen(o.id);

    // the Boxling is already on its feet; it is the thing being walked out AT
    const p = await ensureLead(plan, rung.leadIndex, false, 0);
    p.scale = pScale;
    place(p, 0);
    removeActor('rival');

    // ---- 1. THE ARRIVAL. It lands hard. This beat already existed as the
    // climb's reward; it now doubles as the walkout's entrance.
    const arrive = Math.max(1, pace.take(w.arrive));
    const box = addNode('#actorLayer', A.boxArt(C.rungBoxGrade[rung.rung]), RX, GY + ent.drop);
    st.actors.rivalBox = box;
    setEx(p.node, 'worried');
    setFlinch(p, 'BRACE', arrive * 0.6, 0.5);      // it turns to face it
    await anim(box, [
      { transform:`translate(${RX}px, ${GY + ent.drop}px) rotate(0deg)` },
      { transform:`translate(${RX}px, ${GY}px) rotate(${ent.spin}deg)`,
        offset: ent.bounce > 0 ? 0.72 : 1 },
      { transform:`translate(${RX}px, ${GY - 26 * ent.bounce}px) rotate(${ent.spin + 4}deg)`,
        offset: ent.bounce > 0 ? 0.86 : 1 },
      { transform:`translate(${RX}px, ${GY}px) rotate(${ent.spin}deg)` },
    ], arrive, { easing:'cubic-bezier(.5,0,.9,.6)', fill:'forwards' });
    box.style.transform = `translate(${RX}px, ${GY}px) rotate(${ent.spin}deg)`;
    if (vfx()){
      const dr = fxAt(A.fx.dustRing(), RX, GY + 4, 900);
      if (dr) anim(animEl(dr), [{ transform:'scale(0.4)', opacity:1 },
                                { transform:`scale(${(3.2 * ent.dust).toFixed(1)})`, opacity:0 }], scale(460));
    }
    shake((dire ? 11 : 8) * ent.shake, 240);

    // ---- 2. THE BURST. The opener's shape, on purpose.
    const burst = Math.max(1, pace.take(w.burst));
    const frags = addNode('#fxLayer', A.fragments(), RX, GY);
    box.remove(); delete st.actors.rivalBox;
    frags.querySelectorAll('.frag').forEach((fg, i) => {
      const dx = (i % 2 ? 1 : -1) * (32 + i * 15), dy = -54 - (i * 15) % 76;
      anim(fg, [
        { transform:'translate(0,0) rotate(0deg)', opacity:1 },
        { transform:`translate(${dx}px, ${dy}px) rotate(${dx * 3}deg)`, opacity:0.9, offset:0.55 },
        { transform:`translate(${dx * 1.5}px, ${dy * 0.2 + 74}px) rotate(${dx * 5}deg)`, opacity:0 },
      ], burst * 1.4, { easing:'cubic-bezier(.2,.6,.5,1)' });
    });
    const r = rung.rival.speciesId === 'auric'
      ? addFighter('rival', A.auric({ element: rung.rival.element }), RX, -1, { scale: rScale })
      : addFighter('rival', A.creature(rung.rival.speciesId, { tint: rung.rival.tint, element: rung.rival.element }), RX, -1,
                   { scale: rScale });
    /* Pre-hide the SAME element the entrance animates, and hand the opacity
       back to the stylesheet once it is done — hiding the parent leaves the
       rival invisible for the whole fight, and trusting the animation's fill to
       hold it visible is the same trap one step later, because SKIP cancels
       animations. */
    const rAnim = animEl(r.node);
    rAnim.style.opacity = '0';
    setEx(r.node, 'fierce');
    /* Each rival comes out of its own box its own way. The structure is fixed;
       the performance inside it never repeats. */
    const out = {
      down: [{ transform:'translateY(-64px) scale(0.9)', opacity:0 }, { transform:'translateY(0) scale(1)', opacity:1 }],
      side: [{ transform:'translateX(96px) scale(0.94)', opacity:0 }, { transform:'translateX(0) scale(1)', opacity:1 }],
      up:   [{ transform:'translateY(74px) scale(1.1, 0.86)', opacity:0 },
             { transform:'translateY(-16px) scale(0.94, 1.1)', opacity:1, offset:0.66 },
             { transform:'translateY(0) scale(1,1)', opacity:1 }],
      rise: [{ transform:'translateY(58px) scale(1,0.9)', opacity:0 }, { transform:'translateY(0) scale(1,1)', opacity:1 }],
    }[ent.out] || [{ opacity:0 }, { opacity:1 }];
    anim(rAnim, out, burst * 0.9, { easing:'cubic-bezier(.2,.8,.3,1)', fill:'forwards' });
    /* The confrontation frame's own work, absorbed: the ground tilts to look UP
       at the stronger side, the aura is the redundant cue, and both bodies take
       posture WITHOUT giving ground, so nothing here can be mistaken for a blow
       already landed. */
    tilt(rivalStronger ? 1 : -1, burst);
    aura(r, rivalStronger ? 'agitated' : 'calm', true, burst);
    shadow(r, rivalStronger); shadow(p, !rivalStronger);
    setMom(r, rivalStronger ? 'DOMINANT' : 'PRESSURED', burst, true);
    setMom(p, rivalStronger ? 'PRESSURED' : 'DOMINANT', burst, true);
    clearFlinch(p);
    banner(rung.rival.name, dire ? 'bad' : 'rival', 1200);
    if (vfx() && dire) shake(6, 300);
    await wait(burst);
    rAnim.style.opacity = '';

    // ---- 3. THE CARD. The David and Goliath statement, held long enough to read.
    const cardMs = Math.max(1, pace.take(w.card));
    showTape(rung, ratios, cardMs);
    await wait(cardMs);

    /* ---- 4. THE STAKE. The tape's last slab named a band; now that band comes
       down off the mountain and holds at the front, so the sentence and the
       money are one image. The tape leaves FIRST and the two never share the
       frame — the card spans y 161–339 and the tier lands at 288, so they
       would sit on top of each other, and "never two at once" is the layer
       rule this beat has to obey like any other.

       It does not burn. Nothing has been proved yet; the card returns to its
       rung and the board still shows only what a clash has shown. */
    const stakeMs = Math.max(1, pace.take(w.stake));
    clearTape(Math.max(1, stakeMs * 0.30));
    board.previewTier(C.stakeTier(rung.rung), stakeMs);
    await wait(stakeMs);

    // ---- 5. THE CLEAR. The fight is live.
    const clr = pace.take(w.clear);
    clearTape(turbo ? 0 : Math.max(1, clr * 0.8));
    tilt(0, Math.max(1, clr || 200));
    aura(r, '', false, Math.max(1, clr || 200));
    await pace.land();
  }

  // ------------------------------------------------------------- a rung
  /* A rung is its confrontation frame followed by its commits, in order.
     Which commits play is the ONLY thing the band decides, and it decides it
     by ending the run — every commit that does play is identical across every
     band that reaches it, right up to the moment its Clash resolves. */
  async function sceneRung(plan, rung, budget){
    clearLayer('#fxLayer');
    /* SIDES FIRST, because the staging reads the home marks. A rung that ended
       with the fighters crossed would otherwise stage this one's walkout with
       the player standing where the rival's box is about to land. */
    st.ring.live = false;
    stageReset();
    markShow(true);            // from the walkout onward there are two bodies
    /* Rung 1 gets the bare confrontation frame; every rung above it gets the
       walkout, which absorbs that frame's job into its card beat. */
    if (C.hasWalkout(rung.rung)) await sceneWalkout(plan, rung, budget.confront);
    else                         await sceneConfront(plan, rung, budget.confront);

    /* THE RING GOES LIVE HERE, and it goes live AFTER the staging beat.
       The walkout and the confrontation frame place bodies at marks on purpose:
       a presentation beat is staged rather than fought, and both fighters have
       to be square to camera at true relative size for the frame to do its job.
       The fight is what happens in polar coordinates, and it starts now.

       WHY THE RESET IS LEGAL HERE AND NOWHERE ELSE. Territory accumulates
       ACROSS THE COMMITS OF A RUNG — "by the end of a rung the fight is being
       held in one half of the arena" — and then a new rival's box lands, the
       stage is re-established, and the next rung starts from the middle. Inside
       a rung nothing resets, which is the whole of NO RESET.

       `ringReset` runs BEFORE the ring goes live, so the re-place inside it
       reads the home marks rather than a polar position that does not exist
       yet. The first ringStep then moves both bodies to cx +/- r, which sits
       within ~15px of PX and RX, so there is no jump into the fight. */
    ringReset();
    st.ring.live = true;

    for (let i = 0; i < rung.commits.length; i++){
      const ms = budget.commits[i] != null ? budget.commits[i]
                                           : budget.commits[budget.commits.length - 1];
      // C.phases() already accounts for the rate — do NOT scale() it too, or
      // turbo divides the commit budget twice and the grammar outruns itself.
      pace.scene(C.commitPlan(rung.commits[i], ms, st.rate).total, 1);
      const alive = await playCommit(rung.commits[i], ms, rung.rung);
      await pace.land();
      if (!alive){
        st.ring.live = false;                  // the run is over; the receipt owns the end
        teamMark(rung.leadIndex, 'down');
        // Locked, not lost: the tier the run reached ignites and holds the
        // light; the ones above fold face-down, undramatized.
        board.lock(st.plan.band);
        banner('THE RUN ENDS', 'bad', 1600);
        dim(0.35, Math.min(600, scale(600)));   // not awaited: the run is over
        return false;
      }
    }
    /* An underdog win is one taken against a bigger body, so it asks the
       RATIOS rather than a pair of literal strings. Under v3.6 the rival is
       never smaller in front of a commit that can kill, so every rung win is
       now an underdog win — which is what the honesty rule was buying. */
    if (C.rivalBigger(rung.mismatch)) st.result.underdogWins++;
    banner(`RUNG ${rung.rung - 1} — TAKEN`, 'good', 900);
    st.ring.live = false;                      // the celebration is staged, not fought
    removeActor('rival');
    return true;
  }

  async function ensureLead(plan, idx, dropIn=false, ms){
    const cur = st.fighters.player;
    if (cur && String(cur.node.dataset.lead) === String(idx)){
      if (ms) await wait(ms);
      return cur;
    }
    removeActor('player');
    const m = plan.packSnapshot.members[idx];
    const cw = C.colorways.find(c=>c.id===m.colorway) || C.colorways[0];
    const f = addFighter('player', A.creature(m.speciesId, { tint: cw.body, charm: idx === plan.packSnapshot.charmIndex }), PX, 1);
    f.node.dataset.lead = idx;
    teamMark(idx, 'lead');
    await anim(animEl(f.node), dropIn
      ? [{ transform:'translateY(-140px) scale(0.8)', opacity:0 }, { transform:'translateY(0) scale(1)', opacity:1 }]
      : [{ transform:'translateX(-80px)', opacity:0 }, { transform:'translateX(0)', opacity:1 }],
      Math.max(1, ms || scale(260)));
    return f;
  }

  // ---------------------------------------------------------------- vault
  /* THE VAULT IS TWO COMMITS.
     Commit A is the largest creature in the game throwing a red — survived by
     every band that gets here, which is exactly what makes it legal to show:
     it can end the run, and at this position it never does, and the viewer
     cannot know that. Then the gilded box rises, the arena goes quiet, and
     commit B is the WITNESS strike whose Clash IS the crack. That crack is
     the only place band 4 and the Grail diverge in the entire run. */
  async function sceneVault(plan, v_arc){
    const v = plan.vault;
    const VR = C.height;
    const rate = st.rate;

    clearLayer('#fxLayer');
    removeActor('rival');
    /* Sides first, same as every other rung: the Vault's walkout drops the
       gilded box on the rival's mark, and the player must not be standing on
       it because the last rung ended with the two of them crossed. */
    st.ring.live = false;
    stageReset();
    markShow(true);

    /* THE CONVERGENCE. Exactly two tiers are left on the board by now — band
       4 and the Grail — and from here the crack colors light them: red the
       lower card, gold the top one. The board's endgame and the Vault's
       resolution become the same image, which is the whole reason the merge
       is worth doing, and the one place the reserved color rule is broken
       on purpose. */
    board.converge(true);

    /* ---- THE WALKOUT, and this one is the biggest in the game: the longest
       hold, the largest size comparison, a gilded box rather than a steel one,
       and the stake line reading WIN AND ONLY THE GRAIL REMAINS. */
    await sceneWalkout(plan, { rung: VR, mismatch: v.mismatch, rival: v.rival,
                               leadIndex: v.witnessIndex, edge: v.edge, upset: v.upset },
                       C.frameMs(VR, v_arc.confront, rate));

    /* ---- commit A: the Vault's pressure beat, survived by every reacher — and
       under v3.7 it holds the longest Circle in the game and the densest run of
       aborts. The largest creature in the game, taking its time, and three
       stops that come to nothing before the one that does not. */
    ringReset();
    st.ring.live = true;
    pace.scene(C.commitPlan(v.commitA, v_arc.commitA, rate).total, 1);
    await playCommit(v.commitA, v_arc.commitA, VR);
    /* The ring goes down for the rest of the Vault. Everything after this is
       staged — the gilded box rising, the WITNESS tap, the strike, the crack —
       and a drifting centre under a box that has to land on a mark is a bug,
       not a feature. */
    st.ring.live = false;
    /* TIER 2, the title shot: the big one short of the top. It rides the
       commit's own aftermath and settles into the gilded box rising, so it
       buys the run nothing. */
    celebVault(P(), (v_arc.commitA * 0.35 + v_arc.rise) / rate);
    await pace.land();

    // ---- the gilded box rises and the arena goes quiet
    pace.scene(v_arc.rise / rate, 1);
    removeActor('rival');
    await dim(0.5, Math.min(600, scale(600)));
    banner('THE VAULT', 'gold', 1600);
    stakes('The arena goes quiet.');
    const vb = addNode('#actorLayer', A.boxArt('vault'), RX-30, GY);
    st.actors.vaultBox = vb;
    await anim(vb, [
      { transform:`translate(${RX-30}px, ${GY}px)` }, { transform:`translate(${RX-30}px, ${GY-110}px)` },
    ], Math.max(1, pace.take(1)), { easing:'cubic-bezier(.3,0,.3,1)' });
    vb.style.transform = `translate(${RX-30}px, ${GY-110}px)`;
    const hover = animEl(vb).animate([
      { transform:'translateY(0px)' }, { transform:'translateY(-8px)' }, { transform:'translateY(0px)' },
    ], { duration: 2600, iterations: Infinity, easing:'ease-in-out' });
    await pace.land();

    // ---- WITNESS: the only mandatory tap in the design
    pace.scene(v_arc.witness / rate, 1);
    await ensureLead(plan, v.witnessIndex);
    setMom(P(), 'DOMINANT', scale(C.poseMs));
    if (v.goldMeteor){
      const mtr = fxAt(A.fx.meteor(), RX+40, GY-420, 2200);
      if (mtr) anim(mtr, [
        { transform:`translate(${RX+120}px, ${GY-460}px)` }, { transform:`translate(${RX-30}px, ${GY-180}px)` },
      ], Math.min(500, v_arc.witness / rate * 0.4), { easing:'cubic-bezier(.5,0,.8,.6)' });
      shake(10, 300);
      const pre = svgNode(`<g>${A.fx.crack('gold')}</g>`);
      vb.querySelector('.crackHost')?.appendChild(pre);
      banner('GOLD METEOR — CONCLUSIVE', 'gold', 1800);
      st.result.omensSeen.push('goldMeteor');
    } else {
      banner('WITNESS', 'gold big', 1400);
    }
    stakes('One tap. The crack tells the truth.');
    // Tapping early does not shorten the run, it lends its time to the beats
    // that follow — so the ritual can be answered fast without gutting it.
    await offerTap('WITNESS', { gold: true, timeout: pace.rest() });
    stakes('');

    /* ---- commit B: the strike. Vault gold ring, the last question in the game,
       and it obeys the same grammar as every other commit: the stop, the hold,
       the release. The player SWELLS; the box does not emote, which is exactly
       why this is the quietest hold in the run. */
    pace.scene(v_arc.strike / rate, 1);
    const strikeMs = pace.take(1);
    const p = P();
    const vFrame = 1000 / C.stopmo.base / rate;   // durations are frame counts; anim() steps them
    const vStop = Math.max(1, Math.min(strikeMs * 0.3, C.tellShape.stopFrames * vFrame));
    stillness(true);
    setEx(p.node, 'fierce');
    const vRing = showRing('vault', { ...p, home: RX-30 }, strikeMs * 0.6);
    pushIn(true, vStop);
    setFlinch(p, 'SWELL', vStop, C.flinch.intensity.vault);
    dustStrand(RX - 30, strikeMs * 0.6);
    await anim(animEl(p.node), [
      { transform:'translateX(0) rotate(0)' },
      { transform:'translateX(-26px) rotate(6deg)' },
    ], vStop, { fill:'forwards' });
    await wait(Math.max(1, strikeMs * 0.6 - vStop));      // the arena goes quiet
    ringPulse(vRing);
    stillness(false);
    clearFlinch(p);
    st.stepped = true;
    await anim(animEl(p.node), [
      { transform:'translateX(-26px) rotate(6deg)' },
      { transform:`translateX(${RX-30-PX-110}px) translateY(-70px) rotate(-8deg)` },
    ], Math.max(1, Math.min(strikeMs * 0.24, C.tellShape.releaseFrames * vFrame)),
       { fill:'forwards' });
    st.stepped = false;
    if (vRing) vRing.remove();
    pushIn(false, 300);
    const imp = fxAt(A.fx.impact(), RX-110, GY-150, 800);
    if (imp) anim(animEl(imp), [{transform:'scale(1)',opacity:1},{transform:'scale(3)',opacity:0}], scale(300));
    shake(C.hit.shake.finisher, 320);
    await hitstop(Math.min(scale(C.live.hitstop) * 1.4, strikeMs * 0.3));
    anim(animEl(p.node), [{ transform:`translateX(${RX-30-PX-110}px) translateY(-70px)` }, { transform:'translateX(0) translateY(0)' }], scale(420));
    await pace.land();

    // ---- the crack: this Clash is the only band-separating event in the run
    pace.scene(v_arc.crack / rate, 1);
    hover.cancel();
    const crack = svgNode(`<g>${A.fx.crack(v.crack)}</g>`);
    vb.querySelector('.crackHost')?.appendChild(crack);
    crack.querySelectorAll('path').forEach(pth => {
      const len = pth.getTotalLength();
      pth.style.strokeDasharray = len;
      pth.style.strokeDashoffset = len;
      pth.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
                  { duration: scale(360), fill:'forwards', easing:'ease-out' });
    });
    const bloom = fxAt(A.fx.bloom(v.crack), RX-30, GY-170, 4000);
    if (bloom) anim(animEl(bloom), [{ opacity:0 }, { opacity:1 }], scale(400));
    celebrate(plan.band, v.crack, RX-30, GY-150);

    /* THE BOARD RESOLVES ON THE CRACK, because the crack IS the resolution —
       the only band-separating event in the entire run. Gold rules out band
       4, which is the last burn in the game, and leaves the Grail as the only
       card standing. */
    if (v.crack === 'gold'){
      board.burn(3, v_arc.crack / rate);
      board.lock(4);
      /* TIER 3, the title raise, fired here so it spans the whole window the
         Vault already owns: crack, occlusion, decode. The doc asked for 4 to
         6 seconds; that window is 3.5s at 1x and the 30s cap outranks the
         wish, so the hoist is scaled to the time that exists. Starting it
         under the occlusion is the better staging anyway — the gold wash
         clears and the Boxling is already mid-hoist with the card in the
         air. */
      celebGrail(P(), (v_arc.crack + v_arc.occlusion + v_arc.decode) / rate);
    }
    await pace.land();

    // ---- the occlusion: nothing on screen but the result
    pace.scene(v_arc.occlusion / rate, 1);
    await occlude(v.crack, v_arc.occlusion / rate, v.crack === 'gold' ? 'GOLD.' : 'RED.');
    await pace.land();

    if (v.crack === 'red'){
      setMom(P(), 'PRESSURED', scale(C.poseMs));
