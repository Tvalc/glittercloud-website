       commit that authors two beats always has room to hold them. */
    return { gain, atk, def, two: C.isArcCommit(cm) };
  }
  function flinchTurn(arc, a, d, ms){
    if (arc.atk.length > 1) setFlinch(a, arc.atk[1], ms, arc.gain);
    if (arc.def.length > 1) setFlinch(d, arc.def[1], ms, arc.gain);
  }

  /* THE STOP, and the hold after it. Everything that was moving stops moving:
     the idle bob ends, the scuffle dust settles, the ambience hushes, the board
     freezes and dims.

     This is deliberately NOT freeze() — freeze() stops the frame grid itself,
     and the whole point of the hold is that the tremor and the ring are still
     alive inside it. A dead frame is a dropped frame; a still one is a threat. */
  function stillness(on){
    st.still = !!on;
    /* v3.7: the ring stops with everything else. "Everything that was moving
       stops moving" is the Tell's first instruction, and after this revision
       the thing moving most is the orbit. One flag, set here, so a Tell and an
       abort freeze the fight identically — which is what acceptance test 25
       depends on. */
    st.ring.hold = !!on;
    Object.keys(st.fighters).forEach(k => { const f = st.fighters[k]; if (f) f.still = !!on; });
    const svg = q('#arenaSvg');
    if (svg) svg.classList.toggle('hush', !!on && vfx());
    if (!on) return;
    const l = q('#fxLayer');
    if (!l) return;
    l.querySelectorAll('.fxScuffle, .fxPuff, .fxDust').forEach(n => {
      const host = n.closest('.pos') || n;
      anim(host, [{ opacity:1 }, { opacity:0 }], scale(120), { fill:'forwards' });
    });
  }

  /* ...and the one thing allowed to move during the hold: a single strand of
     dust falling through the frame. Stillness needs a witness, or it reads as
     a dropped frame rather than as held breath. */
  function dustStrand(x, ms){
    if (!C.tellShape.dustStrand || !vfx() || st.skipping || ms < 160) return;
    const n = fxAt(`<g class="fxStrand"><circle r="1.7" fill="#dff1ff" opacity="0.85"/>
                    <circle cy="10" r="1.1" fill="#cfe0f0" opacity="0.5"/></g>`,
                   x + 46, GY - 170, ms + 400);
    if (!n) return;
    anim(animEl(n), [
      { transform:'translateY(0px)', opacity:0 },
      { transform:'translateY(26px)', opacity:0.9, offset:0.28 },
      { transform:'translateY(150px)', opacity:0 },
    ], Math.max(1, ms), { easing:'linear', fill:'forwards' });
  }

  // place() and poseNow() are now the same act: aim the puppet somewhere.
  // The rig decides which frames it is actually seen on.
  const place   = (f, ms) => { if (f) retarget(f, ms); };
  const poseNow = (f, ms) => { if (!f) return;
    f.node.dataset.mom = f.mom;
    setEx(f.node, C.momentum.states[f.mom].ex);
    retarget(f, ms);
  };
  function setMom(f, state, ms, poseOnly){
    if (!f) return;
    const changed = f.mom !== state;
    f.mom = state;
    /* NO RESET, and this deleted line is most of it.
       A state change used to zero the knockback, which meant that the moment a
       commit resolved, both bodies walked back to an even distance, squared up
       and ready. That neutral standoff IS a turn boundary and it is felt as one
       whatever the durations do. Position is inherited now: the Aftermath
       leaves the bodies where the commit put them — attacker overextended and
       off the inside line, defender turned out of position — and the next
       Circle starts from exactly there. Nothing is re-centred, nothing is
       re-squared, and no fighter walks back to a mark.

       Knockback still recovers, but it recovers by ORBITING out of it during
       the Circle (see circleFor), which is a body working its way back to a
       good position rather than a body being teleported to one. */
    if (changed && !st.ring.live) f.kb = 0;
    f.node.dataset.mom = state;
    setEx(f.node, C.momentum.states[state].ex);
    // poseOnly (the confrontation frame) means posture without ground given
    if (poseOnly) f.holdGround = true;
    retarget(f, ms != null ? ms : scale(state === 'DOWN' ? C.poseMs * 1.6 : C.poseMs));
  }

  /* A TRUE HOLD. The frame grid stops — the puppet, the particles, the snow,
     all of it. This is the one place a dead stop is right: the instant of
     impact. Everywhere else the puppet keeps breathing, because a dead hold
     reads as a broken projector and that is what "too many stops" is. */
  async function freeze(ms){
    if (ms < 16 || st.skipping) return;
    st.frozen++;
    await hitstop(ms);
    st.frozen = Math.max(0, st.frozen - 1);
  }
  function knockback(f, dist, ms){
    f.kb += dist;
    place(f, ms);
  }

  /* ============ THE STRIKE POSITION IS KEPT, NOT HANDED BACK ============
     A strike's travel was a composited transform on `.anim`, and the Aftermath
     used to animate it back to zero over ~150-400ms with an ease. That is the
     "bounce backwards" a playtest reported, and it is wrong twice over: it
     makes the striker retreat from the body it just hit, and it walks a fighter
     back to a mark, which is the exact thing NO RESET exists to delete.

     This makes the travel REAL instead. The attacker's radius closes by exactly
     the distance it covered, the transform is cancelled in the same frame, and
     the body does not move a pixel — it simply stops being an offset and starts
     being a position. From there the orbit reopens the distance the way it
     reopens everything else, because the fighters are working for position
     again rather than being returned to one.

     Whatever the radius clamp refuses is left on the transform rather than
     discarded, so a lunge that would drive the attacker through the shared
     centre still ends up looking committed instead of snapping short. */
  function foldLunge(f){
    if (!f) return;
    const el = animEl(f.node);
    /* MEASURED, NOT DECLARED. The travel is read back off the element rather
       than recomputed from the reach that was planned for it, because by the
       time a commit resolves the plan is out of date: a slip composites an
       overshoot on top of the strike, a dodge adds another, and the defender
       has moved since the reach was worked out. Whatever the body is actually
       displaced by is what gets folded, so this cannot drift out of agreement
       with what is on screen. */
    let local = 0;
    try { local = new DOMMatrixReadOnly(getComputedStyle(el).transform).m41; } catch(e){ return; }
    if (!local) return;
    /* THE LUNGE BECOMES A RIG QUANTITY, and the first two attempts at this are
       worth recording because both failed in instructive ways.

       Folding it into the RADIUS looked natural and does not work: a strike
       covers most of the distance between the two bodies, the radius floor
       refuses the bulk of it, and whatever the floor refuses has to be left on
       the transform — where nothing ever cleared it. The offset persisted, the
       next commit folded another one on top, and by the third clash of a rung
       the two bodies measured 3px apart and were standing inside each other.
       Clamping the fold to contact distance did not help either, because the
       leftover was recomputed from the clamp and pushed the body straight back
       out again.

       So it is its own term. `f.lunge` is an arena-x offset the rig adds, which
       means it is subject to nothing and clamps against nothing: the attacker
       holds exactly where the strike put it for the whole Aftermath — the beat
       where "it stayed on top of them" has to read — and then dissolves during
       the next Circle, while both bodies are working for position anyway. That
       is a fighter recovering its stance, which is what should happen, rather
       than a fighter being handed back to a mark, which is what used to. */
    f.lunge = (f.lunge || 0) + local * f.scale * f.dir;
    /* Cancel rather than let them finish: a `fill: forwards` animation keeps
       asserting its final transform, so the fold would be ADDED to the travel
       instead of replacing it and the body would end up twice as far in. */
    try { el.getAnimations().forEach(a => a.cancel()); } catch(e){}
    el.style.transform = '';
    render(rig.frame);          // same frame, so there is nothing to see
  }
  const P = () => st.fighters.player;
  const R = () => st.fighters.rival;

  /* ===================== THE PLAYER'S CARET =====================
     Created once and then simply moved. It lives in its own layer so the fx
     sweeps never take it — identity is not an effect, and a mark that
     disappeared when the dust was cleared would be worse than no mark at all.

     It is shown only while there is a fight to identify a body in. During the
     opener the player IS the box, and during a receipt there is nothing to
     point at; a caret hanging over either is noise. */
  function markShow(on){
    const l = q('#markLayer');
    if (!l) return;
    if (!on){ l.innerHTML = ''; return; }
    if (!l.firstChild){
      const n = svgNode(`<g class="pos">${A.fx.playerMark()}</g>`);
      l.appendChild(n);
      /* Placed on the frame it is created, not on the next one. A fresh SVG
         group sits at the origin until something moves it, and the rig only
         moves it during a render — so without this the caret appeared once in
         the top-left corner of the arena before snapping onto the body.
         Measured: exactly one frame, 871px out. One frame is enough to see. */
      const p = P();
      if (p) markAt(fx_(p), 0, p.scale);
    }
  }
  function markAt(x, rise, scale){
    const l = q('#markLayer');
    const n = l && l.firstChild;
    if (!n) return;
    /* Above the head, and it rises with the body rather than sitting at a
       fixed altitude — otherwise a BUCKLING Boxling sinks and its caret does
       not, which reads as the mark belonging to the arena instead of the
       creature. `rise` is positive downward, like everywhere else in the rig. */
    n.style.transform = `translate(${x.toFixed(1)}px, ${(GY - 150 * scale + rise).toFixed(1)}px)` +
                        ` scale(${Math.max(0.6, scale).toFixed(3)})`;
  }

  /* ==================================================================
     THE BOARD IS THE MOUNTAIN — and the position indicator, because they
     are all one object.

     The box's five value bands drawn as rungs up the triangle at the back of
     the arena, Floor at the wide base, the Grail at the narrow peak. It is
     the published drop table drawn as money, so it can be on screen from the
     first frame without leaking anything, and it only ever removes what a
     clash has already proved. Deal or No Deal is the precedent and it is
     structurally this product: sealed contents, elimination as the reveal,
     what remains as the stake. Predetermination does not kill an elimination
     board — the board is HOW a predetermined outcome gets felt.

     The merge is the point, twice over. A ladder bug and a prize board would
     compete for the same half-second glance, so the boundary between
     burned-below and live-above IS the height read; and the mountain the
     player is already looking at is the thing being climbed, so the ladder
     belongs on it rather than beside it. Nothing here counts rungs. The count
     of hollows under the boundary does that for free.

     A rung carries a glyph and a position and no text at all — text that far
     back is text nobody reads. What a tier is WORTH arrives by flyout.
     ================================================================== */
  const board = {
    burned: [], lockedI: -1, flew: false,

    /* The rungs are part of the arena's own markup, so they survive between
       runs and are never rebuilt — always on, never repositions. Starting a
       run only resets their state. */
    build(){
      this.burned = []; this.lockedI = -1; this.flew = false;
      C.board.rungs.forEach(r => {
        const el = this.at(r.i);
        if (el){ el.setAttribute('class', 'lrung'); el.style.removeProperty('--fold'); }
      });
      clearLayer('#boardLayer');
      this.duck(false);
    },
    at(i){ return q('#lrung-' + i); },

    /* Its update window is the Aftermath, shared with the burn it is
       displaying. During a Tell and a Clash the fight owns the screen and the
       mountain dims back with the rest of the periphery. */
    duck(on){
      const m = q('#mountain');
      if (m) m.classList.toggle('duck', !!on && vfx());
      // A Tell is the hard boundary. The flyout is allowed to run past its
      // Aftermath and into the Circle that follows, but the moment a ring
      // goes down on the ground the fight owns the screen outright — so any
      // card still in the air is cleared here rather than left to compete
      // with a telegraph.
      if (on) this.clearFlights();
    },
    clearFlights(){
      const layer = q('#boardLayer');
      if (!layer) return;
      layer.querySelectorAll('.burnFlight').forEach(g => {
        if (g.dataset.done) return;
        g.dataset.done = '1';
        anim(g, [{ opacity: 1 }, { opacity: 0 }], scale(140), { fill: 'forwards' });
        setTimeout(() => g.remove(), 400);
      });
    },

    /* ------------------------------------------------------- THE FLYOUT
       One primitive, three jobs: a tier card leaves its rung, grows to a
       readable size, and travels somewhere. The burn shatters it there, the
       lock parks it there, and the Grail hands it to the Boxling. Because the
       rung geometry is config's and not art's private business, the card
       always launches from exactly where the rung is drawn. */
    flyCard(bandI, opts = {}){
      const r = C.board.rungs[bandI], c = C.board.card;
      const t = C.boardTiers()[bandI];
      if (!r || !t || !vfx() || st.skipping) return null;
      const layer = q('#boardLayer');
      if (!layer) return null;

      const g = svgNode(`<g class="tflight">${A.tierCard(t, { tone: opts.tone })}</g>`);
      layer.appendChild(g);
      const k0 = r.w / c.w;                        // the card, shrunk onto its rung
      g.style.transform = `translate(${r.cx}px, ${r.cy}px) scale(${k0.toFixed(4)})`;

      const to = opts.to || { x: c.x, y: c.y, k: 1 };
      const ms = Math.max(1, opts.ms || 300);
      anim(g, [
        { transform: `translate(${r.cx}px, ${r.cy}px) scale(${k0.toFixed(4)})`, opacity: 0.4 },
        { transform: `translate(${to.x}px, ${to.y}px) scale(${(to.k || 1).toFixed(4)})`, opacity: 1 },
      ], ms, { easing: 'cubic-bezier(.2,.9,.3,1)', fill: 'forwards' });
      g.dataset.x = to.x; g.dataset.y = to.y; g.dataset.k = to.k || 1;
      return g;
    },

    /* THE STAKE, BROUGHT FORWARD — the walkout's fifth beat.
       The tape's last slab names a band; this is that band, off the mountain
       and at a readable size, so the sentence and the money are one image
       instead of two a beat apart.

       IT DOES NOT BURN, and that distinction is the whole of what keeps the
       board honest. A burn is a claim that a clash PROVED something; this is
       before the fight, so nothing has been proved and the card goes back to
       its rung untouched. Same flight, same landing spot, no pop, no shatter,
       and the rung never changes state.

       It leaks nothing for the same reason the stake line does not: which tier
       is at stake here is a function of rung index, and it is already on the
       board in plain sight. All this does is make it legible. */
    previewTier(bandI, ms){
      if (bandI < 0 || this.burned.includes(bandI)) return;
      const B = C.board, c = B.card;
      const beat = Math.max(220, ms);
      const fly  = Math.max(1, beat * 0.34);
      /* IT OUTLIVES ITS BEAT, exactly as a burn's flyout does and for the same
         reason: squeezing fly-hold-return into the beat left ~180ms at full
         size, which is a flash — you see that something came forward without
         ever reading what it was worth, and reading it is the entire job.

         So the hold takes `board.extend` on top and the card is still at the
         front as the fight drops into its first Circle, the one beat where
         nothing can end anything. It costs the run nothing, because this is
         fired and never awaited: the timeline walks on and both caps are
         untouched. */
      const hold = beat * 0.30 + scale(B.extend);
      const g = this.flyCard(bandI, { ms: fly });
      if (!g) return;
      /* Tagged like a burn's flight so a Tell clears it too — the board may
         never compete with a telegraph ring, and a walkout runs straight into
         a Circle that ends in one. */
      g.classList.add('burnFlight');
      const r = B.rungs[bandI], k0 = r.w / c.w;
      const back = Math.max(1, beat * 0.26);
      setTimeout(() => {
        if (!g.isConnected || g.dataset.done) return;
        g.dataset.done = '1';
        anim(g, [
          { transform:`translate(${c.x}px, ${c.y}px) scale(1)`, opacity:1 },
          { transform:`translate(${r.cx}px, ${r.cy}px) scale(${k0.toFixed(4)})`, opacity:0.35 },
        ], back, { easing:'cubic-bezier(.4,0,.7,1)', fill:'forwards' });
        setTimeout(() => { if (g.isConnected) g.remove(); }, back + 140);
      }, fly + hold);
    },

    // a tier that was already gone before this scene started — no flyout and
    // no crowd pop, because nothing just happened
    preburn(bandI){
      const el = this.at(bandI);
      if (!el || this.burned.includes(bandI)) return;
      this.burned.push(bandI);
      el.setAttribute('class', 'lrung burned');
    },

    /* A BURN IS GOOD NEWS AND IS STAGED AS A WIN. The tier flies off the
       ladder, holds at the front long enough to be read — this is the only
       moment in the run the player learns what that band was worth — and then
       cracks and shatters upward on a crowd-pop beat.

       `ms` is whatever the Aftermath actually had spare — 400 to 660ms
       depending on the commit — and fitting all three phases inside it made
       the card a flash rather than a read: you saw that something happened
       without ever learning what the band was worth, which is the whole job.
       So the hold gets `C.board.extend` on top and the flyout runs past its
       beat into the Circle that follows, where nothing can end anything.

       It costs the run nothing, because this is fired and never awaited: the
       timeline walks on without it and both caps are untouched. A Tell clears
       whatever is still in the air, so it can never reach a telegraph ring.
       The shards outlive even that — debris is not information. */
    burn(bandI, ms){
      const el = this.at(bandI);
      if (!el || this.burned.includes(bandI)) return;
      this.burned.push(bandI);
      if (!vfx() || st.skipping){ el.setAttribute('class', 'lrung burned'); return; }

      const B = C.board, c = B.card;
      const beat = Math.max(220, Math.min(scale(B.burn), ms || scale(B.burn)));
      const fly  = beat * B.fly;
      const gone = beat * (1 - B.fly - B.hold);
      const hold = beat * B.hold + scale(B.extend);   // the read gets the extra

      const g = this.flyCard(bandI, { ms: fly });
      if (!g){ el.setAttribute('class', 'lrung burned'); return; }
      g.classList.add('burnFlight');                  // a Tell may clear this one

      /* The rung goes dark on its own timer, unconditionally. The card in
         front of it is preemptable and the rung is not: if a Tell clears the
         flight early, the board must still end up telling the truth about
         what the clash proved. */
      setTimeout(() => el.setAttribute('class', 'lrung burned'), fly + hold);

      setTimeout(() => {
        if (!g.isConnected || g.dataset.done) return;
        g.dataset.done = '1';
        // the pop, then the break: the card is what shatters, never the ground
        const pop = svgNode(`<rect class="tcPop" x="${-c.w/2 - 8}" y="${-c.h/2 - 8}"
                              width="${c.w + 16}" height="${c.h + 16}" rx="12"/>`);
        g.appendChild(pop);
        const shards = svgNode(A.tierShards());
        shards.style.setProperty('--burn', Math.round(gone) + 'ms');
        g.appendChild(shards);
        const card = g.querySelector('.tcard');
        if (card) anim(card, [{ opacity: 1 }, { opacity: 0 }], Math.max(1, gone * 0.4), { fill: 'forwards' });
        setTimeout(() => g.remove(), gone + 900);
      }, fly + hold);
    },

    /* THE CONVERGENCE. At the Vault exactly two rungs are left, and the crack
       colors light them: red the lower, gold the top. The board's endgame and
       the Vault's resolution become the same image. This is the one licensed
       exception to the reserved color rule, because here the meanings
       genuinely converge rather than collide. */
    converge(on = true){
      const lo = this.at(3), hi = this.at(4);
      const set = (el, cls) => { if (!el) return;
        el.classList.toggle(cls, on && vfx()); };
      set(lo, 'vaultLow'); set(hi, 'vaultHigh');
    },

    /* HOW DEATH IS STAGED — the Deal or No Deal warning, applied.
       The player's tier does not survive by default: it IGNITES, flares and
       locks. The rungs still above it do not burn, do not shatter and are not
       dramatized in any way — they dim and fold flat in half a beat, as
       background business, while the won tier takes the light.

       DoND stages the missed millions for television cruelty. We stage the
       opposite: Post, van den Assem, Baltussen & Thaler (AER 2008) found that
       risk aversion DECREASES once expectations are shattered — "losers" keep
       playing and reject offers above the average of what is left, chasing
       the board they used to have. Locked, not lost. */
    lock(bandI){
      this.lockedI = bandI;
      this.converge(false);
      const fold = scale(C.board.fold);
      const dramatize = C.live.lossStaging === 'burn';    // the A/B arm only
      for (let i = bandI + 1; i < C.board.rungs.length; i++){
        const t = this.at(i);
        if (!t || this.burned.includes(i)) continue;
        t.style.setProperty('--fold', Math.round(fold) + 'ms');
        t.classList.add(dramatize ? 'foldBurn' : 'folded');
      }
      const el = this.at(bandI);
      if (!el) return;
      el.classList.add('locked');
      if (vfx()){
        el.classList.add('igniting');
        setTimeout(() => el.classList.remove('igniting'), scale(C.board.ignite) + 40);
      }
    },

    /* ...and its card flies out to the front and stays there as the receipt
       begins. This runs in the epilogue, after the arc has closed, so it
       costs the run nothing and neither cap can feel it. */
    present(){
      // the Grail's card already left the ladder for the Boxling's hands;
      // flying it again would be staging the same beat twice
      if (this.flew || this.lockedI < 0 || st.skipping) return;
      this.flyCard(this.lockedI, { ms: scale(C.board.slide), tone: 'lockTone' });
    },

    /* THE GRAIL, and only the Grail: the top card leaves the mountain and
       descends into the Boxling's hands to be hoisted. */
    descend(f, ms){
      if (!f) return null;
      const b = f.node.getBoundingClientRect();
      const svg = q('#arenaSvg');
      if (!svg || !b.width) return null;
      // screen pixels back into viewBox units, so the card lands on the body
      // rather than near it whatever the pane is cropping
      const s = svg.getBoundingClientRect();
      const k = Math.max(s.width / 960, s.height / 540);
      const x = (b.left + b.width / 2 - s.left - (s.width - 960 * k) / 2) / k;
      const y = (b.top - s.top - (s.height - 540 * k) / 2) / k;
      const g = this.flyCard(4, { ms, tone: 'goldTone',
                                  to: { x, y: Math.max(120, y - 34), k: 0.62 } });
      if (g) this.flew = true;
      return g;
    },
  };

  /* THE GLANCE TEST, as an affordance rather than a claim: flash a mid-run
     board state for half a second at someone who has never seen the game and
     ask how far up the run is. It passes if the count reads without
     instruction. Nothing else on screen, and half a second is half a second. */
  function glanceTest(burnCount = 2, ms = 500){
    const m = q('#mountain');
    if (!m) return;
    board.build();
    for (let i = 0; i < burnCount; i++) board.preburn(i);
    m.style.visibility = 'hidden';
    setTimeout(() => { m.style.visibility = ''; }, 300);
    setTimeout(() => { m.style.visibility = 'hidden'; }, 300 + ms);
    setTimeout(() => { m.style.visibility = ''; board.build(); }, 300 + ms + 2600);
  }

  /* The nameplate carries no health. With one Boxling packed it says who is
     in the ring and whether they have gone down — two states, no numbers.
     It still walks the member list, because the states are per-index and the
     stage marks them by index. */
  function buildTeam(pack){
    const t = st.hud.team; t.innerHTML = '';
    pack.members.forEach((m, i) => {
      const sp = C.species.find(s => s.id === C.speciesId(m.speciesId)) || C.species[0];
      const cw = C.colorways.find(c=>c.id===m.colorway) || C.colorways[0];
      const d = document.createElement('div');
      d.className = 'chip';
      d.dataset.idx = i;
      // The dot is the colorway the player picked and nothing else. It used
      // to carry an inset ring in the species' element color, which was a
      // type badge wearing a different name — exactly the kind of thing you
      // had to know a rule to read.
      d.innerHTML = `<span class="dot" style="background:${cw.body}"></span>
        <span class="cname">${sp.name}${i===pack.charmIndex?' <span class="charm">◈</span>':''}</span>`;
      t.appendChild(d);
    });
  }
  function teamMark(idx, cls){
    const chip = st.hud.team.querySelector(`[data-idx="${idx}"]`);
    if (!chip) return;
    if (cls === 'lead') st.hud.team.querySelectorAll('.chip').forEach(c=>c.classList.remove('lead'));
    chip.classList.add(cls);
  }
  function dim(opacity, ms=600){
    const d = q('#dimmer');
    return anim(d, [{opacity: d.getAttribute('opacity')||0},{opacity}], scale(ms))
      .then(()=>d.setAttribute('opacity', opacity));
  }

  /* THE CAMERA. Tilting the ground line toward the stronger side is the second
     half of the mismatch read: you are literally looking up at whoever is
     going to be a problem. */
  function tilt(dir, ms){          // dir: -1 player stronger, +1 rival stronger, 0 level
    const w = q('#world');
    if (!w) return;
    const deg = (vfx() ? C.confront.tiltDeg : 0) * dir;
    const dy  = (vfx() ? C.confront.horizonDrop : 0) * Math.abs(dir);
    w.style.transitionDuration = Math.round(ms) + 'ms';
    w.style.transform = `translate(0px, ${dy}px) rotate(${deg}deg)`;
  }
  /* THE AURA SAYS THREAT WITH AGITATION, NOT WITH HUE. It used to be cool blue
     for a beatable rival and hot red for a dangerous one — and with ICE and
     WATER on the roster, both blue, every ICE rival would have read as
     beatable regardless of what it actually was. Colour is spoken for: the
     rings own amber, red and gold, and the creatures own their materials. So
     the aura went achromatic and carries the same information as turbulence.
     `calm` breathes slowly and small; `agitated` churns. */
  function aura(f, kind, on, ms){
    const g = f && f.node.querySelector(':scope > .aura');
    if (!g) return;
    const set = kind === 'agitated' ? C.confront.auraAgitated
              : kind === 'calm'     ? C.confront.auraCalm : null;
    g.setAttribute('class', 'aura ' + (kind || ''));
    g.style.transitionDuration = Math.round(ms) + 'ms';
    if (set){
      g.style.setProperty('--auraRate', (2.6 / Math.max(0.05, set.rate)).toFixed(2) + 's');
      g.style.setProperty('--auraSwell', set.swell);
    }
    g.style.opacity = (on && vfx()) ? (set ? set.opacity : 1) : 0;
  }
  /* ...and the third leg of the same read, which is the one that survives
     every filter: a dangerous body sits in a heavier, darker shadow. Together
     with SIZE these three make threat legible on a greyscale screenshot, which
     the colour version never was. */
  function shadow(f, heavy){
    const g = f && f.node.querySelector(':scope > .shade');
    if (!g) return;
    g.style.opacity = String(heavy ? C.confront.shadowHeavy : C.confront.shadowLight);
    g.style.transform = `scale(${heavy ? 1.16 : 0.9}, ${heavy ? 1.22 : 0.86})`;
  }

  /* Full-screen occlusion: at the crack there is nothing on screen but the
     result. Length is a function of the band and nothing else. */
  async function occlude(kind, ms, word){
    const o = st.hud.occlude;
    if (ms <= 0 || !vfx()){ if (word) banner(word, kind === 'gold' ? 'gold big' : 'bad big', 1400); return; }
    o.className = 'shown ' + kind;
    o.innerHTML = `<span>${word || ''}</span>`;
    await wait(ms);
    o.className = 'fading ' + kind;
    setTimeout(()=>{ o.className = ''; o.innerHTML = ''; }, 420);
  }

  /* ------------------------------------------------------- THE FILMSTRIP
     The beat budget, drawn. Every cell is one authored beat, sized to the ms
     the pacer will hand it, so the strip is the run's shot list at scale —
     and the playhead running across it is the run actually happening, which
     makes budget-versus-real visible instead of a claim.

     It also enforces the design's own padding rule. A cell only counts as a
     STATE CHANGE if something visibly moves in it; the strip measures the gap
     between consecutive changes and paints any stretch over
     CONFIG.paddingLimit red. If a stretch has no state change it is padding —
     the strip is where you see that, and it is why dragging occlusion to 2.5s
     lights up. */
  const FILM = {
    op:      { cls:'op',    change:true  },
    coil:    { cls:'op',    change:true  },
    stop:    { cls:'stop',  change:false },
    settle:  { cls:'hold',  change:false },
    confront:{ cls:'con',   change:true  },
    walk:    { cls:'walk',  change:true  },   // the arrival, the burst, the clear
    tape:    { cls:'tape',  change:true  },   // the tale of the tape, held to be read
    circle:  { cls:'circle',change:true  },   // continuous motion — always changing
    /* A Tell is a FREEZE, and the freeze is the content: near-total stillness
       is what the viewer is meant to brace against, so it can never be padding. */
    tell:    { cls:'tell',  change:true  },
    clash:   { cls:'hit',   change:true  },
    // The stop is deliberately a dead frame — it is the one place where
    // nothing changing IS the content, so it never counts as padding.
    stop:    { cls:'stop',  change:true  },
    after:   { cls:'hold',  change:true  },
    rise:    { cls:'vault', change:true  },
    witness: { cls:'vault', change:true  },   // banner, the tap, the stance
    crack:   { cls:'crack', change:true  },
    occ:     { cls:'occ',   change:false },   // a static color, by design
    decode:  { cls:'hold',  change:true  },
  };

  /* Re-derives exactly what playRun will allocate. Kept as a separate pass
     rather than recorded during the run, because a filmstrip you can only
     read after the fact is a receipt, not a plan. */
  function filmCells(plan){
    const cells = [];
    const add = (kind, label, ms) => { if (ms > 0) cells.push({ kind, label, ms }); };
    const t = C.openerBeats();
    const lossW = plan.openerContinue ? 1 : C.lossDelta;
    add('op','box drops', scale(t.drop*lossW));
    add('coil','it walks in', scale(t.coil*lossW));
    add('op','the wind-up', scale(t.windup*lossW));
    add('stop','hitstop', scale(t.hitstop*lossW));
    add(plan.openerContinue ? 'op' : 'clash',
        plan.openerContinue ? 'burst · it swings' : 'the gag', scale(t.branch*lossW));
    add('settle','settle', scale(t.settle*lossW));

    /* Each commit contributes its four phases as four cells, so the strip IS
       the commit grammar drawn out: you can see the circle breathe, the tell
       plant, the clash land, the aftermath reset — and how that shape changes
       when you move a chip. */
    const a = C.arc[plan.band], rate = st.rate;
    /* The Aftermath is where the board's burn and the signature move land, so
       the cell says so — that is the proof they cost the run nothing, because
       the cell's width does not change when they fire. */
    const addCommit = (cm, ms, rungNo) => {
      const ph = C.commitPlan(cm, ms, rate);
      const burns = C.burnedBySurviving(rungNo, cm.index);
      const rides = !cm.fatal
        ? [burns >= 0 ? 'burn' : null, cm.finish ? 'signature' : null].filter(Boolean).join(' + ')
        : '';
      add('circle', 'circle', ph.circle);
      add('tell', `${cm.owner} · ${cm.ring}${ph.slow > 1 ? ' · slow' : ''}`, ph.tell);
      add('clash', cm.fatal ? 'CLASH · fatal' : cm.finish ? 'CLASH · finish' : 'CLASH · survived', ph.clash);
      add('stop', `THE STOP · ${(ph.hold/1000).toFixed(1)}s`, ph.hold);
      add('after', rides ? `aftermath · ${rides}` : 'aftermath', ph.after);
    };
    /* A walkout contributes its four beats as four cells, so the strip shows
       that the presentation has a STRUCTURE — arrival, burst, the tape, the
       clear — and shows what turbo does to it: the card compresses to a frame
       hold and the clear disappears, and nothing else is skipped. */
    const addFrame = (rung, authored, label) => {
      const ms = C.frameMs(rung, authored, rate);
      if (!C.hasWalkout(rung)){ add('confront', label, ms); return; }
      const W = C.walkout, turbo = rate > 1;
      const w = { arrive: W.arrival, burst: W.burst,
                  card:  turbo ? W.turboCard  : W.card,
                  stake: turbo ? W.turboStake : W.stake,
                  clear: turbo ? 0 : W.clear };
      const tot = w.arrive + w.burst + w.card + w.stake + w.clear;
      add('walk', 'the arrival', ms * w.arrive / tot);
      add('walk', 'the burst',   ms * w.burst  / tot);
      add('tape', label,         ms * w.card   / tot);
      /* The stake gets its own cell, because a beat the strip cannot see is a
         beat the padding rule cannot police — and this one is 500ms of a
         2.5s walkout, which is far too much to be invisible to the instrument
         that exists to catch exactly that. */
      add('tape', `stake · ${(C.boardTiers()[C.stakeTier(rung)] || {}).name || 'the climb'}`,
                                 ms * w.stake  / tot);
      add('walk', 'clear',       ms * w.clear  / tot);
    };
    plan.rungs.forEach(r => {
      const rg = a.rungs[r.rung];
      if (!rg) return;
      addFrame(r.rung, rg.confront, `rung ${r.rung-1} · ${r.mismatch}`);
      r.commits.forEach((cm, i) => addCommit(cm, rg.commits[i] != null ? rg.commits[i] : rg.commits[rg.commits.length-1], r.rung));
    });

    if (plan.vault && a.vault){
      const v = a.vault;
      addFrame(C.height, v.confront, `the Vault · ${plan.vault.mismatch}`);
      addCommit(plan.vault.commitA, v.commitA, C.height);
      add('rise','the gilded box rises', v.rise / rate);
      add('witness','WITNESS', v.witness / rate);
      add('tell','player · vault gold', v.strike / rate);
      add('crack', plan.vaultWin ? 'GOLD' : 'RED', v.crack / rate);
      add('occ','occlusion', v.occlusion / rate);
      if (v.decode) add('decode','the prize decodes', v.decode / rate);
    }
    return cells;
  }

  function buildFilm(plan){
    const el = st.hud.film;
    if (!el) return;
    st.film = null;
    document.body.classList.toggle('film', !!C.live.filmstrip);
    if (!C.live.filmstrip){ el.innerHTML = ''; return; }

    const cells = filmCells(plan);
    const total = cells.reduce((a,c)=>a+c.ms, 0);

    /* Padding audit: how long the frame can sit with nothing changing. A beat
       that IS a change is changing throughout its own duration, so it resets
       the clock rather than spending it — only the dead beats accumulate. */
    let sinceChange = 0, worst = 0;
    cells.forEach(c => {
      const f = FILM[c.kind] || FILM.after;
      sinceChange = f.change ? 0 : sinceChange + c.ms;
      c.gap = sinceChange;
      worst = Math.max(worst, sinceChange);
    });
    const limit = scale(C.paddingLimit);
    cells.forEach(c => { c.padding = c.gap > limit; });

    el.innerHTML =
      `<div class="filmCells">${cells.map(c => {
        const f = FILM[c.kind] || FILM.after;
        return `<i class="fcell k-${f.cls}${c.padding?' padding':''}" style="flex:${c.ms.toFixed(1)}"
                   title="${c.label} · ${Math.round(c.ms)}ms"><b>${c.label}</b></i>`;
      }).join('')}</div>` +
      `<i class="filmHead"></i>` +
      `<span class="filmTot">${(total/1000).toFixed(1)}s${worst > limit ? ' · PADDING' : ''}</span>`;
    el.classList.toggle('overBudget', worst > limit);
    st.film = { el, total, head: el.querySelector('.filmHead') };
  }
  function filmTick(elapsed){
    if (!st.film) return;
    const k = Math.min(1, elapsed / st.film.total);
    st.film.head.style.left = (k * 100) + '%';
    st.film.head.classList.toggle('past', elapsed > st.film.total + 250);
  }

  // ---------------------------------------------------------------- mount
  function mount(stageEl, hudRefs){
    st.stage = stageEl; st.hud = hudRefs;
    stageEl.innerHTML = A.arena();
    hudRefs.action.addEventListener('click', () => { if (st.tapResolve) st.tapResolve(); });
    refit();
    // Resizing mid-run must not strand a fighter off-frame.
    let t = null;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(refit, 120); });
  }

  // ------------------------------------------------------------- the clash
  /* THE CLASH is the only place hit juice fires. Hitstop, screenshake, an
     impact that starts big and gets bigger, squash on the struck body, and
     knockback that moves it. Scuffle contacts during a Circle get dust and
     nothing else — that separation is what makes a commit feel decisive and
     the circling feel harmless. */
  /* THE CLASH, in two halves.
     First THE STOP: the panel goes up and the entire world holds on it —
     puppets, particles, snow, the frame grid itself. Nothing moves, because a
     comic panel is a still image. That hold is the attention signal, and its
     LENGTH is the size of the hit: a beat for a light connect, well over a
     second for a finisher.
     Then THE CONSEQUENCE: only once the panel clears do the shake, the
     squash and the knockback play. Reversing that order was the mistake —
     a hit that shakes and then stutters reads as a glitch; a hit that stops
     the world and then throws the body reads as a punch. */
  /* THE CLASH RESOLVES FOUR WAYS, and they must not look alike — the whole
     read of a fight is which of these just happened.

       block     the guard holds. A shield arc, hard sparks, a shove. The
                 defender is pushed but planted, and nothing bursts.
       dodge     the body is gone. An afterimage where it was and the attack
                 tearing through air past it. No contact, barely a pause,
                 because the point is that nothing happened.
       land      it connects and the defender stays up. Burst, real knockback,
                 a proper stop — this is the near-finish.
       critical  it connects and ends someone. The full comic panel, the
                 longest stop in the game, the world holding on one frame. */
  async function resolveClash(cm, owner, ms, holdMs){
    const kind = cm.resolve || C.resolveKey(cm);
    const atk = owner === 'player' ? P() : R();
    const def = owner === 'player' ? R() : P();
    if (!atk || !def){ await wait(ms + (holdMs || 0)); return kind; }

    const weight = C.clashWeight(cm);
    /* WHETHER THE THING THAT ARRIVED WAS A BODY OR A BOLT. Every arm below
       already draws the attacker and the defender separately, which is why this
       is a flag rather than a second copy of the vocabulary — but three of the
       four arms move the ATTACKER as part of their read (the overshoot on a
       miss, the rebound off a guard, the overreach on a slip), and a ranged
       attacker never left its mark. Moving it anyway would undo the one thing
       the discharge exists to say. */
    const ranged = C.isRanged(cm);
    const aEl = C.elements[atk.element] ? atk.element : 'fire';
    let hx = drawnX(def) + 60 * def.dir, hy = GY - 62 * def.scale;   // def guaranteed by the guard above
    const dNode = animEl(def.node);
    const flash = q('#flash');
    /* The brace the defender played on the way in is held with `forwards`, so
       it would mask everything below — an inline hit pose most of all. Every
       arm of the Clash writes the defender's body itself, so the element is
       handed over clean and each outcome starts from neutral.

       The inline transform goes WITH the animations, and that pairing is not
       optional: a hit pose written inline is masked for the rest of its own
       commit by the recovery animation that follows it, so cancelling the
       animations at the next clash without clearing the style would resurrect
       the previous blow's worst frame for one frame of this one. */
    try { dNode.getAnimations().forEach(a => a.cancel()); } catch(e){}
    dNode.style.transform = '';

    /* ============================== THE DODGE ==============================
       The upset's staging, and the whole of its craft is that the capability
       was visible BEFORE it was needed: the same signature has been playing as
       harmless Circle texture since the rung below (see `foreshadow`). A rare
       outcome that arrives with no setup reads as the game cheating.

       The order matters more than anything in it:
         1. the strike LANDS, exactly as it would have, for three frames. Same
            speed, same commitment, same read — nothing signals what is coming.
         2. then contact does not happen. The defender's signature fires: the
            WATER Boxling parts around the blow and closes behind it, the ICE
            Boxling's guard holds and the strike skates off a facet, the FIRE
            Boxling flares and the blow passes through.
         3. HITSTOP STILL FIRES, on the MISS. That is what sells it as a
            near-death rather than a whiff, and it is the single detail the
            whole beat lives or dies on.
         4. and the Aftermath is the stun — paid for out of the stop this miss
            did not earn, so the commit's total never moves.

       The Tell before it was identical to any other Tell, and the script gave
       the defender QUAKE rather than RALLY: a dodge that can be predicted from
       the emotion turns the flinch into an outcome tell, which is the one
       thing the flinch is forbidden to be. */
    if (cm.dodge){
      const oneFrame = 1000 / C.stopmo.base / st.rate;
      const D = C.dodge;
      const el = def.element || 'water';
      const sig = (C.elements[el] || C.elements.water).signature;
      /* WHICH OF THE THREE IMAGES. Drawn cosmetically per killing commit, all
         three the same length, all three ending with the rival on the floor.
         One image played every time is what made this beat read cheap. */
      const how = cm.survivalKind || 'slip';
      /* WHERE THE BODY WAS WHEN THE BLOW ARRIVED. Everything about the evasion
         is measured from here, and this is the fix for the second thing the
         playtest found: the dodge read as "the striker gets close and nothing
         happens".

         Two causes, and they compounded. The `miss` variant moved the defender
         NINE PIXELS and three degrees, then relied on the attacker overshooting
         to carry the whole beat — so the only thing that visibly happened was
         the attacker travelling, which is what it does on a blow that lands
         too. And the afterimage was dropped at `fx_(def)`, the body's CURRENT
         position, so the ghost and the body sat on top of each other: an
         afterimage that does not mark where the body USED to be is not an
         afterimage, it is a smudge.

         So: the ghost is pinned here, the body genuinely leaves, and the blow
         tears through the gap between them. The evasion also goes through the
         RIG rather than a transform, so it survives the hitstop that follows —
         the frozen frame is the one a viewer actually reads, and it now shows
         an empty space where the strike is, a ghost marking it, and the body
         somewhere else. */
      const x0 = drawnX(def);
      /* HOW FAR THE BODY GOES, and the three are deliberately different
         distances rather than three dressings of the same one — that is what
         stops a run's second dodge reading as a repeat of its first.

           slip     68  it steps out of the line entirely
           miss     88  the biggest, because it was never close
           through  26  it does NOT evade — it takes the blow and gives ground

         `through` was 0 and that was a mistake: a variant where the defender
         does not move at all is the exact shape of the complaint this section
         is fixing, however good the burst on top of it looks. Giving ground is
         not the same as getting out of the way, and 26px reads as the former. */
      const D_LAT = { slip: 68, miss: 88, through: 26 };
      // 1. the strike lands exactly as it would have.
      await wait(Math.max(1, Math.min(ms * 0.5, D.landFrames * oneFrame)));
      // 2. ...and then it does not.
      const evadeMs = Math.max(1, D.slipFrames * oneFrame * 3);
      const lat = D_LAT[how] || 0;
      if (lat && !st.skipping){
        /* THE BODY LEAVES — through the same positional term the strike's own
           travel uses, and NOT through the radius. Routing it through the
           radius was the first attempt and it measured 40px of movement against
           68 requested: the radius clamps, and a defender already near the
           envelope's edge simply refused most of the evasion. This term clamps
           against nothing, so the distance asked for is the distance moved, and
           it decays on the next Circle exactly like the attacker's lunge. */
        def.lunge = (def.lunge || 0) - lat * def.dir;
        /* ...and the afterimage stays behind, marking the space it vacated.
           Only where the body actually GOT OUT of the line: on `through` it
           never left, so an afterimage there would claim an evasion that did
           not happen. Ground given is not the same as ground vacated. */
        if (how !== 'through'){
          const ghost = fxAt(A.fx.dodge(), x0, GY, 1100);
          if (ghost) anim(animEl(ghost), [
            { opacity:0.95, transform:'scale(1)' },
            { opacity:0.55, transform:'scale(1.02)', offset:0.45 },
            { opacity:0, transform:'scale(1.06)' },
          ], Math.max(1, evadeMs * 2.4), { fill:'forwards' });
        }
      }
      if (how === 'slip'){
        /* IT IS NOT THERE. The element signature is the REASON it got out — and
           it fires at the vacated space, not on the body, because the point is
           what happened where the blow went. */
        const g = fxAt(A.fx.signature(sig, (C.elements[el] || {}).trail), x0, GY, 1200);
        if (g) anim(animEl(g), [
          { transform:'scale(0.86)', opacity:0.2 },
          { transform:'scale(1.10)', opacity:1, offset:0.35 },
          { transform:'scale(1.20)', opacity:0 },
        ], Math.max(1, evadeMs), { fill:'forwards' });
        /* The body itself: a hard duck away, and it stays ducked into the
           freeze. NO `* dir` — see the note on the struck pose in the Clash.
           The rig has already mirrored this element, so the facing is baked in
           and multiplying by it again ducks the body INTO the blow on whichever
           side of the ring makes `dir` negative. Half of every run's dodges
           were leaning the wrong way. */
        anim(dNode, [
          { transform:'translateY(0px) rotate(0deg) scale(1,1)' },
          { transform:'translateY(9px) rotate(-9deg) scale(1.08,0.9)' },
        ], Math.max(1, evadeMs * 0.5), { fill:'forwards' });
      } else if (how === 'miss'){
        /* THE RIVAL SWINGS THROUGH NOTHING AT ALL. The biggest evade of the
           three — it was never close — and the body leans away hard as it goes,
           so the gap between the ghost and the body is the whole picture. */
        anim(dNode, [
          { transform:'translateY(0px) rotate(0deg)' },
          { transform:'translateY(4px) rotate(-14deg)' },
        ], Math.max(1, evadeMs * 0.45), { fill:'forwards' });
      } else {
        /* IT COMES THROUGH IT. Head on, and out the other side swinging — the
           box bursting open, replayed a third time. */
        const b = fxAt(A.fx.impact(), drawnX(def) + 30 * def.dir, GY - 58 * def.scale, 900);
        if (b) anim(animEl(b), [{ transform:'scale(0.7)', opacity:1 },
                                { transform:'scale(2.1)', opacity:0 }], scale(420), { fill:'forwards' });
        anim(dNode, [
          { transform:'scale(1,1)' },
          { transform:'scale(0.9, 1.14)', offset:0.35 },
          { transform:'scale(1.06, 0.96)', offset:0.7 },
          { transform:'scale(1,1)' },
        ], Math.max(1, D.slipFrames * oneFrame * 3), { easing:'ease-out', fill:'none' });
      }
      /* The blow tears through the space the body was in, and OVERSHOOTS —
         the attacker is committed and there is nothing there to stop it.

         A DISCHARGE OVERSHOOTS TOO, AND IT IS NOT THE BODY THAT DOES IT. The
         attacker stayed on its mark and was thrown backward by its own release;
         throwing it forward here would delete the recoil that is the whole read
         of a ranged commit, and it would do it in the frame the hitstop is about
         to freeze. What carries past the vacated space is the bolt — which is
         also the better picture, because a shot that sails on downrange is a
         near-miss in a way a body stumbling forward can never be. */
      const over = how === 'miss' ? 64 : 46;
      if (!ranged){
        anim(animEl(atk.node), [
          { transform:'translateX(0px)' },
          { transform:`translateX(${over}px)` },      // forward is +x in the mirrored local space
        ], Math.max(1, D.slipFrames * oneFrame), { composite:'add', fill:'forwards' });
      } else if (vfx() && !st.skipping){
        const past = fxAt(A.fx.beam(aEl, C.combatRange.beam.len, C.combatRange.beam.thick, atk.dir),
                          x0, GY - 62 * def.scale, 0);
        if (past){
          anim(animEl(past), [
            { transform:'translate(0px,0px) scale(1,1)', opacity:1 },
            { transform:`translate(${(over * 3.4 * atk.dir).toFixed(0)}px, -14px) scale(2.4,0.7)`, opacity:0 },
          ], Math.max(1, D.slipFrames * oneFrame * 2.2), { fill:'forwards' });
          setTimeout(() => { try { past.remove(); } catch(e){} }, Math.max(60, evadeMs * 3));
        }
      }
      if (how === 'slip') def.node.classList.add('dodging');
      // 3. the hitstop, on the MISS.
      await freeze(scale(D.missStop));
      def.node.classList.remove('dodging');
      shake(C.hit.shake.light, 180);
      banner(how === 'miss' ? 'IT SWINGS AT NOTHING'
           : how === 'through' ? 'IT COMES THROUGH IT'
           : 'IT IS NOT THERE', 'gold', 900);
      st.result.dodges = (st.result.dodges || 0) + 1;
      /* 4. Momentum swings a full state: the attacker is overextended and off
         balance, the defender is alive and knows it. The Aftermath that plays
         next is the beat the clip gets cut on. */
      /* NO BACKWARD KNOCKBACK ON THE STRIKER, and this line used to be one.
         It pushed the attacker back off a blow that never connected, which is
         the "bouncing off the body it was striking" the playtest called out —
         and on a MISS it is doubly wrong, because nothing was there to push it.
         What happens to an overcommitted body is that it carries on past its
         own line and loses its feet, which is the fold above plus BUCKLING
         below. Momentum still swings a full state; the direction of travel is
         simply forwards now, as it should always have been. */
      setEx(atk.node, 'dizzy');
      setEx(def.node, 'fierce');
      /* AND IT GOES DOWN FOR IT. A miss that leaves both fighters standing is
         a neutral event, and four neutral events in a run is what "nothing
         ever lands" actually means. So the rival does not merely overreach —
         it loses its feet: past its own line, nothing there to stop it,
         overbalanced, and on the floor. The gold that follows finishes it
         where it fell, which is why the rung reads as fear then triumph with a
         visible cause instead of two disconnected beats. */
      /* Through the RIG, not a transform. A `forwards` transform on `.anim`
         would be wiped by the Aftermath's own reset a beat later — and worse,
         posture is the rig's to write, so a fall drawn any other way is a pose
         the momentum system does not know about and cannot hold. `BUCKLING` is
         already "stumbles and struggles to plant"; this is what it is for. */
      /* BUCKLING EITHER WAY, and for two different reasons that arrive at the
         same state. A melee attacker went past its own line with nothing there
         to stop it and lost its feet. A ranged one never had feet to lose — what
         it lost is the charge, which is the only thing it had and which it does
         not get back. Both are "this body is now the one in trouble", which is
         what the state means and what the beat is for. */
      setMom(atk, 'BUCKLING', Math.max(1, scale(C.survivalImage.fall)));
      if (vfx()){
        if (ranged){
          /* THE SPENT MUZZLE. A dust ring at the feet is a body hitting the
             ground and this body did not — so the image is the discharge dying
             at the point it was thrown from: everything it gathered, gone, and
             nothing to show for it. */
          const spent = fxAt(A.fx.muzzle(aEl, atk.dir), drawnX(atk) + 26 * atk.dir,
                             GY + C.combatRange.charge.rise * atk.scale, 900);
          if (spent) anim(animEl(spent), [{ transform:'scale(0.9)', opacity:0.8 },
                                          { transform:'scale(0.2)', opacity:0 }], scale(520), { fill:'forwards' });
        } else {
          const puff = fxAt(A.fx.dustRing(), drawnX(atk), GY + 4, 900);
          if (puff) anim(animEl(puff), [{ transform:'scale(0.3)', opacity:0.9 },
                                        { transform:'scale(2.2)', opacity:0 }], scale(460));
        }
        shake(C.hit.shake.light, 200);
      }
      await wait(Math.max(1, ms));
      return 'dodge';
    }

    /* ============================= THE ESCAPE =============================
       The one commit in the game where a gold does not finish. The rival does
       not merely defend the first swing — it gets out of the whole attempt,
       and the gold has to be thrown a second time.

       It is handled HERE, ahead of the ordinary clash vocabulary, and that
       placement is the whole of it: an escaped gold carries `resolve:'dodge'`
       so it does not hold a finisher's stop, which meant it fell straight into
       the generic dodge branch below and announced itself as a plain `DODGED`.
       The beat was firing correctly and being told as nothing in particular.

       The ring grammar survives this because the rung is STILL finished by a
       gold. It now sometimes takes two. */
    if (cm.escaped){
      const ghost = fxAt(A.fx.dodge(), drawnX(def), GY, 900);
      if (ghost) anim(animEl(ghost), [{ opacity:0.9 }, { opacity:0 }], scale(460), { fill:'forwards' });
      const dEl = C.elements[def.element];
      if (dEl){
        const sig = fxAt(A.fx.signature(dEl.signature, dEl.trail), drawnX(def), GY, 1200);
        if (sig) anim(animEl(sig), [
          { opacity:0, transform:'scale(0.7)' },
          { opacity:1, transform:'scale(1.08)', offset:0.4 },
          { opacity:0, transform:'scale(1.2)' },
        ], Math.max(1, ms * 1.5), { fill:'forwards' });
      }
      /* IT IS GONE, and the blow goes right through where it was — but the
         body has to be SEEN going, or "it escaped" is a caption over a static
         puppet. It ducks under the line and comes up clear, which is the same
         picture the killing-commit dodge draws one tier up. */
      knockback(def, C.hit.knockback.light * 1.4, Math.max(60, ms));
      anim(dNode, [
        { transform:'translateX(0px) translateY(0px) rotate(0deg) scale(1,1)' },
        { transform:'translateX(-16px) translateY(11px) rotate(-13deg) scale(1.1,0.88)', offset:0.4 },
        { transform:'translateX(-6px) translateY(0px) rotate(-4deg) scale(0.98,1.03)' },
      ], Math.max(1, ms * 1.6), { easing:'ease-out', fill:'forwards' });
      /* The overreach — and only if there was a body to overreach. A ranged gold
         that gets escaped does not stumble past anything: it stands there having
         thrown its best and watched it go by, which is a worse look and the
         right one. The second gold is what answers it either way. */
      if (!ranged) anim(animEl(atk.node), [
        { transform:'translateX(0px)' },
        { transform:'translateX(52px)' },
      ], Math.max(1, ms), { composite:'add', fill:'forwards' });
      shake(C.hit.shake.light, 160);
      await freeze(holdMs || 0);
      banner('IT IS STILL UP', 'gold', 1100);
      setEx(def.node, 'fierce');
      setEx(atk.node, 'worried');
      await wait(Math.max(1, ms));
      return 'dodge';
    }

    // ---------------------------------------------------------- DODGE
    if (kind === 'dodge'){
      const ghost = fxAt(A.fx.dodge(), drawnX(def), GY, 900);
      if (ghost) anim(animEl(ghost), [{ opacity:0.9 }, { opacity:0 }], scale(420), { fill:'forwards' });
      // the body slips clear — fast, and it does not stop
      knockback(def, C.hit.knockback.light * 1.6, Math.max(60, ms));
      anim(dNode, [
        { transform:'translateY(0) scale(1,1)' },
        { transform:`translateY(-14px) scale(0.9, 1.12)`, offset:0.45 },
        { transform:'translateY(0) scale(1,1)' },
      ], Math.max(1, ms * 2.2), { easing:'ease-out', fill:'forwards' });
      banner('DODGED', 'sub', 700);
      await freeze(holdMs || 0);
      await wait(Math.max(1, ms));
      return kind;
    }

    /* ---------------------------------------------------------- BLOCK
       A block is something that happens to the ATTACKER. Sparks and a shield
       arc on the defender say "something was absorbed"; only the swinging
       body being thrown back off the guard says "your blow was stopped". So
       the attacker takes the knockback, compresses against the guard,
       shudders, and is driven back past its own line — while the defender
       barely moves at all. The contrast between the two IS the read. */
    if (kind === 'block'){
      const gf = C.guardFeel;
      const aNode = animEl(atk.node);
      const gap = 66 * atk.scale + 76 * def.scale;
      const reach = Math.max(30, Math.abs(fx_(def) - fx_(atk)) - gap) / atk.scale;

      const g = fxAt(A.fx.block(), hx, hy, 900);
      if (g) anim(animEl(g), [
        { transform:'scale(0.6)', opacity:1 }, { transform:'scale(1.25)', opacity:0 },
      ], scale(360), { fill:'forwards' });
      /* AND WHAT BROKE ON THE GUARD. "A block is something that happens to the
         ATTACKER" is this arm's founding argument, and against a discharge the
         attacker is not available — it never left its mark. So the thing that
         gets stopped is the BOLT: it shatters on the shield and throws itself
         back along the line it came in on, which is the same picture as a body
         rebounding off a guard and the only one there is when the body stayed
         home. The rebound below is skipped for exactly that reason. */
      if (ranged){
        const brk = fxAt(A.fx.beamBreak(aEl, atk.dir), hx, hy, 900);
        if (brk) anim(animEl(brk), [
          { transform:'scale(0.5)', opacity:1 }, { transform:'scale(1.4)', opacity:0 },
        ], scale(420), { fill:'forwards' });
      }
      if (flash && vfx()){
        flash.style.transition = 'none'; flash.style.opacity = String(C.impact.flash * 0.22);
      }

      // the defender: planted. A shove, nothing more.
      knockback(def, C.hit.knockback.light * gf.defenderKnock, Math.max(60, ms));
      anim(dNode, [
        { transform:'scale(1.05, 0.95)' }, { transform:'scale(1,1)' },
      ], Math.max(1, ms * 2), { easing:'ease-out', fill:'forwards' });

      /* The attacker: stopped dead, compressed, then thrown back off it — and
         none of that is available to a body that never made contact. A ranged
         attacker keeps the recoil its own discharge already gave it, and the
         rebound would fight that transform for the same property and win, which
         would put the body somewhere neither the strike nor the guard put it.
         What it takes instead is the knockback and the shudder: it FELT the
         thing come back, which is the read, and it is standing where it fired. */
      const k = gf.compress;
      if (!ranged) anim(aNode, [
        { transform:`translateX(${reach.toFixed(0)}px) scale(${1 - k}, ${1 + k})` },
        { transform:`translateX(${(reach * 0.45).toFixed(0)}px) scale(${1 + k * 0.5}, ${1 - k * 0.5})`, offset:0.30 },
        { transform:`translateX(${(-gf.rebound).toFixed(0)}px) scale(1.02, 0.98)`, offset:0.62 },
        { transform:`translateX(${(-gf.rebound * 0.35).toFixed(0)}px) scale(1,1)` },
      ], Math.max(1, ms * 2.6), { easing:'cubic-bezier(.2,.9,.35,1)', fill:'forwards' });
      knockback(atk, C.hit.knockback.heavy * gf.attackerKnock, Math.max(80, ms * 1.6));
      setEx(atk.node, 'worried');          // it registers, for a beat
      // the shudder traveling back through the arm
      anim(atk.node.querySelector('.guardG') || aNode, [
        { transform:`translateX(${gf.jolt}px)` }, { transform:`translateX(${-gf.jolt}px)` },
        { transform:`translateX(${gf.jolt * 0.5}px)` }, { transform:'translateX(0px)' },
      ], Math.max(1, ms * 1.4), { fill:'none' });

      shake(C.hit.shake.light, 160);
      banner('BLOCKED', 'sub', 700);
      await freeze(holdMs || 0);
      if (flash){ flash.style.transition = 'opacity 200ms linear'; flash.style.opacity = '0'; }
      await wait(Math.max(1, ms));
      setEx(atk.node, C.momentum.states[atk.mom].ex);
      return kind;
    }

    // ------------------------------------------------- LAND and CRITICAL
    const crit = kind === 'critical';
    let hold = holdMs || 0;

    /* ---------------------------------------------------------- THE SLIP
       The rival's one defensive read. It is not there for the first swing: an
       afterimage where it was, the blow tearing through air, and it comes out
       of it still standing — and then the follow-through lands and finishes it
       anyway. Same commit, same outcome. Paid for out of the stop, which is the
       longest hold in the game and gives up a quarter of it without noticing,
       so the commit's total does not move and neither cap can feel this. */
    if (cm.slip && vfx() && !st.skipping && hold > 120){
      /* NOT paid for out of the stop any more. The stop is the finisher's, and
         a miss that borrows from it makes the blow that actually lands weigh
         less — which is the opposite of what a survived swing should do. */
      const slipMs = Math.max(1, scale(C.hit.slip));
      /* WHICH DEFENCE, and the two arms are deliberately nothing alike. Equal
         durations, so the coin flip is free and the printed table stays true;
         opposite images, so a gold is not the same shot twice a run. */
      const guarded = cm.slipKind === 'guard';
      const clean   = cm.slipKind === 'clean';
      setEx(def.node, clean ? 'worried' : 'fierce');

      /* THE CLEAN ARM. The rival does not answer at all, and the budget the
         other two spend on an escape is spent here on the blow — a held
         anticipation, the attacker gathering at the top of its swing, and then
         the finisher goes in on the first attempt.

         It costs the same to the millisecond, which is the whole reason it can
         exist: a cosmetic draw may never change a run's length. What it buys is
         that a third of golds break the pattern the other two arms establish,
         so a viewer cannot learn that a gold always takes two swings. */
      if (clean){
        anim(animEl(atk.node), [
          { transform:'translateX(0px) scale(1,1)' },
          // gathering BACK before it goes in: -x local, no `* dir`
          { transform:'translateX(-10px) scale(0.96,1.07)', offset:0.55 },
          { transform:'translateX(0px) scale(1,1)' },
        ], Math.max(1, slipMs), { easing:'ease-in', composite:'add', fill:'none' });
        anim(dNode, [
          { transform:'scale(1,1)' },
          { transform:'scale(1.04,0.95)' },
        ], Math.max(1, slipMs * 0.8), { easing:'ease-out', fill:'none' });
      }
      else if (guarded){
        /* THE GUARD. It does not move — it takes the blow on the guard and
           turns it aside, and the read is the ATTACKER being stopped dead,
           exactly as `guardFeel` argues for the player's blocks. */
        const gf = C.guardFeel;
        const g = fxAt(A.fx.block(), drawnX(def) + 40 * def.dir, GY - 62 * def.scale, 900);
        if (g) anim(animEl(g), [
          { transform:'scale(0.6)', opacity:1 }, { transform:'scale(1.3)', opacity:0 },
        ], slipMs * 1.8, { fill:'forwards' });
        // ...and on a discharge it is the BOLT that gets turned aside, thrown
        // back along its own line — the same argument the player's block makes.
        if (ranged){
          const brk = fxAt(A.fx.beamBreak(aEl, atk.dir), drawnX(def) + 40 * def.dir, GY - 62 * def.scale, 900);
          if (brk) anim(animEl(brk), [
            { transform:'scale(0.45)', opacity:1 }, { transform:'scale(1.35)', opacity:0 },
          ], slipMs * 1.6, { fill:'forwards' });
        }
        knockback(def, C.hit.knockback.light * gf.defenderKnock, slipMs);
        anim(dNode, [
          { transform:'scale(1,1)' },
          { transform:`scale(${1 + gf.compress * 0.5}, ${1 - gf.compress * 0.5})`, offset:0.4 },
          { transform:'scale(1,1)' },
        ], Math.max(1, slipMs * 1.4), { easing:'ease-out', fill:'none' });
      } else {
        /* THE SLIP. The body is simply not there any more. */
        const ghost = fxAt(A.fx.dodge(), drawnX(def), GY, 900);
        if (ghost) anim(animEl(ghost), [{ opacity:0.9 }, { opacity:0 }], slipMs * 2, { fill:'forwards' });
        /* THE RIVAL'S OWN SIGNATURE IS WHAT FAILS THE BLOW — a WATER body parts
           and closes behind it, an ICE one takes it off a facet, a FIRE one
           flares and it passes through. Same vocabulary as the player's dodge,
           read off the rival's material, so the two dodges are the same event
           seen from opposite sides rather than two unrelated tricks. */
        const dEl = C.elements[def.element];
        if (dEl){
          const sig = fxAt(A.fx.signature(dEl.signature, dEl.trail), drawnX(def), GY, slipMs + 600);
          if (sig) anim(animEl(sig), [
            { opacity:0, transform:'scale(0.6)' },
            { opacity:0.95, transform:'scale(1.04)', offset:0.45 },
            { opacity:0, transform:'scale(1.15)' },
          ], Math.max(1, slipMs * 1.6), { fill:'forwards' });
        }
      }
      /* The RIG moves it, not a transform: position is the rig's to write, and
         a `forwards` transform left on the body here would mask the worst pose
         the stop is about to hold it in. The `.anim` flourish returns to
         identity inside the beat and leaves no residue. */
      if (!guarded && !clean){
        knockback(def, C.hit.knockback.light * 0.9, slipMs);
        anim(dNode, [
          { transform:'translateY(0) scale(1,1)' },
          { transform:'translateY(-13px) scale(0.88, 1.12)', offset:0.5 },
          { transform:'translateY(0) scale(1,1)' },
        ], slipMs * 0.95, { easing:'ease-out', fill:'none' });
      }
      /* The blow goes past the body, or rebounds off the guard — composited ON
         TOP of the release's own travel either way, so it leaves from wherever
         the strike actually reached rather than snapping back to zero first.
         A slip lets it overshoot; a guard throws it back the other way, which
         is the whole difference between "you missed" and "you were stopped". */
      /* A DISCHARGE HAS NO BODY OUT THERE TO GO PAST OR BE THROWN BACK, so the
         attacker keeps the mark and the recoil it fired from. The whole of what
         a ranged slip costs is drawn at the other end — the bolt went by, or it
         broke on the guard — and the answer to it is a SECOND discharge, below. */
      if (!clean && !ranged) anim(animEl(atk.node), [
        { transform:'translateX(0px)' },
        { transform:`translateX(${(guarded ? -C.guardFeel.rebound * 0.6 : 30).toFixed(0)}px)` },
      ], slipMs, { composite:'add', fill:'forwards' });
      await wait(slipMs);

      /* THE HITSTOP, ON THE MISS. This is the whole difference between a
         near-thing and a whiff, and the player's dodge has always had it. The
         world stops on the fact that nothing happened. */
      /* The stop is the same length either way. On an evading arm the world
         holds on the fact that nothing happened; on the clean arm it holds on
         a blow that is already committed and has nowhere to go. */
      if (!clean) shake(C.hit.shake.light, 140);
      await freeze(scale(C.hit.slipStop));

      /* AND THE BEAT AFTER IT. The attacker is past its own line and off
         balance; the rival is still standing and knows it. Without this the
         miss and the follow-through were one motion, which is exactly why
         nobody could see the rival dodge — it never got a frame of its own. */
      const stun = Math.max(1, scale(C.hit.slipStun));
      if (clean){
        /* No banner and no recovery beat: nothing was survived, so there is
           nothing to name. The budget is simply held, and the finisher below
           lands on the first swing. */
        await wait(stun);
        hx = drawnX(def) + 60 * def.dir;
      } else {
      banner(guarded ? 'TURNED ASIDE' : 'SLIPPED', 'sub', Math.max(600, stun));
      if (!ranged){
        // past its own line and tipping over it — forward, which is +x local
        anim(animEl(atk.node), [
          { transform:'translateX(0px) rotate(0deg)' },
          { transform:'translateX(16px) rotate(6deg)', offset:0.4 },
          { transform:'translateX(0px) rotate(0deg)' },
        ], stun, { easing:'ease-out', composite:'add', fill:'none' });
      } else {
        /* IT THROWS A SECOND ONE, and this is the beat where a ranged gold pays
           back what the melee one gets for free. "The finisher lands on the
           follow-through" is a swing that was already in motion; a discharge
           that missed is simply gone, so the answer has to be another discharge
           — the body braces, gathers again and fires into the space the rival
           just moved into. That is a better picture than an overreach and it is
           the same length, because it is spent inside the stun the slip already
           bought. The bolt is timed to ARRIVE as the impact fires below, so the
           frame the world stops on is this shot connecting rather than a shot
           still crossing the gap. */
        const tgt = drawnX(def) + 60 * def.dir;
        const y2 = GY + C.combatRange.charge.rise * atk.scale;
        const bx = drawnX(atk) + 26 * atk.dir;
        anim(animEl(atk.node), [
          { transform:'translateX(0px) scale(1,1)' },
          { transform:'translateX(-9px) scale(0.96,1.06)', offset:0.45 },   // gathers again
          { transform:'translateX(0px) scale(1.04,0.97)' },
        ], stun, { easing:'ease-in', composite:'add', fill:'none' });
        const mz2 = fxAt(A.fx.muzzle(aEl, atk.dir), bx, y2, 700);
        if (mz2) anim(animEl(mz2), [
          { transform:'scale(0.2)', opacity:0 },
          { transform:'scale(0.5)', opacity:0.9, offset:0.55 },
          { transform:'scale(1.4)', opacity:0 },
        ], Math.max(1, stun), { fill:'forwards' });
        const b2 = fxAt(A.fx.beam(aEl, C.combatRange.beam.len, C.combatRange.beam.thick, atk.dir), bx, y2, 0);
        if (b2){
          anim(animEl(b2), [
            { transform:'translate(0px,0px) scale(0.5,1.1)', opacity:0 },
            { transform:'translate(0px,0px) scale(0.7,1.1)', opacity:1, offset:0.5 },
            { transform:`translate(${(tgt - bx).toFixed(0)}px, ${(GY - 62 * def.scale - y2).toFixed(0)}px) scale(${C.combatRange.beam.tail},0.9)`, opacity:1 },
          ], Math.max(1, stun), { fill:'forwards' });
          setTimeout(() => { try { b2.remove(); } catch(e){} }, Math.max(40, stun + 30));
        }
      }
      setEx(atk.node, 'worried');                // it registers, for a beat
      anim(dNode, [
        { transform:'scale(1,1)' },
        { transform:'scale(0.97, 1.05)', offset:0.35 },
        { transform:'scale(1,1)' },
      ], stun, { easing:'ease-out', fill:'none' });
      await wait(stun);
      setEx(atk.node, C.momentum.states[atk.mom].ex);

      setEx(def.node, C.momentum.states[def.mom].ex);
      hx = drawnX(def) + 60 * def.dir;      // the finisher lands where the body IS now
      }
    }

    /* ==================== THE TRANSFER ====================
       Which way the force is going, said three times in the same direction:
       the panel's wake, the lance running back to the fist that threw it, and
       the cone opening into the body that took it. `sdir` is the attacker's
       world facing, which is the line the blow travels along.

       Drawn at FULL SIZE immediately, like the panel and for the same reason:
       the world is about to hold on this frame, and anything still growing
       during a held frame is a moving picture rather than a drawn one. */
    const sdir = atk.dir;
    const T = C.hit.transfer;
    const lance = Math.min(T.max, Math.max(70, Math.abs(hx - drawnX(atk)) * T.lenShare));
    const panel = crit ? fxAt(A.fx.impactPanel(weight, C.impact.lines, sdir), hx, hy, hold + 1400) : null;
    const thr = fxAt(A.fx.thrust(weight, lance, sdir), hx, hy, hold + 1200);
    const cone = fxAt(A.fx.shockCone(weight, sdir), hx, hy, hold + 1200);
    const imp = fxAt(A.fx.impact(), hx, hy, hold + 1200);
    if (imp) animEl(imp).style.transform = `scale(${crit ? C.impact.burst : C.impact.burst * 0.62})`;
    if (flash && vfx()){
      flash.style.transition = 'none';
      flash.style.opacity = String(C.impact.flash * (crit ? 1 : 0.5));
      /* ...and then it gets out of the way. A plain timer, not an animation:
         the freeze pauses animations by design, so anything easing this down
         would be paused for exactly the beat it needs to run in. */
      const floor = String(C.impact.flashHold * (crit ? 1 : 0.5));
      setTimeout(() => { if (flash) flash.style.opacity = floor; },
                 Math.max(1, scale(C.impact.flashPeak)));
    }
    /* WHO SWUNG AND WHO WORE IT, on the bodies themselves and not only in the
       fx between them. The striker takes a rim light and the struck body
       blows out toward white — the oldest damage read there is, and the one
       that survives a viewer whose eye is on a face rather than on the gap. */
    atk.node.classList.add('striking');
    def.node.classList.add('struck');
    setEx(def.node, crit ? 'dizzy' : 'worried');
    setEx(atk.node, 'fierce');

    /* The struck body locks into its worst pose FOR the panel and holds it —
       and the pose is now signed by where the blow came from. Any animation
       still holding this element (the brace it played on the way in) would
       mask an inline style, so it is cleared first: for the length of the stop
       this transform is the only thing writing the defender's pose. */
    const k = C.hit.squash[weight];
    const push = C.hit.recoil.push[weight], tip = C.hit.recoil.tip[weight];
    try { dNode.getAnimations().forEach(a => a.cancel()); } catch(e){}
    /* Local space is already mirrored by the rig, so +x is the direction the
       defender FACES — into the blow. Driven back is therefore negative, and
       the tip that throws its head away from the contact is negative with it.
       No `* dir` anywhere: multiplying by the facing inside a mirrored space
       flips the pose a second time and the body recoils INTO the punch on
       whichever side of the ring makes dir negative. */
    const struckPose = `translateX(${-push}px) rotate(${-tip}deg) scale(${(1 - k * 0.8).toFixed(3)}, ${(1 + k * 0.55).toFixed(3)})`;
    dNode.style.transform = struckPose;

    await freeze(hold);                 // ============ THE STOP ============

    if (flash){ flash.style.transition = 'opacity 220ms linear'; flash.style.opacity = '0'; }
    if (panel) anim(animEl(panel), [{ opacity:1 }, { opacity:0 }], scale(180), { fill:'forwards' });
    /* THE DISCHARGE. The lance drives on through and thins out; the cone opens
       away from the contact. Both travel FORWARD, into the struck body, so the
       last thing the frame says before it clears is the same thing the frozen
       frame said: it went that way. */
    if (thr) anim(animEl(thr), [
      { transform:'translateX(0px) scaleX(1)', opacity:1 },
      { transform:`translateX(${(26 * sdir).toFixed(0)}px) scaleX(0.4)`, opacity:0 },
    ], scale(T.discharge), { fill:'forwards' });
    if (cone) anim(animEl(cone), [
      { transform:'translateX(0px) scale(0.86)', opacity:0.95 },
      { transform:`translateX(${(34 * sdir).toFixed(0)}px) scale(1.5)`, opacity:0 },
    ], scale(T.discharge * 1.3), { fill:'forwards' });
    if (imp) anim(animEl(imp), [
      { transform:animEl(imp).style.transform, opacity:1 },
      { transform:`scale(${C.impact.burst * 1.5})`, opacity:0 },
    ], scale(220), { fill:'forwards' });
    shake(C.hit.shake[weight], crit ? 320 : 200);
    /* AND THE WHIPLASH. Driven further back first — the blow is still arriving
       when the world restarts — then thrown past neutral the other way and
       settled. A body that returns straight to its stance was never moved. */
    anim(dNode, [
      { transform: struckPose },
      { transform:`translateX(${(-push * 1.55).toFixed(0)}px) rotate(${(-tip * 1.35).toFixed(0)}deg) scale(${(1 - k * 0.35).toFixed(3)}, ${(1 + k * 0.25).toFixed(3)})`, offset:0.32 },
      { transform:`translateX(${(push * 0.3).toFixed(0)}px) rotate(${(tip * 0.45).toFixed(0)}deg) scale(${(1 + k * 0.3).toFixed(3)}, ${(1 - k * 0.3).toFixed(3)})`, offset:0.68 },
      { transform:'translateX(0px) rotate(0deg) scale(1, 1)' },
    ], Math.max(1, ms * 3), { easing:'ease-out', fill:'forwards' });
    knockback(def, C.hit.knockback[weight], Math.max(60, ms * 2));
    setTimeout(() => {
      atk.node.classList.remove('striking');
      def.node.classList.remove('struck');
    }, Math.max(120, scale(crit ? 300 : 200)));
    await wait(Math.max(1, ms));
    return kind;
  }

  /* THE BURST — the opener's box coming apart, reused as the image of a run
     ending. It is deliberately the same art and the same scatter the opener
     fires, because v3.6's whole argument is that the player should not have to
     learn a second picture of finality. */
  function debris(x, ms){
    if (!vfx() || st.skipping) return;
    const frags = addNode('#fxLayer', A.fragments(), x, GY);
    if (!frags) return;
    frags.querySelectorAll('.frag').forEach((f, i) => {
      const dx = (i % 2 ? 1 : -1) * (30 + i * 14), dy = -50 - (i * 13) % 70;
      anim(f, [
