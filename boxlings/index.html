<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxlings Battle — Glacier Vault Box</title>
<style>
/* Boxlings Battle — glacial theme */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #070d1c; --panel: #0d1830; --panel2: #122142; --line: #22355c;
  --ink: #d7e4f2; --dim: #7f93b0; --gold: #f2c14e; --goldHi: #ffe9a3;
  --bad: #e8654c; --good: #5fd68a; --accent: #6fb7ff;
  font-size: 15px;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
}
button { font: inherit; cursor: pointer; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: Consolas, monospace; word-break: break-all; }
.tiny { font-size: 0.78rem; color: var(--dim); line-height: 1.45; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* ---------------- topbar ---------------- */
#topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.logo { font-weight: 800; letter-spacing: 2px; font-size: 1.05rem; }
.logo em { color: var(--gold); font-style: normal; }
.boxname { color: var(--dim); font-size: 0.85rem; }
.spacer { flex: 1; }
.ghost {
  background: none; border: 1px solid var(--line); border-radius: 7px;
  padding: 5px 12px; color: var(--dim); font-size: 0.82rem;
}
/* A ghost button that is currently DOING something says so, or you cannot tell
   clean mode is on from a stage that simply has nothing on it. */
.ghost.on { border-color: var(--accent); color: var(--ink); }
.ghost:hover { color: var(--ink); border-color: var(--accent); }

/* ---------------- layout ---------------- */
#layout { flex: 1; display: flex; min-height: 0; }
#setup {
  width: 322px; min-width: 322px; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 14px; transition: margin-left 0.5s ease;
}
/* The panel folds away when a run starts, because a run owns the stage — but
   that fold used to be a one-way door. It was driven off `body.running` and
   the receipt's only exits were OPEN AGAIN and Re-pack, both of which start
   another run, so after the first seal there was no frame in which the panel
   was reachable. It is a plain toggle now: the run shuts it, the ◧ Setup
   button opens it, and it opens again on its own when the run ends. */
body.panelShut #setup { margin-left: -322px; }
#panelBtn.on { color: var(--ink); border-color: var(--accent); }
/* Re-packing mid-run used to call startRun() into its own guard, which
   swallowed the seal and left nothing to show for it — so that door stays
   shut while a run is on. Changing a chip does not: every beat reads the rig
   live, so a mid-run change simply takes effect at the next beat. */
body.running #packBtn { pointer-events: none; opacity: 0.35; }
#setup section { margin-bottom: 18px; }
#setup h3 {
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1.4px;
  color: var(--gold); margin-bottom: 7px;
}
#setup label { display: block; font-size: 0.82rem; color: var(--dim); margin: 7px 0; }
#setup label.row { display: flex; gap: 8px; align-items: center; }
#setup select { width: 100%; margin-top: 3px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px; }
#setup details summary { cursor: pointer; color: var(--accent); font-size: 0.82rem; margin: 4px 0; }
.dropT { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.dropT th { text-align: left; color: var(--dim); font-weight: 600; padding: 3px 4px; border-bottom: 1px solid var(--line); }
.dropT td { padding: 3px 4px; border-bottom: 1px solid #16233f; }
.dropT td.num { text-align: right; white-space: nowrap; }

/* ---------------- stage ---------------- */
#stageWrap { flex: 1; position: relative; min-width: 0; background: #050a16; }
#stage, #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Full-screen occlusion at the crack: for its duration there is nothing on
   screen but the result. Length is a function of the band alone. */
#occlude {
  position: absolute; inset: 0; z-index: 6; opacity: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
#occlude.shown { opacity: 1; }
#occlude.fading { opacity: 0; transition: opacity 0.4s ease-out; }
#occlude.gold { background: radial-gradient(circle at 50% 45%, #ffe9a3, #f2c14e 45%, #8a6508); }
#occlude.red  { background: radial-gradient(circle at 50% 45%, #ff9a7a, #e8452c 45%, #6d1a0d); }
#occlude span {
  font-size: 5rem; font-weight: 900; letter-spacing: 10px; color: #1a1204;
  text-shadow: 0 4px 0 #ffffff44; animation: occPop 0.4s cubic-bezier(.2,1.6,.4,1);
}
#occlude.red span { color: #2a0a04; }
@keyframes occPop { from { transform: scale(0.7); opacity: 0; } }

/* The run clock — the 30s / 3s caps, verifiable on this machine right now. */
#clock {
  position: absolute; top: 14px; left: 14px; font-size: 0.72rem; letter-spacing: 1.4px;
  color: var(--dim); font-variant-numeric: tabular-nums; pointer-events: none;
}

#banner {
  position: absolute; top: 12%; left: 0; right: 0; text-align: center;
  font-weight: 800; font-size: 2rem; letter-spacing: 3px; pointer-events: none;
  opacity: 0; transition: opacity 0.22s, transform 0.22s; transform: translateY(-8px) scale(0.96);
  text-shadow: 0 3px 14px #000;
}
#banner.shown { opacity: 1; transform: none; }
#banner.sub { font-size: 1.1rem; color: var(--dim); letter-spacing: 4px; }
#banner.good { color: var(--good); }
#banner.bad { color: var(--bad); }
#banner.gold { color: var(--gold); }
#banner.omen { color: var(--accent); font-size: 1.3rem; }
#banner.omen.gold { color: var(--gold); }
#banner.rival { color: var(--ink); font-size: 1.3rem; }
#banner.big { font-size: 3.2rem; }

/* the prize decoding while the value counter rolls — the last beat of a Grail
   and the only number left in the whole product */
#decode {
  position: absolute; left: 0; right: 0; top: 38%; text-align: center;
  pointer-events: none; opacity: 0; transition: opacity 0.3s;
}
#decode.shown { opacity: 1; }
#decode .dcName {
  display: block; font-size: 1.5rem; letter-spacing: 2px; color: var(--goldHi);
  text-shadow: 0 3px 16px #000; min-height: 1.3em;
}
#decode .dcVal {
  display: block; font-size: 3.4rem; font-weight: 900; color: var(--gold);
  text-shadow: 0 4px 20px #000; letter-spacing: 2px;
}

/* the ring key in the setup panel — the grammar, stated once */
.ringKey { margin: 6px 0; }
.rkRow { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; padding: 2px 0; }
.rkRow i { width: 22px; border-radius: 2px; flex: none; }
.rkRow b { width: 52px; color: var(--ink); text-transform: uppercase; letter-spacing: 0.8px; font-size: 0.66rem; }
.rkRow span { color: var(--dim); }
.rigNow { margin-left: auto; font-size: 0.66rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
#setup h3 { display: flex; align-items: baseline; }

/* ---------------- the beat filmstrip ----------------
   The shot list at scale: one cell per authored beat, sized to the ms the
   pacer will give it, with the run itself sweeping across as a playhead.
   A stretch that goes longer than the padding limit with nothing changing
   goes red — the design's own "if it has no state change, cut it" rule,
   enforced where you can see it. */
#film {
  position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
  background: #060c1ae6; border-top: 1px solid var(--line);
  display: none; z-index: 5;
}
body.film #film { display: block; }
body.film #actionBtn { bottom: 46px; }
body.film #stakes { bottom: 100px; }
body.film #team { bottom: 42px; }

/* CLEAN MODE — the instrumentation off, the stage alone.
   The run clock and the beat filmstrip are both readouts for building this
   thing rather than for playing it, and they are the two elements that make a
   screenshot or a screen recording look like a debug build. This hides both and
   puts the action button, the stakes line and the team bug back where they sit
   without the strip, so nothing is left floating above a bar that is no longer
   there. It overrides `body.film` deliberately: it is a display switch, not a
   setting, so the filmstrip chip in the panel keeps its own state and comes
   back exactly as it was left. */
body.nohud #film,
body.nohud #clock { display: none !important; }
body.nohud #actionBtn { bottom: 18px; }
body.nohud #stakes { bottom: 76px; }
body.nohud #team { bottom: 14px; }
#film .filmCells { position: absolute; inset: 0 62px 0 0; display: flex; gap: 1px; }
.fcell {
  position: relative; min-width: 2px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  border-radius: 2px; opacity: 0.92;
}
.fcell b {
  font-size: 0.58rem; font-weight: 600; letter-spacing: 0.4px; white-space: nowrap;
  color: #05080f; opacity: 0.85; padding: 0 4px; pointer-events: none;
}
.fcell.k-op     { background: #3f6fa8; }
.fcell.k-con    { background: #b07ad8; }
.fcell.k-walk   { background: #7a5fb0; }
.fcell.k-walk b { color: #ecdfff; }
.fcell.k-tape   { background: #c8d6e4; }
.fcell.k-tape b { color: #0a1526; }
.fcell.k-circle { background: #2c4a6b; }
.fcell.k-circle b { color: #9fc0e0; }
.fcell.k-tell   { background: #f2a54e; }
.fcell.k-hit    { background: #e8452c; }
.fcell.k-hit b  { color: #2a0a04; }
.fcell.k-stop   { background: #fff8dd; box-shadow: inset 0 0 0 2px #f2c14e; }
.fcell.k-stop b { color: #2a1c04; font-weight: 800; }
.fcell.k-hold  { background: #24365a; }
.fcell.k-hold b{ color: #8fa6c8; }
.fcell.k-stop  { background: #0a1224; box-shadow: inset 0 0 0 1px #486ba8; }
.fcell.k-stop b{ color: #6f8fc0; }
.fcell.k-vault { background: #b8860b; }
.fcell.k-crack { background: var(--gold); }
.fcell.k-occ   { background: #fff3c4; }
.fcell.padding { box-shadow: inset 0 0 0 2px var(--bad); }
#film .filmHead {
  position: absolute; top: 0; bottom: 0; width: 2px; left: 0;
  background: #fff; box-shadow: 0 0 8px #fff; transition: left 0.05s linear;
  pointer-events: none;
}
#film .filmHead.past { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
#film .filmTot {
  position: absolute; right: 0; top: 0; bottom: 0; width: 62px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.66rem; letter-spacing: 0.6px; color: var(--dim);
  font-variant-numeric: tabular-nums; border-left: 1px solid var(--line);
}
#film.overBudget .filmTot { color: var(--bad); font-weight: 700; }

/* ------------------------------------------------- THE BOARD IS THE MOUNTAIN
   The five value bands of the box drawn as rungs up the triangle at the back
   of the arena, Floor at the wide base, the Grail at the narrow peak. It is
   the published drop table drawn as money, which is why it can be on screen
   from the first frame without leaking anything.

   It is ALSO the position indicator, because two elements would compete for
   the same half-second glance. A burned rung keeps its slot as a dim hollow,
   so the boundary between burned-below and live-above IS the height read:
   height on the mountain = height on the ladder = prize value, one object,
   one read. The taper does the rest — the rarer the band, the smaller its
   rung, so scarcity is geometry before it is ever a number.

   Score-bug craft, from David Hill's 1992 Sky Sports graphic ("the stupidest
   thing he had ever seen", said his boss) through the 1994 Fox Box: always
   on, never hides, never repositions, and glanceable in under half a second
   — the read is a COUNT, not a text. There is no text on a rung at all;
   what a tier is worth rides on the card that flies off it.

   RESERVED COLOR RULE: amber, red and gold belong to the telegraph rings.
   Nothing here borrows them except the two-card Vault endgame, where the tier
   glows ARE the crack colors because there the meanings converge. */
#mountain { transition: opacity 0.3s ease; }
/* Frozen and dimmed during a Tell and a Clash: the fight owns those, and the
   board's only update window is the Aftermath it shares with its burn. */
#mountain.duck { opacity: 0.42; }

.lrung .lrPlate {
  fill: #16294a; stroke: #4a6ea8; stroke-width: 1.4;
  transition: fill 0.3s, stroke 0.3s;
}
.lrung .lrRule  { fill: #6fb7ff; opacity: 0.34; transition: opacity 0.3s; }
.lrung .lrIcon  { opacity: 0.85; transition: opacity 0.3s; }
.lrung .lrFlare { fill: none; stroke: none; opacity: 0; }
.lrung .lrBody  { transform-box: fill-box; transform-origin: center; }
/* the peak. It is the smallest rung on the board and it does its work by
   being the one at the top, not by being the loudest. */
#lrung-4 .lrPlate { stroke: #7fc4ff; }

/* BURNED. Good news, and the slot stays: the count of hollows below the
   boundary is how far up the run is. */
.lrung.burned .lrPlate { fill: #0a1223; stroke: #1e3050; }
.lrung.burned .lrRule  { opacity: 0.14; }
.lrung.burned .lrIcon  { opacity: 0; }

/* THE LOCK. The run has ended and the player's tier IGNITES — it flares and
   locks, and its card flies out to the front and stays there while the
   receipt begins. Locked, not lost. Ice, not gold: the reserved color rule
   holds everywhere except the Vault. */
.lrung.locked .lrPlate { fill: #2a5c96; stroke: #dff2ff; stroke-width: 2.2; }
.lrung.locked .lrRule  { fill: #eaf6ff; opacity: 0.9; }
.lrung.locked .lrIcon  { opacity: 1; }
.lrung.igniting .lrBody  { animation: rungIgnite 620ms cubic-bezier(.2,1.4,.4,1); }
.lrung.igniting .lrFlare {
  stroke: #dff2ff; stroke-width: 2.5; fill: #6fb7ff22;
  animation: rungFlare 620ms ease-out forwards;
  transform-box: fill-box; transform-origin: center;
}
@keyframes rungIgnite {
  0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); }
}
@keyframes rungFlare {
  from { opacity: 0; transform: scale(0.6); }
  30%  { opacity: 1; }
  to   { opacity: 0; transform: scale(1.9); }
}

/* THE FOLD. The tiers that escaped do not burn, do not shatter and are not
   dramatized in any way — they dim and fold flat in half a beat, as
   background business, while the won tier takes the light. This is the DoND
   warning applied: the AER 2008 finding is that dramatized loss states drive
   chasing, so the player's eye goes to what they got, never to what got away.
   Do not make this beautiful. */
.lrung.folded .lrBody {
  transform: scaleY(0.1); opacity: 0.14;
  transition: transform var(--fold, 260ms) ease-in, opacity var(--fold, 260ms) ease-in;
}
/* the A/B arm of the lock test — dramatized, DoND-style. Not the default. */
.lrung.foldBurn .lrBody {
  animation: rungBurnAway 460ms cubic-bezier(.3,.8,.4,1) forwards;
}
@keyframes rungBurnAway {
  0%   { transform: translateY(0) scale(1); opacity: 1; }
  18%  { transform: translateY(1px) scale(1.1, 0.82); }
  100% { transform: translateY(-24px) scale(0.9); opacity: 0; }
}

/* THE CONVERGENCE. At the Vault exactly two rungs remain and the crack colors
   light them: red the lower, gold the top. The board's endgame and the
   Vault's resolution are the same image, which is the one place the reserved
   colors are deliberately, correctly borrowed. */
.lrung.vaultLow  .lrPlate { stroke: #e8452c; stroke-width: 2.2; fill: #3a1a14; }
.lrung.vaultHigh .lrPlate { stroke: #f2c14e; stroke-width: 2.2; fill: #3a3014; }
.lrung.vaultLow  .lrRule  { fill: #ff9a7a; opacity: 0.8; }
.lrung.vaultHigh .lrRule  { fill: #ffe9a3; opacity: 0.9; }
.lrung.vaultLow, .lrung.vaultHigh { filter: url(#softGlow); }

/* --------------------------------------------------------- THE FLYOUT
   A rung is a glyph and a position; it cannot carry a value at that size and
   that distance. So the tier introduces itself: the card flies off the
   ladder to the front of the frame, holds a beat at a readable size, and only
   then shatters. The card is where the value lives.

   It lands above the fighters' heads and never covers a body, because during
   an Aftermath the board and the celebration own the beat together — they
   reinforce, they do not compete. */
.tcard .tcPlate {
  fill: #16294ae8; stroke: #6fb7ff; stroke-width: 2;
  filter: url(#dropShadow);
}
.tcard .tcName {
  fill: #9fd0f5; font: 600 13px "Segoe UI", system-ui, sans-serif;
  letter-spacing: 2.2px;
}
.tcard .tcVal {
  fill: #eaf6ff; font: 800 30px "Segoe UI", system-ui, sans-serif;
  letter-spacing: 1px; font-variant-numeric: tabular-nums;
}
.tcard .tcShare {
  fill: #7f93b0; font: 600 11px "Segoe UI", system-ui, sans-serif;
  text-anchor: end; letter-spacing: 1px;
}
.tcard.lockTone .tcPlate { fill: #2a5c96f0; stroke: #dff2ff; stroke-width: 2.6; }
.tcard.lockTone .tcVal   { fill: #ffffff; }
/* the one licensed exception, again: at the Vault the card that flies is the
   crack that is coming */
.tcard.goldTone .tcPlate { fill: #3a3014f0; stroke: #f2c14e; }
.tcard.goldTone .tcVal   { fill: #ffe9a3; }

/* the crowd pop the burn is staged on — off the card, never off the ground,
   because the ground belongs to the telegraph rings */
.tcPop {
  fill: none; stroke: #6fb7ff; stroke-width: 3;
  transform-box: fill-box; transform-origin: center;
  animation: tcPop 420ms ease-out forwards;
}
@keyframes tcPop {
  from { opacity: 0.9; transform: scale(0.86); }
  to   { opacity: 0;   transform: scale(1.34); }
}
.tshards .tsh {
  fill: #24405f; stroke: #4a6ea8; stroke-width: 1;
  transform-box: fill-box; transform-origin: center;
  animation: tshFly var(--burn, 260ms) cubic-bezier(.2,.7,.4,1) forwards;
  animation-delay: var(--d, 0ms);
}
@keyframes tshFly {
  0%   { transform: translate(0,0) rotate(0deg); opacity: 0.95; }
  100% { transform: translate(var(--dx), -58px) rotate(var(--rot)); opacity: 0; }
}

/* ------------------------------------------------------- THE TELL IS A FREEZE
   The hush. During the stop and the hold, everything that was moving stops
   moving — including the ambience, which is on its own continuous clock and
   would otherwise be the one thing in frame still drifting while two animals
   go rigid. Snow held mid-air is the cue; it costs nothing and it is the
   loudest thing available. */
#arenaSvg.hush .snowflake,
#arenaSvg.hush .aurora { animation-play-state: paused; }

/* The ring's pulse and the body's tremor share a clock — four tremors to a
   pulse, set from config in one place — so the telegraph and the flinch read as
   one event rather than two things that happen to coincide. */
.fxRing.pulsing {
  animation: ringBreath var(--pulse, 333ms) ease-in-out infinite alternate;
  transform-box: fill-box; transform-origin: center;
}
@keyframes ringBreath {
  from { transform: scale(1);     opacity: 0.86; }
  to   { transform: scale(1.045); opacity: 1; }
}
/* the one strand of dust that is allowed to move during the hold: stillness
   needs a witness, or it reads as a dropped frame instead of held breath */
.fxStrand { pointer-events: none; }

/* --------------------------------------------------------- THE WALKOUT
   The tale of the tape. Three slabs — WHO, THE MISMATCH, THE STAKE — held long
   enough to read, then wiped. Every element is a function of rung index, so two
   runs of different bands see identical cards.

   RESERVED COLOR RULE: amber, red and gold belong to the telegraph rings. This
   card is bone, slate and ice like the board; the Vault's variant is brighter,
   never gilded, because a gold card here would teach the ring grammar wrong. */
.tape { pointer-events: none; }
.tapeCard .tcBack {
  fill: #081326f2; stroke: #4a6ea8; stroke-width: 2; filter: url(#dropShadow);
}
.tapeCard.vault .tcBack { stroke: #9fd0f5; stroke-width: 2.6; }
.tslab .tsPlate { fill: #12233fdd; stroke: #27436d; stroke-width: 1.2; }
.tslab .tsLabel {
  fill: #7f93b0; font: 700 10px "Segoe UI", system-ui, sans-serif;
  letter-spacing: 2.4px;
}
.tslab .tsName {
  fill: #eaf6ff; font: 700 19px "Segoe UI", system-ui, sans-serif; letter-spacing: 0.6px;
}
.tslab .tsSub {
  fill: #9fd0f5; font: 600 12px "Segoe UI", system-ui, sans-serif; letter-spacing: 1.6px;
}
.tslab .tsStake {
  fill: #dff2ff; font: 800 19px "Segoe UI", system-ui, sans-serif; letter-spacing: 1.4px;
}
.tapeCard.vault .tslab .tsStake { fill: #ffffff; }
/* the mismatch, drawn: two bodies, one baseline, the difference bracketed */
.tslab .tsBase { stroke: #4a6ea8; stroke-width: 1.6; opacity: 0.7; }
.tslab .tsBracket { stroke: #9fd0f5; stroke-width: 1.4; fill: none; opacity: 0.9; }
.tslab .tsRatio {
  fill: #eaf6ff; font: 800 15px "Segoe UI", system-ui, sans-serif;
  text-anchor: end; font-variant-numeric: tabular-nums;
}
/* SILHOUETTES. The real bodies, flattened to one mass — the shape and the
   height are the read, and every detail inside them is noise at this size. */
.tsil .creature, .tsil .creature * {
  fill: #cfe0f0; stroke: none; opacity: 1; filter: none;
}
.tapeCard.vault .tsil .creature * { fill: #eaf6ff; }
.tsil .aura, .tsil .guardG, .tsil .face, .tsil .collarG,
.tsil .auricMote { display: none; }
/* The slabs land one after another, so the card reads left to right in the
   order the sentence does: who, how big, what it is worth. Opacity only — a
   CSS transform here would override the group's own translate and stack all
   three slabs on the card's origin. */
.tslab { animation: tsIn var(--slab, 140ms) ease-out backwards; animation-delay: calc(var(--i) * 60ms); }
@keyframes tsIn { from { opacity: 0; } }

/* team chips — who is packed, who is fronting, who went down. No numbers. */
#team { position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
.chip {
  display: flex; align-items: center; gap: 8px; padding: 5px 10px;
  background: #0a1428cc; border: 1px solid var(--line); border-radius: 8px; min-width: 170px;
  transition: opacity 0.3s, border-color 0.3s;
}
.chip.down { opacity: 0.34; filter: grayscale(1); }
.chip.lead { border-color: var(--accent); }
.chip .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line) inset; }
.chip .cname { font-size: 0.8rem; flex: 1; white-space: nowrap; }
.chip .charm { color: var(--gold); }

/* stakes + taps */
#stakes {
  position: absolute; bottom: 76px; left: 0; right: 0; text-align: center;
  font-size: 0.88rem; color: var(--dim); pointer-events: none; text-shadow: 0 2px 6px #000;
  min-height: 1.2em;
}
#actionBtn {

/* ---------------- svg animation bits ---------------- */

}

  from { transform: translateX(-30px); opacity: 0.75; }
  to { transform: translateX(30px); opacity: 1; }
}
.creature .exv { display: none; }
.creature[data-ex="normal"] .exv-normal,
.creature[data-ex="worried"] .exv-worried,
.creature[data-ex="fierce"] .exv-fierce,
.creature[data-ex="dizzy"] .exv-dizzy,

.creature .anim { transform-origin: 0px 0px; }
.box .anim { transform-origin: 0px 0px; }

/* ------------- momentum: the whole fight, read off bodies -------------
   Four transform layers, one owner each. `pos` is ground held (and the
   mismatch scale), `stance` is posture, `anim` is the current blow, `idle`
   is breathing. Momentum owns pos + stance and tweens both — it never snaps,
   because the transition is where the read lives. */
/* THE FRAME GRID OWNS THE PUPPETS.
   No CSS transitions on a fighter — the rig writes every transform by hand,
   on a frame. A browser tweening between the rig's frames would be exactly
   the thing stop motion is not: it would smooth out the grid and put us back
   to the floaty read. `.idle` carries the go-motion smear. */
.fighter { transition: none; }
.fighter > .stance { transform-origin: 0px 0px; transition: none; }
.fighter .idle { transform-origin: 0px -40px; transition: none; will-change: transform, filter; }
.guardG { transition: none; }

/* the guard: fists up, fists blocking, fists dropped, no fists */
.guardG .fist { transition: transform 0.34s cubic-bezier(.3,.9,.35,1), opacity 0.3s; }
.creature .guardG { opacity: 0; transition: opacity 0.3s; }
.creature[data-mom="DOMINANT"] .guardG,
.creature[data-mom="PRESSURED"] .guardG,
.creature[data-mom="BUCKLING"] .guardG { opacity: 1; }
.creature[data-mom="DOMINANT"] .fistL { transform: translate(16px, -22px); }
.creature[data-mom="DOMINANT"] .fistR { transform: translate(4px, -30px); }
.creature[data-mom="PRESSURED"] .fistL { transform: translate(22px, -6px); }
.creature[data-mom="PRESSURED"] .fistR { transform: translate(-16px, -8px); }
.creature[data-mom="BUCKLING"] .guardG { opacity: 0.8; }
.creature[data-mom="BUCKLING"] .fistL { transform: translate(6px, 26px); }
.creature[data-mom="BUCKLING"] .fistR { transform: translate(-8px, 30px); }

/* The idle bobs used to be CSS animations running on their own continuous
   clock — off the frame grid, and a permanent source of smooth motion under
   everything else. The rig does the breathing now, as a MOVING HOLD sampled
   on frames, so a held puppet is alive without ever leaving the grid. */

/* ================= THREAT IS OFF HUE =================
   The mismatch frame used to say cool blue = beatable, hot red = dangerous.
   With ICE and WATER on the roster — both blue — every ICE rival would have
   read as beatable whatever it actually was, and every FIRE rival dangerous.
   Colour is spoken for: the rings own amber, red and gold, the creatures own
   their materials. So the aura went ACHROMATIC and says the same thing with
   TURBULENCE, and the ground shadow says it a third time with WEIGHT. All
   three survive a greyscale screenshot, which the colour version never did. */
.fighter > .aura { opacity: 0; transition: opacity 0.4s; }
.fighter > .aura ellipse { fill: none; transform-origin: 0 -52px; }
.fighter > .aura.calm ellipse,
.fighter > .aura.agitated ellipse { fill: url(#auraNeutral); }
.fighter > .aura.calm ellipse {
  animation: auraBreathe var(--auraRate, 7.4s) ease-in-out infinite;
}
.fighter > .aura.agitated ellipse {
  animation: auraChurn var(--auraRate, 2.6s) cubic-bezier(.5,0,.5,1) infinite;
}
@keyframes auraBreathe {
  0%, 100% { transform: scale(1, 1); }
  50%      { transform: scale(var(--auraSwell, 1.02), calc(var(--auraSwell, 1.02) * 0.99)); }
}
@keyframes auraChurn {
  0%   { transform: scale(1, 1) translate(0, 0); }
  27%  { transform: scale(var(--auraSwell, 1.14), 0.94) translate(-5px, 3px); }
  53%  { transform: scale(0.93, var(--auraSwell, 1.14)) translate(4px, -4px); }
  78%  { transform: scale(var(--auraSwell, 1.14), 1.03) translate(3px, 2px); }
  100% { transform: scale(1, 1) translate(0, 0); }
}
/* ...and the leg of the read that survives everything: weight on the ground. */
.fighter > .shade {
  opacity: 0.42; transform-origin: 0 -3px;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
#arenaSvg.hush .fighter > .aura ellipse { animation-play-state: paused; }
#world { transform-origin: 480px 452px; transition: transform 0ms cubic-bezier(.3,.9,.35,1); }

/* celebration motes — count scales with band */
.fxBurst .mote {
  animation: moteFly 1.5s cubic-bezier(.15,.7,.3,1) forwards;
  animation-delay: var(--d);
}
@keyframes moteFly {
  from { transform: translate(0,0) scale(0.4); opacity: 1; }
  60%  { opacity: 1; }
  to   { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; }
}
/* A signature move's punctuation is short and crisp — it must never delay
   the next drop, and it must never read as a Clash. */
.fxSig .mote { animation-duration: 0.7s; }
/* the full pyro budget: columns going UP, the one direction nothing else in
   the product moves. Reserved absolutely for the 0.05%. */
.fxPyro .mote { animation-duration: 2.6s; }
.fxPyro .pyroCol {
  animation: pyroRise 1.1s cubic-bezier(.2,.9,.4,1) forwards;
  animation-delay: var(--d);
  transform-origin: 0 0;
}
@keyframes pyroRise {
  from { transform: scaleY(0.02); opacity: 0; }
  30%  { opacity: 1; }
  to   { transform: scaleY(1); opacity: 0; }
}

@media (max-width: 900px) {
  #setup { display: none; }
  #packGrid { grid-template-columns: repeat(2, 1fr); }
}

/* ==================================================================
   THE THREE ELEMENT MATERIALS, AS MOTION.

   The art spec's rule is that each element is a MATERIAL — fill, edge
   quality, internal light, and MOTION — never an icon, a letter or a badge.
   The fills live in art.js's defs; the motion lives here, because motion is
   half of what separates ICE from WATER and all of what makes FIRE read as
   fire when the frame is still.

     FIRE   constant small upward flicker even at rest. The only element that
            never fully settles vertically.
     ICE    holds still. When it moves it moves in DISCRETE STEPS, never a
            flow — which is what makes it the natural BRACE reader.
     WATER  never still, always flowing, and never the same outline twice.

   ICE and WATER are the same substance and must never read as similar
   creatures, so they are opposites in everything else: angular against
   rounded, opaque against translucent, heavy against light, still against
   never-still. If a viewer confuses them, the fix is here and in the
   silhouette — never a label.
   ================================================================== */
.creature.el-fire  { color: #ffb457; }
.creature.el-ice   { color: #cfe6f4; }
.creature.el-water { color: #6fd8d0; }

.creature .elSil { opacity: 0.92; }
.creature .elMat { pointer-events: none; }

/* FIRE — lit from within, and never at rest. The flicker is small and fast:
   a body that heaves would read as breathing, and this has to read as burning. */
.creature.el-fire .elSil { animation: fireFlick 0.62s steps(3, end) infinite; transform-origin: 0 -60px; }
.creature.el-fire .elCore { animation: fireCore 1.15s ease-in-out infinite; transform-origin: 0 -38px; }
.creature.el-fire .elEmbers .ember { animation: emberRise 1.9s linear infinite; }
.creature.el-fire .elEmbers .e1 { animation-delay: -0.4s; }
.creature.el-fire .elEmbers .e2 { animation-delay: -0.9s; }
.creature.el-fire .elEmbers .e3 { animation-delay: -1.3s; }
.creature.el-fire .elEmbers .e4 { animation-delay: -1.6s; }
/* Heat shimmer at the silhouette edge — the only displacement filter in the
   product, and it goes with everything else when effects are switched off. */
.creature.el-fire .elSil { filter: url(#heatShimmer); }
.novfx .creature.el-fire .elSil { filter: none; }
@keyframes fireFlick {
  0%, 100% { transform: scaleY(1)    translateY(0); }
  33%      { transform: scaleY(1.09) translateY(-3px); }
  66%      { transform: scaleY(0.95) translateY(1px); }
}
@keyframes fireCore {
  0%, 100% { opacity: 0.72; transform: scale(1, 1); }
  50%      { opacity: 0.9;  transform: scale(1.04, 1.07); }
}
@keyframes emberRise {
  from { transform: translate(0, 0) scale(1); opacity: 0.95; }
  to   { transform: translate(-6px, -46px) scale(0.3); opacity: 0; }
}

/* ICE — the stillest element. It does not animate at rest at all, and its one
   moving part steps rather than flows: vapour falling off its edges DOWNWARD,
   which is the opposite direction from FIRE's embers on purpose. */
.creature.el-ice .elFacet { opacity: 0.9; }
.creature.el-ice .elVapour .vapour { animation: vapourFall 2.6s steps(5, end) infinite; }
.creature.el-ice .elVapour .v1 { animation-delay: -0.7s; }
.creature.el-ice .elVapour .v2 { animation-delay: -1.4s; }
.creature.el-ice .elVapour .v3 { animation-delay: -2.0s; }
@keyframes vapourFall {
  from { transform: translate(0, -6px) scale(1); opacity: 0.5; }
  to   { transform: translate(2px, 16px) scale(1.5); opacity: 0; }
}

/* WATER — never still, and the outline is never the same twice. The body
   deforms continuously on a period that does not divide into any other clock
   in the product, so it never phase-locks with the ring's pulse or the rig. */
.creature.el-water .elBody { animation: waterFlow 3.1s ease-in-out infinite; transform-origin: 0 -34px; }
.creature.el-water .cells .cell { animation: cellWobble 2.7s ease-in-out infinite; }
.creature.el-water .cells .c1 { animation-delay: -0.3s; }
.creature.el-water .cells .c2 { animation-delay: -0.7s; }
.creature.el-water .cells .c3 { animation-delay: -1.1s; }
.creature.el-water .cells .c4 { animation-delay: -1.5s; }
.creature.el-water .cells .c5 { animation-delay: -1.9s; }
.creature.el-water .cells .c6 { animation-delay: -2.2s; }
.creature.el-water .cells .c7 { animation-delay: -0.5s; }
.creature.el-water .cells .c8 { animation-delay: -1.7s; }
.creature.el-water .cells .c9 { animation-delay: -2.5s; }
.creature.el-water .elDrops .drop { animation: dropFall 1.7s linear infinite; }
.creature.el-water .elDrops .d1 { animation-delay: -0.4s; }
.creature.el-water .elDrops .d2 { animation-delay: -0.8s; }
.creature.el-water .elDrops .d3 { animation-delay: -1.1s; }
.creature.el-water .elDrops .d4 { animation-delay: -1.4s; }
.creature.el-water .elSil ellipse { animation: waterBlob 2.3s ease-in-out infinite; }
@keyframes waterFlow {
  0%, 100% { transform: scale(1, 1)       translate(0, 0); }
  33%      { transform: scale(1.07, 0.95) translate(2px, 2px); }
  66%      { transform: scale(0.95, 1.06) translate(-2px, -1px); }
}
@keyframes waterBlob {
  0%, 100% { transform: scale(1, 1); }
  50%      { transform: scale(1.12, 0.9); }
}
@keyframes cellWobble {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(1.5px, -1.5px) scale(1.07); }
}
@keyframes dropFall {
  from { transform: translate(0, -4px); opacity: 0.75; }
  to   { transform: translate(1px, 14px); opacity: 0; }
}

/* The Tell's hold reaches the materials too. Everything that was moving stops
   moving — that is the correction the whole fight's rhythm rests on — and a
   creature still flickering through the freeze would be the one thing in frame
   telling the viewer the world had not actually stopped. */
#arenaSvg.hush .creature .elSil,
#arenaSvg.hush .creature .elMat,
#arenaSvg.hush .creature .elMat *,
#arenaSvg.hush .creature .cells .cell { animation-play-state: paused; }

/* ==================================================================
   THE DODGE, AND THE THREE LOSING IMAGES.
   ================================================================== */
/* The body is briefly not where the blow is. It does not fade out — a fade
   reads as a ghost, and this has to read as a body that moved. */
.fighter.dodging .idle { opacity: 0.24; transition: opacity 60ms linear; }

/* ==================================================================
   WHO SWUNG, AND WHO WORE IT.
   ==================================================================
   Everything else that answers this question lives in the GAP between the
   two bodies — the thrust, the cone, the star, the panel's wake — and a
   viewer whose eye is on a creature's face never looks at the gap. So the
   answer is written on the bodies as well, for the length of the stop:

     .striking  a rim light. It is the one throwing, and it is lit by its
                own blow.
     .struck    blown out toward white. The oldest damage read in the
                medium, it survives greyscale and peripheral vision, and it
                is unambiguous in a way no effect between two bodies can be.

   On `.stance` rather than `.idle`, because the rig writes `.idle`'s filter
   inline every frame for the go-motion smear and an inline filter would win.
   No transition on the way in: a hit-flash that fades up is a glow, and a
   glow is atmosphere. It arrives on the frame of contact or it is not a hit. */
.fighter.struck > .stance {
  filter: brightness(1.85) saturate(0.55) drop-shadow(0 0 5px rgba(255, 248, 221, 0.8));
}
.fighter.striking > .stance {
  filter: drop-shadow(0 0 7px rgba(255, 248, 221, 0.9)) drop-shadow(0 0 16px rgba(242, 193, 78, 0.45));
}
/* ...and out on a ramp, so the body cools back down instead of snapping. */
.fighter > .stance { transition: filter 180ms linear; }
.fighter.struck > .stance, .fighter.striking > .stance { transition: none; }

.fxSignature { pointer-events: none; }
.fxFlare .flareTongue { animation: flareUp 0.42s ease-out both; transform-origin: 0 0; }
.fxFlare .ft1 { animation-delay: 30ms; } .fxFlare .ft2 { animation-delay: 60ms; }
.fxFlare .ft3 { animation-delay: 45ms; } .fxFlare .ft4 { animation-delay: 15ms; }
@keyframes flareUp {
  from { transform: scaleY(0.2) translateY(10px); opacity: 0.2; }
  60%  { transform: scaleY(1.15) translateY(-6px); opacity: 1; }
  to   { transform: scaleY(0.9) translateY(-14px); opacity: 0; }
}
/* ICE is the only signature that makes contact, so it is the only one with a
   spark. The facet holds absolutely still while the sparks fly off it. */
.fxPlant .skateSpark { animation: skateOff 0.3s linear both; }
.fxPlant .ss1 { animation-delay: 24ms; } .fxPlant .ss3 { animation-delay: 48ms; }
.fxPlant .ss5 { animation-delay: 36ms; } .fxPlant .ss7 { animation-delay: 60ms; }
@keyframes skateOff {
  from { opacity: 1; transform: scale(0.2); }
  to   { opacity: 0; transform: scale(1.25); }
}
/* WATER's is the clearest of the three and the reference build: the body
   separates and closes behind the blow. */
.fxPart .ph0 { animation: partLeft  0.46s cubic-bezier(.3,.9,.4,1) both; }
.fxPart .ph1 { animation: partRight 0.46s cubic-bezier(.3,.9,.4,1) both; }
.fxPart .partRipple { animation: ripple 0.5s ease-out both; transform-origin: 0 -40px; }
.fxPart .pr1 { animation-delay: 60ms; } .fxPart .pr2 { animation-delay: 120ms; }
@keyframes partLeft {
  0% { transform: translateX(0); } 45% { transform: translateX(-26px); } 100% { transform: translateX(0); }
}
@keyframes partRight {
  0% { transform: translateX(0); } 45% { transform: translateX(26px); } 100% { transform: translateX(0); }
}
@keyframes ripple {
  from { transform: scale(0.5); opacity: 0.9; }
  to   { transform: scale(1.5); opacity: 0; }
}

/* FIRE beats ICE — the facets round off and it slumps into a puddle. */
.fxMelt .meltDrip { animation: meltRun 0.9s cubic-bezier(.4,0,.7,1) both; }
.fxMelt .md1 { animation-delay: 60ms; } .fxMelt .md2 { animation-delay: 30ms; }
.fxMelt .md3 { animation-delay: 90ms; } .fxMelt .md4 { animation-delay: 45ms; }
.fxMelt .md5 { animation-delay: 110ms; }
.fxMelt .meltPool { animation: puddle 0.9s ease-out both; }
@keyframes meltRun {
  from { transform: translateY(-14px) scaleY(0.4); opacity: 0.2; }
  to   { transform: translateY(10px)  scaleY(1.25); opacity: 0.9; }
}
@keyframes puddle {
  from { transform: scale(0.2, 0.4); opacity: 0.3; }
  to   { transform: scale(4.2, 1.1); opacity: 0.95; }
}
/* ICE beats WATER — opaque and rigid in ONE beat, and then it shatters. The
   arrest is the whole gag, so the shell snaps in with no ease at all. */
.fxFreeze .frShell { animation: frostOver 0.16s steps(2, end) both; transform-origin: 0 -40px; }
.fxFreeze .frCrack { animation: crackIn 0.2s steps(3, end) both; animation-delay: 0.3s; }
.fxFreeze .frShard { animation: shatterOut 0.6s cubic-bezier(.2,.7,.4,1) both; animation-delay: calc(0.44s + var(--d)); }
@keyframes frostOver {
  from { opacity: 0; transform: scale(0.86); }
  to   { opacity: 0.92; transform: scale(1); }
}
@keyframes crackIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes shatterOut {
  from { transform: translate(0, 0) rotate(0deg); opacity: 1; }
  to   { transform: translate(var(--dx), var(--dy)) rotate(140deg); opacity: 0; }
}
/* WATER beats FIRE — the light dies from the EXTREMITIES INWARD, which is the
   whole read, and then steam. */
.fxGutter .gCore { animation: gutterIn 0.72s cubic-bezier(.6,0,.9,.6) both; transform-origin: 0 -40px; }
.fxGutter .gsmoke { animation: smokeUp 1.1s ease-out both; animation-delay: calc(0.34s + var(--d)); }
.fxGutter .gHiss { animation: hiss 0.5s ease-out both; animation-delay: 0.3s; }
@keyframes gutterIn {
  from { transform: scale(1, 1); opacity: 0.85; }
  55%  { transform: scale(0.62, 0.7); opacity: 0.7; }
  to   { transform: scale(0.12, 0.16); opacity: 0; }
}
@keyframes smokeUp {
  from { transform: translate(0, 0) scale(0.5); opacity: 0.5; }
  to   { transform: translate(var(--dx), -70px) scale(2.1); opacity: 0; }
}
@keyframes hiss { from { opacity: 0.6; transform: scale(0.6); } to { opacity: 0; transform: scale(1.5); } }

/* A defeated body stops being a Boxling in the same beat the image says it
   did, so none of the momentum system's vocabulary survives on top of it. */
.fighter.defeated .guardG, .fighter.defeated .aura { opacity: 0 !important; }
.fighter.defeated .elMat, .fighter.defeated .elSil { display: none; }

/* ==================================================================
   THE CARD'S FOURTH SLAB — THE EDGE.
   Typographic weight and size, NEVER colour: FAVOURED in green and OUTMATCHED
   in red would put a fourth system into the colour channel this pass just
   finished cleaning up. The only colour on the card comes from the two element
   materials themselves.
   ================================================================== */
.tslab .tsEdge {
  fill: #eaf6ff; font: 900 24px "Segoe UI", system-ui, sans-serif; letter-spacing: 0.6px;
}
.tslab .tsEdge.outmatched { font-size: 19px; opacity: 0.82; letter-spacing: 0.2px; }
.tslab .tsEdge.even       { font-size: 19px; opacity: 0.6; font-weight: 600; }
.tslab .tsEdgeWhy {
  fill: #8fa6c2; font: 500 12px "Segoe UI", system-ui, sans-serif; letter-spacing: 0.4px;
}
/* The two element materials, either side of the size comparison. On a counter
   pairing they meet at the slab's centre in a half-second loop, using the same
   imagery as the defeat — the card and the KO teach the same lesson twice. On
   a mirror they sit apart and neither moves. */
.tsEl { transform-box: fill-box; transform-origin: center; }
.tapeCard .tsEl.left  { animation: edgeIn 1.4s ease-in-out infinite; }
.tapeCard .tsEl.right { animation: edgeIn 1.4s ease-in-out infinite; animation-delay: -0.7s; }
.tsClash .tsClashPop { animation: clashPop 1.4s ease-out infinite; transform-origin: center; }
@keyframes edgeIn {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.07); }
}
@keyframes clashPop {
  0%, 55% { transform: scale(0.2); opacity: 0; }
  70%     { transform: scale(1);   opacity: 0.9; }
  100%    { transform: scale(1.8); opacity: 0; }
}
/* Flattened with everything else on the silhouette slab: the comparison's job
   is height, and a lit core inside a black shape is noise at that size. */
.tsil .elMat, .tsil .shade { display: none; }

/* Packing says the element in words, because packing is a menu and the spec
   asks for this to be said plainly. In the arena it is only ever the material. */
.pcEl {
  font: 800 0.6rem "Segoe UI", system-ui, sans-serif; letter-spacing: 1.6px;
  margin-left: 7px; padding: 1px 5px; border-radius: 3px; font-style: normal;
  border: 1px solid currentColor; opacity: 0.85;
}
.pcEl.el-fire  { color: #ffb457; }
.pcEl.el-ice   { color: #cfe6f4; }
.pcEl.el-water { color: #6fd8d0; }
.pcRing { font-size: 0.62rem; color: var(--dim); letter-spacing: 0.6px; opacity: 0.8; }

</style>

<script>
/* ---- js/fair.js ---- */
/* Boxlings Battle — fairness core.
   Pure, synchronous, dependency-free. The prize is a function of
   (serverSeed, clientSeed, openIndex) and nothing else. */
window.BB = window.BB || {};
BB.fair = (() => {

  // ---- SHA-256 (compact, sync, correct for byte arrays) ----
  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

  function utf8(s){ const out=[]; for(let i=0;i<s.length;i++){ let c=s.codePointAt(i);
    if(c>0xffff) i++;
    if(c<0x80) out.push(c);
    else if(c<0x800){ out.push(0xc0|c>>6, 0x80|c&63); }
    else if(c<0x10000){ out.push(0xe0|c>>12, 0x80|c>>6&63, 0x80|c&63); }
    else { out.push(0xf0|c>>18, 0x80|c>>12&63, 0x80|c>>6&63, 0x80|c&63); } }
    return out; }

  function sha256Bytes(bytes){
    const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const l = bytes.length;
    const msg = bytes.slice();
    msg.push(0x80);
    while (msg.length % 64 !== 56) msg.push(0);
    const hi = Math.floor(l*8 / 0x100000000), lo = (l*8) >>> 0;
    msg.push(hi>>>24&255, hi>>>16&255, hi>>>8&255, hi&255, lo>>>24&255, lo>>>16&255, lo>>>8&255, lo&255);
    const w = new Array(64);
    const rr = (x,n)=> (x>>>n | x<<(32-n)) >>> 0;
    for(let i=0;i<msg.length;i+=64){
      for(let t=0;t<16;t++) w[t] = (msg[i+t*4]<<24 | msg[i+t*4+1]<<16 | msg[i+t*4+2]<<8 | msg[i+t*4+3]) >>> 0;
      for(let t=16;t<64;t++){
        const s0 = rr(w[t-15],7) ^ rr(w[t-15],18) ^ (w[t-15]>>>3);
        const s1 = rr(w[t-2],17) ^ rr(w[t-2],19) ^ (w[t-2]>>>10);
        w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
      }
      let [a,b,c,d,e,f,g,h] = H;
      for(let t=0;t<64;t++){
        const S1 = rr(e,6)^rr(e,11)^rr(e,25);
        const ch = (e&f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
        const S0 = rr(a,2)^rr(a,13)^rr(a,22);
        const maj = (a&b)^(a&c)^(b&c);
        const t2 = (S0 + maj) >>> 0;
        h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
      }
      H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
      H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
    }
    const out=[];
    for(const x of H) out.push(x>>>24&255, x>>>16&255, x>>>8&255, x&255);
    return out;
  }

  const toHex = bytes => bytes.map(b=>b.toString(16).padStart(2,'0')).join('');
  const sha256Hex = s => toHex(sha256Bytes(utf8(s)));

  function hmacSha256Hex(keyStr, msgStr){
    let key = utf8(keyStr);
    if (key.length > 64) key = sha256Bytes(key);
    while (key.length < 64) key.push(0);
    const ipad = key.map(b=>b^0x36), opad = key.map(b=>b^0x5c);
    const inner = sha256Bytes(ipad.concat(utf8(msgStr)));
    return toHex(sha256Bytes(opad.concat(inner)));
  }

  // ---- PRNG streams, domain-separated from the seal ----
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* A stream is a PRNG seeded by HMAC(seal, label). "outcome", "script",
     "tells", "cosmetic", "matchup" and "clock" can never contaminate one
     another, and every stream replays bit-identically from the seal.

     "matchup" is the fifth, and it earns its own label rather than sharing
     one. It carries the rival's element and the upset draw, and both have to
     be provably independent of the BAND — which is the false-belief guard's
     first rule ("element never correlates with band"). Sharing `tells` would
     not have been: the omens consume a band-dependent NUMBER of draws before
     the rungs are authored, so everything after them sits at a band-dependent
     offset in that stream. Independence by construction, not by audit.

     "clock" is the sixth, added with v3.7, and it exists for exactly the same
     reason the fifth did. The broken clock's jitter has to be provably
     independent of the outcome — "the jitter seed is drawn AFTER the outcome is
     decided and independently of it; it never shares a stream with the outcome
     draw", and "no elapsed duration may correlate with a resolution". The
     obvious home was `cosmetic`, and that would have been wrong in a way that
     is invisible until you look: `cosmetic` is consumed PER COMMIT (the
     block/dodge coin, the slip, the survival image), and the number of commits
     a run plays is the band. Anything drawn from it after the rungs are
     authored therefore sits at a band-dependent offset — which is the precise
     bug that forced `matchup` out of `tells`. One draw, one label, no offset,
     no correlation to audit for. */
  function stream(sealHex, label){
    const h = hmacSha256Hex(sealHex, 'stream:' + label);
    return mulberry32(parseInt(h.slice(0, 8), 16));
  }

  function randomHex(nBytes){
    const a = new Uint8Array(nBytes);
    crypto.getRandomValues(a);
    return toHex(Array.from(a));
  }

  // rng helpers
  const pick = (rng, arr) => arr[Math.floor(rng()*arr.length)];
  const rint = (rng, lo, hi) => lo + Math.floor(rng()*(hi-lo+1)); // inclusive
  function weighted(rng, entries){ // entries: [{weight, ...}]
    const total = entries.reduce((s,e)=>s+e.weight, 0);
    let r = rng()*total;
    for(const e of entries){ r -= e.weight; if (r < 0) return e; }
    return entries[entries.length-1];
  }

  function makeSeal(serverSeed, clientSeed, openIndex){
    return hmacSha256Hex(serverSeed, clientSeed + '|' + openIndex);
  }

  return { sha256Hex, hmacSha256Hex, mulberry32, stream, randomHex,
           pick, rint, weighted, makeSeal };
})();

</script>
<script>
/* ---- js/config.js ---- */
/* Boxlings Battle — configuration.
   Every contested number lives here, and every number is a default, not a
   constant. The reveal rework (Design.md) deleted the rule layer: there is no
   element chart, no HP, no move list, no turn simulation. What is left is a
   body read (momentum), a physical read (mismatch), and a time budget. */
window.BB = window.BB || {};
BB.config = (() => {

  const box = {
    id: 'glacier-vault',
    name: 'Glacier Vault Box',
    price: 25.00,
    // Published drop table. Weights are percent shares and sum to 100.
    dropTable: [
      { id:'sticker',  name:'Frostbitten Sticker Pack',   value:  2.00, weight: 20.00 },
      { id:'pin',      name:'Glacier Enamel Pin',         value:  4.00, weight: 15.00 },
      { id:'sleeves',  name:'Boxling Card Sleeves',       value:  6.00, weight: 14.95 },
      { id:'keyring',  name:'Ice Chip Keyring',           value:  8.00, weight: 10.00 },
      { id:'deckbox',  name:'Rime Deck Box',              value: 12.00, weight: 14.00 },
      { id:'playmat',  name:'Aurora Playmat',             value: 17.00, weight: 12.00 },
      { id:'holo',     name:'Holo Boxling Card',          value: 25.00, weight:  6.00 },
      { id:'tee',      name:'Glacier Vault Tee',          value: 35.00, weight:  4.00 },
      { id:'case',     name:'Etched Steel Display Case',  value: 60.00, weight:  2.50 },
      { id:'proof',    name:'Signed Artist Proof',        value:120.00, weight:  1.50 },
      { id:'auric11',  name:'THE AURIC — 1/1 Gold Foil',  value:500.00, weight:  0.05 },
    ],
  };

  /* Value bands. The band a prize falls in is a property of the DROP TABLE and
     never changes. Where a band ends its run is fixed: one band, one height. */
  const bands = [
    { i:0, label:'under 0.35×',  range:[0,    0.35],  share:'59.95%' },
    { i:1, label:'0.35× – 0.8×', range:[0.35, 0.8 ],  share:'26%'    },
    { i:2, label:'0.8× – 1.6×',  range:[0.8,  1.6 ],  share:'10%'    },
    { i:3, label:'1.6× – 8×',    range:[1.6,  8   ],  share:'4%'     },
    { i:4, label:'8× or more',   range:[8, Infinity], share:'0.05%'  },
  ];

  /* THE LADDER — the hook, two rungs, the Vault. Rung 1 is the opener and
     rung 4 is the Vault, so there are exactly two fights. Each band ends on
     exactly one rung; nothing is drawn twice. */
  const height = 4;
  const bandRung = [1, 2, 3, 4, 4];         // band index -> terminal rung
  const bandVaultWin = [0, 0, 0, 0, 1];     // only the grail cracks it gold

  const rungBoxGrade = { 1:'cardboard', 2:'crate', 3:'steel', 4:'vault' };

  /* THE MISMATCH TELEGRAPH — replaces the Parade.
     Fixed per rung, never per band, never drawn. The climb is one small
     fighter against progressively larger ones; the underdog structure is the
     point, and a ratio that varied by band would name the prize.

     v3.6 RENAMED THESE, and the rename is the fix rather than tidying. The
     keys used to be `favorable` / `unfavorable` / `dire` — a scale of how the
     fight FEELS — and rung 1 was `favorable` at 1.00/0.75, i.e. the player
     bigger, the ground tilted their way, the card free to read FAVOURED. Rung
     1 kills 65% of everyone who reaches it. The keys are now named for what
     the rung's dominant commit DOES, so a ratio can no longer drift away from
     the survival rate it sits in front of:

       killing   the rung's fatal commit. 1.2 to 1.6, never smaller.
       peril     the same, at the rung where the red lives.
       pressure  cannot kill. 1.4 to 1.9, the largest in the game at the Vault.

     See THE HONESTY RULE. A signal may never promise an outcome the position's
     survival rate contradicts, and size is a signal. */
  const rungMismatch = { 2:'killing', 3:'peril', 4:'pressure' };

  /* ----------------------------------------------------------- THE WALKOUT
     The opener's box drop is already a presentation beat: it lands, it
     establishes the stakes, and the viewer knows what it means if the box
     fails to open. Every rung above the first needs the same service, because
     a fight nobody was introduced to is a fight nobody has a reason to watch.

     It ABSORBS the confrontation frame at those rungs rather than sitting
     beside it — the frame's job (both bodies on screen at their true relative
     size) becomes the card beat's hold. Rung 1 keeps the bare frame, so the
     opener flows straight into the first fight without a speed bump.

     Why it cannot leak: every element is a function of rung index. Two runs of
     different bands arriving at rung 2 see identical cards, and the stake line
     names what a win REMOVES, which is already public on the board. */
  const walkoutFrom = 3;                    // every rung above the first
  const hasWalkout = rung => rung >= walkoutFrom;
  const walkout = {
    /* Shares of the beat. Authored against 2.5s: 0.4 / 0.4 / 0.9 / 0.5 / 0.3.

       THE STAKE IS A FIFTH BEAT NOW, and merging it in is what it is for. The
       card's fourth slab names a band — WIN AND BAND 3 BURNS — and the board
       has been carrying that band's card up on the mountain the whole time,
       too small and too far back to read. They were the same statement made
       twice, a beat apart, in two places, and neither one landed: the line is
       a name without a value, the rung is a value without a name.

       So the tape leaves and the tier it just named flies off its rung to the
       front, at a readable size, and holds. The stake stops being a sentence
       and becomes the money. It does NOT burn — nothing has been proved yet,
       and the board may only ever display what a clash has already shown — so
       the card goes back to its rung and the fight starts.

       It cannot leak: which tier is at stake at a rung is a function of rung
       index, exactly like the stake line it replaces, and both are derived
       from the same fatal table the board's prune schedule is. */
    arrival: 0.16,   // the rival's box lands hard. Dust, shake, the turn to face it.
    burst:   0.16,   // it bursts and the rival is out — the opener's shape, on purpose,
                     // so the run rhymes with itself: a box opening starts a threat
    card:    0.36,   // both fighters hold in frame and the tale of the tape slides in
    stake:   0.20,   // the tape goes, and the band it named comes down off the mountain
    clear:   0.12,   // it returns to its rung, they drop into Circle, the fight is live
    /* TURBO. It compresses but is never skipped, because at speed it is the
       only thing separating one fight from the next: arrival and burst play,
       the card flashes as a single frame hold, there is no clear beat. The
       stake survives turbo at a reduced share — it is the one beat that says
       what the next thirty seconds are worth. */
    turbo:      680,
    turboCard:  0.20,
    turboStake: 0.16,
    /* The card. FOUR slabs now, all safe: WHO (pure flavour, rotates freely),
       THE MISMATCH (the confrontation frame's job made literal — two
       silhouettes on a shared baseline, with the two element materials either
       side of them), THE EDGE (the one-word verdict the packing choice
       bought), THE STAKE (read straight off the board). Viewport units; it
       lands over the bodies and leaves again.

       IT GREW FOR THE FOURTH SLAB. At 742×158 a four-way split gave the text
       slabs 138px each and the word FAVOURED alone is 156px at the weight it
       has to be read at — so either the type shrank below a glance or the card
       grew. The card grew: 880 of the arena's 960, which still leaves a margin
       either side, and 178 tall so the element chips clear the size bracket
       instead of sitting on it. */
    tape: { w: 880, h: 178, x: 480, y: 250 },
    /* PER-RIVAL ENTRANCE BEHAVIOUR. With animation treated as abundant, every
       rival gets its own arrival and its own way out of the box. The beat
       STRUCTURE is fixed — the performance inside it never repeats. Drawn from
       the cosmetic stream, so it carries nothing. */
    entrances: [
      { id:'slam',   drop:-360, spin:   0, bounce:0.00, out:'down',  dust:1.30, shake:1.00 },
      { id:'skid',   drop:-140, spin: -14, bounce:0.10, out:'side',  dust:1.60, shake:0.75 },
      { id:'tumble', drop:-420, spin: 200, bounce:0.26, out:'up',    dust:1.00, shake:0.85 },
      { id:'stomp',  drop:-300, spin:   6, bounce:0.14, out:'rise',  dust:1.45, shake:1.20 },
    ],
  };

  /* ========================================================== THE MATCHUP
     Elements, restored small.

     Cutting the eight-element chart was right, and it left a hole: nothing
     about your Boxling touched anything about the rival, so packing was inert.
     The fix is not the chart back. Eight types with strong / weak / immune is
     64 cells, which has to be MEMORIZED — a literacy tax, correctly deleted.
     What comes back is different in kind: elements whose relationships are
     physical world knowledge, needing zero instruction.

     THREE, not four, and the number is the argument. Every link has to be
     instant, and only a handful of elemental relationships actually are. Every
     four-element ring contains at least one link that needs a beat of thought
     (lightning shattering stone, ice grounding a storm), and a ring is only as
     legible as its weakest link. These three are the strongest available: a
     child knows all of them.

       FIRE  beats ICE    fire melts ice
       ICE   beats WATER  ice freezes water solid
       WATER beats FIRE   water puts fire out

     No chart, no lookup, no tutorial, no immunities, no half-damage tiers, no
     resistances. Every pairing is either a counter or a mirror, and a mirror
     reads as EVEN.

     THE PROPERTY THAT MAKES THREE BETTER THAN FOUR: the defeat teaches the
     rule. Each relationship has one obvious losing image, so the KO animation
     IS the lesson and the game never explains itself. Three arms means the
     whole system is taught in three losses, which a volume user sees inside
     their first session.

     AND THE TWO RULES THAT KEEP IT HONEST. Nothing here touches the outcome,
     which was sealed at packing. Matchup is a function of the rival's element
     (scripted per rung, band-blind) and the player's element (chosen at
     packing, before the outcome existed). It is presentation for a decided
     result, exactly like everything else in the fight. */
  const elements = {
    fire: {
      id:'fire', name:'FIRE', beats:'ice', because:'fire melts ice',
      /* The losing image for THIS element, i.e. what it does when its own
         counter finishes it. WATER beats FIRE: the internal light dies from
         the extremities inward, then steam and smoke. */
      losesAs:'gutter',
      /* The physical signature: what it does when it slips a blow, and the
         same gesture that plays as harmless Circle texture a rung earlier. */
      signature:'flare',
      sigVerb:'flares up, and the blow passes through it',
      /* PALETTE CONSTRAINT, and it is a signal-safety rule rather than taste.
         Telegraph rings own saturated amber, red and gold. FIRE runs orange
         into WHITE-HOT and never into deep crimson, because deep crimson is
         the red ring's and a creature that shares a hue with the most
         important signal on screen is how a signal stops being one. */
      core:'#2a1408', lit:'#ff9a3c', hot:'#fff3d0', trail:'#ffb457',
    },
    ice: {
      id:'ice', name:'ICE', beats:'water', because:'ice freezes water solid',
      losesAs:'melt', signature:'plant',
      sigVerb:'plants, and the strike skates off a facet',
      core:'#dfeef8', lit:'#f4fbff', hot:'#ffffff', trail:'#cfe6f4',
    },
    water: {
      id:'water', name:'WATER', beats:'fire', because:'water puts fire out',
      losesAs:'freeze', signature:'part',
      sigVerb:'parts around the blow and closes behind it',
      core:'#134a52', lit:'#3fb3ab', hot:'#9df0e6', trail:'#6fd8d0',
    },
  };
  const elementIds = ['fire', 'ice', 'water'];
  /* Closed ring: every non-mirror pairing is a counter one way or the other,
     so there is no third case to teach. `even` means mirror, and nothing more. */
  function edgeOf(playerEl, rivalEl){
    if (!playerEl || !rivalEl || playerEl === rivalEl) return 'even';
    if (elements[playerEl] && elements[playerEl].beats === rivalEl) return 'favoured';
    if (elements[rivalEl] && elements[rivalEl].beats === playerEl) return 'outmatched';
    return 'even';
  }
  const edgeWord = { favoured:'FAVOURED', outmatched:'OUTMATCHED', even:'EVEN' };

  /* The element that beats this one — the rival you do NOT want to meet. In a
     closed three-ring exactly one exists for every element, which is what
     makes the schedule below expressible at all. */
  const counterOf = el => elementIds.find(e => elements[e] && elements[e].beats === el) || el;

  /* ================= THE ELEMENT SCHEDULE, v3.6 =================
     THE EDGE IS NOW A FUNCTION OF POSITION, and this is the honesty fix.

     It used to be a uniform draw over the three-ring, blind to what the player
     packed. That is a beautiful guard and it produced a lie: a uniform draw
     put FAVOURED on the walkout card at rung 1 a third of the time, in front
     of the commit that ends 65% of the runs that reach it. THE HONESTY RULE
     says a signal may never promise an outcome the position's survival rate
     contradicts, so the draw cannot be free at a killing commit.

       rung 1  killing.  EVEN or OUTMATCHED, 50/50. A mirror or the counter.
       rung 2  killing.  OUTMATCHED. The counter, always — the red is the
                         worst moment in the game and it says so.
       Vault   pressure. OUTMATCHED but survivable. The counter, at 1.9x, and
                         it cannot kill. OUTMATCHED is a PESSIMISTIC signal, so
                         showing it in front of a 100%-survival commit breaks
                         nothing: the rule forbids over-promising, not
                         under-promising, and it is what lets the Vault feel
                         enormous without lying.

     FAVOURED APPEARS NOWHERE ON THIS TABLE, which is the point. Where the
     player is favoured is the gold, and the gold earns it in front of the
     viewer through momentum rather than claiming it on a card beforehand —
     see `finishRatio`. FAVOURED is a promise the game now keeps every time.

     WHAT THIS COSTS THE FALSE-BELIEF GUARD, stated plainly because it is a
     real change and not a free one. Rule 2 used to read "the rival element
     schedule is blind to your pick". It is not any more: the rival's element
     is DERIVED from yours. What survives, and what the guard was actually
     protecting, is that the derivation is identical for every packing — every
     element meets a mirror and a counter at exactly the same rates, at exactly
     the same positions, so no packing choice meets more counters than any
     other and none of them can pull a better band. Rules 1 and 3 are
     untouched: the band still comes off its own stream, and the receipt still
     never mentions the matchup. Rule 2 is now "a function of your pick with
     pack-invariant edge rates" rather than "blind to your pick", and the
     audit asserts the invariance rather than the blindness. */
  /* WEIGHTED BY REPETITION, and the weights are the point rather than a detail.
     The first version of this table pinned rung 2 and the Vault to a single
     legal edge, which made their walkout cards byte-identical on every run a
     player ever sees: same element, same verdict, same losing image. Measured
     over 400 seals, sixteen of thirty observable fields never moved. That is
     the invariance rule enforced one level too far — it forbids informational
     variance ACROSS BANDS, and it MANDATES cosmetic variance across seals.

     The honesty rule is what actually constrains this, and it constrains less
     than the first pass assumed: "killing commits are EVEN or OUTMATCHED".
     EVEN is legal at a killing commit. So every rung draws, and the weights
     carry the escalation the fixed values were being used to express — rung 1
     is a coin flip, rung 2 leans hard on OUTMATCHED, the Vault harder still. */
  const rungEdgePlan = {
    2: ['even', 'outmatched'],                                  // 1/2 — the climb opens honest
    3: ['outmatched', 'outmatched', 'even'],                    // 2/3 — the peril usually counters
    4: ['outmatched', 'outmatched', 'outmatched', 'even'],      // 3/4 — the Vault almost always
  };
  function rivalElementFor(playerEl, rung, u){
    const legal = rungEdgePlan[rung] || ['even'];
    const edge = legal[Math.min(legal.length - 1, Math.floor(u * legal.length))];
    return { element: edge === 'outmatched' ? counterOf(playerEl)
                    : edge === 'favoured'   ? (elements[playerEl] || {}).beats || playerEl
                    : playerEl,
             edge };
  }
  /* The opener still draws freely. There is no card and no EDGE in the first
     three seconds — the opener is the tutorial for the commit and a verdict
     slab in it would be one system too many — so nothing there can promise
     anything, and the rival is free to be any material at all. */
  const rivalElementDraw = u => elementIds[Math.min(elementIds.length - 1,
                                                   Math.floor(u * elementIds.length))];

  /* ------------------------------------------------------------ THE UPSET
     If a favoured matchup always won, the card would spoil the fight and the
     run would be readable at the walkout. So favourites usually win and
     sometimes do not, and the rate is the design's dial for how much the card
     is allowed to say.

     85%, and the number is borrowed rather than invented: in the NCAA
     tournament's round of 64 since 1985 a 3 seed beats a 14 seed 85.6% of the
     time (137-23). That is the bracket line people actually watch for upsets —
     often enough that everyone knows it can happen, rare enough that it is a
     story every time. Compare 1-over-16 at 98.8%, which is so safe it is
     boring, and 8-versus-9 at 48.1%, which carries no information at all.

     WHAT AN UPSET IS AND IS NOT. It changes WHICH commit resolves the rung and
     HOW — never whether the run continues. The band already decided that. It
     is the difference between "won as expected" and "won by the skin of its
     teeth", or between "lost to a superior rival" and "lost to something it
     should have beaten". A variation in the TELLING, not in the result, which
     is exactly why it can be scheduled freely without leaking anything.

     THE BUDGET IS SPENT BY POSITION, like everything else. Rung 1 is nearly
     free of them: early fights teach the grammar, and a first-rung upset
     before the player has learned that FAVOURED usually holds just reads as
     the card lying. Rung 2 is the upset's home, because that is where the
     peril beat lives. The Vault gets its share but always staged as survival
     rather than domination. */
  /* ############ SUPERSEDED BY v3.6, KEPT AS THE DORMANT A/B ARM ############
     Everything above this line is the v3.5 argument and it is still a good
     one; it is answering the wrong question. v3.6:

       "There is no separate upset dial. The upset rate IS the published
        survival rate at each killing commit: 40.1%, 35.1%, 28.8%. These are
        already in the band table, already public, and already honest.
        Nothing needs tuning; it needs staging."

     The 85% was a dial for how much the card is allowed to say, and it was
     calibrated against a card that was allowed to say FAVOURED in front of a
     fight the player loses two times in three. Once FAVOURED can only appear
     where the player always wins, there is nothing left for an upset rate to
     mean: a favourite that loses is now illegal by construction, and a
     favourite that wins by the skin of its teeth is a favourite that was never
     in danger. THE UPSET IS SURVIVAL NOW. Surviving a killing commit is the
     good news, it happens at the honest published rate, and it is staged with
     the dodge.

     This block does not ship. It is reachable through `live.upsetModel` and it
     sits here for the same reason `lossStaging: 'burn'` does — so the two arms
     can be measured against each other rather than argued about. See
     `upsetActive()`. */
  const upset = {
    /* Keyed on the code's rung index: 2 = "rung 1", 3 = "rung 2", 4 = the Vault. */
    rate: { 2:0.05, 3:0.20, 4:0.15 },
    /* An upset needs a favourite to upset. On a mirror the card said nothing,
       so there is nothing to contradict and no upset is drawn at all. */
    needsEdge: true,
  };

  /* ------------------------------------------------------------- THE DODGE
     A rare outcome that arrives with no setup reads as the game cheating. The
     dodge is the upset's staging, and its rule is that the capability must be
     visible BEFORE it is needed.

     FORESHADOWING, ONE RUNG EARLY, MANDATORY. Every Boxling has one physical
     signature — FIRE flares up, ICE plants and holds, WATER parts and reforms.
     It plays as harmless texture during Circle in the rung before any upset
     could use it, ALWAYS, whether or not an upset is coming. A WATER Boxling
     that lets a scuffle blow pass through it in rung 1 has earned the right to
     do it to a killing blow in rung 2. Because the foreshadow plays on every
     run regardless of band, it costs nothing and leaks nothing.

     WHERE IT SITS IN THE COMMIT. The Tell is identical to any other Tell — the
     freeze, the ring, the flinch — and crucially the defender plays QUAKE and
     not RALLY, because a dodge that can be predicted from the emotion turns the
     flinch into an outcome tell. The strike then lands exactly as it would
     have for three frames. Only then does contact fail to happen: the
     signature fires, and the hitstop still fires ON THE MISS, which is what
     sells it as a near-death rather than a whiff.

     WHAT IT COSTS THE RUN: nothing, and that is deliberate. v3.5 asks for a
     1.2s Aftermath here. The Aftermath is not given 1.2s of new time — it is
     paid for out of the STOP the dodge replaces, exactly as the slip is, and
     for the same reason: a dodge is a MISS, and a miss has no business holding
     the longest impact frame in the game. Whatever the connect's stop would
     have been goes to the beat where both fighters are stunned by it. The
     commit's total does not move and both caps are untouched. At the Spec
     preset that buys roughly 900ms of Aftermath rather than the authored 1200;
     the shortfall is real, it is printed in the setup panel, and the honest
     alternative was breaking the 30s cap for one cosmetic beat.

     NEVER ON THE WITNESS STRIKE. The Vault's final strike always connects: the
     crack colour is the answer and nothing may sit between the tap and the
     truth. That is structural here rather than asserted — a dodge only ever
     attaches to a RIVAL commit, and the WITNESS strike is the player's. */
  /* ################## REVISED BY v3.6 ##################
     THE DODGE IS THE SURVIVAL IMAGE AT A KILLING COMMIT, not a rare flourish.
     It fires on EVERY survival of one, which is roughly a third of the time at
     each, and the "maximum one per run" rule is dropped because a run can
     survive at most two killing commits anyway.

     That rule existed to stop a rare event repeating until it stopped reading
     as lucky. It is not a rare event any more: it is what surviving looks
     like, every time, and a run that survives both of its killing commits
     SHOULD show the same image twice, because it did the same thing twice.

     AND IT NOW COSTS THE RUN REAL TIME. v3.5 paid for the 1.2s stun out of the
     stop the miss did not earn, which worked while the dodge was rare and
     mostly landed on the red, whose stop is 900ms and can afford it. Under
     v3.6 every surviving run dodges rung 1's AMBER, whose stop is 220ms and
     has nothing to give — so the trade that was invisible would have become
     the common case, and the beat the clip gets cut on would be the one beat
     that never got its time. The stun is real time now, reclaimed from the
     Vault's quiet beats and the Grail's occlusion wash on the same argument
     the v5 rebudget used: the box rising and the gold wash are the least
     dramatic seconds in the run, and a near-death is the most. Both caps still
     hold; see the `arc` table and `runLength`. */
  /* HOW A KILLING COMMIT IS SURVIVED — three images, drawn cosmetically.
     One image, played on every survival of every killing commit, is what made
     rung 1's amber read cheap: the most-seen beat in the game after the opener
     was the same shot every time, and a thing you have seen forty times cannot
     feel like a near-death. Three images, equal duration, drawn off the
     cosmetic stream, so the variance costs the run nothing and leaks nothing —
     the survival already happened; this is only how it is told.

       slip     the player is not there. Its element signature fires and the
                blow goes through the space it was in.
       miss     the rival overcommits and swings through nothing at all — the
                player barely has to move, and the rival pays for it hardest.
       through  the player takes it head on and comes out swinging, in the same
                register as the box bursting open. The opener's image, reused.

     ALL THREE END WITH THE RIVAL ON THE FLOOR. That is the point and it is the
     fix for "four non-connecting moments a run": a miss is not a neutral event,
     it is the rival spending everything and getting nothing, and the body has
     to say so. It overcommits, loses its feet and goes down — and the gold that
     follows finishes it there. Fear, then triumph, with a visible cause. */
  /* ================== THE ESCAPE — the rung's shape varies ==================
     THE REAL PROBLEM WAS NEVER THE DODGE, IT WAS THE SCRIPT. Every rung played
     one fixed shape — amber then gold, red then gold — so however well the
     rival's defence was staged, the rung was the same film every time and the
     gold was never in doubt for a single frame.

     What made this look immovable was a misreading of the invariance rule. It
     says two runs of DIFFERENT BANDS must be information-identical at the same
     position. It says nothing whatever about two different SEALS. The script
     may vary run to run as long as every band within one seal sees the same
     script — and that is a whole axis of variability that was sitting unused,
     which is exactly what the `script` stream was reserved for and never spent.

     So: on any rung with a gold, the rival may ESCAPE it outright. The finisher
     does not land, the rival comes out of it buckling but alive, and the gold
     is thrown a SECOND time — a real second telegraphed attempt, which lands.

     WHAT IT DOES NOT BREAK, and each of these is why it is shaped this way:
       - "gold = the finish attempt" holds. A gold still always finishes the
         rung; it now sometimes takes two goes at it.
       - The extra commit is appended AFTER the rung's fatal clash, so only
         bands that already survived the rung ever see it. Nothing leaks.
       - Every index below it is untouched, so `fatalClash`, the board's prune
         schedule and the stake line all still point at the same commits.
       - It is drawn per rung for EVERY rung before any rung is authored, off
         the band-blind `script` stream, so two bands on one seal get identical
         shapes and the band can never reach the draw.

     Commit totals stop being 1/2/5/8/8 and become ranges. That is the cost, it
     is a published number, and it is the price of the run not being a film. */
  const escape = {
    chance: 0.35,        // per rung with a gold, band-blind, off the script stream
  };

  const survivalImage = {
    kinds: ['slip', 'miss', 'through'],
    fall:  760,          // the rival overcommitting and going down, inside the beat
  };

  const dodge = {
    landFrames:  3,      // the strike lands exactly as it would have
    slipFrames:  5,      // ...and then, frames 4 to 8, contact does not happen
    missStop:    240,    // hitstop still fires, on the MISS
    aftermath:  1200,    // both fighters stunned by it — the beat the clip is cut on
    /* v3.5's rule against repetition, kept for the dormant arm only. Under
       v3.6 the dodge is not drawn at all — it is a consequence of surviving —
       so there is nothing to cap. */
    maxPerRun:   1,
    /* The foreshadow, as Circle texture. It rides on a scuffle that was
       already going to happen, so it buys no time. */
    foreshadow: { fromRung: 2, chance: 0.55, ms: 320 },
  };

  /* THE THREE DEFEATS — the highest-value art in the whole matchup, because
     they are how the game teaches its own rules without a word of text.

       FIRE beats ICE     the ICE Boxling melts: facets round off, the
                          silhouette loses its angles, it slumps and puddles.
       ICE beats WATER    the WATER Boxling freezes solid mid-motion, goes
                          opaque and rigid in one beat, then shatters.
       WATER beats FIRE   the FIRE Boxling gutters out: the internal light dies
                          from the extremities inward, then steam and smoke.

     Each runs inside the existing Aftermath budget and buys no time. MIRROR
     AND NEUTRAL DEFEATS use the ordinary KO from the momentum system — DOWN,
     on the ground, no transformation — so the elemental defeats stay reserved
     for counter pairings and stay meaningful. */
  const defeat = { ms: 760, minMs: 380 };

  /* Fixed ratios, file-config. Player is always 1.0; the rival grows.

     v3.6: THE RIVAL IS NEVER SMALLER IN FRONT OF A COMMIT THAT CAN KILL. The
     old `favorable` 1.00/0.75 at rung 1 is gone — it put the player visibly
     bigger, tilted the ground their way and licensed the card to read
     FAVOURED, in front of the commit that ends 65% of the runs that reach it.
     Rung 1 now opens at the LOW end of the killing band (1.25) so the climb
     still escalates 1.25 -> 1.45 -> 1.90 and rung 1 is the mildest of three
     progressively worse mismatches rather than the only friendly one. */
  const mismatchRatio = {
    even:     [1.00, 1.00],
    killing:  [1.00, 1.25],   // rung 1 — low end of v3.6's 1.2–1.6
