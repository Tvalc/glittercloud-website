  // ------------------------------------------------------------- battles
  /* The order the reticle visits candidates: two full loops, a final approach
     to the winner, then `hovers` near-misses that overshoot and come back.
     Always terminates on the chosen index. */
  function sweepSchedule(n, chosen, hovers){
    const seq = [];
    for (let loop = 0; loop < 2; loop++) for (let i = 0; i < n; i++) seq.push(i);
    for (let i = 0; i <= chosen; i++) seq.push(i);
    for (let h = 0; h < hovers; h++){ seq.push((chosen + 1) % n); seq.push(chosen); }
    return seq;
  }

  /* THE CHALLENGER SELECT — the anticipation beat that replaced the door.
     Every candidate on the slate is the same grade, and that grade was
     already public from the roster, so the sweep cannot let a player name
     their band any earlier than height allows. Its entire job is to make the
     landing feel earned. Ceremony scales with HEIGHT alone — a rung-2 select
     is a flash, a rung-9 select is an event — never with whether this rung
     is the fall. */
  async function sceneChallengerSelect(battle, widen){
    const sel = battle.select;
    const cfg = C.challengerSelect[sel.grade] || C.challengerSelect.scrappy;
    if (!cfg.sweepMs || st.skipping) return;

    const n = sel.candidates.length;
    const spread = Math.min(140, 660 / n);
    const x0 = 480 - ((n - 1) * spread) / 2;
    const SY = 402;             // above the floor line, clear of the team HUD

    // a scrim over the whole frame so the slate reads against the arena,
    // without touching the tone dial's dimmer that the fall scenes own
    const scrim = addActor('#fxLayer',
      `<g class="pos"><g class="anim"><rect x="0" y="0" width="960" height="540" fill="#02060f"/></g></g>`, 0, 0);
    animEl(scrim).style.opacity = '0';
    anim(animEl(scrim), [{ opacity: 0 }, { opacity: 0.44 }], scale(220));

    /* Candidates get deterministic scale/facing jitter so a slate reads as
       five individuals rather than five copies of one shape. Derived from the
       index alone, so it stays replayable and carries nothing. */
    const nodes = sel.candidates.map((cand, i) => {
      const jitter = 0.92 + ((i * 7) % 5) * 0.035;
      const flip = (i % 2) ? ' scaleX(-1)' : '';
      const g = addActor('#fxLayer',
        `<g class="pos slateCand"><g class="anim">${A.silhouette(cand.grade)}</g></g>`,
        x0 + i * spread, SY);
      animEl(g).style.transform = `scale(${jitter.toFixed(3)})${flip}`;
      g.style.opacity = '0.26';
      return g;
    });
    const reticle = addActor('#fxLayer',
      `<g class="pos"><g class="anim">${A.selectorBracket()}</g></g>`, x0, SY);

    banner(sel.grade === 'apex' ? 'AN APEX ANSWERS' : 'NEXT CHALLENGER',
           sel.grade === 'apex' ? 'bad' : 'sub', 1000);
    stakes('The ladder picks your next fight.');

    const seq = sweepSchedule(n, sel.chosenIndex, cfg.hovers);
    const weights = seq.map((_, i) => Math.pow((i + 1) / seq.length, 2.3));
    const wSum = weights.reduce((a, b) => a + b, 0);
    const total = scale(cfg.sweepMs, widen);

    /* Driven by ONE rAF timeline rather than a chain of ~17 setTimeouts.
       Chained timers drift on a slow device, and a backgrounded tab clamps
       each one to a second or more, which stalled the whole run. */
    const bounds = [];
    let acc = 0;
    for (let s = 0; s < seq.length; s++){ acc += total * weights[s] / wSum; bounds.push(acc); }
    const paint = i => {
      reticle.style.transform = `translate(${x0 + i * spread}px, ${SY}px)`;
      nodes.forEach((nd, j) => nd.style.opacity = j === i ? '1' : '0.26');
    };
    await new Promise(resolve => {
      const t0 = performance.now();
      let settled = false;
      const finish = () => {
        if (settled) return;
        settled = true;
        paint(sel.chosenIndex);
        resolve();
      };
      const frame = now => {
        if (settled) return;
        const elapsed = now - t0;
        if (elapsed >= total) return finish();
        let k = 0;
        while (k < bounds.length - 1 && elapsed > bounds[k]) k++;
        paint(seq[k]);
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
      setTimeout(finish, total + 400);   // rAF is paused in hidden tabs; never hang a run
    });

    // the lock
    shake(cfg.shake, 260);
    fxAt(A.fx.impact(), x0 + sel.chosenIndex * spread, SY - 46, 700);
    nodes.forEach((nd, j) => {
      if (j !== sel.chosenIndex) anim(nd, [{ opacity: 0.26 }, { opacity: 0 }], scale(300));
    });
    const winEl = animEl(nodes[sel.chosenIndex]);
    const base = winEl.style.transform;            // keep the candidate's jitter
    await anim(winEl, [
      { transform: base }, { transform: base + ' scale(1.28)' },
    ], scale(260), { easing: 'cubic-bezier(.2,1.5,.5,1)' });
    await wait(scale(200, widen));
    await anim(animEl(scrim), [{ opacity: 0.42 }, { opacity: 0 }], scale(240));
    nodes.forEach(nd => nd.remove());
    reticle.remove();
    scrim.remove();
    stakes('');
  }

  async function sceneBattle(plan, battle){
    const widen = C.rungWiden(battle.rung);
    ladderCurrent(battle.rung);

    clearLayer('#fxLayer');
    removeActor('rivalBox'); removeActor('rival'); removeActor('rt1'); removeActor('rt2');

    for (const o of plan.omens) if (o.beforeRung === battle.rung) await playOmen(o.id);
    if (battle.rung >= 2) await sceneChallengerSelect(battle, widen);
    rosterMark(battle.rung, 'current');

    // the rival's box drops — this loop's setup, the last loop's reward
    const rbox = addActor('#actorLayer', A.boxArt(battle.boxGrade), RX, GY-240);
    st.actors.rivalBox = rbox;
    await anim(rbox, [{ transform:`translate(${RX}px, ${GY-240}px)` }, { transform:`translate(${RX}px, ${GY}px)` }],
      scale(340, widen), { easing:'cubic-bezier(.5,0,.9,.6)' });
    rbox.style.transform = `translate(${RX}px, ${GY}px)`;
    shake(6 + Math.min(4, battle.rung), 200);
    fxAt(A.fx.dustRing(), RX, GY+4, 800);

    const chosen = battle.select.candidates[battle.select.chosenIndex];
    banner(`${chosen.name}`, 'rival', 1200);
    await wait(scale(420, widen));

    // emerge — escorts are derived from the plan, so they stay deterministic
    rbox.remove(); delete st.actors.rivalBox;
    const escorted = battle.grade !== 'apex' && battle.select.chosenIndex % 2 === 0;
    const rTint = battle.grade === 'apex' ? '#6b5b8c' : battle.grade === 'pro' ? '#7d8ca0' : '#98a5b5';
    const rC = addActor('#actorLayer', A.creature(battle.rival.speciesId, { tint: rTint }), RX, GY, true);
    st.actors.rival = rC;
    if (battle.grade === 'apex') rC.style.transform += ' scale(1.22)';
    if (escorted){
      st.actors.rt1 = addActor('#actorLayer', A.creature(chosen.speciesId, {tint:rTint}), RX+74, GY-8, true);
      st.actors.rt2 = addActor('#actorLayer', A.creature(chosen.speciesId, {tint:rTint}), RX+40, GY+16, true);
      [st.actors.rt1, st.actors.rt2].forEach(n => n.style.transform += ' scale(0.62)');
    }
    setEx(rC, 'fierce');
    rivalBar(true, chosen.name, battle.grade, 1);
    if (battle.grade === 'apex') st.result.apexFaced++;

    // make sure the right player creature is on the floor
    await ensureLead(plan, battle.leadIndex);

    let rivalHpMax = battle.rival.hp, rivalLeft = rivalHpMax;
    let effAnnounced = false;

    for (const ev of battle.events){
      if (ev.t === 'pHit'){
        const atkName = C.species.find(s=>s.id===plan.packSnapshot.members[ev.who].speciesId).name;
        stakes(`${atkName} · ${ev.move} — should land ${ev.range[0]}–${ev.range[1]}${ev.eff===2?' (double)':ev.eff===0.5?' (half)':''} · Rival ${ev.rivalHpAfter + ev.dmg} HP`);
        // The pause before the killing blow. With taps off the anticipation
        // still gets its beat — it just stops asking the player for anything.
        if (ev.finish && battle.rung >= 3){
          if (st.interaction.resolveTaps) await offerTap('FINISH IT', { timeout: 1900 });
          else await wait(scale(300, widen));
        }
        const pc = st.actors.player;
        await anim(animEl(pc), [
          { transform:'translateX(0)' }, { transform:`translateX(${RX-PX-130}px)` }, { transform:'translateX(0)' },
        ], scale(430, widen), { easing:'cubic-bezier(.4,0,.5,1)', fill:'none' });
        fxAt(A.fx.impact(), RX-70, GY-54, 600);
        if (!effAnnounced){
          effAnnounced = true;
          if (ev.eff === 2) banner('DOUBLE DAMAGE', 'good', 800);
          else if (ev.eff === 0.5) banner('…half damage', 'sub', 800);
        }
        if (ev.eff === 2) shake(8, 180);
        rivalLeft = ev.rivalHpAfter;
        popupDmg(RX-60, GY-140, '-' + ev.dmg, 'gold');
        rivalBar(true, null, null, rivalLeft / rivalHpMax);
        const rv = st.actors.rival;
        if (rv) anim(animEl(rv), [{ transform:'translateX(0)' }, { transform:'translateX(26px) rotate(6deg)' }, { transform:'translateX(0)' }], scale(280), {fill:'none'});
        await wait(scale(300, widen));
      }
      else if (ev.t === 'rHit'){
        stakes(`${chosen.name} winds up${ev.heavy ? ' — it looks heavy' : ''}…`);
        if (ev.heavy){
          if (st.interaction.resolveTaps){
            // Label derives from VISIBLE state only (the charm is shown on the
            // collar before the run) — never from whether this hit is the fall.
            const label = (ev.target === plan.packSnapshot.charmIndex && !st.charmSpent) ? 'BELIEVE' : 'BRACE';
            await offerTap(label, { timeout: 1700 });
          } else {
            await wait(scale(260, widen));   // the wind-up gets its air
          }
        }
        const rv = st.actors.rival;
        if (rv) await anim(animEl(rv), [
          { transform:'translateX(0)' }, { transform:'translateX(26px)', offset:0.4 }, { transform:`translateX(${PX-RX+130}px)` }, { transform:'translateX(0)' },
        ], scale(460, widen), { easing:'cubic-bezier(.5,0,.6,1)', fill:'none' });
        fxAt(A.fx.impact(), PX+62, GY-52, 600);
        popupDmg(PX+66, GY-140, '-' + ev.dmg, 'red');
        shake(ev.heavy ? 8 : 5, 180);
        const pc = st.actors.player;
        if (ev.charm){
          st.charmSpent = true;
          st.result.charmSaves++;
          fxAt(A.fx.charmFlare(), PX, GY-60, 1500);
          banner('THE CHARM HOLDS — 1 HP', 'gold', 1400);
          setEx(pc, 'fierce');
        } else if (ev.ko){
          setEx(pc, 'ko');
          await anim(animEl(pc), [
            { transform:'rotate(0)' }, { transform:'rotate(-78deg) translateY(-4px)' },
          ], scale(360), { easing:'cubic-bezier(.6,0,1,.5)' });
        } else if (pc){
          anim(animEl(pc), [{ transform:'translateX(0)' }, { transform:'translateX(-24px)' }, { transform:'translateX(0)' }], scale(280), {fill:'none'});
          if (ev.leadHpAfter <= 34) setEx(pc, 'worried');
        }
        teamHp(ev.target, ev.leadHpAfter, ev.ko);
        await wait(scale(320, widen));
      }
      else if (ev.t === 'status'){
        const target = ev.side === 'rival' ? st.actors.rival : st.actors.player;
        const x = ev.side === 'rival' ? RX : PX;
        const f = ev.kind === 'burn' ? A.fx.burn() : ev.kind === 'chill' ? A.fx.chill() : A.fx.stun();
        fxAt(f, x, GY-100, 1400);
        banner(ev.kind.toUpperCase() + (ev.side==='rival' ? ' — on the rival' : ' — the countdown starts'), ev.side==='rival'?'sub':'bad', 1000);
        await wait(scale(360, widen));
      }
      else if (ev.t === 'burnTick'){
        fxAt(A.fx.burn(), PX, GY-96, 900);
        popupDmg(PX+40, GY-150, 'burn', 'burn');
        teamHp(ev.target, ev.hpAfter, false);
        await wait(scale(240, widen));
      }
      else if (ev.t === 'swap'){
        stakes('The next Boxling steps up.');
        removeActor('player');
        await ensureLead(plan, ev.toIndex, true);
        await wait(scale(240, widen));
      }
    }

    stakes('');
    if (battle.win){
      const rv = st.actors.rival;
      if (rv){
        setEx(rv, 'ko');
        await anim(animEl(rv), [
          { transform:'rotate(0)', opacity:1 }, { transform:'rotate(74deg) translateY(-4px)', opacity:1, offset:0.6 },
          { transform:'rotate(74deg) translateY(6px)', opacity:0 },
        ], scale(520), { easing:'cubic-bezier(.6,0,1,.5)' });
      }
      removeActor('rt1'); removeActor('rt2');
      rivalBar(false);
      ladderMark(battle.rung, 'won');
      rosterMark(battle.rung, 'done');
      banner(`RUNG ${battle.rung} — TAKEN`, 'good', 900);
      await wait(scale(330, widen));
      return true;
    } else {
      // the fall — tone keyed to height
      rivalBar(true, null, null, Math.max(0.06, (battle.deepRedLeft||10) / rivalHpMax));
      if (battle.rung >= 6){ await dim(0.45, 900); }
      else if (battle.rung >= 4){ await dim(0.25, 600); }
      banner(battle.rung >= 6 ? 'THE CLIMB ENDS HERE' : 'THE RUN ENDS', 'bad', 1600);
      ladderMark(battle.rung, 'lost');
      await wait(scale(900, widen));
      return false;
    }
  }

  async function ensureLead(plan, idx, dropIn=false){
    const cur = st.actors.player;
    const m = plan.packSnapshot.members[idx];
    const cw = C.colorways.find(c=>c.id===m.colorway) || C.colorways[0];
    const want = 'lead-' + idx;
    if (cur && cur.dataset.lead === want) return;
    removeActor('player');
    const cre = addActor('#actorLayer', A.creature(m.speciesId, { tint: cw.body, charm: idx === plan.packSnapshot.charmIndex }), PX, GY);
    cre.dataset.lead = want;
    st.actors.player = cre;
    setEx(cre, 'normal');
    await anim(animEl(cre), dropIn
      ? [{ transform:'translateY(-140px) scale(0.8)', opacity:0 }, { transform:'translateY(0) scale(1)', opacity:1 }]
      : [{ transform:'translateX(-80px)', opacity:0 }, { transform:'translateX(0)', opacity:1 }], scale(300));
  }

  // ---------------------------------------------------------------- vault
  async function sceneVault(plan){
    const v = plan.vault;
    const VR = C.ladder().height;          // the Vault is always the top rung
    ladderCurrent(VR);
    rosterMark(VR, 'current');
    clearLayer('#fxLayer');
    removeActor('rival'); removeActor('rt1'); removeActor('rt2');
    rivalBar(false);
    await dim(0.5, 900);
    banner('THE VAULT', 'gold', 1600);
    stakes('The arena goes quiet.');

    const vb = addActor('#actorLayer', A.boxArt('vault'), RX-30, GY);
    st.actors.vaultBox = vb;
    await anim(vb, [
      { transform:`translate(${RX-30}px, ${GY}px)` }, { transform:`translate(${RX-30}px, ${GY-110}px)` },
    ], scale(1600), { easing:'cubic-bezier(.3,0,.3,1)' });
    vb.style.transform = `translate(${RX-30}px, ${GY-110}px)`;
    const hover = animEl(vb).animate([
      { transform:'translateY(0px)' }, { transform:'translateY(-8px)' }, { transform:'translateY(0px)' },
    ], { duration: 2600, iterations: Infinity, easing:'ease-in-out' });

    if (v.goldMeteor){
      await wait(scale(500));
      const mtr = fxAt(A.fx.meteor(), RX+40, GY-420, 2600);
      await anim(mtr, [
        { transform:`translate(${RX+120}px, ${GY-460}px)` }, { transform:`translate(${RX-30}px, ${GY-180}px)` },
      ], scale(700), { easing:'cubic-bezier(.5,0,.8,.6)' });
      mtr.remove();
      shake(10, 300);
      const pre = svgNode(`<g>${A.fx.crack('gold')}</g>`);
      vb.querySelector('.crackHost')?.appendChild(pre);
      banner('GOLD METEOR — CONCLUSIVE', 'gold', 2000);
      st.result.omensSeen.push('goldMeteor');
      await wait(scale(900));
    }

    await ensureLead(plan, v.witnessIndex);
    if (st.interaction.witness === 'tap'){
      stakes('One tap. The crack tells the truth.');
      await offerTap('WITNESS', { mandatory: true, gold: true });
    } else {
      // Auto: the ritual keeps its held beat, it just fires itself, so a run
      // start to finish still needs no input at all.
      banner('WITNESS', 'gold big', 1500);
      stakes('The crack tells the truth.');
      await wait(scale(1200));
    }
    stakes('');

    // the strike — after nine rungs of your things being struck, this box is theirs
    const pc = st.actors.player;
    setEx(pc, 'fierce');
    await anim(animEl(pc), [
      { transform:'translateX(0) rotate(0)' },
      { transform:'translateX(-26px) rotate(6deg)', offset:0.35 },
      { transform:`translateX(${RX-30-PX-110}px) translateY(-70px) rotate(-8deg)` },
    ], scale(560), { easing:'cubic-bezier(.5,0,.7,1)' });
    fxAt(A.fx.impact(), RX-110, GY-150, 800);
    shake(12, 300);
    await wait(scale(260));   // hit-stop, held longer than any other in the game
    anim(animEl(pc), [{ transform:`translateX(${RX-30-PX-110}px) translateY(-70px)` }, { transform:'translateX(0) translateY(0)' }], scale(420));

    // the crack
    hover.cancel();
    const crack = svgNode(`<g>${A.fx.crack(v.crack)}</g>`);
    vb.querySelector('.crackHost')?.appendChild(crack);
    const paths = crack.querySelectorAll('path');
    paths.forEach(p => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: scale(700), fill:'forwards', easing:'ease-out' });
    });
    const bloom = fxAt(A.fx.bloom(v.crack), RX-30, GY-170, 4000);
    anim(animEl(bloom), [{ opacity:0 }, { opacity:1 }], scale(800));
    banner(v.crack === 'gold' ? 'GOLD.' : 'RED.', v.crack === 'gold' ? 'gold big' : 'bad big', 2200);
    await wait(scale(1400));

    if (v.crack === 'red'){
      ladderMark(VR, 'lost');
      await wait(scale(800));
      return false;
    }

    // ------- gold: the Auric
    const au = v.auric;
    vb.remove();
    const auric = addActor('#actorLayer', A.auric(), RX-10, GY, true);
    st.actors.auric = auric;
    rivalBar(true, 'THE AURIC · NINTH ELEMENT', null, 1);
    await anim(animEl(auric), [
      { transform:'scale(0.3) translateY(-60px)', opacity:0 }, { transform:'scale(1) translateY(0)', opacity:1 },
    ], scale(1400), { easing:'cubic-bezier(.2,0,.3,1)' });
    banner('THE AURIC', 'gold big', 1800);
    await wait(scale(700));

    // it takes down the creature in front of it
    await anim(animEl(auric), [
      { transform:'translateX(0)' }, { transform:`translateX(${PX-RX+150}px)` }, { transform:'translateX(0)' },
    ], scale(700), { easing:'cubic-bezier(.5,0,.6,1)', fill:'none' });
    fxAt(A.fx.impact(), PX+60, GY-60, 700);
    shake(10, 260);
    setEx(st.actors.player, 'ko');
    teamHp(au.frontIndex, 0, true);
    await anim(animEl(st.actors.player), [{ transform:'rotate(0)' }, { transform:'rotate(-80deg)' }], scale(420));
    await wait(scale(500));

    // the next steps up…
    removeActor('player');
    await ensureLead(plan, au.nextIndex, true);
    stakes('It steps up.');
    await wait(scale(400));
    // …and survives
    await anim(animEl(auric), [
      { transform:'translateX(0)' }, { transform:`translateX(${PX-RX+150}px)` }, { transform:'translateX(0)' },
    ], scale(700), { easing:'cubic-bezier(.5,0,.6,1)', fill:'none' });
    fxAt(A.fx.impact(), PX+60, GY-60, 700);
    shake(9, 240);
    if (au.save === 'charm'){
      fxAt(A.fx.charmFlare(), PX, GY-60, 1600);
      teamHp(au.nextIndex, 1, false);
      banner('THE CHARM HOLDS — 1 HP', 'gold', 1600);
    } else {
      teamHp(au.nextIndex, 1, false);
      banner('A POINT SHORT', 'gold', 1600);
    }
    setEx(st.actors.player, 'fierce');
    await wait(scale(700));

    // the answer
    stakes('Everything left, all at once.');
    await anim(animEl(st.actors.player), [
      { transform:'translateX(0)' }, { transform:`translateX(${RX-PX-140}px) translateY(-30px)` }, { transform:'translateX(0)' },
    ], scale(640), { easing:'cubic-bezier(.4,0,.5,1)', fill:'none' });
    fxAt(A.fx.impact(), RX-80, GY-80, 900);
    shake(12, 320);

    // the drain: three to four seconds, one pause in silence, then empty
    const f = st.hud.rival.querySelector('.rhpfill');
    stakes('');
    await animBar(f, 1, 0.07, scale(2600));
    await wait(scale(900));                    // the silence
    await animBar(f, 0.07, 0, scale(600));
    rivalBar(true, null, null, 0);
    setEx(st.actors.auric, 'ko');
    await anim(animEl(auric), [
      { transform:'rotate(0)', opacity:1 }, { transform:'rotate(20deg) translateY(30px)', opacity:0 },
    ], scale(1100));
    ladderMark(VR, 'won');
    banner('THE GRAIL', 'gold big', 3000);
    await wait(scale(1200));
    return true;
  }
  function animBar(el, from, to, ms){
    // SKIP has to actually skip: without this the Vault drain still waited out
    // its full duration after the player asked to be shown the door.
    if (st.skipping){ el.style.width = (to * 100) + '%'; return Promise.resolve(); }
    return new Promise(res => {
      let done = false;
      const finish = () => { if (done) return; done = true; el.style.width = (to * 100) + '%'; res(); };
      const t0 = performance.now();
      function step(t){
        if (done) return;
        const k = Math.min(1, (t - t0) / ms);
        el.style.width = ((from + (to - from) * k) * 100) + '%';
        if (k < 1) requestAnimationFrame(step); else finish();
      }
      requestAnimationFrame(step);
      setTimeout(finish, ms + 300);   // rAF stops in hidden tabs; the bar must still land
    });
  }

  // ------------------------------------------------------------- the run
  async function playRun(plan, opts={}){
    st.plan = plan;
    st.turbo = !!opts.turbo;
    st.skipping = false;
    st.preset = C.timingPresets.find(p=>p.id === (opts.presetId || '3.0')) || C.timingPresets[1];
    st.interaction = C.interactionPresets.find(p=>p.id === (opts.interactionId || 'watch')) || C.interactionPresets[0];
    st.result = { omensSeen:[], apexFaced:0, charmSaves:0 };
    st.charmSpent = false;
    clearLayer('#actorLayer'); clearLayer('#fxLayer'); clearLayer('#farLayer');
    q('#dimmer').setAttribute('opacity', 0);
    q('#sky').setAttribute('fill','url(#skyGrad)');
    buildLadder(); buildTeam(plan.packSnapshot); buildRoster(plan);
    hideTap(); stakes('');
    st.hud.skip.classList.add('shown');

    const alive = await sceneOpener(plan);
    if (alive){
      ladderMark(1, 'won');
      for (const battle of plan.battles){
        const won = await sceneBattle(plan, battle);
        if (!won) break;
      }
      if (plan.terminal === C.ladder().height) await sceneVault(plan);
    } else {
      ladderMark(1, 'lost');
    }
    st.hud.skip.classList.remove('shown');
    rivalBar(false);
    stakes('');
    await dim(0, 300);
    return st.result;
  }

  function skipNow(){
    st.skipping = true;
    if (st.tapResolve) st.tapResolve();
    document.getAnimations().forEach(a => { try { a.finish(); } catch(e){ try { a.cancel(); } catch(e2){} } });
  }

  return { mount, playRun, skipNow, state: st };
})();

</script>
<script>
/* ---- js/main.js ---- */
/* Boxlings Battle — app shell and flow. */
window.BB = window.BB || {};
(() => {
  const C = BB.config, F = BB.fair;
  const $ = id => document.getElementById(id);
  const money = v => '$' + v.toFixed(2);

  const session = {
    serverSeed: F.randomHex(16),
    openIndex: 0,
    pack: null,
    nonce: '',
    presetId: '3.0',
    interactionId: 'watch',
    turbo: false,
    forcedBand: null,
    running: false,
  };
  session.serverSeedHash = F.sha256Hex(session.serverSeed);

  try {
    const saved = JSON.parse(localStorage.getItem('bb-pack') || 'null');
    if (saved && saved.members && saved.members.length === 3) session.pack = saved;
  } catch(e){}

  // ------------------------------------------------------------- setup UI
  function renderSetup(){
    const rows = C.box.dropTable.map(it =>
      `<tr><td>${it.name}</td><td class="num">${money(it.value)}</td><td class="num">${it.weight}%</td></tr>`).join('');
    const H = C.ladder().height;
    const bandRows = C.bands.map(b => {
      const rungs = C.bandRungs(b.i).map(r => r.vaultWin ? 'takes the Vault'
        : r.r === 1 ? 'boxed at the opener'
        : r.r === H ? 'the Vault, denied' : 'rung ' + r.r);
      return `<tr><td>${b.label}</td><td class="num">${b.share}</td><td>${[...new Set(rungs)].join(' / ')}</td></tr>`;
    }).join('');
    const om = C.omens;
    $('setupBody').innerHTML = `
      <section>
        <h3>Provably fair</h3>
        <p class="mono tiny">server seed hash<br>${session.serverSeedHash}</p>
        <p class="tiny">The prize is drawn the instant your box seals: <span class="mono">HMAC(server&nbsp;seed, your&nbsp;packing&nbsp;+&nbsp;open&nbsp;#)</span>. Nothing in the battle can touch it. The seed is revealed on every receipt so you can recompute your own draw.</p>
        <details><summary>How the resolve works</summary>
          <p class="tiny">Your packing choices compose a client seed — a deck cut, real but unaimable. At the seal it meets the pre-committed server seed and the prize exists from that moment. The battle you then watch is authored backward from that fixed ending. Height is the only tell that binds: surviving a rung rules out every band that ends there. Everything cosmetic — which gag, which rival skin, the camera, the dust — is drawn from a separate stream that never sees the prize.</p>
        </details>
      </section>
      <section>
        <h3>Drop table · ${C.box.name} · ${money(C.box.price)}</h3>
        <table class="dropT"><tr><th>Item</th><th>Value</th><th>Odds</th></tr>${rows}</table>
      </section>
      <section>
        <h3>How far runs go</h3>
        <table class="dropT"><tr><th>Prize</th><th>Share</th><th>Height</th></tr>${bandRows}</table>
      </section>
      <section>
        <h3>Published tells</h3>
        <p class="tiny"><b>Height</b> never misleads. <b>The Parade</b> is the roster along the top: an apex appearing <i>early</i> (rungs 3–6) correlates with band — ${pct(C.paradeApexWeights.low)} of low runs show 2+, versus ${pct(C.paradeApexWeights.high)} of high ones. <b>Storm Front</b> fires on ${(om.stormFront.rates.low*100)}% of low runs, ${(om.stormFront.rates.high*100)}% of high. <b>Auric Trace</b>: ${(om.auricTrace.rates.low*100)}% low → ${(om.auricTrace.rates.grail*100)}% grail. <b>Gold Meteor</b>: Vault only, conclusive, never false.</p>
      </section>
      <section>
        <h3>Your only choice</h3>
        <p class="tiny">Packing is the whole of it. Once the box seals, the run plays itself — the ladder picks each challenger and every blow resolves without you. The Challenger Select is a reveal, never a decision: every candidate on the slate is the same grade, and that grade was already on the roster before the sweep started.</p>
      </section>
      <section>
        <h3>Rig controls</h3>
        <label>Opener preset
          <select id="presetSel">${C.timingPresets.map(p=>`<option value="${p.id}" ${p.id===session.presetId?'selected':''}>${p.label}</option>`).join('')}</select>
        </label>
        <label>Interaction
          <select id="interSel">${C.interactionPresets.map(p=>`<option value="${p.id}" ${p.id===session.interactionId?'selected':''}>${p.label}</option>`).join('')}</select>
        </label>
        <label>Ladder
          <select id="ladderSel">${C.ladderPresets.map(p=>`<option value="${p.id}" ${p.id===C.ladder().id?'selected':''}>${p.label}</option>`).join('')}</select>
        </label>
        <label>Force outcome (demo)
          <select id="forceSel">
            <option value="">— fair draw —</option>
            ${C.bands.map(b=>`<option value="${b.i}">${b.label}</option>`).join('')}
          </select>
        </label>
        <label class="row"><input type="checkbox" id="turboChk"> Turbo</label>
        <button id="newSeedBtn" class="ghost">New server seed</button>
      </section>`;
    $('presetSel').onchange = e => session.presetId = e.target.value;
    $('interSel').onchange = e => session.interactionId = e.target.value;
    // Height changes which rung a band ends on, so the published table has to
    // be redrawn with it — the panel must never show a mapping that isn't live.
    $('ladderSel').onchange = e => { C.setLadder(e.target.value); renderSetup(); };
    $('forceSel').onchange = e => session.forcedBand = e.target.value === '' ? null : +e.target.value;
    $('turboChk').onchange = e => session.turbo = e.target.checked;
    $('newSeedBtn').onclick = () => {
      session.serverSeed = F.randomHex(16);
      session.serverSeedHash = F.sha256Hex(session.serverSeed);
      session.openIndex = 0;
      renderSetup();
    };
  }
  function pct(w){ const tot=w.reduce((a,b)=>a+b,0); return Math.round((w[2]+w[3])/tot*100) + '%'; }

  // ----------------------------------------------------------- packing UI
  const packState = { chosen: [], colorways: {}, };
  function renderPacking(){
    const grid = $('packGrid');
    grid.innerHTML = C.species.map(sp => {
      const sel = packState.chosen.indexOf(sp.id);
      const el = C.elements[sp.el];
      return `<button class="packCard ${sel>=0?'sel':''}" data-id="${sp.id}">
        <span class="slotNo">${sel>=0 ? (sel+1) : ''}</span>
        <svg viewBox="-70 -120 140 140" class="cardArt">${BB.art.creature(sp.id, {tint:(C.colorways.find(c=>c.id===(packState.colorways[sp.id]||'kraft'))).body, charm: sel===0})}</svg>
        <span class="pcName">${sp.name}</span>
        <span class="pcEl" style="color:${el.color}">${el.name}</span>
        <span class="pcBlurb">${sp.blurb}</span>
        <span class="cwRow">${C.colorways.map(cw=>`<i class="sw ${((packState.colorways[sp.id]||'kraft')===cw.id)?'on':''}" data-sp="${sp.id}" data-cw="${cw.id}" style="background:${cw.body}"></i>`).join('')}</span>
      </button>`;
    }).join('');
    grid.querySelectorAll('.packCard').forEach(b => b.addEventListener('click', e => {
      if (e.target.classList.contains('sw')) return;
      const id = b.dataset.id;
      const i = packState.chosen.indexOf(id);
      if (i >= 0) packState.chosen.splice(i, 1);
      else if (packState.chosen.length < 3) packState.chosen.push(id);
      renderPacking();
    }));
    grid.querySelectorAll('.sw').forEach(s => s.addEventListener('click', e => {
      e.stopPropagation();
      packState.colorways[s.dataset.sp] = s.dataset.cw;
      renderPacking();
    }));
    $('sealBtn').disabled = packState.chosen.length !== 3;
    $('packHint').textContent = packState.chosen.length === 3
      ? 'Order is part of your signature. The first slot wears the Charm ◈.'
      : `Choose ${3-packState.chosen.length} more — order matters.`;
  }
  function openPacking(){
    $('packOverlay').classList.add('shown');
    if (session.pack){
      packState.chosen = session.pack.members.map(m=>m.speciesId);
      session.pack.members.forEach(m => packState.colorways[m.speciesId] = m.colorway);
    }
    renderPacking();
  }

  async function sealAndRun(){
    const members = packState.chosen.map(id => ({ speciesId:id, colorway: packState.colorways[id] || 'kraft' }));
    session.pack = { members, charmIndex: 0 };
    localStorage.setItem('bb-pack', JSON.stringify(session.pack));
    session.nonce = $('nonceInput').value || '';
    // the seal beat
    const btn = $('sealBtn');
    btn.textContent = 'SEALED';
    $('packOverlay').classList.add('sealing');
    await new Promise(r => setTimeout(r, 500));
    $('packOverlay').classList.remove('shown','sealing');
    btn.textContent = 'SEAL IT';
    startRun();
  }

  function clientSeedOf(){
    return session.pack.members.map(m=>`${m.speciesId}.${m.colorway}`).join('-') + (session.nonce ? '~'+session.nonce : '');
  }

  // ---------------------------------------------------------------- a run
  async function startRun(existingPlan, bank=true){
    if (session.running) return;
    session.running = true;
    document.body.classList.add('running');
    let plan = existingPlan;
    if (!plan){
      plan = BB.planner.planRun({
        serverSeed: session.serverSeed,
        clientSeed: clientSeedOf(),
        openIndex: session.openIndex,
        pack: session.pack,
        forcedBand: session.forcedBand,
        recentGags: BB.registry.recentGags(),
      });
      session.openIndex++;
    }
    const result = await BB.present.playRun(plan, {
      turbo: session.turbo, presetId: session.presetId, interactionId: session.interactionId,
    });
    let regLines = [];
    if (bank && !plan.demo) regLines = BB.registry.bank(plan, result);
    else if (bank && plan.demo) regLines = ['Demo draw — nothing banked.'];
    showReceipt(plan, regLines, bank);
    session.running = false;
    document.body.classList.remove('running');
  }

  // --------------------------------------------------------------- receipt
  function showReceipt(plan, regLines, banked){
    const price = C.box.price, v = plan.item.value;
    const win = v >= price;
    const ended = plan.vaultWin ? 'took the Vault' : plan.vaultLoss ? 'fell at the Vault'
                : plan.terminal === 1 ? 'boxed at the opener' : `fell at rung ${plan.terminal}`;
    const verify = `
      <details class="verify"><summary>Verify this run</summary>
        <p class="mono tiny">server seed&nbsp;&nbsp;${plan.serverSeed}<br>
        client seed&nbsp;&nbsp;${plan.clientSeed}<br>
        open #&nbsp;&nbsp;${plan.openIndex}<br>
        seal = HMAC(server, client|open)<br>&nbsp;&nbsp;${plan.seal.slice(0,48)}…</p>
        <p class="tiny">${(() => {
          const re = BB.planner.planRun({serverSeed:plan.serverSeed, clientSeed:plan.clientSeed, openIndex:plan.openIndex, pack:plan.packSnapshot, forcedBand: plan.demo? plan.band : null});
          return re.item.id === plan.item.id ? '✓ Recomputed from the seal just now — same prize. It was decided before the first frame.' : '✗ recompute mismatch (bug!)';
        })()}</p>
      </details>`;
    $('receiptBody').innerHTML = `
      ${plan.demo ? '<div class="demoTag">DEMO DRAW — forced outcome, not banked</div>' : ''}
      <h2 class="${win?'winH':''}">${win ? 'WINNINGS' : 'salvage recovered'}</h2>
      <p class="endLine">${C.species.find(s=>s.id===plan.packSnapshot.members[0].speciesId).name} ${ended}.</p>
      <div class="rrow"><span>Spend</span><span class="num">${money(price)}</span></div>
      <div class="rrow item"><span>${plan.item.name}</span><span class="num">${money(v)}</span></div>
      ${win ? `<div class="rrow winRow"><span>Winnings</span><span class="num">+${money(v-price)}</span></div>`
            : `<div class="rrow"><span>Salvage value</span><span class="num">${money(v)}</span></div>`}
      <div class="regLines">${(regLines||[]).map(l=>`<div class="regLine">◈ ${l}</div>`).join('')}</div>
      ${banked ? verify : '<p class="tiny">Replay — already banked.</p>'}`;
    $('receiptOverlay').classList.add('shown');
  }
  $('againBtn').onclick = () => { $('receiptOverlay').classList.remove('shown'); startRun(); };
  $('repackBtn').onclick = () => { $('receiptOverlay').classList.remove('shown'); openPacking(); };
  $('recStableBtn').onclick = () => { $('receiptOverlay').classList.remove('shown'); openStable(); };

  // ---------------------------------------------------------------- stable
  /* THE STABLE — the batch mode as a live scoreboard.
     Every open in the wave is settled AND banked from one seed before the
     first row turns; what follows is a player for those plans, exactly as the
     arena is a player for one. All ten climb concurrently on a single rAF
     timeline, so the floor runs go FINAL almost at once and the deep runs are
     left climbing alone on the board — which is the entire reason to watch.
     The item stays "???" until a row goes FINAL: a scoreboard that printed
     the prize while the run was still climbing would spoil its own reveal. */
  const SB = { STEP: 560, OPENER: 850, VAULT_HOLD: 1500, TAIL: 700 };

  function openStable(){
    if (!session.pack){ openPacking(); return; }
    const N = 10;
    const plans = [];
    for (let i = 0; i < N; i++){
      plans.push(BB.planner.planRun({
        serverSeed: session.serverSeed, clientSeed: clientSeedOf(),
        openIndex: session.openIndex + i, pack: session.pack,
        forcedBand: session.forcedBand, recentGags: [],
      }));
    }
    session.openIndex += N;
    session.waveNo = (session.waveNo || 0) + 1;
    plans.forEach(p => { if (!p.demo) BB.registry.bank(p, { omensSeen: [], apexFaced: 0, charmSaves: 0 }); });

    // One deterministic schedule per run. The index-derived jitter keeps the
    // board from ticking in lockstep, which is what makes it read as live.
    const sched = plans.map((p, i) => {
      const start = i * 80 + ((i * 137) % 240);
      const openerAt = start + SB.OPENER;
      const climbEnd = p.terminal === 1 ? openerAt : openerAt + (p.terminal - 2) * SB.STEP;
      return { p, i, start, openerAt, climbEnd,
               finalAt: climbEnd + (p.terminal === p.height ? SB.VAULT_HOLD : 0) };
    });
    const waveEnd = Math.max(...sched.map(s => s.finalAt)) + SB.TAIL;
    const spend = C.box.price * N;

    $('stableBody').innerHTML = `
      <div class="sbHead">
        <span class="sbWave">WAVE ${session.waveNo}</span>
        <span class="sbSpend">SPEND ${money(spend)}</span>
        <span class="sbCount" id="sbCount"></span>
      </div>
      <div class="sbRows">${sched.map(s => `
        <div class="sbRow" data-i="${s.i}">
          <span class="sbNo">#${s.p.openIndex}</span>
          <span class="sbStatus">— —</span>
          <span class="sbPos">SEALED</span>
          <span class="sbTrack"><i></i></span>
          <span class="sbItem">???</span>
          <span class="sbVal num"></span>
          <button class="ghost sbReplay" tabindex="-1">replay</button>
        </div>`).join('')}</div>
      <div class="sbFoot">
        <div class="sbTop" id="sbTop">TOP PULL: <b>—</b></div>
        <div class="sbTicker"><div class="sbTickerInner" id="sbTick"></div></div>
        <p class="tiny sbNote">One seed settled this whole wave. Every result above existed before the first row turned — the board is replaying them, not deciding them.</p>
      </div>`;
    $('stableOverlay').classList.add('shown');

    const rows = [...$('stableBody').querySelectorAll('.sbRow')];
    const seen = sched.map(() => ({ key: null }));
    const finals = [];
    let best = null;

    const rungAt = (s, t) => t < s.openerAt ? 1
      : Math.min(s.p.terminal, Math.floor((t - s.openerAt) / SB.STEP) + 2);

    const endLabel = p => p.terminal === 1 ? 'BOXED'
      : p.vaultWin ? 'VAULT TAKEN' : p.vaultLoss ? 'VAULT DENIED' : 'RUNG ' + p.terminal;

    function renderTicker(){
      const strip = finals.map(p =>
        `<span class="tk ${p.item.value >= C.box.price ? 'good' : ''}">#${p.openIndex} ${endLabel(p)} · ${p.item.name} ${money(p.item.value)}</span>`
      ).join('<span class="tkSep">•</span>');
      $('sbTick').innerHTML = strip + '<span class="tkSep">•</span>' + strip;
    }

    function paint(t){
      let live = 0, done = 0;
      for (const s of sched){
        const row = rows[s.i], p = s.p;
        if (t < s.start) continue;
        const isFinal = t >= s.finalAt;
        const r = rungAt(s, t);
        if (isFinal) done++; else live++;
        const key = isFinal ? 'F' : 'R' + r;
        if (seen[s.i].key === key) continue;
        seen[s.i].key = key;

        const statusEl = row.querySelector('.sbStatus');
        const posEl = row.querySelector('.sbPos');
        const bar = row.querySelector('.sbTrack > i');

        if (!isFinal){
          row.classList.add('live');
          statusEl.className = 'sbStatus live';
          statusEl.innerHTML = '<i class="dot"></i>LIVE';
          if (r >= p.height){ posEl.textContent = 'VAULT ◈'; row.classList.add('vault'); }
          else posEl.textContent = 'RUNG ' + r + ' ▲';
          bar.style.width = (r / p.height * 100) + '%';
        } else {
          row.classList.remove('live');
          row.classList.add('final');
          statusEl.className = 'sbStatus';
          statusEl.textContent = 'FINAL';
          posEl.textContent = endLabel(p);
          bar.style.width = (p.terminal / p.height * 100) + '%';
          const win = p.item.value >= C.box.price;
          row.classList.toggle('good', win);
          row.classList.toggle('vault', p.terminal === p.height);
          row.classList.toggle('grail', !!p.vaultWin);
          const itemEl = row.querySelector('.sbItem');
          itemEl.textContent = p.item.name;
          itemEl.classList.add('revealed');
          const valEl = row.querySelector('.sbVal');
          valEl.textContent = money(p.item.value);
          valEl.className = 'sbVal num' + (win ? ' good' : '');
          const rb = row.querySelector('.sbReplay');
          rb.classList.add('shown'); rb.tabIndex = 0;
          rb.onclick = () => { $('stableOverlay').classList.remove('shown'); startRun(p, false); };
          finals.push(p);
          if (!best || p.item.value > best.item.value){
            best = p;
            $('sbTop').innerHTML = `TOP PULL: <b>${best.item.name}</b> <span class="num">${money(best.item.value)}</span> <span class="tiny">· #${best.openIndex} ${endLabel(best)}</span>`;
          }
          renderTicker();
        }
      }
      const c = $('sbCount');
      if (c) c.innerHTML = `<b>${live}</b> LIVE · <b>${done}</b> FINAL`;
    }

    // One rAF timeline drives every row — not a timer per row, which drifts
    // on a slow device and stalls outright in a backgrounded tab.
    const t0 = performance.now();
    let stopped = false;
    const finish = () => {
      if (stopped || !document.body.contains(rows[0])) return;
      stopped = true;
      paint(waveEnd);
      const ret = plans.reduce((a, p) => a + p.item.value, 0);
      const tot = document.createElement('span');
      tot.className = 'tiny sbWaveTot';
      tot.textContent = ` · wave returned ${money(ret)} of ${money(spend)}`;
      $('sbTop').appendChild(tot);
    };
    const tick = now => {
      if (stopped || !$('stableOverlay').classList.contains('shown')) return;
      const t = now - t0;
      paint(Math.min(t, waveEnd));
      if (t < waveEnd) requestAnimationFrame(tick); else finish();
    };
    requestAnimationFrame(tick);
    setTimeout(finish, waveEnd + 900);   // rAF is paused in hidden tabs
  }
  $('stableClose').onclick = () => $('stableOverlay').classList.remove('shown');

  // -------------------------------------------------------------- registry
  function openRegistry(){
    const d = BB.registry.data;
    const meteor = d.witness.goldMeteor;
    const stamps = Object.entries(d.stamps);
    $('registryBody').innerHTML = `
      <div class="rstats">
        <div><b>${d.opens}</b><span>opens</span></div>
        <div><b>${money(d.spend)}</b><span>spend</span></div>
        <div><b>${money(d.returned)}</b><span>returned</span></div>
        <div><b>${d.bestPull ? money(d.bestPull.value) : '—'}</b><span>best pull</span></div>
      </div>
      <h3>Witness cards</h3>
      <div class="wcards">
        <div class="wcard ${d.witness.stormFront?'have':''}">Storm Front <b>${d.witness.stormFront}</b></div>
        <div class="wcard ${d.witness.auricTrace?'have':''}">Auric Trace <b>${d.witness.auricTrace}</b></div>
        <div class="wcard ${d.witness.vaultSeen?'have':''}">The Vault <b>${d.witness.vaultSeen}</b></div>
        <div class="wcard gold ${meteor?'have':''}">Gold Meteor <b>${meteor} / 1</b></div>
      </div>
      <h3>Path badges</h3>
      <div class="wcards">${C.badges.map(b=>`<div class="wcard ${d.badges[b.id]?'have':''}" title="${b.desc}">${b.name}</div>`).join('')}</div>
      <h3>Odyssey stamps <span class="tiny">(${stamps.length} banked)</span></h3>
      <div class="stamps">${stamps.length ? stamps.map(([k,n])=>{
        const [sp, end] = k.split('@');
        return `<div class="stamp">◈ ${C.species.find(s=>s.id===sp)?.name || sp} — ${end} ${n>1?'×'+n:''}</div>`;
      }).join('') : '<p class="tiny">Every open banks one. None yet.</p>'}</div>
      <button id="regReset" class="ghost">reset registry</button>`;
    $('registryOverlay').classList.add('shown');
    $('regReset').onclick = () => { BB.registry.reset(); openRegistry(); };
  }
  $('registryBtn').onclick = openRegistry;
  $('registryClose').onclick = () => $('registryOverlay').classList.remove('shown');
  $('stableBtn').onclick = openStable;
  $('packBtn').onclick = openPacking;
  $('sealBtn').onclick = sealAndRun;
  $('skipBtn').onclick = () => BB.present.skipNow();

  // ------------------------------------------------------------------ boot
  BB.present.mount($('stage'), {
    action: $('actionBtn'), stakes: $('stakes'), banner: $('banner'),
    ladder: $('ladder'), team: $('team'), rival: $('rivalBar'),
    roster: $('roster'), fxHtml: $('fxHtml'), skip: $('skipBtn'),
  });
  renderSetup();
  openPacking();
})();

</script>
</body>
</html>
