  /* A STAMP YOU CAN SEE, because the bench cannot tell you it is stale and the
     failure mode is silent. The test page busts the cache on `index.html`, but
     `js/*.js` are separate requests the browser is free to keep — so the page
     reloads, the game runs, and every behaviour is the previous build's. It
     cost two wrong measurements during this pass before it was spotted.
     The bench prints this; if it does not match, hard-reload. */
  const build = 'v3.7 · ring space · broken clock · no reset · 33s cap · the transfer · melee and range';

  const arc = [
    { total: 2700, opener: 3000, rungs: {} },        // ×lossDelta = 2.7s
    { total: 6000, opener: 3000, rungs: { 2:{ confront:1200, commits:[1800] } } },
    { total:14000, opener: 3000, rungs: { 2:{ confront:1200, commits:[1850,1850] },
                                          3:{ confront:2500, commits:[1870,2450] } } },
    { total:26000, opener: 3000, rungs: { 2:{ confront:1200, commits:[1850,1850] },
                                          3:{ confront:2500, commits:[1870,2670,2660] } },
      vault: { confront:2000, commitA:2200, rise:620, witness:660, strike:860, crack:360, occlusion: 520, decode:   0 } },
    { total:33000, opener: 3000, rungs: { 2:{ confront:1200, commits:[1850,1850] },
                                          3:{ confront:2500, commits:[1870,2670,2660] } },
      vault: { confront:2000, commitA:2200, rise:620, witness:660, strike:860, crack:360, occlusion: 700, decode: 900 } },
  ];
  /* THE v3.6 REBUDGET, and what paid for it.
     The dodge stopped being free. It is the survival image at a killing commit
     now, so every run that gets past rung 1 spends 800ms of stun on the amber
     (whose 220ms stop could fund none of it) and every Vault run spends a
     further 140ms on the red. Measured: +800ms on band 3, +940ms on band 4 and
     the Grail, which put the Grail at 30.80s against a 30s cap.

     Reclaimed from the Vault's quiet beats and the Grail's occlusion wash, on
     exactly the argument the v5 rebudget used: the gilded box rising, the gold
     wash and the counter roll are the least dramatic seconds in the run, and a
     near-death is the most. rise 900->700, witness 900->760, the Grail's
     occlusion 1150->860 and decode 1350->1080, band 4's occlusion 700->600.
     NOTHING came from the opener, the finisher stops, or the crack.

     `rise`, `witness`, `strike` and `crack` are trimmed IDENTICALLY for band 4
     and the Grail, because those two bands diverge at the crack and nowhere
     else; only the post-crack beats are allowed to differ between them. */

  /* CELEBRATION SCALES WITH BAND. Occlusion length is file-config and lives
     in the arc table above; this is everything that scales alongside it. */
  const celebration = {
    shake:     [0, 0, 8, 16, 26],       // by band
    particles: [0, 0, 14, 30, 64],

    /* ------------------------------------------------ THE CELEBRATION TIERS
       WWE scales celebration production to stakes with an exact vocabulary —
       the bell, the referee raising the arm, the turnbuckle pose, the title
       raise, and pyro reserved for the biggest occasions. The same win,
       staged bigger, means more. Three tiers here, and the boundary is the
       NFL's: after fining 26 players in 2016 the league legalized group
       celebrations, props and ground celebrations, explicitly because
       spontaneous displays of emotion are what fans love — and kept the ban
       on taunting, prolonged acts, and anything directed AT the opponent.
       Joy is legal; cruelty is not. So there is no `loss` entry in this
       table, and celebration vocabulary never appears below a win. */
    tiers: {
      rung:  { min: 800,  max: 1200, shake: 0,  motes:  0, label:'arm-raise'  },
      vault: { min: 2000, max: 3000, shake: 7,  motes: 20, label:'title-shot' },
      grail: { min: 4000, max: 6000, shake: 22, motes: 96, label:'title-raise'},
    },
  };

  /* SIGNATURE MOVES — one repeatable victory pop per Boxling species, chosen
     implicitly at packing, so the celebration is the player's own expression
     firing. From the NBA and soccer: the signature (the siu, the shimmy, the
     night-night) is identity infrastructure — repeatable, owned by one
     performer, anticipated by the crowd, and the shareable unit. It feeds
     three pillars at once: packing expression, cosmetic variance in the
     Aftermath, and the last frame of the clip. It carries no information;
     it is a function of who you packed and never of the band. */
  const signatures = {
    cindersnap:  { name:'the Ember Flick',  move:'flick',  fx:'sparks', accent:'#ff8a4d' },
    pyrepip:     { name:'the Tail Whip',    move:'whip',   fx:'sparks', accent:'#ff8a4d' },
    frostuft:    { name:'the Powder Puff',  move:'puff',   fx:'snow',   accent:'#8fd6ff' },
    glacierkin:  { name:'the Rime Bow',     move:'bow',    fx:'snow',   accent:'#dff5ff' },
    tidecrate:   { name:'the Tide Roll',    move:'roll',   fx:'spray',  accent:'#6fd8d0' },
    bubblewrap:  { name:'the Pop Cascade',  move:'pop',    fx:'drops',  accent:'#7fe3d8' },
  };
  const signatureOf = spId => signatures[speciesId(spId)] || signatures.cindersnap;

  /* "Nothing goes more than 3 seconds without a visible state change."
     The filmstrip measures against this and paints the offender red. */
  const paddingLimit = 3000;

  const turboRates = [
    { id:'1', label:'1×', rate:1 },
    { id:'2', label:'2×', rate:2 },
    { id:'4', label:'4×', rate:4 },
  ];

  /* THE RIG — exactly five exposed chips, plus the three that survived from
     the last pass sitting beside them. Everything else is file-config, driven
     by these presets. */
  /* THE CIRCLE RANGE CHIP BECOMES CLOCK SPREAD (v3.7), and the five-chip cap
     holds because it is the same chip doing a bigger job. It used to expose a
     min and a max that every Circle in the game then sat on the floor of. It
     now drives the per-position bases AND the jitter magnitude together:
     `scale` multiplies each rung's Circle pool, and the normalisation keeps the
     ratios, so Snappy shortens every base and keeps the spread and Cinematic
     lengthens them and keeps it too. The ratio between the longest and shortest
     Circle in a rung is NOT exposed and never falls below 3x in any preset —
     that is `clock.spreadFloor`, and it is checked rather than hoped for. */
  const clockSpreads = [
    { id:'tight', label:'tight', scale:0.70, jitter:0.22 },
    { id:'spec',  label:'spec',  scale:1.00, jitter:0.30 },
    { id:'wide',  label:'wide',  scale:1.70, jitter:0.36 },
  ];
  const slowMoChips  = [ {id:'off', label:'off', v:1.0}, {id:'15', label:'15%', v:1.15}, {id:'30', label:'30%', v:1.30} ];
  const ringChips    = [ {id:'s', label:'0.8×', v:0.8}, {id:'m', label:'1×', v:1.0}, {id:'l', label:'1.3×', v:1.3} ];
  const rigPresets = [
    { id:'spec',      label:'Spec',      tell:500, spreadId:'spec',  slowMoId:'15',  ringId:'m', filmId:'twos',   impactId:'comic' },
    { id:'snappy',    label:'Snappy',    tell:300, spreadId:'tight', slowMoId:'off', ringId:'s', filmId:'ones',   impactId:'quick' },
    { id:'cinematic', label:'Cinematic', tell:700, spreadId:'wide',  slowMoId:'30',  ringId:'l', filmId:'threes', impactId:'heavy' },
  ];

  /* The six offered Boxlings, two per element. Player packs one, and packing
     one is what chooses your element — which is the whole of what packing buys.

     TWO OF THESE WERE RE-SKINNED. `voltcrate` was storm and `bramblewrap` was
     plant, and v3.5 cuts every element but FIRE, ICE and WATER. A creature is
     not allowed to carry an element it does not LOOK like — "the element IS the
     creature" is the rule the whole matchup rests on — so a lightning-bolt body
     labelled WATER was never an option. They are now `tidecrate` and
     `bubblewrap`, both WATER, redrawn to the WATER material: rounded,
     translucent, never still. Saved packs naming the old ids migrate to their
     replacements rather than being thrown away. */
  const species = [
    { id:'cindersnap',  name:'Cindersnap',  element:'fire',  packable:true,  accent:'#ff8a4d', blurb:'Kraft-paper hide, lit from inside at the seams.' },
    { id:'pyrepip',     name:'Pyrepip',     element:'fire',  packable:false, accent:'#ff8a4d', blurb:'Foam-peanut mane, one ember tail that never settles.' },
    { id:'glacierkin',  name:'Glacierkin',  element:'ice',   packable:true,  accent:'#dff5ff', blurb:'A little box gone to rime and starlight. Plants and stays.' },
    { id:'frostuft',    name:'Frostuft',    element:'ice',   packable:false, accent:'#8fd6ff', blurb:'Faceted ruff, breath like powder snow. Holds still.' },
    { id:'bubblewrap',  name:'Bubblewrap',  element:'water', packable:true,  accent:'#7fe3d8', blurb:'All cells and no edges — parts around what it meets.' },
    { id:'tidecrate',   name:'Tidecrate',   element:'water', packable:false, accent:'#6fd8d0', blurb:'Slat-crate shell, brimming over. Never the same outline twice.' },
  ];

  /* ================= WHAT THE PACKING SCREEN OFFERS =================
     THREE, not six: one per element, because the element is the whole of what
     the choice decides.

     Six cards read as six choices. They were not — with HP, moves and the
     type chart gone, the ONLY thing packing decides is your element, so two
     Boxlings of the same element are the same choice wearing two coats. A
     menu that offers a decision it does not actually have is the same bug the
     three-slot pack had, one layer up: choices that decide nothing, presented
     as if they decided something.

     Three cards also make the ring itself legible at the moment it matters. A
     player looking at exactly FIRE, ICE and WATER side by side is looking at
     the whole system, and the packing screen becomes where the ring is taught
     rather than somewhere it has to be looked up.

     WHICH THREE is a silhouette decision, not a favourites one. These are the
     three that are furthest apart as shapes, which is what the confusion test
     is really asking about: Cindersnap tapers and flickers, Glacierkin is an
     angular planted box, Bubblewrap is a cluster of rounds with no edges at
     all. Pairing Frostuft (a rounded blob with a rounded ruff) against
     Bubblewrap would have put the roster's two most confusable bodies on the
     one screen where they sit side by side.

     THE OTHER THREE ARE NOT DELETED. They stay in the world as rivals, where
     variety is mandatory — "every rival gets its own silhouette and entrance
     behaviour" — and where the element still governs which bodies can appear.
     Two bodies per element means a FIRE rival is not always the same creature. */
  const packSpecies = () => species.filter(s => s.packable);

  /* Packs written before this pass. A saved id that is no longer offered would
     otherwise fall back to species[0] and silently change the player's
     ELEMENT — the one thing packing is supposed to decide. So a retired body
     resolves to the packable one of ITS OWN element, and the choice the player
     actually made survives even though the coat it wore does not. */
  const speciesAlias = { voltcrate:'tidecrate', bramblewrap:'bubblewrap' };
  const speciesId = id => (species.find(s => s.id === id) ? id : (speciesAlias[id] || species[0].id));
  const elementOf = spId => (species.find(s => s.id === speciesId(spId)) || species[0]).element;
  const speciesOfElement = el => species.filter(s => s.element === el);
  const packableId = id => {

  /* ============================ THE CLOCK PLANNER ============================
     Everything the broken clock needs, as pure functions, so the whole schedule
     can be checked without a browser — which is the only way to check it at
     all, since an abort has no ring, no dust and no consequence and therefore
     nothing in the DOM to observe.

     THE POOL IS DERIVED, NOT DECLARED. `circlePool` reproduces v3.6's own
     per-commit Circle formula, floor and all, and sums it across the rung's
     FULL script. That is what makes "the broken clock adds none" literally true
     here rather than merely asserted: the pool is, to the millisecond, the
     Circle time this rung already spent. All v3.7 does is stop handing every
     position an equal share of it.

     AND IT IS BAND-BLIND BY CONSTRUCTION, which matters more than it looks.
     The arc table gives band 3's rung-2 red a 2450ms commit and band 4's the
     same red at 2670ms, because the two bands buy different amounts of death
     staging on the far side of it. Deriving the Circle from the commit's own
     budget — which is what v3.6 did — would therefore have made THE CIRCLE
     BEFORE THE RED LONGER FOR THE BAND THAT SURVIVES IT. v3.6 got away with it
     only because the 500ms floor flattened both to the same number; removing
     that floor would have turned an accident into a leak. So the pool is taken
     from the full script (which every band plays as a prefix), the Circle is a
     function of position alone, and the per-band difference is absorbed by the
     Aftermath — which sits AFTER the Clash, the one place the invariance rule
     allows anything to differ. */
  function fullCommitMs(rung){
    const top = arc[arc.length - 1];
    if (rung === 4) return [top.vault.commitA];
    const rg = top.rungs[rung];
    return rg ? rg.commits.slice() : [];
  }
  /* v3.6's Circle formula, kept verbatim and used for exactly one thing: to
     work out how much Circle time a rung used to have. Its 500ms floor is
     gone from the live path and survives only here, as the historical basis. */
  const legacyFloor = 500;
  function legacyCircle(commitMs, cm, rate){
    const tell1 = tellMs(cm.ring, 1, commitTwoBeat(cm), !!cm.killing);
    const want  = commitMs - tell1 - commit.clash;
    const after = Math.min(commit.aftermath.max, Math.max(commit.aftermath.min, want * 0.36));
    return Math.max(legacyFloor, Math.min(1400, want - after)) / (rate || 1);
  }
  function circlePool(rung, rate){
    const list = fullCommitMs(rung), script = commitScript[rung] || [];
    if (!list.length) return 0;
    return list.reduce((s, ms, i) => s + legacyCircle(ms, Object.assign(
      { killing: isKillingCommit(rung, i) }, script[i] || {}), rate || 1), 0);
  }

  /* THE JITTER DRAW. A pure function of (seal, rung, index) — never of the
     commit list a band actually plays, and never sharing a stream with the
     outcome. `clockSeed` is handed down from the planner, which takes it from
     the sixth domain-separated PRNG stream. */
  function jitterAt(seed, rung, index){
    let h = ((seed | 0) ^ (rung * 0x9E3779B1) ^ (index * 0x85EBCA6B)) | 0;
    h = Math.imul(h ^ (h >>> 15), 0x2C1B3C6D);
    h = Math.imul(h ^ (h >>> 12), 0x297A2D39);
    return (((h ^ (h >>> 15)) >>> 0) / 4294967296) * 2 - 1;    // -1..1
  }

  /* THE WHOLE RUNG'S CLOCK, in one pass, because the variance floor is a
     property of the SEQUENCE and cannot be decided one commit at a time.
     Returns one entry per scripted position: its Circle, its abort count, and
     whether it is a double.

     Zero-sum: the jittered shares are renormalised back onto the pool, so
     whatever one position borrows another gives back and the rung's total is
     the number it always was. Then the consecutive-interval rule is satisfied
     by pushing adjacent pairs apart — deterministically, and still zero-sum. */
  function clockPlan(rung, rate, seed){
    const bases = clock.bases[rung] || [];
    const script = commitScript[rung] || [];
    const n = Math.max(bases.length, script.length);
    if (!n) return [];
    const turbo = rate > 1 && clock.turboOff;
    const pool  = circlePool(rung, rate) * (turbo ? 1 : clockSpread().scale);
    const b = [];
    for (let i = 0; i < n; i++) b.push(bases[i] != null ? bases[i] : (bases[bases.length-1] || 1));

    /* TURBO: the clock work switches off outright. Every position collapses to
       the same beat, which is the point — at speed there is no rhythm left to
       entrain to and legibility outranks irregularity. */
    if (turbo)
      return b.map((_, i) => ({ index:i, circle: commit.turboCircle, aborts:0, double:false }));

    const jm = clockSpread().jitter;
    let w = b.map((v, i) => Math.max(0.04, v * (1 + jitterAt(seed, rung, i) * jm)));
    const norm = () => { const s = w.reduce((a, x) => a + x, 0) || 1; w = w.map(x => x / s); };
    norm();

    /* THE VARIANCE FLOOR, enforced rather than audited. Consecutive gaps within
       25% of each other rebuild the metronome one pair at a time, so any pair
       that lands too close is pushed apart and the set renormalised. Bounded
       iterations: this converges or it gives up honestly, and the bench reports
       which. */
    for (let pass = 0; pass < 12; pass++){
      let ok = true;
      for (let i = 1; i < w.length; i++){
        const lo = Math.min(w[i-1], w[i]), hi = Math.max(w[i-1], w[i]);
        if (lo > 0 && (hi - lo) / hi < clock.varianceFloor){
          ok = false;
          const k = 1 + clock.varianceFloor;
          if (w[i] >= w[i-1]) { w[i] *= k; w[i-1] /= k; } else { w[i] /= k; w[i-1] *= k; }
        }
      }
      norm();
      if (ok) break;
    }

    /* THE CEILING, and it is the second half of "scale it to fit".
       Normalising onto the rung's pool keeps the rung's TOTAL where it was, but
       it says nothing about any single commit — and a commit whose Circle
       exceeds its own budget minus a Tell, a Clash and a floor Aftermath simply
       runs long, which is how the first cut of this put a worst-case Grail at
       33.5s against a 33s cap. So each position gets a ceiling, and whatever a
       ceiling refuses is redistributed onto the positions that still have
       headroom rather than being handed back to the run.

       THE CEILING IS BAND-BLIND, and that is not a detail. It is computed
       against the FULL script's commit budget — the top band's — not against
       the budget the band actually playing has. The arc table gives band 3's
       red 2450ms and band 4's the same red at 2670ms, so a ceiling taken from
       "this run's commit" would have made the Circle before the red measurably
       longer for the band that survives it. Same ring, same Tell, different
       duration, and a duration that correlates with a resolution is exactly
       what the honesty note forbids. Band 3 therefore overruns its own commit
       budget slightly on that one beat, the pacer pays for it out of the
       Aftermath on the far side of the Clash, and `runLength` sums the real
       totals so the caps are still checked against what happens. */
    const list = fullCommitMs(rung);
    const ceil = [];
    for (let i = 0; i < n; i++){
      const s = script[i] || {};
      const t = tellMs(s.ring, 1, commitTwoBeat(s), isKillingCommit(rung, i));
      const ms = list[i] != null ? list[i] : (list[list.length - 1] || 2000);
      ceil.push(Math.max(clock.minCircle, ms - t - commit.clash - commit.aftermath.min));
    }
    /* WHAT A CEILING REFUSES IS NOT SPENT. The first cut of this redistributed
       the overflow onto the positions that still had headroom, on the reasoning
       that the pool is the rung's budget and a budget should be spent. That was
       wrong, and the measurement said so immediately: the spill from the long
       positions flooded the short ones, rung 2's authored 0.2s double came out
       at 894ms, and the spread ratio collapsed from 8.5x to 1.63x — under the
       floor, and with it the entire point of the section. The pool is a CEILING
       on the rung, not a quota. A rung that comes in short is a rung that comes
       in short, which costs the run nothing and can only make the caps easier. */
    let c = w.map((s, i) => Math.min(pool * s, ceil[i]));

    /* THE SPREAD FLOOR, enforced after the ceilings rather than before them,
       because a ceiling can quietly eat the ratio the jitter pass just
       established. The correction only ever SHRINKS the shortest position —
       growing the longest is what the ceiling has just forbidden, and shrinking
       is safe for the caps and for the consecutive-interval rule alike, since a
       smaller minimum can only widen every gap it takes part in.

       Rung 4 is exempt and it is worth saying why rather than special-casing it
       silently: the Vault has ONE circled commit. Its second position is the
       WITNESS strike, which the Vault scene stages on its own quiet beats
       rather than playing through the commit engine, so there is no second
       Circle in that rung for a ratio to be measured against. */
    if (rung !== 4 && c.length > 1){
      const hi = Math.max.apply(null, c), lo = Math.min.apply(null, c);
      if (lo > 0 && hi / lo < clock.spreadFloor){
        const want = Math.max(clock.minCircle, hi / clock.spreadFloor);
        const at = c.indexOf(lo);
        if (want < lo) c[at] = want;
      }
    }
    /* WHERE THE FLOOR CANNOT BE MET, and rung 1 is the case. Its longest Circle
       is ceiling-bound at 450ms, so a 3x ratio needs a 150ms shortest — and
       150ms is four frames, which is not a beat, it is a hitch. The floor gives
       way to `minCircle` above, which means this rung is BUDGET-BOUND rather
       than non-compliant: no setting of the clock spread chip can widen it,
       because what binds it is the commit's own length minus a tell, a clash
       and a floor Aftermath. Flagged rather than silently tolerated, so the
       bench can report it as what it is instead of failing on it. */
    const capped = Math.max.apply(null, ceil), bound =
      rung !== 4 && c.length > 1 && capped / clock.minCircle < clock.spreadFloor;

    /* ============ THE INTERVAL SOLVER, and the bug it exists to fix ============
       The variance floor is a rule about INTER-TELL INTERVALS, and enforcing it
       on the Circle shares is not the same thing. The bench caught this the
       first time it ran: rung 2's Circles came out 720 / 1170 / 202 — a 5.8x
       spread, comfortably legal — and its two intervals came out 1752ms and
       2040ms, 14% apart and an automatic fail.

       The cause is that the AFTERMATH IS ANTI-CORRELATED WITH THE CIRCLE by
       construction. `after = clamp(commitMs - tell - clash - circle)` makes the
       Aftermath the slack, so every millisecond the clock adds to a Circle is a
       millisecond it takes out of the Aftermath that precedes the next one. The
       two cancel, and the interval — which is the tail of one commit plus the
       Circle of the next — comes out flat no matter how wide the Circles are.
       A metronome can survive a lot of variety in its parts.

       So the floor is solved on the intervals themselves. Both levers only ever
       SHRINK the smaller of an offending pair — the Circle down toward its
       floor, then the Aftermath's cap down toward its minimum — because the
       ceilings forbid growing the larger one and because shrinking can only
       make the run shorter and the caps easier. Monotone, bounded, and it
       converges or it says so. */
    const aCap = c.map(() => commit.aftermath.max);
    const tailOf = i => {
      const s = script[i] || {};
      const ms = list[i] != null ? list[i] : (list[list.length - 1] || 2000);
      const p = commitPlan(Object.assign({}, s, {
        rung, index:i, circleOverride:c[i], afterCap:aCap[i],
        killing: isKillingCommit(rung, i),
        finish: s.owner === 'player', slip: s.owner === 'player',
        fatal: false, dodge: isKillingCommit(rung, i),
      }), ms, 1);
      return p.clash + p.hold + p.after + p.slip;
    };
    for (let pass = 0; pass < 14 && n > 2; pass++){
      const iv = [];
      for (let i = 1; i < n; i++) iv.push(tailOf(i - 1) + c[i]);   // iv[k] is the gap into commit k+1
      let ok = true;
      for (let k = 1; k < iv.length; k++){
        const bigK = iv[k-1] >= iv[k] ? k - 1 : k, smallK = bigK === k ? k - 1 : k;
        const big = iv[bigK], small = iv[smallK];
        if (big <= 0 || (big - small) / big >= clock.varianceFloor) continue;
        ok = false;
        const need = small - big * (1 - clock.varianceFloor) + 16;
        // GROW the larger interval's Circle by half, as far as the cap allows
        const gi = bigK + 1;
        const grew = Math.min(need / 2, Math.max(0, ceil[gi] * clock.growCap - c[gi]));
        c[gi] += grew;
        // ...and take the rest out of the smaller one, so the rung's total holds
        let s = need - grew;
        const si = smallK + 1;
        const fromCircle = Math.min(s, Math.max(0, c[si] - clock.minCircle));
        c[si] -= fromCircle; s -= fromCircle;
        if (s > 0) aCap[smallK] = Math.max(clock.afterFloor, aCap[smallK] - s);
      }
      if (ok) break;
    }

    const mean = 1 / n;
    return w.map((share, i) => {
      const circle = c[i];
      /* Aborts are spent inside the Circle, never added to it, and a position
         keeps only as many as its Circle can hold while still leaving real
         orbiting in it. Dropped ones are counted so the bench can say so out
         loud — a silent truncation reads as "covered everything" when it did
         not. */
      const want = (clock.aborts[rung] || [])[i] || 0;
      const room = Math.max(0, Math.floor((circle - clock.minOrbit) / clock.abort.ms));
      return { index:i, circle, afterCap: aCap[i], budgetBound: bound,
               aborts: Math.min(want, room), abortsWanted: want,
               /* A double is decided off the SHARE rather than off the clamped
                  milliseconds, so it stays a property of the authored shape: a
                  ceiling is a budget fact and should not be able to promote a
                  long beat into a double or demote one out of being one. */
               double: share <= mean * clock.doubleUnder };
    });
  }
  /* One position's Circle, which is all `phases()` needs. */
  function clockCircle(rung, index, rate, seed){
    const plan = clockPlan(rung, rate, seed);
    if (!plan.length) return commit.turboCircle;
    /* PAST THE END OF THE SCRIPT is the escape's re-thrown gold, and it is a
       double by definition rather than by scheduling: the rival got out of the
       first one and the second is on it before it can reset. So it gets the
       floor rather than the last scripted position's Circle — which is also
       what stops the escape from being the beat that breaks the cap, since it
       is the only commit in the game that can be appended to a rung. */
    if (index >= plan.length) return rate > 1 ? commit.turboCircle : clock.minCircle;
    return plan[index].circle;
  }
  /* The Aftermath's ceiling at a position, which the interval solver sets and
     which is the second half of what keeps the intervals apart. Defaults to the
     ordinary maximum wherever the solver had no reason to touch it. */
  function clockAfterCap(rung, index, rate, seed){
    const plan = clockPlan(rung, rate, seed);
    const e = plan[index];
    return e && e.afterCap != null ? e.afterCap : commit.aftermath.max;
  }
  /* The spread ratio actually achieved in a rung — the number the doc says is
     never exposed and never falls below 3x. Checked, not hoped for. */
  function clockSpreadRatio(rung, rate, seed){
    const p = clockPlan(rung, rate, seed).map(x => x.circle).filter(x => x > 0);
    return p.length < 2 ? Infinity : Math.max(...p) / Math.min(...p);
  }

  /* A commit's full timing, impact frame included. The stop is paid for out
     of the Aftermath first — the Aftermath was already a held beat, so the
     comic panel simply IS it — and only lengthens the run once the Aftermath
     is down to its floor. `extra` is exactly what a longer stop costs, and
     the setup panel prints the consequence in the Length column. */
  function commitPlan(cm, commitMs, rate){
    /* The whole commit goes to phases() now, not just its ring: the tell's
       length depends on whether this commit authored a two-beat arc, which is
       a property of the script and not of the ring colour. */
    const ph = phases(commitMs, cm, rate);
    const hold = impactSet()[resolveKey(cm)] / rate;
    /* WHERE THE STOP'S TIME COMES FROM, and v3.7 flips the order.

       v3.6 raided the Circle first, on the argument that the stop is the
       content and the circling is filler around it. That was true when every
       Circle was an undifferentiated 500ms of texture. It is false now: the
       Circle carries the clock — the long stalk before the red, the aborts, the
       double off the red's Aftermath — and raiding it first would have taken
       the stop's time out of the one system this revision exists to build.

       So the priority is AFTERMATH, then Circle, and NEVER the Tell. The
       Aftermath was always a held beat and the comic panel simply IS it; the
       Circle gives only what is left after the Aftermath is on its floor; and
       the Tell is rigid, so it is not a source at any price. `extra` is exactly
       what a bigger stop costs the run once both are spent, and the setup
       panel's Length column prints the consequence.

       The Circle's own floor is gone with the 500ms floor that produced it. A
       double IS 200ms and is supposed to be; what protects it is that it takes
       the SECOND raid, not the first, and the smallest positions sit next to
       the biggest Aftermaths by construction. */
    const aFloor = commit.aftermath.min / rate;
    const cFloor = clock.minOrbit / rate;
    const fromAfter  = Math.min(hold, Math.max(0, ph.after - aFloor));
    const fromCircle = Math.min(hold - fromAfter, Math.max(0, ph.circle - cFloor));
    const circle = ph.circle - fromCircle;
    const after0 = ph.after - fromAfter;

    /* A DODGE IS A MISS, so it does not get a connect's impact frame — and
       v3.5 wants its Aftermath at 1.2s, the beat where both fighters are
       stunned by it and the beat the clip gets cut on. The two facts pay for
       each other: the stop shrinks to a miss's hitstop and every millisecond
       it gives up goes to the Aftermath.

       THE ORDER HERE IS THE WHOLE TRICK, and getting it wrong costs half a
       second per dodge. The Circle-and-Aftermath reallocation above is done
       against the ORIGINAL stop, so a dodging commit squeezes its circle by
       exactly as much as a connecting one does; only then is the stop swapped
       for the miss. Shrinking the stop first would have left the Circle
       un-squeezed AND handed the Aftermath the difference, which is the same
       660ms spent twice. Done in this order the commit's total is identical to
       the commit it replaced, to the millisecond, and neither cap can feel it. */
    /* A DODGE IS A MISS, so it still gives up the connect's impact frame for a
       miss's hitstop, and every millisecond it gives up still goes straight to
       the Aftermath — that part of v3.5's trade was right and is free.

       WHAT CHANGED IN v3.6 is that the trade is no longer allowed to be the
       whole payment. The stun gets its authored 1.2s whether or not the stop
       could fund it, because the commit that most needs it is the one that can
       fund it least: rung 1's amber holds for 220ms, and under v3.6 every
       single surviving run dodges it. Paying only what the stop happened to
       have left would have given the universal case a 400ms Aftermath and the
       rare one 1.2s, which is exactly backwards.

       So the shortfall is real time. It is reclaimed in the `arc` table, not
       here, and `runLength` is what proves both caps still hold. */
    const holdOut = cm.dodge ? Math.min(hold, dodge.missStop / rate) : hold;
    const freed   = hold - holdOut;                    // what the miss handed back
    /* THE STUN IS ELASTIC NOW, down to `clock.dodgeAfterMin` and no further.
       It used to be a hard 1.2s, which made it the largest rigid block in a
       rung's tail and left the interval solver with nothing to work with at
       exactly the position that needed it most — rung 2's red, where the stun
       sits between the run's longest Circle and its shortest. It is an
       Aftermath, the doc's elastic column lists Aftermath duration, and this is
       the only thing in the game allowed to trim it. */
    const cap  = cm.afterCap != null ? cm.afterCap
               : (cm.rung ? clockAfterCap(cm.rung, cm.index || 0, 1, cm.clockSeed || 0)
                          : Infinity);
    const stun = Math.max(clock.dodgeAfterMin, Math.min(dodge.aftermath, cap)) / rate;
    const after   = cm.dodge ? Math.max(after0 + freed, stun) : after0;
    /* THE RIVAL'S SLIP, which used to be free and is not any more. It buys the
       miss its own hitstop and its own beat, because without those two the
       dodge and the follow-through were one motion and the rival never visibly
       defended itself in the entire run. It is structural rather than drawn
       (see hit.slipChance), so every gold costs exactly this and no run's
       length depends on a cosmetic coin. */
    const slipMs = cm.slip ? (hit.slip + hit.slipStop + hit.slipStun) / rate : 0;
    return { circle, tell:ph.tell, clash:ph.clash, hold: holdOut, after, slip: slipMs,
             extra: hold - fromCircle - fromAfter, slow: ph.slow,
             dodgeAfter: cm.dodge ? after : 0,
             total: circle + ph.tell + ph.clash + holdOut + after + slipMs };
  }

  // ms -> whole frames on the base grid. Nothing may move off this grid.
  const frames = ms => Math.max(1, Math.round(ms * stopmo.base / 1000));
  // The stepped easing that quantizes a WAAPI animation to the same grid.
  const gridEase = ms => `steps(${frames(ms)}, end)`;
  // How long a pose is allowed to take. Poses arrive; they do not drift in.
  const poseMs = 150;

  const openerTotal = () => openerTotalMs;

  /* The opener's beats, with the hitstop chip honored inside it — so the
     chip is felt in the hook too and the hook's length does not move when you
     turn it. The opener is the tutorial for the commit; it must stay fixed. */
  function openerBeats(){
    const total = openerTotalMs;
    const stop = Math.min(live.hitstop, total * 0.25);
    const baseRest = opener.drop + opener.coil + opener.windup + opener.branch + opener.settle;
    const k = (total - stop) / baseRest;
    return { drop: opener.drop*k, coil: opener.coil*k, windup: opener.windup*k,
             hitstop: stop, branch: opener.branch*k, settle: opener.settle*k };
  }

  /* TURBO IS A GRAMMAR, not a speed multiplier. At 2x and 4x the Circle
     collapses to a beat and the confrontation frame compresses, but the
     Tell, the Clash and the Aftermath are only proportionally reduced —
     never skipped, never reordered. Every commit still lands in order and
     still reads. A turbo Grail reads completely in roughly 8 seconds. */
  function phases(commitMs, cm, rate){
    /* Takes the commit, or just its ring for the callers that only have one.
       The tell's length is a function of both: the ring says whether it slows,
       the script says whether it holds two beats. */
    const c = (typeof cm === 'string') ? { ring: cm } : (cm || {});
    const ring = c.ring, two = commitTwoBeat(c), kill = !!c.killing;
    // The 1x shape first — the authored one. Turbo is derived FROM it, so a
    // turbo commit is the same commit played smaller, never a different one.
    const slow = (rings[ring] && rings[ring].slow) ? slowMo() : 1;
    const tell1 = tellMs(ring, 1, two, kill);
    const want = commitMs - tell1 - commit.clash;
    /* THE CIRCLE IS SCRIPTED PER POSITION NOW, not derived from this commit's
       own budget. That inverts which phase is the slack: v3.6 gave the Circle
       whatever was left after a fixed-share Aftermath and then floored it at
       500ms, which made every Circle in the game the same length and made the
       Aftermath the rigid one. v3.7 needs the opposite — the Circle carries the
       clock, so it is authored, and the AFTERMATH absorbs the difference. That
       is also what makes the Circle band-blind (see `clockPlan`). */
    /* `circleOverride` and `afterCap` exist for exactly one caller: the clock's
       own interval solver, which has to be able to ask "what would this
       commit's tail be if its Circle were X" without `phases` turning round and
       asking the solver for the Circle. Without them the recursion is
       immediate. Nothing else passes them. */
    const circle1 = c.circleOverride != null ? c.circleOverride
                  : c.rung ? clockCircle(c.rung, c.index || 0, 1, c.clockSeed || 0)
                           : Math.max(300, Math.min(1400, want * 0.5));
    const aMax = Math.min(commit.aftermath.max,
                          c.afterCap != null ? c.afterCap
                          : (c.rung ? clockAfterCap(c.rung, c.index || 0, 1, c.clockSeed || 0)
                                    : Infinity));
    const after1  = Math.min(aMax, Math.max(commit.aftermath.min, want - circle1));
    if (rate === 1)
      return { circle:circle1, tell:tell1, clash:commit.clash, after:after1,
               total: circle1 + tell1 + commit.clash + after1, slow };
    /* At 2x and 4x the Circle collapses to a beat and slow-mo goes off, but
       Tell, Clash and Aftermath are only proportionally reduced — never
       skipped, never reordered. Every commit still lands in order. The arc
       extension survives turbo, because a red Tell with no room for its two
       beats is a red Tell with no arc in it. */
    const circle = c.rung ? clockCircle(c.rung, c.index || 0, rate, c.clockSeed || 0)
                          : commit.turboCircle;
    const tl = tellMs(ring, rate, two, kill), clash = commit.clash / rate, after = after1 / rate;
    return { circle, tell:tl, clash, after, total: circle + tl + clash + after, slow:1 };
  }

  /* HOW LONG A TELL IS. One function, because two documents both lengthen the
     same phase and they must not compound into a different beat:

       v3    red and gold tells slow by 15% (the slow-mo chip, off/15%/30%).
       v3.2  red and gold tells extend to 0.75s to fit the flinch's two-beat arc.

     Both are "a red Tell is longer than a white one", so the longer of the two
     wins rather than multiplying — 0.75s at Spec, and the chip still drives it
     proportionally at 0.3s and 0.7s. Under turbo the slow-mo goes off and the
     extension does not: the arc is structure, the slow-mo is feel.

     v3.6 SPLITS THE TWO INPUTS THAT USED TO BE ONE LIST. `slowRings` decided
     both, so a ring colour change silently moved a tell's length as well as
     its feel. Now: slow-mo is a property of the RING (red and gold, the two
     that mean a run can end), and the extension is a property of the COMMIT —
     it extends when the script actually authored two beats to put in it. That
     is what lets the Vault's commit A keep its QUAKE->RALLY arc after losing
     its red, and what stops rung 2's single-note pressure beat from
     telegraphing harder than the amber that can kill you. */
  const commitTwoBeat = cm => !!(cm && ((cm.atk && cm.atk.length > 1) ||
                                        (cm.def && cm.def.length > 1)));
  function tellMs(ring, rate, twoBeat, killing){
    const R = rings[ring] || {};
    const slow = (rate === 1 && R.slow) ? slowMo() : 1;
    const arc  = (R.arc || twoBeat) ? flinch.extend : 1;
    /* A killing commit holds the opener's clench, which is three times the
       plant an ordinary Tell has — so its Tell has to be long enough to fit
       the coil AND still have stillness left after it. Longest of the three
       wins rather than compounding, exactly as the slow-mo and the arc do. */
    const co = killing ? coil.extend : 1;
    return live.tell * Math.max(slow, arc, co) / rate;
  }
  /* Whether THIS COMMIT holds a two-beat arc. It used to ask the ring, which
     meant the answer changed when a ring was recoloured for reasons that had
     nothing to do with the performance. It asks the script now. */
  const isArcCommit = cm => commitTwoBeat(cm);
  const isArcRing = ring => !!(rings[ring] && rings[ring].arc);

  /* The pre-fight frame's length: a bare confrontation frame at rung 1, a
     walkout above it. Turbo compresses both and skips neither. */
  function frameMs(rung, authored, rate){
    if (rate === 1) return authored;
    return hasWalkout(rung) ? walkout.turbo : commit.turboConfront;
  }

  /* WHEN THE FALSE STARTS LAND inside a Circle. Pure and deterministic — given
     the beat's length, the rung and the commit's cosmetic seed it returns the
     offsets a feint fires at — so the schedule can be checked without a
     browser, which is the only way to check it at all: a feint has no ring, no
     dust and no consequence, so there is nothing in the DOM to observe.

     The first one lands early as a fraction of the beat rather than at a fixed
     delay, because at Spec every Circle is squeezed onto its 500ms floor and a
     fixed delay fell off the end of it. Each one has to finish clear of the
     stop, or a false start would be the last thing the viewer saw before a real
     one and the contrast the feint exists for would be lost. */
  function feintPlan(ms, rung, seed, rate){
    const sc = v => Math.max(1, v / (rate || 1));
    if (rung < feint.fromRung || ms < sc(feint.min)) return [];
    const dur = sc(feint.ms), out = [];
    let t = ms * 0.20 + (seed % 5) * 14;
    while (t + dur + 90 < ms && out.length < 4){
      out.push(Math.round(t));
      t += Math.max(sc(feint.every), dur + 220);
    }
    return out;
  }

  /* THE STAKE SLAB, read straight off the board. What a win at this rung
     REMOVES — which is already public, because the board is showing it. It is
     derived from the same fatal table the board's prune schedule is derived
     from, so the card, the board and the fight cannot disagree. */
  /* WHICH TIER THE STAKE NAMES. Pulled out of `stakeLine` so the sentence and
     the card that flies down to illustrate it cannot ever name different
     bands — the walkout's stake beat reads this, the stake line reads this,
     and both are still derived from the same fatal table the board's prune
     schedule is. One source, three consumers.

     At the Vault nothing burns: the crack resolves band 4 against the Grail.
     So the stake there is the GRAIL itself, which is what the line already
     says — "win and only the Grail remains" — and it is the biggest statement
     the board can make before the last fight in the game. */
  function stakeTier(rung){
    if (rung === height) return bands.length - 1;
    const script = commitScript[rung] || [];
    let top = -1;
    script.forEach((s, i) => { const b = burnedBySurviving(rung, i); if (b > top) top = b; });
    return top;
  }
  function stakeLine(rung){
    if (rung === height) return 'WIN AND ONLY THE GRAIL REMAINS';
    const i = stakeTier(rung);
    const t = i >= 0 ? boardTiers()[i] : null;
    return t ? `WIN AND ${t.name} BURNS` : 'WIN AND THE CLIMB GOES ON';
  }

  /* ================== THE HONESTY AUDIT (v3.6 test 14) ==================
     "For every commit, compare the displayed matchup against the published
      survival rate at that position. Any commit showing FAVOURED must have a
      100% survival rate. Any commit that can kill must show EVEN or
      OUTMATCHED. One violation invalidates the card system."

     This is the one acceptance test v3.6 adds that does not need a stranger in
     a room, so it is the one that gets to be a check rather than a paragraph.
     It runs against the SCHEDULE rather than against a sampled run, which is
     stronger: it proves the property for every band and every packing at once,
     because the schedule is a pure function of position and packed element.

     The published survival rates, from THE HONESTY RULE's own arithmetic. Only
     three commits in the game are not 1.0, and the opener is one of them. */
  const survival = { opener: 0.401 };
  function survivalAt(rung, index){
    return isKillingCommit(rung, index) ? (rung === 2 ? 0.351 : 0.288) : 1;
  }
  function honestyAudit(){
    const fails = [];
    elementIds.forEach(playerEl => {
      for (let rung = 2; rung <= height; rung++){
        const script = commitScript[rung] || [];
        const legal = rungEdgePlan[rung] || ['even'];
        script.forEach((s, i) => {
          const kills = isKillingCommit(rung, i);
          const surv  = survivalAt(rung, i);
          legal.forEach(edge => {
            const at = `${playerEl} rung ${rung} commit ${i} (${s.ring}, ${edge})`;
            // 1. FAVOURED only where the player always wins.
            if (edge === 'favoured' && surv < 1)
              fails.push(`${at}: shows FAVOURED at ${(surv*100).toFixed(1)}% survival`);
            // 2. A killing commit is EVEN or OUTMATCHED, never favourable.
            if (kills && edge === 'favoured')
              fails.push(`${at}: killing commit shows FAVOURED`);
            // 3. Never smaller AND countered in front of a commit that kills.
            const ratio = mismatchRatio[rungMismatch[rung]] || [1, 1];
            if (kills && ratio[1] < ratio[0] && edge === 'favoured')
              fails.push(`${at}: killing commit is both smaller and countered`);
          });
          // ...and the ring has to agree about what can happen here.
          if (kills !== ringKills(s.ring))
            fails.push(`rung ${rung} commit ${i}: ring '${s.ring}' says kills=${ringKills(s.ring)}, the fatal table says ${kills}`);
        });
      }
    });
    return { pass: !fails.length, fails,
             /* The v35 arm PASSES this audit, and that is worth saying out
                loud because it is not what you would guess. The arm reverts
                the upset layer only; it sits on top of v3.6's honest element
                schedule rather than restoring the uniform draw underneath it,
                so no card can read FAVOURED under either arm. What the arm
                actually changes, once `needsEdge` has nothing favourable left
                to work with, is the DODGE: rare, sited and capped at one per
                run, against v3.6's "every survived killing commit". That is
                the comparison it is there to make. */
             note: upsetActive()
               ? 'v35 arm live: the upset layer reverts, the element schedule does not. The live difference is the dodge model.'
               : '' };
  }

  /* The run's length at the current settings, per band — the acceptance test
     made visible. Recomputed on every chip press and printed in the panel. */
  /* `worst` models every rung's escape firing at once — the longest run this
     configuration can produce. The run's length is no longer a single number:
     the escape is a per-seal draw, so a band spans a range now, and a cap is
     only meaningful against the top of it. The panel prints the plain figure;
     the cap is checked against this. */
  function runLength(bandI, worst){
    const a = arc[bandI], rate = turboRate();
    let t = (bandI === 0 ? a.opener * lossDelta : a.opener) / rate;
    const extras = [];
    Object.keys(a.rungs).forEach(r => {
      const rg = a.rungs[r], script = commitScript[r];
      const fatal = fatalClash[bandI];
      t += frameMs(+r, rg.confront, rate);
      rg.commits.forEach((ms, i) => {
        const s = script[i] || {};
        const isFatal = !!(fatal && fatal.rung === +r && fatal.index === i);
        /* `atk`/`def` come through because the tell's length now depends on
           whether the script authored two beats, and `dodge` because under
           v3.6 it is no longer free: a survived killing commit costs the run
           its 1.2s stun. Modelling it here is the only reason the Length column
           and the caps can still be trusted. */
        const cm = { ring:s.ring, owner:s.owner, finish: s.owner === 'player',
                     /* v3.7: the Circle is a function of POSITION, so the
                        position has to travel with the commit. `clockSeed` is
                        left at 0 here on purpose — the panel's Length column is
                        the SEAL-INDEPENDENT budget, and the jitter is zero-sum
                        across the rung, so every seal sums to this number. That
                        is exactly what makes the caps checkable from a table
                        rather than from a sample of runs. */
                     rung:+r, index:i, clockSeed:0,
                     resolve: s.resolve, atk:s.atk, def:s.def, fatal: isFatal,
                     dodge: !upsetActive() && isKillingCommit(+r, i) && !isFatal,
                     /* The rival defends every gold now, so it is a fixed cost
                        of a player commit. Which defence it picks is a coin
                        flip between two equal-duration arms, so the table does
                        not need to know and cannot be made to lie by it. */
                     slip: s.owner === 'player', killing: isKillingCommit(+r, i) };
        t += commitPlan(cm, ms, rate).total;
      });
      /* The escape's second gold, on any rung this band actually won — a rung
         with a fatal clash never reaches its gold, so it can never spend one.
         Collected rather than added, because there is only ever ONE escape in
         a run: the worst case is the most expensive single rung, not the sum
         of all of them. Adding them all is what put a Grail at 39s against a
         33s cap and sent me looking for two seconds that were never spent. */
      const gi = rg.commits.length - 1, gs = script[gi] || {};
      /* And what is ADDED is the ESCAPED attempt, not a second finisher. The
         rung's original gold becomes the escape — no slip, and a guard's 220ms
         stop rather than a finisher's 1500ms, because nothing was finished —
         and the authored gold is what gets appended after it. So the run grows
         by the cheap commit, not the expensive one. Modelling the expensive one
         over-counted by 1.3s a rung and had me hunting for time that was never
         going to be spent. */
      if (worst && !(fatal && fatal.rung === +r) && gs.owner === 'player')
        /* Modelled at `gi + 1`, which is where the appended commit actually
           sits. Modelling it at `gi` charged the run the Circle of the position
           the escape REPLACES rather than the one it adds, and over-counted the
           worst case by enough to put it 12ms past the cap — the escape is the
           only thing in the game that can append a commit to a rung, so it is
           also the only thing whose mis-modelling can break a cap. */
        extras.push(commitPlan({ ring:gs.ring, owner:gs.owner, finish:false, resolve:'dodge',
                                 rung:+r, index:gi + 1, clockSeed:0, double:true,
                                 afterCap: commit.aftermath.min,
                                 atk:gs.atk, def:gs.def, fatal:false, dodge:false,
                                 slip:false, killing:false }, rg.commits[gi], rate).total);
    });
    if (extras.length) t += Math.max.apply(null, extras);
    if (a.vault){
      const v = a.vault;
      t += frameMs(height, v.confront, rate);
      t += commitPlan(Object.assign({ fatal:false, finish:false, rung:4, index:0, clockSeed:0,
                                      killing: isKillingCommit(4, 0) },
                                    commitScript[4][0]), v.commitA, rate).total;
      t += (v.rise + v.witness + v.strike + v.crack + v.occlusion + v.decode) / rate;
    }
    return Math.round(t);
  }

  return { box, bands, height, bandRung, bandVaultWin, rungBoxGrade, rungMismatch, mismatchRatio,
           rivalBigger, mismatchDire, finishRatio,
           confront, momentum, hit, ttk, commit, rings, slowRings, arcRings, ringKills,
           commitScript, fatalClash, isKillingCommit, commitTwoBeat, isArcCommit,
           combatRange, rangeOf, isRanged,
           counterOf, rungEdgePlan, rivalElementFor, upsetActive,
           survival, survivalAt, honestyAudit, survivalImage,
           coil, coilFrames, caps, build,
           tellShape, flinch, orbit, ringSpace, clock, feint, walkout, hasWalkout, walkoutFrom,
           clockPlan, clockCircle, clockAfterCap, clockSpreadRatio, circlePool, jitterAt,
           tellMs, isArcRing, frameMs, stakeLine, stakeTier, feintPlan,
           board, boardTiers, boardRungs, burnedBySurviving, burnedByOpener,
           signatures, signatureOf,
           opener, openerTotalMs, lossDelta, arc,
           celebration, turboRates, paddingLimit,
           clockSpreads, slowMoChips, ringChips, filmChips, rigPresets, stopmo,
           impact, clashWeight, resolveKey, impactSet, commitPlan, footwork, guardFeel,
           species, colorways, rivalNames, rivalSpecies, rivalTint,
           speciesId, speciesAlias, elementOf, speciesOfElement, packSpecies, packableId,
           elements, elementIds, edgeOf, edgeWord, rivalElementDraw,
           upset, dodge, defeat, escape,
           gags, omens, bandGroup,
           live, clockSpread, slowMo, ringScale, film, frames, gridEase, poseMs,
           turboRate, applyRig, rigMatch,
           openerTotal, openerBeats, phases, runLength };
})();

</script>
<script>

   Everything is hand-authored SVG. Convention: every actor is a group
   centered on (0,0) at its feet, wrapped as <g class="pos"><g class="anim">
   so placement (pos) and animation (anim) never fight over transform. */
window.BB = window.BB || {};
BB.art = (() => {

  // ---------------------------------------------------------------- defs
  const DEFS = `
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">

    </linearGradient>

      <stop offset="0.5" stop-color="#4a3d1e"/>

    </linearGradient>

    </linearGradient>
    <radialGradient id="floorGrad" cx="0.5" cy="0.45" r="0.75">

    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">

      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="auricBody" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.5" stop-color="#ffd75e"/>
      <stop offset="1" stop-color="#c8860d"/>
    </radialGradient>
    <radialGradient id="goldBloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edgeVig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#12040a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1a0206" stop-opacity="0.85"/>
    </radialGradient>
    <!-- THE AURA IS ACHROMATIC NOW, and that is the point. Threat used to be
         cool blue = beatable, hot red = dangerous — and ICE and WATER are both
         blue, so every ICE rival read as beatable whatever it actually was,
         and every FIRE rival read as dangerous. Colour is spoken for: the
         rings own amber, red and gold, and the creatures own their materials.
         So threat moves off hue entirely and is carried by SIZE, ground-shadow
         WEIGHT and aura TURBULENCE, all three of which survive a greyscale
         screenshot — which the colour version never did. -->
    <radialGradient id="auraNeutral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8eef5" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#9aa8b8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e8eef5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="groundShade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#05101f" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#05101f" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#05101f" stop-opacity="0"/>
    </radialGradient>

    <!-- ==================== THE THREE ELEMENT MATERIALS ====================
         Each element is a MATERIAL, not a palette swap, and never an icon, a
         letter or a badge. FIRE is a dark core lit from within, brightest at
         the centre and falling off outward — orange into white-hot and never
         into deep crimson, because deep crimson belongs to the red ring and a
         creature must never share a hue with the most important signal on
         screen. ICE is opaque, flat and pale, with hard facet planes rather
         than gradients. WATER is translucent, darker at its edges than at its
         centre, and it refracts what is behind it. -->
    <radialGradient id="fireFill" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#fff3d0"/>
      <stop offset="0.42" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#3a1c08"/>
    </radialGradient>
    <linearGradient id="iceFill" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e4f2fb"/>
      <stop offset="0.5" stop-color="#cfe4f2"/>
      <stop offset="1" stop-color="#b6d2e4"/>
    </linearGradient>
    <radialGradient id="waterFill" cx="0.5" cy="0.42" r="0.66">
      <stop offset="0" stop-color="#9df0e6" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#3fb3ab" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#0d3a44" stop-opacity="0.94"/>
    </radialGradient>
    <!-- FIRE's heat shimmer at the silhouette edge. Cheap, and the only
         distortion in the product. -->
    <filter id="heatShimmer" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028 0.06" numOctaves="2" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="5s" values="0.028 0.06;0.034 0.052;0.028 0.06" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="redBloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a7a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e8452c" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#020610" flood-opacity="0.55"/>
    </filter>
  </defs>`;

  // ---------------------------------------------------------------- arena
  /* ==================================================================
     THE MOUNTAIN IS THE BOARD.

     What used to be here was a card with a targeting reticle on it, sitting
     dead center at the back of the frame in gold, meaning nothing and
     breaking the reserved color rule while it did. It is gone. The triangle
     stays and becomes the climb: five rungs up the slope, Floor at the wide
     base, the Grail at the narrow peak.

     The taper is the argument. The mountain gets thinner as it rises, so the
     rarer the band the smaller its rung — scarcity drawn as geometry, read
     before a single number is. And a rung is a glyph and a position only: it
     carries no text at all, because text this far back is text nobody reads.
     What a tier is WORTH is carried by the card that flies off it.
     ================================================================== */
  function mountainBoard(){
    const m = BB.config.board.mountain, R = BB.config.board.rungs;
    const tiers = BB.config.boardTiers();
    const apex = `${m.apexX} ${m.apexY}`;
    const rungs = R.map(r => {
      const t = tiers[r.i];
      const s = Math.min(r.h - 9, 17) / 36;      // the glyph, fitted to the rung
      return `
      <g class="lrung" id="lrung-${r.i}" data-band="${r.i}" transform="translate(${r.cx} ${r.cy})">
        <rect class="lrFlare" x="${-r.w/2 - 7}" y="${-r.h/2 - 7}" width="${r.w + 14}" height="${r.h + 14}" rx="9"/>
        <g class="lrBody">
          <rect class="lrPlate" x="${-r.w/2}" y="${-r.h/2}" width="${r.w}" height="${r.h}" rx="4"/>
          <rect class="lrRule"  x="${-r.w/2}" y="-0.9" width="${r.w}" height="1.8" rx="0.9"/>
          <g class="lrIcon" transform="scale(${s.toFixed(3)})">${prizeGlyph(t.rep)}</g>
        </g>
      </g>`;
    }).join('');
    return `
        <g id="mountain">
          <path d="M ${m.apexX - m.halfW} ${m.baseY} L ${apex} L ${m.apexX + m.halfW} ${m.baseY} Z"
                fill="url(#iceWall)" opacity="0.9"/>
          <path d="M ${m.apexX - 13} ${m.apexY + 26} L ${apex} L ${m.apexX + 13} ${m.apexY + 26} Z"
                fill="#bfe6ff" opacity="0.5"/>
          <path d="M ${m.apexX - m.halfW - 22} ${m.baseY} h ${2*m.halfW + 44}"
                stroke="#9fd3e8" stroke-width="3" opacity="0.5"/>
          <g id="ladderRungs">${rungs}</g>
        </g>`;
  }

  /* THE TIER CARD — what flies off a rung so the band can introduce itself.
     Built at full size around its own origin so the flight is a single
     transform from the rung's scale and position to the front of the frame. */
  function tierCard(t, opts = {}){
    const c = BB.config.board.card, w = c.w, h = c.h;
    const money = v => '$' + v.toFixed(0);
    const range = t.lo === t.hi ? money(t.lo) : money(t.lo) + '–' + money(t.hi);
    const tone = opts.tone || '';
    return `
      <g class="tcard ${tone}">
        <rect class="tcPlate" x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="8"/>
        <g class="tcIcon" transform="translate(${-w/2 + 36} 0) scale(1.4)">${prizeGlyph(t.rep)}</g>
        <text class="tcName" x="${-w/2 + 68}" y="-6">${t.name}</text>
        <text class="tcVal"  x="${-w/2 + 68}" y="22">${range}</text>
        <text class="tcShare" x="${w/2 - 12}" y="${h/2 - 9}">${t.share}</text>
      </g>`;
  }

  /* The shatter: plain slabs of the card's own color thrown upward. No
     content on them, because at this speed the eye reads the break, not the
     pieces — and content that survived the crack would read as a glitch. */
  function tierShards(){
    const c = BB.config.board.card, n = 6, w = c.w / n;
    let s = '';
    for (let i = 0; i < n; i++){
      const x = -c.w/2 + i * w, dx = (i - (n-1)/2) * 13;
      s += `<rect class="tsh" x="${x}" y="${-c.h/2}" width="${w - 1.5}" height="${c.h}" rx="3"
              style="--dx:${dx.toFixed(0)}px;--rot:${((i - (n-1)/2) * 15).toFixed(0)}deg;--d:${(i % 3) * 34}ms"/>`;
    }
    return `<g class="tshards">${s}</g>`;
  }

  /* ================================================== THE TALE OF THE TAPE
     The walkout's card. Three slabs, all safe, none of them leaking:

       WHO           the rival's name and species. Pure flavour, rotates
                     freely, carries nothing.
       THE MISMATCH  the size ratio drawn as a comparison — two silhouettes on
                     a SHARED BASELINE with the height difference explicit.
                     This is the confrontation frame's job made literal.
       THE STAKE     what this fight is worth, read straight off the board:
                     "WIN AND BAND 3 BURNS". The answer to why the viewer
                     should care, and honest, because it is the same position
                     information the board is already showing.

     Every element is a function of rung index, so two runs of different bands
     arriving here see identical cards.

     RESERVED COLOR RULE: amber, red and gold belong to the telegraph rings.
     This card is bone, slate and ice like the board — the Vault's variant gets
     brighter, never gilded. */
  function tapeCard(o){
    const CF = BB.config;
    const T = CF.walkout.tape, w = T.w, h = T.h;
    const [ps, rs] = o.ratios;
    const pad = 13, gap = 9;
    /* FOUR SLABS NOW, and they are not equal because what they carry is not
       equal: the mismatch is the only one holding a picture, and the stake is
       the only one holding a sentence. Weights rather than columns —
       WHO, THE MISMATCH, THE EDGE, THE STAKE. */
    const weights = [1, 1.85, 1.0, 1.35];
    const col = (w - pad * 2 - gap * 3) / weights.reduce((s, v) => s + v, 0);
    const widths = weights.map(v => col * v);
    const xs = []; let acc = -w / 2 + pad;
    widths.forEach(cwv => { xs.push(acc); acc += cwv + gap; });
    const cw = widths[1];                                   // the mismatch slab
    const slab = (i, label, inner) => `
      <g class="tslab s${i}" transform="translate(${xs[i]} ${-h/2 + pad})" style="--i:${i}">
        <rect class="tsPlate" width="${widths[i]}" height="${h - pad*2}" rx="7"/>
        <text class="tsLabel" x="12" y="20">${label}</text>
        ${inner}
      </g>`;

    // WHO — wrapped by hand, because SVG text does not wrap and a name like
    // "Warden of Ninth Shelf" is wider than a third of the card.
    const lines = wrapWords(o.name, 13, 2);
    const who = lines.map((l, i) => `<text class="tsName" x="12" y="${52 + i * 25}">${l}</text>`).join('')
      + `<text class="tsSub" x="12" y="${h - pad*2 - 14}">${o.species || ''}</text>`;

    /* THE MISMATCH. One unit of scale, two bodies, one baseline: the height
       difference is the whole read, and the bracket and the ratio are there so
       it survives being glanced at rather than looked at. */
    /* `unit` is px per 1.0 of ratio, and it is set by the WORST case: at the
       Vault the rival is 1.9 and has to clear the slab's own label. */
    const unit = 44, art = 104;                             // creature art is ~104 tall
    const base = h - pad*2 - 22;
    const ph = unit * ps, rh = unit * rs;
    /* The real bodies, not stand-ins — including the Auric's. Substituting a
       Boxling shape here would make the one slab whose whole job is the height
       comparison the one slab that lies about it.

       No scale is written here: the TARGET height rides on the group as data and
       present.js normalizes by measurement once the card is in the document.
       Every species is drawn to a different height and the rival's species is a
       COSMETIC draw, so scaling by any nominal constant would let a cosmetic
       variable change the apparent mismatch. Measured, the two bodies and the
       bracket always agree, whichever rival turned up. */
    const sil = (id, ratio, cx, el) => `
      <g class="tsil" data-h="${(unit * ratio).toFixed(2)}"
         data-cx="${cx.toFixed(1)}" data-base="${base}">
        ${id === 'auric' ? auric() : creature(id, { element: el })}
      </g>`;
    /* THE TWO ELEMENT MATERIALS sit either side of the size comparison, and on
       a COUNTER pairing they meet at the slab's centre in a half-second loop
       where one visibly wins — using the same imagery as the defeat, so the
       card and the KO are teaching the same lesson twice. On a mirror they sit
       apart and neither moves. No icon, no letter: the materials themselves. */
    const chip = (el, cx, side) => {
      const E = CF.elements[el] || CF.elements.fire;
      const fill = el === 'fire' ? 'url(#fireFill)' : el === 'ice' ? 'url(#iceFill)' : 'url(#waterFill)';
      const shape = el === 'ice'
        ? `<path d="M -13 12 L -8 -8 L 0 -14 L 8 -8 L 13 12 Z" fill="${fill}" stroke="${E.trail}" stroke-width="1.4" stroke-linejoin="round"/>`
        : el === 'fire'
        ? `<path d="M 0 -15 q 8 8 8 15 a 8 8 0 0 1 -16 0 q 0 -7 8 -15 z" fill="${fill}"/>`
        : `<ellipse cx="0" cy="1" rx="13" ry="12" fill="${fill}"/>`;
      /* TWO GROUPS, and the outer one exists solely to hold the placement.
         A CSS transform on an SVG element REPLACES its `transform` attribute
         rather than composing with it, so putting the idle animation on the
         same group as the translate silently stacks both chips on the slab's
         origin — which is the identical trap the slab stagger already
         documents a few lines down. Placement outside, animation inside. */
      return `<g class="tsElPos" transform="translate(${cx.toFixed(1)} ${(base - 16).toFixed(1)})">
                <g class="tsEl tsEl-${el} ${side}">${shape}</g>
              </g>`;
    };
    const clash = o.edge === 'even' ? '' : `
      <g class="tsClash ${o.edge}" transform="translate(${(cw / 2).toFixed(1)} ${(base - 16).toFixed(1)})">
        <circle class="tsClashPop" r="13" fill="none" stroke="#dfe9f2" stroke-width="2" opacity="0.7"/>
      </g>`;
    const mismatch = `
      ${chip(o.playerEl, cw * 0.055, 'left')}
      ${chip(o.rivalEl,  cw * 0.945, 'right')}
      ${clash}
      ${sil(o.playerId, ps, cw * 0.34, o.playerEl)}
      ${sil(o.rivalId,  rs, cw * 0.66, o.rivalEl)}
      <path class="tsBase" d="M 10 ${base + 1} H ${cw - 10}"/>
      <path class="tsBracket" d="M ${cw - 20} ${base - rh} h 9 M ${cw - 20} ${base - ph} h 9
                                 M ${cw - 15.5} ${base - rh} V ${base - ph}"/>
      <text class="tsRatio" x="${cw - 24}" y="${base - (rh + ph) / 2 + 4}">×${(rs / ps).toFixed(2)}</text>`;

    /* THE EDGE — the one-word verdict, and the "oh shit I've got this" line
       the packing choice bought. It is TYPOGRAPHIC WEIGHT AND SIZE, never
       colour: FAVOURED in green and OUTMATCHED in red would put a fourth
       system into the colour channel the rest of this document just cleaned
       up. The sub-line names the relationship in plain words, once, because a
       viewer who has not yet seen a defeat has nothing else to learn it from. */
    const edgeWord = (CF.edgeWord && CF.edgeWord[o.edge]) || 'EVEN';
    const edge = `
      <text class="tsEdge ${o.edge}" x="12" y="62">${edgeWord}</text>
      ${wrapWords(o.edgeWhy || '', 16, 2)
        .map((l, i) => `<text class="tsEdgeWhy" x="12" y="${92 + i * 19}">${l}</text>`).join('')}`;

    // THE STAKE — read off the board, and never in a ring colour
    const stake = wrapWords(o.stake, 13, 3)
      .map((l, i) => `<text class="tsStake" x="12" y="${50 + i * 26}">${l}</text>`).join('');

    return `
      <g class="tapeCard${o.vault ? ' vault' : ''}" transform="translate(${T.x} ${T.y})">
        <rect class="tcBack" x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="11"/>
        ${slab(0, 'WHO', who)}
        ${slab(1, 'THE MISMATCH', mismatch)}
        ${slab(2, 'THE EDGE', edge)}
        ${slab(3, 'THE STAKE', stake)}
      </g>`;
  }
  /* Greedy wrap into at most `max` lines; the last line keeps whatever is left
     rather than dropping words, because a truncated rival name is a bug the
     viewer can see. */
  function wrapWords(text, per, max){
    const words = String(text || '').split(/\s+/).filter(Boolean);
    const out = [];
    for (const word of words){
      const i = out.length - 1;
      if (i >= 0 && (out[i] + ' ' + word).length <= per) out[i] += ' ' + word;
      else if (out.length < max) out.push(word);
      else out[i] += ' ' + word;
    }
    return out.length ? out : [''];
  }

  function arena(){
    let spires = '';
    const sp = [[60,180],[150,120],[830,150],[915,200],[770,110]];
    for(const [x,h] of sp){
      spires += `<path d="M ${x-42} 360 L ${x} ${360-h} L ${x+42} 360 Z" fill="url(#iceWall)" opacity="0.8"/>
                 <path d="M ${x-10} ${360-h+18} L ${x} ${360-h} L ${x+10} ${360-h+18} Z" fill="#bfe6ff" opacity="0.5"/>`;
    }
    let snow = '';
    for(let i=0;i<26;i++){
      const x = Math.round((i*137)%960), d = 9 + (i%7)*2.6, delay = (i*0.83)%9;
      snow += `<circle class="snowflake" cx="${x}" cy="-10" r="${1+(i%3)*0.7}" fill="#dff1ff" opacity="0.7"
                style="animation-duration:${d}s;animation-delay:-${delay}s"/>`;
    }
    return `
    <svg id="arenaSvg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice">
      ${DEFS}
      <rect id="sky" width="960" height="540" fill="url(#skyGrad)"/>
      <!-- #cam is the camera. It has exactly two moves: push in on a Tell,
           shake on a Clash. It never follows and never cuts. -->
      <g id="cam">
      <g id="auroraLayer">
        <path class="aurora a1" d="M -50 90 C 200 30, 420 150, 700 70 S 980 110, 1020 60 L 1020 0 L -50 0 Z" fill="url(#auroraGrad)"/>
        <path class="aurora a2" d="M -50 160 C 260 100, 500 210, 760 130 S 1000 180, 1020 130 L 1020 40 C 800 90, 500 40, 200 120 S -20 120, -50 100 Z" fill="url(#auroraGrad)" opacity="0.6"/>
      </g>
      <g id="world">
        <g id="spires">${spires}</g>
        ${mountainBoard()}
        <ellipse id="floor" cx="480" cy="452" rx="470" ry="96" fill="url(#floorGrad)"/>
        <ellipse cx="480" cy="452" rx="470" ry="96" fill="none" stroke="#bfe6ff" stroke-width="2" opacity="0.35"/>
        <ellipse cx="480" cy="452" rx="330" ry="64" fill="none" stroke="#dff5ff" stroke-width="1.4" opacity="0.22"/>
      </g>
      <g id="snowLayer">${snow}</g>
      <g id="farLayer"></g>
      <g id="actorLayer"></g>
      <g id="fxLayer"></g>
      <!-- The player's caret. Its own layer above the fighters and the dust so
           nothing can occlude it, and below the board cards and the walkout
           tape so it never competes with a beat that owns the screen. It is
           never cleared with the fx, because identity is not an effect. -->
      <g id="markLayer"></g>
      <!-- The tier cards fly out in FRONT of the fight, because during an
           Aftermath the board and the celebration own the beat together and a
           card the fighters can stand in front of is a card nobody reads.
           It lands above their heads, so it never covers a body. -->
      <g id="boardLayer"></g>
      <!-- The walkout's card sits in front of everything, because the beat
           exists to be read and a card the fighters stand in front of is a card
           nobody reads. It never survives into a Tell: the fight owns those. -->
      <g id="tapeLayer"></g>
      <g id="omenLayer"></g>
      </g>
      <rect id="vignette" width="960" height="540" fill="url(#edgeVig)" opacity="0" pointer-events="none"/>
      <rect id="flash" width="960" height="540" fill="#fff8dd" opacity="0" pointer-events="none"/>
      <rect id="dimmer" width="960" height="540" fill="#02060f" opacity="0" pointer-events="none"/>
    </svg>`;
  }

  const wrap = (cls, inner, extra='') =>
    `<g class="pos ${cls}" ${extra}><g class="anim">${inner}</g></g>`;

  /* A fighter carries four transform layers so nothing ever fights over one
     attribute: pos = where it stands (and how big the mismatch made it),
     stance = its momentum posture, anim = the current blow, idle = breathing.
     Momentum owns `stance` and only `stance`, which is what lets a posture
     survive a hit animation instead of being overwritten by it. */
  /* THE GROUND SHADOW is one of the three legs threat now stands on, since it
     no longer stands on hue at all. A dangerous body sits in a heavier, darker
     shadow; a beatable one barely marks the ice. It is drawn under `pos` and
     outside `stance` on purpose: a shadow that leaned and squashed with the
     posture would be reading the momentum state, and the momentum state has
     four layers of its own to say that with. */
  const wrapFighter = (cls, inner, extra='') =>
    `<g class="pos fighter ${cls}" ${extra}>` +
    `<g class="shade"><ellipse cx="0" cy="-3" rx="52" ry="13" fill="url(#groundShade)"/></g>` +
    `<g class="aura"><ellipse cx="0" cy="-52" rx="86" ry="70"/></g>` +
    `<g class="stance"><g class="anim"><g class="idle">${inner}</g></g></g></g>`;

  /* The guard: the fists a body puts up, drops, or hides. Momentum shows and
     places them from CSS — they are half the DOMINANT/PRESSURED read. */
  const guard = (body, dark) => `
    <g class="guardG">
      <g class="fist fistL"><circle cx="-30" cy="-40" r="10.5" fill="${body}" stroke="${dark}" stroke-width="2.2"/></g>
      <g class="fist fistR"><circle cx="30" cy="-40" r="10.5" fill="${body}" stroke="${dark}" stroke-width="2.2"/></g>
    </g>`;

  // ---------------------------------------------------------------- faces
  /* Expression variants live inside every creature; data-ex on .creature
     picks one via CSS. Variants: normal worried fierce dizzy ko happy */
  function face(fx, fy, s=1){
    return `
    <g class="face" transform="translate(${fx} ${fy}) scale(${s})">
      <g class="exv exv-normal">
        <ellipse cx="-14" cy="0" rx="7.6" ry="9.6" fill="#1c1410"/>
        <ellipse cx="14"  cy="0" rx="7.6" ry="9.6" fill="#1c1410"/>
        <circle cx="-11.6" cy="-3.4" r="2.6" fill="#fff"/>
        <circle cx="16.4"  cy="-3.4" r="2.6" fill="#fff"/>
        <path d="M -4 12 Q 0 15.6 4 12" stroke="#1c1410" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="exv exv-worried">
        <ellipse cx="-14" cy="1" rx="6.4" ry="8" fill="#1c1410"/>
        <ellipse cx="14"  cy="1" rx="6.4" ry="8" fill="#1c1410"/>
        <circle cx="-12" cy="-1.6" r="2.2" fill="#fff"/>
        <circle cx="16"  cy="-1.6" r="2.2" fill="#fff"/>
        <path d="M -20 -9 Q -14 -12 -8 -9" stroke="#1c1410" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 8 -9 Q 14 -12 20 -9" stroke="#1c1410" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="0" cy="13" rx="3.4" ry="4.4" fill="#1c1410"/>
      </g>
      <g class="exv exv-fierce">
        <path d="M -21 -6 L -6 -1 L -6 6 Q -14 9 -21 4 Z" fill="#1c1410"/>
        <path d="M 21 -6 L 6 -1 L 6 6 Q 14 9 21 4 Z" fill="#1c1410"/>
        <circle cx="-11" cy="2" r="2" fill="#fff"/>
        <circle cx="11" cy="2" r="2" fill="#fff"/>
        <path d="M -5 13 L 0 10.6 L 5 13" stroke="#1c1410" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>
      <g class="exv exv-dizzy">
        <path d="M -14 0 m 6 0 a 6 6 0 1 1 -6 -6 a 4.4 4.4 0 1 1 -4.4 4.4 a 2.6 2.6 0 1 0 2.6 -2.6"
              stroke="#1c1410" stroke-width="2" fill="none"/>
        <path d="M 14 0 m 6 0 a 6 6 0 1 1 -6 -6 a 4.4 4.4 0 1 1 -4.4 4.4 a 2.6 2.6 0 1 0 2.6 -2.6"
              stroke="#1c1410" stroke-width="2" fill="none"/>
        <ellipse cx="0" cy="13" rx="4" ry="3" fill="none" stroke="#1c1410" stroke-width="2"/>
      </g>
      <g class="exv exv-ko">
        <path d="M -19 -5 L -9 5 M -9 -5 L -19 5" stroke="#1c1410" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M 9 -5 L 19 5 M 19 -5 L 9 5" stroke="#1c1410" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M -4 13 Q 0 10.6 4 13" stroke="#1c1410" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="exv exv-happy">
        <path d="M -20 0 Q -14 -7 -8 0" stroke="#1c1410" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M 8 0 Q 14 -7 20 0" stroke="#1c1410" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M -6 11 Q 0 17 6 11" stroke="#1c1410" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>
    </g>`;
  }

  const collar = charm => charm ? `
    <g class="collarG">
      <path class="collarBand" d="M -26 -34 Q 0 -24 26 -34" stroke="#7a2e2e" stroke-width="6" fill="none"/>
      <circle class="charmGem" cx="0" cy="-26" r="6.5" fill="url(#goldGrad)" stroke="#8a6508" stroke-width="1.4" filter="url(#softGlow)"/>
      <circle cx="-2" cy="-28" r="1.8" fill="#fff8dd"/>
    </g>` : '';

  // ------------------------------------------------------------ creatures
  /* ==================================================================
     THE ELEMENT IS THE CREATURE.
