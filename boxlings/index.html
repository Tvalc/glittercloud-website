         cannot be a tell — a band that dies here simply never spends it, and
         the stream position is the same for every band either way. */
      const killing = C.isKillingCommit(rung, i);
      const survivalKind = killing ? F.pick(S.cosmetic, C.survivalImage.kinds) : null;
      commits.push({
        index: i,
        /* v3.7: the position travels with the commit, because the Circle, the
           abort count and the double are all functions of position and the
           presenter has to be able to ask for them without knowing the band. */
        rung, clockSeed,
        aborts: (clk[i] || {}).aborts || 0,
        double: !!(clk[i] || {}).double,
        owner: s.owner,
        ring: s.ring,
        /* MELEE OR RANGED, straight off the script and never drawn. It sits
           beside `ring` here for the same reason it sits beside `ring` there:
           both are properties of the POSITION, both are read by the Tell, and
           neither may ever become a function of the band. No stream is
           consulted, so nothing about the leak audit moves. */
        range: C.rangeOf(s),
        pre: s.pre, tell: s.tell, out: s.out,
        /* The flinch, carried straight through from the script table. Position
           only: the same reactions play for every band that reaches this
           commit, which is what stops the bodies from reading the result. */
        atk: s.atk, def: s.def,
        resolve, slip, slipKind, killing, survivalKind,
        /* How this commit is being TOLD, which the presenter reads for its
           framing and nothing else. `skinOfTeeth` = a favourite that only just
           held; `upsetLoss` = a favourite that did not. Neither can reach the
           outcome: the band decided that at the seal, and both of these are
           read off the same fatal table the board and the stake line are. */
        skinOfTeeth,
        upsetLoss: !!(upset && edge === 'favoured' && fatal),
        fatal,                                   // the clash that ends the run
        finish: s.owner === 'player',            // a player commit asks "does this finish them?"
        // Cosmetic-only choreography: which way the circling opens, how the
        // scuffle reads, which side the plant plays from. Carries nothing.
        seed: Math.floor(S.cosmetic() * 1e6),
      });
      if (i === fatalIndex) break;               // nothing plays after the run ends
    }

    /* ===================== THE ESCAPE, APPENDED =====================
       The rival gets out of the gold and the gold is thrown again. Only ever
       on a rung this band WON — if the rung had a fatal clash the loop above
       broke before the gold, so there is nothing to escape and nothing to
       append. That is what makes it leak-proof rather than merely audited: the
       extra commit lives entirely on the far side of the clash that decides
       the band, so no run that dies here ever sees it, and every run that
       survives sees exactly the same thing for a given seal.

       The FIRST gold becomes an attempt that does not land: the rival comes
       out of it buckling but alive, and it resolves like a guard rather than a
       finisher, so it does not hold the finisher's 1.5s stop. The SECOND is
       the real one, and it carries the finish, the celebration and the defeat
       image. Every index below is untouched, so the fatal table, the board's
       prune schedule and the stake line all still point where they did. */
    const goldIdx = commits.length - 1;
    const gold = commits[goldIdx];
    if (fatalIndex < 0 && m.escape && gold && gold.finish){
      const authored = script[goldIdx] || {};
      Object.assign(gold, {
        escaped: true,
        finish:  false,                  // it does not finish; it is escaped
        resolve: 'dodge',                // and so it does not hold a finisher's stop
        /* THE ESCAPE'S AFTERMATH IS PINNED TO ITS FLOOR, and the live interval
           audit is what found this. The escape appends a commit the clock
           planner never scheduled — it sits past the end of the script — so it
           gets the Circle floor and none of the interval solver's attention,
           and on a real Grail run its gap landed 16% from the one before it.
           An automatic fail, in the one place nothing was looking.

           The fix is also the better staging. An escape means the rival got out
           of the finisher and the second one is on it before it can reset;
           holding a full Aftermath in between is the opposite of what the beat
           is about. Pinned to the floor it reads breathless, it separates the
           two gaps by 61%, and it makes the run shorter rather than longer. */
        afterCap: C.commit.aftermath.min,
        out:     { p:'DOMINANT', r:'BUCKLING' },
        /* The rival's defence of this gold IS the escape. Stacking a slip in
           front of it would be two evasions in one commit, which reads as the
           blow never having been thrown at all. */
        slip:     false,
        slipKind: null,
      });
      commits.push(Object.assign({}, gold, {
        index:   commits.length,
        escaped: false,
        finish:  true,
        resolve: 'critical',
        /* The re-thrown gold is a DOUBLE by definition — the rival got out of
           the first one and the second is on it before it can reset. No aborts:
           an abort here would be a third stop in a beat that is already about
           a blow that failed to land. */
        aborts:  0,
        double:  true,
        out:     authored.out,           // the authored ending, restored
        /* The rival spent its escape on the first one. The second is thrown at
           a body that has nothing left to answer with, and it lands clean. */
        slip:     false,
        slipKind: null,
        seed:    Math.floor(S.cosmetic() * 1e6),
      }));
    }

    return {
      rung,
      mismatch: C.rungMismatch[rung],            // fixed per rung, never per band
      rival, leadIndex, edge, upset,
      dodgeAt: m.dodgeAt,
      boxGrade: C.rungBoxGrade[rung],
      win: fatalIndex < 0,
      commits,
    };
  }

  // ------------------------------------------------------------- the plan
  function planRun({ serverSeed, clientSeed, openIndex, pack, forcedBand = null, recentGags = [] }){
    const seal = F.makeSeal(serverSeed, clientSeed, openIndex);
    const S = {
      outcome:  F.stream(seal, 'outcome'),
      script:   F.stream(seal, 'script'),
      tells:    F.stream(seal, 'tells'),
      cosmetic: F.stream(seal, 'cosmetic'),
      /* The fifth stream, and the reason it is a fifth rather than a share of
         an existing one is in fair.js: the omens consume a band-dependent
         number of draws from `tells`, so anything drawn after them there would
         sit at a band-dependent offset. Two draws per rung, always, whatever
         the band — which is what makes "element never correlates with band"
         structural rather than something an audit has to keep re-proving. */
      matchup:  F.stream(seal, 'matchup'),
      /* THE SIXTH, and v3.7's honesty note is what makes it a sixth. "The
         jitter seed is drawn AFTER the outcome is decided and independently of
         it. It never shares a stream with the outcome draw." The tempting home
         was `cosmetic`, and that would have been the fifth stream's bug over
         again: `cosmetic` is consumed per commit, and the number of commits is
         the band, so anything drawn from it after the rungs are authored sits
         at a band-dependent offset. ONE draw, taken here, before any rung is
         authored — so the clock is a pure function of the seal and nothing in
         it can be a function of the band. */
      clock:    F.stream(seal, 'clock'),
    };
    /* The whole run's clock comes off a single draw, so the jitter at every
       position is a pure function of (seal, rung, index) — see C.jitterAt. Two
       runs of different bands get the SAME Circle at the same position, which
       is what "the Circle before the red comes from the same distribution for
       the run that dies there and the run that survives it" actually requires:
       not merely the same distribution, but by construction the same draw. */
    const clockSeed = Math.floor(S.clock() * 1e9);

    const H = C.height;
    const item = drawItem(S.outcome, forcedBand);
    const mult = item.value / C.box.price;
    const band = bandOf(mult);
    const terminal = C.bandRung[band.i];
    const vaultWin = !!C.bandVaultWin[band.i];
    const vaultLoss = terminal === H && !vaultWin;
    const group = C.bandGroup(band.i);

    // Omens fire at published rates and ride on a beat that already exists,
    // so they cost the run no time and the 30s cap holds either way.
    const omens = [];
    const om = C.omens;
    if (S.tells() < om.stormFront.rates[group]) omens.push({ id:'stormFront', beforeRung: 2 + (S.tells() < 0.5 ? 0 : 1) });
    if (S.tells() < om.auricTrace.rates[group]) omens.push({ id:'auricTrace', beforeRung: 2 + (S.tells() < 0.5 ? 0 : 1) });
    const goldMeteor = vaultWin && S.tells() < om.goldMeteor.rates.grailOnly;

    // The floor gag (cosmetic; the anti-repeat window is height-legal context).
    // The rig can pin one for demo purposes without touching any other stream.
    const gagPool = C.gags.filter(g => g.charterApproved && !recentGags.includes(g.id));
    const drawnGag = F.pick(S.cosmetic, gagPool.length ? gagPool : C.gags).id;
    const gag = C.live.gagId || drawnGag;

    /* The opener's rival is elemental too — it is a creature on screen, and
       "the element IS the creature" does not take the first three seconds off.
       There is no card and no EDGE here: the opener is the tutorial for the
       commit, and a verdict slab in it would be one system too many before the
       viewer has learned the first. */
    const openerEl = C.rivalElementDraw(S.matchup());
    const openerRival = {
      name: F.pick(S.cosmetic, C.rivalNames[1]),
      element: openerEl,
      speciesId: F.pick(S.cosmetic, C.speciesOfElement(openerEl)).id,
    };

    /* Lead index. A pack is one Boxling, so this is 0 at every rung — the
       modulo is kept because the rung scripts and the Vault both ask for a
       lead by index, and a pack that ever grows again should rotate rather
       than crash. */
    const n = Math.max(1, pack.members.length);
    /* WHAT PACKING BUYS. The pack chose one Boxling, and choosing it chose an
       element — so it chose which counters this run will meet and what the
       fights will LOOK like. It cannot choose what the box holds: the item was
       drawn off the `outcome` stream above, before this line ran. */
    const playerEl = C.elementOf((pack.members[0] || {}).speciesId);
    const playerSp = C.speciesId((pack.members[0] || {}).speciesId);
    /* The whole matchup schedule, for every rung the game has, drawn before a
       single rung is authored — so it cannot see how far this run goes. */
    const matchups = matchupSchedule(S, playerEl);
    const rungs = [];
    const fatal = C.fatalClash[band.i] || null;    // where this band's run ends
    const lastFightRung = Math.min(terminal, H - 1);
    for (let r = 2; r <= lastFightRung; r++){
      rungs.push(scriptRung(r, (fatal && fatal.rung === r) ? fatal.index : -1,
                            (r - 2) % n, S, playerEl, matchups[r], playerSp, clockSeed));
    }

    /* THE VAULT is two commits. Commit A is the largest creature in the game
       throwing a red — survived by every band that gets here, which is what
       makes it legal to show at all. Commit B is the WITNESS strike, and its
       clash is the crack: the only place in the run where band 4 and the
       Grail diverge. There is no fight after the crack; the prize decodes. */
    let vault = null;
    if (terminal === H){
      const front = (H - 2) % n;
      /* The Auric is elemental too, and its element came out of the same
         band-blind schedule as every other rung's, so the Vault is favoured,
         mirrored and countered at the same 1/3 each as anywhere else. It is a
         material treatment ON the Auric rather than a different body: the
         Vault's rival is always the Auric, and always the largest creature in
         the game. */
      const vm = matchups[H];
      const vEl = vm.element, vEdge = vm.edge, vUpset = vm.upset;
      vault = {
        crack: vaultWin ? 'gold' : 'red',
        goldMeteor,
        witnessIndex: front,
        mismatch: C.rungMismatch[H],
        edge: vEdge,
        /* The Vault's upset is ALWAYS staged as survival, never as domination:
           this is the game's biggest guard moment and the one commit every
           reacher survives, so the only upset available here is the outmatched
           body that stands. */
        upset: vUpset,
        rival: { name: F.pick(S.cosmetic, C.rivalNames[H]), speciesId: 'auric',
                 element: vEl, tint: C.rivalTint[H],
                 entrance: F.pick(S.cosmetic, C.walkout.entrances).id },
        // the Vault's red is survived by every reacher — it is the game's
        // biggest guard moment, so it always reads as one
        /* The Vault's commit A carries its position like every other commit
           does: it is the game's longest Circle — the largest creature in the
           game, taking its time — and it holds the run's densest run of aborts.
           `killing` is stated rather than inferred so config, the planner and
           runLength cannot disagree about the size of its stop. */
        commitA: Object.assign({ index:0, rung:H, clockSeed,
                                 aborts: (C.clockPlan(H, 1, clockSeed)[0] || {}).aborts || 0,
                                 double: false,
                                 killing: C.isKillingCommit(H, 0),
                                 fatal:false, finish:false, resolve:'land',
                                 seed: Math.floor(S.cosmetic() * 1e6) }, C.commitScript[H][0]),
      };
      vault.dodgeAt = vm.dodgeAt;
    }

    /* Stamp the dodge onto the commit itself, so commitPlan can budget its
       stun aftermath and the filmstrip agrees with the run.

       v3.6: THE DODGE IS THE SURVIVAL IMAGE AT A KILLING COMMIT. It fires on
       every survival of one — no draw, no site, no cap — so its position is a
       pure function of the fatal table and `!c.fatal` is the whole of the
       band's say in it. The blow either landed or it did not, and which one
       happened is only ever learned at the Clash, which is the one place the
       invariance rule allows two runs of different bands to differ at all.

       Read that against the band table and it is exactly the published rate:
       band 2 dies on rung 1's amber and never dodges; band 3 survives it and
       dodges once; bands 4 and the Grail survive both and dodge twice. So the
       dodge is seen at 35.1% and 28.8% — the real numbers — without anything
       ever having been tuned to produce them.

       The Vault's commit A cannot kill, so it no longer hosts one. "Never on
       the WITNESS strike" stays structural for the same reason it always was,
       and now for a second: the WITNESS strike is the player's, and it is not
       a killing commit either. */
    const v36 = !C.upsetActive();
    rungs.forEach(rg => rg.commits.forEach(c => {
      c.dodge = v36 ? (C.isKillingCommit(rg.rung, c.index) && !c.fatal)
                    : (c.index === rg.dodgeAt && !c.fatal);
    }));
    if (vault) vault.commitA.dodge = v36 ? false : vault.dodgeAt === 0;

    /* THE ELEMENTAL DEFEAT — the losing image, and the only teaching this
       design does. It plays when a body is finished BY ITS COUNTER, and
       nowhere else: mirror and neutral defeats take the ordinary KO from the
       momentum system, so the three images stay reserved and stay meaningful.
       Which one plays is a function of the LOSER's element, because the image
       is a thing that happens to the loser's material. */
    /* WHERE THE THREE IMAGES ACTUALLY PLAY UNDER v3.6, and it moved.
       v3.5 could show either body transform, because the rival's element was a
       free draw and came up as the player's prey a third of the time. The
       schedule is honest now: at every rung the rival is a MIRROR or the
       player's COUNTER, never the player's prey — so the rival can no longer
       be finished by a counter, and the losing image is the PLAYER'S.

       That is a smaller change than it sounds and arguably the right one. The
       image was always the lesson, and the lesson lands hardest on the run
       that just ended: a FIRE Boxling guttering out to the WATER rival that
       killed it teaches the arm permanently, in the one moment the player is
       certain to be looking. Three arms, three deaths, and a volume user sees
       all three inside a session — which is the property the doc asked for. */
    const defeatOf = (loserEl, winnerEl) =>
      (C.elements[winnerEl] && C.elements[winnerEl].beats === loserEl)
        ? C.elements[loserEl].losesAs : null;
    /* THE RIVAL'S DEATH, and why the finish stopped asking what the rival was.
       Under the v3.6 schedule every rival is a MIRROR or the player's COUNTER,
       never the player's prey — so `defeatOf(rival, player)` was null at every
       finish in the game and the rival never once melted, froze or guttered.
       Two of the three losing images only ever played on the player's own
       death, and the arm the player is actually good at was never taught.

       So the finish plays the losing image of the element the player COUNTERS,
       whatever the rival happens to be made of. Only the death changes: the
       rival looks like itself for the whole fight and dies your prey's death,
       because the image is the lesson about YOUR element and the moment it
       lands is the moment that lesson is earned. Player FIRE, so something
       melts. Deliberately a function of the player's element alone — it is the
       same image every time you win, which is what makes it teach. */
    const preyOf = el => (C.elements[el] || {}).beats;
    const finishDefeat = () => {
      const prey = preyOf(playerEl);
      return prey && C.elements[prey] ? C.elements[prey].losesAs : null;
    };
    rungs.forEach(rg => rg.commits.forEach(c => {
      c.defeat = c.fatal ? defeatOf(playerEl, rg.rival.element)     // the player falls
               : c.finish ? finishDefeat()                          // the rival dies your prey's death
               : null;
    }));

    // Which Boxling the run ends on — always the one you packed, kept as an
    // index so the receipt reads off the same source the stage does.
    const finalIndex = vault ? vault.witnessIndex
      : rungs.length ? rungs[rungs.length - 1].leadIndex : 0;

    return {
      demo: forcedBand != null,
      height: H, finalIndex,
      seal, serverSeed, clientSeed, openIndex,
      item, mult, band: band.i, bandGroup: group,
      terminal, vaultWin, vaultLoss,
      playerElement: playerEl,
      openerContinue: terminal >= 2,
      openerRival, gag,
      omens, rungs, vault,
      packSnapshot: JSON.parse(JSON.stringify(pack)),
    };
  }

  return { planRun };
})();

</script>
<script>
/* ---- js/present.js ---- */
/* Boxlings Battle — presentation. A player for the RunPlan.
   Law of the layer: it may READ the plan, never write it.

   The reveal rework put three things in here that the old build did not have:

   1. MOMENTUM. Each fighter is in exactly one of five states, and the state is
      expressed entirely through the body — posture, ground held, guard. There
      is no meter. Transitions are tweened, never snapped, because the
      transition is where the read lives.
   2. A PACER. Every scene runs against a wall-clock deadline derived from the
      band's budget, so the Grail cannot creep past 30s and the Floor cannot
      creep past 3 no matter how slow the device is.
   3. HITSTOP that actually stops: every running animation in the document,
      fighters and particles alike, is paused for the duration. */
window.BB = window.BB || {};
BB.present = (() => {
  const C = BB.config, A = BB.art;

  /* Player x, rival x, ground y. PX and RX are LET, not const: the arena is
     drawn with preserveAspectRatio="slice", so a pane that is not 16:9 crops
     the sides of the viewBox — and a fighter driven to BUCKLING or DOWN could
     be driven clean out of the picture, which turns "giving ground" into
     "gone". refit() re-derives the staging from the band actually on screen,
     and every use of PX/RX reads the current value. */
  let PX = 290, RX = 668;
  const GY = 442, SPREAD = 378;            // the authored distance between them
  const st = { rate:1, skipping:false, stage:null, hud:null, actors:{},
               tapResolve:null, result:null, fighters:{}, t0:0, clockTimer:null,
               band:[0,960], k:1, frozen:0, stepped:false, faceLock:false,
               /* ------------------------------------------------ THE RING SPACE
                  The fight's locomotion, in polar coordinates around a shared
                  centre. `cx` is that centre in arena x; `phi` is the angle of
                  the AXIS — the line between the two fighters — and it is the
                  thing v3.7 exists to make rotate; `delta` is how far the rival
                  sits from diametrically opposite the player, which is what
                  stops the two of them reading as one mechanism.

                  Modelling the axis explicitly rather than giving each fighter
                  its own theta is what makes the 90-degrees-per-second
                  requirement provable instead of tuned: the sweep floor is
                  applied to `phi` directly, and each fighter's own angle is
                  derived from it, so no combination of states can quietly drop
                  the axis below the floor except the one that is supposed to
                  (see BUCKLING). */
               ring: { cx:480, phi:Math.PI, delta:0, live:false, z:0, t:0 },
               /* THE APPROACH BIAS — how the Circle before a commit says what
                  KIND of commit is coming. A fighter about to throw something
                  backs off to throw it; a fighter about to swing closes. It is a
                  standing offset on the radius envelope rather than an event, so
                  it rides the breathing that was already there and reads as two
                  animals finding their distance instead of as a cue firing.
                  Band-blind by construction: it is read straight off the commit
                  script's `range`, which is a function of position only. */
               approach: 0,
               /* The live charge, if a ranged commit is currently winding up.
                  Held here rather than on the fighter because it is the Tell's
                  object and not the body's: it is created by the role cue,
                  consumed by the release, and cleared by anything that ends a
                  commit early — and a core that outlived its own Tell would be
                  the loudest thing on screen during the next one. */
               core: null,
               /* The camera is rig-owned now. It used to write its own CSS
                  transition, which cannot survive a frame loop writing the same
                  property — and v3.7 gives it a second axis to move on. */
               cam: { x:0, xTo:0, k:1, kTo:1, ms:1, t0:0, from:{x:0,k:1} },
               /* Acceptance test 22: every inter-Tell interval, in order, so the
                  audit is measured rather than asserted. */
               ivals: [], lastTell: 0 };

  // ------------------------------------------------------------- utilities
  const q  = sel => st.stage.querySelector(sel);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const vfx = () => C.live.vfx;

  function svgNode(str){
    const t = document.createElementNS('http://www.w3.org/2000/svg','svg');
    t.innerHTML = str;
    return t.firstElementChild;
  }
  function addNode(layer, str, x, y, flip=false){
    const n = svgNode(str);
    q(layer).appendChild(n);
    n.style.transform = `translate(${x}px, ${y}px)` + (flip ? ' scaleX(-1)' : '');
    return n;
  }
  const animEl  = n => n.querySelector('.anim') || n;
  const stanceEl = n => n.querySelector(':scope > .stance');
  const scale = ms => st.skipping ? 1 : Math.max(1, ms / st.rate);
  /* A zero-length wait must cost zero. Where the platform clamps timers — a
     backgrounded tab clamps to 1Hz — asking for 1ms and being charged 1000ms
     is how a 30s run becomes a 36s one, so beats the pacer has already
     squeezed to nothing are never handed to setTimeout at all. */
  const wait = ms => (st.skipping || ms <= 8) ? Promise.resolve() : new Promise(r => setTimeout(r, ms));

  /* EVERY animation in the product is quantized to the same frame grid — the
     fx, the boxes, the gags, the crack, all of it. One rate, obeyed
     absolutely. A single element easing smoothly while everything else is on
     twos is exactly what made the last pass read as stuttering rather than as
     a medium. Pass `smooth:true` to opt out (nothing does). */
  function anim(node, frames, ms, opts={}){
    if (st.skipping){ try { node.animate(frames, { duration:1, fill: opts.fill || 'forwards' }); } catch(e){} return Promise.resolve(); }
    const grid = opts.smooth ? {} : { easing: C.gridEase(ms) };
    const a = node.animate(frames, Object.assign({ duration: Math.max(1, ms), fill:'forwards', easing:'ease-out' }, opts, grid));
    // Race a timer: if the tab is hidden the compositor stops and `finished`
    // would never resolve — a run must always be able to complete.
    return Promise.race([
      a.finished.catch(()=>{}),
      new Promise(r => setTimeout(() => { try { if (a.playState === 'running') a.finish(); } catch(e){} r(); }, Math.max(1, ms) + 400)),
    ]);
  }
  const setEx = (node, ex) => node && node.setAttribute('data-ex', ex);
  function clearLayer(sel){ const l = q(sel); while(l.firstChild) l.removeChild(l.firstChild); }
  function removeActor(name){ const a = st.actors[name]; if (a){ a.remove(); delete st.actors[name]; }
                              if (st.fighters[name]) delete st.fighters[name]; }

  /* HITSTOP. Freeze the fighters AND the particles — the snow, the aurora,
     the sparks, the in-flight knockback transition. Anything less reads as a
     stutter rather than a blow. */
  async function hitstop(ms){
    if (ms <= 0 || st.skipping) return;
    let paused = [];
    try { paused = document.getAnimations().filter(a => a.playState === 'running'); } catch(e){}
    paused.forEach(a => { try { a.pause(); } catch(e){} });
    await wait(ms);
    paused.forEach(a => { try { if (a.playState === 'paused') a.play(); } catch(e){} });
  }

  function shake(px=6, ms=220){
    if (!vfx()) return Promise.resolve();
    const svg = q('#arenaSvg');
    return anim(svg, [
      { transform:'translate(0,0)' }, { transform:`translate(${px}px,${-px/2}px)` },
      { transform:`translate(${-px}px,${px/2}px)` }, { transform:'translate(0,0)' }
    ], scale(ms), { fill:'none' });
  }
  function fxAt(str, x, y, life=700){
    if (!vfx()) return null;
    const n = addNode('#fxLayer', `<g class="pos"><g class="anim">${str}</g></g>`, x, y);
    if (life) setTimeout(()=>n.remove(), Math.max(life, scale(life)) + 500);
    return n;
  }
  function banner(text, klass='', hold=1100){
    const b = st.hud.banner;
    b.textContent = text;
    b.className = 'shown ' + klass;
    setTimeout(()=>{ b.className=''; }, Math.max(400, scale(hold)));
  }
  function stakes(text){ st.hud.stakes.textContent = text || ''; }
  function hideTap(){ st.hud.action.classList.remove('shown','gold'); st.tapResolve = null; }
  function offerTap(label, { timeout=2600, gold=false } = {}){
    if (st.skipping || st.rate > 1) return Promise.resolve({tapped:false});
    const btn = st.hud.action;
    btn.textContent = label;
    btn.classList.add('shown');
    btn.classList.toggle('gold', gold);
    return new Promise(res => {
      let done = false;
      const finish = tapped => { if (done) return; done = true; hideTap(); res({tapped}); };
      st.tapResolve = () => finish(true);
      setTimeout(()=>finish(false), timeout);       // the ritual never blocks the cap
    });
  }

  /* THE PACER. Scene deadlines are absolute offsets from the start of the run,
     not "now + ms" — so a scene that runs late is paid for by the scenes after
     it instead of pushing the whole run past its cap. Each beat asks for its
     share of whatever time is actually left. Slow frames, a busy tab, a long
     paint: all absorbed. The 30s and 3s caps are structural, not hopeful. */
  const pace = {
    deadline: 0, weightLeft: 0, cursor: 0,
    runStart(){ this.cursor = performance.now(); },
    scene(ms, totalWeight){
      this.cursor += Math.max(0, ms);
      this.deadline = this.cursor;
      this.weightLeft = totalWeight || 1;
    },
    take(w){
      if (st.skipping) return 1;
      const left = Math.max(0, this.deadline - performance.now());
      const ms = this.weightLeft > 0 ? left * (w / this.weightLeft) : left;
      this.weightLeft = Math.max(0, this.weightLeft - w);
      return Math.max(1, ms);
    },
    rest(){ return st.skipping ? 0 : Math.max(0, this.deadline - performance.now()); },
    async land(){ const r = this.rest(); if (r > 0) await wait(r); },
  };

  // ------------------------------------------------------------- fighters
  /* A fighter's screen position is always derivable: where its momentum puts
     it, minus whatever knockback it has taken since the last state change.
     Nothing else may write x, which is why the position is trustworthy as a
     read at any random frame. */
  function addFighter(key, svg, home, dir, opts={}){
    const n = addNode('#actorLayer', svg, home, GY);
    /* The element rides on the puppet, read off the body it was drawn with
       rather than passed in beside it — so the creature and its material can
       never disagree about what it is made of, which is what the dodge
       signature and the defeat image both key on. */
    const f = { key, node: n, home, dir, mom:'EVEN', kb:0, scale: opts.scale || 1, min:0, max:960,
                element: (n.dataset && n.dataset.el) || null,
                // rig state: where it is, where it is going, and on which frames
                cur:null, from:null, to:null, f0:0, fdur:1,
                shownX: home, strideAnchor: rig.frame, leanHist: [0],
                /* The radius's own clock, per fighter, and deliberately
                   incommensurate: `rk` is the rate multiplier and `rphase` the
                   offset, so r closes and opens independently between the two
                   of them and never in sync with the commit schedule. Equal and
                   opposite motion reads as a mechanism, not as two animals. */
                rk: key === 'player' ? 1.00 : 1.43,
                rphase: key === 'player' ? 0.0 : 2.1,
                seed: (key === 'player' ? 11 : 47) + Math.round(home) % 97 };
    st.fighters[key] = f; st.actors[key] = n;
    bound(f);
    f.cur = poseOf(f); f.from = Object.assign({}, f.cur); f.to = Object.assign({}, f.cur);
    f.node.dataset.mom = f.mom;
    renderFighter(f, rig.frame);
    return f;
  }
  // A fighter may never be pushed outside the band the viewer can actually see.
  function bound(f){
    const half = 68 * f.scale;
    f.home = f.dir > 0 ? PX : RX;
    f.min = st.band[0] + half;
    f.max = st.band[1] - half;
    if (f.min > f.max) f.min = f.max = (st.band[0] + st.band[1]) / 2;
  }

  /* ==================================================================
     THE RING SPACE (v3.7)

     WHAT THIS REPLACES, precisely. Every fighter used to own a `home` — PX or
     RX, a mark on the ground — and momentum wrote world-x relative to it. Two
     bodies facing each other across a fixed line, with the only motion in frame
     running in and out along that line. A fixed camera plus a fixed axis is
     pacing, and pacing between attacks is what a turn-based game looks like
     while it waits for input. No amount of juice on the commits was ever going
     to fix the spaces between them.

     WHAT IT IS NOW. Nothing is authored as "move left". The axis rotates, the
     centre drifts toward whoever is losing ground, the radius breathes on a
     clock of its own, and the two fighters never share a rate, a curve or a
     phase. `home` survives in exactly one place — the set pieces (the opener,
     the walkout, the confrontation frame, the Vault) still stage bodies at
     marks, because a presentation beat is staged rather than fought.
     ================================================================== */

  /* Where the shared centre sits on screen, and the clamp is the camera note's:
     "if the fight can walk out of frame, the drift rate is too slow or the
     frame is too tight." A quarter of the arena either way is the doc's own
     scale for "held in one half of the arena". */
  function ringMid(){ return (st.band[0] + st.band[1]) / 2; }
  function ringClampC(){
    const S = C.ringSpace, mid = ringMid(), r = S.centre.range * st.k;
    st.ring.cx = clamp(st.ring.cx, mid - r, mid + r);
  }
  /* A fighter's radius from the shared centre. `momentum.advance` is not
     reinterpreted so much as finally read correctly: it always meant "ground
     given or taken", which is a DISTANCE, and it was only ever being written to
     world-x because there was nowhere else to put it. Ground given opens the
     radius; ground taken closes it. Knockback rides on top and — this is the
     whole of NO RESET — it is never zeroed by a state change. */
  function ringR(f){
    const S = C.ringSpace, m = C.momentum.states[f.mom] || C.momentum.states.EVEN;
    /* `st.approach` is the range telegraph: positive opens the envelope ahead of
       a discharge, negative closes it ahead of a swing. It goes in at the same
       level as `advance` because it is the same kind of quantity — ground taken
       or given on purpose — and it clamps against the same envelope, so no bias
       can push a fighter outside the ring the fight is held in. */
    const base = S.radius.base + (st.approach || 0) - m.advance * 0.42 + f.kb * 0.5;
    const br = 1 + Math.sin(st.ring.t * S.breathe.rate * f.rk + f.rphase) * S.breathe.amp;
    return clamp(base * br, S.radius.min, S.radius.max) * st.k;
  }
  // Each fighter's own angle, derived from the axis. Never equal rates: the
  // rival's is the axis plus pi plus a drifting delta, so d(theta)/dt differs
  // between them by d(delta)/dt at every instant. Mirroring is forbidden.
  const ringTheta = f => f.key === 'player' ? st.ring.phi
                                            : st.ring.phi + Math.PI + st.ring.delta;
  const ringX     = f => st.ring.cx + Math.cos(ringTheta(f)) * ringR(f);
  /* DEPTH IS MANDATORY. An orbit on a three-quarter frame produces near and
     far, so this is what carries the frame: vertical offset, scale, and the
     Z-ORDER swap that lets the fighters genuinely pass each other. Normalised
     to -1..1 so the config values read as fractions. */
  const ringDepth = f => Math.sin(ringTheta(f)) * ringR(f) / (C.ringSpace.radius.max * st.k);

  /* Reset the ring for a fresh staging. Called at the top of every rung, so a
     fight always BEGINS with the player on the left and the centre in the
     middle — the walkout re-establishes the stage, and territory accumulates
     across the commits of a rung rather than across the whole run. Inside a
     rung nothing resets, which is the point of the section. */
  function ringReset(){
    st.ring.cx = ringMid();
    st.ring.phi = Math.PI;          // player left, rival right
    st.ring.delta = 0;
    // ...and the range telegraph goes with it: a fight begins at its own
    // distance, not at the one the last rung's final commit asked for.
    st.approach = 0;
    const p = P(), r = R();
    if (p){ p.kb = 0; p.rk = 1.00; p.rphase = 0.0; }
    if (r){ r.kb = 0; r.rk = 1.43; r.rphase = 2.1; }   // never the same r curve
    ringClampC();
    stageReset();
  }

  /* EVERY FIGHT STARTS ON ITS OWN SIDE, and this is the fix for the one thing
     the ring space genuinely broke.

     Inside a rung the fighters cross, which is the point — the axis rotates and
     they pass each other in depth. But `f.dir` is derived from the crossing,
     and `bound()` derives a fighter's HOME from its `dir`. So a rung that ended
     with the player on the right left the player's home at RX — and the next
     rung's walkout drops the rival's box at RX too, on top of it. The player
     was not "stuck behind" the rival by accident of z-order; both bodies were
     being staged at the same mark.

     Two things make this the right fix rather than a patch. The staging beats —
     the walkout, the confrontation frame — read the home marks, so the reset
     has to happen BEFORE them, not after. And the reset is legal exactly where
     `ringReset` already is: a new rival's box lands, the stage is
     re-established, and territory starts again from the middle. Inside a rung
     nothing resets, which is what NO RESET actually asks for. */
  function stageReset(){
    const p = P(), r = R();
    // a staging beat re-establishes the marks, so nothing may still be holding
    // a facing from a commit that was interrupted on its way to an Aftermath
    st.faceLock = false;
    /* `circling` and `still` are cleared here because nothing else clears
       them. A Circle sets `circling` and the Tell simply begins; a Tell sets
       `still` and the Clash simply begins. Neither flag is wrong during a
       fight, and both are wrong the moment a staging beat needs the bodies on
       their marks. */
    if (p){ p.dir =  1; p.kb = 0; p.lunge = 0; p.circling = false; p.still = false; bound(p); place(p, 1); }
    if (r){ r.dir = -1; r.kb = 0; r.lunge = 0; r.circling = false; r.still = false; bound(r); place(r, 1); }
    // ...and no charge survives a staging beat, for the same reason no facing
    // and no `circling` flag does: a walkout re-establishes the stage, and a
    // core still burning through one belongs to a fight that is already over.
    if (st.core && st.core.node){ try { st.core.node.remove(); } catch(e){} st.core = null; }
    /* ...and the z-order goes back to canonical with them, because the depth
       swap leaves whichever body was upstage parked at the front of the layer.
       Player behind, rival in front, which is where they sat before v3.7. */
    const layer = st.stage && st.stage.querySelector('#actorLayer');
    if (layer && p && r && p.node.parentNode === layer && r.node.parentNode === layer)
      layer.insertBefore(p.node, r.node);
    st.ring.z = 0;
  }

  /* One frame of the ring. Called from the rig's own loop, so it rides the same
     wall clock everything else does and a throttled tab cannot desynchronise
     the orbit from the timeline. */
  function ringStep(dt){
    const S = C.ringSpace, sec = dt / 1000;
    st.ring.t += sec;
    /* FREEZE ORBIT — the debug toggle that reproduces the v3 bug on demand.
       Theta, r and C are pinned, which puts two fighters back on a fixed line
       across a fixed centre. It is the fastest way to see what this section
       actually bought, and it is why it exists rather than a paragraph. */
    if (C.live.freezeOrbit) return;
    /* THE STOP FREEZES THE RING TOO. "Everything that was moving stops moving"
       has to include the thing that moves the most, or the Tell's stillness is
       a posture held over a fight that is still travelling — and the same is
       true of an abort, which has to be frame-identical to a Tell until the
       ring window or it stops being one. */
    if (st.ring.hold) return;
    const p = P(), r = R();
    if (!p || !r) return;
    /* THE LUNGE AND THE KNOCKBACK RECOVER, and only while circling. During an
       Aftermath both are held — that is the beat where the striker standing
       over the body it hit has to read, and where the struck body has to stay
       where it was put. Once the fighters start working for position again the
       two dissolve, which is a stance being recovered rather than a position
       being handed back. */
    [p, r].forEach(f => {
      if (!f.circling) return;
      const k = Math.pow(C.ringSpace.recover, sec);
      if (f.lunge) f.lunge = Math.abs(f.lunge) < 0.6 ? 0 : f.lunge * k;
      if (f.kb)    f.kb    = Math.abs(f.kb)    < 0.6 ? 0 : f.kb * k;
    });
    const ps = S.states[p.mom] || S.states.EVEN;
    const rs = S.states[r.mom] || S.states.EVEN;

    /* THE AXIS ROTATES. The rate is weighted toward the SLOWER of the two,
       because it takes two to circle: a fighter that has stopped circling drags
       the axis to a halt whatever its opponent is doing. That is not a
       compromise, it is the BUCKLING row doing its job — failure to circle is
       the visual language of losing, and a floor that applied there would
       delete the one read this table exists to draw.

       Everywhere else the floor applies and guarantees acceptance test 24:
       at least 90 degrees of axis rotation per second of Circle. */
    const lo = Math.min(ps.spin, rs.spin), mean = (ps.spin + rs.spin) / 2;
    let rate = lo * 0.6 + mean * 0.4;
    if (lo > 0.4) rate = Math.max(S.minSweepPerSec, rate);
    st.ring.phi += rate * sec;

    /* THE INSIDE LINE. Delta is where "cuts the circle to take the inside line"
       versus "circles the long way round the perimeter" actually lives: a
       dominant fighter pulls the rival off diametrically-opposite and shortens
       its own arc. Eased, never snapped, and it is also the second reason the
       two angular rates can never be equal. */
    const want = (ps.inside - rs.inside) * 0.42;
    st.ring.delta += (want - st.ring.delta) * Math.min(1, sec * 1.6);

    /* THE CENTRE DRIFTS toward whoever is yielding, so the fight travels and
       WHOEVER IS WINNING TAKES GROUND. Territory is the second scoreboard and
       the only one that accumulates: distance resets every time somebody is
       hit, and this does not. */
    const px = ringX(p), rx = ringX(r);
    const toR = Math.sign(rx - px) || 1;
    st.ring.cx += (ps.drive * toR - rs.drive * toR) * S.centre.ease * 26 * sec;
    ringClampC();

    /* Z-ORDER, and it is the whole of what makes the frame read as three-
       quarter rather than flat: whoever is upstage renders BEHIND. Swapped only
       when the sign actually flips, because reordering DOM nodes every frame is
       both wasteful and a way to lose a running animation. */
    if (S.zSwap){
      const z = ringDepth(p) > ringDepth(r) ? 1 : -1;
      if (z !== st.ring.z){
        st.ring.z = z;
        const layer = st.stage && st.stage.querySelector('#actorLayer');
        const back = z > 0 ? p.node : r.node;
        if (layer && back && back.parentNode === layer) layer.insertBefore(back, layer.firstChild);
      }
    }
    /* FACING IS CONTINUOUS, so it turns throughout rather than at the ends of a
       traverse — and because the fighters now genuinely cross, it has to flip
       at the crossing or a body ends up walking backwards. */
    /* OFF THE DRAWN POSITIONS, not the ring targets, and never mid-commit.
       `ringX` is where a body is going; `shownX` is where the rig has actually
       drawn it, and a traverse puts those a long way apart. Reading the targets
       meant a fighter could turn to face a creature that was still on the other
       side of it, and stand there swinging backwards until the body caught up.
       And `faceLock` holds the answer still from the Tell to the Aftermath: a
       committed strike must not reverse its own facing halfway through, which
       is exactly what a lunge past the opponent's centre used to make it do. */
    if (S.faceFlip && !st.faceLock){
      const gap = r.shownX - p.shownX;
      if (Math.abs(gap) > (S.faceHyst || 0)){
        p.dir = gap >= 0 ? 1 : -1;
        r.dir = -p.dir;
      }
    }
  }

  /* THE CLINCH. r reaches zero: bodies meet, shove, no hit juice, no ring,
     nothing at stake. It breaks with both fighters pushing off, and THE PUSH
     RESETS THETA FOR BOTH — which is the cheapest way there is to make the
     orbit itself irregular, and the only contact in the game that carries
     neither consequence nor information. */
  async function clinch(ms){
    const p = P(), r = R();
    if (!p || !r || st.skipping) return;
    const S = C.ringSpace;
    p.kb -= 92; r.kb -= 92;                    // radius collapses toward contact
    await wait(ms);
    p.kb += 92; r.kb += 92;
    // the push off, and the reason the clinch is in this section at all
    st.ring.phi += S.clinch.push * (st.ring.t % 2 < 1 ? 1 : -1);
    st.ring.delta *= -0.5;
    // both give ground: -x is backward for each of them in its own mirrored
    // space, so the pair separates. `* f.dir` sent one of them forward.
    [p, r].forEach(f => anim(animEl(f.node), [
      { transform:'translateX(0px)' },
      { transform:'translateX(-14px)', offset:0.4 },
      { transform:'translateX(0px)' },
    ], Math.max(1, scale(220)), { fill:'none' }));
  }
  /* A missing fighter must never abort a run. Scenes can be re-entered, a
     lead can be swapped out between a beat being scheduled and it firing, and
     a thrown TypeError here kills the whole timeline mid-fight — which is
     exactly what it did. Absent puppet, sensible default, run continues. */
  /* WHERE A FIGHTER IS. Under the ring this is a read off the polar state, not
     an offset from a mark on the ground — and every consumer of it (the
     telegraph ring's placement, the scuffle dust, the fx anchors) follows the
     orbit for free because they all ask this one question.

     `st.ring.live` is false during the set pieces — the opener, the walkout,
     the confrontation frame, the Vault's staging — where bodies are placed at
     marks because a presentation beat is staged rather than fought. Those keep
     the old home-plus-advance read, which is exactly right for them. */
  function fx_(f){
    if (!f) return 480;
    if (st.ring.live) return clamp(ringX(f) + (f.lunge || 0), f.min, f.max);
    const s = C.momentum.states[f.mom] || C.momentum.states.EVEN;
    // ground given and knockback taken compress with the frame, so the whole
    // choreography stays proportional instead of running off the edge
    return clamp(f.home + (s.advance - f.kb) * st.k * f.dir, f.min, f.max);
  }

  /* WHERE A BODY IS *DRAWN*, which during a fast beat is not where it is going.
     `fx_` is the rig's TARGET; the rig eases toward it over several frames, and
     a strike plus a knockback is exactly the moment those two diverge most. An
     impact anchored to the target lands in empty air next to the creature it is
     supposed to be happening to — and an impact that is not on a body cannot
     say which body it is happening to. Everything the Clash draws between the
     two fighters is anchored here instead. */
  const drawnX = f => (f && f.shownX != null) ? f.shownX : fx_(f);

  /* Re-derive the staging from the band of the viewBox that is on screen.
     On a 16:9 pane this returns exactly the authored PX=290 / RX=668. */
  function refit(){
    const el = st.stage && st.stage.querySelector('#arenaSvg');
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const s = Math.max(r.width / 960, r.height / 540);       // "slice" covers
    const visW = Math.min(960, r.width / s);
    const x0 = (960 - visW) / 2, x1 = x0 + visW, mid = (x0 + x1) / 2;
    const spread = Math.min(SPREAD, visW * 0.46);
    st.band = [x0, x1];
    st.k = spread / SPREAD;
    PX = mid - spread / 2;
    RX = mid + spread / 2;
    Object.keys(st.fighters).forEach(k => { bound(st.fighters[k]); place(st.fighters[k], 0); });
  }
  /* ==================================================================
     THE STOP-MOTION RIG
     One frame grid. Everything obeys it. Nothing is interpolated by the
     browser any more — every fighter transform is written by hand, on a
     frame, by this loop.

     The previous pass failed because it MIXED continuous CSS transitions
     with hard steps() snaps: half the motion was smooth and half was
     stepped, at different moments, which reads as stuttering rather than
     as a medium. Stop motion is not arbitrary snapping. It is the most
     disciplined animation there is — one rate, obeyed absolutely, with
     craft laid on top.
     ================================================================== */
  const rig = {
    frame: 0, acc: 0, t: 0, last: 0, raf: null, timer: null, running: false,
    start(){
      this.frame = 0; this.acc = 0; this.t = 0; this.last = performance.now();
      if (this.running) return;
      this.running = true;
      this.raf = requestAnimationFrame(t => this.loop(t));
      /* rAF is PAUSED outright in a backgrounded tab, and a rig that stops
         rendering leaves the puppets frozen mid-run while the async timeline
         walks on without them — then they teleport when the tab returns. The
         interval is the understudy: whichever fires, `advance` works off
         wall-clock, so they cannot double-count each other. */
      this.timer = setInterval(() => this.advance(performance.now()), 1000 / C.stopmo.base);
    },
    stop(){
      this.running = false;
      if (this.raf) cancelAnimationFrame(this.raf);
      if (this.timer) clearInterval(this.timer);
      this.raf = this.timer = null;
    },
    loop(now){
      if (!this.running) return;
      this.raf = requestAnimationFrame(t => this.loop(t));
      this.advance(now);
    },
    advance(now){
      if (!this.running) return;
      const dt = Math.min(200, Math.max(0, now - this.last));   // never catch up in a lurch
      this.last = now;
      // A true freeze holds the frame. The grid stops; nothing ages.
      if (st.frozen > 0) return;
      this.t += dt;                 // continuous clock — footwork rides this
      this.acc += dt;
      /* The ring and the camera advance on the rig's clock, not on their own,
         so a throttled tab cannot desynchronise the orbit from the timeline —
         which is the failure the understudy interval above exists to prevent
         and would otherwise have reintroduced one layer down. */
      if (st.ring.live) ringStep(dt);
      camStep(now);
      const step = 1000 / C.stopmo.base;
      let moved = false;
      while (this.acc >= step){ this.acc -= step; this.frame++; moved = true; }
      /* Outside a rush we render EVERY rAF tick, so movement is as smooth as
         the display allows. Inside one, only on frame boundaries — that is
         where the medium lives, and it is the only place it belongs. */
      if (moved || !st.stepped) render(this.frame);
    },
  };

  // deterministic sub-pixel noise — the animator's fingerprints between frames
  function boilNoise(frame, seed, salt){
    let h = (frame * 374761393 + seed * 668265263 + salt * 2246822519) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (((h ^ (h >>> 16)) >>> 0) / 4294967296) * 2 - 1;   // -1..1
  }

  /* CUSHIONING. A pose does not arrive at constant speed and stop dead — the
     frame spacing tightens as it lands, which is what makes the pose read.
     Slow out of the last pose, slow into the next. */
  const cushion = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);

  function poseOf(f){
    const s = C.momentum.states[f.mom];
    return { x: fx_(f), lean: s.lean, rise: s.rise, sx: s.sx, sy: s.sy };
  }
  const lerp = (a, b, t) => a + (b - a) * t;

  /* Retarget: the fighter is now heading somewhere else. It starts from
     wherever it has actually been RENDERED, so a retarget mid-move never
     teleports — the classic animator's rule of never breaking an arc. */
  function retarget(f, ms){
    if (!f.cur) f.cur = poseOf(f);
    f.from = Object.assign({}, f.cur);
    f.to = poseOf(f);
    f.f0 = rig.frame;
    f.fdur = C.frames(Math.max(1, ms == null ? C.poseMs : ms));
  }

  function renderFighter(f, frame){
    const cfg = C.stopmo, fc = C.film();
    const k = f.fdur > 0 ? Math.min(1, Math.max(0, (frame - f.f0) / f.fdur)) : 1;
    const e = cushion(k);

    const p = {
      x:    lerp(f.from.x,    f.to.x,    e),
      lean: lerp(f.from.lean, f.to.lean, e),
      rise: lerp(f.from.rise, f.to.rise, e),
      sx:   lerp(f.from.sx,   f.to.sx,   e),
      sy:   lerp(f.from.sy,   f.to.sy,   e),
    };

    /* ARC. Travel bows off the straight line — a puppet's mass swings, it
       does not slide along a rail. Peaks at the middle of the move. */
    const travel = Math.abs(f.to.x - f.from.x);
    if (travel > 6) p.rise -= Math.sin(e * Math.PI) * travel * 0.045 * cfg.arc;

    f.cur = Object.assign({}, p);      // the clean pose, before texture

    /* ORBIT, DO NOT OSCILLATE. "Moving back and forth" is what a Circle looks
       like when it is animated as translation along one axis, and that is
       exactly what this used to be: one sine on x, which is a ping-pong.

       Both fighters now move on ARCS around a shared centre — angle and
       distance adjusting continuously, the arc's depth reading as a vertical
       offset and a little scale, so the path bows through the frame instead of
       sliding along a rail. The sweep never reaches the far side, so the centre
       is a point they circle and not a line they cross, and they always face
       each other without anything having to flip. */
    const t = rig.t / 1000;          // continuous, so locomotion never steps
    let depth = 0;
    /* THE HOLD, INSIDE A TELL OR AN ABORT, and it is checked BEFORE `circling`
       rather than after it. That ordering is the fix for a bug the ring space
       exposed: `circling` is not cleared when a Circle ends — the Tell simply
       begins — so a stillness branch sitting in the `else` was never reached
       and the locomotion kept running underneath a phase whose entire power is
       that motion has stopped.

       The position is still READ off the ring, because the ring is frozen too
       (see `stillness`) and a frozen ring is a constant. What is dropped is
       everything voluntary: the bob, the roll, the breathing. The only motion
       left in the frame is the flinch's tremor and the ring's pulse. */
    /* Both of these read `fx_` rather than `ringX` directly, and that is not a
       tidiness point — it is the fix for the bug the playtest found. `circling`
       is set when a Circle begins and is never cleared when one ends (the Tell
       simply starts), so after a rung both bodies still carry it. Reading the
       ring unconditionally therefore kept drawing them at their polar positions
       straight through the next walkout, ignoring the home marks entirely: the
       player stayed wherever the last fight left it, which on a rung that ended
       with the two of them crossed is on top of the rival. `fx_` asks whether
       the ring is live and falls back to the marks when it is not. */
    if (f.still){
      p.x   = fx_(f);
      if (st.ring.live){
        depth = ringDepth(f);
        p.rise -= depth * C.ringSpace.depth * 100;
      }
    }
    /* THE RING IS LIVE FOR THE WHOLE FIGHT, not just inside a Circle — and
       getting this wrong is what made a playtester report that the fighters
       freeze in place at the first rung. They very nearly did.

       `circling` is true only inside `circleFor`, so gating the orbit on it
       meant the bodies stopped translating the instant a Circle ended and did
       not move again until the next one began. Measured at rung 1, where v3.7's
       schedule puts the two shortest Circles in the game: **360ms of orbit in a
       4.9-second rung.** Everything else — 1.6s of Tell hold, 1.7s of impact
       stop, 1.6s of Aftermath — had them standing perfectly still. The rung
       whose whole job is "winning has to look like something, fast" was four
       fifths statue.

       The Aftermath is not a pause between fights; it is part of one. The
       attacker is overextended and off the inside line, the defender is turned
       out of position, and both are working their way back — which is motion,
       and it is the motion NO RESET is actually about. Only the Tell and the
       Clash are stillness: motion, stillness, violence, and then motion again.

       So the orbit runs whenever the ring is live and nothing is holding the
       frame. `f.circling` survives as the gate on the FOOTWORK — the bob and
       the roll are scuffle texture and belong to a Circle — but not on the
       locomotion. */
    else if (st.ring.live && !st.stepped){
      /* THE RING SPACE WRITES THE POSITION DIRECTLY, and it does not go through
         the from/to lerp. The lerp exists so a POSTURE arrives rather than
         drifting; the orbit is already continuous, so running it through a
         tween aimed at a stale target is how you get a body that lags its own
         path. Posture still tweens; position is read live.

         This is also where the old code's bug was visible in one line: it added
         a per-fighter sine to a home-relative x. Two arcs around two private
         pivots is not a ring, and no camera move can make it look like one. */
      const w = C.footwork;
      const damp = f.mom === 'BUCKLING' ? 0.45 : f.mom === 'PRESSURED' ? 0.72 : 1;
      p.x     = fx_(f);
      depth   = ringDepth(f);
      p.rise -= depth * C.ringSpace.depth * 100;       // upstage reads as higher...
      /* The footwork bob and roll ARE gated on `circling`, because they are
         scuffle texture — the busy working-for-position read — and an Aftermath
         should look like recovery rather than like more sparring. The
         locomotion underneath them runs either way. */
      if (f.circling){
        p.rise += Math.sin(t * w.rate * 1.9 + f.seed) * w.bob * damp;
        p.lean += Math.sin(t * w.rate * 0.8 + f.seed * 1.3) * w.roll * damp;
      } else {
        // recovering: slower, heavier, and it still breathes
        p.rise += Math.sin(t * 2.1 + f.seed) * 0.9 * cfg.breathe * damp;
        p.lean += Math.sin(t * 1.3 + f.seed * 1.7) * 0.4 * cfg.breathe * damp;
      }
    }
    /* MOVING HOLD — for everything outside a live fight: the opener, the
       walkout, the confrontation frame, the receipt. A settled puppet still
       breathes, because a dead hold reads as a broken projector. */
    else if (k >= 1 && f.mom !== 'DOWN'){
      const amp = (f.mom === 'BUCKLING' ? 1.5 : f.mom === 'PRESSURED' ? 1.0 : 0.75) * cfg.breathe;
      p.rise += Math.sin(t * 2.1 + f.seed) * amp;
      p.lean += Math.sin(t * 1.3 + f.seed * 1.7) * amp * 0.35;
      p.x    += Math.sin(t * 0.9 + f.seed * 2.3) * amp * 0.5;
    }

    // the emotional state, written on top of the momentum pose
    if (f.fl) applyFlinch(f, p, frame, t);
    p.x = clamp(p.x, f.min, f.max);

    /* THE MEDIUM IS APPLIED TO THE STRIKE, NOT TO THE WALKING.
       Quantizing everything put the footwork on twos as well, and a body
       shuffling back and forth on 12fps reads as broken rather than as
       stylized. So the frame grid, the boil and the stride hold now apply
       only inside a rush — where they make the blow land like a drawn
       frame — and locomotion renders every frame, perfectly smooth. */
    const stepped = st.stepped && !f.circling;
    if (stepped){
      const b = cfg.boil * fc.boil;
      p.x    += boilNoise(frame, f.seed, 1) * 0.42 * b;
      p.rise += boilNoise(frame, f.seed, 2) * 0.42 * b;
      p.lean += boilNoise(frame, f.seed, 3) * 0.20 * b;
    }
    const dx = p.x - f.shownX;
    const fast = Math.abs(dx) > cfg.fastPx;
    const stride = (!stepped || fast) ? 1 : fc.stride;
    if (stride > 1 && ((frame - f.strideAnchor) % stride) !== 0) return;  // hold this frame
    if (fast) f.strideAnchor = frame;

    /* THE SMEAR FRAME — for attacks, and only for attacks.
       This used to ramp from zero, so breathing and circling were permanently
       soft and every enemy looked out of focus all the time. Now nothing
       smears until it crosses `smearMin` in a single frame, which only a
       committed attack ever does. And it is a STRETCH, the drawn smear frame
       of cartoon animation — the photographic blur read as mud, so it is off
       by default. */
    const over = Math.abs(dx) - cfg.smearMin;
    const sm = over <= 0 ? 0
      : Math.min(1, over / (cfg.smearMin * 1.6)) * cfg.smear * fc.smear;
    const smearEl = f.node.querySelector('.idle');
    if (smearEl){
      if (sm > 0.02){
        const stretch = 1 + sm * cfg.stretchMax;
        smearEl.style.transform = `scale(${stretch.toFixed(3)}, ${(1 / Math.sqrt(stretch)).toFixed(3)})`;
        smearEl.style.filter = (cfg.blurMax > 0 && vfx()) ? `blur(${(sm * cfg.blurMax).toFixed(2)}px)` : '';
      } else if (smearEl.style.transform || smearEl.style.filter){
        smearEl.style.transform = ''; smearEl.style.filter = '';
      }
    }

    /* Write the frame. The rest of the depth reads as SCALE, and between that,
       the vertical offset and the z-order swap in ringStep, a flat side-on
       drawing reads as a three-quarter frame without a single body being
       redrawn. What the doc actually needs from three-quarter is that an orbit
       produce near and far — "if both fighters' feet hold the same screen line
       for a whole Circle, the ring is fake no matter what the code is doing" —
       and offset plus scale plus overlap is exactly that. */
    const dsc = f.scale * (1 - depth * C.ringSpace.persp * 100);
    f.node.style.transform =
      `translate(${p.x.toFixed(2)}px, ${GY}px) scale(${dsc.toFixed(3)})` +
      (f.dir < 0 ? ' scaleX(-1)' : '');
    const stance = stanceEl(f.node);
    if (stance) stance.style.transform =
      `translate(0px, ${p.rise.toFixed(2)}px) rotate(${p.lean.toFixed(2)}deg) scale(${p.sx.toFixed(3)}, ${p.sy.toFixed(3)})`;

    /* FOLLOW-THROUGH. Secondary mass lags the body by a couple of frames and
       catches up after it stops — the guard swings a beat behind the torso. */
    /* THE CARET RIDES THE PLAYER, every frame, off the same numbers the body
       is drawn from — so it cannot lag, drift or be left behind when the
       fighters cross. It takes the depth scale with them (a body upstage gets a
       smaller caret) but none of the posture: it must not bob, lean or squash,
       because a mark that performs is a mark that reads as a signal. */
    if (f.key === 'player') markAt(p.x, p.rise, dsc);

    f.leanHist.push(p.lean);
    if (f.leanHist.length > 12) f.leanHist.shift();
    const lagged = f.leanHist[Math.max(0, f.leanHist.length - 1 - cfg.lagFrames)];
    const guard = f.node.querySelector('.guardG');
    if (guard) guard.style.transform = `rotate(${((lagged - p.lean) * 0.75).toFixed(2)}deg)`;

    f.shownX = p.x;
  }

  function render(frame){
    Object.keys(st.fighters).forEach(k => {
      const f = st.fighters[k];
      if (f && f.node && f.node.isConnected) renderFighter(f, frame);
    });
  }

  /* ==================================================================
     THE FLINCH — the stakes, carried by the bodies.

     The ring is UI. A viewer who never looks at it should still read
     everything it says, so both fighters react emotionally to a commit while
     it winds up, in sync with the ring.

     THE RULE THAT KEEPS IT LEGAL: a reaction may express the THREAT and the
     INTENT, never the RESULT. It is a function of momentum state, ring colour
     and position — all band-blind — and never of band. Rung 2's red runs the
     same QUAKE-into-RALLY for band 3 and band 4; one of them dies at the Clash
     anyway. A Boxling that rallies and falls is a better story than one that
     only rallies when it is going to win.

     It is written by the RIG, as a delta on top of the momentum pose, so it
     lands on the same frame grid as everything else and the state underneath
     stays readable. It adds no information channel — it makes the momentum
     state legible from across the room.
     ================================================================== */
  let flSeq = 0;
  function applyFlinch(f, p, frame, t){
    const fl = f.fl, cfg = C.flinch, pose = cfg.poses[fl.state];
    if (!pose) return;
    const kk = fl.fdur > 0 ? Math.min(1, Math.max(0, (frame - fl.f0) / fl.fdur)) : 1;
    const e = cushion(kk) * fl.gain;
    p.lean += pose.lean * e;
    p.rise += pose.rise * e;
    p.sx   *= 1 + (pose.sx - 1) * e;
    p.sy   *= 1 + (pose.sy - 1) * e;
    p.x    += pose.drift * f.dir * e * st.k;
    /* The tremor and the ring's pulse share one clock, so the body and the
       telegraph are visibly the same event rather than two things happening
       at once. */
    const tr = cfg.tremor, amp = pose.tremor * tr.amp * fl.gain;
    if (amp > 0.02){
      const w = t * tr.hz * Math.PI * 2;
      p.x    += Math.sin(w) * amp * 1.10;
      p.rise += Math.sin(w * 1.37 + f.seed) * amp * 0.85;
      p.lean += Math.sin(w * 0.91 + f.seed) * amp * 0.55;
    }
  }
  function setFlinch(f, state, ms, gain){
    if (!f || !state || !C.flinch.poses[state]) return null;
    const id = ++flSeq;
    f.fl = { state, id, gain: gain == null ? 1 : gain,
             f0: rig.frame, fdur: C.frames(Math.max(1, ms)) };
    setEx(f.node, C.flinch.poses[state].ex);
    return id;
  }
  /* `id` makes a clear idempotent: a feint's own timer must never wipe the
     Tell that started while it was still counting down. */
  function clearFlinch(f, id){
    if (!f || !f.fl) return;
    if (id != null && f.fl.id !== id) return;
    f.fl = null;
    if (f.node && f.node.isConnected && C.momentum.states[f.mom])
      setEx(f.node, C.momentum.states[f.mom].ex);
  }

  /* ==================================================================
     THE ELEMENTAL DEFEAT — the KO animation as the lesson.

     Each arm of the ring has exactly one losing image, and these images are
     how the game teaches its own rules without a word of text:

       FIRE beats ICE     the ICE Boxling melts — facets round off, the
                          silhouette loses its angles, it slumps and puddles.
       ICE beats WATER    the WATER Boxling freezes solid mid-motion, opaque
                          and rigid in one beat, then shatters.
       WATER beats FIRE   the FIRE Boxling gutters out — the internal light
                          dies from the extremities inward, then steam.

     A player who watches one of these has learned that arm permanently, so
     three arms means the whole system is taught in three losses — which a
     volume user sees inside their first session.

     RESERVED FOR COUNTER PAIRINGS. Mirror and neutral defeats take the
     ordinary KO from the momentum system: DOWN, on the ground, no
     transformation. If every death were elemental these would stop being the
     lesson and start being the death animation. It rides inside the Aftermath
     that already exists and buys the run nothing. */
  function elementalDefeat(f, kind, ms){
    if (!f || !kind || !vfx() || st.skipping) return;
    const dur = Math.max(C.defeat.minMs, Math.min(C.defeat.ms, ms || C.defeat.ms));
    const art = kind === 'melt' ? A.fx.melt() : kind === 'freeze' ? A.fx.freeze() : A.fx.gutter();
    const n = fxAt(art, fx_(f), GY, dur + 900);
    if (!n) return;
    /* The transformation happens TO the body, so the body goes with it: it
       stops being a Boxling in the same beat the image says it stopped. */
    f.node.classList.add('defeated', 'defeat-' + kind);
    const idle = f.node.querySelector('.idle');
    if (idle) anim(idle, [{ opacity:1 }, { opacity: kind === 'freeze' ? 0 : 0.12 }],
                   Math.max(1, dur * 0.6), { fill:'forwards' });
    anim(animEl(n), [
      { opacity:0, transform:'scale(0.94)' },
      { opacity:1, transform:'scale(1)', offset:0.18 },
      { opacity:1, transform:'scale(1)', offset:0.72 },
      { opacity:0, transform:'scale(1.04)' },
    ], Math.max(1, dur), { fill:'forwards' });
  }

  /* SCALE TO STAKES. White gets a flicker, amber a clear single note, red and
     gold the full two-beat arc. If every Tell gets a big emotional performance,
     none of them do. Which note plays is read off the script table, which is
     position-only — never band. */
  /* THE ROLE CUE. Two marks, drawn as opposites, so a viewer knows within a
     frame which body is about to swing and which one is about to be hit.

     THE CHARGE gathers: chevrons converging on the attacker, the whole mark
     shrinking toward the body over the Tell. THE BRACE spreads: arcs pushing
     outward along the ground under the defender, the whole mark growing as the
     weight goes down. Converging against spreading is the read, and it survives
     greyscale, silhouette and a viewer who never looks at the ring.

     It scales on the same stakes ladder the flinch uses — a scuffle gets
     nothing, an amber a clear statement, a red the full one — because if every
     contact carried a role cue the Tell's would stop being an event. */
  function roleCue(cm, a, d, ms){
    if (!vfx() || st.skipping || ms < 120) return;
    const R = C.flinch.role;
    const gain = C.flinch.intensity[cm.ring] != null ? C.flinch.intensity[cm.ring] : 0.7;
    if (gain < R.minGain) return;
    const life = ms + 260;
    if (a){
      const g = fxAt(A.fx.charge(R.charge.chevrons, R.charge.reach), fx_(a), GY + R.charge.rise, life);
      if (g) anim(animEl(g), [
        { transform:`scale(${(1.34 * gain).toFixed(2)})`, opacity:0 },
        { transform:`scale(${(1.02 * gain).toFixed(2)})`, opacity:0.95, offset:0.42 },
        // ...and it CLOSES on the body, which is what "powering up" looks like
        { transform:`scale(${(0.58 * gain).toFixed(2)})`, opacity:0.9 },
      ], Math.max(1, ms), { easing:'cubic-bezier(.3,0,.2,1)', fill:'forwards' });
      /* ...AND ON A RANGED COMMIT THE CHEVRONS CONVERGE INTO SOMETHING.
         The mark above already gathers inward on the attacker and already reads
         as powering up — it just never gathered into anything, so it was a
         label for a role rather than a picture of a mechanism. Here it is the
         mechanism: the chevrons close, a core appears where they closed, and
         that core is the object that leaves the body at the release.

         It obeys the freeze. It grows IN PLACE, on the attacker's own body, and
         contributes not one pixel of approach — the whole of v5's correction is
         that a Tell may not be two shapes speeding up at each other, and a
         thing getting brighter while nothing travels is the purest form of
         stillness-with-a-cause the phase has ever had. `dustStrand` exists
         because stillness needs a witness or it reads as a dropped frame; on
         these commits the charge is a far better one.

         It is held with `forwards` and handed to the release, which is what
         fires it. Cleared unconditionally there, so a skipped or interrupted
         commit cannot leave a core burning over the next one. */
      if (C.isRanged(cm)){
        const CR = C.combatRange;
        const core = fxAt(A.fx.chargeCore(a.element || 'fire'),
                          fx_(a), GY + CR.charge.rise * a.scale, ms + 900);
        if (core){
          st.core = { node: core, owner: a };
          anim(animEl(core), [
            { transform:'scale(0.12)', opacity:0 },
            { transform:`scale(${(0.62 * gain).toFixed(2)})`, opacity:0.9, offset:0.45 },
            { transform:`scale(${(1.0 * gain).toFixed(2)})`,  opacity:1 },
          ], Math.max(1, ms), { easing:'cubic-bezier(.4,0,.5,1)', fill:'forwards' });
        }
      }
    }
    if (d){
      const g = fxAt(A.fx.brace(), fx_(d), GY + R.brace.drop, life);
      if (g) anim(animEl(g), [
        { transform:`scale(${(0.5 * gain).toFixed(2)}, ${(0.34 * gain).toFixed(2)})`, opacity:0 },
        { transform:`scale(${(0.92 * gain).toFixed(2)}, ${(0.86 * gain).toFixed(2)})`, opacity:0.95, offset:0.4 },
        // ...and it SPREADS and settles, which is what taking a stance looks like
        { transform:`scale(${(1.12 * gain).toFixed(2)}, ${(1.0 * gain).toFixed(2)})`, opacity:0.85 },
      ], Math.max(1, ms), { easing:'cubic-bezier(.2,.9,.3,1)', fill:'forwards' });
    }
  }

  /* ===================== THE DISCHARGE — "FIRE" =====================
     The ranged release, and it is the exact inverse of the melee one. A melee
     attacker ARRIVES: the body crosses the gap and the gap is the animation. A
     ranged attacker STAYS: the thing it has been gathering since the stop
     leaves it, crosses the gap on its own, and throws the body backward.

     Three marks, in this order, and each one is answering a question the melee
     release answers with the same picture:

       the muzzle   what happened AT the attacker. It throws backward as well as
                    forward, because the whole read is that the body did not go
                    anywhere: half the energy went downrange and half went into
                    the ground under its feet.
       the bolt     what crosses. Deliberately the same silhouette as the melee
                    strike's `thrust` — weight at the front, tail behind — so a
                    viewer taught by four melee commits that THIS SHAPE MEANS A
                    BLOW ARRIVING does not have to be taught anything.
       the recoil   what happens to the body that fired. Same term as the lunge
                    (`f.lunge`), opposite sign, so the ground it gives is
                    inherited by the next Circle by the same mechanism the
                    ground a lunge takes is. That is NO RESET, unchanged: a
                    ranged commit simply leaves the ring open where a melee one
                    leaves it closed.

     TIMING IS THE MELEE TIMING. The bolt is given exactly the window the lunge
     would have had and arrives at exactly the fraction of it the strike reaches
     the defender at (`combatRange.beam.travel`), so `resolveClash` is called at
     the same offset with the same arguments and the published band lengths hold
     to the millisecond. Nothing here is awaited: the bolt's flight IS the
     release, not an addition to it. */
  function fireDischarge(cm, a, d, rel, contact){
    if (!a) return;
    const CR = C.combatRange;
    const el = a.element || 'fire';
    const dir = a.dir;
    /* THE RECOIL, and it fires whether or not the fx are on. The marks are
       decoration; the ground the body gives is choreography, and a run with the
       fx chip off still has to leave the ring space where the next Circle
       expects to find it. Composited, like the lunge, and folded by the same
       call at the Aftermath. */
    anim(animEl(a.node), [
      { transform:'translateX(0px) scale(1,1)' },
      // local space is mirrored by the rig, so -x is backward for either body
      { transform:`translateX(${-CR.recoil}px) scale(1.07,0.93)`, offset:0.38 },
      { transform:`translateX(${(-CR.recoil * 0.55).toFixed(0)}px) scale(1,1)` },
    ], Math.max(1, rel * 2), { easing:'cubic-bezier(.15,.9,.35,1)', composite:'add', fill:'forwards' });

    /* THE CORE LEAVES THE BODY, and it is REMOVED rather than faded: the bolt
       below is the same object one frame later, and a core still glowing on the
       attacker's chest while its own discharge is halfway downrange is two
       copies of one thing. Cleared unconditionally, so an interrupted commit
       can never leave a charge burning over the next one. */
    if (st.core && st.core.node){ try { st.core.node.remove(); } catch(e){} }
    st.core = null;
    if (!vfx() || st.skipping) return;

    const x0 = drawnX(a) + 26 * dir, y0 = GY + CR.charge.rise * a.scale;
    const x1 = d ? drawnX(d) : x0 + 300 * dir;
    const y1 = GY - 62 * (d ? d.scale : 1);

    const mz = fxAt(A.fx.muzzle(el, dir), x0, y0, 700);
    if (mz) anim(animEl(mz), [
      { transform:'scale(0.45)', opacity:1 },
      { transform:'scale(1.55)', opacity:0 },
    ], Math.max(1, rel * 1.3), { fill:'forwards' });

    /* THE BOLT. Its life is the flight and nothing after it — the Clash is
       about to draw the impact at the far end, and a bolt still on screen
       inside the hitstop would be an arrow pointing at a blow that has already
       landed. It stretches as it goes, which is the smear the melee strike gets
       from the frame grid and this cannot get from anywhere else. */
    /* Its own timer, not `fxAt`'s. Every other effect in the game wants to
       outlive its beat and fade, so `fxAt` adds half a second to whatever life
       it is given — which for this one would leave a bolt hanging in the air
       through the entire hitstop, pointing at a blow that has already landed. */
    const bolt = fxAt(A.fx.beam(el, CR.beam.len, CR.beam.thick, dir), x0, y0, 0);
    if (bolt){
      anim(animEl(bolt), [
        { transform:'translate(0px, 0px) scale(0.7, 1.1)' },
        { transform:`translate(${(x1 - x0).toFixed(0)}px, ${(y1 - y0).toFixed(0)}px) scale(${CR.beam.tail}, 0.9)` },
      ], Math.max(1, contact), { fill:'forwards' });
      setTimeout(() => { try { bolt.remove(); } catch(e){} }, Math.max(40, contact + 30));
    }
  }

  /* THE BRACE, ON THE BODY. The Tell already draws a brace MARK on the ground
     under the defender, and a viewer watching two creatures fight does not look
     at the ground. So the defender now answers the incoming blow with the only
     thing that cannot be missed: itself. On the release — before contact, while
     the strike is still in the air — it turns its shoulder into the line,
     drops its weight and gets small.

     It fires on EVERY commit, identically, and that is load-bearing. A brace
     that appeared only when a blow was going to land would be an outcome tell,
     which is the one thing the pre-contact beats are forbidden to be. What it
     says is "something is arriving", which the viewer is supposed to know —
     the Tell has been saying it for a second and a half already.

     Written with `fill:'forwards'` so the pose survives into the contact frame,
     and cancelled at the top of the Clash so whatever happens next — a hit
     pose, a slip, a guard — starts from a clean element. */
  function braceFor(d, ms){
    if (!d || !d.node || !vfx() || st.skipping || ms < 40) return;
    const B = C.hit.recoil.brace;
    setEx(d.node, 'worried');
    // local space is mirrored by the rig: +x is the way the body faces, so
    // giving ground is negative and the shoulder turns in with it.
    anim(animEl(d.node), [
      { transform:'translateX(0px) rotate(0deg) scale(1,1)' },
      { transform:`translateX(${-B.push}px) rotate(${-B.tip}deg) scale(0.97, 1.04)` },
    ], Math.max(1, ms), { easing:'cubic-bezier(.3,.8,.4,1)', fill:'forwards' });
  }

  function flinchOpen(cm, a, d, ms){
    const gain = C.flinch.intensity[cm.ring] != null ? C.flinch.intensity[cm.ring] : 0.7;
    const atk = cm.atk || [], def = cm.def || [];
    setFlinch(a, atk[0], ms, gain);
    setFlinch(d, def[0], ms, gain);
    /* Whether the arc turns is now the SCRIPT'S call, not the ring's. It used
       to ask `isArcRing`, so recolouring the Vault's commit A from red to
       pressure would have silently deleted its QUAKE->RALLY — the performance
       thrown away as a side effect of an edit about telegraph semantics. The
       tell's length is derived from the same question (see C.tellMs), so a
