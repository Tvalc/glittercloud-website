  let cardScratch = null;
  function drawRarityCard(x, y, w, h, hex, fill) {
    const img = assets.cardBack || assets.hudPlate;
    if (!img) return;
    if (!cardScratch) cardScratch = document.createElement("canvas");
    const cw = Math.max(8, Math.round(w));
    const ch = Math.max(8, Math.round(h));
    cardScratch.width = cw;
    cardScratch.height = ch;
    const c = cardScratch.getContext("2d");
    c.clearRect(0, 0, cw, ch);
    c.drawImage(img, 0, 0, cw, ch);
    c.globalCompositeOperation = "source-atop";
    const inset = Math.round(Math.min(cw, ch) * 0.12);
    c.fillStyle = hex;
    c.globalAlpha = 0.24 + fill * 0.7;
    c.fillRect(inset, inset + (ch - inset * 2) * (1 - fill), cw - inset * 2, (ch - inset * 2) * fill + 2);
    c.globalCompositeOperation = "source-over";
    c.globalAlpha = 1;
    ctx.save();
    ctx.shadowColor = hex;
    ctx.shadowBlur = 8 + fill * 26;
    ctx.drawImage(cardScratch, x, y, w, h);
    ctx.restore();
    if (fill > 0.02 && fill < 0.995) {
      const fillY = y + h * 0.12 + h * 0.76 * (1 - fill);
      ctx.save();
      ctx.globalAlpha = 0.72;
      ctx.strokeStyle = "#fff8c7";
      ctx.lineWidth = 4;
      ctx.shadowColor = hex;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(x + w * 0.18, fillY);
      ctx.lineTo(x + w * 0.82, fillY);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawCardHud() {
    if (show.phase !== "cards") return;
    const layout = cardTransferLayout();
    const settleRaw = Math.min(1, Math.max(0, (cardShow.age - 4.25) / 0.9));
    const settle = settleRaw * settleRaw * (3 - 2 * settleRaw);
    const finalX = W / 2 - layout.w / 2;
    const cardX = layout.cardX + (finalX - layout.cardX) * settle;
    const sourceAlpha = 1 - settle;
    const sourceW = 470;
    const sourceH = 184;
    const sourceX = layout.sourceX - sourceW / 2;
    const sourceY = layout.sourceY - sourceH / 2;
    const remaining = Math.max(0, Math.round(cardShow.total * (1 - cardShow.fill)));
    if (sourceAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = sourceAlpha;
      drawAsset("hudPlate", sourceX, sourceY, sourceW, sourceH);
      strokeFit("FINAL COIN HAUL", layout.sourceX, sourceY + 46, sourceW - 70, 19, "#fff6e4", "center", 13, "800", "#2a1608");
      drawAsset("coin", layout.sourceX - 112, sourceY + 69, 46, 46);
      strokeFit(remaining + " COINS", layout.sourceX + 24, sourceY + 108, sourceW - 150, 36, "#ffffff", "center", 20, "900", "#073f4a");
      strokeFit("OF " + cardShow.total + " FLOWING INTO THE CARD", layout.sourceX, sourceY + 145, sourceW - 74, 14, "#ffe08a", "center", 10, "800", "#2a1608");
      ctx.restore();
    }
    drawRarityCard(cardX, layout.cardY, layout.w, layout.h, cardShow.hex, cardShow.fill);
    const bannerW = 380;
    drawAsset("bannerPlate", cardX + layout.w / 2 - bannerW / 2, layout.cardY - 82, bannerW, 72);
    strokeFit(cardShow.rarity + " CARD", cardX + layout.w / 2, layout.cardY - 38, bannerW - 64, 24, cardShow.hex, "center", 14, "900", "#1a1208");
    if (settle > 0.72) {
      ctx.save();
      ctx.globalAlpha = (settle - 0.72) / 0.28;
      strokeFit(cardShow.total + " COINS ABSORBED", W / 2, layout.cardY + layout.h + 38, 440, 18, "#fff6e4", "center", 12, "800", "#2a1608");
      ctx.restore();
    }
    ctx.textAlign = "left";
    cardShow.flies.forEach(function (f) {
      if (f.age < 0) return;
      const u = Math.min(1, Math.max(0, f.age / f.life));
      if (u >= 1) return;
      const e = 1 - Math.pow(1 - u, 3);
      const x = f.x + (f.tx - f.x) * e;
      const y2 = f.y + (f.ty - f.y) * e - Math.sin(u * Math.PI) * 54;
      const size = 16 + Math.sin(u * Math.PI) * 7;
      drawAsset("coin", x - size / 2, y2 - size / 2, size, size);
    });
  }

  function drawTallyHud() {
    if (show.phase !== "tally" || show.age <= 0.2) return;
    const sc = scoreRun();
    const line1 = sc.coins + " COINS   × " + sc.mult.toFixed(1);
    const extra = [];
    if (sc.storm) extra.push("STORM +" + sc.storm);
    if (sc.vault) extra.push("VAULT +" + sc.vault);
    const line2 = extra.join("   ");
    const w = 520;
    const h = line2 ? 168 : 148;
    const x = W / 2 - w / 2;
    const y = H * 0.5 - h * 0.55;
    drawAsset("hudPlate", x, y, w, h);
    const inner = w - 72;
    strokeFit(line1, W / 2, y + 48, inner, 22, "#fff6e4", "center", 14, "800", "#2a1608");
    if (line2) strokeFit(line2, W / 2, y + 82, inner, 18, "#ffe08a", "center", 13, "800", "#2a1608");
    strokeFit(String(sc.value), W / 2, y + h - 36, inner, 42, "#ffffff", "center", 22, "900", "#073f4a");
    ctx.textAlign = "left";
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    drawSky();
    drawFarHills();
    ctx.save();
    ctx.scale(viewZ, viewZ);
    ctx.translate(-camX, -camY);

    solidsAt().forEach(function (s) { drawPlat(s); });

    if (!reliquaryShow()) {
      boxes.forEach(drawQBox);
      coins.forEach(drawCoin);
      walkers.forEach(drawWalker);
      bats.forEach(drawBat);
      crushers.forEach(drawCrusher);
      pops.forEach(drawPop);
    }
    stormCoins.forEach(drawCoin);
    drawChest();
    portals.forEach(drawPortal);
    confetti.forEach(drawConfettiBit);

    party.filter(function (r) { return r.ghost; }).forEach(drawCast);
    party.filter(function (r) { return r.dying; }).forEach(drawCast);
    party.filter(function (r) { return r.alive; }).forEach(drawCast);

    if (debug) {
      ctx.lineWidth = 2;
      party.forEach(function (r) {
        if (!r.alive) return;
        ctx.strokeStyle = "#00ff88";
        ctx.strokeRect(r.x + 4, r.y + 8, RUNNER_W - 8, RUNNER_H - 10);
      });
      walkers.forEach(function (w) {
        if (!w.alive) return;
        ctx.strokeStyle = "#ff3355";
        ctx.strokeRect(w.x, w.y, w.w, w.h);
      });
      bats.forEach(function (b) {
        ctx.strokeStyle = "#ff3355";
        ctx.strokeRect(b.x, b.y, b.w, b.h);
      });
      crushers.forEach(function (c) {
        ctx.strokeStyle = "#ff8800";
        ctx.strokeRect(c.x, crusherY(c), c.w, c.h);
      });
      SOLIDS.forEach(function (s) {
        ctx.strokeStyle = "#66ccff";
        ctx.strokeRect(s.x, s.y, s.w, s.h);
      });
    }

    coinFlies.forEach(function (f) {
      const u = Math.min(1, f.age / f.life);
      const e = 1 - Math.pow(1 - u, 3);
      const sx = f.x - camX;
      const sy = f.y - camY;
      const tx = W / 2 - 28;
      const ty = 38;
      const x = sx + (tx - sx) * e;
      const y = sy + (ty - sy) * e;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      drawAsset("coin", x - 8, y - 8, 16, 16);
      ctx.restore();
    });

    ctx.restore();

    if (show.phase === "transition") {
      drawRainbowTransition();
      return;
    }

    if (debug) {
      drawAsset("hudPlate", 148, 8, 420, 168);
      ctx.fillStyle = "#2a1c08";
      ctx.font = "13px ui-monospace, Consolas, monospace";
      ctx.textAlign = "left";
      const lead = party[0] || {};
      const lines = [
        "t " + simTime.toFixed(2) + "s   " + mode,
        "pos " + (lead.x || 0).toFixed(1) + ", " + (lead.y || 0).toFixed(1),
        "party " + party.map(function (r) { return r.name + (r.caught ? "!" : r.finished ? "*" : ""); }).join(" "),
        "boxes " + boxes.map(function (b) { return b.loot[0] + (b.used ? "+" : ""); }).join(" "),
        "coins " + party.map(function (r) { return r.name[0] + r.coins + (r.coinCut ? "/2" : ""); }).join(" ") + " = " + coinCount + "  storm " + stormCaught + "  show " + show.phase,
      ];
      lines.forEach(function (line, i) { ctx.fillText(line, 164, 36 + i * 20); });
    }

    if (show.phase === "cards") {
      drawCardHud();
    } else {
      drawPartyHud();
      drawCoinHud();
      drawStormHud();
      drawTallyHud();
    }
  }

  function frame(stamp) {
    if (!lastStamp) lastStamp = stamp;
    let dt = (stamp - lastStamp) / 1000;
    lastStamp = stamp;
    if (dt > 0.08) dt = 0.08;
    acc += dt * playbackRate;
    while (acc >= FIXED) {
      step(FIXED);
      acc -= FIXED;
    }
    draw();
    requestAnimationFrame(frame);
  }

  function bindKey(e, down) {
    const k = e.key;
    if (down && (k === "1" || k === "2" || k === "5")) setPlaybackSpeed(Number(k));
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = down;
    if (k === "ArrowRight" || k === "d" || k === "D") keys.right = down;
    if (k === "ArrowUp" || k === "w" || k === "W" || k === " " || k === "Spacebar") {
      keys.jump = down;
      if (down && mode === "driver") setMode("keyboard");
      e.preventDefault();
    }
  }
  window.addEventListener("keydown", function (e) {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    bindKey(e, true);
  });
  window.addEventListener("keyup", function (e) {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    bindKey(e, false);
  });
  canvas.addEventListener("pointerdown", function () { canvas.focus(); });

  function setMode(next) {
    mode = next;
    btnKey.classList.toggle("on", mode === "keyboard");
    btnDrv.classList.toggle("on", mode === "driver");
    tagline.textContent = mode === "driver"
      ? "A robot is playing. Same seed, same run."
      : "Your hands. Physics still owns the jump.";
  }

  function setPlaybackSpeed(next) {
    const speed = Number(next);
    if (speed !== 1 && speed !== 2 && speed !== 5) return;
    playbackRate = speed;
    document.querySelectorAll("[data-speed]").forEach(function (button) {
      const active = Number(button.dataset.speed) === playbackRate;
      button.classList.toggle("on", active);
      button.setAttribute("aria-pressed", active ? "true" : "false");
    });
    canvas.focus();
  }

  function instantFinish() {
    const wasPaused = paused;
    const wasMode = mode;
    paused = false;
    mode = "driver";
    let ticks = 0;
    while (
      ticks < 30000 &&
      !(show.phase === "cards" && cardShow.fill >= 0.999 && cardShow.age >= 5.2)
    ) {
      step(FIXED);
      ticks += 1;
    }
    mode = wasMode;
    paused = wasPaused;
    acc = 0;
    draw();
    canvas.focus();
  }

  function fullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }

  function fullscreenActive() {
    return !!fullscreenElement() || stage.classList.contains("pseudo-fullscreen");
  }

  function enterFullscreenFallback() {
    stage.classList.add("pseudo-fullscreen");
    document.documentElement.classList.add("fullscreen-fallback");
    syncFullscreenControls();
  }

  function enterFullscreen() {
    const request = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (!request) {
      enterFullscreenFallback();
      return;
    }
    const result = request.call(stage);
    if (result && result.then) {
      result.then(function () {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(function () {});
        }
      }).catch(enterFullscreenFallback);
    }
  }

  function exitFullscreen() {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit && fullscreenElement()) {
      exit.call(document);
      return;
    }
    stage.classList.remove("pseudo-fullscreen");
    document.documentElement.classList.remove("fullscreen-fallback");
    syncFullscreenControls();
  }

  function syncFullscreenControls() {
    const active = fullscreenActive();
    btnFullscreen.classList.toggle("on", active);
    btnFullscreen.textContent = active ? "EXIT FULL SCREEN" : "FULL SCREEN";
    if (!active && screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock();
    }
    canvas.focus();
  }

  function testEnding(kind) {
    const instant = document.getElementById("instant-complete").checked;
    const vault = kind === "vault";
    const vaultRun = vault ? makeVaultTestRun() : null;
    if (!instant) {
      resetRun({
        testEnding: kind,
        runSeed: vaultRun ? vaultRun.seed : SEED,
        seal: vaultRun ? vaultRun.seal : null,
      });
      setMode("driver");
      canvas.focus();
      return;
    }
    const count = vault ? 3 : Math.max(1, Math.min(3, Number(kind) || 1));
    const names = ["solby", "embit", "puddli"];
    resetRun(vault ? {
      testEnding: "vault",
      runSeed: vaultRun.seed,
      seal: vaultRun.seal,
    } : null);
    party = [];
    for (let i = 0; i < count; i++) {
      const r = createRunner(names[i], CHEST.x - 260 + i * 88, true, true, true);
      r.y = LOW_Y - RUNNER_H;
      r.onGround = true;
      r.finished = true;
      r.celebrating = true;
      r.coins = vault ? 10 : 6;
      r.facing = 1;
      party.push(r);
    }
    runner = party[0];
    coins = [];
    syncCoinCount();
    boxes.forEach(function (box) { box.used = true; });
    chestLid = 0;
    chestLoot = [];
    show = { phase: "fly", age: 0 };
    beatHold = 0;
    didVault = false;
    const lock = {
      x: Math.max(0, WORLD_W - W / VIEW_Z),
      y: LOW_Y - (H / VIEW_Z) * 0.88,
      z: VIEW_Z,
    };
    endingCameraLock = lock;
    camX = lock.x;
    camY = lock.y;
    viewZ = lock.z;
    setMode("driver");
    canvas.focus();
  }

  function replayRun() {
    if (activeSeal && activeSeal.vaultTest) {
      resetRun({ testEnding: "vault", runSeed: runSeed, seal: activeSeal });
    } else {
      resetRun();
    }
    canvas.focus();
  }

  btnKey.addEventListener("click", function () { setMode("keyboard"); canvas.focus(); });
  btnDrv.addEventListener("click", function () { setMode("driver"); canvas.focus(); });
  document.querySelectorAll("[data-speed]").forEach(function (button) {
    button.addEventListener("click", function () { setPlaybackSpeed(button.dataset.speed); });
  });
  document.getElementById("btn-finish").addEventListener("click", instantFinish);
  btnFullscreen.addEventListener("click", enterFullscreen);
  btnFullscreenExit.addEventListener("click", exitFullscreen);
  document.addEventListener("fullscreenchange", syncFullscreenControls);
  document.addEventListener("webkitfullscreenchange", syncFullscreenControls);
  document.getElementById("btn-reset").addEventListener("click", replayRun);
  document.querySelectorAll("[data-ending]").forEach(function (button) {
    button.addEventListener("click", function () { testEnding(button.dataset.ending); });
  });
  const seedIn = document.getElementById("seed-in");
  seedIn.value = SEED.toUpperCase();
  function applySeed(next) {
    const seed = String(next || "").trim().toLowerCase().replace(/\s+/g, "-").slice(0, 32);
    if (!seed) return;
    const url = new URL(location.href);
    url.searchParams.set("seed", seed);
    location.assign(url.pathname + url.search);
  }
  function randomSeed() {
    const n = Math.floor(Math.random() * 1679616).toString(36).padStart(4, "0");
    return "run-" + n;
  }
  document.getElementById("btn-seed").addEventListener("click", function () { applySeed(seedIn.value); });
  document.getElementById("btn-new").addEventListener("click", function () { applySeed(randomSeed()); });
  seedIn.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      applySeed(seedIn.value);
    }
  });
  document.getElementById("btn-dbg").addEventListener("click", function () {
    debug = !debug;
    logEl.classList.toggle("show", debug);
    this.classList.toggle("on", debug);
  });

  function physicsProof() {
    const r = createRunner();
    r.x = 200; r.y = LOW_Y - RUNNER_H;
    const still = emptyInput();
    let t = 0;
    for (let i = 0; i < 8; i++) { stepPhysics(r, still, FIXED, t); t += FIXED; }
    const input = { left: false, right: false, jump: true };
    stepPhysics(r, input, FIXED, t); t += FIXED;
    input.jump = false;
    const samples = [{ t: 0, y: r.y }];
    for (let i = 0; i < 90; i++) {
      stepPhysics(r, input, FIXED, t); t += FIXED;
      samples.push({ t: t, y: r.y });
      if (r.onGround && samples.length > 8) break;
    }
    const mid = samples.filter(function (s) { return s.t > 0.05 && s.t < 0.45; });
    const accels = [];
    for (let i = 2; i < mid.length; i++) {
      accels.push((mid[i].y - 2 * mid[i - 1].y + mid[i - 2].y) / (FIXED * FIXED));
    }
    const mean = accels.reduce(function (s, v) { return s + v; }, 0) / accels.length;
    logEl.textContent = "PHYSICS  mean g " + mean.toFixed(1) + "  (2200)  samples " + samples.length;
    return { pass: Math.abs(mean - GRAVITY) < 40, mean: mean };
  }

  window.Phase0 = {
    getState: function () {
      const lead = party[0] || {};
      return {
        mode: mode, speed: playbackRate, t: simTime, seed: runSeed, seal: activeSeal, testEnding: testEndingTarget,
        x: lead.x, y: lead.y, vx: lead.vx, vy: lead.vy,
        pose: lead.pose, onGround: lead.onGround,
        runPhase: lead.runPhase, idlePhase: lead.idlePhase,
        finished: lead.finished, caught: lead.caught,
        cam: { x: camX, y: camY, z: viewZ },
        sizes: { runner: [RUNNER_W, RUNNER_H], solby: [CAST_DRAW.solby.w, CAST_DRAW.solby.h], walker: [52, 34], bat: [108, 76], lanes: [LOW_Y, HIGH_Y, HIGHER_Y] },
        party: party.map(function (r) {
          return { name: r.name, x: r.x, y: r.y, vy: r.vy, alive: r.alive, caught: r.caught, ghost: r.ghost, dying: r.dying, finished: r.finished, power: r.power, high: r.tookHigh, higher: r.tookHigher, onGround: r.onGround, coins: r.coins, coinCut: !!r.coinCut, zapping: !!r.zapping, hidden: !!r.hidden, zapAge: r.zapAge || 0 };
        }),
        boxes: boxes.map(function (b) { return { loot: b.loot, used: b.used }; }),
        walkers: walkers.filter(function (w) { return w.alive; }).length,
        crushers: crushers.map(function (c) {
          return { x: c.x, y: c.y, state: c.state, rest: c.rest, h: c.h, w: c.w };
        }),
        bats: bats.map(function (b) { return { x: b.x, y: b.y, lane: b.lane }; }),
        coins: coinCount,
        storm: { caught: stormCaught, live: liveRain(), age: show.phase === "storm" ? show.age : 0 },
        vault: { caught: vaultCaught, rarity: rarityFor(potTotal()).name, cardRarity: cardShow.rarity, cardTotal: cardShow.total, fill: cardShow.fill, min: VAULT_MIN },
        show: show.phase,
        score: scoreRun(),
        over: show.phase === "tally" ? (scoreRun().arrived ? "clear" : "caught") : false,
      };
    },
    setMode: setMode,
    setSpeed: setPlaybackSpeed,
    finish: instantFinish,
    testEnding: testEnding,
    reset: resetRun,
    pause: function (v) { paused = !!v; },
    hold: function (next) {
      hold.left = !!next.left; hold.right = !!next.right; hold.jump = !!next.jump;
    },
    physicsProof: physicsProof,
    tick: function (n) {
      const was = paused;
      paused = false;
      for (let i = 0; i < n; i++) step(FIXED);
      paused = was;
    },
  };

  resetRun();
  canvas.focus();
  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
