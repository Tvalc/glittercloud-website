<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SOLBY</title>
  <style>
    :root {
      --ink: #f4efe6;
      --mute: #9aa6b2;
      --gold: #f4c45a;
      --go: #3ecf6a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; color: var(--ink);
      background:
        radial-gradient(circle at 50% 12%, #fff0a8 0, #eaa956 35%, #8b4729 100%);
      font: 15px/1.4 ui-sans-serif, system-ui, sans-serif;
      text-transform: uppercase;
    }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100%; padding: 10px 12px 14px;
    }
    .stage {
      width: min(1280px, 100%);
      position: relative;
    }
    .lockup {
      display: none;
    }
    h1 {
      margin: 0; font-size: clamp(18px, 2.1vw, 26px); letter-spacing: 0.08em;
      font-weight: 800; color: #fff;
    }
    h1 span { color: var(--gold); }
    .tag { color: var(--mute); font-size: 13px; letter-spacing: 0.04em; }
    canvas {
      display: block; width: 100%; height: auto; border-radius: 18px;
      border: 4px solid #ffe57f;
      box-shadow: 0 0 0 3px #5b2d1d, 0 24px 60px #4b1d1688;
      background: #995f43; touch-action: none;
    }
    .bar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-top: 10px; padding: 10px 12px;
      border: 3px solid #ffe57f; border-radius: 20px;
      background: #6f351fe8;
      box-shadow: 0 0 0 2px #4a2117;
    }
    .test-bar {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
      margin-top: 10px; padding: 8px 12px;
      border: 3px solid #ffe57f; border-radius: 20px;
      background: #6f351fe8; box-shadow: 0 0 0 2px #4a2117;
    }
    .test-bar button { width: 100%; padding-inline: 12px; }
    .instant-toggle {
      grid-column: 1 / -1; display: flex; align-items: center; justify-content: center;
      gap: 10px; min-height: 34px; color: #fff9e8; font-weight: 900;
      letter-spacing: 0.04em; text-shadow: 0 2px 0 #3b1c10;
    }
    .instant-toggle input { width: 20px; height: 20px; accent-color: #ffd65a; }
    @media (max-width: 720px) {
      .test-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    button {
      border: 0; border-radius: 18px; padding: 8px 24px 16px; cursor: pointer;
      color: #fff9e8; font-weight: 900; font-size: 14px; line-height: 1.15;
      letter-spacing: 0.02em; white-space: nowrap;
      text-transform: uppercase;
      text-shadow:
        -2px -2px 0 #3b1c10, 2px -2px 0 #3b1c10,
        -2px 2px 0 #3b1c10, 2px 2px 0 #3b1c10;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent center / 100% 100% no-repeat;
      background-image: url("assets/makko/hud-plate.png");
    }
    button.on { color: #fff4a8; filter: saturate(1.2) brightness(1.08); }
    button.ghost { color: #fff9e8; filter: saturate(0.95) brightness(1.02); }
    .speed-controls {
      position: absolute; top: 14px; right: 14px; z-index: 18;
      display: flex; align-items: center; gap: 6px;
    }
    .speed-controls button {
      min-width: 62px; padding: 7px 10px 13px;
      font-size: 12px; opacity: 0.82;
    }
    .speed-controls button.on {
      opacity: 1; color: #fff7a8;
      transform: translateY(-1px);
    }
    .speed-controls .finish-button {
      min-width: 108px; color: #fff7a8;
      filter: saturate(1.18) brightness(1.08);
    }
    @media (max-width: 720px) {
      .speed-controls { top: 8px; right: 8px; gap: 2px; }
      .speed-controls button {
        min-width: 44px; padding: 5px 5px 9px;
        font-size: 9px; letter-spacing: -0.03em;
      }
      .speed-controls .finish-button { min-width: 72px; }
    }
    .seed-in {
      border: 0; border-radius: 18px; padding: 8px 22px 16px;
      min-width: 168px; max-width: 220px;
      color: #fff9e8; font: 900 14px/1.15 ui-monospace, Consolas, monospace;
      letter-spacing: 0.04em; text-align: center;
      text-transform: uppercase;
      text-shadow:
        -2px -2px 0 #3b1c10, 2px -2px 0 #3b1c10,
        -2px 2px 0 #3b1c10, 2px 2px 0 #3b1c10;
      background: transparent center / 100% 100% no-repeat;
      background-image: url("assets/makko/hud-plate.png");
    }
    .seed-in:focus { outline: 2px solid #f4c45a88; outline-offset: 1px; }
    .hint { color: #fff6d6; font-size: 12px; font-weight: 800; }
    .fullscreen-exit {
      display: none; position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 20; opacity: 0.88;
    }
    html.fullscreen-fallback, html.fullscreen-fallback body { overflow: hidden; }
    .stage:fullscreen, .stage:-webkit-full-screen, .stage.pseudo-fullscreen {
      width: 100vw; height: 100vh; padding: 0;
      display: flex; align-items: center; justify-content: center;
      background: #2c1715;
    }
    .stage.pseudo-fullscreen {
      position: fixed; inset: 0; z-index: 9999;
      width: 100vw; height: 100dvh;
    }
    .stage:fullscreen canvas, .stage:-webkit-full-screen canvas,
    .stage.pseudo-fullscreen canvas {
      width: min(100vw, calc(100vh * 16 / 9));
      max-width: 100vw; max-height: 100vh;
      border: 0; border-radius: 0; box-shadow: none;
    }
    .stage:fullscreen .bar, .stage:fullscreen .test-bar,
    .stage:-webkit-full-screen .bar, .stage:-webkit-full-screen .test-bar,
    .stage.pseudo-fullscreen .bar, .stage.pseudo-fullscreen .test-bar {
      display: none;
    }
    .stage:fullscreen .fullscreen-exit,
    .stage:-webkit-full-screen .fullscreen-exit,
    .stage.pseudo-fullscreen .fullscreen-exit {
      display: inline-flex;
    }
    .stage:fullscreen .speed-controls,
    .stage:-webkit-full-screen .speed-controls,
    .stage.pseudo-fullscreen .speed-controls {
      top: max(62px, calc(env(safe-area-inset-top) + 54px));
      right: max(12px, env(safe-area-inset-right));
    }
    #log {
      display: none; width: min(1280px, 100%); margin: 10px 0 0;
      min-height: 6em; padding: 10px 12px; background: #5a2b1f; color: #fff9e8;
      border: 3px solid #ffe57f; border-radius: 12px; white-space: pre-wrap;
      font: 800 12px/1.45 ui-monospace, Consolas, monospace;
    }
    #log.show { display: block; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="lockup">
      <div>
        <h1>SOL<span>BY</span></h1>
        <div class="tag" id="tagline">A robot is playing. Same seed, same run.</div>
      </div>
      <div class="tag" id="seedline"></div>
    </div>
    <canvas id="game" width="1280" height="720" tabindex="0"></canvas>
    <div class="speed-controls" role="group" aria-label="Playback speed">
      <button class="on" data-speed="1" aria-label="1x playback speed" aria-pressed="true">▶ 1X</button>
      <button data-speed="2" aria-label="2x playback speed" aria-pressed="false">▶▶ 2X</button>
      <button data-speed="5" aria-label="5x playback speed" aria-pressed="false">▶▶▶ 5X</button>
      <button id="btn-finish" class="finish-button" aria-label="Instant finish">⏭ FINISH</button>
    </div>
    <div class="bar">
      <button id="btn-drv" class="on">AUTOPLAY</button>
      <button id="btn-key">YOU PLAY</button>
      <button id="btn-reset" class="ghost">REPLAY SEED</button>
      <input id="seed-in" class="seed-in" spellcheck="false" maxlength="32" aria-label="Seed" />
      <button id="btn-seed" class="ghost">PLAY SEED</button>
      <button id="btn-new" class="ghost">NEW SEED</button>
      <button id="btn-dbg" class="ghost">DEBUG</button>
      <button id="btn-fullscreen" class="ghost">FULL SCREEN</button>
      <span class="hint"></span>
    </div>
    <div class="test-bar" aria-label="Ending tests">
      <label class="instant-toggle">
        <input id="instant-complete" type="checkbox" />
        <span>INSTANT COMPLETE</span>
      </label>
      <button class="ghost" data-ending="vault">TEST VAULT</button>
      <button class="ghost" data-ending="1">TEST 1 MADE IT</button>
      <button class="ghost" data-ending="2">TEST 2 MADE IT</button>
      <button class="ghost" data-ending="3">TEST 3 MADE IT</button>
    </div>
    <button id="btn-fullscreen-exit" class="fullscreen-exit">EXIT FULL SCREEN</button>
  </div>
  <pre id="log"></pre>
  <script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const stage = document.querySelector(".stage");
  const logEl = document.getElementById("log");
  const btnKey = document.getElementById("btn-key");
  const btnDrv = document.getElementById("btn-drv");
  const btnFullscreen = document.getElementById("btn-fullscreen");
  const btnFullscreenExit = document.getElementById("btn-fullscreen-exit");
  const seedLine = document.getElementById("seedline");
  const tagline = document.getElementById("tagline");

  const W = 1280, H = 720;
  const GRAVITY = 2200;
  const JUMP_V = -780;
  const ACCEL = 2400;
  const MAX_RUN = 268;
  const FRICTION = 3200;
  const AIR_CONTROL = 0.55;
  const COYOTE = 0.08;
  const JUMP_BUFFER = 0.1;
  const RECOVERY = 0.14;
  const RUNNER_W = 54, RUNNER_H = 78;
  const FIXED = 1 / 60;
  const VIEW_Z = 0.62;
  let viewZ = VIEW_Z;
  const WORLD_W = 10500;
  function viewW() { return W / viewZ; }
  function viewH() { return H / viewZ; }
  function camLimit() {
    if (show.phase === "gate" || (show.phase === "transition" && show.age < TRANSITION_SWAP)) {
      return Math.max(0, WORLD_W - viewW());
    }
    if (plazaShow()) return Math.max(0, CHEST.x + 480 - viewW());
    return Math.max(0, WORLD_W - viewW());
  }
  const PIT_Y = 860;
  const END_X = 9400;
  const LOW_Y = 708;
  const STEP_Y = LOW_Y - 132;
  const STEP2_Y = STEP_Y - 124;
  const HIGH_Y = STEP2_Y - 124;
  const HI_STEP_Y = HIGH_Y - 132;
  const HI_STEP2_Y = HI_STEP_Y - 124;
  const HIGHER_Y = HI_STEP2_Y - 120;
  const ROAD_END = 9000;
  const DROP_X = ROAD_END - 40;
  const JUMP_POWER = -920;
  const FRIEND_MULT = 1;
  const BONUS_MULT = 0.5;
  const STORM_LIFE = 8;
  const STORM_SPAWN = 0.11;
  const STORM_WAVE = 3;
  const STORM_CAP = 42;
  const VAULT_MIN = 20;
  const GATE_LIFE = 12;
  const GATE_HOLD = 2.2;
  const GATE_STAGGER = 1.15;
  const ZAP_LIFE = 0.9;
  const PORTAL_SUMMON = 1.25;
  const TRANSITION_LIFE = 2.4;
  const TRANSITION_SWAP = 1.2;
  const VAULT_LIFE = 14;
  const TALLY_LIFE = 3.2;
  const VAULT_SPAWN = 0.032;
  const VAULT_WAVE = 8;
  const VAULT_CAP = 96;
  const RARITY = [
    { name: "COMMON", at: 0, hex: "#f0ebe3" },
    { name: "UNCOMMON", at: 40, hex: "#1eff00" },
    { name: "RARE", at: 80, hex: "#0070dd" },
    { name: "EPIC", at: 160, hex: "#a335ee" },
    { name: "LEGENDARY", at: 320, hex: "#ff8000" },
    { name: "GRAIL", at: 640, hex: "#e8c04a" },
  ];
  const BEAT_HOLD = 0.34;
  const JUMP_UP_T = -JUMP_V / GRAVITY;

  const params = new URLSearchParams(location.search);
  const SEED = params.get("seed") || "stage-001";
  let runSeed = SEED;
  seedLine.textContent = "SEED  " + SEED;

  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }
  function mulberry32(a) {
    return function () {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(xmur3(SEED)());

  function pickLoot() {
    const u = rng();
    if (u < 0.28) return "character";
    if (u < 0.56) return "powerup";
    if (u < 0.78) return "empty";
    return "enemy";
  }

  const STAGE_BOX_LOOT = [
    "empty", "powerup", "empty", "character",
    "enemy", "powerup", "empty", "powerup",
    "empty", "empty", "character", "character",
    "character", "character", "character", "character",
  ];
  const WIPE_BOX_LOOT = [
    "empty", "enemy", "powerup", "empty",
    "empty", "enemy", "powerup", "empty",
    "enemy", "empty", "powerup", "empty",
    "enemy", "empty", "powerup", "enemy",
  ];
  const DUO_BOX_LOOT = STAGE_BOX_LOOT.map(function (loot, i) {
    return ([8, 11, 12, 13, 14, 15].indexOf(i) >= 0) ? "empty" : loot;
  });

  const STAGE_SEAL = {
    stomp: true,
    boxLoot: STAGE_BOX_LOOT,
    trap: { solby: true, guest: true, third: true },
    highRoad: { solby: false, guest: true, third: false },
    higherRoad: { solby: false, guest: false, third: true },
  };

  function makeVaultTestRun(requestedSeed) {
    const token = Math.floor(Math.random() * 2176782336).toString(36).padStart(6, "0");
    const seed = requestedSeed || ("vault-" + token);
    const draw = mulberry32(xmur3(seed)());
    const boxLoot = Array.from({ length: 16 }, function () {
      return draw() < 0.52 ? "empty" : "powerup";
    });
    const guestBoxes = [3, 10];
    const guestIndex = guestBoxes[Math.floor(draw() * guestBoxes.length)];
    boxLoot[guestIndex] = "character";
    // Every possible lane gets a reachable second-recruit checkpoint.
    [8, 11, 12, 13, 14, 15].forEach(function (i) {
      boxLoot[i] = "character";
    });
    return {
      seed: seed,
      seal: {
        stomp: true,
        boxLoot: boxLoot,
        trap: { solby: true, guest: true, third: true },
        highRoad: { solby: false, guest: true, third: false },
        higherRoad: { solby: false, guest: false, third: true },
        vaultTest: true,
        guestIndex: guestIndex,
      },
    };
  }

  // Sealed before frame one. Same seed → same show.
  const SEAL = (function () {
    if (/^vault-[a-z0-9]{6}$/i.test(SEED)) {
      return makeVaultTestRun(SEED.toLowerCase()).seal;
    }
    if (SEED === "stage-001") {
      return STAGE_SEAL;
    }
    if (SEED === "wipe-001") {
      return {
        stomp: false,
        boxLoot: WIPE_BOX_LOOT,
        trap: { solby: false, guest: false, third: false },
        highRoad: { solby: false, guest: false, third: false },
        higherRoad: { solby: false, guest: false, third: false },
      };
    }
    if (SEED === "duo-001") {
      return {
        stomp: true,
        boxLoot: DUO_BOX_LOOT,
        trap: { solby: true, guest: true, third: false },
        highRoad: { solby: false, guest: true, third: false },
        higherRoad: { solby: false, guest: false, third: false },
      };
    }
    return {
      stomp: rng() < 0.62,
      boxLoot: Array.from({ length: 16 }, function () { return pickLoot(); }),
      trap: { solby: rng() < 0.7, guest: rng() < 0.45, third: rng() < 0.5 },
      highRoad: { solby: false, guest: rng() < 0.7, third: false },
      higherRoad: { solby: false, guest: false, third: true },
    };
  })();
  let activeSeal = SEAL;
  let testEndingTarget = null;

  const ISLE_HIT_W = 128;
  const ISLE_GAP = 108;
  const ISLE_DRAW_H = 50;
  const ISLE_ASPECT = 1040 / 553;
  const LONG_W = 580;
  const LONG_GAP = 100;
  function layLong(lane, y, x0, x1) {
    const out = [];
    let x = x0;
    while (x + 240 <= x1) {
      const ww = Math.min(LONG_W, x1 - x);
      out.push({ kind: "isle", art: "longIsle", lane: lane, x: x, y: y, w: ww, h: 32, long: true });
      x += LONG_W + LONG_GAP;
    }
    return out;
  }
  const STEP_SPAN = ISLE_HIT_W + 48;
  function makeStairRun(lane, x, ys) {
    const arts = ["isleA", "isleC", "isleD"];
    return ys.map(function (y, i) {
      return { kind: "isle", art: arts[i], lane: lane, x: x + STEP_SPAN * i, y: y, w: ISLE_HIT_W, h: 22, stair: true };
    });
  }
  const LOW_HIGH_STAIRS = [880, 2100, 3350, 5850, 7600];
  const HIGH_HIGHER_STAIRS = [2050, 4550, 6900, 8200];
  const HIGH_START = LOW_HIGH_STAIRS[0] + STEP_SPAN * 2 + ISLE_HIT_W + ISLE_GAP;
  const HIGHER_START = HIGH_HIGHER_STAIRS[0] + STEP_SPAN * 2 + ISLE_HIT_W + ISLE_GAP;
  const SOLIDS = [
    { kind: "mound", art: "floor", lane: "low", x: 0, y: LOW_Y, w: 2760, h: 36 },
    { kind: "mound", art: "floor", lane: "low", x: 2900, y: LOW_Y, w: 2400, h: 36 },
    { kind: "mound", art: "floor", lane: "low", x: 5440, y: LOW_Y, w: 1860, h: 36 },
    { kind: "mound", art: "floor", lane: "low", x: 7440, y: LOW_Y, w: 2410, h: 36 },
  ]
    .concat(LOW_HIGH_STAIRS.reduce(function (all, x) {
      return all.concat(makeStairRun("high", x, [STEP_Y, STEP2_Y, HIGH_Y]));
    }, []))
    .concat(HIGH_HIGHER_STAIRS.reduce(function (all, x) {
      return all.concat(makeStairRun("higher", x, [HI_STEP_Y, HI_STEP2_Y, HIGHER_Y]));
    }, []))
    .concat(layLong("high", HIGH_Y, HIGH_START, ROAD_END))
    .concat(layLong("higher", HIGHER_Y, HIGHER_START, ROAD_END));
  const PIT_X0 = 2760;
  const PIT_X1 = 2900;
  const CHEST = { x: 9740, y: LOW_Y - 70, w: 78, h: 64 };
  const FLOOR_LIP = 9850;
  const VAULT_PAD = { kind: "mound", art: "vaultFloor", lane: "low", vault: true, x: 0, y: LOW_Y, w: WORLD_W, h: 36 };

  const CAST_ORDER = ["embit", "puddli"];

  const assets = {};
  function loadImg(key, src) {
    const im = new Image();
    im.onload = function () { assets[key] = im; };
    im.src = src;
  }
  loadImg("sky", "assets/makko/sky.png");
  loadImg("isleA", "assets/makko/isle-a.png");
  loadImg("isleC", "assets/makko/isle-a.png");
  loadImg("isleD", "assets/makko/isle-a.png");
  loadImg("floor", "assets/makko/floor-body.png?v=7");
  loadImg("floorDirt", "assets/makko/floor-dirt.png?v=1");
  loadImg("moundA", "assets/makko/floor-body.png?v=7");
  loadImg("moundD", "assets/makko/floor-body.png?v=7");
  loadImg("moundTall", "assets/makko/floor-body.png?v=7");
  loadImg("idleSheet", "assets/makko/solby-plat-idle.webp?v=5");
  loadImg("runSheet", "assets/makko/solby-plat-run2.webp?v=4");
  loadImg("jumpSheet", "assets/makko/solby-plat-jump.webp?v=4");
  loadImg("embitIdle", "assets/makko/embit-plat-idle.webp?v=1");
  loadImg("embitRun", "assets/makko/embit-plat-run.webp?v=1");
  loadImg("embitJump", "assets/makko/embit-plat-jump.webp?v=3");
  loadImg("puddliIdle", "assets/makko/puddli-plat-idle.webp?v=1");
  loadImg("puddliRun", "assets/makko/puddli-plat-run.webp?v=1");
  loadImg("puddliJump", "assets/makko/puddli-plat-jump.webp?v=3");
  loadImg("solbyCelebrate", "assets/makko/solby-celebrate.webp?v=1");
  loadImg("embitCelebrate", "assets/makko/embit-celebrate.webp?v=1");
  loadImg("puddliCelebrate", "assets/makko/puddli-celebrate.webp?v=1");
  loadImg("coin", "assets/makko/coin.png");
  loadImg("chest", "assets/makko/chest.png");
  loadImg("chestOpen", "assets/makko/chest-open.png");
  loadImg("qbox", "assets/makko/qbox.png");
  loadImg("qboxUsed", "assets/makko/qbox-used.png");
  loadImg("bbox", "assets/makko/qbox-used.png");
  loadImg("longIsle", "assets/makko/long-isle.png?v=1");
  loadImg("walkerArt", "assets/makko/walker.png");
  loadImg("walkerWalk", "assets/makko/walker-plat-walk.webp?v=1");
  loadImg("crest", "assets/makko/crest.png");
  loadImg("hudPlate", "assets/makko/hud-plate.png");
  loadImg("partyPlate", "assets/makko/party-plate.png");
  loadImg("badgeAuto", "assets/makko/badge-autoplay.png");
  loadImg("badgeYou", "assets/makko/badge-youplay.png");
  loadImg("bannerPlate", "assets/makko/banner-plate.png");
  loadImg("bat", "assets/makko/bat.png");
  loadImg("batFly", "assets/makko/bat-plat-fly.webp?v=4");
  loadImg("crusher", "assets/makko/crusher.png");
  loadImg("portal", "assets/makko/portal.png?v=1");
  loadImg("vault", "assets/makko/vault.png?v=2");
  loadImg("vaultFloor", "assets/makko/vault-floor.png?v=4");
  loadImg("vaultFloorBody", "assets/makko/vault-floor-body.png?v=4");

  function drawSheetFrame(name, frame, x, y, w, h, flip, alpha) {
    const sh = SHEETS[name];
    const img = assets[sh.key];
    if (!img || !img.width) return false;
    const fw = sh.fw || (img.width / sh.cols);
    const fh = sh.fh || (img.height / sh.rows);
    const i = ((frame % sh.count) + sh.count) % sh.count;
    const sx = (sh.pad || 0) + (i % sh.cols) * (sh.stepX || fw);
    const sy = (sh.pad || 0) + Math.floor(i / sh.cols) * (sh.stepY || fh);
    ctx.save();
    ctx.globalAlpha *= alpha == null ? 1 : alpha;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "medium";
    ctx.translate(x + w / 2, y + h);
    ctx.scale(flip, 1);
    ctx.drawImage(img, sx, sy, fw, fh, -w / 2, -h, w, h);
    ctx.restore();
    return true;
  }

  function drawSheetBlend(name, phase, x, y, w, h, flip) {
    const sh = SHEETS[name];
    if (!sh) return false;
    const count = sh.count;
    const p = ((phase % count) + count) % count;
    if (sh.discrete || count <= 16) {
      return drawSheetFrame(name, Math.floor(p), x, y, w, h, flip, 1);
    }
    const f0 = Math.floor(p);
    const f1 = (f0 + 1) % count;
    const k = p - f0;
    const a = drawSheetFrame(name, f0, x, y, w, h, flip, 1 - k);
    drawSheetFrame(name, f1, x, y, w, h, flip, k);
    return a;
  }

        vy: 40 + stormRand() * 70,

        got: false,
        rain: true,
        bounce: 0,
        floorAge: 0,
      });
    }
  }

  function stepStormRain(dt) {
    const raining = scoopShow();
    if (!raining && !stormCoins.length) return;
    if (raining) {
      stormSpawnAcc += dt;
      while (stormSpawnAcc >= rainSpawn()) {
        stormSpawnAcc -= rainSpawn();
        spawnStormWave();
      }
    }
    const floorY = LOW_Y - 18;
    for (let i = stormCoins.length - 1; i >= 0; i--) {
      const c = stormCoins[i];
      if (c.got) {
        stormCoins.splice(i, 1);
        continue;
      }
      c.vy += GRAVITY * 0.5 * dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      if (show.phase === "vault" && c.y >= floorY - 92) {
        const live = party.filter(function (r) { return r.finished && r.alive; });
        if (live.length) {
          const target = live[vaultCaught % live.length];
          vaultCaught += 1;
          takeCoin(c, target);
          continue;
        }
      }
      if (c.y >= floorY) {
        c.y = floorY;
        if (c.bounce < 1) {
          c.vy *= -0.32;
          c.vx *= 0.68;
          c.bounce += 1;
        } else {
          c.vy = 0;
          c.vx *= 0.82;
          c.floorAge += dt;
          if (c.floorAge > 0.85) stormCoins.splice(i, 1);
        }
      }
    }
  }

  function stormHome(r) {
    const live = party.filter(function (p) { return p.finished && p.alive; });
    const slot = Math.max(0, live.indexOf(r));
    return CHEST.x - 300 + slot * 140;
  }

  function nearestRain(r) {
    const home = stormHome(r);
    const mid = r.x + RUNNER_W * 0.5;
    let best = null;
    let bestD = 1e9;
    for (let i = 0; i < stormCoins.length; i++) {
      const c = stormCoins[i];
      if (c.got) continue;
      const dx = Math.abs(c.x - mid);
      const homeBias = Math.abs(c.x - home) * 1.15;
      const below = c.y > r.y + 20 ? 90 : 0;
      const d = dx + homeBias + below;
      if (d < bestD) {
        bestD = d;
        best = c;
      }
    }
    return best;
  }

  function stormInput(r) {
    const out = { left: false, right: false, jump: false };
    if (!r.alive || r.caught) return out;
    const plazaL = CHEST.x - 360;
    const plazaR = show.phase === "vault" ? CHEST.x + 420 : CHEST.x + 140;
    const home = stormHome(r);
    const target = nearestRain(r);
    const nearHome = target && Math.abs(target.x - home) < 150;
    const aim = nearHome ? target.x : home;
    const mid = r.x + RUNNER_W * 0.5;
    if (aim > mid + 14) out.right = true;
    else if (aim < mid - 14) out.left = true;
    if (target && r.onGround) {
      const dx = Math.abs(target.x - mid);
      const rise = r.y - target.y;
      if (dx < 78 && rise > 24 && rise < 150) out.jump = true;
    }
    if (r.x < plazaL + 8) { out.left = false; out.right = true; }
    if (r.x > plazaR - 8) { out.right = false; out.left = true; }
    return out;
  }

  function playableShow() {
    return show.phase === "run" || show.phase === "storm" || show.phase === "gate";
  }

  function scoopShow() {
    return show.phase === "storm" || show.phase === "vault";
  }

  function plazaShow() {
    return show.phase === "storm" || show.phase === "gate" || show.phase === "transition" ||
      show.phase === "vault" || show.phase === "cards" || reliquaryShow();
  }

  function reliquaryShow() {
    return didVault && (
      show.phase === "vault" || show.phase === "cards" || show.phase === "tally" ||
      (show.phase === "transition" && show.age >= TRANSITION_SWAP)
    );
  }

  function vaultQualifies() {
    return scoreRun().arrived >= 3 && potTotal() > VAULT_MIN;
  }

  function rarityFor(n) {
    let pick = RARITY[0];
    for (let i = 0; i < RARITY.length; i++) {
      if (n >= RARITY[i].at) pick = RARITY[i];
    }
    return pick;
  }

  function portalX() {
    return FLOOR_LIP + 58;
  }

  function beginGate() {
    didVault = true;
    portals = [];
    confetti = [];
    const live = party.filter(function (p) { return p.finished && p.alive; });
    portals.push({
      x: portalX(),
      y: LOW_Y + 18,
      w: 110,
      h: 220,
      slot: 0,
      burst: false,
      pulse: 0,
    });
    for (let i = 0; i < live.length; i++) {
      const r = live[i];
      r.hidden = false;
      r.zapping = false;
      r.zapAge = 0;
      r.celebrating = true;
      r.vx = 0;
      r.vy = 0;
      r.onGround = true;
      r.facing = 1;
    }
    if (!seenBeat.vault) {
      flashBeat("THE VAULT", "Past the chest. Off the lip. Into the rainbow.");
      seenBeat.vault = true;
    }
  }

  function gatePortal() {
    return portals[0];
  }

  function gateTurn(r) {
    const live = party.filter(function (p) { return p.finished && p.alive; });
    const slot = Math.max(0, live.indexOf(r));
    return GATE_HOLD + slot * GATE_STAGGER;
  }

  function gateInput(r) {
    const out = { left: false, right: false, jump: false };
    if (!r.alive || r.caught || r.zapping || r.hidden) return out;
    if (show.age < gateTurn(r)) {
      r.celebrating = true;
      return out;
    }
    r.celebrating = false;
    const p = gatePortal();
    if (!p) return out;
    const mid = r.x + RUNNER_W * 0.5;
    if (mid < FLOOR_LIP - 12) out.right = true;
    if (r.onGround && mid > FLOOR_LIP - 78) out.jump = true;
    if (!r.onGround && p.x > mid) out.right = true;
    return out;
  }

  function portalConfetti(p, count) {
    if (!p) return;
    const cx = p.x;
    const cy = p.y - p.h * 0.55;
    const total = count || 12;
    for (let i = 0; i < total; i++) {
      const a = (i / total) * Math.PI * 2;
      const spd = 90 + (i % 5) * 28;
      confetti.push({
        x: cx,
        y: cy,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd - 80,
        age: 0,
        life: 0.7 + (i % 4) * 0.08,
        art: i % 3 === 0 ? "crest" : "coin",
        s: i % 3 === 0 ? 18 : 14,
      });
    }
  }

  function burstPortal(p) {
    if (!p || p.burst) return;
    p.burst = true;
    portalConfetti(p, 24);
  }

  function tryZap(r) {
    if (!r.alive || r.caught || r.zapping || r.hidden) return;
    if (r.onGround || r.x + RUNNER_W * 0.5 < FLOOR_LIP + 4) return;
    const p = gatePortal();
    if (!p || p.burst) return;
    const cx = r.x + RUNNER_W * 0.5;
    const cy = r.y + RUNNER_H * 0.5;
    const portalCy = p.y - p.h * 0.5 + 8;
    const centered = Math.abs(cx - p.x) <= p.w * 0.16 &&
      Math.abs(cy - portalCy) <= p.h * 0.3;
    if (centered) {
      r.zapping = true;
      r.zapAge = 0;
      r.x = p.x - RUNNER_W * 0.5;
      r.y = portalCy - RUNNER_H * 0.5;
      r.vx = 0;
      r.vy = 0;
      r.onGround = false;
    }
  }

  function stepZaps(dt) {
    for (let i = 0; i < party.length; i++) {
      const r = party[i];
      if (!r.zapping) continue;
      r.zapAge += dt;
      if (r.zapAge > ZAP_LIFE) {
        r.hidden = true;
        r.zapping = false;
        portalConfetti(gatePortal(), 14);
      }
    }
  }

  function stepConfetti(dt) {
    for (let i = confetti.length - 1; i >= 0; i--) {
      const p = confetti[i];
      p.age += dt;
      p.vy += GRAVITY * 0.35 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.age > p.life) confetti.splice(i, 1);
    }
  }

  function gateReady() {
    const live = party.filter(function (p) { return p.finished && p.alive; });
    if (!live.length) return false;
    return live.every(function (p) { return p.hidden; });
  }

  function beginVault() {
    endingCameraLock = null;
    stormRand = mulberry32(xmur3(runSeed + ":vault")());
    stormCoins = [];
    vaultCaught = 0;
    stormSpawnAcc = 0;
    const live = party.filter(function (p) { return p.finished && p.alive; });
    for (let i = 0; i < live.length; i++) {
      const r = live[i];
      r.hidden = false;
      r.zapping = false;
      r.zapAge = 0;
      r.celebrating = true;
      r.x = stormHome(r);
      r.y = LOW_Y - RUNNER_H;
      r.vx = 0;
      r.vy = 0;
      r.onGround = true;
    }
    for (let i = 0; i < 36; i++) {
      stormCoins.push({
        x: CHEST.x - 340 + (i % 12) * 58 + (stormRand() - 0.5) * 16,
        y: LOW_Y - 28 - Math.floor(i / 12) * 22,
        vx: 0,
        vy: 0,
        r: 14,
        got: false,
        rain: false,
        bounce: 1,
        floorAge: 0,
      });
    }
    spawnStormWave();
    spawnStormWave();
    spawnStormWave();
    if (!seenBeat.cards) {
      flashBeat("THE RELIQUARY", "THE SKY SPENDS ITSELF. CELEBRATE WHILE THE CARDS WAKE.");
    }
  }

  function cardTransferLayout() {
    const w = 220;
    const h = 312;
    return {
      sourceX: W * 0.26,
      sourceY: H * 0.5,
      cardX: W * 0.7 - w / 2,
      cardY: H * 0.5 - h / 2 + 28,
      w: w,
      h: h,
    };
  }

  function beginCards() {
    const total = potTotal();
    const tiers = RARITY.filter(function (rank) { return rank.at <= total; });
    const first = tiers[0] || RARITY[0];
    const layout = cardTransferLayout();
    cardShow = {
      fill: 0,
      rarity: first.name,
      hex: first.hex,
      flies: [],
      age: 0,
      total: total,
      tiers: tiers.length ? tiers : [RARITY[0]],
    };
    stormCoins = [];
    const count = Math.min(72, 30 + cardShow.tiers.length * 7);
    for (let i = 0; i < count; i++) {
      const row = i % 9;
      const band = Math.floor(i / 9);
      cardShow.flies.push({
        x: layout.sourceX + (row - 4) * 7,
        y: layout.sourceY + ((band % 3) - 1) * 10,
        tx: layout.cardX + layout.w * (0.3 + ((i * 7) % 11) / 27),
        ty: layout.cardY + layout.h * (0.22 + ((i * 5) % 17) / 27),
        age: -i * 0.04,
        life: 0.68 + (i % 5) * 0.045,
      });
    }
    if (!seenBeat.cards) {
      flashBeat("THE CARD", "THE FINAL COIN HAUL FILLS ONE CARD. WATCH THE RARITY CLIMB.");
      seenBeat.cards = true;
    }
  }

  function stepCards(dt) {
    if (show.phase !== "cards") return;
    cardShow.age += dt;
    let landed = 0;
    for (let i = 0; i < cardShow.flies.length; i++) {
      const f = cardShow.flies[i];
      f.age += dt;
      if (f.age > f.life) landed += 1;
    }
    const target = Math.min(1, landed / Math.max(1, cardShow.flies.length));
    cardShow.fill += (target - cardShow.fill) * Math.min(1, dt * 5);
    if (cardShow.age > 4.25) cardShow.fill = 1;
    const tiers = cardShow.tiers || [RARITY[0]];
    const tierIndex = Math.min(tiers.length - 1, Math.floor(cardShow.fill * tiers.length));
    const rank = tiers[tierIndex];
    cardShow.rarity = rank.name;
    cardShow.hex = rank.hex;
  }

  function spawnChestLoot(value) {
    chestLoot = [];
    const n = Math.max(6, Math.min(18, 4 + Math.round(value / 2)));
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI - Math.PI;
      chestLoot.push({
        x: CHEST.x + CHEST.w / 2,
        y: CHEST.y + 10,
        vx: Math.cos(a) * (70 + (i % 5) * 18),
        vy: -220 - (i % 4) * 30,
        age: 0,
      });
    }
  }

  function floorRemain(r) {
    const feet = { x: r.x + 10, y: r.y + RUNNER_H + 2, w: RUNNER_W - 20, h: 10 };
    const solids = solidsFor(r);
    for (let i = 0; i < solids.length; i++) {
      if (aabb(feet, solids[i])) return solids[i].x + solids[i].w - (r.x + RUNNER_W);
    }
    return -1;
  }

  function nextSolid(r) {
    const right = r.x + RUNNER_W;
    const solids = solidsFor(r);
    const lane = runnerLane(r);
    let best = null;
    for (let i = 0; i < solids.length; i++) {
      const s = solids[i];
      if (s.x < right - 4) continue;
      if (s.kind === "isle" && !r.highRoad && !r.higherRoad) continue;
      if (s.kind === "isle" && lane !== "low" && s.lane !== lane) continue;
      if (s.kind === "isle" && lane === "high" && Math.abs(s.y - HIGH_Y) > 10) continue;
      if (s.kind === "isle" && lane === "higher" && Math.abs(s.y - HIGHER_Y) > 10) continue;
      if (s.kind === "mound" && lane !== "low") continue;
      if (!best || s.x < best.x) best = s;
    }
    return best;
  }

  function nextIsle(r) {
    const want = mountLane(r);
    if (!want) return null;
    const feet = r.y + RUNNER_H;
    const solids = solidsFor(r);
    let best = null;
    for (let i = 0; i < solids.length; i++) {
      const s = solids[i];
      if (s.kind !== "isle") continue;
      if (want && s.lane !== want) continue;
      if (s.y > feet + 8 || feet - s.y > 145) continue;
      if (s.x + s.w < r.x - 8) continue;
      if (!best || s.x < best.x) best = s;
    }
    return best;
  }

  function nextUpIsle(r) {
    const feet = r.y + RUNNER_H;
    const wantHigher = r.higherRoad && feet > HIGHER_Y + 24;
    const wantHigh = r.highRoad && !wantHigher && feet > HIGH_Y + 24;
    if (!wantHigher && !wantHigh) return null;
    const solids = solidsFor(r);
    let best = null;
    for (let i = 0; i < solids.length; i++) {
      const s = solids[i];
      if (s.kind !== "isle") continue;
      if (s.y >= feet - 8) continue;
      if (feet - s.y > 136) continue;
      if (wantHigh && s.y < HIGH_Y - 8) continue;
      if (wantHigher && s.y >= HIGH_Y - 8) continue;
      if (s.x + s.w < r.x - 8) continue;
      if (s.x > r.x + RUNNER_W + 90) continue;
      if (!best || s.x < best.x) best = s;
    }
    return best;
  }

  function solidUnder(r) {
    const feet = { x: r.x + 10, y: r.y + RUNNER_H + 2, w: RUNNER_W - 20, h: 8 };
    const solids = solidsFor(r);
    for (let i = 0; i < solids.length; i++) {
      if (aabb(feet, solids[i])) return solids[i];
    }
    return null;
  }

  function sameLane(r, w) {
    const feet = r.y + RUNNER_H;
    const floor = w.floor != null ? w.floor : (w.lane === "higher" ? HIGHER_Y : w.lane === "high" ? HIGH_Y : LOW_Y);
    return Math.abs(feet - floor) < 70;
  }

  function crusherY(c) {
    return c.y;
  }

  function stepCrushers(dt) {
    for (let i = 0; i < crushers.length; i++) {
      const c = crushers[i];
      if (c.state === "idle") {
        let inZone = false;
        for (let n = 0; n < party.length; n++) {
          const r = party[n];
          if (!r.alive || r.caught || r.finished) continue;
          if (runnerLane(r) !== (c.lane || "low")) continue;
          const mid = r.x + RUNNER_W * 0.5;
          if (mid > c.x - 96 && mid < c.x + c.w) {
            inZone = true;
            if (!c.held) {
              c.state = "falling";
              c.held = true;
              break;
            }
          }
        }
        if (!inZone) c.held = false;
      }
      if (c.state === "falling") {
        c.vy += GRAVITY * dt;
        c.y += c.vy * dt;
        if (c.y + c.h >= c.floor) {
          c.y = c.floor - c.h;
          c.vy = 0;
          c.state = "rest";
          c.rest = 0.5;
        }
      } else if (c.state === "rest") {
        c.rest -= dt;
        if (c.rest <= 0) c.state = "rising";
      } else if (c.state === "rising") {
        c.vy = 0;
        c.y -= 110 * dt;
        if (c.y <= c.top) {
          c.y = c.top;
          c.state = "idle";
        }
      }
    }
  }

  function nearestCrusher(r) {
    let best = null;
    let bestD = 1e9;
    for (let i = 0; i < crushers.length; i++) {
      const c = crushers[i];
      if ((c.lane || "low") !== runnerLane(r)) continue;
      const d = c.x - (r.x + RUNNER_W);
      if (d > -20 && d < bestD) { best = c; bestD = d; }
    }
    return best;
  }

  function nearestWalker(r) {
    let best = null;
    let bestD = 1e9;
    for (let i = 0; i < walkers.length; i++) {
      const w = walkers[i];
      if (!w.alive) continue;
      if (!sameLane(r, w)) continue;
      const d = w.x - (r.x + RUNNER_W);
      if (d > -20 && d < bestD) { best = w; bestD = d; }
    }
    return best;
  }

  function nextBox(r) {
    let best = null;
    const lane = runnerLane(r);
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      if (b.used) continue;
      if (b.lane !== lane) continue;
      if (b.unlock === "third") {
        if (party.indexOf(r) !== 1) continue;
      }
      if (b.x + b.w < r.x - 8) continue;
      if (!best || b.x < best.x) best = b;
    }
    return best;
  }

  function driverInput(r) {
    if (show.phase === "storm" || show.phase === "vault") return stormInput(r);
    if (show.phase === "gate") return gateInput(r);
    const out = { left: false, right: true, jump: false };
    if (!r.alive || r.caught || r.finished) { out.right = false; return out; }

    if (r.x > DROP_X - 80 && runnerLane(r) !== "low") {
      out.jump = false;
      return out;
    }

    const box = nextBox(r);
    if (box && r.onGround && r.x + RUNNER_W > box.x - 10 && r.x < box.x + 8) {
      out.jump = true;
      return out;
    }

    const crush = nearestCrusher(r);
    if (crush) {
      const dist = crush.x - (r.x + RUNNER_W);
      const bottom = crusherY(crush) + crush.h;
      const headY = r.y + 6;
      if (dist > -36 && dist < 130) {
        if (crush.state === "falling" || crush.state === "rest") {
          out.right = false;
          out.jump = false;
          if (dist < 20) out.left = true;
          return out;
        }
        if (crush.state === "rising" && bottom > headY) {
          out.right = false;
          out.jump = false;
          return out;
        }
      }
    }

    const en = nearestWalker(r);
    if (en) {
      const dist = en.x - (r.x + RUNNER_W);
      if (dist > 16 && dist < 88) {
        if (activeSeal.stomp && r.onGround) out.jump = true;
        return out;
      }
    }

    for (let i = 0; i < bats.length; i++) {
      const b = bats[i];
      if ((b.lane || "low") !== runnerLane(r)) continue;
      const dist = b.x - (r.x + RUNNER_W);
      const overhead = b.y + b.h < r.y + 10;
      if (overhead && dist > -40 && dist < 100) {
        out.jump = false;
        continue;
      }
      if (dist > -20 && dist < 90 && Math.abs((r.y + 20) - b.y) < 70 && r.onGround) {
        out.jump = true;
        return out;
      }
    }

    const isle = nextIsle(r);
    const canMount = r.highRoad || r.higherRoad;
    if (isle && canMount && r.onGround && r.y + RUNNER_H > isle.y + 10) {
      const nose = r.x + RUNNER_W;
      if (nose > isle.x - 40 && nose < isle.x + 4) {
        out.jump = true;
        return out;
      }
    }

    const up = nextUpIsle(r);
    if (up && canMount && r.onGround && r.x + RUNNER_W > up.x + 10 && r.x < up.x + up.w - 36) {
      out.jump = true;
      return out;
    }

    const remain = floorRemain(r);
    const nxt = nextSolid(r);
    const gap = nxt ? nxt.x - (r.x + RUNNER_W) : 0;
    const onIsle = r.onGround && r.y + RUNNER_H < LOW_Y - 40;
    if (nxt && gap > 42) {
      const isleHop = onIsle && nxt.kind === "isle";
      const lip = isleHop ? 28 : 32;
      if (isleHop && canMount) {
        out.jump = r.onGround && remain >= 0 && remain < lip;
      } else if (!isleHop && r.trapClear) {
        out.jump = r.onGround && remain >= 0 && remain < lip;
      }
    }
    return out;
  }

  function readInput(r) {
    if (show.phase === "storm" || show.phase === "vault") {
      if (mode === "keyboard" && r === party[0]) {
        return { left: keys.left || hold.left, right: keys.right || hold.right, jump: keys.jump || hold.jump };
      }
      return stormInput(r);
    }
    if (show.phase === "gate") {
      if (mode === "keyboard" && r === party[0]) {
        return { left: keys.left || hold.left, right: keys.right || hold.right, jump: keys.jump || hold.jump };
      }
      return gateInput(r);
    }
    if (mode === "driver") return driverInput(r);
    if (r !== party[0]) return driverInput(r);
    return { left: keys.left || hold.left, right: keys.right || hold.right, jump: keys.jump || hold.jump };
  }

  function poseFrom(r) {
    if (r.recovery > 0) return "recovery";
    if (!r.onGround && r.vy < -40) return "jump-up";
    if (!r.onGround) return "jump-down";
    if (Math.abs(r.vx) > 18) return "run";
    return "idle";
  }

  function isStomp(r, enemy, prevY, wasAir) {
    if (!wasAir && !r.justLanded) return false;
    const prevFeet = prevY + RUNNER_H;
    return prevFeet <= enemy.y + enemy.h + 20;
  }

  function overlapX(r, s, pad) {
    const inset = pad || 0;
    return r.x + inset < s.x + s.w && r.x + RUNNER_W - inset > s.x;
  }

  function moveAxis(r, dt, axis, solids) {
    if (axis === "x") {
      r.x += r.vx * dt;
      const box = { x: r.x, y: r.y, w: RUNNER_W, h: RUNNER_H };
      for (let i = 0; i < solids.length; i++) {
        const s = solids[i];
        if (s.kind === "isle") continue;
        if (!aabb(box, s)) continue;
        if (r.vx > 0) r.x = s.x - RUNNER_W;
        else if (r.vx < 0) r.x = s.x + s.w;
        r.vx = 0;
        box.x = r.x;
      }
      return false;
    }

    const prevY = r.y;
    r.y += r.vy * dt;
    let hitGround = false;
    if (r.vy >= 0) {
      const prevFeet = prevY + RUNNER_H;
      const feet = r.y + RUNNER_H;
      let bestY = null;
      for (let i = 0; i < solids.length; i++) {
        const s = solids[i];
        if (!overlapX(r, s, 8)) continue;
        if (prevFeet <= s.y + 8 && feet >= s.y) {
          if (bestY == null || s.y < bestY) bestY = s.y;
        }
      }
      if (bestY != null) {
        r.y = bestY - RUNNER_H;
        r.vy = 0;
        hitGround = true;
      }
    } else {
      const box = { x: r.x, y: r.y, w: RUNNER_W, h: RUNNER_H };
      for (let i = 0; i < solids.length; i++) {
        const s = solids[i];
        if (s.kind === "isle") continue;
        if (!aabb(box, s)) continue;
        r.y = s.y + s.h;
        r.vy = 0;
        box.y = r.y;
      }
    }
    return hitGround;
  }

  function resolveIsleMount(r) {
    if (r.vy <= 40) return false;
    const feet = r.y + RUNNER_H;
    for (let i = 0; i < SOLIDS.length; i++) {
      const s = SOLIDS[i];
      if (s.kind !== "isle") continue;
      if (!overlapX(r, s, 8)) continue;
      if (feet >= s.y - 6 && feet <= s.y + 18) {
        r.y = s.y - RUNNER_H;
        r.vy = 0;
        return true;
      }
    }
    return false;
  }

  function spawnDust(r) {
    for (let i = 0; i < 7; i++) {
      puffs.push({
        x: r.x + RUNNER_W * 0.45 + (i - 3) * 5,
        y: r.y + RUNNER_H,
        vx: (i - 3) * 18,
        vy: -40 - (i % 3) * 12,
        life: 0.28,
        age: 0,
      });
    }
  }

  function cutPurse(r) {
    if (!r || r.coinCut) return;
    r.coinCut = true;
    const before = r.coins;
    r.coins = Math.floor(before / 2);
    syncCoinCount();
    if (before > 0) toast(before + "→" + r.coins, r.x, r.y - 36);
  }

  function catchRunner(r, why) {
    if (!r.alive || r.ghost) return;
    r.alive = false;
    r.caught = true;
    r.dying = true;
    r.deathAge = 0;
    r.ghost = false;
    r.vx = 0;
    r.vy = -260;
    r.pose = "idle";
    r.squash = 0.7;
    cutPurse(r);
    toast(why || "CAUGHT", r.x, r.y - 20);
    for (let i = 0; i < 10; i++) {
      puffs.push({
        x: r.x + RUNNER_W * 0.5 + (i - 4.5) * 6,
        y: r.y + RUNNER_H * 0.45,
        vx: (i - 4.5) * 22,
        vy: -90 - (i % 4) * 20,
        life: 0.55,
        age: 0,
        tint: i % 2 ? "rgba(210,230,255," : "rgba(255,255,255,",
      });
    }
    punchBeat(0.32);
  }

  function livingLead() {
    const live = living().filter(function (r) { return !r.finished; });
    if (live.length) {
      live.sort(function (a, b) { return b.x - a.x; });
      return live[0];
    }
    const any = living();
    if (any.length) return any[0];
    for (let i = 0; i < party.length; i++) {
      if (party[i].finished) return party[i];
    }
    return null;
  }

  function ghostSlot(r) {
    let n = 0;
    for (let i = 0; i < party.length; i++) {
      if (party[i] === r) break;
      if (party[i].ghost || party[i].dying) n += 1;
    }
    return n;
  }

  function stepDeath(r, dt) {
    r.deathAge += dt;
    r.jumpAge += dt;
    r.squash += (1 - r.squash) * Math.min(1, dt * 5);
    if (r.deathAge < 0.18) return;
    r.y += r.vy * dt;
    r.vy += GRAVITY * 0.18 * dt;
    if (r.deathAge >= 0.78) {
      r.dying = false;
      r.ghost = true;
      r.ghostAge = 0;
      r.vy = 0;
      toast("GHOST", r.x, r.y - 18);
    }
  }

  function stepGhost(r, dt) {
    r.ghostAge += dt;
    r.idlePhase += dt * 18;
    const slot = ghostSlot(r);
    const lead = livingLead();
    let tx = r.x;
    let ty = r.y;
    if (lead && lead !== r) {
      const back = (lead.facing >= 0 ? -1 : 1) * (54 + slot * 40);
      tx = lead.x + back;
      ty = lead.y - 48 + Math.sin(simTime * 2.8 + slot * 1.7) * 10;
      r.facing = lead.facing;
    } else if (show.phase !== "run") {
      tx = CHEST.x - 80 - slot * 42;
      ty = CHEST.y - 56 + Math.sin(simTime * 2.4 + slot) * 8;
    } else {
      ty = r.y + Math.sin(simTime * 2.5 + slot) * 5;
    }
    const kx = 1 - Math.exp(-3.6 * dt);
    const ky = 1 - Math.exp(-3.1 * dt);
    r.x += (tx - r.x) * kx;
    r.y += (ty - r.y) * ky;
  }

  function stepSpirits(dt) {
    for (let i = 0; i < party.length; i++) {
      const r = party[i];
      if (r.dying) stepDeath(r, dt);
      else if (r.ghost) stepGhost(r, dt);
    }
  }

  function popBox(box, r) {
    if (box.unlock === "third" && party.indexOf(r) !== 1) {
      r.vy = 80;
      return;
    }
    box.used = true;
    box.bounce = 1;
    r.vy = 120;
    interact += 1;
    const loot = box.loot;
    pops.push({
      kind: loot,
      x: box.x + 8,
      y: box.y,
      vy: -220,
      age: 0,
      owner: r,
      unlock: box.unlock,
    });
    if (loot === "empty") toast("EMPTY", box.x, box.y - 24);
    if (loot === "enemy") toast("UH-OH", box.x, box.y - 24);
    if (loot === "powerup") toast("SUN CREST", box.x, box.y - 24);
    if (loot === "character") toast("A FRIEND", box.x, box.y - 24);
  }

  function settlePop(p) {
    if (p.kind === "character") {
      const third = p.unlock === "third";
      if (third) {
        if (!party.some(function (g) { return g.name === "puddli"; })) addGuest("puddli", p.x, true);
        else toast("…", p.x, p.y);
      } else if (party.length === 1) {
        const name = nextGuestName();
        if (name) addGuest(name, p.x, false);
        else toast("…", p.x, p.y);
      } else {
        toast("…", p.x, p.y);
      }
    } else if (p.kind === "powerup") {
      p.owner.power = true;
    } else if (p.kind === "enemy") {
      walkers.push(makeWalker(p.x, p.x - 80, p.x + 160, 1, p.owner.y + RUNNER_H));
    }
  }

  function stepPhysics(r, input, dt, t) {
    r.justLanded = false;
    if (input.jump) r.jumpBuf = JUMP_BUFFER;
    else r.jumpBuf -= dt;

    const want = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (want !== 0) r.facing = want;
    const accel = ACCEL * (r.onGround ? 1 : AIR_CONTROL);
    r.vx += want * accel * dt;
    if (want === 0) {
      const fr = (r.onGround ? FRICTION : FRICTION * 0.15) * dt;
      if (Math.abs(r.vx) <= fr) r.vx = 0;
      else r.vx -= Math.sign(r.vx) * fr;
    }
    if (r.vx > MAX_RUN) r.vx = MAX_RUN;
    if (r.vx < -MAX_RUN) r.vx = -MAX_RUN;

    r.vy += GRAVITY * dt;

    if (r.onGround) r.coyote = COYOTE;
    else r.coyote -= dt;

    const jumpPressed = r.jumpBuf > 0 && !r.jumpHeld;
    if (jumpPressed && r.coyote > 0) {
      r.vy = show.phase === "gate" ? -650 : (r.power ? JUMP_POWER : JUMP_V);
      r.onGround = false;
      r.coyote = 0;
      r.jumpBuf = 0;
      r.jumpAge = 0;
      r.squash = 1.12;
      interact += 1;
      spawnDust(r);
    }
    r.jumpHeld = input.jump;

    const wasAir = !r.onGround;
    const prevY = r.y;
    const solids = solidsFor(r);
    moveAxis(r, dt, "x", solids);
    const mounted = resolveIsleMount(r);
    const landed = moveAxis(r, dt, "y", solids) || mounted || resolveIsleMount(r);
    if (landed && !r.onGround) {
      r.justLanded = true;
      r.recovery = RECOVERY;
      r.squash = 0.88;
      spawnDust(r);
      const under = solidUnder(r);
      if (under && under.kind === "isle") {
        if (under.lane === "higher" && !r.tookHigher) {
          r.tookHigher = true;
          r.tookHigh = true;
          toast("HIGHER ROAD", r.x, r.y - 22);
          punchBeat(0.28);
        } else if (under.lane === "high" && !r.tookHigh) {
          r.tookHigh = true;
          toast("HIGH ROAD", r.x, r.y - 22);
          punchBeat(0.28);
        }
      }
    }
    r.onGround = landed;
    if (r.recovery > 0) r.recovery -= dt;
    if (!r.onGround) r.jumpAge += dt;
    if (r.onGround && Math.abs(r.vx) > 18) r.runPhase += dt * 24;
    else if (r.onGround) r.idlePhase += dt * 24;
    r.pose = poseFrom(r);
    r.squash += (1 - r.squash) * Math.min(1, dt * 7);

    if (r.x < 8) { r.x = 8; if (r.vx < 0) r.vx = 0; }
    if (r.x > WORLD_W - RUNNER_W - 8) { r.x = WORLD_W - RUNNER_W - 8; if (r.vx > 0) r.vx = 0; }

    if (!r.alive) return;

    if (show.phase === "run") {
      const body = runnerBody(r);
      const head = { x: r.x + 8, y: r.y, w: RUNNER_W - 16, h: 14 };

      for (let i = 0; i < boxes.length; i++) {
        const b = boxes[i];
        if (b.used) continue;
        if (r.vy < -40 && aabb(head, b)) popBox(b, r);
      }

      for (let i = 0; i < crushers.length; i++) {
        const c = crushers[i];
        if (c.state === "idle") continue;
        if (aabb(body, { x: c.x - 6, y: crusherY(c) - 6, w: c.w + 12, h: c.h + 12 })) catchRunner(r, "CRUSHED");
      }

      for (let i = 0; i < walkers.length; i++) {
        const w = walkers[i];
        if (!w.alive) continue;
        if (!aabb(body, w)) continue;
        if (isStomp(r, w, prevY, wasAir)) {
          w.alive = false;
          r.vy = -420;
          r.onGround = false;
          r.jumpAge = 0;
          toast("STOMP", w.x, w.y - 18);
          punchBeat(0.4);
        } else {
          catchRunner(r, "GOT HIT");
        }
      }

      for (let i = 0; i < bats.length; i++) {
        const b = bats[i];
        const hit = { x: b.x, y: b.y, w: b.w, h: b.h };
        if (!aabb(body, hit)) continue;
        if (isStomp(r, hit, prevY, wasAir)) {
          r.vy = -400;
          r.onGround = false;
          r.jumpAge = 0;
          b.x = b.minX;
          toast("STOMP", b.x, b.y - 18);
          punchBeat(0.3);
        } else {
          catchRunner(r, "GOT HIT");
        }
      }

      if (r.y > PIT_Y) catchRunner(r, "DIDN'T CLEAR");
      const finishSlot = r.name === "solby" ? 0 : r.name === "embit" ? 1 : 2;
      const finishLine = CHEST.x - 260 + finishSlot * 88;
      if (r.alive && !r.finished && r.onGround && runnerLane(r) === "low" && r.x + RUNNER_W > finishLine) {
        r.finished = true;
        r.vx = 0;
        toast("MADE IT", r.x, r.y - 28);
        punchBeat(0.4);
      }
    }
    if (r.finished && show.phase === "run") {
      r.vx = 0;
      if (r.onGround) r.pose = "idle";
    }
    if (show.phase === "gate") tryZap(r);

    collectCoins(r);
  }

  function focusRunner() {
    const live = living().filter(function (r) { return !r.finished; });
    if (live.length) {
      live.sort(function (a, b) { return b.x - a.x; });
      return live[0];
    }
    const any = living();
    return any[0] || party[0];
  }

  function castRect(r) {
    const vis = CAST_DRAW[r.name] || CAST_DRAW.solby;
    const dw = vis.w;
    const dh = vis.h;
    return {
      x: r.x + RUNNER_W / 2 - dw / 2,
      y: r.y + RUNNER_H - dh + (vis.foot || 0),
      w: dw,
      h: dh,
    };
  }

  function liveOnCam() {
    return party.filter(function (r) { return r.alive; });
  }

  function frameCamY(r) {
    const frame = partyFrame();
    return frame.y;
  }

  function partyFrame() {
    const live = liveOnCam();
    const z = VIEW_Z;
    const vw = W / z;
    const pin = LOW_Y - (H / z) * 0.88;
    if (!live.length) {
      return { x: camX, y: pin, z: z };
    }
    let x0 = Infinity, x1 = -Infinity;
    for (let i = 0; i < live.length; i++) {
      const b = castRect(live[i]);
      x0 = Math.min(x0, b.x);
      x1 = Math.max(x1, b.x + b.w);
    }
    x0 -= 88;
    x1 += 88;
    let tx = (x0 + x1) / 2 - vw / 2;
    if (tx < 0) tx = 0;
    const lim = Math.max(0, WORLD_W - vw);
    if (tx > lim) tx = lim;
    return { x: tx, y: pin, z: z };
  }

  function stepCamera(r, dt) {
    const lockPhase = show.phase === "fly" || show.phase === "open" ||
      show.phase === "gate" || show.phase === "storm" ||
      (show.phase === "transition" && show.age < TRANSITION_SWAP) ||
      (show.phase === "tally" && !didVault);
    if (endingCameraLock && lockPhase) {
      camX = endingCameraLock.x;
      camY = endingCameraLock.y;
      viewZ = endingCameraLock.z;
      return;
    }
    const vaultFrame = reliquaryShow();
    const targetZ = vaultFrame ? 0.92 : VIEW_Z;
    const zoomK = 1 - Math.exp(-3.2 * dt);
    viewZ += (targetZ - viewZ) * zoomK;
    const frame = partyFrame();
    const k = 1 - Math.exp((show.phase === "run" ? -5.4 : -2.8) * dt);
    if (plazaShow()) {
      const vw = W / viewZ;
      const vh = H / viewZ;
      if (show.phase === "gate" || (show.phase === "transition" && show.age < TRANSITION_SWAP)) {
        frame.x = CHEST.x - vw * 0.62;
        frame.y = LOW_Y - vh * 0.88;
      } else {
        frame.x = CHEST.x + 40 - vw * 0.48;
        frame.y = LOW_Y - vh * 0.78;
      }
      if (frame.x < 0) frame.x = 0;
    } else if (show.phase !== "run") {
      const vw = W / VIEW_Z;
      frame.x = CHEST.x - vw * 0.42;
      if (frame.x < 0) frame.x = 0;
    }
    camX += (frame.x - camX) * k;
    camY += (frame.y - camY) * k;
    if (camX < 0) camX = 0;
    if (camX > camLimit()) camX = camLimit();
  }

  function updateBanners(r, dt) {
    banner.age += dt || FIXED;
    if (!r || show.phase !== "run") return;
    if (!seenBeat.coins && r.x > 70) {
      flashBeat("1  THE COINS", "At least three. Extra coins raise the chest.");
      seenBeat.coins = true;
    }
    if (!seenBeat.boxes && r.x > 480) {
      flashBeat("2  THE BOXES", "A friend is best. A crest is next. Empty or trouble hurts.");
      seenBeat.boxes = true;
    }
    if (!seenBeat.high && r.x > 760) {
      flashBeat("LEVEL 2  THE HIGH ROAD", "The second character's path. One road each.");
      seenBeat.high = true;
    }
    if (!seenBeat.higher && r.x > 960) {
      flashBeat("LEVEL 3  THE HIGHER ROAD", "Only the second can open the box that lets the third in.");
      seenBeat.higher = true;
    }
    if (!seenBeat.pit && r.x > 2580) {
      flashBeat("WHO MAKES IT", "Friends who reach the chest multiply every coin.");
      seenBeat.pit = true;
    }
  }

  function tuneTestEndingCoins() {
    if (testEndingTarget === "3") {
      const arrived = party.filter(function (r) { return r.finished; });
      for (let i = 0; i < arrived.length; i++) {
        arrived[i].coins = Math.min(arrived[i].coins, 6);
      }
      syncCoinCount();
    } else if (testEndingTarget === "vault" && potTotal() <= VAULT_MIN) {
      const lead = party.find(function (r) { return r.finished; });
      if (lead) {
        lead.coins += VAULT_MIN + 1 - potTotal();
        syncCoinCount();
      }
    }
  }

  function stepShow(dt) {
    if (show.phase === "run") {
      if (partyResolved()) {
        tuneTestEndingCoins();
        if (scoreRun().arrived >= 3) {
          endingCameraLock = { x: camX, y: camY, z: viewZ };
        }
        show.phase = "fly";
        show.age = 0;
        beatHold = 0;
        if (!seenBeat.chest) {
          const sc = scoreRun();
          flashBeat(
            "THE CHEST",
            sc.arrived ? "What they brought is what it pays." : "Nobody made it. It still opens."
          );
          seenBeat.chest = true;
        }
      }
      return;
    }
    show.age += dt;
    const target = endingCameraLock ? endingCameraLock.x : CHEST.x - viewW() * 0.42;
    if (show.phase === "fly" && ((Math.abs(camX - target) < 22 && show.age > 0.55) || show.age > 2.2)) {
      show.phase = "open";
      show.age = 0;
      spawnChestLoot(scoreRun().value);
    }
    if (show.phase === "open") {
      chestLid = Math.min(1, show.age / 0.55);
      if (show.age > 2.65) {
        if (vaultQualifies()) {
          show.phase = "gate";
          show.age = 0;
          beginGate();
        } else if (scoreRun().arrived >= 3) {
          show.phase = "storm";
          show.age = 0;
          beginStorm();
        } else {
          show.phase = "tally";
          show.age = 0;
          beginTally();
        }
      }
    }
    if (show.phase === "gate" && (gateReady() || show.age > GATE_LIFE)) {
      const live = party.filter(function (p) { return p.finished && p.alive; });
      burstPortal(gatePortal());
      for (let i = 0; i < live.length; i++) {
        live[i].hidden = true;
        live[i].zapping = false;
      }
      show.phase = "transition";
      show.age = 0;
    }
    if (show.phase === "transition" && show.age > TRANSITION_LIFE) {
      show.phase = "vault";
      show.age = 0;
      beginVault();
    }
    if (show.phase === "storm" && show.age > STORM_LIFE) {
      show.phase = "tally";
      show.age = 0;
      beginTally();
    }
    if (show.phase === "vault" && show.age > VAULT_LIFE) {
      show.phase = "tally";
      show.age = 0;
      beginTally();
    }
    if (show.phase === "tally" && show.age > TALLY_LIFE) {
      show.phase = "cards";
      show.age = 0;
      beginCards();
    }
  }

  function beginTally() {
    const live = party.filter(function (p) { return p.finished && p.alive; });
    for (let i = 0; i < live.length; i++) {
      const r = live[i];
      r.hidden = false;
      r.zapping = false;
      r.celebrating = true;
      r.x = stormHome(r);
      r.y = LOW_Y - RUNNER_H;
      r.vx = 0;
      r.vy = 0;
      r.onGround = true;
      r.facing = i === 1 ? -1 : 1;
    }
  }

  function stepWorld(dt) {
    for (let i = 0; i < walkers.length; i++) {
      const w = walkers[i];
      if (!w.alive) continue;
      w.x += w.vx * dt;
      w.phase = (w.phase || 0) + dt * 8;
      if (w.x < w.minX) { w.x = w.minX; w.vx = Math.abs(w.vx); }
      if (w.x > w.maxX) { w.x = w.maxX; w.vx = -Math.abs(w.vx); }
      let onPad = false;
      const mid = w.x + w.w * 0.5;
      for (let n = 0; n < SOLIDS.length; n++) {
        const s = SOLIDS[n];
        if (Math.abs(s.y - w.floor) > 6) continue;
        if (mid >= s.x && mid <= s.x + s.w) { onPad = true; break; }
      }
      if (!onPad) {
        w.x -= w.vx * dt;
        w.vx *= -1;
      }
    }
    for (let i = 0; i < bats.length; i++) {
      const b = bats[i];
      b.x += b.vx * dt;
      b.phase = (b.phase || 0) + dt * 10;
      b.y = b.y0 + Math.sin(b.phase) * 14;
      if (b.x < b.minX) { b.x = b.minX; b.vx = Math.abs(b.vx); }
      if (b.x > b.maxX) { b.x = b.maxX; b.vx = -Math.abs(b.vx); }
    }
    stepCrushers(dt);
    for (let i = 0; i < boxes.length; i++) {
      if (boxes[i].bounce > 0) boxes[i].bounce = Math.max(0, boxes[i].bounce - dt * 4);
    }
    for (let i = pops.length - 1; i >= 0; i--) {
      const p = pops[i];
      p.age += dt;
      p.y += p.vy * dt;
      p.vy += GRAVITY * 0.35 * dt;
      if (p.age > 0.55) {
        settlePop(p);
        pops.splice(i, 1);
        punchBeat(0.62);
      }
    }
    for (let i = toasts.length - 1; i >= 0; i--) {
      toasts[i].age += dt;
      if (toasts[i].age > toasts[i].life) toasts.splice(i, 1);
    }
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i];
      p.age += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.age > p.life) puffs.splice(i, 1);
    }
    for (let i = coinFlies.length - 1; i >= 0; i--) {
      coinFlies[i].age += dt;
      if (coinFlies[i].age > coinFlies[i].life) coinFlies.splice(i, 1);
    }
    for (let i = chestLoot.length - 1; i >= 0; i--) {
      const p = chestLoot[i];
      p.age += dt;
      p.vy += GRAVITY * 0.55 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.y > CHEST.y + 36) {
        p.y = CHEST.y + 36;
        p.vy *= -0.35;
        p.vx *= 0.7;
      }
      if (p.age > 2.4) chestLoot.splice(i, 1);
    }
    if (coinPulse > 0) coinPulse = Math.max(0, coinPulse - dt * 3.2);
  }

  function step(dt) {
    if (paused) return;
    if (beatHold > 0 && show.phase === "run") {
      beatHold -= dt;
      stepSpirits(dt);
      stepWorld(dt);
      updateBanners(focusRunner(), dt);
      stepShow(dt);
      stepCamera(focusRunner(), dt);
      simTime += dt;
      return;
    }
    if (playableShow()) {
      for (let i = 0; i < party.length; i++) {
        const r = party[i];
        if (!r.alive || r.hidden || r.zapping) continue;
        stepPhysics(r, readInput(r), dt, simTime);
      }
    }
    if (show.phase === "gate") stepZaps(dt);
    stepConfetti(dt);
    stepCards(dt);
    stepSpirits(dt);
    runner = party[0];
    stepWorld(dt);
    stepStormRain(dt);
    updateBanners(focusRunner(), dt);
    stepShow(dt);
    stepCamera(focusRunner(), dt);
    simTime += dt;
  }

  function drawSky() {
    const vaulted = reliquaryShow() && assets.vault;
    const img = vaulted ? assets.vault : assets.sky;
    if (!img) return;
    const cut = vaulted ? 0 : Math.round(img.height * 0.24);
    const srcH = img.height - cut;
    const scale = Math.max(W / img.width, H / srcH);
    const dw = img.width * scale;
    const dh = srcH * scale;
    const maxPan = Math.max(0, dw - W);
    const pan = maxPan * (camX / Math.max(1, WORLD_W - viewW()));
    ctx.drawImage(img, 0, cut, img.width, srcH, -pan, H - dh, dw, dh);
  }

  function drawPortal(p) {
    if (p.burst) return;
    const summon = Math.max(0, Math.min(1, (show.age - 0.12) / PORTAL_SUMMON));
    const ease = summon * summon * (3 - 2 * summon);
    const pulse = 1 + Math.sin(simTime * 9 + p.slot) * 0.07;
    const h = p.h * pulse;
    const w = p.w * (0.92 + pulse * 0.08);
    const key = assets.portal ? "portal" : "crest";
    ctx.save();
    ctx.globalAlpha = ease;
    ctx.translate(p.x, p.y - h * 0.5 + 8);
    ctx.scale(0.18 + ease * 0.82, 0.06 + ease * 0.94);
    drawAsset(key, -w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function drawRainbowTransition() {
    if (show.phase !== "transition") return;
    const t = Math.max(0, Math.min(1, show.age / TRANSITION_LIFE));
    const half = t < 0.5 ? t / 0.5 : (1 - t) / 0.5;
    const cover = half * half * (3 - 2 * half);
    const edge = W + 90 - (W + 180) * cover;
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, "#ff5fa2");
    grad.addColorStop(0.2, "#ff9f45");
    grad.addColorStop(0.4, "#ffe66d");
    grad.addColorStop(0.6, "#57e389");
    grad.addColorStop(0.8, "#55c7ff");
    grad.addColorStop(1, "#a978ff");
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(W + 120, -20);
    for (let y = -20; y <= H + 20; y += 24) {
      const wave = Math.sin(y * 0.035 + show.age * 8) * 34;
      ctx.lineTo(edge + wave, y);
    }
    ctx.lineTo(W + 120, H + 20);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = "#ffffff";
    for (let y = -H; y < H * 2; y += 90) {
      ctx.save();
      ctx.translate(W / 2, y + show.age * 260);
      ctx.rotate(-0.18);
      ctx.fillRect(-W, -10, W * 2, 20);
      ctx.restore();
    }
    ctx.restore();

    const rainAlpha = Math.sin(Math.PI * t);
    ctx.save();
    ctx.globalAlpha = Math.max(0, rainAlpha);
    for (let i = 0; i < 34; i++) {
      const x = (i * 103 + (i % 4) * 31) % (W + 40) - 20;
      const y = (show.age * (210 + (i % 5) * 24) + i * 67) % (H + 100) - 50;
      const s = 17 + (i % 4) * 3;
      drawAsset(i % 7 === 0 ? "crest" : "coin", x - s / 2, y - s / 2, s, s);
    }
    const flash = Math.max(0, 1 - Math.abs(t - 0.5) / 0.09);
    if (flash > 0) {
      ctx.globalAlpha = flash * 0.82;
      ctx.fillStyle = "#fff8dc";
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  function drawConfettiBit(p) {
    const u = Math.min(1, p.age / p.life);
    ctx.save();
    ctx.globalAlpha = 1 - u * u;
    drawAsset(p.art, p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    ctx.restore();
  }

  function drawQBox(b) {
    const hop = b.bounce * 10;
    const key = (assets.bbox || assets.qboxUsed) ? (assets.bbox ? "bbox" : "qboxUsed") : "qbox";
    drawAsset(key, b.x - 4, b.y - hop - 4, b.w + 8, b.h + 8);

  function drawWalker(w) {
    if (!w.alive) return;
    const flip = w.vx < 0 ? -1 : 1;
    const dw = 52;
    const dh = 34;
    const drew = drawSheetBlend("walkerWalk", w.phase || 0, w.x + w.w / 2 - dw / 2, w.y + w.h - dh + 4, dw, dh, flip);
    if (!drew) drawAsset("walkerArt", w.x - 6, w.y - 10, dw, dh, flip);

  function drawBat(b) {

    const drew = drawSheetBlend("batFly", b.phase || 0, b.x + b.w / 2 - dw / 2, b.y + b.h - dh + 4, dw, dh, flip);

  function drawPop(p) {
    if (p.kind === "powerup") {
      drawAsset("crest", p.x, p.y, 36, 36);
    } else if (p.kind === "character") {

  function jumpPhase(r, count) {
    const n = count || 96;
    const upT = r.power ? (-JUMP_POWER / GRAVITY) : JUMP_UP_T;
    const air = Math.max(0.5, upT * 2);
    const u = Math.max(0, Math.min(0.999, r.jumpAge / air));
    return u * (n - 1);
  }

  function drawCast(r) {
    if (r.hidden) return;
    const vis = CAST_DRAW[r.name] || CAST_DRAW.solby;
    const flip = r.facing >= 0 ? 1 : -1;
    const ghost = r.ghost;
    const dying = r.dying;
    let sq = 1 + (r.squash - 1) * 0.18;
    let zapScale = 1;
    let rise = 0;
    let ang = 0;
    let alpha = 1;
    if (dying) {
      const t = r.deathAge;
      if (t < 0.16) {
        sq = 0.7 + t * 1.1;
      } else {
        const u = Math.min(1, (t - 0.16) / 0.62);
        rise = -u * 52;
        ang = (flip > 0 ? -1 : 1) * u * 0.7;
        alpha = 1 - u * 0.65;
        sq = 0.94;
      }
    }
    if (ghost) {
      alpha = 0.52 + Math.sin(simTime * 3.1 + r.ghostAge) * 0.08;
      rise = -8 + Math.sin(simTime * 2.7 + r.ghostAge) * 7;
      sq = 0.92;
    }
    if (r.zapping) {
      const u = Math.min(1, r.zapAge / ZAP_LIFE);
      const ease = u * u * (3 - 2 * u);
      alpha *= 1 - ease;
      zapScale = 1 - ease * 0.82;
    }
    const celebrating = r.alive && r.finished && (
      r.celebrating || show.phase === "fly" || show.phase === "open" ||
      show.phase === "vault" || show.phase === "cards" || show.phase === "tally"
    );
    const running = !celebrating && !r.caught && r.onGround && Math.abs(r.vx) > 18;
    const map = vis.sheets || { idle: "idle", run: "run", jump: "jump" };
    const hasCelebrate = celebrating && map.celebrate && SHEETS[map.celebrate];
    let pose = "idle";
    if (celebrating) {
      pose = "idle";
      if (!hasCelebrate) {
        sq *= 1 + Math.sin(simTime * 8 + r.idlePhase) * 0.07;
        rise += Math.abs(Math.sin(simTime * 8 + r.idlePhase)) * -8;
      }
    } else if (!ghost && !dying && !r.onGround) pose = "jump";
    else if (!ghost && !dying && Math.abs(r.vx) > 18) pose = "run";
    const sheet = hasCelebrate
      ? map.celebrate
      : (map[pose] || map.idle);
    const sh = SHEETS[sheet] || SHEETS.idle;
    let phase = r.idlePhase * ((sh.fps || 24) / 24);
    if (celebrating && sheet === map.celebrate) phase = simTime * (sh.fps || 8);
    else if (pose === "jump") phase = jumpPhase(r, sh.count);
    else if (pose === "run") phase = r.runPhase * ((sh.fps || 24) / 24);
    const pad = pose === "run" ? (vis.runPad || 0) : 0;
    const wide = pose === "run" ? (vis.runWide || 1) : (pose === "idle" ? (vis.idleWide || 1) : 1);
    const baseH = hasCelebrate ? vis.h * 1.34 : vis.h * (2 - sq);
    const baseW = hasCelebrate ? baseH * (sh.fw / sh.fh) : vis.w * sq * wide;
    const drawH = baseH * zapScale;
    const drawW = baseW * zapScale;
    const bob = running ? Math.sin(r.runPhase * 0.55) * 1.6 : 0;
    const dx = r.x + RUNNER_W / 2 - drawW / 2;
    const dy = r.zapping
      ? r.y + RUNNER_H / 2 - drawH / 2
      : r.y + RUNNER_H - drawH + vis.foot + pad * drawH + bob + rise;
    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    if (ang) {
      ctx.translate(dx + drawW / 2, dy + drawH);
      ctx.rotate(ang);
      ctx.translate(-(dx + drawW / 2), -(dy + drawH));
    }
    let drew = drawSheetBlend(sheet, phase, dx, dy, drawW, drawH, flip);
    if (!drew && r.name === "solby") {
      drew = drawSprite(spriteForPose(r.pose), dx, dy, drawW, drawH, flip, 1, 0);
    } else if (!drew) {
      const tilt = running ? Math.sin(r.runPhase * 0.7) * 0.08 : 0;
      drew = drawSprite(assets[r.name], dx, dy, drawW, drawH, flip, 1, tilt, vis.src);
    }
    ctx.restore();
  }

  function drawCoin(c) {
    if (c.got) return;
    const bob = c.rain ? 0 : Math.sin(simTime * 5 + c.x * 0.02) * 4;
    drawAsset("coin", c.x - 11, c.y + bob - 11, 22, 22);
  }

  function drawChest() {
    if (reliquaryShow()) return;
    const c = CHEST;
    const key = chestLid > 0.35 && assets.chestOpen ? "chestOpen" : "chest";
    drawAsset(key, c.x - 8, c.y - 10, c.w + 16, c.h + 18);
    chestLoot.forEach(function (p) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - p.age / 2.4);
      drawAsset("coin", p.x - 8, p.y - 8, 16, 16);
      ctx.restore();
    });
  }

  function showOver() {
    const done = party.every(function (r) { return r.finished || r.caught || !r.alive; });
    if (!done || !party.length) return false;
    return party.some(function (r) { return r.finished; }) ? "clear" : "caught";
  }

  function drawTiledStrip(img, x0, x1, destY, destH) {
    const tileW = Math.max(1, Math.round(destH * (img.width / img.height)));
    ctx.save();
    ctx.beginPath();
    ctx.rect(x0, destY - 1, Math.max(0, x1 - x0), destH + 2);
    ctx.clip();
    let x = Math.floor(x0);
    while (x < x1) {
      ctx.drawImage(img, x, destY, tileW + 1, destH);
      x += tileW;
    }
    ctx.restore();
  }

  function drawFarHills() {}

  function drawDirtUnder(x0, x1, y0, vault) {
    const bottom = Math.max(camY + viewH() + 200, LOW_Y + 2400);
    if (bottom <= y0) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x0, y0, Math.max(0, x1 - x0), bottom - y0);
    ctx.clip();
    ctx.fillStyle = vault ? "#b8925a" : "#995f43";
    ctx.fillRect(x0, y0, Math.max(0, x1 - x0), bottom - y0);
    const body = vault
      ? (assets.vaultFloorBody || assets.vaultFloor || assets.floorDirt)
      : assets.floorDirt;
    if (body && body.width) {
      const band = vault ? 96 : 120;
      if (vault) {
        drawTiledStrip(body, x0, x1, y0 - 4, band);
        ctx.restore();
        return;
      }
      let y = y0 - 4;
      while (y < bottom) {
        drawTiledStrip(body, x0, x1, y, band);
        y += band - 1;
      }
    }
    ctx.restore();
  }

  function drawPlat(s) {
    if (s.long) {
      const tile = (assets.longIsle && assets.longIsle.width) ? assets.longIsle : assets.floor;
      if (!tile || !tile.width) return;
      const destH = 78;
      const destY = s.y - destH * 0.18;
      drawTiledStrip(tile, s.x, s.x + s.w, destY, destH);
      return;
    }
    const img = assets[s.art] || (s.vault ? assets.vaultFloor : null);
    if (!img || !img.width) return;
    if (s.kind === "mound") {
      const destH = s.vault ? 82 : 44;
      const destY = s.y - (s.vault ? 14 : 10);
      drawTiledStrip(img, s.x, s.x + s.w, destY, destH);
      drawDirtUnder(s.x, s.x + s.w, destY + destH - 8, !!s.vault);
      return;
    }
    const destH = ISLE_DRAW_H;
    const destW = destH * ISLE_ASPECT;
    const destX = s.x + s.w / 2 - destW / 2;
    const destY = s.y - destH * 0.38;
    ctx.drawImage(img, destX, destY, destW, destH);
  }

  function spriteForPose(pose) {
    if (pose === "jump-up" && assets.solbyUp) return assets.solbyUp;
    if (pose === "jump-down" && assets.solbyDown) return assets.solbyDown;
    if (pose === "run" && assets.solbyRun) return assets.solbyRun;
    if ((pose === "idle" || pose === "recovery") && assets.solbyIdle) return assets.solbyIdle;
    return assets.solby;
  }

  function drawSprite(img, x, y, w, h, flip, squash, tilt, src) {
    if (!img) return false;
    ctx.save();
    ctx.translate(x + w / 2, y + h);
    ctx.rotate(tilt || 0);
    ctx.scale(flip, squash == null ? 1 : squash);
    if (src) ctx.drawImage(img, src.x, src.y, src.w, src.h, -w / 2, -h, w, h);
    else ctx.drawImage(img, -w / 2, -h, w, h);
    ctx.restore();
    return true;
  }

  function uiFont(size, weight) {
    return (weight || "bold") + " " + size + "px ui-sans-serif, system-ui, sans-serif";
  }

  function measureUi(str, size, weight) {
    ctx.font = uiFont(size, weight);
    return ctx.measureText(str).width;
  }

  function fitUiSize(str, maxW, size, min, weight) {
    min = min || 11;
    while (size > min && measureUi(str, size, weight) > maxW) size -= 1;
    return size;
  }

  function strokeFit(str, x, y, maxW, size, color, align, min, weight, outline) {
    str = String(str).toUpperCase();
    const s = fitUiSize(str, maxW, size, min, weight);
    ctx.font = uiFont(s, weight || "800");
    ctx.textAlign = align || "left";
    ctx.lineJoin = "round";
    ctx.miterLimit = 2;
    if (outline) {
      ctx.lineWidth = Math.max(6, Math.round(s * 0.36));
      ctx.strokeStyle = "#fff0a6";
      ctx.strokeText(str, x, y);
      ctx.lineWidth = Math.max(3, Math.round(s * 0.2));
      ctx.strokeStyle = outline;
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
    return s;
  }

  function fillFit(str, x, y, maxW, size, color, align, min, weight) {
    return strokeFit(str, x, y, maxW, size, color, align, min, weight, "#1a1208");
  }

  function drawPartyHud() {
    const n = party.length;
    if (!n) return;
    const outerX = 12;
    const outerY = 10;
    const outerW = 196;
    const framePadX = 22;
    const framePadY = 18;
    const pw = outerW - framePadX * 2;
    const ph = 42;
    const gap = 4;
    const x = outerX + framePadX;
    const y = outerY + framePadY;
    const stackH = n * ph + (n - 1) * gap;
    drawAsset(
      assets.partyPlate ? "partyPlate" : "hudPlate",
      outerX, outerY, outerW, stackH + framePadY * 2
    );
    for (let i = 0; i < n; i++) {
      const r = party[i];
      const py = y + i * (ph + gap);
      drawAsset("hudPlate", x, py, pw, ph);
      const dead = r.ghost || r.dying || r.caught;
      const nameColor = dead ? "#d8d0c5" : "#ffffff";
      strokeFit(r.name.toUpperCase(), x + 14, py + 28, pw - 58, 12, nameColor, "left", 9, "800", "#2a1608");
      strokeFit(String(r.coins), x + pw - 14, py + 28, 36, 13, "#ffffff", "right", 10, "900", "#2a1608");
    }
    ctx.textAlign = "left";
  }

  function drawCoinHud() {
    if (show.phase === "tally" || show.phase === "cards") return;
    const label = String(coinCount);
    const sz = fitUiSize(label, 72, 20, 13);
    const tw = measureUi(label, sz);
    const cw = Math.max(112, 62 + tw);
    const x = W / 2 - cw / 2;
    const y = 8;
    drawAsset("hudPlate", x, y, cw, 44);

    const cs = 20 * coinS;
    drawAsset("coin", x + 16, y + 12 - (cs - 20) / 2, cs, cs);
    strokeFit(label, x + 44, y + 30, cw - 58, sz, "#ffffff", "left", 13, "900", "#2a1608");
    ctx.textAlign = "left";
  }

  function drawStormHud() {
    if (show.phase !== "storm" && show.phase !== "vault" && show.phase !== "gate") return;
    const w = 380;
    const h = 90;
    const x = W / 2 - w / 2;
    const y = 56;
    drawAsset("bannerPlate", x, y, w, h);
    const title = show.phase === "gate" ? "THE PORTAL" : show.phase === "vault" ? "THE RELIQUARY" : "THE STORM";
    const sub = show.phase === "gate" ? "JUMP INTO THE RAINBOW" : (show.phase === "vault" ? vaultCaught : stormCaught) + " SCOOPED";
    strokeFit(title, W / 2, y + 36, w - 64, 18, "#fff6e4", "center", 13, "800", "#2a1608");
    strokeFit(sub, W / 2, y + 64, w - 64, 15, "#ffe08a", "center", 12, "800", "#2a1608");
